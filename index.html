<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROPRIO V130 - FORMA KOREK</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f2f2f2}
.h{background:#111;color:#fff;padding:12px;text-align:center;font-weight:bold}
.card{background:#fff;padding:10px;margin:6px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sec{display:none}.sec.active{display:block}
.tabs{display:flex;background:#fff;position:sticky;top:0;z-index:30;overflow-x:auto}
.tabs button{padding:9px 10px;border:none;background:#eee;margin:2px;border-radius:6px;font-size:10px;font-weight:bold;flex-shrink:0}
.tabs button.active{background:#111;color:#fff}
input,select{width:100%;padding:10px;margin:3px 0;border:2px solid #111;border-radius:7px}
.btn{width:100%;padding:11px;background:#111;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #111;padding:5px;text-align:center}th{background:#111;color:#fff}
.inp{width:100%;padding:10px;text-align:center;border:2px solid #111;border-radius:8px;font-weight:bold}
.mAuto{background:#FFF9C4!important;color:#111}
</style></head><body>
<div class="h">PROPRIO V130 - TIRAGE FORMA KOREK</div>

<div id="login" class="card" style="max-width:360px;margin:20px auto">
<input id="u" value="admin"><input id="p" type="password" value="admin">
<button class="btn" onclick="login()">ANTRE</button>
</div>

<div id="app" style="display:none">
<div class="tabs">
<button onclick="go(1)" id="b1" class="active">1.Tirage</button>
<button onclick="go(2)" id="b2">2.Limite</button>
<button onclick="go(3)" id="b3">3.Fermeture</button>
<button onclick="go(4)" id="b4">4.Prix</button>
<button onclick="go(5)" id="b5">5.Vendeurs</button>
<button onclick="go(6)" id="b6">6.Rapport</button>
<button onclick="go(7)" id="b7">7.Entête</button>
</div>

<div id="sec1" class="sec active"><div class="card">
<label>Date......</label><input type="date" id="dateTiraj">
<label>Tiraj (....)</label><select id="selTiraj"><option>GA midi</option><option>FL midi</option><option>NY midi</option><option>GA soir</option><option>FL soir</option><option>NY soir</option></select>

<div style="display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:10px;text-align:center;font-weight:bold;font-size:10px">
<div>1e</div><div>2e</div><div>3e</div><div>M1</div><div>M2</div><div>M3</div><div>L3</div><div>L4</div><div>L5</div>
</div>
<div style="display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:3px">
<input class="inp" id="p1" maxlength="2" placeholder=".." oninput="autoM()"><input class="inp" id="p2" maxlength="2" placeholder=".." oninput="autoM()"><input class="inp" id="p3" maxlength="2" placeholder=".." oninput="autoM()">
<input class="inp mAuto" id="m1" readonly placeholder="auto"><input class="inp mAuto" id="m2" readonly placeholder="auto"><input class="inp mAuto" id="m3" readonly placeholder="auto">
<input class="inp" id="l3" maxlength="3" placeholder="L3"><input class="inp" id="l4" maxlength="4" placeholder="L4"><input class="inp" id="l5" maxlength="5" placeholder="L5">
</div>
<button class="btn" onclick="saveTirage()">SOVE TIRAJ SA</button>

<div style="margin-top:14px"><b>Tablo:</b>
<table id="tabAll"><tr><th>Date</th><th>Tiraj</th><th>1e</th><th>2e</th><th>3e</th><th>M1</th><th>M2</th><th>M3</th><th>L3</th><th>L4</th><th>L5</th></tr></table>
</div>
</div></div>

<div id="sec2" class="sec"><div class="card"><h3>Limite Global</h3><select id="limTiraj"><option value="global">Global - Tout Tiraj</option><option>GA midi</option><option>FL midi</option><option>NY midi</option><option>GA soir</option><option>FL soir</option><option>NY soir</option></select><input id="limBolet" placeholder="Bolet 1500"><input id="limMaryaj" placeholder="Maryaj 100"><input id="limLoto3" placeholder="Loto3 100"><input id="limLoto4" placeholder="Loto4 20"><input id="limLoto5" placeholder="Loto5 5"><button class="btn" onclick="saveLimite()">Sove</button></div></div>
<div id="sec3" class="sec"><div class="card"><h3>Fermeture</h3><div id="fermList"></div><button class="btn" onclick="saveFerm()">Sove</button></div></div>
<div id="sec4" class="sec"><div class="card"><h3>Prix</h3><input id="prB1" placeholder="Bolet 1er 50"><input id="prB2" placeholder="2e 20"><input id="prB3" placeholder="3e 10"><input id="prMaryaj" placeholder="Maryaj 1000"><input id="prLoto3" placeholder="Loto3 500"><input id="prLoto4" placeholder="Loto4 5000"><input id="prLoto5" placeholder="Loto5 25000"><button class="btn" onclick="savePrix()">Sove</button></div></div>
<div id="sec5" class="sec"><div class="card"><h3>Vendeurs</h3><input id="nomV" placeholder="Non"><input id="passV" placeholder="Modpas"><input id="percV" type="number" value="10"><select id="etatV"><option value="ouvert">Ouvert</option><option value="ferme">Fermé</option></select><button class="btn" onclick="saveVendeur()">Ajoute</button><div id="listV"></div></div></div>
<div id="sec6" class="sec"><div class="card"><label>Du....</label><input type="date" id="du"><label>Au....</label><input type="date" id="au"><select id="fVendeur"><option value="tous">Tous Vendeurs</option></select><select id="fTiraj"><option value="tous">Tous Tiraj</option><option>GA midi</option><option>FL midi</option><option>NY midi</option><option>GA soir</option><option>FL soir</option><option>NY soir</option></select><button class="btn" onclick="genRap()">Rapport</button><div id="zoneRap"></div></div></div>
<div id="sec7" class="sec"><div class="card"><h3>Entête</h3><input id="entNom" value="C&D VÉRITÉ LOTTO"><input id="entTel" placeholder="Telefòn"><button class="btn" onclick="saveEntete()">Sove</button></div></div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyA...",authDomain:"cd-lotto.firebaseapp.com",projectId:"cd-lotto"};
let db=null;try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();}catch(e){}
let TIRAJ=["GA midi","FL midi","NY midi","GA soir","FL soir","NY soir"];
function login(){let u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value.trim().toLowerCase();if(u=="admin"&&p=="admin"){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();}}
function go(n){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById('sec'+n).classList.add('active');document.getElementById('b'+n).classList.add('active');}
function init(){let t=new Date().toISOString().slice(0,10);document.getElementById('dateTiraj').value=t;document.getElementById('du').value=t;document.getElementById('au').value=t;loadCfg();loadVendeurs();loadTab();}
function autoM(){let a=document.getElementById('p1').value.trim(),b=document.getElementById('p2').value.trim(),c=document.getElementById('p3').value.trim();if(a.length==2&&b.length==2){document.getElementById('m1').value=a+b;}else{document.getElementById('m1').value="";}if(a.length==2&&c.length==2){document.getElementById('m2').value=a+c;}else{document.getElementById('m2').value="";}if(b.length==2&&c.length==2){document.getElementById('m3').value=b+c;}else{document.getElementById('m3').value="";}}
function saveTirage(){
 let d=document.getElementById('dateTiraj').value,tr=document.getElementById('selTiraj').value;
 let p1=document.getElementById('p1').value.trim(),p2=document.getElementById('p2').value.trim(),p3=document.getElementById('p3').value.trim();
 let m1=document.getElementById('m1').value.trim(),m2=document.getElementById('m2').value.trim(),m3=document.getElementById('m3').value.trim();
 let l3=document.getElementById('l3').value.trim(),l4=document.getElementById('l4').value.trim(),l5=document.getElementById('l5').value.trim();
 if(!d||p1.length!=2||p2.length!=2||p3.length!=2){alert("Mete Date ak 1e 2e 3e (2 chif chak)");return;}
 let data={p1,p2,p3,m1,m2,m3,maryaj:[m1,m2,m3].filter(x=>x),l3,l4,l5};
 if(db) db.collection("resultats").doc(d).set({[tr]:data},{merge:true}).then(()=>{alert(tr+" "+d+" sove");loadTab();});
}
function loadTab(){
 let d=document.getElementById('dateTiraj').value;
 if(!db)return;
 db.collection("resultats").doc(d).onSnapshot(doc=>{
  let base=document.getElementById('tabAll');base.innerHTML='<tr><th>Date</th><th>Tiraj</th><th>1e</th><th>2e</th><th>3e</th><th>M1</th><th>M2</th><th>M3</th><th>L3</th><th>L4</th><th>L5</th></tr>';
  if(doc.exists){let data=doc.data();TIRAJ.forEach(tr=>{if(data[tr]){let r=data[tr];base.innerHTML+=`<tr><td>${d}</td><td>${tr}</td><td>${r.p1}</td><td>${r.p2}</td><td>${r.p3}</td><td>${r.m1||''}</td><td>${r.m2||''}</td><td>${r.m3||''}</td><td>${r.l3||''}</td><td>${r.l4||''}</td><td>${r.l5||''}</td><td><button onclick="loadToForm('${tr}')">Edit</button></td></tr>`;}});}
 });
 db.collection("resultats").get().then(snap=>{let html='<tr><th>Date</th><th>Tiraj</th><th>1e</th><th>2e</th><th>3e</th><th>M1</th><th>M2</th><th>M3</th><th>L3</th><th>L4</th><th>L5</th></tr>';snap.forEach(doc=>{let date=doc.id;let data=doc.data();TIRAJ.forEach(tr=>{if(data[tr]){let r=data[tr];html+=`<tr><td>${date}</td><td>${tr}</td><td>${r.p1}</td><td>${r.p2}</td><td>${r.p3}</td><td>${r.m1||''}</td><td>${r.m2||''}</td><td>${r.m3||''}</td><td>${r.l3||''}</td><td>${r.l4||''}</td><td>${r.l5||''}</td></tr>`;}});});document.getElementById('tabAll').innerHTML=html;});
}
function loadToForm(tr){
 let d=document.getElementById('dateTiraj').value;
 if(!db)return;
 db.collection("resultats").doc(d).get().then(doc=>{if(doc.exists&&doc.data()[tr]){let r=doc.data()[tr];document.getElementById('selTiraj').value=tr;document.getElementById('p1').value=r.p1;document.getElementById('p2').value=r.p2;document.getElementById('p3').value=r.p3;document.getElementById('l3').value=r.l3||"";document.getElementById('l4').value=r.l4||"";document.getElementById('l5').value=r.l5||"";autoM();}});
}
function loadCfg(){if(!db)return;db.collection("config").doc("settings").onSnapshot(doc=>{if(doc.exists){let cfg=doc.data();let f=cfg.fermeture||{"GA midi":"12:15","FL midi":"13:15","NY midi":"14:15","GA soir":"18:15","FL soir":"21:15","NY soir":"21:30"};let html="";TIRAJ.forEach(tr=>{html+=`${tr} <input type="time" id="f_${tr}" value="${f[tr]||'12:00'}"><br>`;});document.getElementById('fermList').innerHTML=html;}});db.collection("vendeurs").onSnapshot(q=>{let html="",sel='<option value="tous">Tous</option>';q.forEach(d=>{let v=d.data();html+=`<div>${v.nom} ${v.perc}% ${v.etat} <button onclick="delV('${v.nom}')">X</button></div>`;sel+=`<option value="${v.nom}">${v.nom}</option>`;});document.getElementById('listV').innerHTML=html;document.getElementById('fVendeur').innerHTML=sel;});}
function saveLimite(){let t=document.getElementById('limTiraj').value,l={bolet:document.getElementById('limBolet').value,maryaj:document.getElementById('limMaryaj').value,loto3:document.getElementById('limLoto3').value,loto4:document.getElementById('limLoto4').value,loto5:document.getElementById('limLoto5').value};if(db)db.collection("config").doc("settings").set({limite:{[t]:l}},{merge:true}).then(()=>alert("Limite sove"));}
function saveFerm(){let f={};TIRAJ.forEach(tr=>{let el=document.getElementById('f_'+tr);if(el)f[tr]=el.value;});if(db)db.collection("config").doc("settings").set({fermeture:f},{merge:true}).then(()=>alert("Fermeture sove"));}
function savePrix(){let p={bolet:[document.getElementById('prB1').value,document.getElementById('prB2').value,document.getElementById('prB3').value],maryaj:document.getElementById('prMaryaj').value,loto3:document.getElementById('prLoto3').value,loto4:document.getElementById('prLoto4').value,loto5:document.getElementById('prLoto5').value};if(db)db.collection("config").doc("settings").set({prix:p},{merge:true}).then(()=>alert("Prix sove"));}
function saveVendeur(){let nom=document.getElementById('nomV').value.trim(),pass=document.getElementById('passV').value.trim(),perc=document.getElementById('percV').value,etat=document.getElementById('etatV').value;if(!nom||!pass)return;if(db)db.collection("vendeurs").doc(nom).set({nom,pass,modpas:pass,perc,etat}).then(()=>{document.getElementById('nomV').value="";document.getElementById('passV').value="";});}
function delV(n){if(db)db.collection("vendeurs").doc(n).delete();}
function saveEntete(){let e={nom:document.getElementById('entNom').value,tel:document.getElementById('entTel').value};if(db)db.collection("config").doc("settings").set({entete:e},{merge:true}).then(()=>alert("Sove"));}
function genRap(){
 let du=document.getElementById('du').value,au=document.getElementById('au').value,fV=document.getElementById('fVendeur').value,fT=document.getElementById('fTiraj').value;
 if(!db)return;
 db.collection("fiches").get().then(snap=>{
  db.collection("resultats").get().then(rSnap=>{let res={};rSnap.forEach(d=>{res[d.id]=d.data();});
   let vTot=0,cTot=0,pTot=0,parTiraj={};
   snap.forEach(doc=>{let f=doc.data();if(!f.date||f.date<du||f.date>au)return;if(fV!="tous"&&f.vendeur!=fV)return;
    f.lignes.forEach(l=>{
     f.tirajs.forEach(tir=>{
      if(fT!="tous"&&tir!=fT)return;
      if(!parTiraj[tir])parTiraj[tir]={vente:0,payer:0};
      let miz=parseFloat(l.miz)||0;parTiraj[tir].vente+=miz;vTot+=miz;
      let rr=res[f.date]?.[tir];
      if(rr){let pay=0;if(l.jeux=="bolet"){if(l.boule==rr.p1)pay=miz*50;else if(l.boule==rr.p2)pay=miz*20;else if(l.boule==rr.p3)pay=miz*10;}if(l.jeux=="maryaj"&&rr.maryaj&&rr.maryaj.includes(l.boule))pay=miz*1000;if(l.jeux=="loto3"&&l.boule==rr.l3)pay=miz*500;if(l.jeux=="loto4"&&l.boule==rr.l4)pay=miz*5000;if(l.jeux=="loto5"&&l.boule==rr.l5)pay=miz*25000;parTiraj[tir].payer+=pay;pTot+=pay;}
     });
    });
   });
   db.collection("vendeurs").get().then(vSnap=>{let percs={};vSnap.forEach(d=>{percs[d.id]=parseFloat(d.data().perc)||10;});let c=0;snap.forEach(doc=>{let f=doc.data();if(f.date<du||f.date>au)return;if(fV!="tous"&&f.vendeur!=fV)return;let perc=percs[f.vendeur]||10;let vf=0;f.lignes.forEach(l=>{vf+=parseFloat(l.miz)||0;});vf*=(f.tirajs.length||1);c+=vf*perc/100;});cTot=c;
   let bal=vTot-cTot-pTot;
   let html=`<div style="border:2px solid #111;padding:10px;background:#fff;margin-top:8px">
   <div style="text-align:center;font-weight:bold">Du ${du} Au ${au}<br>${fV} | ${fT}</div><hr>
   ${Object.keys(parTiraj).map(t=>`<div style="font-size:11px"><b>${t}</b>: Vente ${parTiraj[t].vente} - Payer ${parTiraj[t].payer} = ${parTiraj[t].vente-parTiraj[t].payer}</div>`).join('')}<hr>
   Vente <b>${vTot}</b><br>Commission.... <b>${cTot.toFixed(0)}</b><br>A payer.... <b>${pTot}</b><br><div style="background:#111;color:#fff;padding:8px">Balance net... <b>${bal.toFixed(0)}</b></div>
   <button onclick="window.print()" style="width:100%;margin-top:6px;padding:10px;background:#fff;border:2px solid #111;font-weight:bold">Imprimer</button></div>`;
   document.getElementById('zoneRap').innerHTML=html;
   });
  });
 });
}
</script></body></html>
