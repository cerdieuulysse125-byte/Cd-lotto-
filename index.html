<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>C&D V94 SANTEE</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f1f5f9;padding:8px;padding-bottom:100px}.hdr{background:#facc15;padding:10px 12px;border-radius:12px;display:flex;justify-content:space-between;font-weight:bold;font-size:13px}.card{background:#fff;border-radius:16px;padding:12px;margin:8px 0;box-shadow:0 2px 6px rgba(0,0,0,.08)}.tirajGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tirajItem{background:#fef2f2;border:1.5px solid #fecaca;border-radius:10px;padding:10px;display:flex;gap:8px;font-size:12px;align-items:center;cursor:pointer}.tirajItem.on{background:#dcfce7;border-color:#22c55e;font-weight:bold}.tirajItem input{width:18px;height:18px}.row3{display:grid;grid-template-columns:1fr 1.2fr 0.8fr;gap:6px}.row3 select,.row3 input{padding:14px;border:2px solid #000;border-radius:12px;text-align:center;font-weight:bold;font-size:16px}.row3 input:focus{border-color:#22c55e;outline:none}.btnAdd{background:#22c55e;color:#fff;width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;font-size:16px;margin-top:8px}.totalBox{display:flex;justify-content:space-between;font-weight:900;font-size:20px;margin:12px 2px}.btnValide{background:#0f172a;color:#facc15;width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;font-size:15px}.sec{display:none}.sec.active{display:block}.tabs{position:fixed;bottom:0;left:0;width:100%;background:#0f172a;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:6px;z-index:999}.tabBtn{background:#1e293b;color:#94a3b8;padding:12px 2px;border-radius:10px;font-size:11px;font-weight:bold;border:none}.tabBtn.active{background:#facc15;color:#000}
@media print{@page{size:58mm auto;margin:0}body *{display:none!important}#ticketSantee{display:block!important;position:fixed;top:0;left:0;width:58mm;background:#fff;color:#000;font-family:monospace;padding:6px;font-size:11px;white-space:pre-wrap}#ticketSantee *{display:block!important}}</style></head>
<body>

<div class="hdr"><span id="vName">tamouche</span><span id="dateNow"></span><span style="background:#0f172a;color:#facc15;padding:4px 10px;border-radius:20px;font-size:11px">KOM 10%</span></div>
<div style="background:#dcfce7;padding:8px;border-radius:10px;text-align:center;font-weight:bold;font-size:12px;margin:6px 0">✅ Ouvè - Lè Ayiti: <span id="heureAyiti"></span></div>

<!-- VANN -->
<div id="secVANN" class="sec active">
<div class="card"><div style="font-weight:bold;font-size:13px;margin-bottom:6px">Tiraj - Chwazi plizyè</div><div class="tirajGrid" id="tirajGrid"></div></div>

<div class="card" style="border:2px solid #000">
<div style="font-size:11px;font-weight:bold;color:#64748b;margin-bottom:4px">ENTÈTE FICH LA</div>
<div id="entetePreview" style="background:#f8fafc;padding:6px;border-radius:8px;font-size:11px;min-height:30px;border:1px dashed #cbd5e1"></div>

<div class="row3" style="margin-top:10px">
<select id="tip"><option value="bolet">Bolet</option><option value="mariage">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select>
<input id="boul" placeholder="BOUL" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
<input id="montan" placeholder="G" inputmode="numeric" type="number" autocomplete="off">
</div>
<button id="btnAdd" class="btnAdd">+ AJOUTE (Flèche ↓)</button>

<div id="liste" style="margin-top:10px"></div>

<div class="totalBox"><span>Total</span><span id="tTotal">0G</span></div>
<div id="detailCalc" style="text-align:right;font-size:12px;font-weight:bold;color:#16a34a;margin-top:-8px"></div>
<div style="display:flex;justify-content:space-between;font-size:11px;color:#64748b;margin-top:6px"><span id="kom">Kom 10% : 0G</span><span id="net">Net: 0G</span></div>

<button onclick="valideFich()" class="btnValide">✅ Validé + Imprimer</button>
</div>
</div>

<!-- KOPYE -->
<div id="secKOPYE" class="sec"><div class="card"><b>📋 Kopye Ticket</b><div id="listKopye" style="margin-top:8px"></div></div></div>

<!-- RAPO -->
<div id="secRAPO" class="sec"><div class="card"><b>📊 Rapò Jodi a</b><div id="rapData" style="margin-top:8px;font-size:13px"></div><button onclick="loadRap()" style="margin-top:8px;padding:8px;width:100%">Refresh</button></div></div>

<!-- FICHES -->
<div id="secFICHES" class="sec"><div class="card"><b>🎫 Mes Fiches</b><div id="listFiches" style="margin-top:8px"></div></div></div>

<div class="tabs">
<button onclick="showTab('VANN')" id="tabVANN" class="tabBtn active">VANN</button>
<button onclick="showTab('KOPYE')" id="tabKOPYE" class="tabBtn">KOPYE</button>
<button onclick="showTab('RAPO')" id="tabRAPO" class="tabBtn">RAPÒ</button>
<button onclick="showTab('FICHES')" id="tabFICHES" class="tabBtn">FICHES</button>
</div>

<!-- TICKET SANTEE 58MM -->
<div id="ticketSantee" style="display:none"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"}; const app=initializeApp(cfg); const db=getDatabase(app);

let vendeur="tamouche", panier=[], allFiches=[];
let TIRAJS=[{n:"FL MIDI",h:"13:15"},{n:"FL SOIR",h:"21:20"},{n:"GA MIDI",h:"12:15"},{n:"GA SOIR",h:"18:15"},{n:"NY MIDI",h:"14:18"},{n:"NY SOIR",h:"21:30"}];

function init(){
 let g=document.getElementById('tirajGrid'); g.innerHTML="";
 TIRAJS.forEach(t=>{
  g.innerHTML+=`<label class="tirajItem" id="box-${t.n.replace(/ /g,'')}"><input type="checkbox" value="${t.n}" class="chkT" onchange="updT('${t.n}')"> ${t.n}<br><small>(${t.h})</small></label>`;
 });
 document.getElementById('dateNow').innerText=new Date().toLocaleDateString('fr-HT');
 setInterval(()=>{ let e=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); document.getElementById('heureAyiti').innerText=e.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); },1000);

 // FLÈCHE POU AVANSE
 document.getElementById('boul').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowRight'){ e.preventDefault(); document.getElementById('montan').focus(); } if(!/[0-9]/.test(e.key)&&e.key!=='Backspace'&&e.key!=='Enter'&&e.key!=='ArrowDown'){} });
 document.getElementById('montan').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key==='ArrowDown'){ e.preventDefault(); addPanier(); } });
 document.getElementById('boul').addEventListener('input',e=>{ e.target.value=e.target.value.replace(/[^0-9]/g,''); });

 render(); loadAll();
}
window.updT=(n)=>{ let b=document.getElementById('box-'+n.replace(/ /g,'')); let c=document.querySelector(`input[value="${n}"]`); b.classList.toggle('on',c.checked); render(); }
function getT(){return [...document.querySelectorAll('.chkT:checked')].map(c=>c.value);}

function render(){
 let div=document.getElementById('liste'); div.innerHTML=''; let base=0;
 panier.forEach((p,i)=>{ base+=p.montan; div.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:13px"><span><b>${p.type}</b> ${p.boul}</span><span>${p.montan}G <button onclick="retire(${i})" style="background:#ef4444;color:#fff;border:none;padding:2px 8px;border-radius:6px">x</button></span></div>`; });
 let nb=getT().length||0;
 let total=nb===0?0:base*nb;
 let kom=Math.round(total*0.1);
 document.getElementById('tTotal').innerText=total+"G";
 document.getElementById('kom').innerText=`Kom 10% : ${kom}G`;
 document.getElementById('net').innerText=`Net: ${total-kom}G`;
 let tirajTxt=getT().join(' / ')||'Pa chwazi tiraj';
 document.getElementById('entetePreview').innerHTML=`Vandè: <b>${vendeur}</b> | ${tirajTxt}<br>${panier.length} fich - Base ${base}G x ${nb} = <b>${total}G</b>`;
 if(nb>0&&base>0){ document.getElementById('detailCalc').innerText=`${base}G × ${nb} tiraj = ${total}G`; }else{ document.getElementById('detailCalc').innerText=nb===0?'Chwazi tiraj pou kalkile total':''; }
}
window.retire=(i)=>{panier.splice(i,1);render();}
function addPanier(){
 let tip=document.getElementById('tip').value; let boul=document.getElementById('boul').value.trim(); let montan=parseInt(document.getElementById('montan').value);
 if(getT().length===0){alert('Chwazi omwen 1 tiraj');return;}
 if(!boul||!montan){alert('Mete BOUL ak G');return;}
 panier.push({type:tip,boul:boul,montan:montan}); render();
 document.getElementById('boul').value=""; document.getElementById('montan').value=""; document.getElementById('boul').focus();
}
document.getElementById('btnAdd').addEventListener('click',addPanier);

window.valideFich=async()=>{
 if(panier.length===0){alert('Panier vid');return;}
 let tirajs=getT(); if(tirajs.length===0){alert('Chwazi tiraj');return;}
 let base=panier.reduce((a,b)=>a+b.montan,0);
 let total=base*tirajs.length;
 let kom=Math.round(total*0.1);
 let id=push(child(ref(db),'fiches')).key;
 let fich={id:id,vendeur:vendeur,tirajs:tirajs,details:panier,total:total,totalBase:base,nbTiraj:tirajs.length,kom:kom,date:new Date().toISOString()};
 await set(ref(db,'fiches/'+id),fich);
 // TICKET SANTEE
 let t=` C&D LOTTO\n LAVE CHODYÈ W\n----------------\n${vendeur} - ${new Date().toLocaleString('fr-HT')}\n${tirajs.join(' / ')}\n----------------\n`;
 panier.forEach(p=>{ t+=`${p.type.toUpperCase()} ${p.boul} ${p.montan}G x${tirajs.length}\n`; });
 t+=`----------------\nTOTAL: ${total}G\n(${base}G x ${tirajs.length} tiraj)\nKOM 10%: ${kom}G\nNET: ${total-kom}G\n----------------\nID:${id.slice(-5)} - BON CHANS!\n`;
 document.getElementById('ticketSantee').innerText=t;
 window.print();
 setTimeout(()=>{panier=[];render();loadAll();},500);
};

async function loadAll(){
 let s=await get(child(ref(db),'fiches')); if(!s.exists())return;
 let today=new Date().toISOString().split('T')[0];
 allFiches=Object.values(s.val()).filter(f=>f.date&&f.date.split('T')[0]===today&&f.vendeur===vendeur);
 // FICHES
 let lf=document.getElementById('listFiches'); lf.innerHTML=allFiches.length? '':'Pa gen fich';
 allFiches.slice().reverse().forEach(f=>{ lf.innerHTML+=`<div style="border:1px solid #eee;padding:8px;border-radius:8px;margin:4px 0;font-size:12px"><b>${f.tirajs.join('/')}</b> - ${f.total}G (${f.totalBase}G x${f.nbTiraj})<br>${(f.details||[]).map(d=>d.type+' '+d.boul+' '+d.montan+'G').join(', ')}<br><small>${new Date(f.date).toLocaleTimeString()}</small> <button onclick="reprint('${f.id}')" style="float:right">Print</button></div>`; });
 // KOPYE
 let lk=document.getElementById('listKopye'); lk.innerHTML=allFiches.length? '':'Pa gen fich';
 allFiches.slice().reverse().slice(0,20).forEach(f=>{ lk.innerHTML+=`<div style="border:1px solid #eee;padding:8px;border-radius:8px;margin:4px 0;font-size:12px;display:flex;justify-content:space-between"><span>${f.tirajs.join('/')} - ${f.total}G</span><button onclick="kopyeF('${f.id}')" style="background:#facc15;padding:4px 10px;border:none;border-radius:6px;font-weight:bold">KOPYE</button></div>`; });
 loadRap();
}
window.kopyeF=(id)=>{ let f=allFiches.find(x=>x.id===id); if(!f)return; panier=JSON.parse(JSON.stringify(f.details)); // kopye boul yo
 // koche tiraj yo
 document.querySelectorAll('.chkT').forEach(c=>c.checked=false); document.querySelectorAll('.tirajItem').forEach(b=>b.classList.remove('on'));
 f.tirajs.forEach(tn=>{ let c=document.querySelector(`input[value="${tn}"]`); if(c){c.checked=true; document.getElementById('box-'+tn.replace(/ /g,'')).classList.add('on');}});
 render(); showTab('VANN'); };
window.reprint=(id)=>{ let f=allFiches.find(x=>x.id===id); if(!f)return; let t=` C&D LOTTO\n${f.vendeur} - ${new Date(f.date).toLocaleString()}\n${f.tirajs.join(' / ')}\n----------------\n`; f.details.forEach(p=>{t+=`${p.type} ${p.boul} ${p.montan}G x${f.nbTiraj}\n`;}); t+=`----------------\nTOTAL: ${f.total}G\n`; document.getElementById('ticketSantee').innerText=t; window.print(); };
window.loadRap=()=>{
 let vente=allFiches.reduce((a,b)=>a+(b.total||0),0); let kom=Math.round(vente*0.1);
 document.getElementById('rapData').innerHTML=`Fich: ${allFiches.length}<br>Vente Total: <b>${vente}G</b><br>Komisyon 10%: <b>${kom}G</b><br>Balance: <b>${vente-kom}G</b><br><br>Detay:<br>${allFiches.map(f=>`${f.tirajs.join('/')} : ${f.total}G`).join('<br>')}`;
};
window.showTab=(t)=>{ document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active')); document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active')); document.getElementById('sec'+t).classList.add('active'); document.getElementById('tab'+t).classList.add('active'); };

init();
</script></body></html>
