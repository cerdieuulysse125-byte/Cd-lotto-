<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VENDEUR V83 FERMETURE</title>
<style>*{box-sizing:border-box}body{background:#f1f5f9;color:#000;font-family:sans-serif;margin:0;padding:8px}h1{font-size:13px;text-align:center;color:#ca8a04;margin:4px}.card{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:10px;margin-bottom:8px}input,select{padding:8px;border-radius:6px;border:1px solid #94a3b8;background:#fff;color:#000;font-size:14px;width:100%}button{background:#eab308;color:#000;border:none;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer}button:disabled{background:#94a3b8;color:#fff;opacity:0.5}.tirage{display:flex;gap:5px;flex-wrap:wrap}.tirage label{padding:5px 10px;border-radius:20px;border:1px solid #cbd5e1;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px}.tirage label.ouvert{background:#dcfce7;border-color:#22c55e}.tirage label.ferme{background:#fee2e2;border-color:#ef4444;opacity:0.6}.tirage input{width:auto}#liste{max-height:180px;overflow:auto;background:#f8fafc;border-radius:8px;padding:6px;margin-top:6px;border:1px solid #e2e8f0}@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:80mm;padding:5px;font-family:monospace;font-size:12px;color:#000;background:#fff}}</style></head>
<body>
<script>
function getHaitiDateStr(){let d=new Date();let haiti=new Date(d.toLocaleString("en-US",{timeZone:"America/Port-au-Prince"}));return `${haiti.getFullYear()}-${String(haiti.getMonth()+1).padStart(2,'0')}-${String(haiti.getDate()).padStart(2,'0')}`;}
function getHaitiTimeStr(){let d=new Date();return new Date(d.toLocaleString("en-US",{timeZone:"America/Port-au-Prince"})).toLocaleTimeString('fr-HT');}
function getHaitiHM(){let d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Port-au-Prince"}));return d.getHours()*60+d.getMinutes();}
</script>
<h1>🎫 C&D LOTTO <span id="idV">...</span> - <span id="stat">...</span> - <span id="haitiNow"></span></h1>
<div id="openMsg"></div>
<div id="fermetureInfo" style="background:#fff3cd;border:1px solid #facc15;padding:6px;border-radius:8px;margin-bottom:8px;font-size:11px;text-align:center"></div>

<div class="card">
<b>Tirage:</b> <small id="heureHaiti" style="color:#ca8a04"></small>
<div class="tirage" id="tirageContainer">
<label id="lab_GA MIDI"><input type="checkbox" value="GA MIDI" class="chkT"> GA MIDI <span class="hFerm"></span></label>
<label id="lab_GA SOIR"><input type="checkbox" value="GA SOIR" class="chkT"> GA SOIR <span class="hFerm"></span></label>
<label id="lab_FL MIDI"><input type="checkbox" value="FL MIDI" class="chkT"> FL MIDI <span class="hFerm"></span></label>
<label id="lab_FL SOIR"><input type="checkbox" value="FL SOIR" class="chkT"> FL SOIR <span class="hFerm"></span></label>
<label id="lab_NY MIDI"><input type="checkbox" value="NY MIDI" class="chkT"> NY MIDI <span class="hFerm"></span></label>
<label id="lab_NY SOIR"><input type="checkbox" value="NY SOIR" class="chkT"> NY SOIR <span class="hFerm"></span></label>
</div>
</div>

<div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
<div><label style="font-size:11px">Tip:</label><select id="tip"><option value="bolet">Bolèt</option><option value="mariage">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select></div>
<div><label style="font-size:11px">Boul:</label><input id="boul" placeholder="23"></div>
<div><label style="font-size:11px">Montan:</label><input id="montan" type="number" placeholder="50"></div>
</div>
<button id="btnAdd" style="width:100%;margin-top:8px;background:#22c55e;color:#fff">➕ Ajoute (Enter)</button>
<div id="limiteInfo" style="font-size:11px;margin-top:6px;color:#ca8a04"></div>
<div id="liste"></div>
<div style="display:flex;justify-content:space-between;margin-top:8px;font-weight:bold"><span>Total</span><span id="tTotal">0G</span></div>
<button id="btnVal" onclick="valide()" style="width:100%;margin-top:8px;background:#000;color:#facc15;font-size:16px">✅ Validé + Imprimer</button>
<div id="bloqueMsg" style="display:none;background:#ef4444;color:#fff;padding:12px;border-radius:8px;margin-top:8px;text-align:center;font-weight:bold"></div>
</div>

<div class="card">
<b>📋 Mon rapport</b>
<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">
<div>Du:<input type="date" id="rapDu"></div><div>Au:<input type="date" id="rapAu"></div>
<div>Tirage:<select id="rapTiraj"><option value="all">Tous</option><option>GA MIDI</option><option>GA SOIR</option><option>FL MIDI</option><option>FL SOIR</option><option>NY MIDI</option><option>NY SOIR</option></select></div>
<button onclick="loadMonRap()">OK</button>
</div>
<div style="display:flex;gap:4px;margin-top:8px"><div style="flex:1;background:#f1f5f9;padding:6px;border-radius:6px;text-align:center"><div style="font-size:8px">VENTE</div><b id="mVente">0G</b></div><div style="flex:1;background:#f1f5f9;padding:6px;border-radius:6px;text-align:center"><div style="font-size:8px">COM</div><b id="mCom">0G</b></div><div style="flex:1;background:#f1f5f9;padding:6px;border-radius:6px;text-align:center"><div style="font-size:8px">PAYÉ</div><b id="mPaye">0G</b></div><div style="flex:1;background:#f1f5f9;padding:6px;border-radius:6px;text-align:center"><div style="font-size:8px">BAL</div><b id="mBal">0G</b></div></div>
<div id="monRap" style="margin-top:8px;font-size:11px;background:#f8fafc;padding:6px;border-radius:6px"></div>
</div>

<div class="card" style="border:2px solid #22c55e">
<b>📄 Mes Fiches</b> <button onclick="loadMesFiches()" style="padding:4px 8px;background:#facc15">Refresh</button>
<div id="mesFiches" style="margin-top:6px;font-size:12px;max-height:400px;overflow:auto"></div>
</div>

<div id="printArea" style="display:none"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};const app=initializeApp(cfg);const db=getDatabase(app);

let vendeur=prompt("Non Vendeur?")||"vendeur1";vendeur=vendeur.toLowerCase().replace(/\s+/g,'');
document.getElementById('idV').innerText=vendeur;
document.getElementById('haitiNow').innerText='AYITI: '+getHaitiDateStr()+' '+getHaitiTimeStr();

let panier=[]; let limites={bolet:1000,mariage:50,loto3:100,loto4:20,loto5:10}; let totalsDuJour={}; let fermeture={};

function checkFermeture(){
let hm=getHaitiHM();
let now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Port-au-Prince"}));
document.getElementById('heureHaiti').innerText=`Lè Ayiti: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
let info=""; let allFerme=true;
Object.keys(fermeture).forEach(t=>{
let [h,m]=fermeture[t].split(':').map(Number);
let limH=h*60+m;
let lab=document.getElementById('lab_'+t);
if(!lab) return;
let chk=lab.querySelector('input');
let span=lab.querySelector('.hFerm');
span.innerText=`(${fermeture[t]})`;
if(hm>=limH){
chk.checked=false; chk.disabled=true; lab.className='ferme'; span.innerText+=` 🔒 FÈMÈ`;
info+=`${t} FÈMÈ ${fermeture[t]} | `;
}else{
chk.disabled=false; lab.className='ouvert'; allFerme=false;
}
});
document.getElementById('fermetureInfo').innerHTML=info||"✅ Tout tiraj ouvè - "+`Lè Ayiti: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
if(allFerme){
document.getElementById('bloqueMsg').style.display='block';
document.getElementById('bloqueMsg').innerHTML=`🔴 TOUT TIRAJ FÈMÈ - Pa ka vann kounya<br>Lè Ayiti: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
document.getElementById('btnAdd').disabled=true;
document.getElementById('btnVal').disabled=true;
}else{
document.getElementById('bloqueMsg').style.display='none';
document.getElementById('btnAdd').disabled=false;
document.getElementById('btnVal').disabled=false;
}
}

async function init(){
let s=await get(child(ref(db),'config')); if(!s.exists()) return;
let c=s.val();
let etat=c.vendeurs?.[vendeur]||'ouvert';
document.getElementById('stat').innerText=etat.toUpperCase();
if(etat!=='ouvert'){document.getElementById('openMsg').innerHTML=`<div style="background:#ef4444;color:#fff;padding:12px;border-radius:8px;text-align:center">🔴 ${vendeur.toUpperCase()} FERMÉ</div>`;document.getElementById('btnAdd').style.display='none';document.getElementById('btnVal').style.display='none';return;}
if(c.limites) limites=c.limites;
if(c.fermeture) fermeture=c.fermeture;
else fermeture={'GA MIDI':'12:15','GA SOIR':'18:15','FL MIDI':'13:15','FL SOIR':'21:15','NY MIDI':'14:15','NY SOIR':'21:30'};
checkFermeture();
setInterval(checkFermeture,30000);
await calcTotals();
let t=getHaitiDateStr();document.getElementById('rapDu').value=t;document.getElementById('rapAu').value=t;
}

async function calcTotals(){let snap=await get(child(ref(db),'fiches'));totalsDuJour={};if(!snap.exists())return;let today=getHaitiDateStr();Object.values(snap.val()).forEach(f=>{let fd=f.haitiDate||f.date.split('T')[0];if(fd!==today)return;(f.details||[]).forEach(d=>{(f.tirajs||[]).forEach(t=>{let k=t+'_'+(d.type||'bolet')+'_'+d.boul;if(!totalsDuJour[k])totalsDuJour[k]=0;totalsDuJour[k]+=parseInt(d.montan||0);});});});}
function getTirajSelected(){return [...document.querySelectorAll('.chkT:checked')].map(c=>c.value);}
document.getElementById('boul').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('montan').focus();}});
document.getElementById('montan').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addBoul();}});

window.addBoul=async()=>{
checkFermeture();
let tirajs=getTirajSelected();if(tirajs.length===0){alert('Chwazi tiraj');return;}
for(let t of tirajs){
let [h,m]= (fermeture[t]||'23:59').split(':').map(Number);
if(getHaitiHM()>=h*60+m){alert(`🚫 ${t} FÈMÈ depi ${fermeture[t]} - Ou pa ka vann li ankò!`);return;}
}
let tip=document.getElementById('tip').value;let boul=document.getElementById('boul').value.trim();let montan=parseInt(document.getElementById('montan').value);if(!boul||!montan)return;
for(let t of tirajs){let k=t+'_'+tip+'_'+boul;let deja=totalsDuJour[k]||0;let lim=limites[tip]||1000;if(deja+montan>lim){alert(`🚫 BLOKE! ${boul} ${t} deja ${deja}/${lim}`);return;}}
panier.push({type:tip,boul:boul,montan:montan});for(let t of tirajs){let k=t+'_'+tip+'_'+boul;if(!totalsDuJour[k])totalsDuJour[k]=0;totalsDuJour[k]+=montan;}render();document.getElementById('boul').value='';document.getElementById('montan').value='';document.getElementById('boul').focus();
};
function render(){let div=document.getElementById('liste');div.innerHTML='';let tot=0;panier.forEach((p,i)=>{tot+=p.montan;div.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0"><span>${p.type} ${p.boul}</span><span>${p.montan}G <button onclick="retire(${i})" style="padding:2px 6px;background:#ef4444;color:#fff">x</button></span></div>`;});document.getElementById('tTotal').innerText=tot+'G';}
window.retire=(i)=>{let p=panier[i];let tirajs=getTirajSelected();tirajs.forEach(t=>{let k=t+'_'+p.type+'_'+p.boul;if(totalsDuJour[k])totalsDuJour[k]-=p.montan;});panier.splice(i,1);render();};
window.valide=async()=>{
checkFermeture();
if(panier.length===0){alert('Panier vid');return;}
let tirajs=getTirajSelected();if(tirajs.length===0){alert('Chwazi tiraj');return;}
for(let t of tirajs){
let [h,m]= (fermeture[t]||'23:59').split(':').map(Number);
if(getHaitiHM()>=h*60+m){alert(`🚫 ${t} FÈMÈ - Pa ka valide fich sa! Retire li!`);return;}
}
let total=panier.reduce((a,b)=>a+b.montan,0);let id=push(child(ref(db),'fiches')).key;let shortId=id.slice(-6).toUpperCase();let haitiDate=getHaitiDateStr();let haitiTime=getHaitiTimeStr();await set(ref(db,'fiches/'+id),{id:id,shortId:shortId,vendeur:vendeur,idVendeur:vendeur,tirajs:tirajs,tiraj:tirajs[0],details:panier,total:total,haitiDate:haitiDate,haitiTime:haitiTime,date:new Date().toISOString()});let printDiv=document.getElementById('printArea');printDiv.innerHTML=`<div style="text-align:center"><b>C&D VÉRITÉ LOTTO</b><br>${haitiDate} ${haitiTime}<br>${tirajs.join(', ')}<br>${shortId}<br>....</div><div>${panier.map(p=>`${p.type.toUpperCase()} - ${p.boul} - ${p.montan}G`).join('<br>')}<br><b>Total: ${total}G</b></div>`;printDiv.style.display='block';window.print();setTimeout(()=>printDiv.style.display='none',500);panier=[];render();await calcTotals();loadMonRap();loadMesFiches();
};
window.loadMonRap=async()=>{let du=document.getElementById('rapDu').value;let au=document.getElementById('rapAu').value;let ft=document.getElementById('rapTiraj').value;let snap=await get(child(ref(db),'fiches'));let resSnap=await get(child(ref(db),'resultats'));let res=resSnap.exists()?resSnap.val():{};let div=document.getElementById('monRap');if(!snap.exists()){div.innerHTML='Pa gen';return;}let all=Object.values(snap.val()).filter(f=>(f.vendeur||f.idVendeur)===vendeur);let filt=all.filter(f=>{let fd=f.haitiDate||f.date.split('T')[0];if(du&&fd<du)return false;if(au&&fd>au)return false;if(ft!=='all'&&!(f.tirajs||[f.tiraj]||[]).includes(ft))return false;return true;});let vente=filt.reduce((a,b)=>a+parseInt(b.total||0),0);let com=Math.round(vente*0.1);let gain=0;filt.forEach(f=>{let fd=f.haitiDate||f.date.split('T')[0];(f.tirajs||[]).forEach(t=>{let r=res[fd+'_'+t.replace(' ','_')]||res[fd+'_'+t];if(!r)return;(f.details||[]).forEach(dd=>{if(String(dd.boul).trim()===String(r.premier).trim())gain+=dd.montan*50;else if(String(dd.boul).trim()===String(r.deuxieme).trim())gain+=dd.montan*20;else if(String(dd.boul).trim()===String(r.troisieme).trim())gain+=dd.montan*10;});});});let bal=vente-com-gain;document.getElementById('mVente').innerText=vente+'G';document.getElementById('mCom').innerText=com+'G';document.getElementById('mPaye').innerText=gain+'G';document.getElementById('mBal').innerText=bal+'G';div.innerHTML=`${filt.length} fich - Vente:${vente}G Com:${com}G Payé:${gain}G Bal:${bal}G`;};
window.loadMesFiches=async()=>{let snap=await get(child(ref(db),'fiches'));let resSnap=await get(child(ref(db),'resultats'));let res=resSnap.exists()?resSnap.val():{};let div=document.getElementById('mesFiches');if(!snap.exists()){div.innerHTML='Pa gen';return;}let mine=Object.values(snap.val()).filter(f=>(f.vendeur||f.idVendeur)===vendeur).slice(-30).reverse();div.innerHTML=mine.map(f=>{let fd=f.haitiDate||f.date.split('T')[0];let gain=0;(f.tirajs||[]).forEach(t=>{let r=res[fd+'_'+t.replace(' ','_')]||res[fd+'_'+t];if(r){(f.details||[]).forEach(dd=>{if(String(dd.boul).trim()===String(r.premier).trim())gain+=dd.montan*50;else if(String(dd.boul).trim()===String(r.deuxieme).trim())gain+=dd.montan*20;else if(String(dd.boul).trim()===String(r.troisieme).trim())gain+=dd.montan*10;});}});let status=gain>0?`<span style="color:#16a34a;font-weight:bold">✅ GAGNÉ ${gain}G</span>`:'<span style="color:#ef4444">❌ PERDU</span>';return `<div style="border-bottom:1px solid #e2e8f0;padding:6px 0;display:flex;justify-content:space-between"><div><b>${f.shortId||''}</b> - ${fd} - ${(f.tirajs||[]).join(',')} - ${f.total}G<br><span style="font-size:11px">${(f.details||[]).map(dd=>dd.boul).join(', ')}</span></div><div>${status}</div></div>`;}).join('');};
document.getElementById('btnAdd').addEventListener('click',addBoul);
document.getElementById('tip').addEventListener('change',e=>{let lim=limites[e.target.value]||0;document.getElementById('limiteInfo').innerText=`Limit ${e.target.value}: ${lim}G / boul / tiraj`;});
document.getElementById('tip').dispatchEvent(new Event('change'));
init();loadMonRap();loadMesFiches();
</script></body></html>
