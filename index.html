<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D V93 TOTAL x TIRAJ</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f1f5f9;padding:8px;padding-bottom:90px}.hdr{background:#facc15;padding:12px;border-radius:12px;display:flex;justify-content:space-between;font-weight:bold;font-size:14px;align-items:center}.card{background:#fff;border-radius:16px;padding:12px;margin:8px 0;box-shadow:0 2px 6px rgba(0,0,0,.08);border:1px solid #e2e8f0}.tirajGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tirajItem{background:#fff3f3;border:1px solid #fecaca;border-radius:12px;padding:12px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:#555}.tirajItem.active{background:#dcfce7;border-color:#22c55e;color:#000}.tirajItem input{width:20px;height:20px}.inputRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.inputRow select,.inputRow input{padding:16px;border:2px solid #000;border-radius:12px;text-align:center;font-weight:bold;font-size:18px;background:#fff}.btnAdd{background:#22c55e;color:#fff;width:100%;padding:16px;border-radius:12px;font-weight:bold;font-size:18px;border:none}.totalRow{display:flex;justify-content:space-between;font-weight:bold;font-size:20px;margin:14px 4px}.tabs{position:fixed;bottom:0;left:0;width:100%;background:#0f172a;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:8px;z-index:999}.tabBtn{background:#1e293b;color:#94a3b8;padding:12px 4px;border-radius:12px;font-size:12px;text-align:center;font-weight:bold;border:none}.tabBtn.active{background:#facc15;color:#000}.listeItem{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}</style></head>
<body>

<div class="hdr"><span id="vName">tamouche</span><span id="dateNow">2026-08-06 21:28</span><span style="background:#0f172a;color:#facc15;padding:6px 12px;border-radius:20px;font-size:12px">KOM 10%</span></div>

<div style="background:#fef9c3;padding:10px;border-radius:12px;text-align:center;font-weight:bold;margin:8px 0;border:1px solid #facc15">✅ Ouvè - Lè Ayiti: <span id="heureAyiti">21:28</span></div>

<div class="card">
<div style="font-weight:bold;margin-bottom:8px">Tiraj - <span id="heureDetail" style="font-size:12px;color:#64748b">21:28</span></div>
<div class="tirajGrid" id="tirajGrid"></div>
</div>

<div class="card" style="border:2px solid #000">
<div class="inputRow">
<select id="tip"><option value="bolet">Bolet</option><option value="mariage">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select>
<input id="boul" placeholder="BOUL">
<input id="montan" type="number" placeholder="G" style="border-color:#22c55e">
</div>
<button id="btnAdd" class="btnAdd">+ AJOUTE</button>

<div id="liste" style="margin-top:10px;min-height:20px"></div>

<div class="totalRow"><span>Total</span><span id="tTotal">0G</span></div>
<div id="detailCalc" style="font-size:12px;color:#16a34a;text-align:right;font-weight:bold;margin-top:-10px;margin-bottom:10px"></div>

<button onclick="valideFich()" style="background:#0f172a;color:#facc15;width:100%;padding:16px;border-radius:12px;font-weight:bold;font-size:16px">✅ Validé + Imprimer</button>
</div>

<div class="tabs">
<button class="tabBtn active">VANN</button><button class="tabBtn">KOPYE</button><button class="tabBtn">RAPÒ</button><button class="tabBtn">FICHES</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"}; const app=initializeApp(cfg); const db=getDatabase(app);

let vendeur="tamouche", panier=[];
let TIRAJS=[
{name:"FL MIDI",heure:"13:15"},
{name:"FL SOIR",heure:"21:20"},
{name:"GA MIDI",heure:"12:15"},
{name:"GA SOIR",heure:"18:15"},
{name:"NY MIDI",heure:"14:15"},
{name:"NY SOIR",heure:"21:30"}
];

function init(){
 let g=document.getElementById('tirajGrid'); g.innerHTML="";
 TIRAJS.forEach(t=>{
  g.innerHTML+=`<label class="tirajItem" id="box-${t.name.replace(' ','')}"><input type="checkbox" value="${t.name}" class="chkT" onchange="toggleT('${t.name}')"> <div><div>${t.name}</div><div style="font-size:11px">(${t.heure})</div></div></label>`;
 });
 setInterval(()=>{
  let n=new Date(); let est=new Date(n.toLocaleString("en-US",{timeZone:"America/New_York"}));
  document.getElementById('heureAyiti').innerText=est.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  document.getElementById('heureDetail').innerText=est.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
 },1000);
 render();
}
window.toggleT=(name)=>{
 let box=document.getElementById('box-'+name.replace(' ',''));
 let chk=document.querySelector(`input[value="${name}"]`);
 box.classList.toggle('active', chk.checked);
 render();
}
function getT(){ return [...document.querySelectorAll('.chkT:checked')].map(c=>c.value); }

function render(){
 let div=document.getElementById('liste'); div.innerHTML=''; let base=0;
 panier.forEach((p,i)=>{
  base+=p.montan;
  div.innerHTML+=`<div class="listeItem"><span>${p.type.toUpperCase()} ${p.boul}</span><span>${p.montan}G <button onclick="retire(${i})" style="background:#ef4444;color:#fff;border:none;padding:2px 8px;border-radius:6px">x</button></span></div>`;
 });
 let nb=getT().length||0;
 let total = nb===0? 0 : base*nb; // KOREKSYON: TOTAL x NB TIRAJ

 document.getElementById('tTotal').innerText=total+"G";
 if(nb>1){
  document.getElementById('detailCalc').innerText=`${base}G x ${nb} tiraj = ${total}G`;
 }else if(nb===1){
  document.getElementById('detailCalc').innerText=`${base}G x 1 tiraj`;
 }else{
  document.getElementById('detailCalc').innerText=`Chwazi tiraj pou kalkile total`;
 }
}
window.retire=(i)=>{ panier.splice(i,1); render(); };

document.getElementById('btnAdd').addEventListener('click',()=>{
 let tip=document.getElementById('tip').value;
 let boul=document.getElementById('boul').value.trim();
 let montan=parseInt(document.getElementById('montan').value);
 let tirajs=getT();
 if(tirajs.length===0){alert('Chwazi omwen 1 tiraj anvan');return;}
 if(!boul||!montan){alert('Mete boul ak Goud');return;}
 panier.push({type:tip,boul:boul,montan:montan});
 render();
 document.getElementById('boul').value=""; document.getElementById('montan').value="";
 document.getElementById('boul').focus();
});

window.valideFich=async()=>{
 if(panier.length===0){alert('Panier vid');return;}
 let tirajs=getT(); if(tirajs.length===0){alert('Chwazi tiraj');return;}
 let base=panier.reduce((a,b)=>a+b.montan,0);
 let total=base*tirajs.length;
 let id=push(child(ref(db),'fiches')).key;
 await set(ref(db,'fiches/'+id),{id:id,vendeur:vendeur,tirajs:tirajs,details:panier,total:total,totalBase:base,nbTiraj:tirajs.length,date:new Date().toISOString()});
 alert(`✅ Fich ${id.slice(-4)}\n${base}G x ${tirajs.length} tiraj = ${total}G\n${tirajs.join(' / ')}`);
 panier=[]; render();
};

init();
</script></body></html>
