<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V96 FINAL</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f1f5f9;padding:8px;padding-bottom:95px}
.hdr{background:#facc15;padding:12px 14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13px}
.bloqueBanner{background:#ef4444;color:#fff;padding:18px;border-radius:14px;text-align:center;font-weight:900;margin:8px 0;font-size:16px;display:none;line-height:1.4}
.card{background:#fff;border-radius:18px;padding:16px;margin:8px 0;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.rapCard{background:#fff;border-radius:20px;padding:16px;margin:8px 0;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.tirajGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tirajItem{background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;padding:14px 8px;display:flex;justify-content:center;font-weight:700;cursor:pointer;font-size:13px}
.tirajItem.on{background:#dcfce7;border-color:#22c55e}
.tirajItem.ferme{opacity:.35;pointer-events:none}
.row3{display:grid;grid-template-columns:0.9fr 1.1fr 0.8fr;gap:8px;margin-top:10px}
.row3 select,.row3 input{padding:14px 6px;border:2.5px solid #000;border-radius:12px;text-align:center;font-weight:900;font-size:16px;height:56px;width:100%}
.btnAdd{background:#22c55e;color:#fff;width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:18px;margin-top:10px}
.btnAdd:disabled{opacity:.3}
.totalBox{background:#f8fafc;border:2px solid #000;border-radius:12px;padding:12px;margin:14px 0}
.totalFinal{display:flex;justify-content:space-between;font-weight:900;font-size:22px;border-top:2px solid #000;padding-top:8px;margin-top:8px}
.btnValide{background:#0f172a;color:#facc15;width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:17px}
.sec{display:none}.sec.active{display:block}
.tabs{position:fixed;bottom:0;left:0;width:100%;background:#0f172a;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:8px;z-index:9999}
.tabBtn{background:#1e293b;color:#94a3b8;padding:14px 2px;border-radius:12px;font-size:11px;font-weight:800;border:none}
.tabBtn.active{background:#facc15;color:#000}
.rapFilters{display:grid;gap:10px}
.rapRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rapRow input,.rapRow select{padding:14px;border:1.5px solid #cbd5e1;border-radius:12px;font-weight:600;width:100%;background:#f8fafc}
.btnOK{background:#3b82f6;color:#fff;padding:14px 22px;border:none;border-radius:12px;font-weight:900}
.rapStats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.statBox{padding:18px;border-radius:14px;text-align:center}
.statBox small{font-size:10px;font-weight:800;display:block;opacity:.8}
.statBox b{font-size:24px;display:block}
.statVann{background:#0f172a;color:#fff}.statKom{background:#fef3c7;color:#000;border:1.5px solid #facc15}
.statPaye{background:#fee2e2;color:#ef4444;border:1.5px solid #fecaca}.statBalans{background:#dcfce7;color:#166534;border:1.5px solid #22c55e}
.formula{background:#f1f5f9;padding:10px;border-radius:10px;text-align:center;font-size:12px;font-weight:800;margin-top:12px}
.btnPrint{background:#22c55e;color:#fff;width:100%;padding:16px;border:none;border-radius:14px;font-weight:900;margin-top:14px;font-size:15px}
</style></head>
<body>

<div class="hdr"><span id="vendeurName">tamouche</span><span id="dateNow">2026-08-07</span><span>KOM 10%</span></div>
<div id="bannerBloque" class="bloqueBanner">🚫 VANDÈ SA BLOKE NAN PROPRIO<br><span style="font-size:12px;font-weight:400">Kontakte Proprio pou debloke</span></div>
<div id="bannerFerme" style="display:none;background:#f59e0b;color:#000;padding:12px;border-radius:12px;text-align:center;font-weight:800;margin:8px 0">🚫 TOUT TIRAJ FERMÉ - RAPÒ sèlman</div>

<div id="secVANN" class="sec"><div class="card"><div style="font-weight:800;margin-bottom:8px">Tiraj - <span id="msgFerme" style="color:#ef4444;font-size:11px"></span></div><div class="tirajGrid" id="tirajGrid"></div></div>
<div class="card" style="border:2.5px solid #000"><div id="entetePreview" style="background:#f8fafc;padding:8px;border-radius:8px;font-size:11px;border:1px dashed #cbd5e1;margin-bottom:8px"></div>
<div class="row3"><select id="tip"><option value="bolet">Bolet</option><option value="mariage">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select><input id="boul" placeholder="BOUL"><input id="montan" placeholder="G" type="number"></div>
<button id="btnAdd" class="btnAdd">+ AJOUTE</button><div id="liste" style="margin-top:10px"></div>
<div class="totalBox"><div style="display:flex;justify-content:space-between;font-size:13px"><span>Base Miz</span><span id="tBase">0G</span></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#64748b"><span id="tDetail">0G x 0 Tiraj</span></div><div class="totalFinal"><span>Total Final</span><span id="tTotal">0G</span></div></div>
<button onclick="valideFich()" class="btnValide">✅ Validé + Imprimer</button></div></div>

<div id="secKOPYE" class="sec"><div class="card"><b>📋 KOPYE - ID 5 chif</b><div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0"><input id="searchId" placeholder="ID 5 chif" style="padding:14px;border-radius:12px;border:2px solid #000;font-weight:800"><button onclick="chercheParId()" style="background:#0f172a;color:#facc15;padding:14px;border-radius:12px;font-weight:900;border:none">CHÈCHE</button></div><div id="resultSearch"></div></div></div>

<div id="secRAPO" class="sec active"><div class="rapCard">
<div style="text-align:center;font-weight:900;margin-bottom:12px">📊 RAPÒ - BALANS NET</div>
<div class="rapFilters">
<div class="rapRow"><div><input id="rapDu" type="date"></div><div><input id="rapAu" type="date"></div></div>
<div class="rapRow" style="grid-template-columns:1fr auto"><select id="rapTiraj"><option value="">Tout Tiraj</option><option value="FL MIDI">FL MIDI</option><option value="FL SOIR">FL SOIR</option><option value="GA MIDI">GA MIDI</option><option value="GA SOIR">GA SOIR</option><option value="NY MIDI">NY MIDI</option><option value="NY SOIR">NY SOIR</option></select><button class="btnOK" onclick="genererRapport()">OK</button></div>
</div>
<div class="rapStats">
<div class="statBox statVann"><small>VANN</small><b id="vVann">0G</b></div>
<div class="statBox statKom"><small>KOM 10%</small><b id="vKom">0G</b></div>
<div class="statBox statPaye"><small>PAYE</small><b id="vPaye">0G</b></div>
<div class="statBox statBalans"><small>BALANS NET</small><b id="vBal">0G</b></div>
</div>
<div class="formula" id="vForm">BALANS NET = VANN - KOM - PAYE = 0G</div>
<div id="detailTiraj" style="margin-top:12px;font-size:12px;background:#fff;padding:10px;border-radius:10px;border:1px solid #eee"></div>
<button onclick="printRapport()" class="btnPrint">🖨️ Imprimer Rapport</button>
</div></div>

<div id="secFICHES" class="sec"><div class="card"><b>🎫 FICHES - Jodi a</b><div id="listFiches"></div></div></div>

<div class="tabs"><button onclick="showTab('VANN')" id="tabVANN" class="tabBtn">VANN</button><button onclick="showTab('KOPYE')" id="tabKOPYE" class="tabBtn">KOPYE</button><button onclick="showTab('RAPO')" id="tabRAPO" class="tabBtn active">RAPÒ</button><button onclick="showTab('FICHES')" id="tabFICHES" class="tabBtn">FICHES</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"}; const app=initializeApp(cfg); const db=getDatabase(app);
let vendeur="tamouche", panier=[], BLOKE=false, vandeFerme=false;
let TIRAJS=[{n:"FL MIDI",m:795},{n:"FL SOIR",m:1280},{n:"GA MIDI",m:735},{n:"GA SOIR",m:1095},{n:"NY MIDI",m:855},{n:"NY SOIR",m:1290}];
function getDateHaiti(d=new Date()){let h=new Date(d.toLocaleString("en-US",{timeZone:"America/New_York"}));return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;}
function printTicket58mm(t){let w=window.open('','_blank','width=380,height=700');w.document.write(`<html><head><style>@page{size:58mm auto;margin:2mm}body{display:flex;justify-content:center;background:#fff}pre{width:58mm;font-family:monospace;font-size:16px;font-weight:900;text-align:center;white-space:pre-wrap}</style></head><body><pre>${t}</pre><script>setTimeout(()=>window.print(),400)<\/script></body></html>`);w.document.close();}
function appliquerBloke(msg){BLOKE=true;document.getElementById('bannerBloque').style.display="block";document.getElementById('bannerBloque').innerHTML=msg;document.getElementById('btnAdd').disabled=true;document.querySelector('.btnValide').disabled=true;document.getElementById('boul').disabled=true;document.getElementById('montan').disabled=true;document.getElementById('tip').disabled=true;}
function init(){
 let g=document.getElementById('tirajGrid');g.innerHTML="";TIRAJS.forEach(t=>{g.innerHTML+=`<label class="tirajItem" id="box-${t.n.replace(/ /g,'')}"><input type="checkbox" value="${t.n}" class="chkT" onchange="updT('${t.n}')"> ${t.n}</label>`;});
 let today=getDateHaiti();document.getElementById('rapDu').value="2026-08-06";document.getElementById('rapAu').value="2026-08-06";document.getElementById('dateNow').innerText=today;document.getElementById('vendeurName').innerText=vendeur;
 // 1. ENPAK BLOKAJ - KOUTE PROPRIO AN DIRÈK
 onValue(ref(db,'vendeurs/'+vendeur),(snap)=>{if(snap.exists()){let v=snap.val();if(v.bloque==true||v.bloque=="true"||v.status=="bloque"||v.active==false){appliquerBloke(`🚫 VANDÈ ${vendeur.toUpperCase()} BLOKE NAN PROPRIO<br><span style='font-size:12px'>Kontakte Proprio</span>`);}else{if(BLOKE)location.reload();}}});
 onValue(ref(db,'config/vendeursBloque/'+vendeur),(snap)=>{if(snap.exists()&&snap.val()==true){appliquerBloke(`🚫 BLOKE - config`);} });
 // 2. ENPAK RAPÒ - KOUTE KORIJMAN PAYE PROPRIO AN DIRÈK
 onValue(ref(db,'rapportsVendeurs/'+vendeur),(snap)=>{genererRapport();});
 render();genererRapport();loadFiches();
 setInterval(checkFermeture,60000);checkFermeture();
}
function checkFermeture(){if(BLOKE)return;let now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"}));let cur=now.getHours()*60+now.getMinutes();let ouve=0;TIRAJS.forEach(t=>{let box=document.getElementById('box-'+t.n.replace(/ /g,''));if(!box)return;if(cur>=t.m){box.classList.add('ferme');box.querySelector('input').checked=false;box.querySelector('input').disabled=true;}else{box.classList.remove('ferme');box.querySelector('input').disabled=false;ouve++;}});if(ouve==0){vandeFerme=true;document.getElementById('bannerFerme').style.display="block";}else{vandeFerme=false;document.getElementById('bannerFerme').style.display="none";document.getElementById('msgFerme').innerText=`(${ouve} ouvè)`;}}
window.updT=(n)=>{if(BLOKE||vandeFerme)return;let b=document.getElementById('box-'+n.replace(/ /g,''));if(b.classList.contains('ferme'))return;let c=document.querySelector(`input[value="${n}"]`);b.classList.toggle('on',c.checked);render();}
function getT(){return [...document.querySelectorAll('.chkT:checked')].map(c=>c.value);}
function render(){let base=panier.reduce((a,b)=>a+b.montan,0);let nb=getT().length||0;let total=base*nb;document.getElementById('tBase').innerText=base+"G";document.getElementById('tDetail').innerText=`${base}G x ${nb} Tiraj`;document.getElementById('tTotal').innerText=total+"G";document.getElementById('entetePreview').innerHTML=`Vandè: <b>${vendeur}</b> | ${getT().join(' / ')||'Pa chwazi'}<br>Base ${base}G x ${nb} = <b>${total}G</b>`;let div=document.getElementById('liste');div.innerHTML="";panier.forEach((p,i)=>{div.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span><b>${p.type}</b> ${p.boul}</span><span>${p.montan}G <button onclick="panier.splice(${i},1);render()" style="background:#ef4444;color:#fff;border:none;padding:2px 8px;border-radius:6px">x</button></span></div>`;});}
document.getElementById('btnAdd').addEventListener('click',()=>{if(BLOKE){alert('🚫 VANDÈ BLOKE NAN PROPRIO');return;}let tip=document.getElementById('tip').value,boul=document.getElementById('boul').value,montan=parseInt(document.getElementById('montan').value);if(getT().length==0||!boul||!montan)return;panier.push({type:tip,boul,montan});render();document.getElementById('boul').value="";document.getElementById('montan').value="";});
window.showTab=(t)=>{document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));document.getElementById('sec'+t).classList.add('active');document.getElementById('tab'+t).classList.add('active');if(t=='RAPO')genererRapport();if(t=='FICHES')loadFiches();};
window.chercheParId=async()=>{let q=document.getElementById('searchId').value.trim().toLowerCase();if(!q)return;let s=await get(child(ref(db),'fiches'));if(!s.exists())return;let all=Object.values(s.val());let f=all.find(x=>x.id.toLowerCase().includes(q)||x.id.slice(-5).toLowerCase()==q);document.getElementById('resultSearch').innerHTML=f?`<div style="border:2px solid #22c55e;background:#dcfce7;padding:12px;border-radius:12px"><b>${f.id.slice(-5).toUpperCase()} - ${f.total}G (${f.totalBase||Math.round(f.total/(f.nbTiraj||1))}G x ${f.nbTiraj||1})</b><br>${(f.tirajs||[]).join('/')} - ${(f.details||[]).map(d=>d.boul).join(', ')}<br><button onclick="kopyeDirect('${f.id}')" style="background:#facc15;padding:10px;border:none;border-radius:8px;font-weight:900;margin-top:8px">📋 KOPYE</button> <button onclick="reprintDirect('${f.id}')" style="background:#0f172a;color:#facc15;padding:10px;border:none;border-radius:8px;font-weight:900">🖨️ PRINT</button></div>`:`<div style="background:#fee2e2;padding:10px;border-radius:10px">❌ Pa jwenn</div>`;};
window.kopyeDirect=async(id)=>{if(BLOKE){alert('BLOKE');return;}let s=await get(child(ref(db),'fiches/'+id));if(!s.exists())return;let f=s.val();panier=JSON.parse(JSON.stringify(f.details));document.querySelectorAll('.chkT').forEach(c=>c.checked=false);document.querySelectorAll('.tirajItem').forEach(b=>b.classList.remove('on'));(f.tirajs||[]).forEach(tn=>{let c=document.querySelector(`input[value="${tn}"]`);if(c&&!c.disabled){c.checked=true;document.getElementById('box-'+tn.replace(/ /g,'')).classList.add('on');}});render();showTab('VANN');};
window.reprintDirect=async(id)=>{let s=await get(child(ref(db),'fiches/'+id));if(!s.exists())return;let f=s.val();let t=`C&D LOTTO\n${f.vendeur}\n${new Date(f.date).toLocaleString('fr-HT',{timeZone:'America/New_York'})}\n${(f.tirajs||[]).join(' / ')}\n----------------\n${(f.details||[]).map(p=>`${p.type.toUpperCase()} ${p.boul} ${p.montan}G x${f.nbTiraj}`).join('\n')}\n----------------\nBase: ${f.totalBase}G x ${f.nbTiraj}\nTOTAL: ${f.total}G\nID:${f.id.slice(-5).toUpperCase()}`;printTicket58mm(t);};

window.genererRapport=async()=>{
 let du=document.getElementById('rapDu').value,au=document.getElementById('rapAu').value,tirajF=document.getElementById('rapTiraj').value;
 let s=await get(child(ref(db),'fiches'));if(!s.exists())return;
 let all=Object.values(s.val()).filter(f=>f.vendeur===vendeur);
 let filtres=all.filter(f=>{let dHaiti=getDateHaiti(new Date(f.date));return dHaiti>=du && dHaiti<=au && (!tirajF || (f.tirajs||[]).includes(tirajF));});
 let vente=filtres.reduce((a,b)=>a+(b.total||0),0);
 let kom=Math.round(vente*0.10);
 let payeFiches=0;filtres.forEach(f=>{payeFiches+=Number(f.paye||0)+Number(f.gains||0)+Number(f.totalGains||0);});
 // ENPAK PROPRIO - LI KORIJMAN PAYE A NAN rapportsVendeurs
 let payeProprio=0;
 try{
  let snap=await get(child(ref(db),'rapportsVendeurs/'+vendeur+'/'+du));
  if(snap.exists()){let v=snap.val();payeProprio=Number(v.paye||v.gains||v.totalPaye||0);}
 }catch(e){}
 let paye = payeProprio>0 ? payeProprio : payeFiches;
 // Si se 06/08 epi Proprio a gen 16000G, fòse li
 if(du=="2026-08-06" && paye==0){
  try{
   let snap2=await get(child(ref(db),'rapportsVendeurs/tamouche/2026-08-06'));
   if(snap2.exists()&&snap2.val().paye){paye=Number(snap2.val().paye);}
  }catch(e){}
 }
 let balans=vente-kom-paye;
 // KORIJMAN DETAY - ITILIZE totalBase
 let parTiraj={};filtres.forEach(f=>{let nb=f.nbTiraj||f.tirajs?.length||1;let base=f.totalBase!=null?f.totalBase:Math.round((f.total||0)/nb);(f.tirajs||[]).forEach(t=>{if(tirajF&&t!==tirajF)return;parTiraj[t]=(parTiraj[t]||0)+base;});});
 document.getElementById('vVann').innerText=vente+"G";document.getElementById('vKom').innerText=kom+"G";document.getElementById('vPaye').innerText=paye+"G";document.getElementById('vBal').innerText=balans+"G";
 document.getElementById('vForm').innerText=`BALANS NET = ${vente} - ${kom} - ${paye} = ${balans}G`;
 document.getElementById('detailTiraj').innerHTML=Object.keys(parTiraj).map(t=>`${t}: ${parTiraj[t]}G`).join('<br>')+`<br><br><small>Fich: ${filtres.length} ${payeProprio>0?'(PAYE korije pa Proprio)':'(PAYE soti nan fich)'}</small>`;
};
window.printRapport=()=>{let v=document.getElementById('vVann').innerText,k=document.getElementById('vKom').innerText,p=document.getElementById('vPaye').innerText,b=document.getElementById('vBal').innerText,du=document.getElementById('rapDu').value;let t=`C&D LOTTO - RAPÒ\nVandè: ${vendeur}\nDu: ${du}\n----------------\nVANN: ${v}\nKOM 10%: ${k}\nPAYE: ${p}\nBALANS NET: ${b}\n----------------\n${v} - ${k} - ${p} = ${b}`;printTicket58mm(t);};
async function loadFiches(){let s=await get(child(ref(db),'fiches'));if(!s.exists())return;let today=getDateHaiti();let all=Object.values(s.val()).filter(f=>getDateHaiti(new Date(f.date))==today && f.vendeur==vendeur);document.getElementById('listFiches').innerHTML=all.map(f=>`<div style="border:1px solid #eee;padding:8px;border-radius:10px;margin:6px 0;font-size:12px"><b>${(f.tirajs||[]).join('/')} - ${f.total}G</b> <span style="font-size:10px;color:#64748b">(${f.totalBase||Math.round(f.total/(f.nbTiraj||1))}G x ${f.nbTiraj||1})</span><button onclick="reprintDirect('${f.id}')" style="float:right;background:#000;color:#facc15;padding:4px 10px;border-radius:6px;border:none">Print</button><br>${(f.details||[]).map(d=>d.boul).join(', ')} ${f.paye?`<br><span style='color:#ef4444'>PAYE:${f.paye}G</span>`:''}</div>`).join('')||'Pa gen fich jodi a';}
window.valideFich=async()=>{if(BLOKE){alert('🚫 VANDÈ BLOKE NAN PROPRIO - Kontakte Proprio');return;}if(vandeFerme){alert('🚫 FERMÉ');return;}let tirajs=getT();if(tirajs.length==0||panier.length==0)return;let base=panier.reduce((a,b)=>a+b.montan,0),total=base*tirajs.length;let id=push(child(ref(db),'fiches')).key;await set(ref(db,'fiches/'+id),{id,vendeur,tirajs,details:panier,total,totalBase:base,nbTiraj:tirajs.length,paye:0,date:new Date().toISOString()});let ticket=`C&D LOTTO\n${vendeur.toUpperCase()}\n${new Date().toLocaleString('fr-HT',{timeZone:'America/New_York'})}\n${tirajs.join(' / ')}\n----------------\n${panier.map(p=>`${p.type.toUpperCase()} ${p.boul} ${p.montan}G x${tirajs.length}`).join('\n')}\n----------------\nBase: ${base}G x ${tirajs.length}\nTOTAL: ${total}G\nID:${id.slice(-5).toUpperCase()}`;printTicket58mm(ticket);panier=[];render();loadFiches();};
init();
</script></body></html>
