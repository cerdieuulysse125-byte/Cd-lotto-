<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V111 GAIN FIX FINAL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f2f2f2}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:bold}.card{background:#fff;padding:14px;margin:10px;border-radius:14px;max-width:700px;margin:10px auto}input,select{padding:12px;border:2px solid #000;border-radius:12px;width:100%;margin:4px 0;font-size:16px;background:#fff}label{font-size:12px;font-weight:bold;display:block}.btn{background:#000;color:#FFD700;font-weight:bold;border:none;padding:14px;width:100%;margin:8px 0;border-radius:12px;font-size:16px}.tab{display:flex;background:#000;overflow-x:auto;position:sticky;top:0;z-index:99}.tab button{padding:12px 14px;background:#000;color:#FFD700;border:none;font-weight:bold;font-size:13px;white-space:nowrap}.tab button.active{background:#FFD700;color:#000}.line{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #ddd;gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.log{background:#111;color:#0f0;padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;max-height:400px;overflow:auto;margin-top:8px;border:2px solid #0f0}</style>
</head><body>
<div class="h">C&D PROPRIO V111 - GAIN FIX FINAL</div>
<div class="tab">
<button onclick="showTab('resultats',this)" class="active">Résultats - KORIJE</button>
<button onclick="showTab('rapports',this)">Rapports - VERIFYE GAIN</button>
</div>

<div id="resultats" class="card">
<h3>🎯 KORIJE FICH - V111 FINAL</h3>
<div style="background:#fff3cd;padding:8px;border-radius:8px;font-size:12px;margin-bottom:8px">📌 Chwazi tiraj ki koresponn ak fich Tamouche yo nan foto ou a: <b>FL soir ak NY soir</b></div>
<select id="resTirage"><option>FL soir</option><option>NY soir</option><option>GA midi</option><option>GA soir</option><option>FL midi</option><option>NY midi</option></select>
<input id="resDate" type="date">
<div class="grid2"><div><label>1er Lot (mete 25 pou teste si fich gen 25)</label><input id="r1" placeholder="ex: 25"></div><div><label>2e Lot</label><input id="r2"></div></div>
<div class="grid2"><div><label>3e Lot</label><input id="r3"></div><div><label>Loto3</label><input id="rL3"></div></div>
<div class="grid2"><div><label>Loto4</label><input id="rL4"></div><div><label>Loto5</label><input id="rL5"></div></div>

<button class="btn" onclick="publierResultat()" style="background:green;color:#fff;font-size:20px">1️⃣ PUBLIER & KORIJE</button>
<button class="btn" onclick="korijeToutSansFiltre()" style="background:#FFD700;color:#000">2️⃣ KORIJE FÒS - TOUT FICH (si 1 pa mache)</button>
<button class="btn" onclick="diagnostic()" style="background:#222;color:#fff">3️⃣ DIAGNOSTIC - Montre 1 fich ki jan li ekri</button>

<div id="korijeStatus" style="margin-top:10px;padding:12px;background:#000;color:#FFD700;border-radius:8px;font-weight:bold;min-height:50px">Tann rezilta...</div>
<div id="logBox" class="log" style="display:none"></div>
<div id="resHist" style="margin-top:10px"></div>
</div>

<div id="rapports" class="card" style="display:none">
<h3>📑 Verifye si Gain korije</h3>
<input id="du" type="date"><input id="au" type="date">
<select id="filtreTirage"><option value="tous">Tous</option><option>GA midi</option><option>GA soir</option><option>FL midi</option><option>FL soir</option><option>NY midi</option><option>NY soir</option></select>
<select id="filtreVendeur"><option value="tous">Tous</option></select>
<button class="btn" onclick="genGlobal()">Générer Rapport - Gade Gain</button>
<div id="rapG"></div><div id="fichesG"></div>
</div>

<script>
const firebaseConfig={databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com"}; firebase.initializeApp(firebaseConfig); const db=firebase.database();
let cfg={};
function showTab(id,btn){['resultats','rapports'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none'); document.querySelectorAll('.tab button').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active');}
function getLocalDateStr(){const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function getDateStrFromTS(ts){const d=new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
db.ref('config').on('value',s=>{cfg=s.val()||{}; const today=getLocalDateStr(); if(!resDate.value) resDate.value=today; if(!du.value) du.value=today; if(!au.value) au.value=today;});
db.ref('vendors').on('value',s=>{const all=s.val()||{}; const sel=document.getElementById('filtreVendeur'); const cur=sel.value; sel.innerHTML='<option value="tous">Tous</option>'+Object.keys(all).map(k=>'<option value="'+k+'">'+k+'</option>').join(''); if(cur) sel.value=cur;});

function publierResultat(){
 if(!r1.value) return alert('Mete 1er lot - mete 25 pou teste paske fich ou yo gen anpil boul');
 const tirage=resTirage.value; const date=resDate.value||getLocalDateStr();
 const key=tirage.replace(/\s/g,'_')+'_'+date;
 const data={tirage,date,r1:r1.value.trim().padStart(2,'0'),r2:r2.value.trim().padStart(2,'0'),r3:r3.value.trim().padStart(2,'0'),l3:rL3.value.trim(),l4:rL4.value.trim(),l5:rL5.value.trim(),ts:Date.now()};
 document.getElementById('korijeStatus').innerHTML='⏳ Pibliye '+tirage+'...';
 db.ref('resultats/'+key).set(data).then(()=>korijeFonksyon(data,false));
}

function korijeFonksyon(res, sansFiltre){
 const p1=50,p2=20,p3=10,pM=1000,pL3=500,pL4=5000,pL5=25000;
 document.getElementById('logBox').style.display='block';
 document.getElementById('logBox').innerText='🔍 KÒMANSE KORIJE...\nTiraj: '+res.tirage+' 1er='+res.r1+' 2e='+res.r2+' 3e='+res.r3+'\nMode: '+(sansFiltre?'TOUT FICH':'Sèlman '+res.tirage)+'\n\n';
 document.getElementById('korijeStatus').innerHTML='⏳ Korije...';
 let log='';
 db.ref('fiches').once('value',snap=>{
   const all=snap.val()||{}; let totalFiches=0, fichTcheke=0, win=0, totalGain=0;
   totalFiches=Object.keys(all).length;
   log+='Total fich nan baz: '+totalFiches+'\n';
   Object.keys(all).forEach(id=>{
     const f=all[id];
     if(!f) return;
     if(!sansFiltre){
       if(!f.tiraj) return;
       if(!f.tiraj.includes(res.tirage)) return;
     }
     fichTcheke++;
     let g=0;
     // METÒD 1: details
     let details = f.details || [];
     // METÒD 2: si pa gen details, li nan ticketHtml ak regex laj
     if(details.length===0){
       const html = f.ticketHtml || '';
       // Chèche tout fòm: "25 - 10$", "Bor 25 - 10$", "25 - 100$"
       const regex = /(\d{2,5})\D{1,10}(\d+)\$/g;
       let m; let count=0;
       while((m=regex.exec(html))!==null && count<30){
         const boul=m[1]; const mise=m[2];
         if(boul.length>=2 && boul.length<=5 && parseInt(mise)>0){
           details.push({boul:boul, mise:parseInt(mise), jeu:'Borlette'});
           count++;
         }
       }
     }
     if(details.length===0){
       log+='⚠️ Fich '+id.slice(-6)+' '+f.vendor+' '+f.tiraj+' PA GEN BOUL DETEKTE - ticketHtml: '+(f.ticketHtml||'').substring(0,100)+'\n';
     }
     details.forEach(d=>{
       const boulRaw=(d.boul||'').toString().trim();
       const boul = boulRaw.replace(/[^0-9]/g,'') || boulRaw;
       const mise=parseInt(d.mise)||0;
       if(!boul) return;
       const b2=boul.padStart(2,'0').slice(-2);
       const r1=res.r1.padStart(2,'0').slice(-2);
       const r2=res.r2.padStart(2,'0').slice(-2);
       const r3=res.r3.padStart(2,'0').slice(-2);
       if(b2===r1 && res.r1){ g+=mise*p1; log+='✅ WIN 1er! Fich '+id.slice(-4)+' Vandè '+f.vendor+' Boul '+boul+' Mise '+mise+'$ Gain '+mise*p1+'$\n'; }
       else if(b2===r2 && res.r2){ g+=mise*p2; log+='✅ WIN 2e! Boul '+boul+'\n'; }
       else if(b2===r3 && res.r3){ g+=mise*p3; log+='✅ WIN 3e! Boul '+boul+'\n'; }
       if(res.l3 && boul===res.l3){ g+=mise*pL3; log+='✅ WIN LOTO3 '+boul+'\n'; }
       if(res.l4 && boul===res.l4){ g+=mise*pL4; log+='✅ WIN LOTO4\n'; }
       if(res.l5 && boul===res.l5){ g+=mise*pL5; log+='✅ WIN LOTO5\n'; }
     });
     db.ref('fiches/'+id+'/gain').set(g);
     if(g>0) win++;
     totalGain+=g;
   });
   log+='\n--- REZIME ---\nFich tcheke: '+fichTcheke+' / '+totalFiches+'\nFich genyen: '+win+'\nTotal Peye: '+totalGain+'$\n';
   if(fichTcheke===0) log+='\n❌ OKENN FICH PA TCHEKE! Sa vle di tiraj ou chwazi a pa koresponn ak fich yo. Chwazi FL soir oswa NY soir jan nan foto ou a.\n';
   if(win===0 && fichTcheke>0) log+='\n⚠️ Okenn boul pa koresponn. Egzanp ou mete 1er='+res.r1+' men fich yo pa gen '+res.r1+'. Teste ak yon boul ou konnen ki nan fich la.\n';
   document.getElementById('logBox').innerText=log;
   document.getElementById('korijeStatus').innerHTML='✅ Fich tcheke: '+fichTcheke+'<br>🎯 Genyen: '+win+'<br>💰 Total Peye: '+totalGain+'$<br>'+(win>0?'<span style=color:#0f0>SUCCÈS! Ale nan Rapports pou wè Gain</span>':'<span style=color:red>Pa gen genyen - li log anba</span>');
   loadHist();
 });
}

function korijeToutSansFiltre(){
 db.ref('resultats').once('value',s=>{
   const all=Object.values(s.val()||{}).sort((a,b)=>b.ts-a.ts);
   if(all.length===0) return alert('Pa gen rezilta pibliye, pibliye youn dabò');
   const last=all[0];
   if(confirm('KORIJE FÒS: ap korije TOUT fich ak dènye rezilta '+last.tirage+' 1er='+last.r1+'?')) korijeFonksyon(last,true);
 });
}

function diagnostic(){
 db.ref('fiches').limitToLast(1).once('value',s=>{
   const all=Object.values(s.val()||{});
   if(all.length===0) return alert('Pa gen fich');
   const f=all[0];
   let txt='DIAGNOSTIC - Dènye fich:\nID: '+f.id+'\nVandè: '+f.vendor+'\nTiraj: '+f.tiraj+'\nTotal: '+f.total+'\nDateStr: '+f.dateStr+'\nGain aktyèl: '+f.gain+'\n\nDetails: '+JSON.stringify(f.details||[]).substring(0,500)+'\n\nTicketHtml (1000 karaktè):\n'+(f.ticketHtml||'').substring(0,1000);
   document.getElementById('logBox').style.display='block';
   document.getElementById('logBox').innerText=txt;
   document.getElementById('korijeStatus').innerHTML='Diagnostic fich '+f.id.slice(-6)+' - gade log vèt anba';
 });
}

function loadHist(){db.ref('resultats').once('value',s=>{const all=s.val()||{}; let h='<h4>Dènye Rezilta</h4>'; Object.values(all).sort((a,b)=>b.ts-a.ts).slice(0,10).forEach(r=>{h+='<div class="line" style="font-size:12px"><b>'+r.tirage+' '+r.date+'</b> 1:'+r.r1+' 2:'+r.r2+' 3:'+r.r3+'</div>';}); document.getElementById('resHist').innerHTML=h;});}
function genGlobal(){const duV=du.value,auV=au.value,fT=filtreTirage.value,fV=filtreVendeur.value; db.ref('fiches').once('value',snap=>{const all=Object.values(snap.val()||{}); let vente=0,gain=0,cnt=0,html=''; all.forEach(f=>{const fdStr=f.dateStr||getDateStrFromTS(f.date); if(duV&&fdStr<duV)return; if(auV&&fdStr>auV)return; if(fT!=='tous'&&!(f.tiraj||'').includes(fT))return; if(fV!=='tous'&&f.vendor!==fV)return; const v=(f.total||0)*(f.nbTiraj||1); vente+=v; gain+=f.gain||0; cnt++; const winStyle=f.gain>0?'background:#d4edda;border-left:5px solid green':''; html+='<div class="line" style="'+winStyle+'"><span><b>'+f.vendor+'</b> '+f.tiraj+' '+v+'$ '+(f.gain?'<b style=color:green;font-size:16px>G:'+f.gain+'$</b>':'<span style=color:#999>G:0$</span>')+'</span></div>';}); const com=cfg.commission||{pct:10,active:true}; const pct=com.active?com.pct:0; const comV=Math.round(vente*pct/100); document.getElementById('rapG').innerHTML='<div style="border:3px solid #000;padding:12px"><b>Vant:</b> '+vente+'$ <b>Com:</b> '+comV+'$ <b style=color:green>Gain:</b> '+gain+'$<div style="font-size:22px;font-weight:bold;background:#000;color:#FFD700;padding:8px;border-radius:8px;text-align:center">Net: '+(vente-comV-gain)+'$</div></div>'; document.getElementById('fichesG').innerHTML=html||'Pa gen fich';});}
</script></body></html>
