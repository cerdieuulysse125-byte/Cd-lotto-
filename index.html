<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D PROPRIO V6.14 RAPÒ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Arial}
.h{background:#FFD700;color:#000;text-align:center;padding:10px;font-weight:900;border-bottom:3px solid #000}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#000;padding:2px;position:sticky;top:0;z-index:99}
.tab{padding:10px 2px;text-align:center;font-size:9px;font-weight:900;background:#fff;color:#000;border:none}.tab.active{background:#FFD700}
.page{display:none;padding:10px;background:#fff;min-height:80vh}.page.active{display:block}
.card{background:#fff;border:2px solid #000;padding:10px;margin:6px 0;border-radius:14px}
.card input,.card select{width:100%;padding:7px;margin:3px 0;border:2px solid #000;font-weight:900;border-radius:12px;font-size:11px}
.btn{background:#000;color:#FFD700;padding:10px;text-align:center;font-weight:900;border:2px solid #000;margin:6px 0;border-radius:20px}.btnJ{background:#FFD700;color:#000}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:4px;font-size:9px;text-align:center;font-weight:900}th{background:#FFD700}
.row{display:flex;gap:5px;margin:4px 0}
.ligneRap{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #000;font-weight:900;font-size:13px}.ligneRap.b{background:#FFD700}.ligneRap.g{background:#000;color:#FFD700}.ligneRap.gr{background:#00A000;color:#fff}
.kaz{border:2px solid #000;border-radius:14px;padding:8px;margin:8px 0;background:#fff}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head><body>
<div class="h">C&D PROPRIO V6.14 - RAPÒ COMPLET</div>
<div class="tabs"><button class="tab active" onclick="op(1)">A.VANDÈ</button><button class="tab" onclick="op(2)">B.LIMIT</button><button class="tab" onclick="op(3)">C.LÈ</button><button class="tab" onclick="op(4)">D.PRIX</button><button class="tab" onclick="op(5)">E.REZILTA</button><button class="tab active" onclick="op(6)">F.RAPÒ</button><button class="tab" onclick="op(7)">G.ENTÈT</button></div>
<div id="p1" class="page"><div class="card"><input id="vNom" placeholder="Non"><input id="vPass" placeholder="Modpas"><input id="vCom" type="number" value="10" style="max-width:60px"><button class="btn btnJ" onclick="addV()">+ AJOUTE</button><div id="vList"></div></div></div>
<div id="p2" class="page"><div class="card"><input id="lBolet" type="number" value="1500"><input id="lMaryaj" type="number" value="100"><input id="lLoto3" type="number" value="100"><input id="lLoto4" type="number" value="20"><input id="lLoto5" type="number" value="5"><div class="btn btnJ" onclick="saveLimit()">SAVE LIMIT</div></div></div>
<div id="p3" class="page"><div class="card"><input id="hGaMidi" type="time" value="12:15"><input id="hFlMidi" type="time" value="13:15"><input id="hNyMidi" type="time" value="14:15"><input id="hGaSoir" type="time" value="18:15"><input id="hFlSoir" type="time" value="21:15"><input id="hNySoir" type="time" value="22:15"><div class="btn btnJ" onclick="saveHeure()">SAVE LÈ</div></div></div>
<div id="p4" class="page"><div class="card"><input id="p1er" type="number" value="50"><input id="p2e" type="number" value="20"><input id="p3e" type="number" value="10"><input id="pMaryaj" type="number" value="1000"><input id="pLoto3" type="number" value="500"><input id="pLoto4" type="number" value="5000"><input id="pLoto5" type="number" value="25000"><div class="btn btnJ" onclick="savePrix()">SAVE PRIX</div></div></div>
<div id="p5" class="page"><div class="card"><select id="rTiraj"><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><input type="date" id="rDate"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0"><input id="r1er" placeholder="1er" oninput="autoM()"><input id="r2e" placeholder="2e" oninput="autoM()"><input id="r3e" placeholder="3e" oninput="autoM()"><input id="rM1" placeholder="M1" readonly><input id="rM2" placeholder="M2" readonly><input id="rM3" placeholder="M3" readonly><input id="rL3" placeholder="L3"><input id="rL4" placeholder="L4"><input id="rL5" placeholder="L5"></div><div class="btn btnJ" onclick="saveRes()">SAVE REZILTA</div><div id="tabRes"></div></div></div>
<div id="p6" class="page active"><div class="card">

<div style="background:#000;color:#FFD700;padding:8px;font-weight:900;text-align:center;border-radius:10px">RAPPORT PROPRIO - TOUT VANDÈ</div>

<div class="kaz"><div style="font-size:10px;font-weight:900;text-align:center">Du... Au...</div><div style="display:flex;gap:4px;margin-top:4px"><input type="date" id="rapDu"><input type="date" id="rapAu"></div></div>

<div class="kaz" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><div style="font-size:10px;font-weight:900;text-align:center">Vendeurs (..., tous)</div><select id="rapVend"><option value="tous">TOUS VENDEURS</option></select></div><div><div style="font-size:10px;font-weight:900;text-align:center">Tirage (..., tous)</div><select id="rapTir"><option value="tous">TOUS TIRAGES</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select></div></div>

<div class="kaz" style="background:#f9f9f9">
<div class="ligneRap"><span>Vente</span><b id="rapVente">$0</b></div>
<div class="ligneRap b"><span>Commission</span><b id="rapCom">$0</b></div>
<div class="ligneRap gr"><span>A payer (Gain kliyan)</span><b id="rapApayer">$0</b></div>
<div class="ligneRap g"><span>Balance net</span><b id="rapBalance">$0</b></div>
</div>

<div class="btn" onclick="calcRap()">📊 KALKILE RAPÒ PROPRIO</div>
<div class="btn" style="background:#fff;color:#000" onclick="imprimerProprio()">🖨️ IMPRIMER RAPÒ</div>
<div id="rapDet" style="margin-top:8px"></div>
<div id="rapDetGain" style="font-size:9px;margin-top:6px"></div>

</div></div>
<div id="p7" class="page"><div class="card"><input id="eNom" value="C&D VÉRITÉ LOTTO"><input id="eTel"><input id="eAddr"><input id="ePied"><div class="btn btnJ" onclick="saveEnt()">SAVE</div></div></div>
<script>
const firebaseConfig = {apiKey: "AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain: "cd-lotto.firebaseapp.com",databaseURL: "https://cd-lotto-default-rtdb.firebaseio.com",projectId: "cd-lotto",storageBucket: "cd-lotto.firebasestorage.app",messagingSenderId: "671091732195",appId: "1:671091732195:web:51bcfe8df83bc58fc75fd6",measurementId: "G-TWK9N38BS0"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function haitiISO(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Port-au-Prince'});}function haitiFR(){return new Date().toLocaleDateString('fr-HT',{timeZone:'America/Port-au-Prince',day:'2-digit',month:'2-digit',year:'numeric'});}function haitiHeure(){return new Date().toLocaleTimeString('fr-HT',{timeZone:'America/Port-au-Prince',hour:'2-digit',minute:'2-digit',hour12:true});}
function op(n){document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i+1==n));document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i+1==n));}
let vendeurs=[],ventes=[],RESULTATS=[],PRIX={B1:50,B2:20,B3:10,MARYAJ:1000,L3:500,L4:5000,L5:25000};
db.collection('ventes').onSnapshot(s=>{ventes=[];s.forEach(d=>ventes.push(d.data()));});db.collection('resultats').onSnapshot(s=>{RESULTATS=[];s.forEach(d=>RESULTATS.push(d.data()));});
function autoM(){const a=document.getElementById('r1er').value,b=document.getElementById('r2e').value,c=document.getElementById('r3e').value;document.getElementById('rM1').value=a&&b?a+b:'';document.getElementById('rM2').value=a&&c?a+c:'';document.getElementById('rM3').value=b&&c?b+c:'';}
async function addV(){const nom=document.getElementById('vNom').value.trim(),pass=document.getElementById('vPass').value.trim(),com=parseInt(document.getElementById('vCom').value)||10;if(!nom||!pass)return alert('Non+modpas');await db.collection('vendeurs').add({nom,code:pass,com,ouvert:true,date:haitiISO()});loadVendeurs();}
async function loadVendeurs(){const vs=await db.collection('vendeurs').get();vendeurs=[];vs.forEach(d=>{const vd=d.data();vendeurs.push({id:d.id,nom:vd.nom,pass:vd.code||'',com:vd.com||10,ouvert:vd.ouvert!==false});});let h='<table><tr><th>Non</th><th>Pass</th><th>%</th><th>Etat</th><th>X</th></tr>';vendeurs.forEach((v,i)=>{h+=`<tr><td>${v.nom}</td><td>${v.pass}</td><td>${v.com}%</td><td><button onclick="toggleV('${v.id}',${v.ouvert})" style="background:${v.ouvert?'#0A0':'#F00'};color:#fff;border:none;padding:4px">${v.ouvert?'OUV':'FERM'}</button></td><td><button onclick="delV('${v.id}')">X</button></td></tr>`;});h+='</table>';document.getElementById('vList').innerHTML=h;document.getElementById('rapVend').innerHTML='<option value="tous">TOUS VENDEURS</option>'+[...new Set(vendeurs.map(v=>v.nom))].map(n=>`<option>${n}</option>`).join('');}
async function toggleV(id,etat){await db.collection('vendeurs').doc(id).update({ouvert:!etat});loadVendeurs();}
async function delV(id){if(!confirm('Efase?'))return;await db.collection('vendeurs').doc(id).delete();loadVendeurs();}
async function saveLimit(){const L={BOLET:parseInt(document.getElementById('lBolet').value),MARYAJ:parseInt(document.getElementById('lMaryaj').value),LOTO3:parseInt(document.getElementById('lLoto3').value),LOTO4:parseInt(document.getElementById('lLoto4').value),LOTO5:parseInt(document.getElementById('lLoto5').value)};await db.collection('config').doc('main').set({LIMITS:L},{merge:true});alert('SAVE');}
async function saveHeure(){const H={GA_MIDI:document.getElementById('hGaMidi').value,FL_MIDI:document.getElementById('hFlMidi').value,NY_MIDI:document.getElementById('hNyMidi').value,GA_SOIR:document.getElementById('hGaSoir').value,FL_SOIR:document.getElementById('hFlSoir').value,NY_SOIR:document.getElementById('hNySoir').value};await db.collection('config').doc('main').set({HEURES:H},{merge:true});alert('SAVE');}
async function savePrix(){const P={B1:document.getElementById('p1er').value,B2:document.getElementById('p2e').value,B3:document.getElementById('p3e').value,MARYAJ:document.getElementById('pMaryaj').value,L3:document.getElementById('pLoto3').value,L4:document.getElementById('pLoto4').value,L5:document.getElementById('pLoto5').value};await db.collection('config').doc('main').set({PRIX:P},{merge:true});alert('SAVE');}
async function saveRes(){const r={date:document.getElementById('rDate').value,tiraj:document.getElementById('rTiraj').value,r1:document.getElementById('r1er').value,r2:document.getElementById('r2e').value,r3:document.getElementById('r3e').value,m1:document.getElementById('rM1').value,m2:document.getElementById('rM2').value,m3:document.getElementById('rM3').value,l3:document.getElementById('rL3').value,l4:document.getElementById('rL4').value,l5:document.getElementById('rL5').value};await db.collection('resultats').add(r);alert('SAVE');}
async function saveEnt(){const e={nom:document.getElementById('eNom').value};await db.collection('config').doc('main').set({ENTETE:e},{merge:true});alert('SAVE');}
function getGain(jeux,boul,miz,res){if(!res)return 0;boul=boul.trim();const r1=(res.r1||'').trim(),r2=(res.r2||'').trim(),r3=(res.r3||'').trim(),m1=(res.m1||'').trim(),m2=(res.m2||'').trim(),m3=(res.m3||'').trim(),l3=(res.l3||'').trim(),l4=(res.l4||'').trim(),l5=(res.l5||'').trim();if(jeux==='BOLET'){if(boul===r1)return miz*PRIX.B1;if(boul===r2)return miz*PRIX.B2;if(boul===r3)return miz*PRIX.B3;}if(jeux==='MARYAJ'){if(boul===m1||boul===m2||boul===m3)return miz*PRIX.MARYAJ;}if(jeux==='LOTO3'&&l3&&boul===l3)return miz*PRIX.L3;if(jeux==='LOTO4'&&l4&&boul===l4)return miz*PRIX.L4;if(jeux==='LOTO5'&&l5&&boul===l5)return miz*PRIX.L5;return 0;}
let lastCalcP={vente:0,com:0,apayer:0,balance:0,du:'',au:'',vendeur:'',tirage:''};
function calcRap(){
  const du=document.getElementById('rapDu').value,au=document.getElementById('rapAu').value,vSel=document.getElementById('rapVend').value,tSel=document.getElementById('rapTir').value;
  let tot=0,comTot=0,gainTot=0,parV={},parT={};
  ventes.forEach(f=>{
    if(f.dateISO>=du&&f.dateISO<=au){
      if(vSel!=='tous'&&f.vendeur!==vSel)return;
      const filt= tSel==='tous'? f.tirages : f.tirages.filter(t=>t===tSel);
      if(!filt.length)return;
      const nb= tSel==='tous'? f.nbTiraj : filt.length;
      const calcV= (f.parTiraj||f.base)*nb;
      const c= f.com||10;
      const com=Math.round(calcV*c/100);
      // gains
      let gainF=0;
      filt.forEach(t=>{
        const res=RESULTATS.find(r=>r.date===f.dateISO&&r.tiraj===t);
        if(res){f.list.forEach(l=>{gainF+=getGain(l.jeux,l.boul,l.miz,res);});}
        if(!parT[t])parT[t]={v:0,g:0};parT[t].v+=f.parTiraj||f.base;parT[t].g+=gainF;
      });
      tot+=calcV; comTot+=com; gainTot+=gainF;
      if(!parV[f.vendeur])parV[f.vendeur]={v:0,c:0,g:0};parV[f.vendeur].v+=calcV;parV[f.vendeur].c+=com;parV[f.vendeur].g+=gainF;
    }
  });
  const bal=tot-comTot-gainTot;
  document.getElementById('rapVente').innerText='$'+tot;
  document.getElementById('rapCom').innerText='$'+comTot;
  document.getElementById('rapApayer').innerText='$'+gainTot;
  document.getElementById('rapBalance').innerText='$'+bal;
  let h='<table><tr><th>Vendeur</th><th>Vente</th><th>Com</th><th>A payer (Gain)</th><th>Balance net</th></tr>';
  Object.keys(parV).forEach(v=>{h+=`<tr><td>${v}</td><td>$${parV[v].v}</td><td>$${parV[v].c}</td><td>$${parV[v].g}</td><td style="background:#FFD700"><b>$${parV[v].v-parV[v].c-parV[v].g}</b></td></tr>`;});
  h+='</table><br><table><tr><th>Tirage</th><th>Vente</th><th>Gain</th></tr>';Object.keys(parT).forEach(t=>{h+=`<tr><td>${t}</td><td>$${parT[t].v}</td><td>$${parT[t].g}</td></tr>`;});h+='</table>';
  document.getElementById('rapDet').innerHTML=h;
  lastCalcP={vente:tot,com:comTot,apayer:gainTot,balance:bal,du,au,vendeur:vSel,tirage:tSel};
}
function imprimerProprio(){
  const w=window.open('','','width=500,height=800');
  w.document.write(`<html><head><title>Rapport Proprio</title><style>body{width:80mm;margin:0 auto;font-family:Arial;font-weight:900;text-align:center}.ligne{display:flex;justify-content:space-between;border-bottom:1px solid #000;padding:6px;font-size:12px}.titre{font-size:16px;background:#FFD700;padding:8px;border:2px solid #000}</style></head><body><div class="titre">RAPPORT PROPRIO<br>${lastCalcP.vendeur.toUpperCase()} | ${lastCalcP.tirage.toUpperCase()}</div><div style="font-size:10px;margin:6px 0">Du ${lastCalcP.du} Au ${lastCalcP.au}</div><hr><div class="ligne"><span>Vente</span><b>$${lastCalcP.vente}</b></div><div class="ligne" style="background:#FFD700"><span>Commission</span><b>$${lastCalcP.com}</b></div><div class="ligne" style="background:#00A000;color:#fff"><span>A payer (Gain kliyan)</span><b>$${lastCalcP.apayer}</b></div><div class="ligne" style="background:#000;color:#FFD700;font-size:14px"><span>Balance net</span><b>$${lastCalcP.balance}</b></div><hr><div style="font-size:8px">Imprime ${haitiFR()} ${haitiHeure()}</div><script>setTimeout(()=>{print();},400)<\/script></body></html>`);
}
async function init(){
  const iso=haitiISO();document.getElementById('rapDu').value=iso;document.getElementById('rapAu').value=iso;document.getElementById('rDate').value=iso;
  try{const d=await db.collection('config').doc('main').get();if(d.exists){const c=d.data();if(c.PRIX){PRIX.B1=parseInt(c.PRIX.B1)||50;PRIX.B2=parseInt(c.PRIX.B2)||20;PRIX.B3=parseInt(c.PRIX.B3)||10;PRIX.MARYAJ=parseInt(c.PRIX.MARYAJ)||1000;PRIX.L3=parseInt(c.PRIX.L3)||500;PRIX.L4=parseInt(c.PRIX.L4)||5000;PRIX.L5=parseInt(c.PRIX.L5)||25000;}}}catch(e){}
  await loadVendeurs();
  db.collection('resultats').orderBy('date','desc').limit(30).onSnapshot(s=>{let h='<table><tr><th>Date</th><th>Tiraj</th><th>1er</th><th>2e</th><th>3e</th><th>M1</th><th>M2</th><th>M3</th><th>L3</th><th>L4</th><th>L5</th></tr>';s.forEach(doc=>{const r=doc.data();h+=`<tr><td>${r.date||''}</td><td>${r.tiraj||''}</td><td>${r.r1||''}</td><td>${r.r2||''}</td><td>${r.r3||''}</td><td>${r.m1||''}</td><td>${r.m2||''}</td><td>${r.m3||''}</td><td>${r.l3||''}</td><td>${r.l4||''}</td><td>${r.l5||''}</td></tr>`;});h+='</table>';document.getElementById('tabRes').innerHTML=h;});
}
init();
</script></body></html>
