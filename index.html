<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROPRIO V101 FIX</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f2f2f2}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:bold}.card{background:#fff;padding:12px;margin:8px;border-radius:12px;max-width:650px;margin:8px auto}input,select{padding:12px;border:2px solid #000;border-radius:10px;width:100%;margin:5px 0;font-size:16px}.btn{background:#000;color:#FFD700;font-weight:bold;border:none;padding:13px;width:100%;margin:6px 0;border-radius:10px;font-size:16px}.tab{display:flex;background:#000;overflow:auto;position:sticky;top:0;z-index:9}.tab button{padding:11px 10px;background:#000;color:#FFD700;border:none;font-weight:bold;font-size:12px;white-space:nowrap}.tab button.active{background:#FFD700;color:#000}.line{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #ddd;gap:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style>
</head><body>
<div class="h">C&D PROPRIO V101 - RAPPORT FIX</div>
<div class="tab">
<button onclick="show('tirages',this)">Tirages</button>
<button onclick="show('resultats',this)">Résultats</button>
<button onclick="show('limites',this)">Limites/Prix</button>
<button onclick="show('vendeurs',this)">Vendeurs</button>
<button class="active" onclick="show('rapports',this)">Rapports</button>
<button onclick="show('dash',this)">Dash</button>
</div>

<div id="tirages" class="card" style="display:none"><h3>⏰ Heures - Auto Fermeture</h3><div id="tirageList"></div><label><input id="autoClose" type="checkbox" checked style="width:auto"> Fermeture Auto ON</label><button class="btn" onclick="saveTirages()">Sauvegarder</button></div>

<div id="resultats" class="card" style="display:none"><h3>🎯 Résultats</h3><select id="resTirage"><option>GA midi</option><option>GA soir</option><option>FL midi</option><option>FL soir</option><option>NY midi</option><option>NY soir</option></select><input id="resDate" type="date"><div class="grid2"><div><label>1er Lot</label><input id="r1"></div><div><label>2e Lot</label><input id="r2"></div></div><div class="grid2"><div><label>3e Lot</label><input id="r3"></div><div><label>Loto3</label><input id="rL3"></div></div><div class="grid2"><div><label>Loto4</label><input id="rL4"></div><div><label>Loto5</label><input id="rL5"></div></div><button class="btn" onclick="publierResultat()" style="background:green;color:#fff">PUBLIER & KORIJE</button><div id="resHist"></div></div>

<div id="limites" class="card" style="display:none"><h3>Limites & Prix</h3><div class="grid2"><div><label>Bolèt 1000</label><input id="limBolet" type="number" value="1000"></div><div><label>Maryaj 50</label><input id="limMaryaj" type="number" value="50"></div><div><label>Loto3 100</label><input id="limL3" type="number" value="100"></div><div><label>Loto4 20</label><input id="limL4" type="number" value="20"></div><div><label>Loto5 10</label><input id="limL5" type="number" value="10"></div></div><div class="grid2"><div><label>1e lot 50</label><input id="p1" type="number" value="50"></div><div><label>2e lot 20</label><input id="p2" type="number" value="20"></div><div><label>3e lot 10</label><input id="p3" type="number" value="10"></div><div><label>Maryaj 1000</label><input id="pM" type="number" value="1000"></div><div><label>Loto3 500</label><input id="pL3" type="number" value="500"></div><div><label>Loto4 5000</label><input id="pL4" type="number" value="5000"></div><div><label>Loto5 25000</label><input id="pL5" type="number" value="25000"></div></div><div style="display:flex;gap:6px"><input id="comPct" type="number" value="10" style="width:80px">% <input id="comActive" type="checkbox" checked style="width:auto">Aktive <button class="btn" style="width:auto" onclick="saveCom()">Save Com</button></div><button class="btn" onclick="saveLimitesPrix()">Sauvegarder Limites & Prix</button></div>

<div id="vendeurs" class="card" style="display:none"><h3>Vendeurs</h3><div style="display:flex;gap:6px"><input id="newV" placeholder="Non"><input id="newP" value="1234" style="width:80px"><button class="btn" style="width:auto;background:#FFD700;color:#000" onclick="addV()">+</button></div><div id="vList"></div></div>

<div id="rapports" class="card">
<h3>📑 Rapports avec Gains</h3>
<label>Du</label><input id="du" type="date">
<label>Au</label><input id="au" type="date">
<label>Tirage (..., Tous)</label><select id="filtreTirage"><option value="tous">Tous</option><option>GA midi</option><option>GA soir</option><option>FL midi</option><option>FL soir</option><option>NY midi</option><option>NY soir</option></select>
<label>Vendeur (..., Tous)</label><select id="filtreVendeur"><option value="tous">Tous</option></select>
<button class="btn" onclick="genGlobal()" style="background:#000;color:#FFD700">Générer Rapport</button>
<div id="rapG" style="margin-top:10px"></div>
<div id="fichesG" style="margin-top:10px"></div>
<button class="btn" style="background:#333" onclick="imprimeGlobal()">Enprime</button>
</div>

<div id="dash" class="card" style="display:none"><div id="stat"></div></div>

<script>
const firebaseConfig={databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com"}; firebase.initializeApp(firebaseConfig); const db=firebase.database();
let cfg={},vendorsList={};
function show(id,btn){['tirages','resultats','limites','vendeurs','rapports','dash'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none'); document.querySelectorAll('.tab button').forEach(b=>b.classList.remove('active')); if(btn)btn.classList.add('active');}
function isPast(h){if(!h)return false; const [hh,mm]=h.split(':').map(Number); if(isNaN(hh))return false; const f=new Date(); f.setHours(hh,mm||0,0,0); return new Date()>=f;}
function getTodayLocal(){const d=new Date(); const off=d.getTimezoneOffset(); const local=new Date(d.getTime()-off*60000); return local.toISOString().split('T')[0];}
db.ref('config').on('value',s=>{cfg=s.val()||{}; renderTirages();
 const lim=cfg.limites||{}; limBolet.value=lim.bolet||1000; limMaryaj.value=lim.maryaj||50; limL3.value=lim.loto3||100; limL4.value=lim.loto4||20; limL5.value=lim.loto5||10;
 const prx=cfg.prix||{}; p1.value=prx.p1||50; p2.value=prx.p2||20; p3.value=prx.p3||10; pM.value=prx.maryaj||1000; pL3.value=prx.loto3||500; pL4.value=prx.loto4||5000; pL5.value=prx.loto5||25000;
 comPct.value=(cfg.commission||{}).pct||10; comActive.checked=(cfg.commission||{}).active!==false; autoClose.checked=cfg.autoClose!==false;
 stat.innerHTML='Auto:'+(cfg.autoClose!==false?'ON':'OFF');
 const today=getTodayLocal(); if(!du.value) du.value=today; if(!au.value) au.value=today; if(!resDate.value) resDate.value=today;
});
function renderTirages(){const he=cfg.heures||{}; const et=cfg.tirages||{}; const list=[{id:'gaMidi',l:'GA midi'},{id:'gaSoir',l:'GA soir'},{id:'flMidi',l:'FL midi'},{id:'flSoir',l:'FL soir'},{id:'nyMidi',l:'NY midi'},{id:'nySoir',l:'NY soir'}]; let html=''; list.forEach(o=>{const past=isPast(he[o.id])&&autoClose.checked; html+=`<div class="line"><b>${o.l}</b><input id="h_${o.id}" type="time" value="${he[o.id]||''}" style="width:110px"><select id="e_${o.id}" style="width:90px"><option ${et[o.id]!=='FERME'?'selected':''}>OUVE</option><option ${et[o.id]==='FERME'?'selected':''}>FERME</option></select>${past?'<span style="color:red;font-size:10px">FERME AUTO</span>':''}</div>`;}); tirageList.innerHTML=html;}
function saveTirages(){let he={},ti={}; ['gaMidi','gaSoir','flMidi','flSoir','nyMidi','nySoir'].forEach(id=>{he[id]=document.getElementById('h_'+id).value; ti[id]=document.getElementById('e_'+id).value;}); db.ref('config/heures').set(he); db.ref('config/tirages').set(ti); db.ref('config/autoClose').set(autoClose.checked); alert('Sove');}
function saveCom(){db.ref('config/commission').set({pct:parseInt(comPct.value)||10,active:comActive.checked}).then(()=>alert('Komisyon sove'));}
function saveLimitesPrix(){db.ref('config/limites').set({bolet:parseInt(limBolet.value),maryaj:parseInt(limMaryaj.value),loto3:parseInt(limL3.value),loto4:parseInt(limL4.value),loto5:parseInt(limL5.value)}); db.ref('config/prix').set({p1:parseInt(p1.value),p2:parseInt(p2.value),p3:parseInt(p3.value),maryaj:parseInt(pM.value),loto3:parseInt(pL3.value),loto4:parseInt(pL4.value),loto5:parseInt(pL5.value)}); alert('Sove');}
function publierResultat(){if(!r1.value)return alert('Mete 1er lot'); const tirage=resTirage.value,date=resDate.value||getTodayLocal(); const key=tirage.replace(/\s/g,'_')+'_'+date; const data={tirage,date,r1:r1.value.trim(),r2:r2.value.trim(),r3:r3.value.trim(),l3:rL3.value.trim(),l4:rL4.value.trim(),l5:rL5.value.trim(),ts:Date.now()}; db.ref('resultats/'+key).set(data).then(()=>{alert('Pibliye!'); korije(data);});}
function korije(res){db.ref('fiches').once('value',snap=>{let c=0; Object.entries(snap.val()||{}).forEach(([id][f])=>{if(f.tiraj&&f.tiraj.includes(res.tirage)){let g=0; const prx=cfg.prix||{p1:50,p2:20,p3:10,maryaj:1000,loto3:500,loto4:5000,loto5:25000}; (f.details||[]).forEach(d=>{const b=(d.boul||'').toString(); const m=parseInt(d.mise)||0; const j=(d.jeu||'').toLowerCase(); if(j.includes('maryaj')){ if(b.includes(res.r1)&&b.includes(res.r2) || b.includes(res.r1)&&b.includes(res.r3) || b.includes(res.r2)&&b.includes(res.r3)) g+=m*prx.maryaj; } else if(j.includes('loto4')){if(b==res.l4) g+=m*prx.loto4;} else if(j.includes('loto5')){if(b==res.l5) g+=m*prx.loto5;} else if(j.includes('loto3')||b.length==3){if(b==res.l3) g+=m*prx.loto3;} else {if(b==res.r1) g+=m*prx.p1; else if(b==res.r2) g+=m*prx.p2; else if(b==res.r3) g+=m*prx.p3;}}); db.ref('fiches/'+id+'/gain').set(g); c++;}}); alert(c+' fich korije');});}
db.ref('resultats').on('value',()=>loadHist()); function loadHist(){db.ref('resultats').once('value',s=>{let h='<h4>Rezilta</h4>'; Object.values(s.val()||{}).sort((a,b)=>b.ts-a.ts).slice(0,10).forEach(r=>h+=`<div class=line style=font-size:12px><b>${r.tirage} ${r.date}</b> 1:${r.r1} 2:${r.r2} 3:${r.r3} L3:${r.l3}</div>`); resHist.innerHTML=h;});}
db.ref('vendors').on('value',s=>{vendorsList=s.val()||{}; let h=''; Object.keys(vendorsList).forEach(k=>h+=`<div class=line><b>${k}</b><button onclick="db.ref('vendors/${k}').remove()" style="background:red;color:#fff;border:none;border-radius:5px;padding:5px">X</button></div>`); vList.innerHTML=h; const cur=filtreVendeur.value; filtreVendeur.innerHTML='<option value="tous">Tous</option>'+Object.keys(vendorsList).map(k=>`<option value="${k}">${k}</option>`).join(''); if(cur) filtreVendeur.value=cur;});
function addV(){const n=newV.value.trim(); if(!n)return; db.ref('vendors/'+n).set({name:n,pass:newP.value||'1234',status:'OUVE'}).then(()=>newV.value='');}

// RAPPORT FIX - DAT + FILTRE
function genGlobal(){
 db.ref('fiches').once('value',snap=>{
  const all=Object.values(snap.val()||{});
  const duV=document.getElementById('du').value;
  const auV=document.getElementById('au').value;
  const fT=document.getElementById('filtreTirage').value;
  const fV=document.getElementById('filtreVendeur').value;

  // FIX DAT: pran 00:00:00 ak 23:59:59 lokal
  const start = duV? new Date(duV+'T00:00:00') : null;
  const end = auV? new Date(auV+'T23:59:59') : null;

  let vente=0,gain=0,cnt=0,html='';
  all.forEach(f=>{
   const fd = new Date(f.date);
   if(start && fd < start) return;
   if(end && fd > end) return;
   if(fT!=='tous' &&!(f.tiraj||'').includes(fT)) return;
   if(fV!=='tous' && f.vendor!==fV) return;
   const v=(f.total||0)*(f.nbTiraj||f.nb||1);
   vente+=v; gain+=f.gain||0; cnt++;
   html+=`<div class=line><span><b>${f.vendor}</b> ${f.tiraj} V:${v}$ ${f.gain?'<b style=color:green>G:'+f.gain+'$</b>':''}</span><span style=font-size:10px>${fd.toLocaleString()}</span></div>`;
  });

  const com=cfg.commission||{pct:10,active:true};
  const pct=com.active!==false?(com.pct||10):0;
  const comV=Math.round(vente*pct/100);
  const paye=gain; // Peye = Gains kliyan
  const balans=vente - comV - gain; // Balans net

  if(cnt===0){
   document.getElementById('rapG').innerHTML=`<div style="border:2px dashed red;padding:10px;text-align:center">⚠️ Pa gen fich pou <br>Du ${duV} Au ${auV}<br>Tiraj ${fT} Vendeur ${fV}<br>Esaye mete Du Au vid pou wè tout</div>`;
  } else {
   document.getElementById('rapG').innerHTML=`
   <div style="border:3px solid #000;padding:12px;background:#fff;text-align:left">
     <div><b>Du:</b> ${duV} <b>Au:</b> ${auV}</div>
     <div><b>Vendeur:</b> ${fV} | <b>Tirage:</b> ${fT}</div><hr>
     <div style="font-size:18px"><b>Vant:</b> ${vente}$</div>
     <div style="font-size:18px"><b>Komisyon (${pct}%):</b> ${comV}$</div>
     <div style="font-size:18px"><b>Peye (Gains):</b> ${paye}$</div>
     <div style="font-size:22px;font-weight:bold;background:#000;color:#FFD700;padding:10px;border-radius:8px;margin-top:8px;text-align:center">Balans Net: ${balans}$</div>
     <div style="font-size:12px;margin-top:6px">Fiches: ${cnt}</div>
   </div>`;
  }
  document.getElementById('fichesG').innerHTML=html;
 });
}
function imprimeGlobal(){const w=window.open('','','width=800'); w.document.write('<html><body>'+rapG.innerHTML+fichesG.innerHTML+'</body></html>'); w.document.close(); w.print();}
</script>
</body></html>
