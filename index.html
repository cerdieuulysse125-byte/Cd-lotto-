<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D PROPRIO V6.8 10% MODIFIABLE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Arial}
.h{background:#FFD700;color:#000;text-align:center;padding:10px;font-weight:900;border-bottom:3px solid #000}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#000;padding:2px;position:sticky;top:0;z-index:99}
.tab{padding:12px 2px;text-align:center;font-size:10px;font-weight:900;background:#fff;color:#000;border:none}.tab.active{background:#FFD700}
.page{display:none;padding:10px;background:#fff;min-height:80vh}.page.active{display:block}
.card{background:#fff;border:2px solid #000;padding:10px;margin:6px 0}
.card input,.card select{width:100%;padding:8px;margin:4px 0;border:2px solid #000;font-weight:900}
.btn{background:#000;color:#FFD700;padding:10px;text-align:center;font-weight:900;border:2px solid #000;margin:6px 0}.btnJ{background:#FFD700;color:#000}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:4px;font-size:10px;text-align:center;font-weight:900}th{background:#FFD700}
.row{display:flex;gap:5px;margin:4px 0}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head><body>
<div class="h" id="hDate">C&D PROPRIO V6.8 - 10% DEFO MODIFIABLE</div>
<div class="tabs"><button class="tab active" onclick="op(1)">A.VANDÈ</button><button class="tab" onclick="op(2)">B.LIMIT</button><button class="tab" onclick="op(3)">C.LÈ</button><button class="tab" onclick="op(4)">D.PRIX</button><button class="tab" onclick="op(5)">E.REZILTA</button><button class="tab" onclick="op(6)">F.RAPÒ</button><button class="tab" onclick="op(7)">G.ENTÈT</button></div>
<div id="p1" class="page active"><div class="card"><div style="background:#FFD700;padding:5px;font-weight:900">A) VANDÈ - KLIKE POU MODIFYE - 10% DEFO</div><div class="row"><input id="vNom" placeholder="Non"><input id="vPass" placeholder="Modpas" inputmode="numeric"><input id="vCom" type="number" value="10" style="max-width:60px"><button class="btn btnJ" onclick="addV()" style="max-width:90px">+ AJOUTE</button></div><div style="display:flex;gap:4px"><button class="btn" style="flex:1;background:#F00;color:#fff" onclick="nettoyerDoublons()">🧹 NETWAYE</button><button class="btn" style="flex:1" onclick="loadVendeurs()">🔄 RECHAJE</button></div><div id="vList"></div></div></div>
<div id="p2" class="page"><div class="card"><div class="row"><label style="flex:1">Bòlèt</label><input id="lBolet" type="number" value="1500"></div><div class="row"><label style="flex:1">Maryaj</label><input id="lMaryaj" type="number" value="100"></div><div class="row"><label style="flex:1">Loto3</label><input id="lLoto3" type="number" value="100"></div><div class="row"><label style="flex:1">Loto4</label><input id="lLoto4" type="number" value="20"></div><div class="row"><label style="flex:1">Loto5</label><input id="lLoto5" type="number" value="5"></div><div class="btn btnJ" onclick="saveLimit()">💾 SAVE</div></div></div>
<div id="p3" class="page"><div class="card"><div class="row"><label style="flex:1">GA midi</label><input id="hGaMidi" type="time" value="12:15"></div><div class="row"><label style="flex:1">FL midi</label><input id="hFlMidi" type="time" value="13:15"></div><div class="row"><label style="flex:1">NY midi</label><input id="hNyMidi" type="time" value="14:15"></div><div class="row"><label style="flex:1">GA soir</label><input id="hGaSoir" type="time" value="18:15"></div><div class="row"><label style="flex:1">FL soir</label><input id="hFlSoir" type="time" value="21:15"></div><div class="row"><label style="flex:1">NY soir</label><input id="hNySoir" type="time" value="22:15"></div><div class="btn btnJ" onclick="saveHeure()">💾 SAVE LÈ</div></div></div>
<div id="p4" class="page"><div class="card"><div class="row"><label>1er</label><input id="p1er" type="number" value="50"></div><div class="row"><label>2e</label><input id="p2e" type="number" value="20"></div><div class="row"><label>3e</label><input id="p3e" type="number" value="10"></div><div class="row"><label>Maryaj</label><input id="pMaryaj" type="number" value="1000"></div><div class="row"><label>L3</label><input id="pLoto3" type="number" value="500"></div><div class="row"><label>L4</label><input id="pLoto4" type="number" value="5000"></div><div class="row"><label>L5</label><input id="pLoto5" type="number" value="25000"></div><div class="btn btnJ" onclick="savePrix()">💾 SAVE</div></div></div>
<div id="p5" class="page"><div class="card"><select id="rTiraj"><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><input type="date" id="rDate"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0"><input id="r1er" placeholder="1er" oninput="autoM()"><input id="r2e" placeholder="2e" oninput="autoM()"><input id="r3e" placeholder="3e" oninput="autoM()"><input id="rM1" placeholder="M1 Auto" readonly style="background:#eee"><input id="rM2" placeholder="M2 Auto" readonly style="background:#eee"><input id="rM3" placeholder="M3 Auto" readonly style="background:#eee"><input id="rL3" placeholder="L3"><input id="rL4" placeholder="L4"><input id="rL5" placeholder="L5"></div><div class="btn btnJ" onclick="saveRes()">💾 SAVE REZILTA</div><div id="tabRes"></div><div class="btn" style="background:#F00;color:#fff" onclick="delAllRes()">🗑️ EFase TOUT</div></div></div>
<div id="p6" class="page"><div class="card"><div style="background:#FFD700;padding:5px;font-weight:900">F) RAPPORT - 10% MODIFIABLE</div><div class="row"><input type="date" id="rapDu"><input type="date" id="rapAu"></div><div class="row"><select id="rapVend"><option value="tous">Tous vendeurs</option></select><select id="rapTir"><option value="tous">Tous tirages</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select></div><div style="display:flex;gap:4px;align-items:center;background:#FFD700;border:2px solid #000;padding:6px;margin:6px 0"><label style="font-weight:900;flex:1">% Komisyon:</label><input id="rapPourcent" type="number" value="10" min="0" max="100" style="width:80px;padding:8px;border:2px solid #000;font-weight:900;text-align:center;background:#fff;font-size:16px" oninput="calcRap()"><span style="font-weight:900">%</span></div><div class="btn" onclick="calcRap()">📊 KALKILE</div><div id="rapDet"></div><hr><div class="row"><span>Vente</span><b id="rapVente">$0</b></div><div class="row"><span>Commission</span><b id="rapCom">$0</b></div><div class="row"><span>A payer</span><b id="rapPayer">$0</b></div><div class="row"><span>Net</span><b id="rapNet">$0</b></div></div></div>
<div id="p7" class="page"><div class="card"><input id="eNom" value="C&D VÉRITÉ LOTTO"><input id="eTel" placeholder="Tel"><input id="eAddr" placeholder="Adresse"><input id="ePied" value="lave chodyè w"><input id="ePass" type="password" placeholder="Modpas proprio"><div class="btn btnJ" onclick="saveEnt()">💾 SAVE</div></div></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",
  authDomain: "cd-lotto.firebaseapp.com",
  databaseURL: "https://cd-lotto-default-rtdb.firebaseio.com",
  projectId: "cd-lotto",
  storageBucket: "cd-lotto.firebasestorage.app",
  messagingSenderId: "671091732195",
  appId: "1:671091732195:web:51bcfe8df83bc58fc75fd6",
  measurementId: "G-TWK9N38BS0"
};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function haitiISO(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Port-au-Prince'});}function haitiFR(){return new Date().toLocaleDateString('fr-HT',{timeZone:'America/Port-au-Prince',day:'2-digit',month:'2-digit',year:'numeric'});}
function op(n){document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i+1==n));document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i+1==n));}
let vendeurs=[];let ventes=[];
db.collection('ventes').onSnapshot(snap=>{ventes=[];snap.forEach(d=>{ventes.push(d.data());});});
function renderV(){
  let h='<table><tr><th>Non (klike)</th><th>Modpas (klike)</th><th>% (klike)</th><th>Etat</th><th>X</th></tr>';
  vendeurs.forEach((v,i)=>{
    const c=v.pass||'';
    h+=`<tr><td><span onclick="editField(${i},'nom')" style="border-bottom:2px dotted #000;cursor:pointer">${v.nom}</span></td><td><span onclick="editField(${i},'pass')" style="border-bottom:2px dotted #F00;cursor:pointer">${c||'VIDE'}</span></td><td><span onclick="editField(${i},'com')" style="border-bottom:2px dotted #000;cursor:pointer">${v.com}%</span></td><td><button onclick="toggleV(${i})" style="background:${v.ouvert?'#0A0':'#F00'};color:#fff;border:none;padding:6px;font-weight:900">${v.ouvert?'OUVERT':'FERMER'}</button></td><td><button onclick="delV(${i})">X</button></td></tr>`;
  });h+='</table>';document.getElementById('vList').innerHTML=h;
  const sel=document.getElementById('rapVend');sel.innerHTML='<option value="tous">Tous vendeurs</option>'+[...new Set(vendeurs.map(v=>v.nom))].map(n=>`<option>${n}</option>`).join('');
}
async function editField(i,field){
  const v=vendeurs[i];const curr=field==='nom'?v.nom:field==='pass'?v.pass:v.com;
  const nouv=prompt(`Modifye ${field} pou ${v.nom}:\nAnsyen: ${curr}\nNouvo:`,curr);
  if(nouv===null||nouv.trim()===''||nouv==curr)return;
  try{
    if(field==='nom'){await db.collection('vendeurs').doc(v.id).update({nom:nouv.trim()});v.nom=nouv.trim();}
    else if(field==='pass'){
      if(nouv.trim().length<3)return alert('Kout');const ex=await db.collection('vendeurs').where('code','==',nouv.trim()).get();if(!ex.empty && ex.docs[0].id!==v.id){alert('Deja pran');return;}
      await db.collection('vendeurs').doc(v.id).update({code:nouv.trim()});v.pass=nouv.trim();
    }else if(field==='com'){const p=parseInt(nouv);if(isNaN(p)||p<0||p>100)return alert('0-100');await db.collection('vendeurs').doc(v.id).update({com:p});v.com=p;}
    renderV();alert(`✅ ${field} -> ${nouv}`);
  }catch(e){alert('Erè:'+e.message);}
}
async function addV(){const nom=document.getElementById('vNom').value.trim(),pass=document.getElementById('vPass').value.trim(),com=parseInt(document.getElementById('vCom').value)||10;if(!nom||!pass)return alert('Non+modpas');try{const ex=await db.collection('vendeurs').where('code','==',pass).get();if(!ex.empty){alert('Modpas deja');return;}await db.collection('vendeurs').add({nom,code:pass,com,ouvert:true,date:haitiISO()});document.getElementById('vNom').value='';document.getElementById('vPass').value='';loadVendeurs();}catch(e){alert(e.message);}}
async function toggleV(i){const v=vendeurs[i];const nouvo=!v.ouvert;try{await db.collection('vendeurs').doc(v.id).update({ouvert:nouvo});v.ouvert=nouvo;renderV();}catch(e){}}
async function delV(i){if(!confirm(`Efase ${vendeurs[i].nom}?`))return;try{await db.collection('vendeurs').doc(vendeurs[i].id).delete();loadVendeurs();}catch(e){}}
async function loadVendeurs(){try{const vs=await db.collection('vendeurs').get();vendeurs=[];vs.forEach(d=>{const vd=d.data();const c=vd.code||vd.modpas||vd.pass||'';vendeurs.push({id:d.id,nom:vd.nom||'Sans',pass:c,code:c,com:vd.com||vd.pourcent||10,ouvert:vd.ouvert!==false});});renderV();}catch(e){}}
async function nettoyerDoublons(){if(!confirm('Netwaye doublon?'))return;try{const vs=await db.collection('vendeurs').get();let map={};let toDel=[];vs.forEach(d=>{const vd=d.data();const c=vd.code||vd.modpas||vd.pass||'';if(!c){toDel.push(d.ref);return;}const key=vd.nom+'|'+c;if(map[key]){toDel.push(d.ref);}else{map[key]=true;}});if(toDel.length===0){alert('Pa gen doublon');return;}const batch=db.batch();toDel.forEach(r=>batch.delete(r));await batch.commit();alert(`${toDel.length} efase`);loadVendeurs();}catch(e){}}
async function saveLimit(){const L={BOLET:parseInt(document.getElementById('lBolet').value),MARYAJ:parseInt(document.getElementById('lMaryaj').value),LOTO3:parseInt(document.getElementById('lLoto3').value),LOTO4:parseInt(document.getElementById('lLoto4').value),LOTO5:parseInt(document.getElementById('lLoto5').value)};await db.collection('config').doc('main').set({LIMITS:L},{merge:true});alert('SAVE');}
async function saveHeure(){const H={GA_MIDI:document.getElementById('hGaMidi').value,FL_MIDI:document.getElementById('hFlMidi').value,NY_MIDI:document.getElementById('hNyMidi').value,GA_SOIR:document.getElementById('hGaSoir').value,FL_SOIR:document.getElementById('hFlSoir').value,NY_SOIR:document.getElementById('hNySoir').value};await db.collection('config').doc('main').set({HEURES:H},{merge:true});alert('SAVE');}
async function savePrix(){const P={B1:document.getElementById('p1er').value,B2:document.getElementById('p2e').value,B3:document.getElementById('p3e').value,MARYAJ:document.getElementById('pMaryaj').value,L3:document.getElementById('pLoto3').value,L4:document.getElementById('pLoto4').value,L5:document.getElementById('pLoto5').value};await db.collection('config').doc('main').set({PRIX:P},{merge:true});alert('SAVE');}
function autoM(){const a=document.getElementById('r1er').value,b=document.getElementById('r2e').value,c=document.getElementById('r3e').value;document.getElementById('rM1').value=a&&b?a+b:'';document.getElementById('rM2').value=a&&c?a+c:'';document.getElementById('rM3').value=b&&c?b+c:'';}
async function saveRes(){const r={date:document.getElementById('rDate').value,tiraj:document.getElementById('rTiraj').value,r1:document.getElementById('r1er').value,r2:document.getElementById('r2e').value,r3:document.getElementById('r3e').value,m1:document.getElementById('rM1').value,m2:document.getElementById('rM2').value,m3:document.getElementById('rM3').value,l3:document.getElementById('rL3').value,l4:document.getElementById('rL4').value,l5:document.getElementById('rL5').value};await db.collection('resultats').add(r);alert('SAVE');}
function renderRes(){db.collection('resultats').orderBy('date','desc').limit(30).onSnapshot(s=>{let h='<table><tr><th>Date</th><th>Tiraj</th><th>1er</th><th>2e</th><th>3e</th><th>M1</th><th>M2</th><th>M3</th><th>L3</th><th>L4</th><th>L5</th><th>X</th></tr>';s.forEach(doc=>{const r=doc.data();h+=`<tr><td>${r.date||''}</td><td>${r.tiraj||''}</td><td>${r.r1||''}</td><td>${r.r2||''}</td><td>${r.r3||''}</td><td>${r.m1||''}</td><td>${r.m2||''}</td><td>${r.m3||''}</td><td>${r.l3||''}</td><td>${r.l4||''}</td><td>${r.l5||''}</td><td><button onclick="delRes('${doc.id}')" style="background:#F00;color:#fff">❌</button></td></tr>`;});h+='</table>';document.getElementById('tabRes').innerHTML=h;});}
async function delRes(id){if(!confirm('Efase?'))return;await db.collection('resultats').doc(id).delete();}
async function delAllRes(){const d=document.getElementById('rDate').value;const t=document.getElementById('rTiraj').value;if(!d)return alert('Chwazi dat');if(!confirm(`Efase ${t} ${d}?`))return;const snap=await db.collection('resultats').where('date','==',d).where('tiraj','==',t).get();const batch=db.batch();snap.forEach(doc=>{batch.delete(doc.ref);});await batch.commit();alert(`${snap.size} efase`);}
function calcRap(){
  const du=document.getElementById('rapDu').value,au=document.getElementById('rapAu').value,vSel=document.getElementById('rapVend').value,tSel=document.getElementById('rapTir').value;
  const pct=parseInt(document.getElementById('rapPourcent').value)||10;
  let tot=0,parT={},parV={};
  ventes.forEach(f=>{
    if(f.dateISO>=du&&f.dateISO<=au){
      if(vSel!='tous'&&f.vendeur!=vSel)return;if(tSel!='tous'&&!f.tirages.includes(tSel))return;
      const pt=f.parTiraj||f.base;tot+=f.total||f.base*f.nbTiraj;
      f.tirages.forEach(t=>{if(tSel!='tous'&&t!=tSel)return;if(!parT[t])parT[t]={v:0,nb:0};parT[t].v+=pt;parT[t].nb+=1;});
      parV[f.vendeur]=(parV[f.vendeur]||0)+(f.total||f.base*f.nbTiraj);
    }
  });
  let h='<table><tr><th>Tiraj</th><th>Vente pa tiraj</th><th>Nb</th></tr>';Object.keys(parT).forEach(t=>{h+=`<tr><td>${t}</td><td>$${parT[t].v}</td><td>${parT[t].nb}</td></tr>`;});h+='</table>';
  let hv='<table><tr><th>Vendeur</th><th>Total</th></tr>';Object.keys(parV).forEach(v=>{hv+=`<tr><td>${v}</td><td>$${parV[v]}</td></tr>`;});hv+='</table>';
  document.getElementById('rapDet').innerHTML=h+hv;
  const com=Math.round(tot*pct/100);document.getElementById('rapVente').innerText='$'+tot;document.getElementById('rapCom').innerText='$'+com+` (${pct}%)`;document.getElementById('rapPayer').innerText='$'+(tot-com);document.getElementById('rapNet').innerText='$'+(tot-com);
}
async function saveEnt(){const e={nom:document.getElementById('eNom').value,tel:document.getElementById('eTel').value,addr:document.getElementById('eAddr').value,pied:document.getElementById('ePied').value,pass:document.getElementById('ePass').value};await db.collection('config').doc('main').set({ENTETE:e},{merge:true});alert('SAVE');}
async function init(){
  document.getElementById('hDate').innerText=`C&D PROPRIO V6.8 - ${haitiFR()} - 10% MODIFIABLE`;
  document.getElementById('rDate').value=haitiISO();document.getElementById('rapDu').value=haitiISO();document.getElementById('rapAu').value=haitiISO();
  try{const d=await db.collection('config').doc('main').get();if(d.exists){const c=d.data();if(c.LIMITS){document.getElementById('lBolet').value=c.LIMITS.BOLET;document.getElementById('lMaryaj').value=c.LIMITS.MARYAJ;document.getElementById('lLoto3').value=c.LIMITS.LOTO3;document.getElementById('lLoto4').value=c.LIMITS.LOTO4;document.getElementById('lLoto5').value=c.LIMITS.LOTO5;}if(c.PRIX){document.getElementById('p1er').value=c.PRIX.B1;document.getElementById('p2e').value=c.PRIX.B2;document.getElementById('p3e').value=c.PRIX.B3;document.getElementById('pMaryaj').value=c.PRIX.MARYAJ;document.getElementById('pLoto3').value=c.PRIX.L3;document.getElementById('pLoto4').value=c.PRIX.L4;document.getElementById('pLoto5').value=c.PRIX.L5;}if(c.HEURES){document.getElementById('hGaMidi').value=c.HEURES.GA_MIDI;document.getElementById('hFlMidi').value=c.HEURES.FL_MIDI;document.getElementById('hNyMidi').value=c.HEURES.NY_MIDI;document.getElementById('hGaSoir').value=c.HEURES.GA_SOIR;document.getElementById('hFlSoir').value=c.HEURES.FL_SOIR;document.getElementById('hNySoir').value=c.HEURES.NY_SOIR;}if(c.ENTETE){document.getElementById('eNom').value=c.ENTETE.nom;document.getElementById('eTel').value=c.ENTETE.tel;document.getElementById('eAddr').value=c.ENTETE.addr;document.getElementById('ePied').value=c.ENTETE.pied;document.getElementById('ePass').value=c.ENTETE.pass;}}}catch(e){}
  await loadVendeurs(); renderRes();
}
init();
</script></body></html>
