<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C&D V73 MULTITIRAJ + RAPÒ DAT</title>
<style>
*{box-sizing:border-box}body{background:#0f172a;color:#fff;font-family:sans-serif;margin:0;padding:10px}
h1{color:#facc15;text-align:center;font-size:20px;margin:6px 0}
.time{color:#facc15;text-align:center;font-size:12px;margin-bottom:8px}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:10px;margin-bottom:10px}
input,select{padding:8px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff}
.row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
button{background:#facc15;color:#000;border:none;padding:8px 12px;border-radius:8px;font-weight:bold}
.tiraj-box{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tiraj-box label{background:#0f172a;border:1px solid #475569;padding:6px 10px;border-radius:20px;font-size:12px;cursor:pointer}
.ticket{background:#0f172a;padding:6px 8px;border-radius:8px;margin:3px 0;display:flex;justify-content:space-between;font-size:13px}
.valide{width:100%;padding:12px;font-size:16px;margin-top:8px}
.rapobtn{width:100%;margin-top:8px;background:#1e293b;color:#facc15;border:1px solid #facc15;padding:10px;border-radius:10px}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stat div{background:#0f172a;padding:6px 8px;border-radius:8px;font-size:11px;flex:1;min-width:80px;text-align:center}
</style>
</head>
<body>
<h1>C&D VERITE LOTTO<br>V73 MULTITIRAJ</h1>
<div class="time" id="clock">EST: --:--:-- | Ayiti: --:--:--</div>

<div class="card">
<div class="row"><label style="width:80px">ID Vendeur:</label><input id="idVendeur" value="vendeur1" style="flex:1"></div>
<div style="margin-top:6px"><label>Tiraj yo (chwazi plizyè):</label>
<div class="tiraj-box">
<label><input type="checkbox" value="GA AM" checked> <span>GA AM</span></label>
<label><input type="checkbox" value="GA PM"> <span>GA PM</span></label>
<label><input type="checkbox" value="FL AM"> <span>FL AM</span></label>
<label><input type="checkbox" value="FL PM"> <span>FL PM</span></label>
<label><input type="checkbox" value="NY AM"> <span>NY AM</span></label>
<label><input type="checkbox" value="NY PM"> <span>NY PM</span></label>
</div>
</div>
</div>

<div class="card">
<div class="row"><label style="width:40px">Tip:</label><select id="tip" style="flex:1"><option value="bolet">Bolet 50/20/10</option><option value="loto3">Loto3 500</option><option value="loto4">Loto4 5000</option><option value="loto5">Loto5 25000</option><option value="maryaj">Maryaj</option></select>
<label style="width:40px">Boul:</label><input id="boul" placeholder="23" style="flex:1">
<label style="width:50px">Montan:</label><input id="montan" type="number" placeholder="50" style="width:70px"><span>G</span></div>
<div style="margin-top:8px"><button onclick="ajoute()">+ Ajoute</button><span id="multiInfo" style="margin-left:10px;color:#facc15;font-size:12px"></span></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between"><b id="tikeCount">Tikè - 0 fich</b><button onclick="efaseTout()" style="background:#ef4444;color:#fff;padding:3px 8px;font-size:11px;border-radius:6px;border:none">Efase</button></div>
<div id="tikeList"></div>
<div style="font-weight:bold;margin-top:6px" id="totalG">Total: 0G</div>
<button class="valide" onclick="valide()">✅ VALIDE - ENPRIME</button>
<button class="rapobtn" onclick="wèRapò()">📊 RAPÒ DETAYE MWEN</button>

<div id="rapoDiv" style="display:none;margin-top:10px;background:#0f172a;padding:10px;border-radius:10px;border:1px solid #334155">
<div style="display:flex;justify-content:space-between"><b>📋 RAPÒ DETAYE</b><button onclick="document.getElementById('rapoDiv').style.display='none'" style="background:#ef4444;color:#fff;padding:3px 8px;border-radius:6px;border:none">X</button></div>
<div style="display:flex;gap:6px;margin-top:8px">
<div style="flex:1"><label style="font-size:11px">Du:</label><input type="date" id="dateDu" style="width:100%;padding:6px;font-size:12px"></div>
<div style="flex:1"><label style="font-size:11px">Au:</label><input type="date" id="dateAu" style="width:100%;padding:6px;font-size:12px"></div>
<button onclick="wèRapò()" style="margin-top:16px;padding:6px 10px;font-size:12px">🔍 OK</button>
</div>
<div class="stat" id="statTiraj"></div>
<div id="lisRapò" style="margin-top:8px;font-size:12px"></div>
<div style="margin-top:8px;border-top:1px solid #334155;padding-top:6px">
<div style="display:flex;justify-content:space-between"><span>Total Vante:</span><b id="totalRapò" style="color:#22c55e">0G</b></div>
<div style="display:flex;justify-content:space-between"><span>Komisyon 10%:</span><b id="komisyonRapò" style="color:#facc15">0G</b></div>
<div style="display:flex;justify-content:space-between"><span>Nb Fich:</span><b id="countRapò">0</b></div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push, get, child } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = { databaseURL: "https://cerdieulotto-default-rtdb.firebaseio.com" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
window.db=db; window.ref=ref; window.push=push; window.get=get; window.child=child;
setInterval(()=>{
let n=new Date();
let est=new Date(n.toLocaleString('en-US',{timeZone:'America/New_York'}));
let ayiti=new Date(n.toLocaleString('en-US',{timeZone:'America/Port-au-Prince'}));
document.getElementById('clock').innerText=`EST: ${est.toLocaleTimeString()} | Ayiti: ${ayiti.toLocaleTimeString()}`;
let c=document.querySelectorAll('.tiraj-box input:checked').length;
document.getElementById('multiInfo').innerText=c>1?`⚡ ${c} tiraj!`:'';
},1000);
window.onload=()=>{
let t=new Date().toISOString().split('T')[0];
document.getElementById('dateDu').value=t;
document.getElementById('dateAu').value=t;
};
</script>

<script>
let fiches=[];
function getTirajSelected(){return Array.from(document.querySelectorAll('.tiraj-box input:checked')).map(i=>i.value);}
function ajoute(){
let tip=document.getElementById('tip').value;
let boul=document.getElementById('boul').value.trim();
let montan=parseInt(document.getElementById('montan').value);
let tirajs=getTirajSelected();
if(!boul||!montan){alert('Mete boul ak montan');return;}
if(tirajs.length==0){alert('Chwazi omwen 1 tiraj');return;}
tirajs.forEach(t=>{fiches.push({tip,boul,montan,tiraj:t});});
render(); document.getElementById('boul').value=''; document.getElementById('montan').value='';
}
function render(){
let list=document.getElementById('tikeList'); list.innerHTML='';
let total=0;
fiches.forEach((f,i)=>{
total+=f.montan;
list.innerHTML+=`<div class="ticket"><span>[${f.tiraj}] ${f.tip} ${f.boul} - ${f.montan}G</span><span onclick="fiches.splice(${i},1);render()" style="color:red">✕</span></div>`;
});
document.getElementById('totalG').innerText=`Total: ${total}G (${fiches.length} fich)`;
document.getElementById('tikeCount').innerText=`Tikè - ${fiches.length} fich`;
}
function efaseTout(){fiches=[];render();}
async function valide(){
if(fiches.length==0){alert('Pa gen fich');return;}
let idV=document.getElementById('idVendeur').value||'vendeur1';
let total=fiches.reduce((s,f)=>s+f.montan,0);
let tirajUnique=[...new Set(fiches.map(f=>f.tiraj))].join(', ');
let data={vendeur:idV,idVendeur:idV,tiraj:tirajUnique,tirajs:[...new Set(fiches.map(f=>f.tiraj))],total,montan:total,fiches,date:new Date().toISOString(),heure:new Date().toISOString(),timestamp:Date.now()};
try{
await push(ref(db,'fiches'),data);
alert(`✅ ${fiches.length} fich sou ${data.tirajs.length} tiraj! Total: ${total}G`);
fiches=[];render();
}catch(e){alert('Erè: '+e.message);}
}
async function wèRapò(){
let idV=document.getElementById('idVendeur').value||'vendeur1';
let div=document.getElementById('rapoDiv');
let lis=document.getElementById('lisRapò');
let dateDu=document.getElementById('dateDu').value;
let dateAu=document.getElementById('dateAu').value;
if(!dateDu){dateDu=new Date().toISOString().split('T')[0];}
if(!dateAu){dateAu=new Date().toISOString().split('T')[0];}
div.style.display='block'; lis.innerHTML='⏳ Chaje...';
try{
let snap=await get(child(ref(db),'fiches'));
if(!snap.exists()){lis.innerHTML='Pa gen fich';return;}
let all=Object.values(snap.val());
let paMwen=all.filter(f=>{
let okV=(f.vendeur===idV||f.idVendeur===idV);
if(!okV) return false;
let fDate=f.date?f.date.split('T')[0]:'';
if(dateDu && fDate < dateDu) return false;
if(dateAu && fDate > dateAu) return false;
return true;
});
if(paMwen.length==0){lis.innerHTML=`❌ Pa gen fich pou ${idV}<br>Du ${dateDu} Au ${dateAu}`;
document.getElementById('totalRapò').innerText='0G';
document.getElementById('komisyonRapò').innerText='0G';
document.getElementById('countRapò').innerText='0 fich';
document.getElementById('statTiraj').innerHTML='';return;}
let totalTout=0; let perTiraj={};
let html='';
paMwen.slice(-50).reverse().forEach(f=>{
totalTout+=parseInt(f.total||0)||0;
let ts=f.tirajs||[f.tiraj||'Inconnu'];
ts.forEach(t=>{let key=t||'Inconnu';perTiraj[key]=(perTiraj[key]||0)+(parseInt(f.total||0)/ts.length);});
let h=f.heure? new Date(f.heure).toLocaleString() : '';
let fDate=f.date?f.date.split('T')[0]:'';
html+=`<div style="background:#1e293b;margin:3px 0;padding:5px 6px;border-radius:6px"><div style="display:flex;justify-content:space-between"><span>${f.fiches?f.fiches.length:1} fich - ${f.tiraj}</span><span style="color:#facc15">${f.total||0}G</span></div><div style="font-size:10px;color:#94a3b8">${fDate} ${h}</div></div>`;
});
let statHtml='';
Object.keys(perTiraj).forEach(t=>{statHtml+=`<div><div style="color:#94a3b8">${t}</div><b style="color:#facc15">${Math.round(perTiraj[t])}G</b></div>`;});
document.getElementById('statTiraj').innerHTML=statHtml;
lis.innerHTML=html;
document.getElementById('totalRapò').innerText=totalTout+'G';
document.getElementById('komisyonRapò').innerText=Math.round(totalTout*0.1)+'G';
document.getElementById('countRapò').innerText=paMwen.length+` fich (Du ${dateDu} Au ${dateAu})`;
}catch(e){lis.innerHTML='Erè: '+e.message;}
}
</script>
</body>
</html>
