<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROPRIO V118 FIX</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, set, child, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"}; const app=initializeApp(cfg); const db=getDatabase(app);
let config={};
function getEST(){ const now=new Date(); const est=new Date(now.toLocaleString("en-US",{timeZone:"America/New_York"})); const y=est.getFullYear(); const m=String(est.getMonth()+1).padStart(2,'0'); const d=String(est.getDate()).padStart(2,'0'); return {date:`${y}-${m}-${d}`, hm:est.getHours()*60+est.getMinutes(), full:est.toLocaleString()}; }
function render(){
  const he=config.heures||{gaMidi:"12:15",flMidi:"13:15",nyMidi:"14:15",gaSoir:"18:15",flSoir:"21:20",nySoir:"21:30"};
  const ti=config.tirages||{}; const list=[{id:'gaMidi',l:'GA MIDI',d:'12:15'},{id:'flMidi',l:'FL MIDI',d:'13:15'},{id:'nyMidi',l:'NY MIDI',d:'14:15'},{id:'gaSoir',l:'GA SOIR',d:'18:15'},{id:'flSoir',l:'FL SOIR',d:'21:20'},{id:'nySoir',l:'NY SOIR',d:'21:30'}];
  let html=''; const est=getEST();
  list.forEach(o=>{
    const val=he[o.id]||o.d; const [hh,mm]=val.split(':').map(Number); const past=est.hm >= (hh*60+mm);
    const st=ti[o.id]||'OUVE';
    html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #ddd;gap:8px"><b style="width:90px">${o.l}</b><input id="h_${o.id}" type="time" value="${val}" style="width:115px;padding:8px;border:2px solid #000;border-radius:8px"><select id="e_${o.id}" style="width:90px;padding:8px;border:2px solid #000;border-radius:8px"><option ${st!=='FERME'?'selected':''}>OUVE</option><option ${st==='FERME'?'selected':''}>FERME</option></select>${past?'<span style=color:red;font-size:10px;font-weight:bold>FERMÉ</span>':'<span style=color:green;font-size:10px;font-weight:bold>OUVE</span>'}</div>`;
  });
  document.getElementById('tirajList').innerHTML=html;
  document.getElementById('heureEST').innerHTML=`⏰ EST: ${est.full} | Date: ${est.date}`;
}
onValue(ref(db,'config'),s=>{ config=s.val()||{}; render(); });

function parseRes(key,val){
  // FIX UNDEFINED - li tout ansyen fòma
  let tirage=val.tirage||val.tiraj||val.tirajName||'';
  if(!tirage){ tirage=key.split('_').slice(0,-1).join(' ').replace(/_/g,' '); }
  let date=val.date||val.dat||key.split('_').slice(-1)[0]||'';
  let r1=val.r1||val.premier||val.first||val['1erLot']||'';
  let r2=val.r2||val.second||val['2eLot']||'';
  let r3=val.r3||val.third||val['3eLot']||'';
  let l3=val.l3||val.loto3||'';
  return {key, tirage:tirage.toUpperCase(), date, r1, r2, r3, l3, ts:val.ts||0};
}

async function loadRes(){
  const s=await get(child(ref(db),'resultats')); const div=document.getElementById('resHist');
  if(!s.exists()){div.innerHTML='Pa gen rezilta';return;}
  let list=Object.entries(s.val()).map(([k,v])=>parseRes(k,v)).sort((a,b)=>b.ts-a.ts).slice(0,20);
  let html=''; list.forEach(r=>{
    html+=`<div style="padding:8px;border-bottom:1px solid #eee;font-size:13px"><b>${r.tirage} ${r.date}</b> 1:${r.r1||'-'} 2:${r.r2||'-'} 3:${r.r3||'-'} ${r.l3?'L3:'+r.l3:''}</div>`;
  });
  div.innerHTML=html;
}
onValue(ref(db,'resultats'),s=>{ loadRes(); });

window.saveTirages=()=>{ let he={},ti={}; ['gaMidi','gaSoir','flMidi','flSoir','nyMidi','nySoir'].forEach(id=>{ const el=document.getElementById('h_'+id); if(el) he[id]=el.value; ti[id]=document.getElementById('e_'+id).value;}); set(ref(db,'config/heures'),he); set(ref(db,'config/tirages'),ti); set(ref(db,'config/lastAutoOpen'),getEST().date); alert('Sove! V92 ap fèmen/ouvè kounya'); };
window.forceOpen=()=>{ set(ref(db,'config/tirages'),{gaMidi:'OUVE',gaSoir:'OUVE',flMidi:'OUVE',flSoir:'OUVE',nyMidi:'OUVE',nySoir:'OUVE'}); set(ref(db,'config/lastAutoOpen'),getEST().date); alert('Tout OUVE'); };
window.publie=async()=>{
  const tir=document.getElementById('resTirage').value; const d=document.getElementById('resDate').value; const r1=document.getElementById('r1').value.trim();
  if(!r1)return alert('Mete 1er Lot');
  const data={tirage:tir.toUpperCase(),date:d,r1:r1,r2:document.getElementById('r2').value.trim(),r3:document.getElementById('r3').value.trim(),l3:document.getElementById('rL3').value.trim(),ts:Date.now()};
  const key=tir.replace(/\s/g,'_')+'_'+d;
  await set(ref(db,'resultats/'+key),data);
  document.getElementById('stat').innerHTML=`✅ Pibliye ${tir} - ap korije...`;
  korije(data);
};
async function korije(res){
  const s=await get(child(ref(db),'fiches')); if(!s.exists()){document.getElementById('stat').innerHTML=`❌ Pa gen fich pou korije`;return;}
  const all=s.val(); let c=0,win=0,tot=0; const tirageNorm=res.tirage.toUpperCase();
  for(let id in all){
    const f=all[id];
    const fTirajs=(f.tirajs||[]).map(t=>t.toUpperCase());
    if(!fTirajs.includes(tirageNorm))continue;
    // dat - korije konparezon
    const fDateH=new Date(new Date(f.date).toLocaleString("en-US",{timeZone:"America/New_York"})).toISOString().split('T')[0];
    const fDateStr=f.dateStr||fDateH;
    if(fDateStr!==res.date)continue;
    let gain=0;
    (f.details||[]).forEach(det=>{
      const b=det.boul.toString().padStart(2,'0').slice(-2);
      const r1=res.r1.toString().padStart(2,'0').slice(-2);
      const r2=(res.r2||'').toString().padStart(2,'0').slice(-2);
      const r3=(res.r3||'').toString().padStart(2,'0').slice(-2);
      if(r1&&b===r1) gain+=det.montan*50;
      else if(r2&&b===r2) gain+=det.montan*20;
      else if(r3&&b===r3) gain+=det.montan*10;
    });
    await set(ref(db,'fiches/'+id+'/gain'),gain);
    c++; if(gain>0)win++; tot+=gain;
  }
  document.getElementById('stat').innerHTML=`✅ AUTO KORIJE: ${c} fich, ${win} genyen, ${tot}G - ${res.tirage} ${res.date}`;
}
</script>
<style>body{font-family:Arial;background:#f2f2f2;margin:0}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:bold}.card{background:#fff;padding:14px;margin:10px;border-radius:14px;max-width:620px;margin:10px auto}input,select{padding:10px;border:2px solid #000;border-radius:10px;width:100%;margin:4px 0}.btn{background:#000;color:#FFD700;padding:12px;width:100%;border:none;border-radius:10px;font-weight:bold;margin:6px 0}</style></head><body>
<div class="h">PROPRIO V118 FIX - PA GEN UNDEFINED</div>
<div class="card"><div id="heureEST" style="background:#e3f2fd;padding:8px;border-radius:8px;font-size:12px;margin-bottom:8px"></div><div id="tirajList"></div><button class="btn" onclick="saveTirages()">Sauvegarder - fè enpak sou V93</button><button class="btn" style="background:green;color:#fff" onclick="forceOpen()">☀️ OUVÈ TOUT</button></div>
<div class="card"><h3>🎯 Resultats - Auto korije fich V93</h3><select id="resTirage"><option>GA MIDI</option><option>GA SOIR</option><option>FL MIDI</option><option>FL SOIR</option><option>NY MIDI</option><option>NY SOIR</option></select><input id="resDate" type="date"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="r1" placeholder="1er Lot"><input id="r2" placeholder="2e Lot"><input id="r3" placeholder="3e Lot"><input id="rL3" placeholder="Loto3"></div><button class="btn" style="background:green;color:#fff" onclick="publie()">PUBLIER - korije tout fich otomatik</button><div id="stat" style="background:#000;color:#FFD700;padding:10px;border-radius:8px;margin-top:6px">Tann...</div><div id="resHist" style="margin-top:8px"></div></div>
<script>document.getElementById('resDate').value=new Date().toISOString().split('T')[0];</script>
</body></html>
