<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D V92 ORIGINAL FIX</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f1f5f9;padding:8px;padding-bottom:95px}
.hdr{background:#facc15;padding:12px 14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13px}
.kom{background:#0f172a;color:#facc15;padding:6px 12px;border-radius:20px;font-size:11px}
.card{background:#fff;border-radius:16px;padding:14px;margin:8px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.rapCard{background:#fff;border-radius:18px;padding:16px;margin:8px 0;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.tirajGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tirajItem{background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;padding:14px 8px;display:flex;gap:8px;font-size:12px;align-items:center;justify-content:center;font-weight:600;cursor:pointer;text-align:center}
.tirajItem.on{background:#dcfce7;border-color:#22c55e}
.tirajItem.ferme{background:#f3f4f6!important;opacity:.4;pointer-events:none}
.row3{display:grid;grid-template-columns:0.9fr 1.1fr 0.8fr;gap:8px;margin-top:10px}
.row3 select,.row3 input{padding:14px 6px;border:2.5px solid #000;border-radius:12px;text-align:center;font-weight:900;font-size:16px;height:56px;width:100%}
.btnAdd{background:#22c55e;color:#fff;width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:18px;margin-top:10px}
.totalBox{background:#f8fafc;border:2px solid #000;border-radius:12px;padding:12px;margin:14px 0}
.totalFinal{display:flex;justify-content:space-between;font-weight:900;font-size:22px;border-top:2px solid #000;padding-top:8px;margin-top:8px}
.btnValide{background:#0f172a;color:#facc15;width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:17px}
.sec{display:none}.sec.active{display:block}
.tabs{position:fixed;bottom:0;left:0;width:100%;background:#0f172a;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:8px}
.tabBtn{background:#1e293b;color:#94a3b8;padding:14px 2px;border-radius:12px;font-size:11px;font-weight:800;border:none}
.tabBtn.active{background:#facc15;color:#000}
/* RAPO FÒMA FOTO A */
.rapFilters{background:#f8fafc;border-radius:14px;padding:12px;display:grid;gap:10px}
.rapRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rapRow input,.rapRow select{padding:12px;border:1.5px solid #cbd5e1;border-radius:10px;font-weight:600}
.btnOK{background:#3b82f6;color:#fff;padding:12px 24px;border:none;border-radius:12px;font-weight:900}
.rapStats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.statBox{padding:16px;border-radius:14px;text-align:center}
.statBox small{font-size:10px;font-weight:800;display:block;opacity:.8}
.statBox b{font-size:20px}
.statVann{background:#0f172a;color:#fff}
.statKom{background:#fef3c7;color:#000;border:1.5px solid #facc15}
.statPaye{background:#fee2e2;color:#ef4444}
.statBalans{background:#dcfce7;color:#166534;border:1.5px solid #22c55e}
.formula{background:#f1f5f9;padding:10px;border-radius:10px;text-align:center;font-size:11px;font-weight:800;margin-top:10px}
</style></head>
<body>

<div class="hdr"><span>tamouche</span><span id="dateNow">--</span><span class="kom">KOM 10%</span></div>

<div id="secVANN" class="sec active">
<div class="card"><div style="font-weight:800">Tiraj</div><div class="tirajGrid" id="tirajGrid" style="margin-top:10px"></div></div>
<div class="card" style="border:2.5px solid #000">
<div id="entetePreview" style="background:#f8fafc;padding:8px;border-radius:8px;font-size:11px;border:1px dashed #cbd5e1;margin-bottom:8px"></div>
<div class="row3"><select id="tip"><option value="bolet">Bolet</option><option value="mariage">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select><input id="boul" placeholder="BOUL"><input id="montan" placeholder="G" type="number"></div>
<button id="btnAdd" class="btnAdd">+ AJOUTE</button>
<div id="liste" style="margin-top:10px;font-size:13px"></div>
<div class="totalBox">
<div style="display:flex;justify-content:space-between;font-size:12px"><span>Base Miz</span><span id="tBase">0G</span></div>
<div style="display:flex;justify-content:space-between;font-size:12px;color:#64748b"><span id="tDetail">0G x 0 Tiraj</span><span></span></div>
<div class="totalFinal"><span>Total Final</span><span id="tTotal">0G</span></div>
</div>
<button onclick="valideFich()" class="btnValide">✅ Validé + Imprimer</button>
</div>
</div>

<!-- RAPÒ - MENM FÒMA AK FOTO W VOYE A -->
<div id="secRAPO" class="sec">
<div class="rapCard">
<div style="text-align:center;font-weight:900;margin-bottom:12px">📊 RAPÒ - BALANS NET</div>
<div class="rapFilters">
<div class="rapRow"><div><label style="font-size:11px;font-weight:800">Du:</label><input id="rapDu" type="date"></div><div><label style="font-size:11px;font-weight:800">Au:</label><input id="rapAu" type="date"></div></div>
<div class="rapRow" style="grid-template-columns:1fr auto"><select id="rapTiraj"><option value="">Tout Tiraj</option><option value="FL MIDI">FL MIDI</option><option value="FL SOIR">FL SOIR</option><option value="GA MIDI">GA MIDI</option><option value="GA SOIR">GA SOIR</option><option value="NY MIDI">NY MIDI</option><option value="NY SOIR">NY SOIR</option></select><button class="btnOK" onclick="genererRapport()">OK</button></div>
</div>
<div class="rapStats">
<div class="statBox statVann"><small>VANN</small><b id="vVann">0G</b></div>
<div class="statBox statKom"><small>KOM 10%</small><b id="vKom">0G</b></div>
<div class="statBox statPaye"><small>PAYE</small><b id="vPaye" style="color:#ef4444">0G</b></div>
<div class="statBox statBalans"><small>BALANS NET</small><b id="vBal">0G</b></div>
</div>
<div class="formula" id="vForm">BALANS NET = VANN - KOM - PAYE = 0G</div>
<div id="detailTiraj" style="margin-top:12px;font-size:11px;background:#fff;padding:8px;border-radius:8px;border:1px solid #eee"></div>
<button onclick="printRapport()" style="width:100%;padding:14px;background:#22c55e;color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:12px">🖨️ Imprimer Rapport</button>
</div>
</div>

<div id="secKOPYE" class="sec"><div class="card"><b>📋 KOPYE</b><div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0"><input id="searchId" placeholder="ID 5 chif" style="padding:14px;border-radius:12px;border:2px solid #000"><button onclick="chercheParId()" style="background:#0f172a;color:#facc15;padding:14px;border-radius:12px;font-weight:900;border:none">CHÈCHE</button></div><div id="resultSearch"></div></div></div>
<div id="secFICHES" class="sec"><div class="card"><b>🎫 FICHES</b><div id="listFiches"></div></div></div>

<div class="tabs"><button onclick="showTab('VANN')" id="tabVANN" class="tabBtn active">📋<br>VANN</button><button onclick="showTab('KOPYE')" id="tabKOPYE" class="tabBtn">📋<br>KOPYE</button><button onclick="showTab('RAPO')" id="tabRAPO" class="tabBtn active" style="background:#facc15;color:#000">📊<br>RAPÒ</button><button onclick="showTab('FICHES')" id="tabFICHES" class="tabBtn">📁<br>FICHES</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"}; const app=initializeApp(cfg); const db=getDatabase(app);
let vendeur="tamouche", panier=[];
let TIRAJS=[{n:"FL MIDI",h:"13:15",m:795},{n:"FL SOIR",h:"21:20",m:1280},{n:"GA MIDI",h:"12:15",m:735},{n:"GA SOIR",h:"18:15",m:1095},{n:"NY MIDI",h:"14:15",m:855},{n:"NY SOIR",h:"21:30",m:1290}];

function getDateHaiti(d=new Date()){ let h=new Date(d.toLocaleString("en-US",{timeZone:"America/New_York"})); return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`; }
function printTicket58mm(text){ let w=window.open('','_blank','width=380,height=700'); w.document.write(`<html><head><title>Ticket</title><style>@page{size:58mm auto;margin:2mm}body{margin:0;display:flex;justify-content:center}pre{width:58mm;font-family:monospace;font-size:16px;font-weight:900;text-align:center;white-space:pre-wrap;padding:8px}</style></head><body><pre>${text}</pre><script>setTimeout(()=>window.print(),400)<\/script></body></html>`); w.document.close(); }

function init(){
 let g=document.getElementById('tirajGrid'); g.innerHTML=""; TIRAJS.forEach(t=>{ g.innerHTML+=`<label class="tirajItem" id="box-${t.n.replace(/ /g,'')}"><input type="checkbox" value="${t.n}" class="chkT" onchange="updT('${t.n}')"> ${t.n}<br>(${t.h})</label>`; });
 let today=getDateHaiti(); document.getElementById('rapDu').value=today; document.getElementById('rapAu').value=today;
 document.getElementById('dateNow').innerText=today+' '+new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 render(); loadAll();
}
window.updT=(n)=>{ let b=document.getElementById('box-'+n.replace(/ /g,'')); let c=document.querySelector(`input[value="${n}"]`); b.classList.toggle('on',c.checked); render(); }
function getT(){return [...document.querySelectorAll('.chkT:checked')].map(c=>c.value);}
function render(){
 let div=document.getElementById('liste'); div.innerHTML=''; let base=0;
 panier.forEach((p,i)=>{ base+=p.montan; div.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span><b>${p.type}</b> ${p.boul}</span><span>${p.montan}G <button onclick="retire(${i})" style="background:#ef4444;color:#fff;border:none;padding:2px 8px;border-radius:6px">x</button></span></div>`; });
 let nb=getT().length||0; let total=base*nb; // FIX TOTAL × TIRAJ
 document.getElementById('tBase').innerText=base+"G"; document.getElementById('tDetail').innerText=`${base}G x ${nb} Tiraj`; document.getElementById('tTotal').innerText=total+"G";
 document.getElementById('entetePreview').innerHTML=`Vandè: <b>${vendeur}</b> | ${getT().join(' / ')||'Pa chwazi tiraj'}<br>Base ${base}G x ${nb} = <b>${total}G</b>`;
}
window.retire=(i)=>{ panier.splice(i,1);render();}
document.getElementById('btnAdd').addEventListener('click',()=>{ let tip=document.getElementById('tip').value; let boul=document.getElementById('boul').value.trim(); let montan=parseInt(document.getElementById('montan').value); if(getT().length===0){alert('Chwazi tiraj');return;} if(!boul||!montan)return; panier.push({type:tip,boul:boul,montan:montan}); render(); document.getElementById('boul').value=""; document.getElementById('montan').value=""; });
window.showTab=(t)=>{ document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active')); document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active')); document.getElementById('sec'+t).classList.add('active'); document.getElementById('tab'+t).classList.add('active'); if(t!=='VANN') loadAll(); };

// RAPÒ V92 ORIJINAL AK PAYE - SÈLMAN TOTAL KORIJAN
window.genererRapport=async()=>{
 let du=document.getElementById('rapDu').value || getDateHaiti();
 let au=document.getElementById('rapAu').value || getDateHaiti();
 let tirajF=document.getElementById('rapTiraj').value;
 let s=await get(child(ref(db),'fiches')); if(!s.exists())return;
 let all=Object.values(s.val()).filter(f=> f.vendeur===vendeur);
 // FILTRE LÈ AYITI - KORIJMAN FICH
 let filtres=all.filter(f=>{
   let dHaiti=getDateHaiti(new Date(f.date));
   if(dHaiti<du||dHaiti>au) return false;
   if(tirajF && !(f.tirajs||[]).includes(tirajF)) return false;
   return true;
 });
 let vente=filtres.reduce((a,b)=>a+(b.total||0),0); // total deja = base x tiraj
 let kom=Math.round(vente*0.10);

 // PAYE - SOTI NAN resultats OU gagnants
 let paye=0;
 try{
   let sr=await get(child(ref(db),'resultats'));
   if(sr.exists()){
     let res=sr.val();
     filtres.forEach(f=>{
       (f.tirajs||[]).forEach(tName=>{
         if(tirajF && tName!==tirajF) return;
         let dHaiti=getDateHaiti(new Date(f.date));
         let winData=res[dHaiti]?.[tName] || res[dHaiti]?.[tName.replace(' ','')] || null;
         if(!winData) return;
         let winNums = Array.isArray(winData) ? winData : [winData];
         (f.details||[]).forEach(det=>{
           let boul=String(det.boul).padStart(2,'0');
           if(det.type==='bolet' && winNums.some(w=>String(w).includes(boul))){
             paye+=det.montan*50; // Bolet 50x
           }
           if(det.type==='loto3' && winNums.includes(boul)){
             paye+=det.montan*500;
           }
         });
       });
     });
   }
 }catch(e){}

 // Si pa gen resultats nan Firebase men ou te gen Paye 16000 nan ansyen, pran valè ki egziste deja si gen
 if(paye===0){
   // eseye chache nan fich ki gen champ paye deja kalkile
   filtres.forEach(f=>{ if(f.paye) paye+=f.paye; });
 }

 let balans=vente-kom-paye;

 // KORIJMAN DETAIL PA TIRAJ - ITILIZE totalBase
 let parTiraj={};
 filtres.forEach(f=>{
   let base = f.totalBase || Math.round(f.total / (f.nbTiraj||1));
   (f.tirajs||[]).forEach(t=>{
     if(tirajF && t!==tirajF) return;
     parTiraj[t]=(parTiraj[t]||0)+base;
   });
 });

 document.getElementById('vVann').innerText=vente+"G";
 document.getElementById('vKom').innerText=kom+"G";
 document.getElementById('vPaye').innerText=paye+"G";
 document.getElementById('vBal').innerText=balans+"G";
 document.getElementById('vForm').innerText=`BALANS NET = VANN - KOM - PAYE = ${balans}G`;
 document.getElementById('detailTiraj').innerHTML=Object.keys(parTiraj).map(t=>`${t}: ${parTiraj[t]}G`).join('<br>')||'';
};

window.printRapport=()=>{
 let du=document.getElementById('rapDu').value; let au=document.getElementById('rapAu').value;
 let v=document.getElementById('vVann').innerText, k=document.getElementById('vKom').innerText, p=document.getElementById('vPaye').innerText, b=document.getElementById('vBal').innerText;
 let ticket=`C&D LOTTO - RAPÒ
Du: ${du} Au: ${au}
Tirage: ${document.getElementById('rapTiraj').value||'Tout'}

VANN: ${v}
KOM 10%: ${k}
PAYE: ${p}
BALANS NET: ${b}

${v} - ${k} - ${p} = ${b}`;
 printTicket58mm(ticket);
};

window.chercheParId=async()=>{ let q=document.getElementById('searchId').value.trim().toLowerCase(); if(!q)return; let s=await get(child(ref(db),'fiches')); let all=Object.values(s.val()); let found=all.find(f=> f.id.toLowerCase().includes(q) || f.id.slice(-5).toLowerCase()===q); document.getElementById('resultSearch').innerHTML=found?`<div style="border:2px solid #22c55e;padding:10px;border-radius:10px"><b>${found.id.slice(-5)} - ${found.total}G (${found.totalBase}G x ${found.nbTiraj})</b><br><button onclick="reprintDirect('${found.id}')" style="background:#000;color:#facc15;padding:8px;border-radius:8px;width:100%;margin-top:6px">🖨️ PRINT</button></div>`:'Pa jwenn'; };
window.reprintDirect=async(id)=>{ let s=await get(child(ref(db),'fiches/'+id)); if(!s.exists())return; let f=s.val(); let ticket=`C&D LOTTO\n${f.vendeur}\n${new Date(f.date).toLocaleString('fr-HT',{timeZone:'America/New_York'})}\n${(f.tirajs||[]).join(' / ')}\n----------------\n${(f.details||[]).map(p=>`${p.type.toUpperCase()} ${p.boul} ${p.montan}G x${f.nbTiraj}`).join('\n')}\n----------------\nBase: ${f.totalBase}G x ${f.nbTiraj}\nTOTAL: ${f.total}G\nID:${f.id.slice(-5).toUpperCase()}`; printTicket58mm(ticket); };
async function loadAll(){ genererRapport(); let s=await get(child(ref(db),'fiches')); if(!s.exists())return; let today=getDateHaiti(); let all=Object.values(s.val()).filter(f=> getDateHaiti(new Date(f.date))===today && f.vendeur===vendeur ); let lf=document.getElementById('listFiches'); if(lf){ lf.innerHTML=''; all.slice().reverse().forEach(f=>{ lf.innerHTML+=`<div style="border:1px solid #eee;padding:8px;border-radius:10px;margin:6px 0;font-size:12px"><b>${(f.tirajs||[]).join('/')} - ${f.total}G</b> <span style="font-size:10px">(${f.totalBase}G x ${f.nbTiraj})</span><button onclick="reprintDirect('${f.id}')" style="float:right;background:#000;color:#facc15;padding:4px 10px;border-radius:6px">Print</button><br>${(f.details||[]).map(d=>d.boul).join(', ')}</div>`; }); } }
window.valideFich=async()=>{ if(panier.length===0)return; let tirajs=getT(); if(tirajs.length===0)return; let base=panier.reduce((a,b)=>a+b.montan,0); let total=base*tirajs.length; let id=push(child(ref(db),'fiches')).key; await set(ref(db,'fiches/'+id),{id:id,vendeur:vendeur,tirajs:tirajs,details:panier,total:total,totalBase:base,nbTiraj:tirajs.length,date:new Date().toISOString()}); let ticket=`C&D LOTTO\n${vendeur.toUpperCase()}\n${new Date().toLocaleString('fr-HT',{timeZone:'America/New_York'})}\n${tirajs.join(' / ')}\n----------------\n${panier.map(p=>`${p.type.toUpperCase()} ${p.boul} ${p.montan}G x${tirajs.length}`).join('\n')}\n----------------\nBase: ${base}G x ${tirajs.length}\nTOTAL: ${total}G\nID:${id.slice(-5).toUpperCase()}\nMèsi!`; printTicket58mm(ticket); panier=[]; render(); loadAll(); };
init();
</script></body></html>
