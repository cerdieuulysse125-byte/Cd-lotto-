<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D V99 FINAL</title>
<style>*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;font-family:sans-serif;background:#f1f5f9;padding:6px;padding-bottom:90px;max-width:100vw}.hdr{background:#facc15;padding:8px 10px;border-radius:10px;display:flex;justify-content:space-between;font-weight:bold;font-size:12px}.card{background:#fff;border-radius:12px;padding:10px;margin:6px 0;box-shadow:0 1px 4px rgba(0,0,0,.08);width:100%}.tirajGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.tirajItem{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:6px 8px;display:flex;gap:6px;font-size:11px;align-items:center;cursor:pointer;min-height:38px}.tirajItem.on{background:#dcfce7;border-color:#22c55e;font-weight:bold}.tirajItem.ferme{background:#e5e7eb!important;opacity:.4;pointer-events:none}.tirajItem input{width:16px;height:16px}.row3{display:grid;grid-template-columns:0.9fr 1.1fr 0.7fr;gap:4px;width:100%}.row3 select,.row3 input{padding:8px 4px;border:1.5px solid #000;border-radius:8px;text-align:center;font-weight:bold;font-size:14px;height:42px;width:100%}.btnAdd{background:#22c55e;color:#fff;width:100%;padding:10px;border:none;border-radius:10px;font-weight:bold;font-size:14px;margin-top:6px}.totalBox{display:flex;justify-content:space-between;font-weight:900;font-size:20px;margin:12px 2px}.btnValide{background:#0f172a;color:#facc15;width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;font-size:14px}.sec{display:none}.sec.active{display:block}.tabs{position:fixed;bottom:0;left:0;width:100%;background:#0f172a;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:6px;z-index:9999}.tabBtn{background:#1e293b;color:#94a3b8;padding:12px 2px;border-radius:8px;font-size:10px;font-weight:bold;border:none}.tabBtn.active{background:#facc15;color:#000}
@media print{@page{size:58mm auto;margin:0}body *{display:none!important}#ticketSantee{display:block!important;position:fixed;top:0;left:0;width:58mm;background:#fff;color:#000;font-family:monospace;padding:6px;font-size:11px;white-space:pre-wrap}#ticketSantee *{display:block!important}}</style></head>
<body>

<div class="hdr"><span>tamouche</span><span id="dateNow">06/08/2026</span><span style="opacity:0">.</span></div>
<div style="background:#dcfce7;padding:6px;border-radius:8px;text-align:center;font-weight:bold;font-size:11px;margin:5px 0">✅ Ouvè - Lè Ayiti: <span id="heureAyiti">--:--</span></div>

<!-- VANN -->
<div id="secVANN" class="sec active">
<div class="card"><div style="font-weight:bold;font-size:12px;margin-bottom:5px">Tiraj - Chwazi plizyè</div><div class="tirajGrid" id="tirajGrid"></div></div>
<div class="card" style="border:1.5px solid #000">
<div style="font-size:10px;font-weight:bold;color:#64748b">ENTÈTE FICH LA</div>
<div id="entetePreview" style="background:#f8fafc;padding:5px;border-radius:6px;font-size:10px;border:1px dashed #cbd5e1;margin:4px 0"></div>
<div class="row3"><select id="tip"><option value="bolet">Bolet</option><option value="mariage">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select><input id="boul" placeholder="BOUL" inputmode="numeric" maxlength="5"><input id="montan" placeholder="G" inputmode="numeric" type="number"></div>
<button id="btnAdd" class="btnAdd">+ AJOUTE (Flèche ↓)</button><div id="liste" style="margin-top:8px;font-size:12px"></div><div class="totalBox"><span>Total</span><span id="tTotal">0G</span></div><button onclick="valideFich()" class="btnValide">✅ Validé + Imprimer</button>
</div>
</div>

<!-- KOPYE - ID SELMAN -->
<div id="secKOPYE" class="sec"><div class="card"><b>📋 Kopye Ticket</b><div style="background:#fef9c3;padding:6px;border-radius:6px;font-size:10px;margin:6px 0">Tape 5 dènye chif ID ticket la</div><div style="display:grid;grid-template-columns:1fr auto;gap:6px;margin:10px 0"><input id="searchId" placeholder="ID (5 chif)" style="padding:12px;border-radius:10px;border:2px solid #000;font-weight:bold;text-transform:uppercase"><button onclick="chercheParId()" style="background:#0f172a;color:#facc15;padding:12px 16px;border-radius:10px;font-weight:bold;border:none">CHÈCHE</button></div><div id="resultSearch"></div></div></div>

<!-- RAPO - DU AU TIRAJ TOUT -->
<div id="secRAPO" class="sec"><div class="card"><b>📊 Rapò</b>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0"><div><label style="font-size:10px;font-weight:bold">Du</label><input id="rapDu" type="date" style="width:100%;padding:8px;border-radius:8px;border:1.5px solid #000"></div><div><label style="font-size:10px;font-weight:bold">Au</label><input id="rapAu" type="date" style="width:100%;padding:8px;border-radius:8px;border:1.5px solid #000"></div></div>
<div><label style="font-size:10px;font-weight:bold">Tiraj (...., tout)</label><select id="rapTiraj" style="width:100%;padding:8px;border-radius:8px;border:1.5px solid #000"><option value="">Tout</option><option value="FL MIDI">FL MIDI</option><option value="FL SOIR">FL SOIR</option><option value="GA MIDI">GA MIDI</option><option value="GA SOIR">GA SOIR</option><option value="NY MIDI">NY MIDI</option><option value="NY SOIR">NY SOIR</option></select></div>
<button onclick="genererRapport()" style="width:100%;padding:10px;background:#0f172a;color:#facc15;border:none;border-radius:10px;font-weight:bold;margin-top:8px">🔍 Générer Rapport</button>
<div id="rapData" style="margin-top:12px;background:#f8fafc;padding:12px;border-radius:10px;border:1px solid #e2e8f0;font-size:12px;line-height:26px"></div>
</div></div>

<!-- FICHES -->
<div id="secFICHES" class="sec"><div class="card"><b>🎫 Mes Fiches</b><div id="listFiches"></div></div></div>

<div class="tabs"><button onclick="showTab('VANN')" id="tabVANN" class="tabBtn active">VANN</button><button onclick="showTab('KOPYE')" id="tabKOPYE" class="tabBtn">KOPYE</button><button onclick="showTab('RAPO')" id="tabRAPO" class="tabBtn">RAPÒ</button><button onclick="showTab('FICHES')" id="tabFICHES" class="tabBtn">FICHES</button></div>
<div id="ticketSantee" style="display:none"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"}; const app=initializeApp(cfg); const db=getDatabase(app);
let vendeur="tamouche", panier=[], allFiches=[];
let TIRAJS=[{n:"FL MIDI",h:"13:15",m:795},{n:"FL SOIR",h:"21:20",m:1280},{n:"GA MIDI",h:"12:15",m:735},{n:"GA SOIR",h:"18:15",m:1095},{n:"NY MIDI",h:"14:18",m:858},{n:"NY SOIR",h:"21:30",m:1290}];

function init(){
 let g=document.getElementById('tirajGrid'); g.innerHTML="";
 TIRAJS.forEach(t=>{ g.innerHTML+=`<label class="tirajItem" id="box-${t.n.replace(/ /g,'')}"><input type="checkbox" value="${t.n}" class="chkT" onchange="updT('${t.n}')"> ${t.n} (${t.h})</label>`; });
 checkFermeture(); setInterval(checkFermeture,60000);
 let today=new Date().toISOString().split('T')[0]; document.getElementById('rapDu').value=today; document.getElementById('rapAu').value=today;
 document.getElementById('dateNow').innerText=new Date().toLocaleDateString('fr-HT');
 setInterval(()=>{ let e=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); document.getElementById('heureAyiti').innerText=e.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); },1000);
 render(); loadAll();
}
function checkFermeture(){
 let now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); let cur=now.getHours()*60+now.getMinutes();
 TIRAJS.forEach(t=>{ let box=document.getElementById('box-'+t.n.replace(/ /g,'')); if(!box)return; if(cur>=t.m){ box.classList.add('ferme'); box.querySelector('input').checked=false; box.querySelector('input').disabled=true; } else{ box.classList.remove('ferme'); box.querySelector('input').disabled=false; } });
}
window.updT=(n)=>{ let b=document.getElementById('box-'+n.replace(/ /g,'')); if(b.classList.contains('ferme'))return; let c=document.querySelector(`input[value="${n}"]`); b.classList.toggle('on',c.checked); render(); }
function getT(){return [...document.querySelectorAll('.chkT:checked')].map(c=>c.value);}
function render(){ let div=document.getElementById('liste'); div.innerHTML=''; let base=0; panier.forEach((p,i)=>{ base+=p.montan; div.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee"><span><b>${p.type}</b> ${p.boul}</span><span>${p.montan}G <button onclick="retire(${i})" style="background:#ef4444;color:#fff;border:none;padding:1px 6px;border-radius:4px">x</button></span></div>`; }); let nb=getT().length||0; let total=nb===0?0:base*nb; document.getElementById('tTotal').innerText=total+"G"; document.getElementById('entetePreview').innerHTML=`Vandè: <b>${vendeur}</b> | ${getT().join(' / ')||'Pa chwazi tiraj'}<br>${panier.length} fich - Base ${base}G x ${nb} = <b>${total}G</b>`; }
window.retire=(i)=>{panier.splice(i,1);render();}
function addPanier(){ let tip=document.getElementById('tip').value; let boul=document.getElementById('boul').value.trim(); let montan=parseInt(document.getElementById('montan').value); if(getT().length===0){alert('Chwazi tiraj');return;} if(!boul||!montan){alert('Mete BOUL ak G');return;} panier.push({type:tip,boul:boul,montan:montan}); render(); document.getElementById('boul').value=""; document.getElementById('montan').value=""; document.getElementById('boul').focus(); }
document.getElementById('btnAdd').addEventListener('click',addPanier);
document.getElementById('boul').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('montan').focus(); }});
document.getElementById('montan').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addPanier(); }});
window.showTab=(t)=>{ document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active')); document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active')); document.getElementById('sec'+t).classList.add('active'); document.getElementById('tab'+t).classList.add('active'); if(t!=='VANN') loadAll(); };

window.genererRapport=async()=>{
 let du=document.getElementById('rapDu').value || new Date().toISOString().split('T')[0];
 let au=document.getElementById('rapAu').value || new Date().toISOString().split('T')[0];
 let tirajF=document.getElementById('rapTiraj').value;
 let s=await get(child(ref(db),'fiches')); if(!s.exists()){document.getElementById('rapData').innerHTML="Pa gen done";return;}
 let all=Object.values(s.val()).filter(f=> f.vendeur===vendeur);
 let filtres=all.filter(f=>{ let d=f.date.split('T')[0]; if(d<du||d>au) return false; if(tirajF &&!(f.tirajs||[]).includes(tirajF)) return false; return true; });
 let vente=filtres.reduce((a,b)=>a+(b.total||0),0); let kom=Math.round(vente*0.1); let paye=0; let balans=vente-kom-paye;
 let parTiraj={}; filtres.forEach(f=>{ (f.tirajs||[]).forEach(t=>{ parTiraj[t]=(parTiraj[t]||0)+ (f.totalBase||0); }); });
 document.getElementById('rapData').innerHTML=`
 <div style="border-bottom:1px dashed #cbd5e1;padding-bottom:6px;margin-bottom:8px;font-size:11px"><b>Du:</b> ${du} <b>Au:</b> ${au}<br><b>Tiraj:</b> ${tirajF||'Tout (....)'}</div>
 <div style="display:grid;grid-template-columns:1fr auto"><span>Vente:</span><b>${vente}G</b></div>
 <div style="display:grid;grid-template-columns:1fr auto"><span>Komisyon (10%):</span><b>${kom}G</b></div>
 <div style="display:grid;grid-template-columns:1fr auto"><span>Payé:</span><b>${paye}G</b></div>
 <div style="display:grid;grid-template-columns:1fr auto;font-weight:900;font-size:16px;border-top:2px solid #000;margin-top:8px;padding-top:8px"><span>Balans Net:</span><span>${balans}G</span></div>
 <div style="margin-top:10px;font-size:10px;background:#fff;padding:6px;border-radius:6px">${Object.keys(parTiraj).length?Object.keys(parTiraj).map(t=>`${t}: ${parTiraj[t]}G`).join('<br>'):'Pa gen detay'}</div>
 <div style="margin-top:8px;font-size:10px;color:#64748b">${filtres.length} fich jwenn</div>
 `;
 allFiches=filtres;
};

window.chercheParId=async()=>{
 let q=document.getElementById('searchId').value.trim().toLowerCase(); if(!q){alert('Mete ID');return;}
 document.getElementById('resultSearch').innerHTML="⏳...";
 let s=await get(child(ref(db),'fiches')); if(!s.exists()){document.getElementById('resultSearch').innerHTML="Pa gen fich";return;}
 let all=Object.values(s.val()); let found=all.find(f=> f.id.toLowerCase().includes(q) || f.id.slice(-5).toLowerCase()===q);
 if(!found){document.getElementById('resultSearch').innerHTML=`<div style="background:#fee2e2;padding:8px;border-radius:8px">❌ ${q.toUpperCase()} pa jwenn</div>`;return;}
 document.getElementById('resultSearch').innerHTML=`<div style="border:2px solid #22c55e;background:#dcfce7;padding:10px;border-radius:10px;font-size:11px"><b>✅ ${found.id.slice(-5).toUpperCase()} - ${found.total}G</b><br>${(found.tirajs||[]).join('/')} - ${(found.details||[]).map(d=>d.boul).join(',')}<br><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button onclick="kopyeDirect('${found.id}')" style="background:#facc15;padding:10px;border:none;border-radius:8px;font-weight:900">📋 KOPYE</button><button onclick="reprintDirect('${found.id}')" style="background:#0f172a;color:#facc15;padding:10px;border:none;border-radius:8px;font-weight:900">🖨️ PRINT</button></div></div>`;
 allFiches=all;
};
window.kopyeDirect=async(id)=>{ let s=await get(child(ref(db),'fiches/'+id)); if(!s.exists())return; let f=s.val(); panier=JSON.parse(JSON.stringify(f.details)); document.querySelectorAll('.chkT').forEach(c=>c.checked=false); document.querySelectorAll('.tirajItem').forEach(b=>b.classList.remove('on')); (f.tirajs||[]).forEach(tn=>{ let c=document.querySelector(`input[value="${tn}"]`); if(c&&!c.disabled){c.checked=true; document.getElementById('box-'+tn.replace(/ /g,'')).classList.add('on');}}); render(); showTab('VANN'); };
window.reprintDirect=async(id)=>{ let s=await get(child(ref(db),'fiches/'+id)); if(!s.exists())return; let f=s.val(); let t=` C&D LOTTO\n${f.vendeur} - ${new Date(f.date).toLocaleString()}\n${(f.tirajs||[]).join(' / ')}\n----------------\n`; f.details.forEach(p=>{t+=`${p.type.toUpperCase()} ${p.boul} ${p.montan}G x${f.nbTiraj}\n`;}); t+=`----------------\nTOTAL: ${f.total}G\nID:${f.id.slice(-5)}\n`; document.getElementById('ticketSantee').innerText=t; window.print(); };
async function loadAll(){ genererRapport(); let s=await get(child(ref(db),'fiches')); if(!s.exists())return; let today=new Date().toISOString().split('T')[0]; let all=Object.values(s.val()).filter(f=>f.date&&f.date.split('T')[0]===today&&f.vendeur===vendeur); let lf=document.getElementById('listFiches'); if(lf){ lf.innerHTML=all.length?'':'Pa gen fich'; all.slice().reverse().forEach(f=>{ lf.innerHTML+=`<div style="border:1px solid #eee;padding:6px;border-radius:8px;margin:4px 0;font-size:11px"><b>${(f.tirajs||[]).join('/')} - ${f.total}G</b> <button onclick="reprintDirect('${f.id}')" style="float:right;background:#000;color:#facc15;padding:2px 8px;border-radius:6px">Print</button><br>${(f.details||[]).map(d=>d.boul).join(', ')}</div>`; }); } }
window.reprint=(id)=>{ reprintDirect(id); };
window.kopyeF=(id)=>{ kopyeDirect(id); };
window.valideFich=async()=>{ if(panier.length===0){alert('Panier vid');return;} let tirajs=getT(); if(tirajs.length===0){alert('Chwazi tiraj');return;} let base=panier.reduce((a,b)=>a+b.montan,0); let total=base*tirajs.length; let id=push(child(ref(db),'fiches')).key; await set(ref(db,'fiches/'+id),{id:id,vendeur:vendeur,tirajs:tirajs,details:panier,total:total,totalBase:base,nbTiraj:tirajs.length,date:new Date().toISOString()}); let tt=` C&D LOTTO\n${vendeur} - ${new Date().toLocaleString()}\n${tirajs.join(' / ')}\n----------------\n`; panier.forEach(p=>{tt+=`${p.type.toUpperCase()} ${p.boul} ${p.montan}G x${tirajs.length}\n`;}); tt+=`----------------\nTOTAL: ${total}G (${base}G x ${tirajs.length})\nID:${id.slice(-5)}\n`; document.getElementById('ticketSantee').innerText=tt; window.print(); panier=[]; render(); loadAll(); };
init();
</script></body></html>
