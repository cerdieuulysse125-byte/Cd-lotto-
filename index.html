<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C&D VENDEUR V71 FINAL</title>
<style>body{font-family:Arial;background:#0f172a;color:#fff;padding:12px}.card{background:#1e293b;padding:12px;border-radius:12px;margin:8px 0;border:1px solid #334155} input,select,button{padding:10px;border-radius:8px;border:1px solid #475569} button{background:#facc15;font-weight:bold;color:#000} </style></head><body>
<h2 style="color:#facc15;text-align:center">C&D VERITE LOTTO VENDEUR V71</h2>
<div id="horloge" style="text-align:center;color:#facc15"></div>
<div class="card">ID Vendeur: <input id="vendId" value="vendeur1"> Tiraj: <select id="tirajSel"></select> <span id="statFerme"></span></div>
<div class="card">Tip: <select id="tip"><option value="bolet">Bolet (50/20/10)</option><option value="maryaj">Maryaj (1000)</option><option value="loto3">Loto3 (500)</option><option value="loto4">Loto4 (5000)</option><option value="loto5">Loto5 (25000)</option></select><br><br>Boul: <input id="boul" placeholder="23 ou 23-45"><br><br>Montan: <input id="montan" type="number" value="10">G <button onclick="ajoute()">Ajoute</button></div>
<div class="card"><h3>Tikè - <span id="cnt">0</span> fich</h3><div id="tikets"></div><h3>Total: <span id="tot">0</span>G</h3><button onclick="valide()" id="btnValide" style="width:100%;padding:14px;font-size:18px">✅ VALIDE - ENPRIME</button></div>
<div class="card" style="font-size:12px;color:#94a3b8">Fermeture EST: FL 13h15/21h15 GA 12h20/18h20 NY 14h15/21h30 | Firebase: cerdieulotto ✅</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyA1_MK9_5ou2opJA_LRfMTgSEY56W7HQEs",
  authDomain: "cerdieulotto.firebaseapp.com",
  projectId: "cerdieulotto",
  storageBucket: "cerdieulotto.firebasestorage.app",
  messagingSenderId: "614410442443",
  appId: "1:614410442443:web:ed0f44671b4b0ff60bed4e",
  measurementId: "G-M6CJ9DZGET",
  databaseURL: "https://cerdieulotto-default-rtdb.firebaseio.com"
};
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const TIRAJ=[{id:"gaam",nom:"GA AM",ferme:"12:20",h:12,m:20},{id:"flam",nom:"FL AM",ferme:"13:15",h:13,m:15},{id:"nyam",nom:"NY AM",ferme:"14:15",h:14,m:15},{id:"gapm",nom:"GA PM",ferme:"18:20",h:18,m:20},{id:"flpm",nom:"FL PM",ferme:"21:15",h:21,m:15},{id:"nypm",nom:"NY PM",ferme:"21:30",h:21,m:30}];
let panier=[];
function refreshHorloge(){
 const now=new Date(); const est=new Date(now.toLocaleString("en-US",{timeZone:"America/New_York"}));
 document.getElementById('horloge').innerText="EST: "+est.toLocaleTimeString()+" | Ayiti: "+now.toLocaleTimeString();
 let sel=document.getElementById('tirajSel'); if(sel.options.length===0){ TIRAJ.forEach(t=>{ const opt=document.createElement('option'); opt.value=t.id; opt.text=t.nom+" - "+t.ferme+" EST"; sel.appendChild(opt); }); }
 checkFerme();
}
function checkFerme(){
 const t=TIRAJ.find(x=>x.id==tirajSel.value); if(!t) return;
 const nowEST=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"}));
 const ferm=new Date(nowEST); ferm.setHours(t.h,t.m,0,0);
 if(nowEST>=ferm){ statFerme.innerHTML="🔴 FEMEN"; btnValide.disabled=true; } else { statFerme.innerHTML="🟢 OUVÈ"; btnValide.disabled=false; }
}
setInterval(refreshHorloge,1000); refreshHorloge(); tirajSel.onchange=checkFerme;
window.ajoute=()=>{ const b=boul.value.trim(); const m=+montan.value; if(!b||!m) return alert("Antre boul ak montan"); panier.push({tiraj:tirajSel.value,type:tip.value,boul:b,montan:m,heure:new Date().toISOString()}); boul.value=""; render(); };
function render(){ tikets.innerHTML=panier.map((p,i)=>`${i+1}. ${p.tiraj} ${p.type} ${p.boul} ${p.montan}G <button onclick="panier.splice(${i},1);render()" style="background:#ef4444;color:#fff">X</button>`).join('<br>'); let tot=panier.reduce((s,p)=>s+p.montan,0); document.getElementById('tot').innerText=tot; document.getElementById('cnt').innerText=panier.length; }
window.valide=()=>{ if(panier.length==0) return alert("Vide"); const today=new Date().toISOString().split('T')[0]; const vend=vendId.value||'vendeur1'; panier.forEach(f=>{ const k=push(ref(db,'ventes/'+today+'/'+vend)).key; set(ref(db,'ventes/'+today+'/'+vend+'/'+k),f); }); alert("✅ "+panier.length+" fich anrejistre!"); panier=[]; render(); };
</script></body></html>
