<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROPRIO V119 LYE V106</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f1f5f9;padding-bottom:80px}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:900}.card{background:#fff;padding:12px;border-radius:12px;margin:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)} input,select,button{width:100%;padding:11px;border-radius:8px;border:1.5px solid #000;margin:4px 0} button{background:#000;color:#FFD700;font-weight:900;border:none}.tab{position:fixed;bottom:0;left:0;width:100%;background:#000;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:2px;padding:6px}.tab button{font-size:10px;padding:10px 2px}.tab button.active{background:#FFD700;color:#000}.tirajItem{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee}.badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:900}.ouvert{background:#dcfce7;color:#166534}.ferme{background:#fee2e2;color:#991b1b}</style>
</head><body>
<div class="h">C&D PROPRIO V119 - LYE V106</div>
<div id="login" class="card" style="text-align:center;margin-top:30px"><h3>Proprio</h3><input id="code" value="230788" type="tel"><button onclick="go()">Antre</button></div>
<div id="app" style="display:none">
<div id="secVente" class="sec"><div class="card"><h3>📊 Vente Jodi a</h3><div id="venteData"></div></div></div>
<div id="secTiraj" class="sec" style="display:none">
<div class="card"><h3>⏰ Lè Fèmti (EST)</h3><div id="hList"></div><button onclick="saveH()">💾 Sove Lè</button></div>
<div class="card"><h3>🔒 Ouvè / Fèmen Tiraj</h3><div id="tFList"></div></div>
<div class="card"><h3>🎯 Antre Rezilta Tiraj - Fich ap korije otomatik</h3>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"><input type="date" id="rDate"><select id="rTiraj"><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><select id="rPos"><option value="1">1er Pos (50)</option><option value="2">2e Pos (20)</option><option value="3">3e Pos (10)</option></select></div>
<input id="rNum" type="tel" placeholder="Nimewo ki soti (ex: 45)" style="text-align:center;font-size:18px;font-weight:900">
<button onclick="saveResult()" style="background:#22c55e;color:#fff">💾 SAVE REZILTA & KORIJE FICH YO</button>
<div id="rList" style="margin-top:10px"></div>
</div>
<div class="card"><h3>💰 Gains (50-20-10)</h3><div id="gList"></div><button onclick="saveG()">Sove Gains</button></div>
</div>
<div id="secVendeur" class="sec" style="display:none">
<div class="card"><h3>👥 Vendeur - Bloke / Debloke</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="vCode" placeholder="Code vendeur"><input id="vNom" placeholder="Non"></div>
<button onclick="addV()">+ Ajoute Vendeur</button>
<div id="vList" style="margin-top:10px"></div>
</div>
</div>
<div id="secFiches" class="sec" style="display:none"><div class="card"><h3>🎫 Fiches Jodi a</h3><div id="fList"></div></div></div>
</div>
<div class="tab"><button id="bVente" class="active" onclick="show('Vente')">Vente</button><button id="bTiraj" onclick="show('Tiraj')">Tiraj</button><button id="bVendeur" onclick="show('Vendeur')">Vandè</button><button id="bFiches" onclick="show('Fiches')">Fich</button></div>
<script>
const firebaseConfig={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let config={}, fiches={}, vendors={}, gains={};
let tirajDef=[{id:'gaMidi',nom:'GA MIDI'},{id:'flMidi',nom:'FL MIDI'},{id:'nyMidi',nom:'NY MIDI'},{id:'gaSoir',nom:'GA SOIR'},{id:'flSoir',nom:'FL SOIR'},{id:'nySoir',nom:'NY SOIR'}];
let defGains={bolet:{g1:50,g2:20,g3:10}, maryaj:{g1:1000}, loto3:{g1:500}, loto4:{g1:5000}, loto5:{g1:10000}};

function go(){ if(document.getElementById('code').value!=="230788") return alert('Kòd pa bon'); document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; init(); }
function init(){
  document.getElementById('rDate').value=new Date().toISOString().split('T')[0];
  db.ref('config').on('value',s=>{ config=s.val()||{}; gains=config.gains||defGains; renderH(); renderTF(); renderG(); });
  db.ref('vendors').on('value',s=>{ vendors=s.val()||{}; renderV(); });
  db.ref('fiches').on('value',s=>{ fiches=s.val()||{}; renderVente(); renderFiches(); renderRList(); });
}
function show(n){ document.querySelectorAll('.sec').forEach(x=>x.style.display='none'); document.getElementById('sec'+n).style.display='block'; document.querySelectorAll('.tab button').forEach(b=>b.classList.remove('active')); document.getElementById('b'+n).classList.add('active'); }
function renderH(){
  const he=config.heures||{gaMidi:'12:15',flMidi:'13:15',nyMidi:'14:15',gaSoir:'18:15',flSoir:'21:20',nySoir:'21:30'};
  let h=''; tirajDef.forEach(t=>{ h+=`<div style="display:grid;grid-template-columns:1fr 80px;gap:6px;margin:4px 0"><span>${t.nom}</span><input id="h_${t.id}" value="${he[t.id]||''}"></div>`; });
  document.getElementById('hList').innerHTML=h;
}
function saveH(){ let he={}; tirajDef.forEach(t=>{ he[t.id]=document.getElementById('h_'+t.id).value; }); db.ref('config/heures').set(he); alert('Lè sove - V106 ap pran li'); }

function renderTF(){
  const tf=config.tirages||{}; let h=''; tirajDef.forEach(t=>{
    const st=tf[t.id]||'OUVE'; h+=`<div class="tirajItem"><span>${t.nom}</span><span class="badge ${st==='OUVE'?'ouvert':'ferme'}">${st}</span><button style="width:80px;padding:4px;background:${st==='OUVE'?'#ef4444':'#22c55e'};color:#fff" onclick="toggleT('${t.id}')">${st==='OUVE'?'FÈMEN':'OUVÈ'}</button></div>`;
  }); document.getElementById('tFList').innerHTML=h;
}
function toggleT(id){ const cur=(config.tirages||{})[id]||'OUVE'; const next=cur==='OUVE'?'FERME':'OUVE'; db.ref('config/tirages/'+id).set(next); }

function renderV(){
  let h=''; Object.keys(vendors).forEach(k=>{
    const v=vendors[k]; const st=v.status||'OUVE';
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;background:#f8f8f8;padding:8px;border-radius:8px;margin:4px 0"><span><b>${k.toUpperCase()}</b> - <span class="badge ${st==='OUVE'?'ouvert':'ferme'}">${st}</span></span><div><button style="width:70px;background:${st==='OUVE'?'#ef4444':'#22c55e'};color:#fff;padding:6px" onclick="toggleV('${k}')">${st==='OUVE'?'BLOKE':'DEBLOKE'}</button> <button style="width:40px;background:#000;color:#FFD700" onclick="delV('${k}')">X</button></div></div>`;
  }); document.getElementById('vList').innerHTML=h||'Pa gen vandè';
}
function addV(){ const c=document.getElementById('vCode').value.trim().toLowerCase(); if(!c) return; db.ref('vendors/'+c).set({nom:document.getElementById('vNom').value||c,status:'OUVE',pass:'1234'}); document.getElementById('vCode').value=''; }
function toggleV(k){ const cur=(vendors[k].status||'OUVE'); const next=cur==='OUVE'?'FERME':'OUVE'; db.ref('vendors/'+k+'/status').set(next); }
function delV(k){ if(confirm('Efase '+k+'?')) db.ref('vendors/'+k).remove(); }

function renderG(){
  let h=''; Object.keys(defGains).forEach(k=>{
    const g=gains[k]||defGains[k];
    h+=`<div style="background:#f8f8f8;padding:8px;border-radius:8px;margin:4px 0"><b>${k.toUpperCase()}</b><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px"><div>1er<input id="g1_${k}" value="${g.g1||0}"></div><div>2e<input id="g2_${k}" value="${g.g2||0}"></div><div>3e<input id="g3_${k}" value="${g.g3||0}"></div></div></div>`;
  }); document.getElementById('gList').innerHTML=h;
}
function saveG(){ let ng={}; Object.keys(defGains).forEach(k=>{ ng[k]={g1:parseInt(document.getElementById('g1_'+k).value)||0,g2:parseInt(document.getElementById('g2_'+k).value)||0,g3:parseInt(document.getElementById('g3_'+k).value)||0}; }); db.ref('config/gains').set(ng); alert('Gains sove'); }

function saveResult(){
  const date=document.getElementById('rDate').value; const tiraj=document.getElementById('rTiraj').value; const pos=document.getElementById('rPos').value; const num=document.getElementById('rNum').value.trim();
  if(!date||!num) return alert('Mete dat ak nimewo');
  db.ref('config/resultats/'+date+'/'+tiraj+'/'+pos).set(num).then(()=>{
    document.getElementById('rNum').value=''; alert('Rezilta sove - kounya m ap korije fich yo...');
    korijeFiches(date,tiraj);
  });
}
function korijeFiches(date,tiraj){
  const res=(config.resultats||{})[date]||{}; const resT=res[tiraj]||{};
  if(!resT) return;
  const g=gains||defGains;
  Object.values(fiches).filter(f=>f.dateStr===date && (f.tirajs||[]).includes(tiraj)).forEach(f=>{
    let totalGain=0;
    (f.details||[]).forEach(d=>{
      if(d.type==='bolet' || d.type==='bole'){
        if(d.boul===resT['1']) totalGain+=d.montan*(g.bolet?.g1||50);
        if(d.boul===resT['2']) totalGain+=d.montan*(g.bolet?.g2||20);
        if(d.boul===resT['3']) totalGain+=d.montan*(g.bolet?.g3||10);
      }
      if(d.type==='loto3' && d.boul===resT['1']) totalGain+=d.montan*(g.loto3?.g1||500);
      if(d.type==='loto4' && d.boul===resT['1']) totalGain+=d.montan*(g.loto4?.g1||5000);
    });
    db.ref('fiches/'+f.id+'/gain').set(totalGain);
  });
}
function renderRList(){
  const date=document.getElementById('rDate').value; const all=config.resultats||{}; const day=all[date]||{};
  let h=''; Object.keys(day).forEach(t=>{ h+=`<div style="background:#dcfce7;padding:6px;border-radius:6px;margin:3px 0"><b>${t}</b> - 1er:${day[t]['1']||'-'} 2e:${day[t]['2']||'-'} 3e:${day[t]['3']||'-'}</div>`; });
  document.getElementById('rList').innerHTML=h||'Pa gen rezilta pou jou sa';
}
function renderVente(){
  const today=new Date().toISOString().split('T')[0];
  let all=Object.values(fiches).filter(f=>f.dateStr===today);
  const vente=all.reduce((a,b)=>a+(b.total||0),0); const gain=all.reduce((a,b)=>a+(b.gain||0),0);
  document.getElementById('venteData').innerHTML=`Fich: ${all.length}<br>Vente: ${vente}$<br>Gain Peye: ${gain}$<br>Net: ${vente-gain-Math.round(vente*0.1)}$`;
}
function renderFiches(){
  let all=Object.values(fiches).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
  let h=''; all.forEach(f=>{
    const win=f.gain?` <b style="color:green">WIN:${f.gain}$</b>`:'';
    h+=`<div style="border:1px solid #ddd;padding:6px;margin:4px 0;border-radius:6px;font-size:12px">${f.dateStr} - ${f.vendeur} - ${(f.tirajs||[]).join('/')} - ${f.total}$${win}<br><small>${(f.details||[]).map(d=>d.boul+' '+d.montan+'$').join(', ')}</small></div>`;
  });
  document.getElementById('fList').innerHTML=h;
}
</script></body></html>
