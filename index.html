<div class="panel" id="p3">
<h3>4. PRIX - BÒLÈT + MARYAJ + LOTO</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div><label style="font-size:11px;font-weight:bold;color:#000">Bòlèt 1er lot x50</label><input id="prixB1" type="number" class="inputBox" value="50" placeholder="50"></div>
<div><label style="font-size:11px;font-weight:bold;color:#000">Bòlèt 2e lot x20</label><input id="prixB2" type="number" class="inputBox" value="20" placeholder="20"></div>
<div><label style="font-size:11px;font-weight:bold;color:#000">Bòlèt 3e lot x10</label><input id="prixB3" type="number" class="inputBox" value="10" placeholder="10"></div>
<div><label style="font-size:11px;font-weight:bold;color:red">Maryaj 1000</label><input id="prixMaryaj" type="number" class="inputBox" value="1000" placeholder="1000"></div>
<div><label style="font-size:11px;font-weight:bold;color:blue">Loto3 500</label><input id="prixLoto3" type="number" class="inputBox" value="500" placeholder="500"></div>
<div><label style="font-size:11px;font-weight:bold;color:blue">Loto4 5000</label><input id="prixLoto4" type="number" class="inputBox" value="5000" placeholder="5000"></div>
<div style="grid-column:span 2"><label style="font-size:11px;font-weight:bold;color:blue">Loto5 25000</label><input id="prixLoto5" type="number" class="inputBox" value="25000" placeholder="25000"></div>
</div>
<button class="btn" onclick="savePrix()" style="margin-top:10px">💾 Save Prix</button>
<div class="small" style="background:#000;color:#00ff88;padding:8px;border-radius:8px;margin-top:8px">
✅ 1er=50 | 2e=20 | 3e=10 | Maryaj 1000 | Dezòd 27x12=12x27<br>
Loto3=500 Loto4=5000 Loto5=25000
</div>
</div>

<script>
async function savePrix(){ 
 const p={
   BOLET_1ER:parseInt(document.getElementById('prixB1').value)||50,
   BOLET_2E:parseInt(document.getElementById('prixB2').value)||20,
   BOLET_3E:parseInt(document.getElementById('prixB3').value)||10,
   MARYAJ:parseInt(document.getElementById('prixMaryaj').value)||1000,
   M1:parseInt(document.getElementById('prixMaryaj').value)||1000,
   M2:parseInt(document.getElementById('prixMaryaj').value)||1000,
   M3:parseInt(document.getElementById('prixMaryaj').value)||1000,
   LOTO3:parseInt(document.getElementById('prixLoto3').value)||500,
   LOTO4:parseInt(document.getElementById('prixLoto4').value)||5000,
   LOTO5:parseInt(document.getElementById('prixLoto5').value)||25000
 }; 
 await db.collection('config').doc('global').set({prix:p},{merge:true}); 
 alert("✅ Prix save!\nBòlèt 1er="+p.BOLET_1ER+" 2e="+p.BOLET_2E+" 3e="+p.BOLET_3E+"\nMaryaj="+p.MARYAJ+" L3="+p.LOTO3+" L4="+p.LOTO4+" L5="+p.LOTO5); 
}
async function loadPrixConfig(){
 try{
  const doc=await db.collection('config').doc('global').get();
  if(doc.exists && doc.data().prix){
   const pr=doc.data().prix;
   document.getElementById('prixB1').value=pr.BOLET_1ER||50;
   document.getElementById('prixB2').value=pr.BOLET_2E||20;
   document.getElementById('prixB3').value=pr.BOLET_3E||10;
   document.getElementById('prixMaryaj').value=pr.MARYAJ||1000;
   document.getElementById('prixLoto3').value=pr.LOTO3||500;
   document.getElementById('prixLoto4').value=pr.LOTO4||5000;
   document.getElementById('prixLoto5').value=pr.LOTO5||25000;
  }
 }catch(e){}
}
</script>
