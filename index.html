v></div><div class="btnSmall" style="background:#0A0;color:#fff;margin-top:12px;padding:14px" onclick="imprimeRap()">🖨️ Imprimer</div><div class="btnSmall" style="background:#F00;color:#fff" onclick="logoutV()">🚪 DEKONEKTE</div></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",projectId:"cd-lotto"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function haitiISO(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Port-au-Prince'});}
function haitiTime(){return new Date().toLocaleTimeString('en-GB',{timeZone:'America/Port-au-Prince',hour12:false});}
function op(n){document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i+1==n));document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i+1==n));}
const PRIX={B1:50,B2:20,B3:10,MARYAJ:1000,L3:500,L4:5000,L5:25000};
const HORAIRES={'GA MIDI':'11:30','FL MIDI':'12:30','NY MIDI':'13:30','GA SOIR':'18:30','FL SOIR':'19:30','NY SOIR':'20:30'};
let currentV=null,tiragesSel=[],ventes=[],RESULTATS=[],fermetures=[],systemGlobal=null;
db.collection('ventes').onSnapshot(s=>{ventes=[];s.forEach(d=>ventes.push({...d.data(),id:d.id}));});
db.collection('resultats').onSnapshot(s=>{RESULTATS=[];s.forEach(d=>RESULTATS.push(d.data()));});
db.collection('fermetures').onSnapshot(s=>{fermetures=[];s.forEach(d=>fermetures.push({...d.data(),id:d.id}));checkFerme();});
db.collection('system').doc('global').onSnapshot(doc=>{
  systemGlobal=doc.exists?doc.data():{closed:false};
  checkGlobal();checkFerme();
});

function checkGlobal(){
  const el=document.getElementById('globalStatus');
  const btnV=document.getElementById('btnValide');
  if(!systemGlobal){if(el)el.innerHTML='';return;}
  if(systemGlobal.closed){
    el.innerHTML=`<div class="globalFerme">🔒 SISTÈM FÈMEN PA PROPRIO - ${systemGlobal.heure||''} - TOUT VANDÈ BLOKE - PA KA VANN!<br><span style="font-size:10px">Fèmen pa: ${systemGlobal.by||'PROPRIO'}</span></div>`;
    if(btnV){btnV.style.background='#555';btnV.innerText='🔒 SISTÈM FÈMEN PA PROPRIO - BLOKE';}
  }else{
    el.innerHTML=`<div class="globalOuvert">✅ SISTÈM OUVÈ PA PROPRIO - Tout vandè ka vann - ${systemGlobal.heureOuvre||''}</div>`;
    if(btnV){btnV.style.background='#000';btnV.innerText='💾 VALIDE';}
  }
  const proprioStatus=document.getElementById('proprioStatus');
  if(proprioStatus){
    if(systemGlobal.closed){proprioStatus.innerHTML=`<div class="fermeBadge">🔒 FÈMEN DEPI ${systemGlobal.heure} - Tout vandè bloke</div>`;}
    else{proprioStatus.innerHTML=`<div class="ouvertBadge">✅ OUVÈ DEPI ${systemGlobal.heureOuvre||''} - Tout vandè ka vann</div>`;}
  }
}
function checkFerme(){
  if(!currentV) return;
  const iso=haitiISO();
  const ferme=fermetures.find(f=>f.vendeur===currentV.nom && f.dateISO===iso && f.closed);
  const statusEl=document.getElementById('statusFerme');
  if(ferme){
    if(statusEl) statusEl.innerHTML=`<div class="fermeBadge">🔒 JOUNEN ${iso} FÈMEN - ${ferme.heure}</div>`;
  }else{
    if(statusEl) statusEl.innerHTML=`<div class="ouvertBadge">✅ JOUNEN ${iso} OUVÈ</div>`;
  }
}
async function loginV(){
  const nom=document.getElementById('loginNom').value.trim(),pass=document.getElementById('loginPass').value.trim().replace(/[^0-9]/g,'');
  if(!nom||!pass){document.getElementById('loginErr').innerText='Ekri non+modpas';return;}
  if(nom.toLowerCase()==='proprio' && (pass==='1234' || pass==='0000')){
    currentV={nom:'PROPRIO',code:pass,com:0,role:'proprio'};
    document.getElementById('login').style.display='none';
    document.getElementById('hTop').innerText=`PROPRIO - MASTER`;
    document.getElementById('hBlack').innerText=`${haitiISO()} | PROPRIO`;
    const iso=haitiISO();document.getElementById('fichDate').value=iso;document.getElementById('rapDu').value=iso;document.getElementById('rapAu').value=iso;
    document.getElementById('proprioPanel').style.display='block';
    tiragesSel=[];updateTirajBtns();initLignes();checkGlobal();op(3);
    return;
  }
  const vs=await db.collection('vendeurs').get();let found=null;
  vs.forEach(d=>{const v=d.data();if(v.nom.toLowerCase()===nom.toLowerCase()&&v.code.toString()===pass)found={id:d.id,...v};});
  if(!found){document.getElementById('loginErr').innerText='Pa bon';return;}
  currentV=found;
  document.getElementById('login').style.display='none';
  document.getElementById('hTop').innerText=`VENDEUR - ${found.nom.toUpperCase()}`;
  document.getElementById('hBlack').innerText=`${haitiISO()} | ${found.nom}`;
  const iso=haitiISO();document.getElementById('fichDate').value=iso;document.getElementById('rapDu').value=iso;document.getElementById('rapAu').value=iso;
  if(found.role==='proprio') document.getElementById('proprioPanel').style.display='block';
  tiragesSel=[];updateTirajBtns();initLignes();checkGlobal();checkFerme();
}
function logoutV(){currentV=null;document.getElementById('login').style.display='flex';}
async function proprioFermeTout(){
  if(!currentV || currentV.nom!=='PROPRIO'){alert('Sèlman proprio!');return;}
  const heure=new Date().toLocaleTimeString('fr-HT',{timeZone:'America/Port-au-Prince'});
  await db.collection('system').doc('global').set({closed:true,by:currentV.nom,heure,date:haitiISO(),timestamp:Date.now()});
  alert('🔒 SISTÈM FÈMEN - Tout vandè bloke!');
}
async function proprioOuvreTout(){
  if(!currentV || currentV.nom!=='PROPRIO'){alert('Sèlman proprio!');return;}
  const heure=new Date().toLocaleTimeString('fr-HT',{timeZone:'America/Port-au-Prince'});
  await db.collection('system').doc('global').set({closed:false,by:currentV.nom,heureOuvre:heure,date:haitiISO(),timestamp:Date.now()});
  alert('✅ SISTÈM OUVÈ - Tout vandè ka vann!');
}
async function toggleT(t){
  // FIX 100% - TCHEKE DIRÈK NAN BAZ LA AVAN KOCHE
  const snap=await db.collection('system').doc('global').get();
  const sys=snap.exists?snap.data():{closed:false};
  if(sys.closed){
    alert(`🔒 BLOKE! PROPRIO FÈMEN TOUT DEPI ${sys.heure} - PA KA KOCHE ${t} - Lè li ouvè yo y'a vann!`);
    checkGlobal();
    return;
  }
  const iso=haitiISO();
  if(fermetures.find(f=>f.vendeur===currentV.nom && f.dateISO===iso && f.closed)){
    alert('🔒 JOUNEN FÈMEN - Vandè fèmen - Proprio respekte!');
    return;
  }
  const now=haitiTime();
  if(HORAIRES[t] && now >= HORAIRES[t]){
    alert(`⏰ ${t} fèmen depi ${HORAIRES[t]} - Kounya ${now}`);
    return;
  }
  const i=tiragesSel.indexOf(t);if(i>=0)tiragesSel.splice(i,1);else tiragesSel.push(t);updateTirajBtns();
}
function updateTirajBtns(){
  ['GA MIDI','FL MIDI','NY MIDI','GA SOIR','FL SOIR','NY SOIR'].forEach(t=>{
    const b=document.getElementById('btn_'+t.replace(' ','_'));if(b)b.classList.toggle('sel',tiragesSel.includes(t));
  });
  document.getElementById('combiBtn').innerText=tiragesSel.length?tiragesSel.join('+')+' ✓ KOCHE':'Chwazi tiraj';
  calcTotal();
}
function initLignes(){document.getElementById('lignesBox').innerHTML='';addLigne('BOLET','','');}
function addLigne(jeux,boul,miz){
  const box=document.getElementById('lignesBox');
  const div=document.createElement('div');div.className='ligne1';
  div.innerHTML=`<select class="selJeux"><option value="BOLET" ${jeux==='BOLET'?'selected':''}>BOLET</option><option value="MARYAJ" ${jeux==='MARYAJ'?'selected':''}>MARYAJ</option><option value="LOTO3">L3</option><option value="LOTO4">L4</option><option value="LOTO5">L5</option></select><input class="inBoul" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Boul" value="${boul}" maxlength="5"><input class="inMiz" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="$" value="${miz}"><button class="btnX">X</button><button class="btnDown">↓</button>`;
  box.appendChild(div);
  const bInput=div.querySelector('.inBoul');const mInput=div.querySelector('.inMiz');
  const filter=()=>{bInput.value=bInput.value.replace(/[^0-9]/g,'');mInput.value=mInput.value.replace(/[^0-9]/g,'');calcTotal();};
  bInput.addEventListener('input',filter);mInput.addEventListener('input',filter);
  bInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nextLine(div);}});
  mInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nextLine(div);}});
  div.querySelector('.btnX').onclick=()=>{if(box.children.length<=1){bInput.value='';mInput.value='';calcTotal();}else{div.remove();calcTotal();}};
  div.querySelector('.btnDown').onclick=()=>nextLine(div);
}
function nextLine(cur){const box=document.getElementById('lignesBox');const jeux=cur.querySelector('.selJeux').value;const all=Array.from(box.querySelectorAll('.ligne1'));const idx=all.indexOf(cur);if(idx+1<all.length){all[idx+1].querySelector('.inBoul').focus();return;}addLigne(jeux,'','');box.querySelectorAll('.ligne1')[box.querySelectorAll('.ligne1').length-1].querySelector('.inBoul').focus();}
function calcTotal(){let sum=0;document.querySelectorAll('#lignesBox.ligne1').forEach(div=>{const boul=div.querySelector('.inBoul').value.replace(/[^0-9]/g,'');const miz=parseInt(div.querySelector('.inMiz').value.replace(/[^0-9]/g,''))||0;if(boul!==''&&miz>0)sum+=miz;});const nb=tiragesSel.length;const chak=nb>0?sum*nb:sum;document.getElementById('totalBar').innerText=nb?`Total $${sum} × ${nb} = $${chak}`:`Total $${sum}`;}
async function valideFiche(){
  if(!currentV)return alert('Konekte');
  // FIX 100% - TCHEKE DIRÈK NAN BAZ LA AVAN VALIDE - PA KA KONTINYE VANN SI PROPRIO FÈMEN!
  const snap=await db.collection('system').doc('global').get();
  const sys=snap.exists?snap.data():{closed:false};
  if(sys.closed){
    alert(`🔒 BLOKE 100%! PROPRIO FÈMEN TOUT VANDÈ DEPI ${sys.heure} pa ${sys.by} - TOUT VANDÈ PA DWE KA VANN - Ou pa ka valide! - Lè li ouvè yo y'a vann!`);
    checkGlobal();
    return;
  }
  const iso=haitiISO();
  if(fermetures.find(f=>f.vendeur===currentV.nom && f.dateISO===iso && f.closed)){alert('🔒 JOUNEN FÈMEN - Proprio respekte!');return;}
  if(tiragesSel.length===0){alert('Koche tiraj');return;}
  const allLines=[];document.querySelectorAll('#lignesBox.ligne1').forEach(div=>{const jeux=div.querySelector('.selJeux').value;const boul=div.querySelector('.inBoul').value.replace(/[^0-9]/g,'');const miz=parseInt(div.querySelector('.inMiz').value.replace(/[^0-9]/g,''))||0;if(boul!==''&&miz>0)allLines.push({jeux,boul,miz});});
  if(!allLines.length){alert('Antre boul');return;}
  const parTiraj=allLines.reduce((a,l)=>a+l.miz,0);
  await db.collection('ventes').add({vendeur:currentV.nom,code:currentV.code,com:currentV.com||10,dateISO:iso,tirages:[...tiragesSel],nbTiraj:tiragesSel.length,parTiraj,list:allLines,timestamp:Date.now()});
  alert(`✅ VALIDE - $${parTiraj}×${tiragesSel.length}=$${parTiraj*tiragesSel.length}`);
  initLignes();
}

function parseMaryaj(s){if(!s)return null;s=s.toString().replace(/[^0-9]/g,'');if(s.length<4)return null;return [s.slice(0,2),s.slice(2,4)];}
function maryajMatch(w,t){const a=parseMaryaj(w),b=parseMaryaj(t);if(!a||!b)return false;return (a[0]===b[0]&&a[1]===b[1])||(a[0]===b[1]&&a[1]===b[0]);}
