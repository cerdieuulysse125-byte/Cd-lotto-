<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C&D VERITE - PROPRIO V140</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#000}.card{max-width:600px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}.hdr{background:#000;color:#fff;text-align:center;padding:12px;font-weight:bold}.tabs{display:flex;background:#111;position:sticky;top:0;z-index:30;overflow:auto}.tab{flex:1;padding:12px 6px;text-align:center;color:#888;font-size:10px;font-weight:bold;cursor:pointer;border-bottom:3px solid #111;white-space:nowrap}.tab.active{color:#fff;border-bottom-color:#fff}.content{padding:10px;flex:1}.panel{display:none}.panel.active{display:block}.inputBox{width:100%;padding:12px;border:2px solid #000;border-radius:10px;margin:6px 0;font-weight:bold}.btn{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:15px;margin:6px 0;cursor:pointer}.btn-out{background:#fff;color:#000;border:2.5px solid #000}.list{border:2.5px solid #000;border-radius:12px;padding:12px;margin:8px 0;font-size:12px;background:#fff}.rapBox{border:2.5px solid #000;border-radius:14px;padding:18px;margin-top:12px;background:#f9f9f9;white-space:pre-line;text-align:center;font-family:Courier,monospace;font-size:14px;line-height:1.8}.badge{padding:4px 8px;border-radius:6px;font-size:10px;font-weight:bold;color:#fff}.badge-ferme{background:#d00}.badge-ouvert{background:#0a0}
</style>
</head>
<body>
<div class="card">
<div class="hdr">C&D VÉRITÉ - PROPRIO V140</div>
<div id="loginDiv" style="padding:30px">
<input id="propNom" placeholder="Proprio" class="inputBox" value="admin">
<input id="propPass" type="password" placeholder="Modpas" class="inputBox" value="admin">
<button class="btn" onclick="loginProprio()">ANTRE PROPRIO</button><p id="msg" style="color:red;text-align:center;margin-top:10px"></p>
</div>
<div id="appDiv" style="display:none;flex-direction:column;flex:1">
<div class="tabs">
<div class="tab active" onclick="openTab(0)">1.VANDÈ</div>
<div class="tab" onclick="openTab(1)">2.VANT</div>
<div class="tab" onclick="openTab(2)">3.REZILTA</div>
<div class="tab" onclick="openTab(3)">4.RAPÒ</div>
</div>
<div class="content">
<!-- 1 VENDEURS -->
<div class="panel active" id="p0">
<h4 style="text-align:center">JESYON VANDÈ - FERME/OUVERT</h4>
<div style="display:flex;gap:6px">
<input id="vNom" placeholder="Non vandè" class="inputBox" style="flex:1">
<input id="vPass" placeholder="Modpas" class="inputBox" style="flex:1">
</div>
<div style="display:flex;gap:6px">
<input id="vCom" type="number" value="10" placeholder="%" class="inputBox" style="flex:1">
<select id="vEtat" class="inputBox" style="flex:1"><option value="OUVERT">OUVERT</option><option value="FERME">FERME</option></select>
</div>
<button class="btn" onclick="addVendeur()">➕ Ajoute / Modifye Vandè</button>
<button class="btn btn-out" onclick="loadVendeurs()">🔄 Rechaje Vandè</button>
<div id="vendeursList"></div>
</div>
<!-- 2 VENTES -->
<div class="panel" id="p1">
<h4 style="text-align:center">2. TOUT VANT</h4>
<input id="searchV" class="inputBox" placeholder="Chèche vandè oswa boul..." oninput="filtrerVentes()">
<button class="btn btn-out" onclick="loadVentes()">🔄 Rechaje Vant</button>
<div id="ventesList"></div>
</div>
<!-- 3 RESULTATS -->
<div class="panel" id="p2">
<h4 style="text-align:center">3. REZILTA - PRIX MODIFIAB</h4>
<input id="resDate" type="date" class="inputBox">
<select id="resTir" class="inputBox"><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select>
<input id="res1er" placeholder="1er Lò (ex: 12)" class="inputBox">
<input id="res2e" placeholder="2e Lò" class="inputBox">
<input id="res3e" placeholder="3e Lò" class="inputBox">
<button class="btn" onclick="saveResultat()">💾 Sove Rezilta</button>
<div id="resList"></div>
</div>
<!-- 4 RAPPORT -->
<div class="panel" id="p3">
<h4 style="text-align:center">4. RAPÒ PROPRIO - BOUTON KI MACHE</h4>
<div style="display:flex;gap:6px"><div style="flex:1"><label style="font-size:11px;font-weight:bold">Du</label><input id="du" type="date" class="inputBox"></div><div style="flex:1"><label style="font-size:11px;font-weight:bold">Au</label><input id="au" type="date" class="inputBox"></div></div>
<select id="rapTirage" class="inputBox"><option value="TOUS">Tirage (tous)</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select>
<select id="rapVendeur" class="inputBox"><option value="TOUS">Vandè (tous)</option></select>
<button class="btn" onclick="genRapport()">📊 KALKIL RAPÒ (KLIKE)</button>
<div id="rapportRes"></div>
<button class="btn btn-out" id="btnPrintRap" style="display:none" onclick="printRapport()">🖨️ Imprimer Rapò</button>
<button class="btn btn-out" onclick="location.reload()">Dekonekte</button>
</div>
</div>
</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
const PRIX={BOLET_1ER:50, BOLET_2E:20, BOLET_3E:10, MARYAJ:1000, LOTO3:500, LOTO4:5000, LOTO5:25000};
let allVendeurs=[], allVentes=[];
function openTab(i){document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));document.querySelectorAll('.panel').forEach((p,idx)=>p.classList.toggle('active',idx===i)); if(i===0) loadVendeurs(); if(i===1) loadVentes(); if(i===2) loadResultats(); }
function loginProprio(){
 const n=document.getElementById('propNom').value.trim(), p=document.getElementById('propPass').value.trim();
 if(n==='admin' && p==='admin'){ document.getElementById('loginDiv').style.display='none'; document.getElementById('appDiv').style.display='flex'; const t=new Date().toISOString().slice(0,10); document.getElementById('du').value=t; document.getElementById('au').value=t; document.getElementById('resDate').value=t; loadVendeurs(); loadVentes(); } else document.getElementById('msg').innerText="admin / admin";
}
async function loadVendeurs(){
 const snap=await db.collection('vendeurs').get(); allVendeurs=[]; snap.forEach(d=>allVendeurs.push({id:d.id,...d.data()}));
 const el=document.getElementById('vendeursList'); const sel=document.getElementById('rapVendeur');
 sel.innerHTML='<option value="TOUS">Vandè (tous)</option>'+allVendeurs.map(v=>`<option value="${v.nom}">${v.nom}</option>`).join('');
 el.innerHTML=allVendeurs.map(v=>{
  const etat=(v.etat||v.Etat||(v.actif===false?'FERME':'OUVERT')).toUpperCase();
  const isF=etat.includes('FERM');
  return `<div class="list"><b>${v.nom}</b> - ${v.modpas||''} - ${v.commission||10}% <span class="badge ${isF?'badge-ferme':'badge-ouvert'}">${etat}</span><br><div style="display:flex;gap:4px;margin-top:6px"><button class="btn btn-out" style="flex:1;padding:8px" onclick="setEtat('${v.id}','OUVERT')">✅ OUVRI</button><button class="btn" style="flex:1;padding:8px;background:#d00" onclick="setEtat('${v.id}','FERME')">⛔ FÈMEN</button><button class="btn btn-out" style="flex:1;padding:8px" onclick="editV('${v.id}')">✏️</button></div></div>`;
 }).join('');
}
async function addVendeur(){
 const nom=document.getElementById('vNom').value.trim(), modpas=document.getElementById('vPass').value.trim(), com=parseInt(document.getElementById('vCom').value)||10, etat=document.getElementById('vEtat').value;
 if(!nom||!modpas){alert("Non ak modpas");return;}
 const exist=allVendeurs.find(v=>v.nom.toLowerCase()===nom.toLowerCase());
 if(exist){ await db.collection('vendeurs').doc(exist.id).update({nom,modpas,commission:com,etat,Etat:etat,actif:etat==='OUVERT',status:etat}); }
 else { await db.collection('vendeurs').add({nom,modpas,commission:com,etat,Etat:etat,actif:etat==='OUVERT',status:etat,femen:etat==='FERME'}); }
 document.getElementById('vNom').value=''; document.getElementById('vPass').value=''; await loadVendeurs(); alert("Vandè sove: "+nom+" = "+etat);
}
async function setEtat(id,etat){ await db.collection('vendeurs').doc(id).update({etat,Etat:etat,actif:etat==='OUVERT',status:etat,femen:etat==='FERME'}); await loadVendeurs(); alert("Kounya FERME/OUVERT chanje: "+etat); }
function editV(id){ const v=allVendeurs.find(x=>x.id===id); if(!v)return; document.getElementById('vNom').value=v.nom; document.getElementById('vPass').value=v.modpas; document.getElementById('vCom').value=v.commission||10; document.getElementById('vEtat').value=(v.etat||'OUVERT').toUpperCase().includes('FERM')?'FERME':'OUVERT'; window.scrollTo(0,0); }
async function loadVentes(){ const snap=await db.collection('ventes').orderBy('created','desc').limit(200).get(); allVentes=[]; snap.forEach(d=>allVentes.push({docId:d.id,...d.data()})); renderVentes(allVentes); }
function filtrerVentes(){ const q=document.getElementById('searchV').value.toLowerCase(); renderVentes(allVentes.filter(v=> (v.vendeur||'').toLowerCase().includes(q) || (v.lignes||[]).some(l=>String(l.boul).includes(q)) )); }
function renderVentes(list){ document.getElementById('ventesList').innerHTML=list.map(v=>`<div class="list"><b>${v.vendeur} - $${v.total} - ${(v.tirages||[]).join('/') } - ${v.dateStr}</b><br>${(v.lignes||[]).map(l=>l.jeux+' '+l.boul+' $'+l.miz).join(' | ')}</div>`).join('')||'<p style="text-align:center">Pa gen vant</p>'; }
async function saveResultat(){ const dateStr=document.getElementById('resDate').value, tirage=document.getElementById('resTir').value, p1=document.getElementById('res1er').value.trim(), p2=document.getElementById('res2e').value.trim(), p3=document.getElementById('res3e').value.trim(); if(!dateStr||!p1){alert("Dat ak 1er obligatwa");return;} await db.collection('resultats').doc(`${dateStr}_${tirage}`).set({dateStr,tirage,premier:p1,deuxieme:p2,troisieme:p3,loto3:p1,bolet:p1,created:firebase.firestore.FieldValue.serverTimestamp()}); alert("Rezilta sove!"); loadResultats(); }
async function loadResultats(){ const snap=await db.collection('resultats').orderBy('dateStr','desc').limit(30).get(); let html=''; snap.forEach(d=>{const r=d.data(); html+=`<div class="list">${r.dateStr} ${r.tirage} : 1er ${r.premier} - 2e ${r.deuxieme} - 3e ${r.troisieme}</div>`}); document.getElementById('resList').innerHTML=html; }
async function genRapport(){
 try{
  const du=document.getElementById('du').value, au=document.getElementById('au').value, tir=document.getElementById('rapTirage').value||'TOUS', vendFiltre=document.getElementById('rapVendeur').value||'TOUS';
  if(!du||!au){alert("Chwazi Du ak Au");return;}
  document.getElementById('rapportRes').innerHTML="<p style='text-align:center'>⏳ Ap kalkile... gade console (F12)</p>";
  console.log("RECHÈCHE ventes du",du,"au",au);
  const snap=await db.collection('ventes').where('dateStr','>=',du).where('dateStr','<=',au).get();
  console.log("Fich jwenn:",snap.size);
  if(snap.empty){ document.getElementById('rapportRes').innerHTML=`<div class="rapBox">Pa gen vant pou Du ${du} Au ${au}<br>Snap size 0<br>Al nan Firebase > ventes > gade si gen dateStr</div>`; return; }
  let vente=0, fich=0; let detail={};
  snap.forEach(doc=>{
   const v=doc.data();
   if(tir!=='TOUS' && !(v.tirages||[]).includes(tir)) return;
   if(vendFiltre!=='TOUS' && v.vendeur!==vendFiltre) return;
   vente+=Number(v.total)||0; fich++;
   detail[v.vendeur]=(detail[v.vendeur]||0)+Number(v.total);
  });
  const commission=vente*0.10; const balanceNet=vente-commission;
  let detTxt=Object.entries(detail).map(([k,val])=>`${k}: $${val}`).join('\n');
  const txt=` C&D VÉRITÉ LOTTO
 RAPPORT PROPRIO V140
 Du ${du} Au ${au}
 Tirage (${tir}) Vandè (${vendFiltre})

 Vente $${vente.toFixed(2)}
 Commission 10% $${commission.toFixed(2)}
 Balance net $${balanceNet.toFixed(2)}

 Nbre fich ${fich}

 ${detTxt}
`;
  document.getElementById('rapportRes').innerHTML=`<div class="rapBox">${txt}</div>`;
  document.getElementById('rapportRes').dataset.txt=txt;
  document.getElementById('btnPrintRap').style.display='block';
 }catch(e){
  console.error(e);
  alert("Erè: "+e.message+"\nOu dwe kreye INDEX Firestore:\nCollection: ventes Fields: dateStr ASC");
  document.getElementById('rapportRes').innerHTML=`<p style="color:red;text-align:center">Erè: ${e.message}<br><br>Klike sou lyen nan console Firebase pou kreye index dateStr</p>`;
 }
}
function printRapport(){ const txt=document.getElementById('rapportRes')?.dataset?.txt; if(!txt){alert("Jenere rapò anvan");return;} const win=window.open('', '_blank','width=380,height=700'); win.document.write(`<html><head><style>@page{size:58mm auto;margin:0;} html,body{margin:0;padding:0;display:flex;justify-content:center;} .ticket{width:58mm;padding:4mm 3mm;font-family:Courier,monospace;font-size:13px;text-align:center;white-space:pre-line;margin:0 auto;}</style></head><body><div class="ticket">${txt}</div><script>window.onload=function(){window.print(); setTimeout(()=>window.close(),800);}<\/script></body></html>`); win.document.close(); }
</script>
</body>
</html>
