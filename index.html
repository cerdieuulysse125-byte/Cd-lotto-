<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D V98 CLEAN</title>
<style>*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;font-family:sans-serif;background:#f1f5f9;padding:6px;padding-bottom:90px;max-width:100vw}.hdr{background:#facc15;padding:8px 10px;border-radius:10px;display:flex;justify-content:space-between;font-weight:bold;font-size:12px}.card{background:#fff;border-radius:12px;padding:8px;margin:6px 0;box-shadow:0 1px 4px rgba(0,0,0,.08);width:100%}.tirajGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.tirajItem{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:6px 8px;display:flex;gap:6px;font-size:11px;align-items:center;cursor:pointer;min-height:38px}.tirajItem.on{background:#dcfce7;border-color:#22c55e;font-weight:bold}.tirajItem.ferme{background:#e5e7eb!important;opacity:.4;pointer-events:none}.tirajItem input{width:16px;height:16px}.row3{display:grid;grid-template-columns:0.9fr 1.1fr 0.7fr;gap:4px;width:100%}.row3 select,.row3 input{padding:8px 4px;border:1.5px solid #000;border-radius:8px;text-align:center;font-weight:bold;font-size:14px;height:42px;width:100%}.btnAdd{background:#22c55e;color:#fff;width:100%;padding:10px;border:none;border-radius:10px;font-weight:bold;font-size:14px;margin-top:6px}.totalBox{display:flex;justify-content:space-between;font-weight:900;font-size:20px;margin:12px 2px}.btnValide{background:#0f172a;color:#facc15;width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;font-size:14px}.sec{display:none}.sec.active{display:block}.tabs{position:fixed;bottom:0;left:0;width:100%;background:#0f172a;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:6px;z-index:9999}.tabBtn{background:#1e293b;color:#94a3b8;padding:12px 2px;border-radius:8px;font-size:10px;font-weight:bold;border:none}.tabBtn.active{background:#facc15;color:#000}</style></head>
<body>

<div class="hdr"><span id="vName">tamouche</span><span id="dateNow">06/08/2026</span><span style="opacity:0">.</span></div>
<div style="background:#dcfce7;padding:6px;border-radius:8px;text-align:center;font-weight:bold;font-size:11px;margin:5px 0">✅ Ouvè - Lè Ayiti: <span id="heureAyiti"></span></div>

<div id="secVANN" class="sec active">
<div class="card"><div style="font-weight:bold;font-size:12px;margin-bottom:5px">Tiraj - Chwazi plizyè</div><div class="tirajGrid" id="tirajGrid"></div></div>

<div class="card" style="border:1.5px solid #000">
<div style="font-size:10px;font-weight:bold;color:#64748b">ENTÈTE FICH LA</div>
<div id="entetePreview" style="background:#f8fafc;padding:5px;border-radius:6px;font-size:10px;border:1px dashed #cbd5e1;margin:4px 0"></div>

<div class="row3">
<select id="tip"><option value="bolet">Bolet</option><option value="mariage">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select>
<input id="boul" placeholder="BOUL" inputmode="numeric" maxlength="5">
<input id="montan" placeholder="G" inputmode="numeric" type="number">
</div>

<button id="btnAdd" class="btnAdd">+ AJOUTE (Flèche ↓)</button>
<div id="liste" style="margin-top:8px;font-size:12px"></div>
<div class="totalBox"><span>Total</span><span id="tTotal">0G</span></div>
<!-- KOM ak DETAIL YO RETIRE LA -->
<button onclick="valideFich()" class="btnValide">✅ Validé + Imprimer</button>
</div>
</div>

<div id="secKOPYE" class="sec"><div class="card"><b>📋 Kopye Ticket</b><div style="display:grid;grid-template-columns:1fr auto;gap:4px;margin:8px 0"><input id="searchId" placeholder="ID ticket (5 chif)" style="padding:8px;border-radius:8px;border:1.5px solid #000;font-size:12px"><button onclick="chercheParId()" style="background:#0f172a;color:#facc15;padding:8px 12px;border-radius:8px;font-weight:bold;border:none">CHÈCHE</button></div><div id="resultSearch"></div><div id="listKopye"></div></div></div>
<div id="secRAPO" class="sec"><div class="card"><b>📊 Rapò Jodi a - KOM 10% la isit la</b><div id="rapData" style="margin-top:8px;font-size:12px"></div><button onclick="loadAll()" style="margin-top:8px;padding:8px;width:100%;border-radius:8px">🔄 Refresh</button></div></div>
<div id="secFICHES" class="sec"><div class="card"><b>🎫 Mes Fiches</b><div id="listFiches"></div></div></div>

<div class="tabs">
<button onclick="showTab('VANN')" id="tabVANN" class="tabBtn active">VANN</button>
<button onclick="showTab('KOPYE')" id="tabKOPYE" class="tabBtn">KOPYE</button>
<button onclick="showTab('RAPO')" id="tabRAPO" class="tabBtn">RAPÒ</button>
<button onclick="showTab('FICHES')" id="tabFICHES" class="tabBtn">FICHES</button>
</div>

<div id="ticketSantee" style="display:none"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"}; const app=initializeApp(cfg); const db=getDatabase(app);
let vendeur="tamouche", panier=[], allFiches=[];
let TIRAJS=[{n:"FL MIDI",h:"13:15",m:795},{n:"FL SOIR",h:"21:20",m:1280},{n:"GA MIDI",h:"12:15",m:735},{n:"GA SOIR",h:"18:15",m:1095},{n:"NY MIDI",h:"14:18",m:858},{n:"NY SOIR",h:"21:30",m:1290}];

function init(){
 let g=document.getElementById('tirajGrid'); g.innerHTML="";
 TIRAJS.forEach(t=>{ g.innerHTML+=`<label class="tirajItem" id="box-${t.n.replace(/ /g,'')}"><input type="checkbox" value="${t.n}" class="chkT" onchange="updT('${t.n}')"> ${t.n} (${t.h})</label>`; });
 checkFermeture(); setInterval(checkFermeture,60000);
 document.getElementById('dateNow').innerText=new Date().toLocaleDateString('fr-HT');
 setInterval(()=>{ let e=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); document.getElementById('heureAyiti').innerText=e.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); },1000);
 render(); loadAll();
}
function checkFermeture(){
 let now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"}));
 let cur=now.getHours()*60+now.getMinutes();
 TIRAJS.forEach(t=>{
  let box=document.getElementById('box-'+t.n.replace(/ /g,'')); if(!box)return;
  if(cur>=t.m){ box.classList.add('ferme'); box.querySelector('input').checked=false; box.querySelector('input').disabled=true; }
  else{ box.classList.remove('ferme'); box.querySelector('input').disabled=false; }
 });
}
window.updT=(n)=>{ let b=document.getElementById('box-'+n.replace(/ /g,'')); if(b.classList.contains('ferme'))return; let c=document.querySelector(`input[value="${n}"]`); b.classList.toggle('on',c.checked); render(); }
function getT(){return [...document.querySelectorAll('.chkT:checked')].map(c=>c.value);}
function render(){
 let div=document.getElementById('liste'); div.innerHTML=''; let base=0;
 panier.forEach((p,i)=>{ base+=p.montan; div.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee"><span><b>${p.type}</b> ${p.boul}</span><span>${p.montan}G <button onclick="retire(${i})" style="background:#ef4444;color:#fff;border:none;padding:1px 6px;border-radius:4px">x</button></span></div>`; });
 let nb=getT().length||0; let total=nb===0?0:base*nb;
 document.getElementById('tTotal').innerText=total+"G";
 document.getElementById('entetePreview').innerHTML=`Vandè: <b>${vendeur}</b> | ${getT().join(' / ')||'Pa chwazi tiraj'}<br>${panier.length} fich - Base ${base}G x ${nb} = <b>${total}G</b>`;
}
window.retire=(i)=>{panier.splice(i,1);render();}
function addPanier(){
 let tip=document.getElementById('tip').value; let boul=document.getElementById('boul').value.trim(); let montan=parseInt(document.getElementById('montan').value);
 if(getT().length===0){alert('Chwazi tiraj');return;} if(!boul||!montan){alert('Mete BOUL ak G');return;}
 panier.push({type:tip,boul:boul,montan:montan}); render();
 document.getElementById('boul').value=""; document.getElementById('montan').value=""; document.getElementById('boul').focus();
}
document.getElementById('btnAdd').addEventListener('click',addPanier);
document.getElementById('boul').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('montan').focus(); }});
document.getElementById('montan').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addPanier(); }});
window.showTab=(t)=>{
 document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
 document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));
 document.getElementById('sec'+t).classList.add('active');
 document.getElementById('tab'+t).classList.add('active');
 if(t!=='VANN') loadAll();
};
async function loadAll(){
 let s=await get(child(ref(db),'fiches')); if(!s.exists())return;
 let today=new Date().toISOString().split('T')[0];
 allFiches=Object.values(s.val()).filter(f=>f.date&&f.date.split('T')[0]===today&&f.vendeur===vendeur);
 let lf=document.getElementById('listFiches'); lf.innerHTML=allFiches.length?'':'Pa gen fich';
 allFiches.slice().reverse().forEach(f=>{ lf.innerHTML+=`<div style="border:1px solid #eee;padding:6px;border-radius:8px;margin:4px 0;font-size:11px"><b>${(f.tirajs||[]).join('/')} - ${f.total}G</b> (${f.totalBase}G x${f.nbTiraj})<br>${(f.details||[]).map(d=>d.boul).join(', ')} <button onclick="reprint('${f.id}')" style="float:right;background:#000;color:#facc15;padding:2px 8px;border-radius:6px">Print</button></div>`; });
 let lk=document.getElementById('listKopye'); lk.innerHTML=allFiches.length?'':'Pa gen fich jodi a';
 allFiches.slice().reverse().slice(0,20).forEach(f=>{ lk.innerHTML+=`<div style="border:1px solid #eee;padding:6px;border-radius:8px;margin:4px 0;font-size:11px;display:flex;justify-content:space-between"><span>${(f.tirajs||[]).join('/')} - ${f.total}G</span><button onclick="kopyeF('${f.id}')" style="background:#facc15;padding:4px 10px;border:none;border-radius:6px;font-weight:bold">KOPYE</button></div>`; });
 let vente=allFiches.reduce((a,b)=>a+(b.total||0),0); let kom=Math.round(vente*0.1);
 document.getElementById('rapData').innerHTML=`Fich: ${allFiches.length}<br>Vente: <b>${vente}G</b><br>Kom 10%: <b>${kom}G</b> (se la sèlman)<br>Balance: <b>${vente-kom}G</b>`;
}
window.kopyeF=(id)=>{ let f=allFiches.find(x=>x.id===id); if(!f)return; panier=JSON.parse(JSON.stringify(f.details)); document.querySelectorAll('.chkT').forEach(c=>c.checked=false); document.querySelectorAll('.tirajItem').forEach(b=>b.classList.remove('on')); (f.tirajs||[]).forEach(tn=>{ let c=document.querySelector(`input[value="${tn}"]`); if(c&&!c.disabled){c.checked=true; document.getElementById('box-'+tn.replace(/ /g,'')).classList.add('on');}}); render(); showTab('VANN'); };
window.chercheParId=async()=>{
 let q=document.getElementById('searchId').value.trim().toLowerCase(); if(!q)return;
 let s=await get(child(ref(db),'fiches')); if(!s.exists())return;
 let all=Object.values(s.val()); let found=all.find(f=> f.id.toLowerCase().includes(q));
 if(!found){document.getElementById('resultSearch').innerHTML="❌ Pa jwenn";return;}
 document.getElementById('resultSearch').innerHTML=`<div style="background:#dcfce7;padding:8px;border-radius:8px;font-size:11px"><b>${found.id.slice(-5)} - ${found.total}G</b><br><button onclick="kopyeF('${found.id}')" style="background:#facc15;padding:6px 12px;border:none;border-radius:6px;font-weight:bold;margin-top:4px">KOPYE SA A</button></div>`;
 allFiches=all;
};
window.reprint=(id)=>{ let f=allFiches.find(x=>x.id===id); if(!f)return; let t=` C&D LOTTO\n${f.vendeur} - ${new Date(f.date).toLocaleString()}\n${(f.tirajs||[]).join(' / ')}\n----------------\n`; f.details.forEach(p=>{t+=`${p.type} ${p.boul} ${p.montan}G x${f.nbTiraj}\n`;}); t+=`----------------\nTOTAL: ${f.total}G\n`; document.getElementById('ticketSantee').innerText=t; window.print(); };
window.valideFich=async()=>{
 if(panier.length===0){alert('Panier vid');return;}
 let tirajs=getT(); if(tirajs.length===0){alert('Chwazi tiraj');return;}
 let base=panier.reduce((a,b)=>a+b.montan,0); let total=base*tirajs.length; let id=push(child(ref(db),'fiches')).key;
 await set(ref(db,'fiches/'+id),{id:id,vendeur:vendeur,tirajs:tirajs,details:panier,total:total,totalBase:base,nbTiraj:tirajs.length,date:new Date().toISOString()});
 let tt=` C&D LOTTO\n${vendeur} - ${new Date().toLocaleString()}\n${tirajs.join(' / ')}\n----------------\n`; panier.forEach(p=>{tt+=`${p.type} ${p.boul} ${p.montan}G x${tirajs.length}\n`;}); tt+=`----------------\nTOTAL: ${total}G (${base}G x ${tirajs.length})\nID:${id.slice(-5)}\n`; document.getElementById('ticketSantee').innerText=tt; window.print(); panier=[]; render(); loadAll();
};
init();
</script></body></html>
