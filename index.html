<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>C&D Lotto - Vendeur V95.1</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#0f172a;color:#fff;padding:10px}
.card{background:#1e293b;border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid #334155}
input,select,button{padding:10px;border-radius:8px;border:none;width:100%;margin:4px 0}
button{background:#eab308;color:#000;font-weight:bold;cursor:pointer}
.btn-green{background:#22c55e;color:#fff}.btn-red{background:#ef4444;color:#fff}
.btn-blue{background:#3b82f6;color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{padding:4px 8px;border-radius:20px;font-size:12px}
.ferme{background:#ef4444}.ouvert{background:#22c55e}
table{width:100%;font-size:13px}th{color:#eab308;text-align:left}
.fich{font-size:11px;background:#000;padding:6px;border-radius:6px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="loginBox" class="card">
<h2 style="color:#eab308;text-align:center">🎰 C&D VÉRITÉ LOTTO</h2>
<input id="loginNom" placeholder="Non vendeur (ex: jean)">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="login()">ANTRE</button>
<p id="loginMsg" style="color:#ef4444;text-align:center"></p>
</div>
<div id="appBox" style="display:none">
<div class="card" style="display:flex;justify-content:space-between;align-items:center">
<b id="vName"></b><span id="vStatus"></span><button onclick="logout()" style="width:auto;padding:4px 10px" class="btn-red">Dekonekte</button>
</div>
<div class="card">
<h3 style="color:#eab308;margin:0 0 8px">🎫 VANN BOLET / LOTO</h3>
<div class="grid2">
<select id="typeJeu" onchange="changeJeu()">
<option value="bolet">Bolet (1er,2em,3em)</option>
<option value="loto3">Loto3</option>
<option value="loto4">Loto4</option>
<option value="loto5">Loto5</option>
<option value="maryaj">Maryaj</option>
</select>
<input id="numero" placeholder="Nimewo (ex: 25)">
</div>
<div class="grid2">
<input id="montant" type="number" placeholder="Montant $">
<select id="pozisyon"><option value="1er">1er</option><option value="2em">2em</option><option value="3em">3em</option></select>
</div>
<button class="btn-green" onclick="ajouteTicket()">+ AJOUTE NAN FICH</button>
</div>
<div class="card">
<h4>FICH AKTYÈL - <span id="totalFich">0 $</span></h4>
<div id="listFich"></div>
<div class="grid2">
<button class="btn-blue" onclick="vannFich()">✅ VANN FICH</button>
<button class="btn-red" onclick="anileFich()">❌ ANILE</button>
</div>
</div>
<div class="card">
<h4>📊 RAPÒ JOU A</h4>
<table><thead><tr><th>Heure</th><th>Jeu</th><th>Mis</th><th>Gain</th></tr></thead><tbody id="rapport"></tbody></table>
<p>Total: <b id="totVant">0</b> $ | Komisyon: <b id="totKom">0</b> $</p>
</div>
</div>
<script>
function getVendeurs(){return JSON.parse(localStorage.getItem('cdu_vendeurs')||'[{"non":"jean","pass":"123456","komisyon":10,"ouvert":false},{"non":"tamouche","pass":"123456","komisyon":10,"ouvert":false},{"non":"vendeur3","pass":"3333","komisyon":10,"ouvert":false}]')}
function getPrix(){return JSON.parse(localStorage.getItem('cdu_prix')||'{"bolet1":50,"bolet2":20,"bolet3":10,"maryaj":1000,"loto3":500,"loto4":5000,"loto5":25000}')}
let vendeurs=getVendeurs();let prix=getPrix();
let vendeurActuel=localStorage.getItem('cdu_vendeur_actuel')||null;
let fichCourant=[];let ventes=JSON.parse(localStorage.getItem('cdu_ventes')||'{}');
function changeJeu(){let t=document.getElementById('typeJeu').value;document.getElementById('pozisyon').style.display=(t==='bolet')?'block':'none';}
function login(){
 let nom=document.getElementById('loginNom').value.trim().toLowerCase();
 let pass=document.getElementById('loginPass').value.trim();
 let vd=vendeurs.find(v=>v.non.toLowerCase()===nom);
 if(!vd){document.getElementById('loginMsg').innerText='Vendeur pa egziste';return}
 if(vd.pass!==pass){document.getElementById('loginMsg').innerText='Password pa bon';return}
 if(vd.ouvert===false){document.getElementById('loginMsg').innerText='⛔ Vendeur '+vd.non+' FERMÉ pa Proprio. Ou pa ka vann.';return;}
 vendeurActuel=vd.non;localStorage.setItem('cdu_vendeur_actuel',vendeurActuel);initApp();
}
function initApp(){
 document.getElementById('loginBox').style.display='none';document.getElementById('appBox').style.display='block';
 let vd=vendeurs.find(v=>v.non===vendeurActuel);
 document.getElementById('vName').innerText='👤 '+vendeurActuel.toUpperCase();
 document.getElementById('vStatus').innerHTML=vd.ouvert?'<span class="badge ouvert">OUVERT</span>':'<span class="badge ferme">FERMÉ</span>';
 if(vd && vd.ouvert===false){alert('⛔ Vendeur '+vendeurActuel+' FERMÉ pa Proprio');logout();return;}
 refreshRapport();
}
function logout(){vendeurActuel=null;localStorage.removeItem('cdu_vendeur_actuel');location.reload()}
function ajouteTicket(){
 let vd=vendeurs.find(v=>v.non==vendeurActuel);
 if(!vd || vd.ouvert===false){alert('⛔ Vendeur '+vendeurActuel+' FERMÉ - Ou pa ka ajoute fich');return}
 let type=document.getElementById('typeJeu').value;let num=document.getElementById('numero').value.trim();let mont=parseFloat(document.getElementById('montant').value);let poz=document.getElementById('pozisyon').value;
 if(!num||!mont){alert('Mete nimewo ak montan');return}
 let gain=0;let p=getPrix();
 if(type==='bolet'){if(poz==='1er')gain=mont*p.bolet1;else if(poz==='2em')gain=mont*p.bolet2;else gain=mont*p.bolet3}
 else if(type==='maryaj')gain=mont*p.maryaj;else if(type==='loto3')gain=mont*p.loto3;else if(type==='loto4')gain=mont*p.loto4;else if(type==='loto5')gain=mont*p.loto5;
 fichCourant.push({type,num,mont,poz,gain,heure:new Date().toLocaleTimeString()});renderFich();
 document.getElementById('numero').value='';document.getElementById('montant').value='';
}
function renderFich(){let tot=0;let html='';fichCourant.forEach((f,i)=>{tot+=f.mont;html+=`<div class="fich">${i+1}. ${f.type.toUpperCase()} ${f.num} ${f.type==='bolet'?f.poz:''} - ${f.mont}$ => Gain ${f.gain}$</div>`;});document.getElementById('listFich').innerHTML=html;document.getElementById('totalFich').innerText=tot+' $';}
function anileFich(){fichCourant=[];renderFich()}
function vannFich(){let vd=vendeurs.find(v=>v.non==vendeurActuel);if(!vd || vd.ouvert===false){alert('⛔ Vendeur FERMÉ - Vant bloke');return}if(fichCourant.length==0){alert('Fich vid');return}let key=vendeurActuel+'_'+new Date().toISOString().slice(0,10);if(!ventes[key])ventes[key]=[];ventes[key].push(...fichCourant);localStorage.setItem('cdu_ventes',JSON.stringify(ventes));fichCourant=[];renderFich();refreshRapport();alert('✅ Fich Vann!');}
function refreshRapport(){let key=vendeurActuel+'_'+new Date().toISOString().slice(0,10);let jour=ventes[key]||[];let html='';let tot=0;jour.forEach(f=>{tot+=f.mont;html+=`<tr><td>${f.heure}</td><td>${f.type} ${f.num}</td><td>${f.mont}</td><td>${f.gain}</td></tr>`});document.getElementById('rapport').innerHTML=html;document.getElementById('totVant').innerText=tot;let vd=vendeurs.find(v=>v.non==vendeurActuel);let kom=vd?Math.round(tot*vd.komisyon/100):0;document.getElementById('totKom').innerText=kom;}
if(vendeurActuel){let vd=vendeurs.find(v=>v.non===vendeurActuel);if(vd && vd.ouvert!==false)initApp();}
</script>
</body>
</html>
