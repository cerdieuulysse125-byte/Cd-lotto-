<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROPRIO V127.3.8 ULTRA FIX</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f1f5f9;padding-bottom:160px}.h{background:#000;color:#FFD700;padding:10px;text-align:center;font-weight:900;font-size:9px}.card{background:#fff;padding:10px;border-radius:12px;margin:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)}input,select,button{width:100%;padding:12px;border-radius:8px;border:1.5px solid #000;margin:4px 0;font-size:15px}button{background:#000;color:#FFD700;font-weight:900;border:none;cursor:pointer}.tab{position:fixed;bottom:0;left:0;width:100%;background:#000;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:6px;z-index:99}.tab button{font-size:7px;padding:8px 1px;border-radius:12px;min-height:34px}.tab button.active{background:#FFD700;color:#000}.table{width:100%;border-collapse:collapse;font-size:7px}.table th,.table td{border:1px solid #000;padding:2px;text-align:center}.table th{background:#000;color:#FFD700}</style>
</head><body>
<div class="h">PROPRIO V127.3.8 - ULTRA FIX - Bouton mache san Firebase</div>
<div id="login" class="card" style="text-align:center;margin-top:30px"><h3>🔐 Proprio</h3><input id="code" type="password" placeholder="Tape nenpot modpas - 1234"><button id="btnLogin" style="background:#16a34a;color:#fff;font-size:18px;padding:15px" onclick="entrerProprio()">✅ ANTRE KOUNYA</button><div id="loginErr" style="color:red;font-weight:900;margin-top:8px"></div></div>
<div id="app" style="display:none">
<div id="sec1" class="sec"><div class="card"><h3>1.Tirage</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px"><input type="date" id="rDate"><select id="rTiraj"><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px"><div>1er<input id="r1"></div><div>2e<input id="r2"></div><div>3e<input id="r3"></div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px"><div>M1<input id="rm1"></div><div>M2<input id="rm2"></div><div>M3<input id="rm3"></div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px"><div>L3<input id="rl3"></div><div>L4<input id="rl4"></div><div>L5<input id="rl5"></div></div><button onclick="autoFillMaryaj()" style="background:#444">⚡ Auto Maryaj</button><button onclick="saveResultGlobal()" style="background:#16a34a;padding:12px">💾 SAVE</button></div><div class="card"><table class="table"><thead><tr><th>TIRAJ</th><th>1er</th><th>2e</th><th>3e</th><th>M1</th><th>M2</th><th>M3</th><th>L3</th><th>L4</th><th>L5</th></tr></thead><tbody id="tabAff"></tbody></table></div></div>
<div id="sec2" class="sec" style="display:none"><div class="card"><h3>2.Limite</h3><div id="limList"></div><button onclick="saveLim()">Sove</button></div></div>
<div id="sec3" class="sec" style="display:none"><div class="card"><h3>3.Heures</h3><div id="heuresList"></div><button onclick="saveHeures()">Sove</button></div></div>
<div id="sec4" class="sec" style="display:none"><div class="card"><h3>4.Prix</h3><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px"><div>1er<input id="p1" type="number" value="50"></div><div>2e<input id="p2" type="number" value="20"></div><div>3e<input id="p3" type="number" value="10"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px"><div>Maryaj<input id="pm" type="number" value="1000"></div><div>L3<input id="pl3" type="number" value="500"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px"><div>L4<input id="pl4" type="number" value="5000"></div><div>L5<input id="pl5" type="number" value="25000"></div></div><button onclick="savePrix()">Sove</button></div></div>
<div id="sec5" class="sec" style="display:none"><div class="card"><h3>5.Vandè</h3><div style="display:grid;grid-template-columns:1fr 1fr 60px 70px;gap:4px"><input id="newVCode" placeholder="CODE"><input id="newVPass" placeholder="MODPAS"><input id="newVCom" type="number" value="10"><select id="newVStat"><option value="ouvert">Ouvè</option><option value="ferme">Fèmé</option></select></div><button onclick="addV()">+ Ajoute</button><div id="vendeursList"></div></div></div>
<div id="sec6" class="sec" style="display:none"><div class="card"><h3>6.Rapport Pa Tiraj ✅</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px"><input type="date" id="du"><input type="date" id="au"></div><select id="filVendeur"><option value="tous">Tous Vendeurs</option></select><select id="filTiraj"><option value="tous">Tous Tiraj</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><button onclick="genRapportKORIJE()" style="background:#16a34a">Générer Pa Tiraj - GA 1000 FL 0 NY 300</button><div style="border:2px solid #000;border-radius:8px;padding:6px;margin-top:6px"><div>Vente: <b id="rV">0$</b> | Com: <b id="rC">0$</b></div><div style="color:red">Payer: <b id="rP">0$</b></div><div style="background:#000;color:#FFD700;padding:4px;border-radius:6px">Net: <b id="rN">0$</b></div></div><div id="rapportDetail" style="margin-top:8px"></div></div></div>
<div id="sec7" class="sec" style="display:none"><div class="card"><h3>7.Entête</h3><input id="entNom"><button onclick="saveEntete()">Sove</button></div></div>
</div>
<div class="tab"><button id="b1" class="active" onclick="showSec(1)">1.Tirage</button><button id="b2" onclick="showSec(2)">2.Limite</button><button id="b3" onclick="showSec(3)">3.Heure</button><button id="b4" onclick="showSec(4)">4.Prix</button><button id="b5" onclick="showSec(5)">5.Vandè</button><button id="b6" onclick="showSec(6)">6.Rapport</button><button id="b7" onclick="showSec(7)">7.Entête</button></div>
<script>
var firebaseConfig={databaseURL:"https://verite-lotto-default-rtdb.firebaseio.com"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
var db;
try{db=firebase.database();}catch(e){}
const PROP="Vérité lotto", TIRAJ=["GA MIDI","FL MIDI","NY MIDI","GA SOIR","FL SOIR","NY SOIR"];
var PRIX={Borlettes:[50,20,10],Mariage:1000,Loto3:500,Loto4:5000,Loto5:25000}, LIMITE={Borlettes:1500,Mariage:100,Loto3:100,Loto4:20,Loto5:5};
// FIX ULTRA - PA GEN VERIFIKASYON FIREBASE NAN LOGIN
function entrerProprio(){
console.log("Bouton klike!");
document.getElementById('loginErr').innerText="Ap antre...";
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='block';
var t=new Date().toISOString().split('T')[0];
document.getElementById('rDate').value=t;document.getElementById('du').value=t;document.getElementById('au').value=t;
setTimeout(function(){loadAll();},500);
}
function showSec(n){for(var i=1;i<=7;i++){document.getElementById('sec'+i).style.display=i===n?'block':'none';document.getElementById('b'+i).classList.remove('active');}document.getElementById('b'+n).classList.add('active');}
function autoFillMaryaj(){var a=document.getElementById('r1').value.trim(),b=document.getElementById('r2').value.trim(),c=document.getElementById('r3').value.trim();if(a&&b)document.getElementById('rm1').value=a+b;if(a&&c)document.getElementById('rm2').value=a+c;if(b&&c)document.getElementById('rm3').value=b+c;}
async function saveResultGlobal(){var date=document.getElementById('rDate').value, tiraj=document.getElementById('rTiraj').value;var obj={premier:document.getElementById('r1').value.trim(),deuxieme:document.getElementById('r2').value.trim(),troisieme:document.getElementById('r3').value.trim(),mariage:[document.getElementById('rm1').value.trim(),document.getElementById('rm2').value.trim(),document.getElementById('rm3').value.trim()],loto3:document.getElementById('rl3').value.trim(),loto4:document.getElementById('rl4').value.trim(),loto5:document.getElementById('rl5').value.trim()};try{await db.ref('proprios/'+PROP+'/resultats/'+date+'/'+tiraj).set(obj);}catch(e){alert("Erè save: "+e.message);}loadTab();}
async function loadAll(){loadTab();loadLim();loadHeures();loadPrix();loadVendeurs();}
async function loadTab(){try{var date=document.getElementById('rDate').value;var snap=await db.ref('proprios/'+PROP+'/resultats/'+date).once('value');var html="";if(snap.exists()){var data=snap.val();for(var t of TIRAJ){var r=data[t];if(r){html+=`<tr><td>${t}</td><td>${r.premier||''}</td><td>${r.deuxieme||''}</td><td>${r.troisieme||''}</td><td>${(r.mariage&&r.mariage[0])||''}</td><td>${(r.mariage&&r.mariage[1])||''}</td><td>${(r.mariage&&r.mariage[2])||''}</td><td>${r.loto3||''}</td><td>${r.loto4||''}</td><td>${r.loto5||''}</td></tr>`;}}}document.getElementById('tabAff').innerHTML=html||`<tr><td colspan="10">Pa gen</td></tr>`;}catch(e){}}
async function loadLim(){try{var snap=await db.ref('proprios/'+PROP+'/config/limite').once('value');var lim=snap.exists()?snap.val():LIMITE;var html="";for(var k in lim){html+=`<div style="display:flex;gap:5px"><div style="width:80px">${k}</div><input id="lim_${k}" type="number" value="${lim[k]}"></div>`;}document.getElementById('limList').innerHTML=html;}catch(e){}}
async function saveLim(){var o={};for(var k in LIMITE){var el=document.getElementById('lim_'+k);if(el) o[k]=parseFloat(el.value)||0;}await db.ref('proprios/'+PROP+'/config/limite').set(o);alert("Sove");}
async function loadHeures(){try{var snap=await db.ref('proprios/'+PROP+'/config/fermeture').once('value');var data=snap.exists()?snap.val():{};var html="";for(var t of TIRAJ){html+=`<div style="display:flex;gap:5px"><div style="width:80px">${t}</div><input id="h_${t}" type="time" value="${data[t]||''}"></div>`;}document.getElementById('heuresList').innerHTML=html;}catch(e){}}
async function saveHeures(){var o={};for(var t of TIRAJ){var el=document.getElementById('h_'+t);if(el) o[t]=el.value;}await db.ref('proprios/'+PROP+'/config/fermeture').set(o);alert("Sove");}
async function loadPrix(){try{var snap=await db.ref('proprios/'+PROP+'/config/prix').once('value');if(snap.exists()){var p=snap.val();document.getElementById('p1').value=p.Borlettes[0];document.getElementById('p2').value=p.Borlettes[1];document.getElementById('p3').value=p.Borlettes[2];document.getElementById('pm').value=p.Mariage;document.getElementById('pl3').value=p.Loto3;document.getElementById('pl4').value=p.Loto4;document.getElementById('pl5').value=p.Loto5;}}catch(e){}}
async function savePrix(){var o={Borlettes:[parseFloat(document.getElementById('p1').value)||0,parseFloat(document.getElementById('p2').value)||0,parseFloat(document.getElementById('p3').value)||0],Mariage:parseFloat(document.getElementById('pm').value)||0,Loto3:parseFloat(document.getElementById('pl3').value)||0,Loto4:parseFloat(document.getElementById('pl4').value)||0,Loto5:parseFloat(document.getElementById('pl5').value)||0};await db.ref('proprios/'+PROP+'/config/prix').set(o);alert("Sove");}
async function loadVendeurs(){try{var snap=await db.ref('proprios/'+PROP+'/vendeurs').once('value');var html="",opts='<option value="tous">Tous Vendeurs</option>';if(snap.exists()){snap.forEach(v=>{opts+=`<option>${v.key}</option>`;var d=v.val();html+=`<div style="display:flex;justify-content:space-between;background:#f8fafc;padding:6px;margin:2px 0;border-radius:6px"><b>${v.key}</b> ${d.commission||10}% ${d.statut}</div>`;});}document.getElementById('vendeursList').innerHTML=html;document.getElementById('filVendeur').innerHTML=opts;}catch(e){}}
async function addV(){var c=document.getElementById('newVCode').value.trim().toUpperCase(),p=document.getElementById('newVPass').value.trim(),com=parseFloat(document.getElementById('newVCom').value)||10,stat=document.getElementById('newVStat').value;if(!c||!p)return;await db.ref('proprios/'+PROP+'/vendeurs/'+c).set({code:c,pass:p,commission:com,statut:stat});loadVendeurs();}
async function saveEntete(){alert("Sove");}
async function genRapportKORIJE(){
var du=document.getElementById('du').value, au=document.getElementById('au').value, filV=document.getElementById('filVendeur').value, filT=document.getElementById('filTiraj').value;
if(!du||!au){alert("Chwazi dat");return;}
try{
var fichSnap=await db.ref('proprios/'+PROP+'/fiches').once('value');
var resuSnap=await db.ref('proprios/'+PROP+'/resultats').once('value');
var prixSnap=await db.ref('proprios/'+PROP+'/config/prix').once('value');
var vendSnap=await db.ref('proprios/'+PROP+'/vendeurs').once('value');
var prix=prixSnap.exists()?prixSnap.val():PRIX;
var resu=resuSnap.exists()?resuSnap.val():{};
var comMap={}; if(vendSnap.exists()){vendSnap.forEach(v=>{comMap[v.key]=parseFloat(v.val().commission)||10;});}
var vPar={}, pPar={}, comPar={}, vTot=0, pTot=0, comTot=0;
if(fichSnap.exists()){
var seen=new Set();
fichSnap.forEach(f=>{
var fd=f.val();
if(!fd.date || fd.date < du || fd.date > au) return;
if(filV!=="tous" && fd.vendeur!==filV) return;
var uniq=fd.id||fd.vendeur+fd.date+fd.boul+fd.miz+(fd.tirajs||[]).join('');
if(seen.has(uniq)) return; seen.add(uniq);
var miz=parseFloat(fd.miz)||0;
if(!fd.tirajs) return;
fd.tirajs.forEach(tir=>{
if(filT!=="tous" && tir!==filT) return;
if(!vPar[tir]){vPar[tir]=0; pPar[tir]=0; comPar[tir]=0;}
vPar[tir]+=miz; vTot+=miz;
var com=miz*(comMap[fd.vendeur]||10)/100; comPar[tir]+=com; comTot+=com;
var re=resu[fd.date] && resu[fd.date][tir]? resu[fd.date][tir] : null;
if(!re) return;
var gain=0; var key=fd.jeux==="Bòlèt"?"Borlettes":fd.jeux;
if(key==="Borlettes"){if(fd.boul===re.premier) gain=miz*prix.Borlettes[0];else if(fd.boul===re.deuxieme) gain=miz*prix.Borlettes[1];else if(fd.boul===re.troisieme) gain=miz*prix.Borlettes[2];}
else if(key==="Mariage" && re.mariage && re.mariage.includes(fd.boul)) gain=miz*prix.Mariage;
else if(key==="Loto3" && fd.boul===re.loto3) gain=miz*prix.Loto3;
else if(key==="Loto4" && fd.boul===re.loto4) gain=miz*prix.Loto4;
else if(key==="Loto5" && fd.boul===re.loto5) gain=miz*prix.Loto5;
if(gain>0){pPar[tir]+=gain; pTot+=gain;}
});
});
}
document.getElementById('rV').innerText=vTot+"$";document.getElementById('rC').innerText=Math.round(comTot)+"$";document.getElementById('rP').innerText=pTot+"$";document.getElementById('rN').innerText=(vTot-comTot-pTot)+"$";
var html=`<table class="table"><tr><th>TIRAJ</th><th>Vente</th><th>Com</th><th>Peye</th><th>Net</th></tr>`;
for(var t of TIRAJ){if(filT!=="tous" && t!==filT) continue;var vp=vPar[t]||0, pp=pPar[t]||0, cp=comPar[t]||0;if(vp===0&&pp===0&&filT==="tous")continue;html+=`<tr><td style="font-weight:900;background:#fffde7">${t}</td><td>${vp}$</td><td>${Math.round(cp)}$</td><td style="color:${pp>0?'red':'green'};font-weight:900">${pp}$</td><td style="font-weight:900;background:${(vp-cp-pp)>=0?'#dcfce7':'#fee2e2'}">${vp-cp-pp}$</td></tr>`;}html+=`</table>`;
document.getElementById('rapportDetail').innerHTML=html;
}catch(e){alert("Erè rapport: "+e.message);}
}
</script>
</body></html>
