<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D LOTTO Vendeur LOGIN</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f1f5f9;padding:8px}.loginPage{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px}.loginBox{background:#1e293b;border-radius:16px;padding:25px;width:100%;max-width:350px;border:2px solid #facc15;text-align:center}input{padding:12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;width:100%;margin-top:8px}button{padding:12px;border-radius:8px;border:none;font-weight:bold;width:100%;margin-top:10px;cursor:pointer}.btnY{background:#facc15;color:#000}.btnG{background:#22c55e;color:#fff}.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px}.tirajGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tirajItem{border:1px solid #e2e8f0;border-radius:8px;padding:6px 8px;display:flex;gap:6px;font-size:12px}.tirajItem.ferme{opacity:.4;background:#fee2e2}.bloqueOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;z-index:99998;display:none;align-items:center;justify-content:center;padding:20px;text-align:center}</style></head>
<body>

<div id="loginPage" class="loginPage">
<div class="loginBox">
<div style="font-size:50px">🔐</div><h2 style="color:#facc15">C&D LOTTO</h2><p style="color:#fff;font-size:13px">Antre non ak modpas ou</p>
<input id="loginVendeur" placeholder="Non vandè ex: vendeur1">
<input id="loginPass" type="password" placeholder="Modpas ex: 1111">
<button onclick="doLogin()" class="btnY">🔓 Konekte</button>
<div id="loginErr" style="color:#ef4444;font-size:12px;margin-top:10px"></div>
<div style="color:#64748b;font-size:10px;margin-top:15px">Si ou bliye modpas - Rele Chèf la</div>
</div>
</div>

<div id="bloqueOverlay" class="bloqueOverlay"><div style="background:#1e293b;border:3px solid #ef4444;border-radius:16px;padding:25px;max-width:380px;width:100%"><div style="font-size:60px">🚫</div><h1 style="color:#ef4444">OU BLOKE!</h1><div id="bloqueMsg" style="color:#fff;font-size:13px"></div><button onclick="logout()" style="margin-top:15px;background:#ef4444;color:#fff;padding:12px;width:100%;border-radius:8px;border:none;font-weight:bold">Dekonekte</button></div></div>

<div id="mainApp" style="display:none">
<div style="background:#facc15;padding:8px;border-radius:12px;text-align:center;font-weight:bold;font-size:13px;margin-bottom:8px">🎫 C&D LOTTO <span id="vName"></span> - <span id="dateNow"></span> <button onclick="logout()" style="float:right;background:#0f172a;color:#fff;border:none;padding:4px 8px;border-radius:6px;font-size:10px">Dekonekte</button></div>
<div id="msgTiraj" style="background:#fef9c3;padding:8px;border-radius:8px;text-align:center;font-size:12px;font-weight:bold;margin-bottom:8px"></div>
<div class="card"><b>Tiraj: <span id="heureAyiti" style="font-size:11px;color:#64748b"></span></b><div class="tirajGrid" id="tirajGrid" style="margin-top:8px"></div></div>
<div class="card"><div style="display:flex;gap:6px"><select id="tip" style="flex:1"><option value="bolet">Bolet</option><option value="mariage">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select><input id="boul" placeholder="Boul" style="flex:1"><input id="montan" type="number" placeholder="Montan" style="flex:1"></div><button onclick="ajouteBoul()" class="btnG" style="margin-top:8px">➕ Ajoute</button><div id="listFiche" style="margin-top:10px"></div><div style="display:flex;justify-content:space-between;font-weight:bold;font-size:16px;margin-top:10px;border-top:2px solid #000;padding-top:8px"><span>Total</span><span id="totalG">0G</span></div><button onclick="validerFiche()" style="background:#0f172a;color:#facc15;border:none;padding:12px;border-radius:10px;font-weight:bold;width:100%;margin-top:10px">✅ Validé + Imprimer</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};const app=initializeApp(cfg);const db=getDatabase(app);

let VENDEUR="", MOTDEPASSE="", EST_BLOKE=false, panier=[], limites={bolet:1000,mariage:50,loto3:100,loto4:20,loto5:10}, fermetures={};

function getHaitiNow(){return new Date(new Date().toLocaleString("en-US",{timeZone:"America/Port-au-Prince"}));}
function getHaitiDateStr(){let h=getHaitiNow();return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;}
function getHaitiTimeStr(){let h=getHaitiNow();return `${String(h.getHours()).padStart(2,'0')}:${String(h.getMinutes()).padStart(2,'0')}`;}

window.doLogin=async()=>{
  let v=document.getElementById('loginVendeur').value.trim().toLowerCase(), p=document.getElementById('loginPass').value.trim();
  if(!v||!p){document.getElementById('loginErr').innerText='Mete non ak modpas';return;}
  let snap=await get(child(ref(db),`config/vendeurs/${v}`));
  if(!snap.exists()){document.getElementById('loginErr').innerText='Vandè sa pa egziste';return;}
  let d=snap.val();
  if((d.password||'')!==p){document.getElementById('loginErr').innerText='Modpas pa kòrèk';return;}
  if(d.active===false){document.getElementById('loginErr').innerText='🚫 Ou bloke - Rele Chèf la';return;}
  VENDEUR=v; MOTDEPASSE=p;
  localStorage.setItem('vendeur_nom',v); localStorage.setItem('vendeur_pass',p);
  document.getElementById('loginPage').style.display='none'; document.getElementById('mainApp').style.display='block';
  document.getElementById('vName').innerText=v;
  loadConfig(); checkBloke();
};
window.logout=()=>{localStorage.removeItem('vendeur_nom');localStorage.removeItem('vendeur_pass');location.reload();};

async function checkBloke(){
  let snap=await get(child(ref(db),`config/vendeurs/${VENDEUR}`));
  if(!snap.exists()||snap.val().active===false){
    document.getElementById('bloqueOverlay').style.display='flex';
    document.getElementById('bloqueMsg').innerHTML=`Vandè <b>${VENDEUR}</b> bloke!<br>Rele Chèf la`;
    EST_BLOKE=true; return true;
  }
  document.getElementById('bloqueOverlay').style.display='none'; EST_BLOKE=false; return false;
}
async function loadConfig(){
  let s1=await get(child(ref(db),'config/limites')); if(s1.exists())limites={...limites,...s1.val()};
  let s3=await get(child(ref(db),'config/fermeture')); if(s3.exists())fermetures=s3.val(); else fermetures={'GA MIDI':'12:15','GA SOIR':'18:15','FL MIDI':'13:15','FL SOIR':'21:15','NY MIDI':'14:15','NY SOIR':'21:30'};
  renderTiraj();
}
function renderTiraj(){
  let now=getHaitiTimeStr(); let grid=document.getElementById('tirajGrid'); grid.innerHTML=''; let toutFerme=true;
  Object.entries(fermetures).forEach(([nom,heure])=>{
    let ferme=now>=heure; if(!ferme)toutFerme=false;
    grid.innerHTML+=`<label class="tirajItem ${ferme?'ferme':''}"><input type="checkbox" value="${nom}" ${ferme?'disabled':''} class="chkTiraj"> ${nom} (${heure})</label>`;
  });
  document.getElementById('msgTiraj').innerHTML=toutFerme?'🔒 Tout tiraj fèmen':'✅ Tout tiraj ouvè';
  document.getElementById('heureAyiti').innerText='Lè Ayiti: '+now; document.getElementById('dateNow').innerText=getHaitiDateStr()+' '+now;
}
window.ajouteBoul=async()=>{
  if(await checkBloke())return alert('🚫 OU BLOKE');
  let tip=document.getElementById('tip').value,boul=document.getElementById('boul').value.trim(),montan=parseInt(document.getElementById('montan').value)||0;
  if(!boul||montan<=0)return alert('Mete boul ak montan');
  let max=tip==='bolet'?limites.bolet:tip==='mariage'?limites.mariage:limites.loto3; if(montan>max)return alert(`Limit ${max}G`);
  let sel=[...document.querySelectorAll('.chkTiraj:checked')].map(c=>c.value); if(sel.length===0)return alert('Chwazi tiraj');
  panier.push({type:tip,boul:montan?boul:boul,montan:montan}); renderPanier();
  document.getElementById('boul').value='';document.getElementById('montan').value='';
};
function renderPanier(){let div=document.getElementById('listFiche');div.innerHTML='';let tot=0;panier.forEach((p,i)=>{tot+=p.montan;div.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:13px"><span>${p.type} ${p.boul}</span><span>${p.montan}G <button onclick="panier.splice(${i},1);renderPanier()" style="background:#ef4444;color:#fff;border:none;border-radius:50%;width:18px;height:18px">x</button></span></div>`;});document.getElementById('totalG').innerText=tot+'G';}
window.validerFiche=async()=>{
  if(await checkBloke())return alert('🚫 BLOKE');
  if(panier.length===0)return alert('Panier vid');
  let sel=[...document.querySelectorAll('.chkTiraj:checked')].map(c=>c.value); if(sel.length===0)return alert('Chwazi tiraj');
  let total=panier.reduce((a,b)=>a+b.montan,0);
  let fich={id:Date.now(),shortId:'C&D-'+Date.now().toString().slice(-5),vendeur:VENDEUR,idVendeur:VENDEUR,date:new Date().toISOString(),haitiDate:getHaitiDateStr(),tiraj:sel[0],tirajs:sel,details:panier,total:total};
  await set(ref(db,`fiches/${fich.id}`),fich);
  alert(`Fich ${fich.shortId} ✅ ${total}G`);
  let win=window.open('','_blank','width=300,height=500'); win.document.write(`<pre>C&D LOTTO\nVendeur: ${VENDEUR}\nDate: ${fich.haitiDate}\nTiraj: ${sel.join(',')}\n---\n${panier.map(p=>`${p.type} ${p.boul} ${p.montan}G`).join('\n')}\n---\nTOTAL: ${total}G\nID: ${fich.shortId}</pre>`); win.print();
  panier=[];renderPanier();
};

// Auto-login si deja konekte
(async()=>{
  let v=localStorage.getItem('vendeur_nom'), p=localStorage.getItem('vendeur_pass');
  if(v&&p){
    let snap=await get(child(ref(db),`config/vendeurs/${v}`));
    if(snap.exists() && snap.val().password===p && snap.val().active!==false){
      document.getElementById('loginVendeur').value=v; document.getElementById('loginPass').value=p; doLogin();
    }
  }
})();
setInterval(()=>{ if(VENDEUR) checkBloke(); },10000);
</script></body></html>
