<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>C&D V96 COMPACT</title>
<style>
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;font-family:sans-serif;background:#f1f5f9;padding:6px;padding-bottom:100px;max-width:100vw}
.hdr{background:#facc15;padding:8px 10px;border-radius:10px;display:flex;justify-content:space-between;font-weight:bold;font-size:12px}
.card{background:#fff;border-radius:12px;padding:8px;margin:6px 0;box-shadow:0 1px 4px rgba(0,0,0,.08);width:100%;overflow:hidden}
.tirajGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tirajItem{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:6px 8px;display:flex;gap:6px;font-size:11px;align-items:center;cursor:pointer;min-height:38px}
.tirajItem.on{background:#dcfce7;border-color:#22c55e;font-weight:bold}
.tirajItem input{width:16px;height:16px;flex-shrink:0}

/* KAZ YO KOUNYA TIPITI */
.row3{display:grid;grid-template-columns:0.9fr 1.1fr 0.7fr;gap:4px;width:100%;max-width:100%}
.row3 select,.row3 input{
  padding:8px 4px !important;
  border:1.5px solid #000 !important;
  border-radius:8px !important;
  text-align:center;
  font-weight:bold;
  font-size:14px !important;
  height:42px !important;
  width:100% !important;
  min-width:0 !important;
  max-width:100% !important;
}
.row3 input:focus{border-color:#22c55e !important;outline:none}
.btnAdd{background:#22c55e;color:#fff;width:100%;padding:10px;border:none;border-radius:10px;font-weight:bold;font-size:14px;margin-top:6px}
.totalBox{display:flex;justify-content:space-between;font-weight:900;font-size:18px;margin:10px 2px}
.btnValide{background:#0f172a;color:#facc15;width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;font-size:14px}
.tabs{position:fixed;bottom:0;left:0;width:100%;background:#0f172a;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:6px;z-index:999}
.tabBtn{background:#1e293b;color:#94a3b8;padding:10px 2px;border-radius:8px;font-size:10px;font-weight:bold;border:none}
.tabBtn.active{background:#facc15;color:#000}
#entetePreview{font-size:10px !important}
</style></head>
<body>

<div class="hdr"><span id="vName">tamouche</span><span>06/08/2026</span><span style="background:#0f172a;color:#facc15;padding:3px 8px;border-radius:12px;font-size:10px">KOM 10%</span></div>
<div style="background:#dcfce7;padding:6px;border-radius:8px;text-align:center;font-weight:bold;font-size:11px;margin:5px 0">✅ Ouvè - Lè Ayiti: <span id="heureAyiti">21:57</span></div>

<div class="card">
<div style="font-weight:bold;font-size:12px;margin-bottom:5px">Tiraj - Chwazi plizyè</div>
<div class="tirajGrid" id="tirajGrid"></div>
</div>

<div class="card" style="border:1.5px solid #000">
<div style="font-size:10px;font-weight:bold;color:#64748b">ENTÈTE FICH LA</div>
<div id="entetePreview" style="background:#f8fafc;padding:5px;border-radius:6px;font-size:10px;border:1px dashed #cbd5e1;margin:4px 0"></div>

<!-- KAZ YO KOUNYA NAN YON RANJE, PA DEPASE -->
<div class="row3">
<select id="tip"><option value="bolet">Bolet</option><option value="mariage">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select>
<input id="boul" placeholder="BOUL" inputmode="numeric" pattern="[0-9]*" maxlength="5">
<input id="montan" placeholder="G" inputmode="numeric" type="number">
</div>

<button id="btnAdd" class="btnAdd">+ AJOUTE (Flèche ↓)</button>

<div id="liste" style="margin-top:8px;font-size:12px"></div>

<div class="totalBox"><span>Total</span><span id="tTotal">0G</span></div>
<div id="detailCalc" style="text-align:right;font-size:11px;font-weight:bold;color:#16a34a;margin-top:-8px"></div>
<div style="display:flex;justify-content:space-between;font-size:10px;color:#64748b;margin-top:4px"><span id="kom">Kom 10% : 0G</span><span id="net">Net: 0G</span></div>

<button onclick="valideFich()" class="btnValide">✅ Validé + Imprimer</button>
</div>

<div class="tabs">
<button class="tabBtn active">VANN</button><button class="tabBtn">KOPYE</button><button class="tabBtn">RAPÒ</button><button class="tabBtn">FICHES</button>
</div>

<script>
let vendeur="tamouche", panier=[];
let TIRAJS=[{n:"FL MIDI",h:"13:15"},{n:"FL SOIR",h:"21:20"},{n:"GA MIDI",h:"12:15"},{n:"GA SOIR",h:"18:15"},{n:"NY MIDI",h:"14:18"},{n:"NY SOIR",h:"21:30"}];
function init(){
 let g=document.getElementById('tirajGrid'); g.innerHTML="";
 TIRAJS.forEach(t=>{ g.innerHTML+=`<label class="tirajItem" id="box-${t.n.replace(/ /g,'')}"><input type="checkbox" value="${t.n}" class="chkT" onchange="updT('${t.n}')"> ${t.n} (${t.h})</label>`; });
 render();
}
window.updT=(n)=>{ let b=document.getElementById('box-'+n.replace(/ /g,'')); let c=document.querySelector(`input[value="${n}"]`); b.classList.toggle('on',c.checked); render(); }
function getT(){return [...document.querySelectorAll('.chkT:checked')].map(c=>c.value);}
function render(){
 let div=document.getElementById('liste'); div.innerHTML=''; let base=0;
 panier.forEach((p,i)=>{ base+=p.montan; div.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee"><span><b>${p.type}</b> ${p.boul}</span><span>${p.montan}G <button onclick="retire(${i})" style="background:#ef4444;color:#fff;border:none;padding:1px 6px;border-radius:4px">x</button></span></div>`; });
 let nb=getT().length||0; let total=nb===0?0:base*nb;
 document.getElementById('tTotal').innerText=total+"G";
 document.getElementById('kom').innerText=`Kom 10% : ${Math.round(total*0.1)}G`;
 document.getElementById('net').innerText=`Net: ${total-Math.round(total*0.1)}G`;
 document.getElementById('entetePreview').innerHTML=`Vandè: <b>${vendeur}</b> | ${getT().join(' / ')||'Pa chwazi tiraj'}<br>${panier.length} fich - Base ${base}G x ${nb} = <b>${total}G</b>`;
 document.getElementById('detailCalc').innerText=nb>0&&base>0?`${base}G × ${nb} = ${total}G`:nb===0?'Chwazi tiraj':'';
}
window.retire=(i)=>{panier.splice(i,1);render();}
function addPanier(){
 let tip=document.getElementById('tip').value; let boul=document.getElementById('boul').value.trim(); let montan=parseInt(document.getElementById('montan').value);
 if(getT().length===0){alert('Chwazi tiraj');return;} if(!boul||!montan){alert('Mete BOUL ak G');return;}
 panier.push({type:tip,boul:boul,montan:montan}); render();
 document.getElementById('boul').value=""; document.getElementById('montan').value=""; document.getElementById('boul').focus();
}
document.getElementById('btnAdd').addEventListener('click',addPanier);
document.getElementById('boul').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('montan').focus(); }});
document.getElementById('montan').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addPanier(); }});
init();
window.valideFich=()=>{ let tirajs=getT(); let base=panier.reduce((a,b)=>a+b.montan,0); let total=base*tirajs.length; alert(`TOTAL: ${total}G = ${base}G x ${tirajs.length}`); };
</script></body></html>
