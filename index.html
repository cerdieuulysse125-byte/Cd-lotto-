<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C&D VÉRITÉ LOTTO - V93 PROPRIO SYNC</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f0f2f5;margin:0;padding:10px}
.header{background:#000;color:#FFD700;padding:15px;text-align:center;font-size:22px;font-weight:bold;position:sticky;top:0;z-index:10}
.card{background:#fff;border-radius:12px;padding:15px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn{padding:10px 18px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-green{background:#16a34a;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.btn-blue{background:#2563eb;color:#fff}
.vendor-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee}
.status-OUVE{color:#16a34a;font-weight:bold} .status-FERME{color:#dc2626;font-weight:bold}
.fiche-item{border:1px dashed #000;padding:8px;margin:5px 0;font-size:14px}
.sync{position:fixed;bottom:10px;right:10px;background:#16a34a;color:#fff;padding:8px 12px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<div class="header">C&D VÉRITÉ LOTTO - V93 PROPRIO SYNC FINAL<br><small style="font-size:12px;color:#fff">✅ SYNC AKTIF - Firebase OK 🟢 Konekte</small></div>

<div class="card">
<h3>Vandè yo - Fèmen = Fèmen tout kote</h3>
<input id="vendorName" placeholder="Non vandè (ex: Jean)" style="padding:10px;width:60%">
<button class="btn btn-blue" onclick="addVendor()">+ Ajoute Vandè</button>
<div id="vendorList"></div>
</div>

<div class="card">
<h3>Fich Live - Total × Tiraj</h3>
<div id="fichesLive">Chargement...</div>
</div>

<div class="sync" id="syncStatus">SYNC AKTIF</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC...",
  authDomain: "cd-lotto.firebaseapp.com",
  databaseURL: "https://cd-lotto-default-rtdb.firebaseio.com",
  projectId: "cd-lotto",
  appId: "1:..."
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function addVendor(){
  const name = document.getElementById('vendorName').value.trim();
  if(!name) return alert("Mete non vandè");
  db.ref('vendors/'+name).set({name:name,status:'OUVE',created:Date.now()});
  document.getElementById('vendorName').value='';
}
function toggleVendor(name,status){
  db.ref('vendors/'+name+'/status').set(status);
}
function deleteVendor(name){
  if(confirm("Efase "+name+" ?")) db.ref('vendors/'+name).remove();
}
db.ref('vendors').on('value', snap=>{
  const list = document.getElementById('vendorList');
  list.innerHTML='';
  snap.forEach(child=>{
    const v = child.val();
    list.innerHTML+=`<div class="vendor-row">
      <span><b>${v.name}</b> - <span class="status-${v.status}">${v.status} ${v.status=='OUVE'?'🟢':'🔴'}</span></span>
      <span>
        ${v.status=='OUVE'?`<button class="btn btn-red" onclick="toggleVendor('${v.name}','FERME')">Fèmen</button>`:`<button class="btn btn-green" onclick="toggleVendor('${v.name}','OUVE')">Louvri</button>`}
        <button class="btn" onclick="deleteVendor('${v.name}')">❌</button>
      </span>
    </div>`;
  });
});
db.ref('fiches').on('value', snap=>{
  const div = document.getElementById('fichesLive');
  div.innerHTML='';
  if(!snap.exists()){div.innerHTML='Pa gen fich';return;}
  snap.forEach(child=>{
    const f = child.val();
    if(!f || !f.boules) return;
    div.innerHTML+=`<div class="fiche-item">
      <b>${f.vendor||'?'} - ${f.id||''}</b> | ${new Date(f.date).toLocaleString()}<br>
      ${f.boules} <br>
      <b>Total: ${f.total||0}$ × ${f.nbTiraj||1} tiraj = ${(f.total||0)*(f.nbTiraj||1)}$ </b>
      <button onclick="db.ref('fiches/${child.key}').remove()" style="float:right">Efase</button>
    </div>`;
  });
});
</script>
</body>
</html>
