<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROPRIO V133 - 3x3 KAZ</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#0d0d0d}
.h{background:#000;color:#fff;padding:14px;text-align:center;font-weight:bold;font-size:16px;border-bottom:2px solid #444}
.card{background:#1c1c1c;padding:14px;margin:6px;border-radius:14px;border:1px solid #333}
.sec{display:none}.sec.active{display:block}
.tabs{display:flex;background:#000;position:sticky;top:0;z-index:30;overflow-x:auto}
.tabs button{padding:10px 14px;border:none;background:#222;color:#fff;margin:2px;border-radius:8px;font-size:11px;font-weight:bold;flex-shrink:0}
.tabs button.active{background:#fff;color:#000}
label{color:#fff;font-weight:bold;font-size:14px}
input,select{width:100%;padding:14px;margin:5px 0;border:2px solid #555;border-radius:12px;font-size:16px;background:#000;color:#fff;font-weight:bold}
.btn{width:100%;padding:16px;background:#fff;color:#000;border:none;border-radius:12px;font-weight:bold;margin-top:10px;font-size:16px}

/* 3 KOLON x 3 LIY */
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.box{border-radius:14px;padding:6px;text-align:center;border:2px solid #555;background:#000}
.box-label{font-size:13px;font-weight:bold;padding:4px;color:#fff;margin-bottom:4px;border-radius:8px}
.lbl-jon{background:#FFD600;color:#000}
.lbl-ve{background:#00C853;color:#000}
.box input{
 width:100%;height:78px;font-size:30px;font-weight:bold;text-align:center;
 border:3px solid #fff;border-radius:12px;background:#111;color:#fff;
 margin:0;padding:0;
}
.box input:focus{border-color:#FFD600;background:#222;color:#FFD600;outline:none}
.mAuto input{background:#00C853!important;color:#000!important;border-color:#00C853!important}

table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}th{background:#fff;color:#000;padding:10px 4px;border:1px solid #000}td{border:1px solid #444;padding:10px 4px;text-align:center;color:#fff;background:#111}
</style></head><body>
<div class="h">PROPRIO V133 - 3 KOLON x 3 LIY</div>

<div id="login" class="card" style="max-width:360px;margin:20px auto">
<input id="u" value="admin"><input id="p" type="password" value="admin">
<button class="btn" onclick="login()">ANTRE</button>
</div>

<div id="app" style="display:none">
<div class="tabs">
<button onclick="go(1)" id="b1" class="active">1.Tirage</button>
<button onclick="go(2)" id="b2">2.Limite</button>
<button onclick="go(3)" id="b3">3.Fermeture</button>
<button onclick="go(4)" id="b4">4.Prix</button>
<button onclick="go(5)" id="b5">5.Vendeurs</button>
<button onclick="go(6)" id="b6">6.Rapport</button>
<button onclick="go(7)" id="b7">7.Entête</button>
</div>

<div id="sec1" class="sec active"><div class="card">
<label>Date......</label><input type="date" id="dateTiraj">
<label>Tiraj (....)</label><select id="selTiraj"><option>GA midi</option><option>FL midi</option><option>NY midi</option><option>GA soir</option><option>FL soir</option><option>NY soir</option></select>

<!-- 3x3 GRID -->
<div class="grid3">
  <div class="box"><div class="box-label lbl-jon">1e</div><input id="p1" maxlength="2" inputmode="numeric" placeholder=".."></div>
  <div class="box"><div class="box-label lbl-jon">2e</div><input id="p2" maxlength="2" inputmode="numeric" placeholder=".."></div>
  <div class="box"><div class="box-label lbl-jon">3e</div><input id="p3" maxlength="2" inputmode="numeric" placeholder=".."></div>

  <div class="box"><div class="box-label lbl-ve">M1 (auto)</div><div class="mAuto"><input id="m1" readonly placeholder="--"></div></div>
  <div class="box"><div class="box-label lbl-ve">M2 (auto)</div><div class="mAuto"><input id="m2" readonly placeholder="--"></div></div>
  <div class="box"><div class="box-label lbl-ve">M3 (auto)</div><div class="mAuto"><input id="m3" readonly placeholder="--"></div></div>

  <div class="box"><div class="box-label lbl-jon">L3</div><input id="l3" maxlength="3" inputmode="numeric" placeholder="L3"></div>
  <div class="box"><div class="box-label lbl-jon">L4</div><input id="l4" maxlength="4" inputmode="numeric" placeholder="L4"></div>
  <div class="box"><div class="box-label lbl-jon">L5</div><input id="l5" maxlength="5" inputmode="numeric" placeholder="L5"></div>
</div>

<button class="btn" onclick="saveTirage()">SOVE TIRAJ SA</button>

<div style="margin-top:18px"><b style="color:#fff">Tablo: (selon dat)</b>
<div style="overflow-x:auto">
<table id="tabAll"><tr><th>Date</th><th>Tiraj</th><th>1e</th><th>2e</th><th>3e</th><th>M1</th><th>M2</th><th>M3</th><th>L3</th><th>L4</th><th>L5</th><th></th></tr></table>
</div>
<button class="btn" style="background:#222;color:#fff;border:2px solid #fff" onclick="loadTab()">Rafrechi Tablo</button>
</div>
</div></div>

<div id="sec2" class="sec"><div class="card"><h3 style="color:#fff">Limite</h3><select id="limTiraj"><option value="global">Global</option><option>GA midi</option><option>FL midi</option><option>NY midi</option><option>GA soir</option><option>FL soir</option><option>NY soir</option></select><input id="limBolet" placeholder="Bolet 1500"><input id="limMaryaj" placeholder="Maryaj 100"><input id="limLoto3" placeholder="Loto3 100"><input id="limLoto4" placeholder="Loto4 20"><input id="limLoto5" placeholder="Loto5 5"><button class="btn" onclick="saveLimite()">Sove</button></div></div>
<div id="sec3" class="sec"><div class="card"><h3 style="color:#fff">Fermeture</h3><div id="fermList" style="color:#fff"></div><button class="btn" onclick="saveFerm()">Sove</button></div></div>
<div id="sec4" class="sec"><div class="card"><h3 style="color:#fff">Prix</h3><input id="prB1" placeholder="1er 50"><input id="prB2" placeholder="2e 20"><input id="prB3" placeholder="3e 10"><input id="prMaryaj" placeholder="Maryaj 1000"><input id="prLoto3" placeholder="Loto3 500"><input id="prLoto4" placeholder="Loto4 5000"><input id="prLoto5" placeholder="Loto5 25000"><button class="btn" onclick="savePrix()">Sove</button></div></div>
<div id="sec5" class="sec"><div class="card"><h3 style="color:#fff">Vendeurs</h3><input id="nomV" placeholder="Non"><input id="passV" placeholder="Modpas"><input id="percV" type="number" value="10"><select id="etatV"><option value="ouvert">Ouvert</option><option value="ferme">Fermé</option></select><button class="btn" onclick="saveVendeur()">Ajoute</button><div id="listV" style="color:#fff"></div></div></div>
<div id="sec6" class="sec"><div class="card"><label>Du....</label><input type="date" id="du"><label>Au....</label><input type="date" id="au"><select id="fVendeur"><option value="tous">Tous</option></select><select id="fTiraj"><option value="tous">Tous</option><option>GA midi</option><option>FL midi</option><option>NY midi</option><option>GA soir</option><option>FL soir</option><option>NY soir</option></select><button class="btn" onclick="genRap()">Rapport</button><div id="zoneRap"></div></div></div>
<div id="sec7" class="sec"><div class="card"><h3 style="color:#fff">Entête</h3><input id="entNom" value="C&D VÉRITÉ LOTTO"><input id="entTel" placeholder="Telefòn"><button class="btn" onclick="saveEntete()">Sove</button></div></div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyA...",authDomain:"cd-lotto.firebaseapp.com",projectId:"cd-lotto"};
let db=null;try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();}catch(e){}
let TIRAJ=["GA midi","FL midi","NY midi","GA soir","FL soir","NY soir"];
function login(){let u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value.trim().toLowerCase();if(u=="admin"&&p=="admin"){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();}}
function go(n){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById('sec'+n).classList.add('active');document.getElementById('b'+n).classList.add('active');}
function init(){let t=new Date().toISOString().slice(0,10);document.getElementById('dateTiraj').value=t;document.getElementById('du').value=t;document.getElementById('au').value=t;['p1','p2','p3'].forEach(id=>{document.getElementById(id).addEventListener('input',autoM);});loadCfg();loadVendeurs();loadTab();document.getElementById('dateTiraj').addEventListener('change',loadTab);}
function autoM(){let a=document.getElementById('p1').value.replace(/\D/g,'').slice(0,2),b=document.getElementById('p2').value.replace(/\D/g,'').slice(0,2),c=document.getElementById('p3').value.replace(/\D/g,'').slice(0,2);document.getElementById('p1').value=a;document.getElementById('p2').value=b;document.getElementById('p3').value=c;document.getElementById('m1').value=(a.length==2&&b.length==2)?a+b:"";document.getElementById('m2').value=(a.length==2&&c.length==2)?a+c:"";document.getElementById('m3').value=(b.length==2&&c.length==2)?b+c:"";}
function saveTirage(){let d=document.getElementById('dateTiraj').value,tr=document.getElementById('selTiraj').value,p1=document.getElementById('p1').value.trim(),p2=document.getElementById('p2').value.trim(),p3=document.getElementById('p3').value.trim(),m1=document.getElementById('m1').value.trim(),m2=document.getElementById('m2').value.trim(),m3=document.getElementById('m3').value.trim(),l3=document.getElementById('l3').value.trim(),l4=document.getElementById('l4').value.trim(),l5=document.getElementById('l5').value.trim();if(!d||p1.length!=2||p2.length!=2||p3.length!=2){alert("Mete Date + 1e 2e 3e");return;}let data={p1,p2,p3,m1,m2,m3,maryaj:[m1,m2,m3].filter(x=>x),l3,l4,l5};if(db)db.collection("resultats").doc(d).set({[tr]:data},{merge:true}).then(()=>{loadTab();alert(tr+" sove")});}
function loadTab(){let d=document.getElementById('dateTiraj').value;if(!db)return;db.collection("resultats").doc(d).onSnapshot(doc=>{let html='<tr><th>Date</th><th>Tiraj</th><th>1e</th><th>2e</th><th>3e</th><th>M1</th><th>M2</th><th>M3</th><th>L3</th><th>L4</th><th>L5</th><th></th></tr>';if(doc.exists){let data=doc.data();TIRAJ.forEach(tr=>{if(data[tr]){let r=data[tr];html+=`<tr><td>${d}</td><td style="color:#FFD600;font-weight:bold">${tr}</td><td>${r.p1}</td><td>${r.p2}</td><td>${r.p3}</td><td style="color:#00C853">${r.m1||''}</td><td style="color:#00C853">${r.m2||''}</td><td style="color:#00C853">${r.m3||''}</td><td>${r.l3||''}</td><td>${r.l4||''}</td><td>${r.l5||''}</td><td><button onclick="fillForm('${tr}')">Edit</button></td></tr>`;}});}else{html+='<tr><td colspan=12>Okenn rezilta pou dat sa</td></tr>';}document.getElementById('tabAll').innerHTML=html;});}
function fillForm(tr){let d=document.getElementById('dateTiraj').value;if(!db)return;db.collection("resultats").doc(d).get().then(doc=>{if(doc.exists&&doc.data()[tr]){let r=doc.data()[tr];document.getElementById('selTiraj').value=tr;document.getElementById('p1').value=r.p1;document.getElementById('p2').value=r.p2;document.getElementById('p3').value=r.p3;document.getElementById('l3').value=r.l3||"";document.getElementById('l4').value=r.l4||"";document.getElementById('l5').value=r.l5||"";autoM();}});}
function loadCfg(){if(!db)return;db.collection("config").doc("settings").onSnapshot(doc=>{if(doc.exists){let cfg=doc.data();let f=cfg.fermeture||{"GA midi":"12:15","FL midi":"13:15","NY midi":"14:15","GA soir":"18:15","FL soir":"21:15","NY soir":"21:30"};let html="";TIRAJ.forEach(tr=>{html+=`<span style="color:#fff">${tr}</span> <input type="time" id="f_${tr}" value="${f[tr]||'12:00'}"><br>`;});document.getElementById('fermList').innerHTML=html;}});db.collection("vendeurs").onSnapshot(q=>{let html="",sel='<option value="tous">Tous</option>';q.forEach(d=>{let v=d.data();html+=`<div style="color:#fff">${v.nom} ${v.perc}% <button onclick="delV('${v.nom}')">X</button></div>`;sel+=`<option value="${v.nom}">${v.nom}</option>`;});document.getElementById('listV').innerHTML=html;document.getElementById('fVendeur').innerHTML=sel;});}
function saveFerm(){let f={};TIRAJ.forEach(tr=>{let el=document.getElementById('f_'+tr);if(el)f[tr]=el.value;});if(db)db.collection("config").doc("settings").set({fermeture:f},{merge:true}).then(()=>alert("Sove"));}
function saveLimite(){let t=document.getElementById('limTiraj').value,l={bolet:document.getElementById('limBolet').value,maryaj:document.getElementById('limMaryaj').value,loto3:document.getElementById('limLoto3').value,loto4:document.getElementById('limLoto4').value,loto5:document.getElementById('limLoto5').value};if(db)db.collection("config").doc("settings").set({limite:{[t]:l}},{merge:true}).then(()=>alert("Sove"));}
function savePrix(){let p={bolet:[document.getElementById('prB1').value,document.getElementById('prB2').value,document.getElementById('prB3').value],maryaj:document.getElementById('prMaryaj').value,loto3:document.getElementById('prLoto3').value,loto4:document.getElementById('prLoto4').value,loto5:document.getElementById('prLoto5').value};if(db)db.collection("config").doc("settings").set({prix:p},{merge:true}).then(()=>alert("Sove"));}
function saveVendeur(){let nom=document.getElementById('nomV').value.trim(),pass=document.getElementById('passV').value.trim(),perc=document.getElementById('percV').value,etat=document.getElementById('etatV').value;if(!nom||!pass)return;if(db)db.collection("vendeurs").doc(nom).set({nom,pass,modpas:pass,perc,etat});}
function delV(n){if(db)db.collection("vendeurs").doc(n).delete();}
function saveEntete(){let e={nom:document.getElementById('entNom').value,tel:document.getElementById('entTel').value};if(db)db.collection("config").doc("settings").set({entete:e},{merge:true}).then(()=>alert("Sove"));}
function genRap(){let du=document.getElementById('du').value,au=document.getElementById('au').value,fV=document.getElementById('fVendeur').value,fT=document.getElementById('fTiraj').value;if(!db)return;db.collection("fiches").get().then(snap=>{db.collection("resultats").get().then(rSnap=>{let res={};rSnap.forEach(d=>{res[d.id]=d.data();});let vTot=0,pTot=0,parTiraj={};snap.forEach(doc=>{let f=doc.data();if(!f.date||f.date<du||f.date>au)return;if(fV!="tous"&&f.vendeur!=fV)return;f.lignes.forEach(l=>{f.tirajs.forEach(tir=>{if(fT!="tous"&&tir!=fT)return;if(!parTiraj[tir])parTiraj[tir]={vente:0,payer:0};let miz=parseFloat(l.miz)||0;parTiraj[tir].vente+=miz;vTot+=miz;let rr=res[f.date]?.[tir];if(rr){let pay=0;if(l.jeux=="bolet"){if(l.boule==rr.p1)pay=miz*50;else if(l.boule==rr.p2)pay=miz*20;else if(l.boule==rr.p3)pay=miz*10;}if(l.jeux=="maryaj"&&rr.maryaj&&rr.maryaj.includes(l.boule))pay=miz*1000;parTiraj[tir].payer+=pay;pTot+=pay;}});});});db.collection("vendeurs").get().then(vSnap=>{let percs={};vSnap.forEach(d=>{percs[d.id]=parseFloat(d.data().perc)||10;});let c=0;snap.forEach(doc=>{let f=doc.data();if(f.date<du||f.date>au)return;if(fV!="tous"&&f.vendeur!=fV)return;let perc=percs[f.vendeur]||10;let vf=0;f.lignes.forEach(l=>{vf+=parseFloat(l.miz)||0;});vf*=(f.tirajs.length||1);c+=vf*perc/100;});let bal=vTot-c-pTot;document.getElementById('zoneRap').innerHTML=`<div style="border:2px solid #fff;padding:10px;background:#000;margin-top:8px;color:#fff">Du ${du} Au ${au}<br>${Object.keys(parTiraj).map(t=>`${t}: V ${parTiraj[t].vente} - P ${parTiraj[t].payer}`).join('<br>')}<hr>Vente ${vTot}<br>Commission ${c.toFixed(0)}<br>A payer ${pTot}<br><div style="background:#fff;color:#000;padding:8px;margin-top:6px;font-weight:bold">Balance net ${bal.toFixed(0)}</div><button onclick="window.print()" style="width:100%;margin-top:6px;padding:12px;background:#fff;color:#000;font-weight:bold">Imprimer</button></div>`;});});});}
</script></body></html>
