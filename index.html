<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYS-CDU.COM - SUPER ADMIN SAAS</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial;font-weight:900}
body{background:#eee;margin:0;padding:10px}
.card{background:#fff;border:4px solid #000;border-radius:16px;padding:12px;margin-bottom:12px}
.input{width:100%;padding:14px;border:3px solid #000;border-radius:12px;margin:6px 0;text-transform:uppercase}
.btn{padding:14px;border:3px solid #000;border-radius:12px;text-align:center;cursor:pointer;margin:6px 0}
.yellow{background:#ff0}.green{background:#0f0}.red{background:#f00;color:#fff}.black{background:#000;color:#ff0}
.tab{display:flex;gap:6px;margin-bottom:10px;overflow:auto}
.tab div{padding:10px;border:3px solid #000;border-radius:12px;background:#fff;white-space:nowrap;cursor:pointer}
.tab.active{background:#000;color:#ff0}
.tabContent{display:none}.tabContent.active{display:block}
</style>
</head>
<body>

<div id="loginScreen" class="card" style="max-width:400px;margin:50px auto;border:6px solid #000;background:#ff0;">
<div style="text-align:center;font-size:20px;">👑 SYS-CDU.COM<br>SUPER ADMIN LOGIN</div>
<input id="lName" placeholder="NON - SUPER oswa X, Y" class="input">
<input id="lPass" placeholder="MODPAS - 000000" class="input" type="password" inputmode="numeric">
<div class="btn black" onclick="login()">🔑 KONEKTE</div>
<div style="font-size:10px;text-align:center;margin-top:8px;">SUPER / 000000 = Super Admin<br>X / 1234 = Proprio X - SAAS</div>
</div>

<div id="mainApp" style="display:none;">
<div class="card" style="background:#000;color:#ff0;text-align:center;">
<span id="whoIs">SUPER ADMIN</span> | <span id="proprioLogo">C&D CdU LOTTO</span> | <span onclick="logout()" style="background:#f00;padding:4px 8px;border-radius:8px;color:#fff;cursor:pointer;">DEKONEKTE</span>
</div>

<div class="tab">
<div id="tabSuper" class="active" onclick="showTab('superAdmin')">👑 SUPER ADMIN</div>
<div id="tabVendeurs" onclick="showTab('vendeurs')">👥 VANDEURS</div>
</div>

<div id="superAdmin" class="tabContent active">
<div class="card" style="border:4px solid #000;background:#ff0;">
<div style="background:#000;color:#ff0;padding:12px;border-radius:12px;text-align:center;">👑 SUPER ADMIN CdU - Vann sistèm ak X, Y, Z - $/mwa - cd-lotto</div>
<div style="margin-top:10px;background:#fff;border:3px solid #000;border-radius:12px;padding:10px;">
<input id="newProprioXName" placeholder="NON PROPRIO - Ex: X" class="input">
<input id="newProprioXPass" placeholder="MODPAS - Ex: 1234" class="input" inputmode="numeric">
<input id="newProprioXLogo" placeholder="LOGO - Ex: C&D X LOTTO" class="input">
<input id="newProprioXPrix" type="number" value="60" placeholder="PRIX 1er LOT" class="input">
<input id="newProprioXPriceSell" type="number" value="100" placeholder="PRI VANN $/MWA" class="input">
<div class="btn yellow" onclick="ajouterProprioMulti()" style="border:4px solid #000;">👑 VANN SISTEM AK PROPRIO SA</div>
</div>
<div id="listPropriosMulti" style="margin-top:10px;"></div>
<div id="superStats" style="margin-top:10px;background:#000;color:#0f0;padding:12px;border-radius:12px;text-align:center;">0 proprio</div>
</div>
</div>

<div id="vendeurs" class="tabContent">
<div class="card">
<div id="titleVendeurs">👥 VANDEURS</div>
<input id="newVendName" placeholder="NON VANDEUR - Ex: X1" class="input">
<input id="newVendPass" placeholder="MODPAS - 1111" class="input" inputmode="numeric">
<div class="btn green" onclick="ajouterVendeur()">➕ KREYE VANDEUR</div>
<div id="listVendeurs" style="margin-top:10px;"></div>
</div>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",
  authDomain: "cd-lotto.firebaseapp.com",
  databaseURL: "https://cd-lotto-default-rtdb.firebaseio.com",
  projectId: "cd-lotto",
  storageBucket: "cd-lotto.firebasestorage.app",
  messagingSenderId: "671091732195",
  appId: "1:671091732195:web:51bcfe8df83bc58fc75fd6",
  measurementId: "G-TWK9N38BS0"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var currentUser=null; var proprioActif=null;

function showTab(id){
  document.querySelectorAll('.tabContent').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tab div').forEach(e=>e.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='superAdmin') document.getElementById('tabSuper').classList.add('active');
  if(id==='vendeurs') document.getElementById('tabVendeurs').classList.add('active');
}
function login(){
  var n=document.getElementById('lName').value.trim().toUpperCase();
  var p=document.getElementById('lPass').value.trim();
  if(n==='SUPER' && p==='000000'){
    currentUser={type:'SUPER',name:'SUPER'}; afterLogin(); return;
  }
  db.ref('config/proprietaires/'+n).once('value').then(s=>{
    var data=s.val();
    if(data && String(data.pass)===String(p)){
      currentUser={type:'PROPRIO',name:n,data:data}; afterLogin();
    }else alert('Non oswa modpas pa bon - Eseye SUPER / 000000');
  });
}
function afterLogin(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  if(currentUser.type==='SUPER'){
    document.getElementById('whoIs').textContent='👑 SUPER ADMIN CdU';
    renderPropriosMulti();
  }else{
    document.getElementById('whoIs').textContent='PROPRIO '+currentUser.name;
    document.getElementById('proprioLogo').textContent=currentUser.data.logo;
    document.getElementById('tabSuper').style.display='none';
    showTab('vendeurs');
    document.getElementById('titleVendeurs').textContent='👥 VANDEURS POU '+currentUser.name;
    renderVendeurs(currentUser.name);
  }
}
function ajouterProprioMulti(){
  var name=document.getElementById('newProprioXName').value.trim().toUpperCase();
  var pass=document.getElementById('newProprioXPass').value.trim();
  var logo=document.getElementById('newProprioXLogo').value.trim() || 'C&D '+name+' LOTTO';
  var prix1=parseInt(document.getElementById('newProprioXPrix').value)||60;
  var priceSell=parseInt(document.getElementById('newProprioXPriceSell').value)||100;
  if(!name||!pass) return alert('Non + modpas obligatwa');
  var data={name:name,pass:pass,logo:logo,prix1:prix1,priceSell:priceSell,ouvert:true,ts:Date.now(),createdBy:'SUPER'};
  db.ref('config/proprietaires/'+name).set(data).then(()=>{
    db.ref('vendors_'+name).set({init:true});
    alert('✅ Proprio '+name+' kreye - Login: '+name+' / '+pass+' - $'+priceSell+'/mwa - syscdu.com');
  });
}
function renderPropriosMulti(){
  db.ref('config/proprietaires').on('value',snap=>{
    var data=snap.val(); var cont=document.getElementById('listPropriosMulti'); cont.innerHTML='';
    var total=0,money=0;
    if(!data) return;
    for(var k in data){
      var p=data[k]; total++; money+=p.priceSell||0;
      var div=document.createElement('div'); div.className='card'; div.style.border='3px solid #000';
      div.innerHTML='<div>👑 '+p.name+' - '+p.logo+' - Pass: '+p.pass+' - $'+p.priceSell+'/mwa</div><div style="display:flex;gap:4px;"><div class="btn green" style="flex:1;" onclick="loginAsProprio(\''+p.name+'\')">🔑 Login '+p.name+'</div><div class="btn red" style="flex:1;" onclick="if(confirm(\'Efase '+p.name+'?\')) db.ref(\'config/proprietaires/'+p.name+'\').remove()">❌ Efase</div></div>';
      cont.appendChild(div);
    }
    document.getElementById('superStats').textContent='👑 '+total+' proprio - $'+money+' /mwa - SAAS sys-cdu.com - cd-lotto';
  });
}
function loginAsProprio(name){
  db.ref('config/proprietaires/'+name).once('value').then(s=>{
    currentUser={type:'PROPRIO',name:name,data:s.val()}; afterLogin();
  });
}
function ajouterVendeur(){
  var prop=currentUser.type==='SUPER'? prompt('Pou ki proprio? X oswa Y') : currentUser.name;
  if(!prop) return;
  var name=document.getElementById('newVendName').value.trim().toUpperCase();
  var pass=document.getElementById('newVendPass').value.trim();
  if(!name||!pass) return alert('Non + modpas');
  db.ref('vendors_'+prop+'/'+name).set({name:name,pass:pass,proprio:prop,ts:Date.now()}).then(()=>{
    alert('Vendeur '+name+' kreye pou '+prop); renderVendeurs(prop);
  });
}
function renderVendeurs(prop){
  db.ref('vendors_'+prop).on('value',snap=>{
    var data=snap.val(); var cont=document.getElementById('listVendeurs'); cont.innerHTML='';
    if(!data) return;
    for(var k in data){ if(k==='init') continue;
      var v=data[k]; var div=document.createElement('div'); div.className='card';
      div.innerHTML='👤 '+v.name+' - Pass: '+v.pass+' - Proprio: '+v.proprio+' - Login: syscdu.com/vendeur.html';
      cont.appendChild(div);
    }
  });
}
function logout(){ localStorage.clear(); location.reload(); }
</script>
</body>
</html>
