<!DOCTYPE html><html lang="ht"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROPRIO V128.1 FIX LOGIN</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f1f1f1}
.h{background:#111;color:#fff;padding:12px;text-align:center;font-weight:bold}
.card{background:#fff;padding:12px;margin:8px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sec{display:none}.sec.active{display:block}
.tab{display:flex;background:#fff;position:sticky;top:0;z-index:20}
.tab button{flex:1;padding:10px;border:none;background:#eee;margin:2px;border-radius:6px;font-size:11px;font-weight:bold}
.tab button.active{background:#111;color:#fff}
input,select{width:100%;padding:12px;margin:4px 0;border:2px solid #111;border-radius:8px}
.btn{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:6px}
</style></head><body>
<div class="h">PROPRIO V128.1 - LOGIN FIX</div>

<div id="login" class="card" style="max-width:380px;margin:20px auto">
<h3 style="text-align:center">LOGIN PROPRIO</h3>
<input id="u" placeholder="admin" value="admin" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<input id="p" type="password" placeholder="admin" value="admin">
<button class="btn" onclick="login()">ANTRE</button>
<div id="msg" style="color:red;text-align:center;font-size:12px;margin-top:6px"></div>
<div style="text-align:center;font-size:11px;margin-top:8px">Si li pa antre, efase espas devan admin - pa gen espas</div>
</div>

<div id="app" style="display:none">
<div class="tab">
<button onclick="show(1)" id="b1" class="active">1.Vendeurs</button>
<button onclick="show(2)" id="b2">2.Fiches</button>
<button onclick="show(3)" id="b3">3.Resultats</button>
<button onclick="show(4)" id="b4">4.Rapport</button>
</div>

<div id="sec1" class="sec active"><div class="card">
<h3>Vendeurs - KREYE JULES ISIT</h3>
<input id="nomV" placeholder="Non ex: Jules" autocomplete="off">
<input id="passV" placeholder="Modpas ex: 1234">
<input id="percV" type="number" value="10">
<button class="btn" onclick="saveVendeur()">SOVE VANDEUR</button>
<div id="listV" style="margin-top:10px"></div>
</div></div>
<div id="sec2" class="sec"><div class="card"><h3>Fiches</h3><div id="listFiches">Ap chaje...</div></div></div>
<div id="sec3" class="sec"><div class="card">
<h3>Resultats</h3>
<input type="date" id="dateRes"><select id="tirajRes"><option>GA midi</option><option>FL midi</option><option>NY midi</option><option>GA soir</option><option>FL soir</option><option>NY soir</option></select>
<input id="p1" placeholder="1er"><input id="p2" placeholder="2e"><input id="p3" placeholder="3e">
<button class="btn" onclick="saveRes()">Sove Resultat</button>
</div></div>
<div id="sec4" class="sec"><div class="card">
<h3>Rapport Vente/Commission/Payer/Balance</h3>
<label>Du....</label><input type="date" id="du"><label>Au....</label><input type="date" id="au">
<select id="fVendeur"><option value="tous">Tous</option></select>
<select id="fTiraj"><option value="tous">Tous</option><option>GA midi</option><option>FL midi</option><option>NY midi</option><option>GA soir</option><option>FL soir</option><option>NY soir</option></select>
<button class="btn" onclick="genRap()">Rapport</button>
<div id="zoneRap"></div>
</div></div>
</div>

<script>
// CONFIG - RANPLASE AK PA OU, MEN LOGIN AP MACHE MENM SI LI VID
const firebaseConfig = {
  apiKey: "AIzaSyA...METE VRE KLE OU",
  authDomain: "cd-lotto-...firebaseapp.com",
  projectId: "cd-lotto-...",
};
let db=null;
try{ firebase.initializeApp(firebaseConfig); db=firebase.firestore(); }catch(e){ console.log("Firebase config vid - login lokal selman",e.message); }

function login(){
 let u=document.getElementById('u').value.trim().toLowerCase();
 let p=document.getElementById('p').value.trim().toLowerCase();
 console.log("Tentative:",u,p);
 if(u==="admin" && p==="admin"){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  let t=new Date().toISOString().slice(0,10);
  document.getElementById('du').value=t;document.getElementById('au').value=t;document.getElementById('dateRes').value=t;
  loadVendeurs();
  if(db) loadFichesLive();
 } else {
  document.getElementById('msg').textContent="Ekri admin san espas - ou gen espas devan: '"+document.getElementById('u').value+"'";
 }
}
function show(n){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tab button').forEach(b=>b.classList.remove('active'));document.getElementById('sec'+n).classList.add('active');document.getElementById('b'+n).classList.add('active');}
function saveVendeur(){
 let nom=document.getElementById('nomV').value.trim();let pass=document.getElementById('passV').value.trim();let perc=parseFloat(document.getElementById('percV').value)||10;
 if(!nom||!pass){alert("Mete non ak modpas");return;}
 let v={nom,pass,modpas:pass,perc,etat:"ouvert"};
 let local=JSON.parse(localStorage.getItem('vendeurs')||'[]');let idx=local.findIndex(x=>x.nom.toLowerCase()==nom.toLowerCase());if(idx>=0)local[idx]=v;else local.push(v);localStorage.setItem('vendeurs',JSON.stringify(local));
 if(db){ db.collection("vendeurs").doc(nom).set(v).then(()=>{alert("✅ "+nom+" sove Firebase - Vendeur ap ka antre ak "+pass);loadVendeurs();}).catch(e=>{alert("Sove lokal selman - Firebase Rules pa bon: "+e.message);loadVendeurs();}); }
 else { alert("✅ "+nom+" sove lokal - Mete vre firebaseConfig pou Vendeur konekte");loadVendeurs();}
 document.getElementById('nomV').value="";document.getElementById('passV').value="";
}
function loadVendeurs(){
 let local=JSON.parse(localStorage.getItem('vendeurs')||'[]');
 if(db){
  db.collection("vendeurs").get().then(q=>{
   let html="";let sel='<option value="tous">Tous Vendeurs</option>';q.forEach(doc=>{let v=doc.data();html+=`<div style="display:flex;justify-content:space-between;padding:6px;border-bottom:1px dashed #aaa"><span><b>${v.nom}</b> pass:${v.pass} ${v.perc}%</span><button onclick="delV('${v.nom}')" style="background:red;color:#fff;border:none;padding:4px 8px;border-radius:4px">X</button></div>`;sel+=`<option value="${v.nom}">${v.nom}</option>`;});
   if(!q.size) html=local.map(v=>`<div><b>${v.nom}</b> ${v.pass}</div>`).join('')||"Okenn";
   document.getElementById('listV').innerHTML=html;document.getElementById('fVendeur').innerHTML=sel;
  }).catch(()=>{document.getElementById('listV').innerHTML=local.map(v=>`<div><b>${v.nom}</b> ${v.pass}</div>`).join('');});
 } else {
  document.getElementById('listV').innerHTML=local.map(v=>`<div><b>${v.nom}</b> ${v.pass} ${v.perc}%</div>`).join('')||"Okenn - kreye Jules";
 }
}
function delV(n){if(db)db.collection("vendeurs").doc(n).delete();let local=JSON.parse(localStorage.getItem('vendeurs')||'[]');local=local.filter(x=>x.nom!=n);localStorage.setItem('vendeurs',JSON.stringify(local));loadVendeurs();}
function loadFichesLive(){if(!db)return;db.collection("fiches").where("date","==",new Date().toISOString().slice(0,10)).onSnapshot(s=>{let html="";s.forEach(d=>{let f=d.data();html+=`${f.code} - ${f.vendeur} - ${f.total}G<br>`;});document.getElementById('listFiches').innerHTML=html||"Okenn";});}
function saveRes(){if(!db){alert("Mete Firebase config");return;}let d=document.getElementById('dateRes').value,t=document.getElementById('tirajRes').value,p1=document.getElementById('p1').value;if(!d||!p1){alert("Mete dat ak p1");return;}db.collection("resultats").doc(d).set({[t]:{p1:p1,p2:document.getElementById('p2').value,p3:document.getElementById('p3').value}},{merge:true}).then(()=>alert("Sove"));}
function genRap(){if(!db){alert("Mete Firebase config pou rapò");return;}let du=document.getElementById('du').value,au=document.getElementById('au').value,fV=document.getElementById('fVendeur').value,fT=document.getElementById('fTiraj').value;db.collection("fiches").get().then(snap=>{let vT=0,cT=0,pT=0,nb=0;snap.forEach(doc=>{let f=doc.data();if(f.date<du||f.date>au)return;if(fV!="tous"&&f.vendeur!=fV)return;if(fT!="tous"&&!f.tirajs.includes(fT))return;nb++;f.lignes.forEach(l=>{vT+=(parseFloat(l.miz)||0)*(f.tirajs.length||1);});});cT=vT*0.1;let bal=vT-cT-pT;document.getElementById('zoneRap').innerHTML=`<div style="border:2px solid #111;padding:12px;margin-top:10px"><div style="text-align:center;font-weight:bold">Du ${du} Au ${au}</div><hr>Vente... <b>${vT} G</b><br>Commission.... <b>${cT} G</b><br>A payer.... <b>${pT} G</b><br><div style="background:#111;color:#fff;padding:8px;margin-top:6px">Balance net... <b>${bal} G</b></div><br><button onclick="window.print()" style="width:100%;padding:10px;background:#fff;border:2px solid #111;font-weight:bold">Imprimer</button></div>`;});}

// Auto-login si deja konekte
let uEl=document.getElementById('u'); uEl.value=uEl.value.trim();
</script></body></html>
