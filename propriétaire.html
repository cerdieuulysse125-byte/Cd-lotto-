<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D PROPRIO V71</title><style>body{font-family:Arial;background:#0f172a;color:#fff;padding:12px;margin:0}h1{color:#facc15;text-align:center}.card{background:#1e293b;padding:14px;border-radius:12px;margin:10px 0;border:1px solid #334155}.btn{padding:10px 16px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.btn-y{background:#facc15;color:#000}.btn-g{background:#22c55e;color:#000}input{padding:8px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:#fff;margin:3px}.tab{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.tab button{padding:9px 12px;border:0;border-radius:8px;background:#334155;color:#fff}.tab button.active{background:#facc15;color:#000}table{width:100%;border-collapse:collapse}th,td{border:1px solid #334155;padding:6px;font-size:12px}th{background:#0f172a}</style></head><body><h1>👑 C&D PROPRIO V71</h1><p style="text-align:center;color:#94a3b8">6 Tiraj | FL 13:15/21:15 GA 12:20/18:20 NY 14:15/21:30 EST</p><div class="tab"><button onclick="show('dash')" id="b-dash" class="active">📊 DASH</button><button onclick="show('rezilta')" id="b-rezilta">🎯 REZILTA</button><button onclick="show('pri')" id="b-pri">💰 PRI</button></div><div id="dash" class="card"><h3>📊 DASH JODIA</h3><div id="dashContent">Ap chaje...</div><hr><h4>Détail - GAYAN/PÈDI</h4><div id="korijeList"></div></div><div id="rezilta" class="card" style="display:none"><h2>🎯 Antre Rezilta</h2><div id="reziltaGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px"></div></div><div id="pri" class="card" style="display:none"><h2>💰 PRI</h2>Bolet 1er: <input id="p_b1" type="number" value="50"><br>Bolet 2e: <input id="p_b2" type="number" value="20"><br>Bolet 3e: <input id="p_b3" type="number" value="10"><br><br>Maryaj: <input id="p_mar" type="number" value="1000"><br>Loto3: <input id="p_l3" type="number" value="500"><br>Loto4: <input id="p_l4" type="number" value="5000"><br>Loto5: <input id="p_l5" type="number" value="25000"><br><br><button class="btn btn-g" onclick="savePri()">💾 SOVE PRI</button> <span id="priStat"></span></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getDatabase,ref,onValue,set}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";const firebaseConfig={apiKey:"AIzaSyA1_MK9_5ou2opJA_LRfMTgSEY56W7HQEs",authDomain:"cerdieulotto.firebaseapp.com",projectId:"cerdieulotto",storageBucket:"cerdieulotto.firebasestorage.app",messagingSenderId:"614410442443",appId:"1:614410442443:web:ed0f44671b4b0ff60bed4e",measurementId:"G-M6CJ9DZGET",databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};const app=initializeApp(firebaseConfig);const db=getDatabase(app);const TIRAJ=[{id:"gaam",nom:"GA AM",ferme:"12:20",h:12,m:20},{id:"flam",nom:"FL AM",ferme:"13:15",h:13,m:15},{id:"nyam",nom:"NY AM",ferme:"14:15",h:14,m:15},{id:"gapm",nom:"GA PM",ferme:"18:20",h:18,m:20},{id:"flpm",nom:"FL PM",ferme:"21:15",h:21,m:15},{id:"nypm",nom:"NY PM",ferme:"21:30",h:21,m:30}];let PRI={b1:50,b2:20,b3:10,l3:500,mar:1000,l4:5000,l5:25000};let VENTES={};let REZILTA={};window.show=(t)=>{document.querySelectorAll('#dash,#rezilta,#pri').forEach(e=>e.style.display='none');document.getElementById(t).style.display='block';document.querySelectorAll('.tab button').forEach(b=>b.classList.remove('active'));document.getElementById('b-'+t).classList.add('active');if(t=='rezilta')renderReziltaForm();if(t=='dash')renderDash();};function renderReziltaForm(){let html="";TIRAJ.forEach(t=>{const r=REZILTA[t.id]||{};html+=`<div class="card"><b>${t.nom} - ${t.ferme} EST</b><br><br>1er: <input id="${t.id}1" value="${r.r1||''}" style="width:60px"> 2e: <input id="${t.id}2" value="${r.r2||''}" style="width:60px"> 3e: <input id="${t.id}3" value="${r.r3||''}" style="width:60px"><br><br><button class="btn btn-y" onclick="saveRez('${t.id}')">SOVE ${t.nom}</button> <span id="st-${t.id}">${r.r1!==undefined?'✅':''}</span></div>`;});document.getElementById('reziltaGrid').innerHTML=html;}window.saveRez=async(id)=>{const r1=document.getElementById(id+'1').value.padStart(2,'0');const r2=document.getElementById(id+'2').value.padStart(2,'0');const r3=document.getElementById(id+'3').value.padStart(2,'0');if(!r1)return alert("Antre 1er");const today=new Date().toISOString().split('T')[0];await set(ref(db,'rezilta/'+today+'/'+id),{r1,r2,r3,ts:Date.now()});document.getElementById('st-'+id).innerText='✅ Sove!';};window.savePri=async()=>{PRI={b1:+p_b1.value,b2:+p_b2.value,b3:+p_b3.value,l3:+p_l3.value,mar:+p_mar.value,l4:+p_l4.value,l5:+p_l5.value};await set(ref(db,'config/pri'),PRI);priStat.innerText='✅ Pri sove!';};function kalkilGayan(f){const rez=REZILTA[f.tiraj];if(!rez)return{gayan:false,peyman:0,txt:"Ann attente"};let pey=0;if(f.type=='bolet'){if(f.boul==rez.r1)pey=f.montan*PRI.b1;else if(f.boul==rez.r2)pey=f.montan*PRI.b2;else if(f.boul==rez.r3)pey=f.montan*PRI.b3;}else if(f.type=='maryaj'){const parts=f.boul.split('-');const nums=[rez.r1,rez.r2,rez.r3];if(nums.includes(parts[0])&&nums.includes(parts[1]))pey=f.montan*PRI.mar;}return{gayan:pey>0,peyman:pey,txt:pey>0?'🟢 GAYAN '+pey+'G':'🔴 PÈDI'};}function renderDash(){let totalV=0,totalP=0,html="<table><tr><th>Tiraj</th><th>Vant</th><th>Peyman</th><th>Benefis</th><th>Rezilta</th></tr>";TIRAJ.forEach(t=>{let v=0,p=0;Object.values(VENTES).forEach(vend=>{Object.values(vend).forEach(f=>{if(f.tiraj==t.id){v+=+f.montan||0;p+=kalkilGayan(f).peyman;}})});const rez=REZILTA[t.id];html+=`<tr><td>${t.nom}</td><td>${v}G</td><td>${p}G</td><td style="color:${v-p>=0?'#22c55e':'#ef4444'};font-weight:bold">${v-p}G</td><td>${rez?rez.r1+'-'+rez.r2+'-'+rez.r3+' ✅':'⏳'}</td></tr>`;totalV+=v;totalP+=p;});html+=`</table><h2 style="color:${totalV-totalP>=0?'#22c55e':'#ef4444'}">TOTAL: ${totalV}G - ${totalP}G = ${totalV-totalP}G</h2>`;document.getElementById('dashContent').innerHTML=html;let list="<table><tr><th>Fich</th><th>Tiraj</th><th>Boul</th><th>Rezilta</th><th>Peyman</th></tr>";Object.entries(VENTES).forEach(([vend,fiches])=>{Object.entries(fiches).forEach(([fid,f])=>{const g=kalkilGayan(f);list+=`<tr><td>${vend}-${fid.slice(-4)}</td><td>${f.tiraj}</td><td>${f.type} ${f.boul} ${f.montan}G</td><td>${g.txt}</td><td>${g.peyman}G</td></tr>`;})});document.getElementById('korijeList').innerHTML=list+"</table>";}const today=new Date().toISOString().split('T')[0];onValue(ref(db,'config/pri'),s=>{if(s.val()){PRI=s.val();try{p_b1.value=PRI.b1;p_b2.value=PRI.b2;p_b3.value=PRI.b3;p_l3.value=PRI.l3;p_mar.value=PRI.mar;p_l4.value=PRI.l4;p_l5.value=PRI.l5;}catch(e){}}});onValue(ref(db,'rezilta/'+today),s=>{REZILTA=s.val()||{};renderReziltaForm();renderDash();});onValue(ref(db,'ventes/'+today),s=>{VENTES=s.val()||{};renderDash();});</script></body></html>
