<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROPRIO /proprio - AUTO KORIJ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff;padding:10px;padding-bottom:90px}
.hdr{background:#facc15;color:#000;padding:14px;border-radius:14px;display:flex;justify-content:space-between;font-weight:900}
.card{background:#1e293b;border-radius:16px;padding:14px;margin:10px 0}
.btn{padding:12px;border:none;border-radius:10px;font-weight:800;cursor:pointer;width:100%}
.btnYellow{background:#facc15;color:#000}.btnGreen{background:#22c55e;color:#fff}.btnRed{background:#ef4444;color:#fff}.btnBlue{background:#3b82f6;color:#fff}
.tabs{position:fixed;bottom:0;left:0;width:100%;background:#020617;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:6px}
.tabBtn{background:#1e293b;color:#94a3b8;padding:10px 2px;border-radius:8px;border:none;font-weight:800;font-size:10px}.tabBtn.active{background:#facc15;color:#000}
.sec{display:none}.sec.active{display:block}
input,select{padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;width:100%}
table{width:100%;font-size:11px;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #334155}
</style></head><body>
<div class="hdr"><span>PROPRIO /proprio V96 AUTO</span><span id="dateNow"></span></div>

<div id="secRESULTATS" class="sec active"><div class="card">
<b>🎯 1. AFICHE REZILTA + AUTO KORIJ FICH</b><p style="font-size:11px;color:#94a3b8">Lè ou pibliye rezilta, tout fich ki gen tiraj sa a ap korije otomatikman (PAYE kalkile)</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="resDate" type="date"><select id="resTiraj"><option>FL MIDI</option><option>FL SOIR</option><option>GA MIDI</option><option>GA SOIR</option><option>NY MIDI</option><option>NY SOIR</option></select></div>
<input id="resBolet" placeholder="Bolet Gayan (ex: 12)" style="margin-top:8px">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px">
<input id="resMaryaj1" placeholder="Maryaj 1 (ex: 12x34)"><input id="resLoto3" placeholder="Loto3 (ex: 123)"><input id="resLoto4" placeholder="Loto4">
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<div><label>Prix Bolet x</label><input id="prixBolet" type="number" value="50"></div>
<div><label>Prix Maryaj x</label><input id="prixMaryaj" type="number" value="20"></div>
<div><label>Prix Loto3 x</label><input id="prixLoto3" type="number" value="500"></div>
<div><label>Prix Loto4 x</label><input id="prixLoto4" type="number" value="5000"></div>
</div>
<button class="btn btnYellow" onclick="publierEtKorije()" style="margin-top:12px">🚀 PUBLIER + KORIJE TOUT FICH OTOMATIK</button>
<div id="korijStatus" style="margin-top:10px;font-size:12px"></div>
<div id="listResultats" style="margin-top:12px"></div>
</div></div>

<div id="secVENDEURS" class="sec"><div class="card"><b>👥 VANDÈ</b><div id="listVendeurs"></div></div></div>

<div id="secRAPPORTS" class="sec"><div class="card"><b>📊 RAPPORTS APRE KORIJMAN</b>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="rapDu" type="date"><input id="rapAu" type="date"></div>
<select id="rapVendeur" style="margin-top:6px"><option value="">Tout Vandè</option></select>
<button class="btn btnBlue" onclick="genererRapport()" style="margin-top:8px">OK RAPPORT</button><div id="rapportResult"></div></div></div>

<div id="secFICHES" class="sec"><div class="card"><b>🎫 FICHES KORIJE</b><div id="listFiches"></div></div></div>

<div class="tabs">
<button onclick="showTab('RESULTATS')" id="tabRESULTATS" class="tabBtn active">REZILTA</button>
<button onclick="showTab('VENDEURS')" id="tabVENDEURS" class="tabBtn">VANDÈ</button>
<button onclick="showTab('RAPPORTS')" id="tabRAPPORTS" class="tabBtn">RAPÒ</button>
<button onclick="showTab('FICHES')" id="tabFICHES" class="tabBtn">FICHES</button>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getDatabase,ref,get,child,set,update}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};const app=initializeApp(cfg);const db=getDatabase(app);
function getDateHaiti(d=new Date()){let h=new Date(d.toLocaleString("en-US",{timeZone:"America/New_York"}));return`${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;}
function init(){document.getElementById('dateNow').innerText=getDateHaiti();document.getElementById('resDate').value=getDateHaiti();document.getElementById('rapDu').value=getDateHaiti();document.getElementById('rapAu').value=getDateHaiti();loadVendeurs();loadResultats();loadPrix();}
window.showTab=(t)=>{document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));document.getElementById('sec'+t).classList.add('active');document.getElementById('tab'+t).classList.add('active');};

window.publierEtKorije=async()=>{
let date=document.getElementById('resDate').value,tiraj=document.getElementById('resTiraj').value;
let bolet=document.getElementById('resBolet').value.trim();
let maryaj=document.getElementById('resMaryaj1').value.trim();
let loto3=document.getElementById('resLoto3').value.trim();
let loto4=document.getElementById('resLoto4').value.trim();
let prixB=parseInt(document.getElementById('prixBolet').value)||50;
let prixM=parseInt(document.getElementById('prixMaryaj').value)||20;
let prixL3=parseInt(document.getElementById('prixLoto3').value)||500;
let prixL4=parseInt(document.getElementById('prixLoto4').value)||5000;

if(!bolet &&!maryaj &&!loto3 &&!loto4){alert('Mete omwen yon rezilta');return;}
document.getElementById('korijStatus').innerHTML='⏳ Pibliye rezilta ak korije fich yo...';

// 1. Sove rezilta a
await set(ref(db,'config/resultats/'+date+'/'+tiraj),{bolet,maryaj,loto3,loto4,tiraj,date,prix:{bolet:prixB,maryaj:prixM,loto3:prixL3,loto4:prixL4},timestamp:new Date().toISOString()});

// 2. Sove prix yo
await set(ref(db,'config/prixJeux'),{bolet:prixB,maryaj:prixM,loto3:prixL3,loto4:prixL4});

// 3. AUTO KORIJ TOUT FICH KI GEN TIRAJ SA A NAN DAT SA A
let snap=await get(child(ref(db),'fiches'));
if(!snap.exists()){document.getElementById('korijStatus').innerHTML='Pa gen fich';return;}
let all=Object.values(snap.val());
let fichesTiraj=all.filter(f=>{
let dH=getDateHaiti(new Date(f.date));
return dH==date && (f.tirajs||[]).includes(tiraj);
});

let totalKorije=0,totalPaye=0;
for(let f of fichesTiraj){
let gain=0;
let details=f.details||[];
details.forEach(d=>{
let boul=(d.boul||'').toString().trim();
let montan=parseInt(d.montan)||0;
if(d.type=='bolet' && bolet && boul==bolet){gain+=montan*prixB;}
if(d.type=='mariage' && maryaj && (boul==maryaj || boul.split('x').sort().join('x')==maryaj.split('x').sort().join('x'))){gain+=montan*prixM;}
if(d.type=='loto3' && loto3 && boul==loto3){gain+=montan*prixL3;}
if(d.type=='loto4' && loto4 && boul==loto4){gain+=montan*prixL4;}
});
if(gain>0 || f.paye==0){
// mete paye a nan fich la
await update(ref(db,'fiches/'+f.id),{paye:gain,gagne:gain,korijeAuto:true,resultatKorije:tiraj+'='+bolet});
totalKorije++;totalPaye+=gain;
}
}

document.getElementById('korijStatus').innerHTML=`✅ <b>${totalKorije} fich korije pou ${tiraj} ${date}</b><br>Total PAYE: ${totalPaye}G<br>Bolet: ${bolet} x${prixB} | Maryaj: ${maryaj} x${prixM}<br><br>Rapò vandè yo ap mete ajou otomatikman!`;
loadResultats();genererRapport();
};

async function loadVendeurs(){let s=await get(child(ref(db),'fiches'));let setV=new Set();if(s.exists())Object.values(s.val()).forEach(f=>setV.add(f.vendeur));let html='<table><tr><th>Vandè</th><th>Fich</th><th>Aksyon</th></tr>';for(let k of setV){html+=`<tr><td><b>${k}</b></td><td>${Object.values(s.val()).filter(f=>f.vendeur==k).length}</td><td><button class=btn style=background:#ef4444;color:#fff;padding:6px onclick="bloquer('${k}')">BLOKE</button></td></tr>`;}html+='</table>';document.getElementById('listVendeurs').innerHTML=html;let sel=document.getElementById('rapVendeur');sel.innerHTML='<option value="">Tout Vandè</option>';setV.forEach(v=>sel.innerHTML+=`<option value="${v}">${v}</option>`);}
window.bloquer=async(v)=>{await set(ref(db,'vendeurs/'+v+'/bloque'),true);await set(ref(db,'config/vendeursBloque/'+v),true);alert(v+' BLOKE - ekran wouj ap parèt sou li');}
async function loadResultats(){let s=await get(child(ref(db),'config/resultats'));if(!s.exists()){document.getElementById('listResultats').innerHTML='Pa gen rezilta';return;}let html='<table><tr><th>Date</th><th>Tiraj</th><th>Bolet</th><th>PAYE distribye</th></tr>';for(let date in s.val()){for(let tiraj in s.val()[date]){let r=s.val()[date][tiraj];html+=`<tr><td>${date}</td><td>${tiraj}</td><td><b style=color:#facc15>${r.bolet||''} ${r.maryaj||''}</b></td><td><button class=btn style=background:#334155;color:#fff;padding:4px;font-size:10px onclick="rekorije('${date}','${tiraj}')">RE-KORIJE</button></td></tr>`;}}html+='</table>';document.getElementById('listResultats').innerHTML=html;}
window.rekorije=async(date,tiraj)=>{document.getElementById('resDate').value=date;document.getElementById('resTiraj').value=tiraj;let s=await get(child(ref(db),'config/resultats/'+date+'/'+tiraj));if(s.exists()){let r=s.val();document.getElementById('resBolet').value=r.bolet||'';document.getElementById('resMaryaj1').value=r.maryaj||'';document.getElementById('resLoto3').value=r.loto3||'';document.getElementById('resLoto4').value=r.loto4||'';}showTab('RESULTATS');alert('Rezilta chaje - peze PUBLIER + KORIJE ankò');}
async function loadPrix(){let s=await get(child(ref(db),'config/prixJeux'));if(s.exists()){let p=s.val();document.getElementById('prixBolet').value=p.bolet||50;document.getElementById('prixMaryaj').value=p.maryaj||20;document.getElementById('prixLoto3').value=p.loto3||500;document.getElementById('prixLoto4').value=p.loto4||5000;}}
window.genererRapport=async()=>{let du=document.getElementById('rapDu').value,au=document.getElementById('rapAu').value,vF=document.getElementById('rapVendeur').value;let s=await get(child(ref(db),'fiches'));if(!s.exists())return;let all=Object.values(s.val()).filter(f=>{let dH=getDateHaiti(new Date(f.date));return dH>=du&&dH<=au&&(!vF||f.vendeur==vF);});let parV={};all.forEach(f=>{if(!parV[f.vendeur])parV[f.vendeur]={vente:0,paye:0,fiches:0};parV[f.vendeur].vente+=f.total||0;parV[f.vendeur].paye+=Number(f.paye||0);parV[f.vendeur].fiches++;});let html='';for(let v in parV){let vente=parV[v].vente,kom=Math.round(vente*0.10),paye=parV[v].paye,bal=vente-kom-paye;html+=`<div style="background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;margin:8px 0"><b>${v.toUpperCase()}</b> - ${parV[v].fiches} fich<br>VANN ${vente}G - KOM ${kom}G - PAYE <b style=color:#facc15>${paye}G (AUTO KORIJE)</b> - BALANS <b style=color:#22c55e>${bal}G</b></div>`;}document.getElementById('rapportResult').innerHTML=html||'Pa gen done';}
init();
</script></body></html>
