<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROPRIO V93 KONPLE</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff;padding:10px;padding-bottom:90px}
.hdr{background:#facc15;color:#000;padding:14px;border-radius:14px;display:flex;justify-content:space-between;font-weight:900}
.card{background:#1e293b;border-radius:16px;padding:16px;margin:10px 0}
.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:800;cursor:pointer}
.btnRed{background:#ef4444;color:#fff}.btnGreen{background:#22c55e;color:#fff}.btnYellow{background:#facc15;color:#000}
.tabs{position:fixed;bottom:0;left:0;width:100%;background:#020617;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:8px}
.tabBtn{background:#1e293b;color:#94a3b8;padding:12px;border-radius:10px;border:none;font-weight:800}.tabBtn.active{background:#facc15;color:#000}
.sec{display:none}.sec.active{display:block}
input,select{padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;width:100%}
</style></head><body>
<div class="hdr"><span>PROPRIO V93</span><span id="dateNow"></span></div>
<div id="secDASH" class="sec active"><div class="card"><b>📊 DASHBOARD</b><div id="dashVendeurs"></div></div></div>
<div id="secVENDEURS" class="sec"><div class="card"><b>👥 VANDÈ - ENPAK DIRÈK</b><div id="listVendeurs">Chargement...</div></div></div>
<div id="secRAPPORTS" class="sec"><div class="card"><b>📊 RAPPORTS - KORIJE PAYE</b>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="rapDu" type="date"><input id="rapAu" type="date"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px"><select id="rapVendeur"><option value="">Tout</option></select><select id="rapTiraj"><option value="">Tout</option><option>FL SOIR</option><option>NY SOIR</option></select></div>
<button onclick="genererRapportProprio()" style="background:#facc15;color:#000;padding:12px;width:100%;border:none;border-radius:10px;font-weight:900;margin-top:8px">OK RAPPORT</button><div id="rapportResult"></div></div></div>
<div id="secFICHES" class="sec"><div class="card"><div id="listFiches"></div></div></div>
<div class="tabs"><button onclick="showTab('DASH')" id="tabDASH" class="tabBtn active">DASH</button><button onclick="showTab('VENDEURS')" id="tabVENDEURS" class="tabBtn">VANDÈ</button><button onclick="showTab('RAPPORTS')" id="tabRAPPORTS" class="tabBtn">RAPÒ</button><button onclick="showTab('FICHES')" id="tabFICHES" class="tabBtn">FICHES</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getDatabase,ref,get,child,set}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};const app=initializeApp(cfg);const db=getDatabase(app);
function getDateHaiti(d=new Date()){let h=new Date(d.toLocaleString("en-US",{timeZone:"America/New_York"}));return`${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;}
function init(){document.getElementById('dateNow').innerText=getDateHaiti();document.getElementById('rapDu').value="2026-08-06";document.getElementById('rapAu').value=getDateHaiti();loadVendeurs();}
window.showTab=(t)=>{document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));document.getElementById('sec'+t).classList.add('active');document.getElementById('tab'+t).classList.add('active');}
window.bloquerVendeurImpact=async(nom,etat)=>{await set(ref(db,'vendeurs/'+nom+'/bloque'),etat);await set(ref(db,'vendeurs/'+nom+'/status'),etat?'bloque':'actif');await set(ref(db,'config/vendeursBloque/'+nom),etat);alert((etat?'BLOKE ':'DEBLOKE ')+nom+' - Vandè ap wè l');loadVendeurs();}
window.korijePayeImpact=async(vendeur,date,montant)=>{let m=parseInt(montant);await set(ref(db,'rapportsVendeurs/'+vendeur+'/'+date),{paye:m,date,korijePar:'proprio V93',timestamp:new Date().toISOString()});alert(`PAYE ${vendeur} ${date} = ${m}G`);genererRapportProprio();}
async function loadVendeurs(){let fichesSnap=await get(child(ref(db),'fiches'));let setV=new Set();if(fichesSnap.exists())Object.values(fichesSnap.val()).forEach(f=>setV.add(f.vendeur));setV.add('tamouche');let bloqueSnap=await get(child(ref(db),'config/vendeursBloque'));let bloqueMap=bloqueSnap.exists()?bloqueSnap.val():{};let sel=document.getElementById('rapVendeur');sel.innerHTML='<option value="">Tout</option>';let html='<table style=width:100%><tr><th>Vandè</th><th>Status</th><th>Aksyon</th></tr>';for(let k of setV){let bloque=bloqueMap[k]==true;sel.innerHTML+=`<option value="${k}">${k}</option>`;html+=`<tr><td><b>${k}</b></td><td>${bloque?'🚫 BLOKE':'✅ AKTIF'}</td><td>${bloque?`<button class=btn style=background:#22c55e;color:#fff onclick="bloquerVendeurImpact('${k}',false)">DEBLOKE</button>`:`<button class=btn style=background:#ef4444;color:#fff onclick="bloquerVendeurImpact('${k}',true)">BLOKE</button>`}</td></tr>`;}html+='</table>';document.getElementById('listVendeurs').innerHTML=html;}
window.genererRapportProprio=async()=>{let du=document.getElementById('rapDu').value,au=document.getElementById('rapAu').value,vF=document.getElementById('rapVendeur').value,tF=document.getElementById('rapTiraj').value;let s=await get(child(ref(db),'fiches'));if(!s.exists())return;let all=Object.values(s.val()).filter(f=>{let dH=getDateHaiti(new Date(f.date));return dH>=du&&dH<=au&&(!vF||f.vendeur==vF)&&(!tF||(f.tirajs||[]).includes(tF));});let parV={};all.forEach(f=>{if(!parV[f.vendeur])parV[f.vendeur]={vente:0,fiches:0,parTiraj:{}};parV[f.vendeur].vente+=f.total||0;parV[f.vendeur].fiches++;let nb=f.nbTiraj||f.tirajs?.length||1;let base=f.totalBase!=null?f.totalBase:Math.round((f.total||0)/nb);(f.tirajs||[]).forEach(t=>{parV[f.vendeur].parTiraj[t]=(parV[f.vendeur].parTiraj[t]||0)+base;});});let html='';for(let v in parV){let vente=parV[v].vente;let kom=Math.round(vente*0.10);let payeF=all.filter(f=>f.vendeur==v).reduce((a,b)=>a+Number(b.paye||0),0);let payeP=0;try{let snap=await get(child(ref(db),'rapportsVendeurs/'+v+'/'+du));if(snap.exists())payeP=Number(snap.val().paye||0);}catch(e){}let paye=payeP>0?payeP:payeF;let bal=vente-kom-paye;html+=`<div style="background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;margin:10px 0"><b>${v.toUpperCase()}</b> - ${parV[v].fiches} fich<br><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:8px 0;text-align:center"><div>VANN<br><b>${vente}G</b></div><div>KOM<br><b>${kom}G</b></div><div>PAYE<br><b style="color:#facc15">${paye}G ${payeP>0?'(KORIJE)':''}</b></div><div>BAL<br><b style="color:#22c55e">${bal}G</b></div></div><div style="font-size:11px;color:#94a3b8">${Object.keys(parV[v].parTiraj).map(t=>t+': '+parV[v].parTiraj[t]+'G').join(' | ')}</div><div style="display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:8px"><input id="paye-${v}-${du}" type="number" placeholder="Korije ex:16000" value="${payeP>0?payeP:''}"><button style="background:#facc15;color:#000;padding:10px;border:none;border-radius:8px;font-weight:900" onclick="korijePayeImpact('${v}','${du}',document.getElementById('paye-${v}-${du}').value)">💾 KORIJE → VANDE</button></div></div>`;}document.getElementById('rapportResult').innerHTML=html||'Pa gen done';}
init();
</script></body></html>
