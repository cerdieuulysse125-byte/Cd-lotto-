<!DOCTYPE html>
<html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proprio V22.3 FINAL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>body{font-family:Arial;padding:10px;background:#f5f5f5}.card{background:#fff;padding:12px;margin:10px 0;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}.btn{padding:10px;border:0;border-radius:8px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input{padding:10px;border:1px solid #ccc;border-radius:8px;width:100%}</style>
</head><body>
<h3>PROPRIO V22.3 - BLOKE ON/OFF + KALKIL KORIJE</h3>
<div id="listVendeur">Chargement...</div>
<div class="card"><b>4-PRIX</b><div class="grid">
<div>1er p1 <input id="p_p1" value="50"></div><div>L3 p_l3 <input id="p_l3" value="500"></div>
<div>Gratis <input id="p_gratis" value="500"></div><div>Kom <input id="p_kom" value="10"></div>
</div><button onclick="savePrixGlobal()" class="btn" style="background:#1565c0;color:#fff;width:100%;margin-top:8px">Sove Pri</button></div>

<script>
const firebaseConfig={databaseURL:"https://YOUR_PROJECT.firebaseio.com"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const MY_PROPRIO_ID=localStorage.getItem('proprioId')||'PROP001';
let DB={vendeurs:{},prix:{}};
db.ref().on('value',s=>{DB=s.val()||{};DB.vendeurs=DB.vendeurs||{};DB.prix=DB.prix||{};loadAll();});
function getMyVendeurs(){return Object.entries(DB.vendeurs||{}).map(([id,v])=>({...v,_id:id}));}
function loadAll(){
 let myV=getMyVendeurs();let html='';
 myV.forEach(v=>{
  let isBloke=v.bloke===true;let komV=DB.prix[v._id]?.kom||DB.prix.global?.kom||10;
  html+=`<div class="card" style="border-left:6px solid ${isBloke?'#c62828':'#2e7d32'};background:${isBloke?'#ffebee':'#fff'}">
  <div style="display:flex;align-items:center;gap:10px">
  <button onclick="toggleBlokeVendeur('${v._id}')" style="padding:10px 16px;border:0;border-radius:25px;font-weight:900;color:#fff;min-width:95px;background:${isBloke?'#c62828':'#2e7d32'}">${isBloke?'🔴 BLOKE':'🟢 ON'}</button>
  <b>${v.nom||v._id}</b> <small>${v.serial||''} Kom ${komV}%</small></div>
  <div class="grid" style="margin-top:8px"><input id="nom_${v._id}" value="${v.nom||''}"><input id="kom_${v._id}" value="${komV}"></div>
  <button onclick="saveV('${v._id}')" class="btn" style="background:#2e7d32;color:#fff;width:100%;margin-top:6px">Sove</button></div>`;
 });document.getElementById('listVendeur').innerHTML=html;
}
function saveV(id){let nom=document.getElementById('nom_'+id).value;let kom=document.getElementById('kom_'+id).value;db.ref().update({['vendeurs/'+id+'/nom']:nom,['vendeurs/'+id+'/kom']:+kom,['prix/'+id+'/kom']:+kom}).then(()=>alert('Sove'));}
function toggleBlokeVendeur(id){
 let v=DB.vendeurs[id];let nouvo=!v.bloke;let nomV=v.nom||id;
 if(nouvo){if(!confirm('BLOKE '+nomV+'?'))return;}else{if(!confirm('DEBLOKE '+nomV+'?'))return;}
 db.ref('vendeurs/'+id+'/bloke').set(nouvo).then(()=>{
  if(nouvo){db.ref('blokeVendeurByProprio/'+MY_PROPRIO_ID+'/'+id).set({bloke:true,nom:nomV,at:Date.now()});alert('🔴 BLOKE');}
  else{db.ref('blokeVendeurByProprio/'+MY_PROPRIO_ID+'/'+id).remove();alert('🟢 ON');}
 });
}
function savePrixGlobal(){let prix={p1:+p_p1.value,l3:+p_l3.value,gratis:+p_gratis.value,kom:+p_kom.value,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l4:5000,l5:25000};db.ref('prix/global').set(prix).then(()=>alert('Pri sove'));}

function calculGainTicket(ticket,resultsMap,prixMap){
 let total=0,detail=[];let bets=ticket.bets||[];if(!Array.isArray(bets))bets=[bets];
 let vid=ticket.vendeurId;let p=prixMap[vid]||prixMap.global||{p1:50,l3:500,gratis:500,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l4:5000,l5:25000};
 let gratisPeye=false;
 bets.forEach(b=>{
  let type=(b.type||'boul').toLowerCase();let tirage=b.tirage||ticket.tirage;let mise=+(b.mise||1);
  let res=resultsMap[tirage];if(!res)return;let num=(b.numero||'').toString().replace(/\D/g,'');
  if(num.length==2){
   if(num==res.r1){let g=mise*p.p1;total+=g;detail.push(`1er ${num} x${p.p1}=${g}`);}
   if(num==res.r2){let g=mise*p.p2;total+=g;}
   if(num==res.r3){let g=mise*p.p3;total+=g;}
  }
  if(num.length==3){
   let b23=num.slice(-2);
   if(b23==res.r1){let g=mise*p.p1;total+=g;detail.push(`Loto3 ${num} -> ${b23}=1er x${p.p1}=${g} SI SOTI`);}
   if(num==res.l3){let g=mise*p.l3;total+=g;detail.push(`Loto3 ${num}=L3 x${p.l3}=${g} SI SOTI`);}
  }
  if(type.includes('maryaj')){
   let m=num.padStart(4,'0');let m1=res.m1||'';let m1R=m1.slice(2)+m1.slice(0,2);
   if(m==m1||m==m1R){let g=mise*p.m1;total+=g;}
  }
  if(type.includes('gratis')){
   let m=num.padStart(4,'0');let m1=res.m1||'';let m1R=m1.slice(2)+m1.slice(0,2);
   if((m==m1||m==m1R)&&!gratisPeye){let g=mise*p.gratis;total+=g;gratisPeye=true;detail.push(`Gratis ${m} x${p.gratis}=${g} yon sel peye`);}
  }
 });return{total,detail};
}
</script></body></html>
