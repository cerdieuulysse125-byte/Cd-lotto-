<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROPRIO V85</title>
<style>*{box-sizing:border-box}body{background:#0f172a;color:#fff;font-family:sans-serif;margin:0;padding:10px}h1{font-size:14px;text-align:center;color:#facc15}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px;margin-bottom:10px}input,select{padding:8px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;width:100%}button{padding:8px 12px;border-radius:8px;border:none;font-weight:bold;cursor:pointer}th{color:#facc15;font-size:11px;padding:6px;text-align:left}td{padding:6px;border-top:1px solid #334155;font-size:12px}input.tirajInput{width:65px;text-align:center;font-weight:bold}</style></head>
<body>
<h1>👑 PROPRIO V85 - PÈYMAN KONPLÈ</h1>
<div class="card" style="border:2px solid #22c55e">
<div style="font-weight:bold;color:#22c55e;margin-bottom:8px">🎯 AFICHE TIRAJ - 1er 2e 3e Loto3 + EFASE</div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
<div>Dat AYITI: <input type="date" id="datTiraj" style="width:auto"></div>
<button onclick="aficheTout()" style="background:#22c55e;color:#fff;flex:1">📢 AFICHE TOUT</button>
</div>
<table><tr><th>Tiraj</th><th>1er</th><th>2e</th><th>3e</th><th>Loto3</th><th>Efase</th></tr>
<tr><td>GA MIDI</td><td><input id="GA_MIDI_1" class="tirajInput" maxlength="2"></td><td><input id="GA_MIDI_2" class="tirajInput" maxlength="2"></td><td><input id="GA_MIDI_3" class="tirajInput" maxlength="2"></td><td><input id="GA_MIDI_L3" class="tirajInput" maxlength="3" placeholder="123"></td><td><button onclick="efaseTiraj('GA MIDI')" style="background:#ef4444">❌</button></td></tr>
<tr><td>GA SOIR</td><td><input id="GA_SOIR_1" class="tirajInput" maxlength="2"></td><td><input id="GA_SOIR_2" class="tirajInput" maxlength="2"></td><td><input id="GA_SOIR_3" class="tirajInput" maxlength="2"></td><td><input id="GA_SOIR_L3" class="tirajInput" maxlength="3"></td><td><button onclick="efaseTiraj('GA SOIR')" style="background:#ef4444">❌</button></td></tr>
<tr><td>FL MIDI</td><td><input id="FL_MIDI_1" class="tirajInput" maxlength="2"></td><td><input id="FL_MIDI_2" class="tirajInput" maxlength="2"></td><td><input id="FL_MIDI_3" class="tirajInput" maxlength="2"></td><td><input id="FL_MIDI_L3" class="tirajInput" maxlength="3"></td><td><button onclick="efaseTiraj('FL MIDI')" style="background:#ef4444">❌</button></td></tr>
<tr><td>FL SOIR</td><td><input id="FL_SOIR_1" class="tirajInput" maxlength="2"></td><td><input id="FL_SOIR_2" class="tirajInput" maxlength="2"></td><td><input id="FL_SOIR_3" class="tirajInput" maxlength="2"></td><td><input id="FL_SOIR_L3" class="tirajInput" maxlength="3"></td><td><button onclick="efaseTiraj('FL SOIR')" style="background:#ef4444">❌</button></td></tr>
<tr><td>NY MIDI</td><td><input id="NY_MIDI_1" class="tirajInput" maxlength="2"></td><td><input id="NY_MIDI_2" class="tirajInput" maxlength="2"></td><td><input id="NY_MIDI_3" class="tirajInput" maxlength="2"></td><td><input id="NY_MIDI_L3" class="tirajInput" maxlength="3"></td><td><button onclick="efaseTiraj('NY MIDI')" style="background:#ef4444">❌</button></td></tr>
<tr><td>NY SOIR</td><td><input id="NY_SOIR_1" class="tirajInput" maxlength="2"></td><td><input id="NY_SOIR_2" class="tirajInput" maxlength="2"></td><td><input id="NY_SOIR_3" class="tirajInput" maxlength="2"></td><td><input id="NY_SOIR_L3" class="tirajInput" maxlength="3"></td><td><button onclick="efaseTiraj('NY SOIR')" style="background:#ef4444">❌</button></td></tr>
</table>
<div id="msgAfiche" style="margin-top:8px;font-size:12px"></div>
<div style="margin-top:8px;font-size:10px;background:#0f172a;padding:6px;border-radius:6px">💰 Pèyman: Bolet 1er 50x 2e 20x 3e 10x | Maryaj 1000x | Loto3 500x | Loto4(2e+3e) 5000x | Loto5(Loto3+2e) 25000x</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};const app=initializeApp(cfg);const db=getDatabase(app);
function getHaitiDateStr(){let d=new Date();let h=new Date(d.toLocaleString("en-US",{timeZone:"America/Port-au-Prince"}));return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;}
document.getElementById('datTiraj').value=getHaitiDateStr();
window.aficheTout=async()=>{let dat=document.getElementById('datTiraj').value;if(!dat)return alert('Chwazi dat');let tirajs=['GA MIDI','GA SOIR','FL MIDI','FL SOIR','NY MIDI','NY SOIR'];let c=0;for(let t of tirajs){let k=t.replace(' ','_');let p1=document.getElementById(`${k}_1`).value.trim();let p2=document.getElementById(`${k}_2`).value.trim();let p3=document.getElementById(`${k}_3`).value.trim();let l3=document.getElementById(`${k}_L3`).value.trim();if(p1||p2||p3||l3){await set(ref(db,`resultats/${dat}_${t}`),{date:dat,tiraj:t,premier:p1,deuxieme:p2,troisieme:p3,loto3:l3,haitiDate:dat});await set(ref(db,`resultats/${dat}_${k}`),{date:dat,tiraj:t,premier:p1,deuxieme:p2,troisieme:p3,loto3:l3,haitiDate:dat});c++;}}document.getElementById('msgAfiche').innerHTML=`<span style="color:#22c55e">✅ ${c} tiraj afiche ak Loto3!</span>`;loadExisting();};
async function loadExisting(){let dat=document.getElementById('datTiraj').value;for(let t of ['GA MIDI','GA SOIR','FL MIDI','FL SOIR','NY MIDI','NY SOIR']){let k=t.replace(' ','_');let snap=await get(child(ref(db),`resultats/${dat}_${t}`));if(!snap.exists())snap=await get(child(ref(db),`resultats/${dat}_${k}`));if(snap.exists()){let v=snap.val();document.getElementById(`${k}_1`).value=v.premier||'';document.getElementById(`${k}_2`).value=v.deuxieme||'';document.getElementById(`${k}_3`).value=v.troisieme||'';document.getElementById(`${k}_L3`).value=v.loto3||'';}}}
window.efaseTiraj=async(t)=>{let dat=document.getElementById('datTiraj').value;if(!confirm(`Efase ${t}?`))return;let k=t.replace(' ','_');await remove(ref(db,`resultats/${dat}_${t}`));await remove(ref(db,`resultats/${dat}_${k}`));document.getElementById(`${k}_1`).value='';document.getElementById(`${k}_2`).value='';document.getElementById(`${k}_3`).value='';document.getElementById(`${k}_L3`).value='';document.getElementById('msgAfiche').innerHTML=`<span style="color:#ef4444">🗑️ ${t} efase</span>`;};
document.getElementById('datTiraj').addEventListener('change',loadExisting);loadExisting();
</script></body></html>
