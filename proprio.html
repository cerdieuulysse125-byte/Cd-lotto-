<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PROPRIO V25.5 SUPER - ANTET SYNC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box} body{font-family:Arial;background:#f1f6f0;margin:0}
header{background:#144a28;color:#fff;padding:10px;display:flex;justify-content:space-between;position:sticky;top:0}
.tab{display:flex;background:#1a4c2e;overflow:auto} .tab button{background:transparent;color:#fff;border:none;padding:12px 14px;font-weight:800;cursor:pointer;border-bottom:4px solid transparent} .tab button.active{border-bottom:4px solid #ffcc00;background:#2d6a46}
.panel{display:none;padding:14px} .panel.active{display:block}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px}
.input{width:100%;padding:10px;border:2px solid #ccc;border-radius:8px;margin:6px 0}
.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:800;cursor:pointer} .btn-green{background:#0a8a3a;color:#fff}
.logo-preview{width:120px;height:120px;border:2px dashed #0a8a3a;border-radius:50%;object-fit:cover;display:block;margin:auto}
</style>
</head>
<body>
<header><div><b>⭐ VERITE LOTTO - SUPER V25.5</b><br><small>Antet+Logo+Tiraj Pa Proprio</small></div><div id="clock"></div></header>
<div class="tab">
<button onclick="openTab('t4',this)" class="active">e) Antet + Logo - Sync Otomatik</button>
</div>

<div id="t4" class="panel active">
<div class="card">
<h3>⭐ E) Antet + Logo - Pa Proprio - Sync Otomatik</h3>
<label>1- Chwazi Proprio *</label>
<select id="selectProprio" class="input" onchange="onProprioChange()"></select>
<div style="text-align:center">
<p>Logo pou: <b id="logoPour">-</b></p>
<img id="logoPreview" class="logo-preview" src="https://via.placeholder.com/120?text=LOGO"/>
<p style="font-size:12px">Logo 20mm centre - Sync otomatik sou nepot terminal + Sunmi V2 Pro</p>
</div>
<label>2- Chwazi Logo (JPG/PNG)</label>
<input type="file" id="fileLogo" accept="image/*" class="input">
<label>Antet Magazen *</label>
<input id="antetMagazen" class="input" placeholder="C&D VERITE LOTTO - UNIDAD MODEL" oninput="onAntetInput()">
<label>Tel Proprio</label>
<input id="telProprio" class="input">
<label>Non Biznis sou Tikè (sa ki parèt anlè tikè a) - SYNC OTOMATIK</label>
<input id="businessName" class="input" placeholder="Ex: DS VERITE LOTTO">
<div style="background:#e8f5e9;padding:10px;border-radius:8px">Preview Tikè: <b id="previewBiz">C&D VERITE LOTTO</b><br><small>Logo 20mm SANTRE + Mèsi pou konfyans ou</small></div>
<button class="btn btn-green" style="width:100%;padding:14px;margin-top:10px" onclick="saveAntetLogo()">💾 SAVE ANTÈT + LOGO POU PROPRIO SA - SYNC OTOMATIK NAN TOUT VANDÈ</button>
<div id="listLogos"></div>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "cd-verite-lotto.firebaseapp.com",
  databaseURL: "https://cd-verite-lotto-default-rtdb.firebaseio.com",
  projectId: "cd-verite-lotto",
  storageBucket: "cd-verite-lotto.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const fs = firebase.firestore();
let tempLogoBase64=null, proprietaires={};
setInterval(()=>document.getElementById('clock').innerText=new Date().toLocaleString(),1000);
function openTab(id,btn){ document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.tab button').forEach(b=>b.classList.remove('active')); if(btn)btn.classList.add('active'); }
function loadProprioList(){
 fs.collection("proprio").onSnapshot(snap=>{
   let sel=document.getElementById('selectProprio'); sel.innerHTML='<option value="">-- Chwazi Proprio --</option>';
   snap.forEach(doc=>{ proprietaires[doc.id]=doc.data(); let opt=document.createElement('option'); opt.value=doc.id; opt.textContent=doc.data().nom||doc.id; sel.appendChild(opt); });
   fs.collection("businesses").get().then(s2=>{ s2.forEach(doc=>{ if(!proprietaires[doc.id]){ let opt=document.createElement('option'); opt.value=doc.id; opt.textContent=doc.data().businessName||doc.id; sel.appendChild(opt); } }); });
 });
}
loadProprioList();
function onProprioChange(){
 let pid=document.getElementById('selectProprio').value; if(!pid) return;
 document.getElementById('logoPour').innerText=pid;
 fs.collection("businesses").doc(pid).get().then(doc=>{
   if(doc.exists){
     let d=doc.data();
     document.getElementById('antetMagazen').value=d.antetMagazen||d.businessName||'';
     document.getElementById('businessName').value=d.businessName||'';
     document.getElementById('telProprio').value=d.telProprio||'';
     document.getElementById('previewBiz').innerText=d.businessName||'';
     if(d.logoBase64){ document.getElementById('logoPreview').src=d.logoBase64; tempLogoBase64=d.logoBase64; }
   }
 });
}
function onAntetInput(){ let v=document.getElementById('antetMagazen').value; document.getElementById('businessName').value=v; document.getElementById('previewBiz').innerText=v; }
document.getElementById('fileLogo').addEventListener('change', e=>{
 let file=e.target.files[0]; if(!file) return;
 let reader=new FileReader(); reader.onload=ev=>{
   let img=new Image(); img.onload=()=>{
     let canvas=document.createElement('canvas'); let MAX=400; let w=img.width,h=img.height;
     if(w>MAX){ h*=MAX/w; w=MAX; } canvas.width=w; canvas.height=h;
     canvas.getContext('2d').drawImage(img,0,0,w,h);
     tempLogoBase64=canvas.toDataURL('image/png');
     document.getElementById('logoPreview').src=tempLogoBase64;
   }; img.src=ev.target.result;
 }; reader.readAsDataURL(file);
});
function saveAntetLogo(){
 let pid=document.getElementById('selectProprio').value;
 let antet=document.getElementById('antetMagazen').value.trim();
 let biz=document.getElementById('businessName').value.trim()||antet;
 let tel=document.getElementById('telProprio').value.trim();
 if(!pid||!antet){ alert('Chwazi Proprio ak Antet'); return; }
 let bizUpper=biz.toUpperCase();
 fs.collection("businesses").doc(pid).set({
   businessName:bizUpper, antetMagazen:antet, telProprio:tel,
   logoBase64:tempLogoBase64||'', footerMessage:'Mèsi pou konfyans ou',
   updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
   updatedBy:'super-admin', proprioId:pid
 },{merge:true}).then(()=>{
   db.ref("vendeurs").orderByChild("proprioId").equalTo(pid).once('value').then(snap=>{
     let updates={};
     snap.forEach(child=>{
       updates["vendeurs/"+child.key+"/businessName"]=bizUpper;
       updates["vendeurs/"+child.key+"/antetMagazen"]=antet;
       updates["vendeurs/"+child.key+"/logoBase64"]=tempLogoBase64||'';
       updates["vendeurs/"+child.key+"/footerMessage"]="Mèsi pou konfyans ou";
       updates["vendeurs/"+child.key+"/lastSync"]=new Date().toISOString();
     });
     if(Object.keys(updates).length>0) db.ref().update(updates);
     alert("✅ SAVE REYISI! "+bizUpper+" ap SYNC nan tout vandè "+pid+" nan 2 segonn");
   });
 });
}
</script>
</body>
</html>
