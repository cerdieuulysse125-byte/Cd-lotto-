<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROPRIO V80.3 FIX 05</title>
<style>*{box-sizing:border-box}body{background:#0f172a;color:#fff;font-family:sans-serif;margin:0;padding:8px}h1{color:#facc15;text-align:center;margin:4px 0;font-size:18px}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:10px;margin-bottom:8px}input,select{padding:6px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:12px}button{background:#facc15;color:#000;border:none;padding:6px 10px;border-radius:6px;font-weight:bold;font-size:12px;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#0f172a;color:#facc15;padding:5px}td{padding:5px;border-bottom:1px solid #334155}.switch{position:relative;display:inline-block;width:50px;height:24px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ef4444;border-radius:24px;transition:.3s}.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s}input:checked+.slider{background:#22c55e}input:checked+.slider:before{transform:translateX(26px)}@media print{body *{visibility:hidden}#printRap,#printRap *{visibility:visible}#printRap{position:absolute;left:0;top:0;width:100%;background:#fff;color:#000;padding:10px}}</style></head>
<body>
<script>
let DEF="C&D123";let cur=localStorage.getItem("ppass")||DEF;
function chk(){if(sessionStorage.getItem("pauth")===cur) return true;let p=prompt("🔐 Modpas:");if(p===cur){sessionStorage.setItem("pauth",cur);return true;} if(p===null) return false; alert("⛔ Pa bon"); return chk();} chk();
// FIX DAT AYITI 100% - FÒSE UTC-5
function getHaitiDate(){
let now=new Date();
let utc=now.getTime()+(now.getTimezoneOffset()*60000);
let haiti=new Date(utc+(-5*3600000));
return haiti.toISOString().split('T')[0];
}
</script>
<h1>👑 C&D PROPRIO V80.3 - DAT AYITI 05/08</h1>

<div class="card">
<b>📊 RAPPORT Du Au Vendeur Tirage - Dat Ayiti: <span id="haitiNow" style="color:#facc15"></span></b>
<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">
<div><label style="font-size:10px">Du:</label><input type="date" id="dateDu"></div>
<div><label style="font-size:10px">Au:</label><input type="date" id="dateAu"></div>
<div><label style="font-size:10px">Vendeur:</label><select id="fVendeur"><option value="all">Tous</option></select></div>
<div><label style="font-size:10px">Tirage:</label><select id="fTirage"><option value="all">Tous</option><option>GA MIDI</option><option>GA SOIR</option><option>FL MIDI</option><option>FL SOIR</option><option>NY MIDI</option><option>NY SOIR</option></select></div>
<button onclick="loadRapò()">🔍 OK</button>
<button onclick="imprimeRapport()" style="background:#fff">🖨️ Imprimer</button>
<button onclick="efaseRapport()" style="background:#ef4444;color:#fff">🗑️ Efase</button>
</div>
<div style="display:flex;gap:4px;margin-top:8px"><div style="flex:1;background:#0f172a;padding:6px;border-radius:6px;text-align:center"><div style="font-size:9px">VENTE</div><b id="tVente">0G</b></div><div style="flex:1;background:#0f172a;padding:6px;border-radius:6px;text-align:center"><div style="font-size:9px">COM</div><b id="tCom" style="color:#facc15">0G</b></div><div style="flex:1;background:#0f172a;padding:6px;border-radius:6px;text-align:center"><div style="font-size:9px">PAYÉ</div><b id="tPaye" style="color:#22c55e">0G</b></div><div style="flex:1;background:#0f172a;padding:6px;border-radius:6px;text-align:center"><div style="font-size:9px">BALANCE</div><b id="tBal" style="color:#ef4444">0G</b></div></div>
</div>
<div class="card" id="printRap"><table><thead><tr><th>Vendeur</th><th>Vente</th><th>Com</th><th>Payé/Gain</th><th>Balance</th><th>Fich</th></tr></thead><tbody id="tbody"></tbody></table><div id="detailFiches" style="margin-top:10px;font-size:11px"></div></div>

<div class="card" style="border:2px solid #22c55e">
<b>🎯 AFICHE TIRAJ - KORIGE</b>
<div style="display:flex;gap:4px;margin-top:6px">
<div><label style="font-size:10px">Dat tiraj AYITI:</label><input type="date" id="resDate"></div>
<button onclick="aficheToutTiraj()" style="flex:1;background:#22c55e;color:#fff;padding:8px">📢 AFICHE TOUT</button>
</div>
<table style="margin-top:8px"><thead><tr><th>Tiraj</th><th>1er</th><th>2e</th><th>3e</th></tr></thead>
<tbody>
<tr><td>GA MIDI</td><td><input id="GA_MIDI_1" style="width:55px"></td><td><input id="GA_MIDI_2" style="width:55px"></td><td><input id="GA_MIDI_3" style="width:55px"></td></tr>
<tr><td>GA SOIR</td><td><input id="GA_SOIR_1" style="width:55px"></td><td><input id="GA_SOIR_2" style="width:55px"></td><td><input id="GA_SOIR_3" style="width:55px"></td></tr>
<tr><td>FL MIDI</td><td><input id="FL_MIDI_1" style="width:55px"></td><td><input id="FL_MIDI_2" style="width:55px"></td><td><input id="FL_MIDI_3" style="width:55px"></td></tr>
<tr><td>FL SOIR</td><td><input id="FL_SOIR_1" style="width:55px"></td><td><input id="FL_SOIR_2" style="width:55px"></td><td><input id="FL_SOIR_3" style="width:55px"></td></tr>
<tr><td>NY MIDI</td><td><input id="NY_MIDI_1" style="width:55px"></td><td><input id="NY_MIDI_2" style="width:55px"></td><td><input id="NY_MIDI_3" style="width:55px"></td></tr>
<tr><td>NY SOIR</td><td><input id="NY_SOIR_1" style="width:55px"></td><td><input id="NY_SOIR_2" style="width:55px"></td><td><input id="NY_SOIR_3" style="width:55px"></td></tr>
</tbody></table>
<div id="listResultats" style="margin-top:8px;font-size:11px;background:#0f172a;padding:6px;border-radius:6px"></div>
</div>

<div class="card" style="border:2px solid #facc15">
<b>👥 VENDEURS</b>
<div style="display:flex;gap:4px;margin-top:8px"><input id="newVendeur" placeholder="vendeur1" style="flex:1"><button onclick="ajouterVendeur()" style="background:#22c55e;color:#fff">➕ Ajouter</button></div>
<div id="listVendeurs" style="margin-top:10px"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set, update, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};const app=initializeApp(cfg);const db=getDatabase(app);
window.db=db;window.ref=ref;window.get=get;window.child=child;window.set=set;window.update=update;window.remove=remove;
function getHaitiDate(){let now=new Date();let utc=now.getTime()+(now.getTimezoneOffset()*60000);let haiti=new Date(utc+(-5*3600000));return haiti.toISOString().split('T')[0];}
window.getHaitiDate=getHaitiDate;
async function loadConfig(){let s=await get(child(ref(db),'config')); if(!s.exists()){await set(ref(db,'config/vendeurs'),{vendeur1:'ouvert'});return;}let c=s.val();if(c.vendeurs){renderVendeurs(c.vendeurs);}}
function renderVendeurs(vs){let div=document.getElementById('listVendeurs'); div.innerHTML='';Object.keys(vs).forEach((v)=>{let ouvert=vs[v]==='ouvert';div.innerHTML+=`<div style="display:flex;justify-content:space-between;background:#0f172a;padding:8px;border-radius:8px;margin:4px 0"><b>${v}</b><span style="color:${ouvert?'#22c55e':'#ef4444'}">${ouvert?'OUVERT':'FERMÉ'}</span><label class="switch"><input type="checkbox" ${ouvert?'checked':''} onchange="toggleV('${v}',this.checked)"><span class="slider"></span></label></div>`;});}
window.toggleV=async(v,o)=>{await update(ref(db,'config/vendeurs'),{[v]:o?'ouvert':'ferme'});let s=await get(child(ref(db),'config/vendeurs'));renderVendeurs(s.val());};
window.ajouterVendeur=async()=>{let n=document.getElementById('newVendeur').value.trim().toLowerCase().replace(/\s+/g,''); if(!n) return; await update(ref(db,'config/vendeurs'),{[n]:'ouvert'});document.getElementById('newVendeur').value='';loadConfig();};
window.aficheToutTiraj=async()=>{let d=document.getElementById('resDate').value; if(!d){alert('Mete Dat');return;}let tirajs=['GA MIDI','GA SOIR','FL MIDI','FL SOIR','NY MIDI','NY SOIR'];let keys=['GA_MIDI','GA_SOIR','FL_MIDI','FL_SOIR','NY_MIDI','NY_SOIR'];let count=0;for(let i=0;i<keys.length;i++){let r1=document.getElementById(keys[i]+'_1').value.trim();if(r1){let r2=document.getElementById(keys[i]+'_2').value.trim();let r3=document.getElementById(keys[i]+'_3').value.trim();await set(ref(db,`resultats/${d}_${keys[i]}`),{date:d,tirage:tirajs[i],premier:r1,deuxieme:r2,troisieme:r3});await set(ref(db,`resultats/${d}_${tirajs[i]}`),{date:d,tirage:tirajs[i],premier:r1,deuxieme:r2,troisieme:r3});count++;}}alert(`✅ ${count} tiraj afiche pou ${d}`); loadResultats(); loadRapò();};
async function loadResultats(){let s=await get(child(ref(db),'resultats')); let div=document.getElementById('listResultats'); if(!s.exists()){div.innerHTML='Pa gen';return;} let all=Object.values(s.val()); div.innerHTML=all.slice(-12).reverse().map(r=>`${r.date} ${r.tirage}: ${r.premier}-${r.deuxieme}-${r.troisieme}`).join('<br>');}
window.loadRapò=async()=>{
let du=document.getElementById('dateDu').value;let au=document.getElementById('dateAu').value;let fv=document.getElementById('fVendeur').value;let ft=document.getElementById('fTirage').value;
let snap=await get(child(ref(db),'fiches'));let tb=document.getElementById('tbody');let detail=document.getElementById('detailFiches');
let resSnap=await get(child(ref(db),'resultats'));let res=resSnap.exists()?resSnap.val():{};
let vendConf=await get(child(ref(db),'config/vendeurs'));let allVendeurs=vendConf.exists()?Object.keys(vendConf.val()):[];let sel=document.getElementById('fVendeur');sel.innerHTML='<option value="all">Tous</option>';allVendeurs.forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});
if(!snap.exists()){tb.innerHTML='<tr><td colspan=6>Pa gen fich</td></tr>';return;}
let all=Object.values(snap.val());
let filt=all.filter(f=>{let fd=f.haitiDate||f.date.split('T')[0];if(du&&fd!==du && fd<du) {if(du!==au) {if(fd<du||fd>au) return false;}} if(du&&au&&fd<du) return false; if(au&&fd>au) return false; if(fv!=='all'&&(f.vendeur||f.idVendeur)!==fv) return false; if(ft!=='all'&&!(f.tirajs||[]).includes(ft)) return false; return true;});
let par={}; filt.forEach(f=>{let v=f.vendeur||f.idVendeur;if(!par[v]) par[v]={vente:0,gain:0,fiches:[]};par[v].vente+=parseInt(f.total||0);par[v].fiches.push(f);});
Object.keys(par).forEach(v=>{let gain=0;par[v].fiches.forEach(f=>{let fd=f.haitiDate||f.date.split('T')[0];(f.tirajs||[]).forEach(t=>{let r=res[fd+'_'+t.replace(' ','_')]||res[fd+'_'+t];if(!r) return;(f.details||[]).forEach(d=>{if(d.boul===r.premier) gain+=d.montan*50; else if(d.boul===r.deuxieme) gain+=d.montan*20; else if(d.boul===r.troisieme) gain+=d.montan*10;});});});par[v].gain=gain;});
tb.innerHTML='';let tv=0,tc=0,tp=0,tb2=0;Object.keys(par).forEach(v=>{let vente=par[v].vente;let com=Math.round(vente*0.1);let gain=par[v].gain;let bal=vente-com-gain;tv+=vente;tc+=com;tp+=gain;tb2+=bal;tb.innerHTML+=`<tr><td><b>${v}</b></td><td>${vente}G</td><td>${com}G</td><td style="color:#22c55e">${gain}G</td><td>${bal}G</td><td>${par[v].fiches.length}</td></tr>`;});document.getElementById('tVente').innerText=tv+'G';document.getElementById('tCom').innerText=tc+'G';document.getElementById('tPaye').innerText=tp+'G';document.getElementById('tBal').innerText=tb2+'G';detail.innerHTML=filt.slice(-15).map(f=>{let fd=f.haitiDate||f.date.split('T')[0];let g=0;(f.tirajs||[]).forEach(t=>{let r=res[fd+'_'+t.replace(' ','_')]||res[fd+'_'+t];if(r){(f.details||[]).forEach(dd=>{if(dd.boul===r.premier) g+=dd.montan*50;});}});return `${f.shortId||f.id.slice(-4)} ${fd} ${f.vendeur} ${f.total}G ${g>0?'✅'+g+'G':'❌'}`;}).join('<br>');}
window.imprimeRapport=()=>window.print();
window.efaseRapport=async()=>{let du=document.getElementById('dateDu').value;if(!confirm('Efase fich '+du+'?')) return;let snap=await get(child(ref(db),'fiches'));let all=snap.val();let toDel=[];Object.keys(all).forEach(k=>{let fd=all[k].haitiDate||all[k].date.split('T')[0];if(fd===du) toDel.push(k);});for(let k of toDel){await remove(ref(db,'fiches/'+k));}alert(toDel.length+' efase'); loadRapò();};
window.onload=async()=>{let t=getHaitiDate();document.getElementById('haitiNow').innerText=t;document.getElementById('dateDu').value=t;document.getElementById('dateAu').value=t;document.getElementById('resDate').value=t;await loadConfig();await loadRapò();await loadResultats();};
</script></body></html>
