<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROPRIO V74 ULTIMATE</title>
<style>*{box-sizing:border-box}body{background:#0f172a;color:#fff;font-family:sans-serif;margin:0;padding:8px}h1{color:#facc15;text-align:center;margin:4px 0;font-size:20px}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:8px;margin-bottom:8px}input,select{padding:6px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:12px}button{background:#facc15;color:#000;border:none;padding:6px 10px;border-radius:6px;font-weight:bold;font-size:12px}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#0f172a;color:#facc15;padding:5px}td{padding:5px;border-bottom:1px solid #334155}</style></head>
<body>
<script>let DEF="C&D123";let cur=localStorage.getItem("ppass")||DEF;function chk(){if(sessionStorage.getItem("pauth")===cur) return;let p=prompt("Modpas Proprio:");if(p!==cur){document.body.innerHTML="<h1>⛔ Refize</h1>";throw "no";}sessionStorage.setItem("pauth",cur);}chk();</script>
<h1>👑 C&D PROPRIO V74</h1>
<div class="card">
<b>📊 RAPPORT - Du Au + Vendeur + Tirage</b>
<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">
<div><label style="font-size:10px">Du:</label><input type="date" id="dateDu"></div>
<div><label style="font-size:10px">Au:</label><input type="date" id="dateAu"></div>
<div><label style="font-size:10px">Vendeur:</label><select id="fVendeur"><option value="all">Tout</option></select></div>
<div><label style="font-size:10px">Tirage:</label><select id="fTirage"><option value="all">Tout Tirage</option><option>GA AM</option><option>GA PM</option><option>FL AM</option><option>FL PM</option><option>NY AM</option><option>NY PM</option></select></div>
<button onclick="loadRapò()">🔍 OK</button>
</div>
<div style="display:flex;gap:4px;margin-top:8px"><div style="flex:1;background:#0f172a;padding:6px;border-radius:6px;text-align:center"><div style="font-size:9px">VENTE</div><b id="tVente">0G</b></div><div style="flex:1;background:#0f172a;padding:6px;border-radius:6px;text-align:center"><div style="font-size:9px">COMMISSION</div><b id="tCom" style="color:#facc15">0G</b></div><div style="flex:1;background:#0f172a;padding:6px;border-radius:6px;text-align:center"><div style="font-size:9px">PAYÉ</div><b id="tPaye" style="color:#22c55e">0G</b></div><div style="flex:1;background:#0f172a;padding:6px;border-radius:6px;text-align:center"><div style="font-size:9px">BALANCE</div><b id="tBal" style="color:#ef4444">0G</b></div></div>
</div>

<div class="card">
<table><thead><tr><th>Vendeur</th><th>Vente</th><th>Com</th><th>Payé</th><th>Balance</th><th></th></tr></thead><tbody id="tbody"></tbody></table>
</div>

<div class="card">
<b>⚙️ KONTWÒL PROPRIO</b>
<div style="margin-top:6px"><label>Ouvert/Fermé Vendeurs:</label><div id="listVendeurs" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px"></div></div>
<div style="margin-top:8px"><label>⏰ Lè Fermeture modifiable (EST):</label>
<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">
<div>GA AM<input id="fGAAM" type="time" value="12:15"></div><div>GA PM<input id="fGAPM" type="time" value="18:15"></div><div>FL AM<input id="fFLAM" type="time" value="13:15"></div><div>FL PM<input id="fFLPM" type="time" value="21:15"></div><div>NY AM<input id="fNYAM" type="time" value="14:15"></div><div>NY PM<input id="fNYPM" type="time" value="21:30"></div>
</div><button onclick="saveFerm()" style="margin-top:4px">💾 Save Lè</button></div>
<div style="margin-top:8px"><label>💰 Paiement Jeux modifiable:</label>
<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">
<div>Bolet<input id="pBolet" value="50/20/10" style="width:90px"></div><div>Loto3<input id="pLoto3" value="500" style="width:60px"></div><div>Loto4<input id="pLoto4" value="5000" style="width:60px"></div><div>Loto5<input id="pLoto5" value="25000" style="width:70px"></div>
</div><button onclick="savePay()" style="margin-top:4px">💾 Save Paiement</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};const app=initializeApp(cfg);const db=getDatabase(app);window.db=db;window.ref=ref;window.get=get;window.child=child;window.set=set;window.update=update;
window.onload=()=>{let t=new Date().toISOString().split('T')[0];document.getElementById('dateDu').value=t;document.getElementById('dateAu').value=t;loadConfig();loadRapò();};
async function loadConfig(){
let s=await get(child(ref(db),'config'));if(!s.exists()) return;let c=s.val();
if(c.fermeture){document.getElementById('fGAAM').value=c.fermeture['GA AM']||'12:15';document.getElementById('fGAPM').value=c.fermeture['GA PM']||'18:15';document.getElementById('fFLAM').value=c.fermeture['FL AM']||'13:15';document.getElementById('fFLPM').value=c.fermeture['FL PM']||'21:15';document.getElementById('fNYAM').value=c.fermeture['NY AM']||'14:15';document.getElementById('fNYPM').value=c.fermeture['NY PM']||'21:30';}
if(c.paiements){document.getElementById('pBolet').value=c.paiements.bolet||'50/20/10';document.getElementById('pLoto3').value=c.paiements.loto3||'500';}
if(c.vendeurs){renderVendeursCtrl(c.vendeurs);}
}
function renderVendeursCtrl(vs){let d=document.getElementById('listVendeurs');d.innerHTML='';Object.keys(vs).forEach(v=>{d.innerHTML+=`<label style="background:#0f172a;padding:4px 8px;border-radius:15px;font-size:11px"><input type="checkbox" ${vs[v]==='ouvert'?'checked':''} onchange="toggleV('${v}',this.checked)"> ${v} ${vs[v]==='ouvert'?'🟢':'🔴'}</label>`;});}
window.toggleV=async(v,ouvert)=>{await update(ref(db,`config/vendeurs`),{[v]:ouvert?'ouvert':'ferme'});};
window.saveFerm=async()=>{await set(ref(db,'config/fermeture'),{'GA AM':document.getElementById('fGAAM').value,'GA PM':document.getElementById('fGAPM').value,'FL AM':document.getElementById('fFLAM').value,'FL PM':document.getElementById('fFLPM').value,'NY AM':document.getElementById('fNYAM').value,'NY PM':document.getElementById('fNYPM').value});alert('✅ Lè sove');};
window.savePay=async()=>{await set(ref(db,'config/paiements'),{bolet:document.getElementById('pBolet').value,loto3:document.getElementById('pLoto3').value,loto4:document.getElementById('pLoto4').value,loto5:document.getElementById('pLoto5').value});alert('✅ Paiement sove');};
</script>
<script>
async function loadRapò(){
let du=document.getElementById('dateDu').value;let au=document.getElementById('dateAu').value;let fv=document.getElementById('fVendeur').value;let ft=document.getElementById('fTirage').value;
let snap=await get(child(ref(db),'fiches'));let tb=document.getElementById('tbody');if(!snap.exists()){tb.innerHTML='<tr><td>Pa gen fich</td></tr>';return;}
let all=Object.values(snap.val());
let paySnap=await get(child(ref(db),'paiements'));let pays=paySnap.exists()?paySnap.val():{};
let vendSet=new Set(all.map(f=>f.vendeur||f.idVendeur));let sel=document.getElementById('fVendeur');if(sel.options.length<=1){vendSet.forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});}
let filt=all.filter(f=>{let fd=f.date.split('T')[0];if(du&&fd<du) return false;if(au&&fd>au) return false;if(fv!=='all'&&(f.vendeur||f.idVendeur)!==fv) return false;if(ft!=='all'&&!(f.tirajs||[f.tiraj]).join(',').includes(ft)) return false;return true;});
let par={};filt.forEach(f=>{let v=f.vendeur||f.idVendeur;if(!par[v]) par[v]={vente:0};par[v].vente+=parseInt(f.total||0);});
tb.innerHTML='';let tv=0,tc=0,tp=0,tb2=0;
Object.keys(par).forEach(v=>{
let vente=par[v].vente;let com=Math.round(vente*0.1);
let paye=0;Object.keys(pays).forEach(k=>{if(k.startsWith(v)) paye+=parseInt(pays[k].montant||0);});
let bal=vente-com-paye;tv+=vente;tc+=com;tp+=paye;tb2+=bal;
tb.innerHTML+=`<tr><td>${v}</td><td>${vente}G</td><td style="color:#facc15">${com}G</td><td><input id="pay_${v}" type="number" value="${paye}" style="width:60px" onchange="saveP('${v}')">G</td><td style="color:${bal>=0?'#22c55e':'#ef4444'}">${bal}G</td><td><button onclick="saveP('${v}')" style="padding:3px 6px;font-size:10px">💾</button></td></tr>`;
});
document.getElementById('tVente').innerText=tv+'G';document.getElementById('tCom').innerText=tc+'G';document.getElementById('tPaye').innerText=tp+'G';document.getElementById('tBal').innerText=tb2+'G';
// list vendeur ctrl
let listCtrl=document.getElementById('listVendeurs');if(listCtrl.innerHTML===''){let html='';vendSet.forEach(v=>{html+=`<label style="background:#0f172a;padding:4px 8px;border-radius:15px;font-size:11px"><input type="checkbox" checked onchange="toggleV('${v}',this.checked)"> ${v} 🟢</label>`;});listCtrl.innerHTML=html;}
}
async function saveP(v){let du=document.getElementById('dateDu').value;let au=document.getElementById('dateAu').value;let m=parseInt(document.getElementById('pay_'+v).value)||0;await set(ref(db,`paiements/${v}_${du}_${au}`),{vendeur:v,montant:m,dateDu:du,dateAu:au});alert('Payé sove');loadRapò();}
window.loadRapò=loadRapò;window.saveP=saveP;
</script></body></html>
