<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f5f5f7}.top{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;border-bottom:1px solid #eee}.menuBtn{font-size:26px;background:0;border:0;cursor:pointer}.drawer{position:fixed;top:0;left:-280px;width:270px;height:100%;background:#fff;z-index:200;transition:.25s;box-shadow:3px 0 12px rgba(0,0,0,.3);overflow:auto}.drawer.open{left:0}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:150}.overlay.show{display:block}.drawerHead{background:#4a148c;color:#fff;padding:14px;text-align:center}.drawerItem{padding:14px 16px;border-bottom:1px solid #eee;cursor:pointer;font-weight:700;font-size:12px}.drawerItem.active{background:#f3e5f5;color:#4a148c;border-left:4px solid #4a148c}.panel{display:none;padding:12px;max-width:1100px;margin:auto}.panel.active{display:block}.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:10px}.btn{padding:12px;border:0;border-radius:10px;color:#fff;font-weight:800;width:100%;margin-top:8px;cursor:pointer}.btnP{background:#4a148c}.btnR{background:#c62828}.btnG{background:#2e7d32}input,select{padding:11px;border:1.5px solid #ddd;border-radius:10px;width:100%;margin:5px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}@media(max-width:700px){.grid2,.grid3,.grid5{grid-template-columns:1fr 1fr}}
.tabsMini{display:flex;background:#fff;border-radius:10px;overflow:hidden;border:2px solid #4a148c;margin-bottom:10px}.tabsMini div{flex:1;padding:10px;text-align:center;cursor:pointer;font-weight:800;font-size:11px}.tabsMini div.active{background:#4a148c;color:#fff}
.akeyHeader{text-align:center;padding:12px 0}.akeyHeader h1{font-size:26px;font-weight:900}.akeyHeader small{color:#6b7280}
.lottoCard{background:#fff;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.lottoLogo{width:72px;height:72px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #eee;font-weight:900;font-size:10px;text-align:center}
.pills{display:flex;gap:8px;margin:4px 0;flex-wrap:wrap}.pill{padding:6px 12px;border-radius:10px;font-weight:800;color:#fff;font-size:14px;min-width:42px;text-align:center}
.pill-blue{background:#3b82f6}.pill-orange{background:#f97316}.pill-lightblue{background:#93c5fd;color:#1e40af}.pill-teal{background:#0d9488}.pill-pink{background:#f9a8d4;color:#9d174d}.pill-green{background:#22c55e}.pill-yellow{background:#facc15;color:#000}.pill-darkblue{background:#1d4ed8}.pill-lightgreen{background:#86efac;color:#166534}
.midi{color:#6b7280;font-size:12px}.midi b{color:#111}
table{width:100%;border-collapse:collapse;font-size:11px}th{background:#4a148c;color:#fff;padding:7px}td{padding:7px;border-bottom:1px solid #eee;text-align:center}
</style></head><body>
<div class='top'><button class='menuBtn' onclick='toggleMenu()'>☰</button><b id='topTitle'>Lottery Results</b><span id='syncInfo' style='font-size:10px;background:#f3e5f5;color:#4a148c;padding:4px 8px;border-radius:6px'>SYNC</span></div>

<div id='t5' class='panel'><div class='card'><div class='grid2'><input type='date' id='rDu'><input type='date' id='rAu'></div><div class='grid2'><select id='rVendeur'></select><select id='rTirage'></select></div><button class='btn btnP' onclick='calcRapport()'>Kalkile</button><div id='rapportRes' style='margin-top:10px'></div><div id='rapportDetail' style='margin-top:10px'></div><button class='btn' style='background:#111;color:#fff;display:none' id='btnPrint' onclick='doPrint()'>Enprime</button><div id='printZone' style='display:none;white-space:pre-line;background:#fff;padding:10px;border:1px dashed #000;margin-top:10px;font-family:monospace;font-size:11px'></div></div></div>

<div id='t6' class='panel'><div class='card'><div class='grid2'><select id='resTirage'></select><input id='resDate' type='date'></div><div class='grid3' style='margin-top:6px'><input id='rL3' placeholder='Loto3' maxlength='3'><input id='rr2' placeholder='2e'><input id='rr3' placeholder='3e'></div><input id='rr1' type='hidden'><div class='grid5' style='margin-top:6px'><input id='rrM1' readonly placeholder='M1'><input id='rrM2' readonly placeholder='M2'><input id='rrM3' readonly placeholder='M3'><input id='rrL4' readonly placeholder='L4'><input id='rrL5' readonly placeholder='L5'></div><button class='btn btnG' onclick='saveRes()'>Anrejistre</button></div><div class='card' style='overflow-x:auto'><table><thead><tr><th>Dat</th><th>Tir</th><th>L3</th><th>1er</th><th>2e</th><th>3e</th><th>M1</th><th>M2</th><th>M3</th><th>L4</th><th>L5</th><th>X</th></tr></thead><tbody id='tableRes'></tbody></table></div></div>

</div>

<script>
const DB_ROOT="https://cd-lotto-default-rtdb.firebaseio.com";
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:DB_ROOT,projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const TIRAJ_ALL=['GA midi','FL midi','NY midi','GA soir','FL soir','NY soir','Real','Primera día','Suerte día','Lote Dom','Ganamas','Suerte noche','Primera noche','Loteka','Nacional noche','Leidsa','Anguilla 10h','Anguila 18h'];
let DB={vendeurs:{},proprios:{},tickets:{},results:{},heures:{},limites:{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}},prix:{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000,kom:10}},horairesTiraj:{},blokeBoul:{},blokeVendeur:{},blokeProprio:{},headers:{},logosProprio:{},config:{}};
let CUR=null,MY_PROPRIO_ID=null,tmpBloke={},logoTemp='';
function toggleMenu(){document.getElementById('drawer').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
function goTab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');toggleMenu();document.getElementById('topTitle').innerText={t0:'Lottery Results',t1:'Vendeurs',t2:'Limite',t3:"L'heure",t4:'Prix',t5:'Rapport',t6:'Résultats',t7:'Entête',t8:'Paramètres'}[id];}
function switchLim(t){document.getElementById('tabLimGlobal').classList.toggle('active',t==='global');document.getElementById('tabLimVande').classList.toggle('active',t==='vande');document.getElementById('limitGlobalBox').style.display=t==='global'?'block':'none';document.getElementById('limitVandeBox').style.display=t==='vande'?'block':'none';}
function switchPrix(t){document.getElementById('tabPrixGlobal').classList.toggle('active',t==='global');document.getElementById('tabPrixVande').classList.toggle('active',t==='vande');document.getElementById('prixGlobalBox').style.display=t==='global'?'block':'none';document.getElementById('prixVandeBox').style.display=t==='vande'?'block':'none';}
function init(){db.ref().on('value',snap=>{let v=snap.val()||{};DB.vendeurs=v.vendeurs||{};DB.proprios=v.proprios||{};DB.tickets=v.tickets||{};DB.results=v.results||{};DB.heures=v.heures||{};DB.limites=v.limites||{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}};DB.prix=v.prix||{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000,kom:10}};DB.headers=v.headers||{};DB.logosProprio=v.logosProprio||{};DB.config=v.config||{};DB.blokeVendeur=v.blokeVendeur||{};DB.blokeProprio=v.blokeProprio||{};DB.blokeBoul=v.blokeBoul||{};syncInfo.innerText=Object.keys(DB.vendeurs).length+'V';if(mainBox.style.display!='none')loadAll();});}
function setToday(){const t=new Date().toISOString().split('T')[0];if(resDate&&!resDate.value)resDate.value=t;if(rDu&&!rDu.value)rDu.value=t;if(rAu&&!rAu.value)rAu.value=t;}
function doLogin(){let n=ln.value.trim(),p=lp.value.trim();if(!n||!p){loginMsg.innerText='Mete non';return;}db.ref('proprios').once('value').then(snap=>{let all=snap.val()||{},f=null,fId=null;for(let id in all){if(all[id].nom.toLowerCase()==n.toLowerCase()){f=all[id];fId=id;break;}}if(!f||f.pass!=p){loginMsg.innerText='Pa bon';return;}db.ref('blokeProprio/'+fId).once('value').then(sb=>{if(sb.val()===true||f.bloke===true){loginMsg.innerText='BLOKE';return;}CUR={nom:f.nom,id:fId};MY_PROPRIO_ID=fId;localStorage.setItem('curP',JSON.stringify(CUR));loginBox.style.display='none';mainBox.style.display='block';pUser.innerText=f.nom;loadAll();setToday();});});}
function logout(){localStorage.removeItem('curP');location.reload();}
function getMyVendeurs(){let a=[];for(let id in DB.vendeurs){let v=DB.vendeurs[id];if(v.proprioId==MY_PROPRIO_ID) a.push({...v,_id:id});}return a;}
function loadAll(){
 let myV=getMyVendeurs();
 let optsG='<option value="global">GLOBAL</option>';let optsV='<option value="ALL">Tous</option>';myV.forEach(v=>{optsG+='<option value="'+v._id+'">'+(v.serial||v._id)+' - '+v.nom+' (....)</option>';optsV+='<option value="'+v._id+'">'+(v.serial||v._id)+' - '+v.nom+'</option>';});
 let optsT='<option value="ALL">Tous</option>';TIRAJ_ALL.forEach(t=>optsT+='<option value="'+t+'">'+t+'</option>');
 let horOpts='<option value="">-- Tiraj --</option>'+TIRAJ_ALL.map(t=>`<option>${t}</option>`).join('');
 let vendOpts='<option value="">-- Vandè --</option><option value="ALL">GLOBAL</option>'+myV.map(v=>`<option value="${v._id}">${v.serial} - ${v.nom}</option>`).join('');
 limVendeur.innerHTML=optsG.replace('GLOBAL','Pa Vandè (....)');prixVendeur.innerHTML=optsG;rVendeur.innerHTML=optsV;rTirage.innerHTML=optsT;resTirage.innerHTML=horOpts;horTirage.innerHTML=horOpts;horVendeur.innerHTML=vendOpts;blkTirage.innerHTML=horOpts;
 let html='';myV.forEach(v=>{let bloke=v.bloke===true||DB.blokeVendeur[v._id]===true;let dBloke=tmpBloke[v._id]!==undefined?tmpBloke[v._id]:bloke;html+=`<div class="card"><b>${v.nom} (${v.serial})</b> - ${dBloke?'🔴 BLOKE':'🟢 DEBLOKE'}<div class="grid2"><input id="nom_${v._id}" value="${v.nom}"><input value="${v.serial}" disabled></div><button onclick="toggleBloke('${v._id}')" class="btn ${dBloke?'btnR':'btnG'}">${dBloke?'DEBLOKE':'BLOKE'}</button><button onclick="saveV('${v._id}')" class="btn btnP">Sove</button></div>`;});
 listVendeur.innerHTML=html||'Pa gen vandè';
 loadLimiteGlobal();loadLimiteVande();loadHeures();loadPrixGlobal();loadPrixVande();loadResTable();loadAkey();
}
function loadAkey(){
 let results=Object.values(DB.results);
 let now=new Date();document.getElementById('updatedTxt').innerText='Updated today • '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
 let bases=[
  {k:'new york',label:'New York Lottery',logo:'<div style="width:72px;height:72px;border-radius:50%;background:#1e40af;color:#facc15;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;text-align:center">NEW<br>YORK<br>LOTTERY</div>',cols:['pill-blue','pill-orange','pill-lightblue']},
  {k:'florida',label:'Florida Lottery',logo:'<div style="width:72px;height:72px;border-radius:50%;background:#fff;color:#0d9488;display:flex;align-items:center;justify-content:center;font-weight:900">FLORIDA</div>',cols:['pill-teal','pill-orange','pill-pink']},
  {k:'georgia',label:'Georgia Lottery',logo:'<div style="width:72px;height:72px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center">🍑 GA</div>',cols:['pill-green','pill-yellow','pill-lightgreen']},
  {k:'anguilla',label:'Anguilla Lottery',logo:'<div style="width:72px;height:72px;border-radius:50%;background:#1e3a8a;color:#facc15;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:9px;text-align:center">ANGUILLA<br>LOTTERY</div>',cols:['pill-yellow','pill-darkblue','pill-yellow']}
 ];
 let html='';
 bases.forEach(b=>{
  let soir=results.filter(r=>r.tirage.toLowerCase().includes(b.k==='new york'?'new york':b.k) && r.tirage.toLowerCase().includes('soir')).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''))[0] || results.filter(r=>r.tirage.toLowerCase().includes(b.k==='new york'?'new york':b.k)).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''))[0];
  let midi=results.filter(r=>r.tirage.toLowerCase().includes(b.k==='new york'?'new york':b.k) && r.tirage.toLowerCase().includes('midi')).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''))[0];
  let l3S=soir?((soir.l3||'000').padStart(3,'0')):'015';let r1S=soir?((soir.r1||'00').padStart(2,'0')):'84';let r2S=soir?((soir.r2||'00').padStart(2,'0')):'23';
  let l3M=midi?((midi.l3||'000').padStart(3,'0')):'097';let r1M=midi?((midi.r1||'00').padStart(2,'0')):'14';let r2M=midi?((midi.r2||'00').padStart(2,'0')):'60';
  if(results.length===0){if(b.k==='florida'){l3S='322';r1S='56';r2S='09';l3M='481';r1M='22';r2M='77';}if(b.k==='georgia'){l3S='715';r1S='30';r2S='42';l3M='203';r1M='88';r2M='11';}if(b.k==='anguilla'){l3S='006';r1S='45';r2S='19';l3M='990';r1M='03';r2M='74';}}
  html+=`<div class="lottoCard"><div class="lottoLogo">${b.logo}</div><div style="flex:1"><h3 style="font-size:16px;font-weight:800">Aujourd'hui Soir</h3><div class="pills"><span class="pill ${b.cols[0]}">${l3S}</span><span class="pill ${b.cols[1]}">${r1S}</span><span class="pill ${b.cols[2]}">${r2S}</span></div><div class="midi">Aujourd'hui Midi<br><b>${l3M} • ${r1M} • ${r2M}</b></div></div></div>`;
 });
 document.getElementById('lottoCards').innerHTML=html;
}
function toggleBloke(id){let v=DB.vendeurs[id];let is=v.bloke===true||DB.blokeVendeur[id]===true;if(tmpBloke[id]!==undefined)is=tmpBloke[id];tmpBloke[id]=!is;loadAll();}
function saveV(id){let nom=document.getElementById('nom_'+id).value.trim();let newBloke=tmpBloke[id];if(newBloke===undefined)newBloke=DB.vendeurs[id].bloke===true;db.ref('vendeurs/'+id).update({nom,bloke:newBloke,actif:!newBloke}).then(()=>{if(newBloke)db.ref('blokeVendeur/'+id).set(true);else db.ref('blokeVendeur/'+id).remove();delete tmpBloke[id];});}
function loadLimiteGlobal(){let l=DB.limites.global||{bor:1500,mar:100,l3:100,l4:20,l5:5};limBorG.value=l.bor;limMarG.value=l.mar;limL3G.value=l.l3;limL4G.value=l.l4;limL5G.value=l.l5;}
function saveLimiteGlobal(){db.ref('limites/global').set({bor:+limBorG.value,mar:+limMarG.value,l3:+limL3G.value,l4:+limL4G.value,l5:+limL5G.value}).then(()=>alert('Save'));renderLim();}
function loadLimiteVande(){let k=limVendeur.value;if(!k)return;let l=DB.limites[k]||DB.limites.global;limBor.value=l.bor;limMar.value=l.mar;limL3.value=l.l3;limL4.value=l.l4;limL5.value=l.l5;}
function saveLimiteVande(){let k=limVendeur.value;if(!k)return alert('Chwazi vandè');db.ref('limites/'+k).set({bor:+limBor.value,mar:+limMar.value,l3:+limL3.value,l4:+limL4.value,l5:+limL5.value}).then(()=>alert('Save'));renderLim();}
function renderLim(){let arr=Object.entries(DB.limites);listLimites.innerHTML=arr.map(([k,v])=>`<div class="card" style="display:flex;justify-content:space-between"><div><b>${k==='global'?'1-Global':k+' - Pa Vandè'}</b><br><small>${v.bor} ${v.mar} ${v.l3} ${v.l4} ${v.l5}</small></div><button onclick="delLim('${k}')" style="background:red;color:#fff;border:0;padding:4px 8px;border-radius:4px">X</button></div>`).join('');}
function delLim(k){if(k==='global')return;if(confirm('Efase?'))db.ref('limites/'+k).remove();}
function loadHeures(){let hh='';TIRAJ_ALL.forEach(t=>{let v=DB.heures[t]||'12:00';hh+=`<div style="display:flex;justify-content:space-between;padding:10px;background:#fff;margin-top:4px;border-radius:8px"><b>${t}</b><input type="time" data-n="${t}" value="${v}" style="width:120px"></div>`;});heureList.innerHTML=hh;}
function saveHeures(){let obj={};document.querySelectorAll('#heureList input').forEach(i=>obj[i.dataset.n]=i.value);db.ref('heures').set(obj).then(()=>alert('Save'));}
function loadPrixGlobal(){let p=DB.prix.global;p1G.value=p.p1;p2G.value=p.p2;p3G.value=p.p3;pm1G.value=p.m1;pm2G.value=p.m2;pm3G.value=p.m3;ppL3G.value=p.l3;ppL4G.value=p.l4;ppL5G.value=p.l5;}
function savePrixGlobal(){let obj={p1:+p1G.value,p2:+p2G.value,p3:+p3G.value,m1:+pm1G.value,m2:+pm2G.value,m3:+pm3G.value,l3:+ppL3G.value,l4:5000,l5:+ppL5G.value,kom:10};db.ref('prix/global').set(obj).then(()=>alert('Save'));}
function loadPrixVande(){let k=prixVendeur.value;if(!k)return;let p=DB.prix[k]||DB.prix.global;p1.value=p.p1;p2.value=p.p2;p3.value=p.p3;pm1.value=p.m1;pm2.value=p.m2;pm3.value=p.m3;ppL3.value=p.l3;ppL4.value=p.l4;ppL5.value=p.l5;}
function savePrixVande(){let k=prixVendeur.value;if(!k)return alert('Chwazi vandè');let obj={p1:+p1.value,p2:+p2.value,p3:+p3.value,m1:+pm1.value,m2:+pm2.value,m3:+pm3.value,l3:+ppL3.value,l4:5000,l5:+ppL5.value,kom:10};db.ref('prix/'+k).set(obj).then(()=>alert('Save'));}
function calcRapport(){
 let du=rDu.value,au=rAu.value,vend=rVendeur.value,tir=rTirage.value;if(!du||!au)return alert('Chwazi Du Au');
 let myV=Object.values(DB.vendeurs).filter(v=>v.proprioId==MY_PROPRIO_ID).map(v=>v._id);let myS=Object.values(DB.vendeurs).filter(v=>v.proprioId==MY_PROPRIO_ID).map(v=>v.serial);
 let tickets=Object.values(DB.tickets).filter(t=>{let d=(t.dateHaiti||'').substring(0,10);return d>=du&&d<=au&&(myV.includes(t.vendeurId)||myS.includes(t.serial));});
 if(vend!=='ALL')tickets=tickets.filter(t=>t.vendeurId===vend);if(tir!=='ALL')tickets=tickets.filter(t=>(t.tirages||[]).includes(tir));
 let results=Object.values(DB.results).filter(r=>r.dat>=du&&r.dat<=au);if(tir!=='ALL')results=results.filter(r=>r.tirage===tir);
 let prix=DB.prix.global;let vente=0,peye=0,kom=0,det='',printTxt=`Du ${du} Au ${au}\n`;
 tickets.forEach(tic=>{let v=DB.vendeurs[tic.vendeurId]||{};vente+=tic.total||0;kom+= (tic.total||0)*(v.kom||10)/100;(tic.bets||[]).forEach(b=>{let num=String(b.numero||'').padStart(b.type==='loto3'?3:2,'0'),mise=b.mise||0,type=b.type||'boul';results.forEach(r=>{let l3=(r.l3||'000').padStart(3,'0'),r1=(r.r1||l3.slice(-2)).padStart(2,'0'),r2=(r.r2||'00').padStart(2,'0'),r3=(r.r3||'00').padStart(2,'0'),l4=r2+r3,m1=r1+r2,m2=r1+r3,m3=r2+r3;let gain=0;if(type==='boul'){if(num===r1)gain=mise*prix.p1;else if(num===r2)gain=mise*prix.p2;else if(num===r3)gain=mise*prix.p3;}else if(type==='loto3'){if(num===l3)gain=mise*prix.l3;}else if(type==='maryaj'){if(num===m1||num===r2+r1)gain=mise*prix.m1;else if(num===m2||num===r3+r1)gain=mise*prix.m2;else if(num===m3||num===r3+r2)gain=mise*prix.m3;}else if(type==='loto4'){if(num===l4)gain=mise*5000;}if(gain>0){peye+=gain;det+=`<div style="padding:6px;border-bottom:1px dashed #ccc"><b>${tic.serial} ${r.tirage} ${type} ${num} $${mise} → $${gain}</b></div>`;printTxt+=`${tic.serial} ${r.tirage} ${type} ${num} $${mise} -> $${gain}\n`;}});});});
 let balans=vente-kom-peye;
 rapportRes.innerHTML=`<div class="grid2"><div style="background:#e8f5e9;padding:10px;border-radius:8px"><b>Vant</b><br>$${vente}</div><div style="background:#fff3e0;padding:10px;border-radius:8px"><b>Komisyon</b><br>$${kom.toFixed(2)}</div><div style="background:#ffebee;padding:10px;border-radius:8px"><b>A Peye kliyan</b><br>$${peye}</div><div style="background:#e3f2fd;padding:10px;border-radius:8px"><b>Balans Net</b><br>$${balans.toFixed(2)}</div></div>`;
 rapportDetail.innerHTML=det||'Pa gen gayan';printZone.innerText=printTxt+`Vant $${vente}\nKomisyon $${kom.toFixed(2)}\nA Peye $${peye}\nBalans Net $${balans.toFixed(2)}`;printZone.style.display='block';btnPrint.style.display='block';
}
function doPrint(){let txt=printZone.innerText;let w=window.open('','_blank');w.document.write('<pre>'+txt+'</pre>');w.print();}
function loadResTable(){let arr=Object.values(DB.results).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''));tableRes.innerHTML=arr.map(r=>{let l3=(r.l3||'000').padStart(3,'0'),r1=(r.r1||l3.slice(-2)).padStart(2,'0'),r2=(r.r2||'00').padStart(2,'0'),r3=(r.r3||'00').padStart(2,'0'),m1=r.m1||r1+r2,m2=r.m2||r1+r3,m3=r.m3||r2+r3,l4=r.l4||r2+r3;return `<tr><td>${r.dat}</td><td>${r.tirage}</td><td>${l3}</td><td>${r1}</td><td>${r2}</td><td>${r3}</td><td>${m1}</td><td>${m2}</td><td>${m3}</td><td>${l4}</td><td>${r.l5||''}</td><td><button onclick="delRes('${r.id}')" style="background:red;color:#fff;border:0;padding:4px 8px;border-radius:4px">X</button></td></tr>`}).join('');}
function delRes(id){if(confirm('Efase?'))db.ref('results/'+id).remove();}
function previewLogo(){let f=document.getElementById('logoFile').files[0];if(!f)return;let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=300;c.height=300;let ctx=c.getContext('2d');ctx.drawImage(img,0,0,300,300);logoTemp=c.toDataURL('image/jpeg',0.65);};img.src=e.target.result;};r.readAsDataURL(f);}
function saveEntete(){let obj={nom:entNom.value,footer:entFooter.value,logo:logoTemp};db.ref('headers/'+MY_PROPRIO_ID).set(obj).then(()=>{if(logoTemp)db.ref('logosProprio/'+MY_PROPRIO_ID).set(logoTemp);alert('Save');});}
(function(){let cur=localStorage.getItem('curP');if(cur){try{CUR=JSON.parse(cur);MY_PROPRIO_ID=CUR.id;loginBox.style.display='none';mainBox.style.display='block';pUser.innerText=CUR.nom;init();setToday();}catch(e){localStorage.removeItem('curP');init();setToday();}}else{init();setToday();}})();
</script></body></html>
