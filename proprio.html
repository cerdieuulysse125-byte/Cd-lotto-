<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#eef1f6}.top{height:54px;background:#4a148c;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;position:sticky;top:0;z-index:100}.menuBtn{font-size:26px;background:0;border:0;color:#fff;cursor:pointer;padding:6px 10px}.drawer{position:fixed;top:0;left:-280px;width:270px;height:100%;background:#fff;z-index:200;transition:.25s;box-shadow:3px 0 12px rgba(0,0,0,.3);overflow:auto}.drawer.open{left:0}.drawerHead{background:#4a148c;color:#fff;padding:14px;font-weight:800}.drawerItem{padding:14px 16px;border-bottom:1px solid #eee;cursor:pointer;font-weight:700;font-size:12px}.drawerItem.active{background:#f3e5f5;color:#4a148c;border-left:4px solid #4a148c}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:150}.overlay.show{display:block}.panel{display:none;padding:12px;max-width:1100px;margin:auto}.panel.active{display:block}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:10px}.btn{padding:12px;border:0;border-radius:8px;color:#fff;font-weight:800;width:100%;margin-top:8px;cursor:pointer}.btnP{background:#4a148c}.btnR{background:#c62828}.btnG{background:#2e7d32}input,select{padding:10px;border:1.5px solid #ddd;border-radius:8px;width:100%;margin:5px 0}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#4a148c;color:#fff;padding:7px}td{padding:7px;border-bottom:1px solid #eee;text-align:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}@media(max-width:700px){.grid2,.grid3,.grid5{grid-template-columns:1fr 1fr}}</style></head><body>
<div class='top'><button class='menuBtn' onclick='toggleMenu()'>☰</button><b id='topTitle'>PROPRIO V25.7</b><button onclick='logout()' style='background:#c62828;color:#fff;border:0;padding:6px 10px;border-radius:6px'>SOTI</button></div>

</div>

<div id='loginBox' class='card' style='max-width:400px;margin:30px auto'><h3>🔐 Proprio</h3><input id='ln' placeholder='Non Proprio'><input id='lp' type='password' placeholder='Modpas'><button class='btn btnP' onclick='doLogin()'>Konekte</button><div id='loginMsg' style='color:red;font-weight:800;margin-top:8px'></div></div>

<div id='mainBox' style='display:none'>
<div id='t0' class='panel active'><div class='card'><h3>🏠 Akèy - PROPRIO</h3><div id='dashStats'></div></div><div class='card'><div style='display:grid;grid-template-columns:1fr 1fr;gap:8px'><button class='btn btnP' onclick="goTab('t1')">1-Vendeurs</button><button class='btn btnP' onclick="goTab('t2')">2-Limite</button><button class='btn btnP' onclick="goTab('t3')">3-L'heure</button><button class='btn btnP' onclick="goTab('t4')">4-Prix M1 M2 M3</button><button class='btn btnG' onclick="goTab('t5')">5-Rapport</button><button class='btn btnR' onclick="goTab('t6')">6-Résultats</button><button class='btn btnP' onclick="goTab('t7')">7-Entête</button><button class='btn btnP' onclick="goTab('t8')">8-Paramètres</button></div></div></div>

<div id='t4' class='panel'><div class='card'><select id='prixVendeur' onchange='loadPrix()'></select><div class='grid3' style='margin-top:8px'><div><input id='p1' type='number' value='50'></div><div><input id='p2' type='number' value='20'></div><div><input id='p3' type='number' value='10'></div></div><div class='grid3' style='margin-top:8px'><div><input id='pm1' type='number' value='1000'></div><div><input id='pm2' type='number' value='1000'></div><div><input id='pm3' type='number' value='1000'></div></div><div class='grid3' style='margin-top:8px'><div><input id='ppL3' type='number' value='500'></div><div><input id='ppL4' type='number' value='5000'></div><div><input id='ppL5' type='number' value='25000'></div></div><button class='btn btnP' onclick='savePrix()'>Save Prix</button><div id='prixStatus'></div></div></div>

<div id='t6' class='panel'><div class='card' style='border:2px solid #c62828'><div class='grid2'><select id='resTirage'></select><input id='resDate' type='date'></div><div class='grid3' style='margin-top:8px'><div><input id='rL3' inputmode='numeric' placeholder='Loto3 004' maxlength='3' style='border:2.5px solid #2f6bff;font-weight:800;text-align:center' oninput="this.value=this.value.replace(/[^0-9]/g,'');calcAuto()"></div><div><input id='rr2' inputmode='numeric' placeholder='2e 13' maxlength='2' style='border:2.5px solid #ff8c00;font-weight:800;text-align:center' oninput="this.value=this.value.replace(/[^0-9]/g,'');calcAuto()"></div><div><input id='rr3' inputmode='numeric' placeholder='3e 25' maxlength='2' style='border:2.5px solid #a3d4ff;font-weight:800;text-align:center' oninput="this.value=this.value.replace(/[^0-9]/g,'');calcAuto()"></div></div><input id='rr1' type='hidden'><div class='grid5' style='margin-top:8px'><input id='rrM1' readonly placeholder='M1'><input id='rrM2' readonly placeholder='M2'><input id='rrM3' readonly placeholder='M3'><input id='rrL4' readonly placeholder='L4'><input id='rrL5' readonly placeholder='L5'></div><div id='previewRes' style='display:none;background:#fff;padding:8px;border-radius:8px;margin-top:8px;border:1px solid #c62828'></div><button class='btn btnG' onclick='saveRes()'>ANREJISTRE</button></div><div class='card' style='overflow-x:auto'><table><thead><tr><th>Dat</th><th>Tir</th><th style='background:#2f6bff'>Loto3</th><th style='background:#4a148c'>1er</th><th>2e</th><th>3e</th><th>M1 L/D</th><th>M2 L/D</th><th>M3 L/D</th><th style='background:#c62828'>L4 LÒD 5000×1</th><th>L5</th><th>X</th></tr></thead><tbody id='tableRes'></tbody></table></div></div>

<div id='t7' class='panel'><div class='card'><input id='entNom' value='VERITE LOTTO'><input id='entAdresse' placeholder='Adresse'><input id='entTel'><input id='entResp'><input id='entLogo'><textarea id='entFooter'></textarea><div class='grid2'><input id='entPass' type='password' placeholder='Nouvo'><input id='entPass2' type='password' placeholder='Konfime'></div><button class='btn btnP' onclick='saveEntete()'>Save</button></div></div>
<div id='t8' class='panel'><div class='card'><div class='grid2'><select id='horTirage' onchange='loadHorairesUI()'></select><select id='horVendeur' onchange='loadHorairesUI()'></select></div><div id='joursList' style='margin-top:10px'></div><button class='btn btnP' onclick='saveHoraires()'>Save Horaires</button><hr style='margin:12px 0'><div class='grid2'><select id='blkTirage'></select><input id='blkBoul' type='number'></div><button class='btn btnR' onclick='saveBlokeBoul()'>Bloke Boul</button><div id='listBlokeBoul' style='margin-top:8px'></div><hr style='margin:12px 0'><div class='grid2'><select id='blkJeuTirage'></select><select id='blkJeuVendeur'></select></div><select id='blkJeuType'><option value=''>-- Chwazi --</option><option value='bolet'>BOLET</option><option value='maryaj'>MARYAJ</option><option value='loto3'>LOTO3</option><option value='loto4'>LOTO4</option><option value='loto5'>LOTO5</option><option value='all'>TOUT</option></select><button class='btn' style='background:#ef6c00;color:#fff' onclick='saveBlokeJeu()'>Bloke Jwèt</button><div id='listBlokeJeu' style='margin-top:8px'></div></div></div>
</div>

<script>
const DB_ROOT="https://cd-lotto-default-rtdb.firebaseio.com";
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:DB_ROOT,projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const TIRAJ_ALL=['GA midi','FL midi','NY midi','GA soir','FL soir','NY soir','Real','Primera día','Suerte día','Lote Dom','Ganamas','Suerte noche','Primera noche','Loteka','Nacional noche','Leidsa','Anguila 10h','Anguila 18h'];
let DB={vendeurs:{},proprios:{},tickets:{},results:{},heures:{},limites:{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}},prix:{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000,komActive:true,kom:10}},horairesTiraj:{},blokeBoul:{},blokeVendeur:{},blokeProprio:{},blokeJeux:{},headers:{},config:{}};
let CUR=null,MY_PROPRIO_ID=null,tmpBloke={};
function toggleMenu(){document.getElementById('drawer').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
function goTab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.drawerItem').forEach(d=>d.classList.remove('active'));document.getElementById(id).classList.add('active');toggleMenu();document.getElementById('topTitle').innerText=id==='t0'?'Akèy':id==='t1'?'1-Vendeurs':id==='t2'?'2-Limite':id==='t3'?"3-L'heure":id==='t4'?'4-Prix':id==='t5'?'5-Rapport':id==='t6'?'6-Résultats':id==='t7'?'7-Entête':'8-Paramètres';}
function init(){db.ref().on('value',snap=>{let v=snap.val()||{};DB.vendeurs=v.vendeurs||{};DB.proprios=v.proprios||{};DB.tickets=v.tickets||{};DB.results=v.results||{};DB.heures=v.heures||{};DB.limites=v.limites||{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}};DB.prix=v.prix||{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000,komActive:true,kom:10}};DB.horairesTiraj=v.horairesTiraj||{};DB.blokeBoul=v.blokeBoul||{};DB.blokeVendeur=v.blokeVendeur||{};DB.blokeProprio=v.blokeProprio||{};DB.blokeJeux=v.blokeJeux||{};DB.headers=v.headers||{};syncInfo.innerText='SYNC OK - '+Object.keys(DB.vendeurs).length+'V';if(mainBox.style.display!='none')loadAll();});}
function setToday(){const t=new Date().toISOString().split('T')[0];if(resDate&&!resDate.value)resDate.value=t;if(rDu&&!rDu.value)rDu.value=t;if(rAu&&!rAu.value)rAu.value=t;}
function doLogin(){let n=ln.value.trim(),p=lp.value.trim();if(!n||!p){loginMsg.innerText='Mete non ak modpas';return;}db.ref('proprios').once('value').then(snap=>{let all=snap.val()||{},f=null,fId=null;for(let id in all){if(all[id].nom.toLowerCase()==n.toLowerCase()){f=all[id];fId=id;break;}}if(!f||f.pass!=p){loginMsg.innerText='Non oswa modpas pa bon';return;}db.ref('blokeProprio/'+fId).once('value').then(sb=>{if(sb.val()===true||f.bloke===true||f.actif===false){loginMsg.innerText='BLOKE - Kontakte SUPER';return;}CUR={nom:f.nom,id:fId};MY_PROPRIO_ID=fId;localStorage.setItem('curP',JSON.stringify(CUR));loginBox.style.display='none';mainBox.style.display='block';pUser.innerText=f.nom;loadAll();setToday();});});}
function logout(){localStorage.removeItem('curP');location.reload();}
function getMyVendeurs(){let a=[];for(let id in DB.vendeurs){let v=DB.vendeurs[id];if(v.proprioId==MY_PROPRIO_ID) a.push({...v,_id:id});}return a;}
function loadAll(){
 let myV=getMyVendeurs();
 let opts='<option value="global">GLOBAL</option>';let optsA='<option value="ALL">Tous</option>';let optsT='<option value="ALL">Tous</option>';
 myV.forEach(v=>{opts+='<option value="'+v._id+'">'+v.serial+' - '+v.nom+'</option>';optsA+='<option value="'+v._id+'">'+v.serial+' - '+v.nom+'</option>';});
 TIRAJ_ALL.forEach(t=>optsT+='<option value="'+t+'">'+t+'</option>');
 let horOpts='<option value="">-- Tiraj --</option>'+TIRAJ_ALL.map(t=>`<option>${t}</option>`).join('');let vendOpts='<option value="">-- Vandè --</option><option value="ALL">GLOBAL</option>'+myV.map(v=>`<option value="${v._id}">${v.serial} - ${v.nom}</option>`).join('');
 limVendeur.innerHTML=opts;prixVendeur.innerHTML=opts;rVendeur.innerHTML=optsA;rTirage.innerHTML=optsT;resTirage.innerHTML=horOpts;horTirage.innerHTML=horOpts;horVendeur.innerHTML=vendOpts;blkTirage.innerHTML=horOpts;blkJeuTirage.innerHTML=horOpts;blkJeuVendeur.innerHTML=vendOpts;
 let html='';myV.forEach(v=>{let bloke=v.bloke===true||DB.blokeVendeur[v._id]===true;let dBloke=tmpBloke[v._id]!==undefined?tmpBloke[v._id]:bloke;html+=`<div class="card"><b>${v.nom} (${v.serial})</b> - ${dBloke?'🔴 BLOKE':'🟢 DEBLOKE'}<div class="grid2"><input id="nom_${v._id}" value="${v.nom}"><input value="${v.serial}" disabled></div><div class="grid2"><input id="pass_${v._id}" value="${v.pass}"><input id="kom_${v._id}" value="${v.kom||10}"></div><button onclick="toggleBloke('${v._id}')" class="btn ${dBloke?'btnR':'btnG'}">${dBloke?'DEBLOKE':'BLOKE'}</button><button onclick="saveV('${v._id}')" class="btn btnP">Sove</button></div>`;});
 listVendeur.innerHTML=html||'Pa gen vandè';loadLimite();loadHeures();loadPrix();loadResTable();loadBlokeBoulList();loadBlokeJeuList();loadEntete();
 let today=new Date().toISOString().slice(0,10);let tics=Object.values(DB.tickets).filter(t=>(t.dateHaiti||'').substring(0,10)===today && myV.some(m=>m.serial===t.serial));dashStats.innerHTML=`Vandè: ${myV.length} - Fich Jodia: ${tics.length} - Vant: $${tics.reduce((a,b)=>a+(b.total||0),0)} - Menm Baz ${DB_ROOT}`;
}
function toggleBloke(id){let v=DB.vendeurs[id];let is=v.bloke===true||DB.blokeVendeur[id]===true;if(tmpBloke[id]!==undefined)is=tmpBloke[id];tmpBloke[id]=!is;loadAll();}
function saveV(id){let nom=document.getElementById('nom_'+id).value.trim();let pass=document.getElementById('pass_'+id).value.trim();let kom=document.getElementById('kom_'+id).value.trim();let newBloke=tmpBloke[id];if(newBloke===undefined)newBloke=DB.vendeurs[id].bloke===true;db.ref('vendeurs/'+id).update({nom,pass,kom:+kom,bloke:newBloke,actif:!newBloke}).then(()=>{if(newBloke)db.ref('blokeVendeur/'+id).set(true);else db.ref('blokeVendeur/'+id).remove();delete tmpBloke[id];});}
function loadLimite(){let k=limVendeur.value;let l=DB.limites[k]||DB.limites.global;limBor.value=l.bor;limMar.value=l.mar;limL3.value=l.l3;limL4.value=l.l4;limL5.value=l.l5;}
function saveLimite(){let k=limVendeur.value;db.ref('limites/'+k).set({bor:+limBor.value,mar:+limMar.value,l3:+limL3.value,l4:+limL4.value,l5:+limL5.value}).then(()=>alert('Save'));}
function loadHeures(){let hh='';TIRAJ_ALL.forEach(t=>{let v=DB.heures[t]||'12:00';hh+=`<div style="display:flex;justify-content:space-between;padding:10px;background:#fff;margin-top:4px;border-radius:8px"><b>${t}</b><input type="time" data-n="${t}" value="${v}" style="width:120px"></div>`;});heureList.innerHTML=hh;}
function saveHeures(){let obj={};document.querySelectorAll('#heureList input').forEach(i=>obj[i.dataset.n]=i.value);db.ref('heures').set(obj).then(()=>alert('Save'));}
function loadPrix(){let k=prixVendeur.value||'global';let p=DB.prix[k]||DB.prix.global;p1.value=p.p1;p2.value=p.p2;p3.value=p.p3;pm1.value=p.m1;pm2.value=p.m2;pm3.value=p.m3;ppL3.value=p.l3;ppL4.value=p.l4;ppL5.value=p.l5;}
function savePrix(){let k=prixVendeur.value||'global';let obj={p1:+p1.value,p2:+p2.value,p3:+p3.value,m1:+pm1.value,m2:+pm2.value,m3:+pm3.value,l3:+ppL3.value,l4:5000,l5:+ppL5.value,kom:10,komActive:true};db.ref('prix/'+k).set(obj).then(()=>prixStatus.innerText='Save');}
function calcAuto(){let l3=rL3.value.trim().padStart(3,'0'),r2=rr2.value.trim().padStart(2,'0'),r3=rr3.value.trim().padStart(2,'0');if(!l3||l3==='000'||l3.length<3||!r2||!r3){previewRes.style.display='none';return;}let r1=l3.slice(-2);rr1.value=r1;let m1=r1+r2,m2=r1+r3,m3=r2+r3,l4=r2+r3,l5=l3+r2;rrM1.value=m1;rrM2.value=m2;rrM3.value=m3;rrL4.value=l4;rrL5.value=l5;previewRes.style.display='block';previewRes.innerHTML=`1er ${r1} - 2e ${r2} - 3e ${r3} - M1 ${m1} L/D - M2 ${m2} L/D - M3 ${m3} L/D - L4 ${l4} LÒD - L3 ${l3}→${r1}`;}
function saveRes(){let tirage=resTirage.value,dat=resDate.value;if(!tirage||!dat)return alert('Chwazi tiraj ak dat');let l3=rL3.value.trim().padStart(3,'0'),r2=rr2.value.trim().padStart(2,'0'),r3=rr3.value.trim().padStart(2,'0');if(!l3||!r2||!r3)return alert('Mete Loto3,2e,3e');let r1=l3.slice(-2);let m1=r1+r2,m2=r1+r3,m3=r2+r3,l4=r2+r3,l5=l3+r2;let d={tirage,dat,r1,r2,r3,m1,m2,m3,l3,l4,l5,date:new Date().toLocaleString(),id:'res_'+Date.now()};db.ref('results/'+d.id).set(d).then(()=>{['rL3','rr2','rr3','rrM1','rrM2','rrM3','rrL4','rrL5'].forEach(i=>document.getElementById(i).value='');previewRes.style.display='none';});}
function loadResTable(){let arr=Object.values(DB.results).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''));tableRes.innerHTML=arr.map(r=>{let l3=(r.l3||'000').padStart(3,'0'),r1=(r.r1||l3.slice(-2)).padStart(2,'0'),r2=(r.r2||'00').padStart(2,'0'),r3=(r.r3||'00').padStart(2,'0'),m1=r.m1||r1+r2,m2=r.m2||r1+r3,m3=r.m3||r2+r3,l4=r.l4||r2+r3,l5=r.l5||l3+r2;return `<tr><td>${r.dat}</td><td>${r.tirage}</td><td style='background:#2f6bff;color:#fff'>${l3}</td><td style='background:#4a148c;color:#fff'>${r1}</td><td>${r2}</td><td>${r3}</td><td>${m1}</td><td>${m2}</td><td style='font-weight:800'>${m3}</td><td style='background:#c62828;color:#fff;font-weight:800'>${l4}</td><td>${l5}</td><td><button onclick='delRes("${r.id}")' style='background:red;color:#fff;border:0;padding:4px 8px;border-radius:4px'>X</button></td></tr>`}).join('');}
function delRes(id){if(confirm('Efase?'))db.ref('results/'+id).remove();}
function calcRapport(){
 let du=rDu.value,au=rAu.value,vend=rVendeur.value,tir=rTirage.value;if(!du||!au)return alert('Chwazi dat');
 let myV=getMyVendeurs().map(v=>v._id);let myS=getMyVendeurs().map(v=>v.serial);
 let tickets=Object.values(DB.tickets).filter(t=>{let d=(t.dateHaiti||'').substring(0,10);return d>=du&&d<=au&&(myV.includes(t.vendeurId)||myS.includes(t.serial));});
 if(vend!=='ALL')tickets=tickets.filter(t=>t.vendeurId===vend);if(tir!=='ALL')tickets=tickets.filter(t=>(t.tirages||[]).includes(tir));
 let results=Object.values(DB.results).filter(r=>r.dat>=du&&r.dat<=au);if(tir!=='ALL')results=results.filter(r=>r.tirage===tir);
 let prix=DB.prix.global;let vente=0,peye=0,det='';
