<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROPRIO V96 ENPAK</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff;padding:10px;padding-bottom:90px}
.hdr{background:#facc15;color:#000;padding:14px;border-radius:14px;display:flex;justify-content:space-between;font-weight:900}
.card{background:#1e293b;border-radius:16px;padding:14px;margin:10px 0}
.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:800;cursor:pointer}
.btnRed{background:#ef4444;color:#fff}.btnGreen{background:#22c55e;color:#fff}.btnYellow{background:#facc15;color:#000}
.tabs{position:fixed;bottom:0;left:0;width:100%;background:#020617;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px}
.tabBtn{background:#1e293b;color:#94a3b8;padding:12px;border-radius:10px;border:none;font-weight:800}
.tabBtn.active{background:#facc15;color:#000}.sec{display:none}.sec.active{display:block}
input,select{padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;width:100%}
</style></head><body>
<div class="hdr"><span>PROPRIO V96</span><span id="dateNow"></span></div>
<div id="secVENDEURS" class="sec active"><div class="card"><b>👥 VENDEURS - ENPAK DIRÈK</b><div id="listVendeurs"></div></div></div>
<div id="secRAPPORTS" class="sec"><div class="card"><b>📊 RAPPORTS - KORIJE PAYE</b>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0"><input id="rapDu" type="date"><input id="rapAu" type="date"><select id="rapVendeur"><option value="">Tout</option></select></div>
<div style="display:grid;grid-template-columns:1fr auto;gap:8px"><select id="rapTiraj"><option value="">Tout Tiraj</option><option>FL SOIR</option><option>NY SOIR</option></select><button class="btn btnYellow" onclick="genererRapportProprio()">OK</button></div><div id="rapportResult"></div></div></div>
<div id="secFICHES" class="sec"><div class="card"><b>FICHES</b><div id="listFiches"></div></div></div>
<div class="tabs"><button onclick="showTab('VENDEURS')" id="tabVENDEURS" class="tabBtn active">VENDEURS</button><button onclick="showTab('RAPPORTS')" id="tabRAPPORTS" class="tabBtn">RAPPORTS</button><button onclick="showTab('FICHES')" id="tabFICHES" class="tabBtn">FICHES</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getDatabase,ref,get,child,set}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};const app=initializeApp(cfg);const db=getDatabase(app);
function getDateHaiti(d=new Date()){let h=new Date(d.toLocaleString("en-US",{timeZone:"America/New_York"}));return`${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;}
function init(){document.getElementById('dateNow').innerText=getDateHaiti();loadVendeurs();document.getElementById('rapDu').value="2026-08-06";document.getElementById('rapAu').value="2026-08-06";}
window.showTab=(t)=>{document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));document.getElementById('sec'+t).classList.add('active');document.getElementById('tab'+t).classList.add('active');}
window.bloquerVendeurImpact=async(nom,etat)=>{await set(ref(db,'vendeurs/'+nom+'/bloque'),etat);await set(ref(db,'vendeurs/'+nom+'/status'),etat?'bloque':'actif');await set(ref(db,'config/vendeursBloque/'+nom),etat);alert((etat?'BLOKE ':'DEBLOKE ')+nom);loadVendeurs();}
window.korijePayeImpact=async(vendeur,date,montant)=>{let m=parseInt(montant);await set(ref(db,'rapportsVendeurs/'+vendeur+'/'+date),{paye:m,date,korijePar:'proprio',timestamp:new Date().toISOString()});alert(`PAYE ${vendeur} ${date} = ${m}G`);genererRapportProprio();}
async function loadVendeurs(){let s=await get(child(ref(db),'vendeurs'));let sel=document.getElementById('rapVendeur');sel.innerHTML='<option value="">Tout</option>';let html='<table style=width:100%><tr><th>Vandè</th><th>Status</th><th>Aksyon</th></tr>';for(let k in s.val()){let v=s.val()[k];let bloque=v.bloque==true||v.status=='bloque';sel.innerHTML+=`<option value="${k}">${k}</option>`;html+=`<tr><td><b>${k}</b></td><td>${bloque?'🚫 BLOKE':'✅ AKTIF'}</td><td>${bloque?`<button class=btn btnGreen onclick="bloquerVendeurImpact('${k}',false)">DEBLOKE</button>`:`<button class=btn btnRed onclick="bloquerVendeurImpact('${k}',true)">BLOKE</button>`}</td></tr>`;}html+='</table>';document.getElementById('listVendeurs').innerHTML=html;}
window.genererRapportProprio=async()=>{let du=document.getElementById('rapDu').value,au=document.getElementById('rapAu').value,vendeurF=document.getElementById('rapVendeur').value,tirajF=document.getElementById('rapTiraj').value;let s=await get(child(ref(db),'fiches'));let all=Object.values(s.val()).filter(f=>{let dH=getDateHaiti(new Date(f.date));return dH>=du&&dH<=au&&(!vendeurF||f.vendeur==vendeurF)&&(!tirajF||(f.tirajs||[]).includes(tirajF));});let parVendeur={};all.forEach(f=>{if(!parVendeur[f.vendeur])parVendeur[f.vendeur]={vente:0,fiches:0,parTiraj:{}};parVendeur[f.vendeur].vente+=f.total||0;parVendeur[f.vendeur].fiches++;let nb=f.nbTiraj||f.tirajs?.length||1;let base=f.totalBase!=null?f.totalBase:Math.round((f.total||0)/nb);(f.tirajs||[]).forEach(t=>{parVendeur[f.vendeur].parTiraj[t]=(parVendeur[f.vendeur].parTiraj[t]||0)+base;});});let html='';for(let v in parVendeur){let vente=parVendeur[v].vente;let kom=Math.round(vente*0.10);let payeFiches=all.filter(f=>f.vendeur==v).reduce((a,b)=>a+Number(b.paye||0),0);let payeProprio=0;try{let snap=await get(child(ref(db),'rapportsVendeurs/'+v+'/'+du));if(snap.exists())payeProprio=Number(snap.val().paye||0);}catch(e){}let paye=payeProprio>0?payeProprio:payeFiches;let balans=vente-kom-paye;html+=`<div style="background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;margin:10px 0"><b>${v.toUpperCase()}</b> - ${parVendeur[v].fiches} fich<br><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:8px 0;text-align:center"><div><small>VANN</small><br><b>${vente}G</b></div><div><small>KOM</small><br><b>${kom}G</b></div><div><small>PAYE</small><br><b>${paye}G</b></div><div><small>BALANS</small><br><b>${balans}G</b></div></div><div style="font-size:11px;color:#94a3b8">${Object.keys(parVendeur[v].parTiraj).map(t=>t+': '+parVendeur[v].parTiraj[t]+'G').join(' | ')}</div><div style="display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:8px"><input id="payeInput-${v}-${du}" type="number" placeholder="Korije PAYE ex:16000" value="${payeProprio>0?payeProprio:''}"><button class="btn btnYellow" onclick="korijePayeImpact('${v}','${du}',document.getElementById('payeInput-${v}-${du}').value)">💾 KORIJE SOU VANDE</button></div></div>`;}document.getElementById('rapportResult').innerHTML=html||'Pa gen done';}init();
</script></body></html>
