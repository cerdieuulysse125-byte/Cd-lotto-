<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROPRIO V87.3 MODPAS</title>
<style>*{box-sizing:border-box}body{background:#0f172a;color:#fff;font-family:sans-serif;margin:0;padding:10px}h1{font-size:14px;text-align:center;color:#facc15}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px;margin-bottom:12px}h2{font-size:13px;color:#facc15;margin:0 0 8px}input,select{padding:8px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;width:100%;margin-top:4px}button{padding:8px 12px;border-radius:8px;border:none;font-weight:bold;cursor:pointer}.vendRow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #334155}.btnG{background:#22c55e;color:#fff}.btnY{background:#facc15;color:#000}.btnR{background:#ef4444;color:#fff}.btnB{background:#3b82f6;color:#fff}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head>
<body>
<h1>👑 PROPRIO V87.3 - MODPAS INIK</h1>

<div class="card" style="border:2px solid #3b82f6"><h2>👥 CONTRÔLER VENDEURS - MODPAS INIK 🔐</h2>
<div style="background:#0f172a;padding:12px;border-radius:8px;margin-bottom:12px;border:1px dashed #3b82f6">
<div style="font-size:12px;margin-bottom:8px;font-weight:bold">➕ Ajoute nouvo vandè ak modpas:</div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><input id="newVendName" placeholder="Non ex: vendeur4" style="flex:1;min-width:100px"><input id="newVendPass" placeholder="Modpas ex: 1234" style="width:100px"><input id="newVendCom" type="number" value="10" style="width:60px"><button onclick="addVend()" class="btnB">➕ Ajoute</button></div>
<div style="font-size:9px;color:#94a3b8;margin-top:6px">Chak vandè dwe gen modpas inik li! Ex: vendeur1 = 1111, vendeur2 = 2222</div>
</div>
<div id="listVend" style="background:#0f172a;border-radius:8px;padding:8px"></div>
<div style="display:flex;gap:6px;margin-top:10px"><button onclick="init3Vendeurs()" class="btnG" style="flex:1">⚡ Kreye 3 Vandè ak modpas (1111,2222,3333)</button><button onclick="cleanAll()" class="btnR">🧹 Netwaye</button></div>
</div>

<div class="card"><h2>⏰ L'HEURE FERMETURE</h2><div id="fermConfig" class="grid2"></div><button onclick="saveFerm()" class="btnY" style="width:100%;margin-top:10px">💾 Sove Lè</button></div>
<div class="card"><h2>💰 PRIX JEUX BÒLÈT</h2><div class="grid3"><div><label>1er</label><input id="p_bolet1" type="number" value="50"></div><div><label>2e</label><input id="p_bolet2" type="number" value="20"></div><div><label>3e</label><input id="p_bolet3" type="number" value="10"></div><div><label>M1x2</label><input id="p_m1x2" type="number" value="1000"></div><div><label>Loto3</label><input id="p_loto3" type="number" value="500"></div><div><label>Loto4</label><input id="p_loto4" type="number" value="5000"></div></div><button onclick="savePrix()" class="btnY" style="width:100%;margin-top:8px">💾 Sove Prix</button></div>
<div class="card"><h2>🚫 LIMITER MISE</h2><div class="grid3"><div><label>Bolet</label><input id="l_bolet" type="number" value="1000"></div><div><label>Maryaj</label><input id="l_mariage" type="number" value="50"></div><div><label>Loto3</label><input id="l_loto3" type="number" value="100"></div></div><button onclick="saveLimite()" class="btnY" style="width:100%;margin-top:8px">💾 Sove Limit</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};const app=initializeApp(cfg);const db=getDatabase(app);

async function loadFerm(){let s=await get(child(ref(db),'config/fermeture'));let ferm=s.exists()?s.val():{'GA MIDI':'12:15','GA SOIR':'18:15','FL MIDI':'13:15','FL SOIR':'21:15','NY MIDI':'14:15','NY SOIR':'21:30'};let div=document.getElementById('fermConfig');div.innerHTML='';Object.entries(ferm).forEach(([k,v])=>{div.innerHTML+=`<div><label style="font-size:10px">${k}</label><input type="time" id="f_${k}" value="${v}"></div>`;});}
window.saveFerm=async()=>{let o={};['GA MIDI','GA SOIR','FL MIDI','FL SOIR','NY MIDI','NY SOIR'].forEach(k=>{let el=document.getElementById('f_'+k);if(el)o[k]=el.value;});await set(ref(db,'config/fermeture'),o);alert('Lè sove ✅');};
async function loadPrix(){let s=await get(child(ref(db),'config/prix')); if(s.exists()){let p=s.val();document.getElementById('p_bolet1').value=p.bolet1||50;document.getElementById('p_bolet2').value=p.bolet2||20;document.getElementById('p_bolet3').value=p.bolet3||10;document.getElementById('p_m1x2').value=p.m1x2||1000;document.getElementById('p_loto3').value=p.loto3||500;document.getElementById('p_loto4').value=p.loto4||5000;}}
window.savePrix=async()=>{let o={bolet1:+document.getElementById('p_bolet1').value,bolet2:+document.getElementById('p_bolet2').value,bolet3:+document.getElementById('p_bolet3').value,m1x2:+document.getElementById('p_m1x2').value,m1x3:+document.getElementById('p_m1x2').value,m2x3:+document.getElementById('p_m1x2').value,loto3:+document.getElementById('p_loto3').value,loto4:+document.getElementById('p_loto4').value,loto5:25000};await set(ref(db,'config/prix'),o);alert('Prix sove ✅');};
async function loadLimite(){let s=await get(child(ref(db),'config/limites'));if(s.exists()){let l=s.val();document.getElementById('l_bolet').value=l.bolet||1000;document.getElementById('l_mariage').value=l.mariage||50;document.getElementById('l_loto3').value=l.loto3||100;}}
window.saveLimite=async()=>{let o={bolet:+document.getElementById('l_bolet').value,mariage:+document.getElementById('l_mariage').value,loto3:+document.getElementById('l_loto3').value,loto4:20,loto5:10};await set(ref(db,'config/limites'),o);alert('Limit sove ✅');};

window.cleanAll=async()=>{await remove(ref(db,'config/vendeurs/undefined'));alert('Netwaye ✅');loadVend();};
window.init3Vendeurs=async()=>{
await set(ref(db,'config/vendeurs/vendeur1'),{nom:'vendeur1',password:'1111',commission:10,active:true,creeLe:new Date().toISOString()});
await set(ref(db,'config/vendeurs/vendeur2'),{nom:'vendeur2',password:'2222',commission:10,active:true,creeLe:new Date().toISOString()});
await set(ref(db,'config/vendeurs/vendeur3'),{nom:'vendeur3',password:'3333',commission:10,active:true,creeLe:new Date().toISOString()});
alert('3 Vandè kreye:\nvendeur1 = 1111\nvendeur2 = 2222\nvendeur3 = 3333 ✅');loadVend();
};
window.addVend=async()=>{
let nom=document.getElementById('newVendName').value.trim().toLowerCase().replace(/\s+/g,'');
let pass=document.getElementById('newVendPass').value.trim();
if(!nom||nom.length<2)return alert('Non pa valab');
if(!pass||pass.length<3)return alert('Mete modpas min 3 chif');
let com=parseInt(document.getElementById('newVendCom').value)||10; if(com>30)com=10;
await set(ref(db,`config/vendeurs/${nom}`),{nom:nom,password:pass,commission:com,active:true,creeLe:new Date().toISOString()});
document.getElementById('newVendName').value='';document.getElementById('newVendPass').value='';alert(`${nom} / Modpas: ${pass} ✅`);loadVend();
};
async function loadVend(){
let s1=await get(child(ref(db),'config/vendeurs'));let div=document.getElementById('listVend');div.innerHTML='';
if(!s1.exists()){div.innerHTML='<div style="text-align:center;padding:20px">Pa gen vandè<br><button onclick="init3Vendeurs()" class="btnG">⚡ Kreye 3 vandè</button></div>';return;}
let vals=Object.values(s1.val()).filter(v=>v&&v.nom&&v.nom!=='undefined');
vals.forEach(v=>{
let k=v.nom.toLowerCase();let active=v.active!==false;
div.innerHTML+=`<div class="vendRow"><div><b>👤 ${v.nom}</b> ${active?'✅':'❌'}<br><span style="font-size:10px;color:#facc15">🔑 Modpas: <b style="color:#fff;font-size:13px">${v.password||'Pa gen'}</b></span><br><span style="font-size:10px">Com: ${v.commission||10}% | ${active?'AKTIF':'BLOKE'}</span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;gap:4px"><input id="pass_${k}" value="${v.password||''}" style="width:70px;padding:4px" placeholder="modpas"><button onclick="savePass('${k}')" class="btnY" style="padding:4px 6px;font-size:9px">Sove🔑</button></div><div style="display:flex;gap:4px"><input id="com_${k}" type="number" value="${v.commission||10}" style="width:45px;padding:4px"><button onclick="saveCom('${k}')" class="btnY" style="padding:4px 6px;font-size:9px">% </button><button onclick="toggleVend('${k}')" class="${active?'btnR':'btnG'}" style="padding:4px 6px;font-size:9px">${active?'Bloke':'Debloke'}</button><button onclick="delVend('${k}')" class="btnR" style="padding:4px 6px">X</button></div></div></div>`;
});
}
window.savePass=async(nom)=>{let p=document.getElementById('pass_'+nom).value.trim();if(!p)return alert('Modpas vid');let snap=await get(child(ref(db),`config/vendeurs/${nom}`));await set(ref(db,`config/vendeurs/${nom}`),{...snap.val(),password:p});alert(`Modpas ${nom}: ${p} ✅`);loadVend();};
window.saveCom=async(nom)=>{let com=parseInt(document.getElementById('com_'+nom).value)||10;if(com>30)com=10;let snap=await get(child(ref(db),`config/vendeurs/${nom}`));await set(ref(db,`config/vendeurs/${nom}`),{...snap.val(),commission:com});alert(`Com ${nom}: ${com}% ✅`);loadVend();};
window.toggleVend=async(nom)=>{let snap=await get(child(ref(db),`config/vendeurs/${nom}`));await set(ref(db,`config/vendeurs/${nom}`),{...snap.val(),active:!snap.val().active});loadVend();};
window.delVend=async(nom)=>{if(!confirm(`Efase ${nom}?`))return;await remove(ref(db,`config/vendeurs/${nom}`));loadVend();};
loadFerm();loadPrix();loadLimite();loadVend();
</script></body></html>
