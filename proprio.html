<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D VERITE PROPRIO V26.7 M1 1200 FIX</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#e8f5e9;padding:10px}.card{background:#fff;border:2px solid #0a4a2e;border-radius:12px;padding:12px;margin:10px 0}.btn{border:0;border-radius:8px;padding:12px;font-weight:900;cursor:pointer}.btnG{background:#0a4a2e;color:#d4af37}.btnB{background:#1976d2;color:#fff}.inp{width:100%;height:44px;border:2px solid #0a4a2e;border-radius:8px;padding:0 10px;font-weight:800}.row{display:flex;gap:6px;flex-wrap:wrap}.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}.tab{padding:10px 12px;background:#0a4a2e;color:#d4af37;border:0;border-radius:8px;font-weight:800;font-size:12px}.tab.active{background:#d4af37;color:#0a4a2e}.page{display:none}.page.active{display:block}h2{background:#0a4a2e;color:#d4af37;padding:10px;border-radius:8px;text-align:center;font-size:14px}</style></head><body>
<h2>C&D VERITE PROPRIO V26.7 - M1 1200 FIX GLOBAL+PA VANDE</h2>
<div class="tabs"><button class="tab active" onclick="go('prix',this)">Prix GLOBAL/PA VANDE</button><button class="tab" onclick="go('tiraj',this)">Tiraj</button><button class="tab" onclick="go('lim',this)">Limites</button><button class="tab" onclick="go('bloke',this)">Bloke</button><button class="tab" onclick="go('hora',this)">Horaires</button><button class="tab" onclick="go('rap',this)">Rapport</button></div>

<div id="prix" class="page active"><div class="card"><h3>Prix - GLOBAL ak PA VANDE (M1 1200 FIX)</h3><div class="row" style="margin-top:8px"><select id="prixVendeur" class="inp" style="flex:1"><option value="global">GLOBAL</option></select><button class="btn btnB" onclick="loadPrix()">Chaje</button></div><div id="prixStatus" style="margin-top:8px;padding:8px;background:#e8f5e9;border:2px dashed #0a4a2e;border-radius:8px;font-weight:800;font-size:11px">Chwazi GLOBAL oswa yon vandè</div>
<div class="row" style="margin-top:12px">
<div style="flex:1;min-width:80px"><label>1e</label><input id="p1" type="number" class="inp"></div>
<div style="flex:1;min-width:80px"><label>2e</label><input id="p2" type="number" class="inp"></div>
<div style="flex:1;min-width:80px"><label>3e</label><input id="p3" type="number" class="inp"></div>
<div style="flex:1;min-width:80px"><label>M1</label><input id="pm1" type="number" class="inp"></div>
<div style="flex:1;min-width:80px"><label>M2</label><input id="pm2" type="number" class="inp"></div>
<div style="flex:1;min-width:80px"><label>M3</label><input id="pm3" type="number" class="inp"></div>
<div style="flex:1;min-width:80px"><label>L3</label><input id="ppL3" type="number" class="inp"></div>
<div style="flex:1;min-width:80px"><label>L4</label><input id="ppL4" type="number" class="inp"></div>
<div style="flex:1;min-width:80px"><label>L5</label><input id="ppL5" type="number" class="inp"></div>
<div style="flex:1;min-width:80px"><label>Gratis</label><input id="ppGratis" type="number" class="inp"></div>
<div style="flex:1;min-width:80px"><label>Kom %</label><input id="pKom" type="number" class="inp"></div>
</div>
<button class="btn btnG" style="width:100%;margin-top:12px;padding:14px" onclick="savePrix()">Save Prix - RESPÈKTE PA VANDE + ID+SERIAL FIX</button>
<div id="prixList" style="margin-top:10px;font-size:11px"></div>
</div></div>

<div id="tiraj" class="page"><div class="card"><h3>Tiraj - GLOBAL ak PA VANDE</h3><div id="tirajList"></div></div></div>
<div id="lim" class="page"><div class="card"><h3>Limites - GLOBAL ak PA VANDE PA TIRAJ</h3><select id="limVendeur" class="inp"><option value="global">GLOBAL</option></select><select id="limTiraj" class="inp" style="margin-top:6px"><option value="ALL">Tous Tiraj</option></select><div class="row" style="margin-top:8px"><div style="flex:1"><label>BORLET</label><input id="lBor" type="number" class="inp"></div><div style="flex:1"><label>MARYAJ</label><input id="lMar" type="number" class="inp"></div><div style="flex:1"><label>L3</label><input id="lL3" type="number" class="inp"></div><div style="flex:1"><label>L4</label><input id="lL4" type="number" class="inp"></div><div style="flex:1"><label>L5</label><input id="lL5" type="number" class="inp"></div></div><button class="btn btnG" style="width:100%;margin-top:10px" onclick="saveLim()">Save Limite PA TIRAJ</button><div id="limList" style="margin-top:8px;font-size:11px"></div></div></div>
<div id="bloke" class="page"><div class="card"><h3>Bloke Boul - GLOBAL/PA VANDE</h3><input id="bBoul" class="inp" placeholder="Boul ex 22"><select id="bVendeur" class="inp" style="margin-top:6px"><option value="ALL">GLOBAL</option></select><button class="btn btnG" style="width:100%;margin-top:8px" onclick="saveBloke()">Bloke</button><div id="blokeList" style="margin-top:8px"></div></div></div>
<div id="hora" class="page"><div class="card"><h3>Horaires Tiraj - Lundi-Dimanche</h3><select id="hTiraj" class="inp"></select><select id="hVendeur" class="inp" style="margin-top:6px"><option value="ALL">GLOBAL</option></select><div id="hJours"></div><button class="btn btnG" style="width:100%;margin-top:8px" onclick="saveHora()">Save Horaire</button></div></div>
<div id="rap" class="page"><div class="card"><h3>Rapport Proprio</h3><div class="row"><input id="rDu" type="date" class="inp" style="flex:1"><input id="rAu" type="date" class="inp" style="flex:1"><button class="btn btnB" onclick="calcRap()">Kalkile</button></div><div id="rapRes" style="margin-top:10px"></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
try{if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database();
const TIRAJ_DEFAULT=["Borlette Matin","La Suerte 12:30","Haiti 14h","Borlette Soir 18h","Real","Primera dia","Suerte dia","Lote Dom 13:30","Ganamas","Suerte noche","Primera noche","Loteka","Nacional noche","Leidsa"];
let DB={vendeurs:{},prix:{},limites:{},blokeBoul:{},blokeBoulGlobal:{},blokeBoulVendeur:{},horairesTiraj:{}};
function go(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');}
function loadAll(){
 db.ref().on('value',snap=>{
  let v=snap.val()||{};
  DB.vendeurs=v.vendeurs||{};
  DB.prix=v.prix||{};
  DB.limites=v.limites||{};
  DB.blokeBoul=v.blokeBoul||{};
  DB.blokeBoulGlobal=v.blokeBoulGlobal||{};
  DB.blokeBoulVendeur=v.blokeBoulVendeur||{};
  DB.horairesTiraj=v.horairesTiraj||{};
  renderVendeurs();
  renderPrixList();
  renderLimList();
  renderBlokeList();
  renderTirajList();
 });
}
function renderVendeurs(){
 let opts='<option value="global">GLOBAL</option>';
 Object.entries(DB.vendeurs).forEach(([k,v])=>{
  opts+='<option value="'+k+'">'+(v.nom||k)+' ('+(v.serial||k)+') - '+(k.startsWith('v_')?'PA VANDE':'')+'</option>';
 });
 document.getElementById('prixVendeur').innerHTML=opts;
 document.getElementById('limVendeur').innerHTML=opts;
 document.getElementById('bVendeur').innerHTML='<option value="ALL">GLOBAL</option>'+opts;
 document.getElementById('hVendeur').innerHTML='<option value="ALL">GLOBAL</option>'+opts;
 let topts='<option value="ALL">Tous Tiraj</option>';
 TIRAJ_DEFAULT.forEach(t=>{topts+='<option value="'+t+'">'+t+'</option>';});
 document.getElementById('limTiraj').innerHTML=topts;
 document.getElementById('hTiraj').innerHTML=TIRAJ_DEFAULT.map(t=>'<option value="'+t+'">'+t+'</option>').join('');
 let jours=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
 let htmlJ='';
 jours.forEach(j=>{
  htmlJ+='<div class="row" style="margin-top:6px;align-items:center"><div style="width:80px;font-weight:800">'+j+'</div><input id="h_'+j+'_a" type="time" class="inp" style="flex:1"><label style="display:flex;align-items:center;gap:4px"><input id="h_'+j+'_act" type="checkbox" checked> Active</label></div>';
 });
 document.getElementById('hJours').innerHTML=htmlJ;
}
function renderTirajList(){
 let html='';
 TIRAJ_DEFAULT.forEach(t=>{
  html+='<div class="card" style="padding:8px"><b>'+t+'</b> - GLOBAL</div>';
 });
 document.getElementById('tirajList').innerHTML=html;
}
function loadPrix(){
 let k=document.getElementById('prixVendeur').value;
 let p=DB.prix[k] || DB.prix['v_'+k] || {};
 if(k!=='global'){
  let vData=DB.vendeurs[k];
  let serial=vData? vData.serial : k;
  if(DB.prix['v_'+serial]) p=DB.prix['v_'+serial];
  if(DB.prix[serial]) p=Object.assign({},p,DB.prix[serial]);
  if(DB.vendeurs[k] && DB.vendeurs[k].prix) p=Object.assign({},p,DB.vendeurs[k].prix);
 }
 if(k==='global' && !p.p1){
  p=DB.prix.global || {p1:70,p2:8,p3:4,m1:1000,m2:500,m3:100,l3:500,l4:5000,l5:25000,maryajGratis:500,kom:10};
 }
 document.getElementById('p1').value=p.p1||70;
 document.getElementById('p2').value=p.p2||8;
 document.getElementById('p3').value=p.p3||4;
 document.getElementById('pm1').value=p.m1||1000;
 document.getElementById('pm2').value=p.m2||500;
 document.getElementById('pm3').value=p.m3||100;
 document.getElementById('ppL3').value=p.l3||500;
 document.getElementById('ppL4').value=p.l4||5000;
 document.getElementById('ppL5').value=p.l5||25000;
 document.getElementById('ppGratis').value=p.maryajGratis||500;
 document.getElementById('pKom').value=p.kom||10;
 document.getElementById('prixStatus').innerText=(k==='global'?'GLOBAL':'PA VANDE '+k)+' - M1 '+(p.m1||1000)+' - Kounye a modifyab - pou Tamouche mete 1200';
}
function savePrix(){
 let k=document.getElementById('prixVendeur').value;
 let o={p1:+document.getElementById('p1').value,p2:+document.getElementById('p2').value,p3:+document.getElementById('p3').value,m1:+document.getElementById('pm1').value,m2:+document.getElementById('pm2').value,m3:+document.getElementById('pm3').value,l3:+document.getElementById('ppL3').value,l4:+document.getElementById('ppL4').value,l5:+document.getElementById('ppL5').value,maryajGratis:+document.getElementById('ppGratis').value,kom:+document.getElementById('pKom').value,komActive:true,maryajGratisEnabled:true};
 let vData=DB.vendeurs[k];
 let serial=vData? (vData.serial||k) : k;
 let updates={};
 updates['prix/'+k]=o;
 updates['prix/v_'+serial]=o;
 updates['prix/'+serial]=o;
 updates['prix/global']=(k==='global'?o:(DB.prix.global||o));
 if(k!=='global'){
  updates['vendeurs/'+k+'/prix']=o;
  updates['vendeurs/'+k+'/m1']=o.m1;
  updates['vendeurs/'+k+'/kom']=o.kom;
  updates['vendeurs/'+k+'/p1']=o.p1; updates['vendeurs/'+k+'/p2']=o.p2; updates['vendeurs/'+k+'/p3']=o.p3;
 }
 if(k==='global'){
  updates['prix/global']=o;
 }
 db.ref().update(updates).then(()=>{
  alert('✅ Prix Save OK - '+(k==='global'?'GLOBAL M1 '+o.m1:'PA VANDE '+k+' (serial '+serial+') M1 '+o.m1+' - Tamouche ap jwenn 1200 kounye a'));
  loadAll();
 });
}
function renderPrixList(){
 let html='';
 Object.entries(DB.prix).forEach(([k,v])=>{
  if(!v||!v.p1) return;
  let label=k==='global'?'GLOBAL (GLOBAL)':k+' (PA VANDE - RESPÈKTE)';
  html+='<div style="background:#e8f5e9;border:1px solid #0a4a2e;border-radius:6px;padding:6px;margin-top:4px">📌 '+label+' 1e '+v.p1+' 2e '+v.p2+' 3e '+v.p3+' M1 '+v.m1+' M2 '+v.m2+' M3 '+v.m3+' L3 '+v.l3+' L4 '+v.l4+' L5 '+v.l5+' Gratis '+v.maryajGratis+' Kom '+v.kom+'%</div>';
 });
 document.getElementById('prixList').innerHTML=html;
}
function saveLim(){
 let kv=document.getElementById('limVendeur').value;
 let kt=document.getElementById('limTiraj').value;
 let o={bor:+document.getElementById('lBor').value,mar:+document.getElementById('lMar').value,l3:+document.getElementById('lL3').value,l4:+document.getElementById('lL4').value,l5:+document.getElementById('lL5').value};
 let key=kt==='ALL'?(kv==='global'?'global':kv):kt+'_'+kv;
 db.ref('limites/'+key).set(o).then(()=>{alert('Limite Save '+key);});
}
function renderLimList(){
 let html='';
 Object.entries(DB.limites).forEach(([k,v])=>{
  html+='<div>🔒 '+k+' -> BOR '+v.bor+' MAR '+v.mar+'</div>';
 });
 document.getElementById('limList').innerHTML=html;
}
function saveBloke(){
 let boul=document.getElementById('bBoul').value.trim();
 let kv=document.getElementById('bVendeur').value;
 if(!boul) return alert('Mete boul');
 if(kv==='ALL'){
  db.ref('blokeBoulGlobal/'+boul.replace(/\D/g,'')).set(true).then(()=>alert('Bloke GLOBAL '+boul));
 }else{
  db.ref('blokeBoulVendeur/'+kv+'/'+boul.replace(/\D/g,'')).set(true).then(()=>alert('Bloke PA VANDE '+kv+' boul '+boul));
 }
}
function renderBlokeList(){
 let html='GLOBAL: '+Object.keys(DB.blokeBoulGlobal).join(', ')+'<br>';
 html+='PA VANDE: '+Object.keys(DB.blokeBoulVendeur).length+' vandè gen bloke';
 document.getElementById('blokeList').innerHTML=html;
}
function saveHora(){
 let t=document.getElementById('hTiraj').value;
 let v=document.getElementById('hVendeur').value;
 let jours=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
 let updates={};
 jours.forEach(j=>{
  let a=document.getElementById('h_'+j+'_a').value;
  let act=document.getElementById('h_'+j+'_act').checked;
  let key=t+'_'+v;
  updates['horairesTiraj/'+key+'/'+j]={a:a,active:act};
 });
 db.ref().update(updates).then(()=>alert('Horaire Save '+t+' '+v));
}
function calcRap(){document.getElementById('rapRes').innerText='Rapò Proprio - menm lojik ak vandè - itilize prix/global ak prix/vendeur';}
loadAll();
</script></body></html>
