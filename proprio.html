<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D PROPRIO - KOM 10%</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff;padding:10px;padding-bottom:40px}input,select{padding:10px;border-radius:8px;border:none;width:100%;color:#000}button{padding:10px;border-radius:8px;border:none;font-weight:bold;cursor:pointer}.btnY{background:#facc15;color:#000}.btnG{background:#22c55e;color:#fff}.btnB{background:#3b82f6;color:#fff}.btnR{background:#ef4444;color:#fff}.card{background:#1e293b;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #334155}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vendRow{display:flex;gap:6px;align-items:center;background:#0f172a;padding:8px;border-radius:8px;margin-bottom:6px}</style></head>
<body>
<h2 style="text-align:center;color:#facc15">👑 C&D PROPRIO - GESTION KOMISYON</h2>

<div class="card">
<h3 style="margin:0 0 10px;color:#facc15">👥 Vendeurs - Komisyon Modifiable (10% pa defo)</h3>
<div style="display:flex;gap:6px;margin-bottom:10px"><input id="newVendNom" placeholder="Non vendeur"><input id="newVendPass" placeholder="Modpas" style="width:120px"><input id="newVendKom" type="tel" inputmode="numeric" value="10" style="width:70px;text-align:center;font-weight:bold"><button onclick="addVendeur()" class="btnY">+ Ajoute</button></div>
<div id="listVendeurs"></div>
<div style="font-size:11px;color:#94a3b8;margin-top:8px">💡 Mete 10 epi klike % jòn - Vandè a ap wè li touswit apre Exit/Rekonekte</div>
</div>

<div class="card">
<h3 style="margin:0 0 10px">📊 Rapò Global - Vente / Komisyon / Peye / Balans</h3>
<div class="grid2"><div><label style="font-size:11px">Du:</label><input type="date" id="rapDu"></div><div><label style="font-size:11px">Au:</label><input type="date" id="rapAu"></div></div>
<div style="display:flex;gap:6px;margin-top:8px"><select id="rapVend" style="flex:1"><option value="all">Tout Vendeurs</option></select><select id="rapTiraj" style="flex:1"><option value="all">Tout Tiraj</option><option>FL MIDI</option><option>FL SOIR</option><option>NY MIDI</option><option>NY SOIR</option><option>GA MIDI</option><option>GA SOIR</option></select><button onclick="loadRap()" class="btnB">OK</button></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:12px">
<div style="background:#0f172a;padding:10px;border-radius:10px;text-align:center;border:1px solid #334155"><div style="font-size:9px">VANN</div><b id="rVente">0G</b></div>
<div style="background:#fef3c7;color:#000;padding:10px;border-radius:10px;text-align:center"><div style="font-size:9px;font-weight:bold">KOMISYON</div><b id="rKom">0G</b></div>
<div style="background:#fee2e2;color:#000;padding:10px;border-radius:10px;text-align:center"><div style="font-size:9px;font-weight:bold">PAYE</div><b id="rPaye">0G</b></div>
<div style="background:#dcfce7;color:#000;padding:10px;border-radius:10px;text-align:center"><div style="font-size:9px;font-weight:bold">BALANS</div><b id="rBal">0G</b></div>
</div>
<div id="detailVendeurs" style="margin-top:12px"></div>
</div>

<div class="card"><h3>🔒 Fermeture Tiraj</h3><div id="fermList"></div></div>
<div class="card"><h3>🎯 Antre Résultats</h3><div class="grid2"><input type="date" id="resDate"><select id="resTiraj"><option>FL MIDI</option><option>FL SOIR</option><option>NY MIDI</option><option>NY SOIR</option><option>GA MIDI</option><option>GA SOIR</option></select></div><div class="grid2" style="margin-top:6px"><input id="resP1" placeholder="1er Lot"><input id="resP2" placeholder="2eme Lot"><input id="resP3" placeholder="3eme Lot"><input id="resL3" placeholder="Loto3"></div><button onclick="saveRes()" class="btnG" style="width:100%;margin-top:8px">💾 Save Résultat</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set, update, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};const app=initializeApp(cfg);const db=getDatabase(app);
let prix={bolet1:50,bolet2:20,bolet3:10,loto3:500};
function haitiDate(){let h=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Port-au-Prince"}));return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;}

window.addVendeur=async()=>{
  let nom=document.getElementById('newVendNom').value.trim().toLowerCase(); let pass=document.getElementById('newVendPass').value.trim(); let kom=parseInt(document.getElementById('newVendKom').value)||10;
  if(!nom||!pass)return alert('Mete non ak modpas');
  await set(ref(db,`config/vendeurs/${nom}`),{password:pass,commission:kom,pourcent:kom});
  document.getElementById('newVendNom').value=''; document.getElementById('newVendPass').value=''; alert(`✅ ${nom} kreye ak ${kom}%`);
  loadVendeurs();
};

window.saveKom=async(nom)=>{
  let input=document.getElementById('kom-'+nom); let val=parseInt(input.value)||10; if(val<1)val=1; if(val>50)val=50;
  await update(ref(db),{
    [`config/vendeurs/${nom}/commission`]:val,
    [`config/vendeurs/${nom}/pourcent`]:val
  });
  await set(ref(db,`config/commission`),{pourcent:10,commission:10});
  alert(`✅ ${nom} kounya ${val}% - Vandè a ap wè li apre Exit/Rekonekte`);
  loadVendeurs(); loadRap();
};

window.delVend=async(nom)=>{if(!confirm(`Efase ${nom}?`))return; await remove(ref(db,`config/vendeurs/${nom}`)); loadVendeurs();};

async function loadVendeurs(){
  let snap=await get(child(ref(db),'config/vendeurs')); let div=document.getElementById('listVendeurs'); let sel=document.getElementById('rapVend'); sel.innerHTML='<option value="all">Tout Vendeurs</option>'; if(!snap.exists()){div.innerHTML='Pa gen vendeur';return;}
  let html=''; snap.forEach(c=>{
    let v=c.key; let d=c.val(); let kom=d.commission!==undefined?d.commission:(d.pourcent||10);
    html+=`<div class="vendRow"><span style="flex:1;font-weight:bold">${v}</span><span style="font-size:10px;color:#94a3b8">${d.password||''}</span><input id="kom-${v}" type="tel" inputmode="numeric" value="${kom}" style="width:60px;text-align:center;font-weight:bold;border:2px solid #facc15"><button onclick="saveKom('${v}')" class="btnY" style="padding:8px 12px">%</button><button onclick="delVend('${v}')" class="btnR" style="padding:8px 10px">x</button></div>`;
    sel.innerHTML+=`<option value="${v}">${v} (${kom}%)</option>`;
  }); div.innerHTML=html;
}

window.loadRap=async()=>{
  let du=document.getElementById('rapDu').value, au=document.getElementById('rapAu').value, fv=document.getElementById('rapVend').value, ft=document.getElementById('rapTiraj').value;
  let fs=await get(child(ref(db),'fiches')); let rs=await get(child(ref(db),'resultats')); let vs=await get(child(ref(db),'config/vendeurs'));
  let res=rs.exists()?rs.val():{}; let vendeursKom={};
  if(vs.exists()) vs.forEach(v=>{ vendeursKom[v.key]=parseInt(v.val().commission||v.val().pourcent||10); });
  if(!fs.exists()){document.getElementById('rVente').innerText='0G';document.getElementById('rKom').innerText='0G';document.getElementById('rPaye').innerText='0G';document.getElementById('rBal').innerText='0G';document.getElementById('detailVendeurs').innerHTML='Pa gen fich';return;}
  let all=Object.values(fs.val()).filter(f=>{let fd=f.haitiDate||f.date.split('T')[0]; if(du&&fd<du)return false; if(au&&fd>au)return false; if(fv!=='all'&& (f.vendeur||f.idVendeur||'').toLowerCase()!==fv.toLowerCase())return false; if(ft!=='all'&&!(f.tirajs||[f.tiraj]||[]).includes(ft))return false; return true;});
  let vente=0,komTot=0,paye=0;
  let parVendeur={};
  all.forEach(f=>{
    let v=(f.vendeur||f.idVendeur||'').toLowerCase(); let t=parseInt(f.total||0); let komP=vendeursKom[v]!==undefined?vendeursKom[v]:(f.commission||10); if(isNaN(komP))komP=10;
    vente+=t; let kom=Math.floor(t*komP/100); komTot+=kom;
    if(!parVendeur[v]) parVendeur[v]={vente:0,kom:0,komP:komP}; parVendeur[v].vente+=t; parVendeur[v].kom+=kom;
    let fd=f.haitiDate||f.date.split('T')[0]; (f.tirajs||[]).forEach(ti=>{
      let r=res[fd+'_'+ti]||res[fd+'_'+ti.replace(' ','_')]; if(!r)return;
      (f.details||[]).forEach(dd=>{let b=String(dd.boul).trim(),m=parseInt(dd.montan)||0,p1=String(r.premier||'').trim(),p2=String(r.deuxieme||'').trim(),p3=String(r.troisieme||'').trim(),l3=String(r.loto3||'').trim(); if(dd.type==='bolet'){if(b===p1)paye+=m*prix.bolet1;else if(b===p2)paye+=m*prix.bolet2;else if(b===p3)paye+=m*prix.bolet3;} if(dd.type==='loto3'&&b===l3)paye+=m*prix.loto3;});
    });
  });
  document.getElementById('rVente').innerText=vente+'G'; document.getElementById('rKom').innerText=komTot+'G'; document.getElementById('rPaye').innerText=paye+'G'; document.getElementById('rBal').innerText=(vente-komTot)+'G';
  let html='<div style="margin-top:10px">'; Object.entries(parVendeur).forEach(([nom,d])=>{let bal=d.vente-d.kom; html+=`<div style="background:#0f172a;padding:8px;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;font-size:12px"><span><b>${nom}</b> (${d.komP}%) - V:${d.vente}G</span><span>K:${d.kom}G | B:${bal}G</span></div>`;}); html+='</div>'; document.getElementById('detailVendeurs').innerHTML=html;
};

window.saveRes=async()=>{
  let date=document.getElementById('resDate').value, tiraj=document.getElementById('resTiraj').value, p1=document.getElementById('resP1').value.trim(),p2=document.getElementById('resP2').value.trim(),p3=document.getElementById('resP3').value.trim(),l3=document.getElementById('resL3').value.trim();
  if(!date||!tiraj||!p1)return alert('Mete dat ak tiraj ak 1er lot');
  await set(ref(db,`resultats/${date}_${tiraj}`),{premier:p1,deuxieme:p2,troisieme:p3,loto3:l3,date:date,tiraj:tiraj});
  alert(`✅ Résultat ${tiraj} ${date} save!`); loadRap();
};

(async()=>{
  document.getElementById('rapDu').value=haitiDate(); document.getElementById('rapAu').value=haitiDate(); document.getElementById('resDate').value=haitiDate();
  let fs=await get(child(ref(db),'config/fermeture')); let div=document.getElementById('fermList'); if(fs.exists()){let h=''; Object.entries(fs.val()).forEach(([k,v])=>{h+=`<div style="display:flex;justify-content:space-between;font-size:12px;background:#0f172a;padding:6px;border-radius:6px;margin-bottom:4px"><span>${k}</span><span>${v}</span></div>`;}); div.innerHTML=h;}
  loadVendeurs(); loadRap();
})();
</script></body></html>
