<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROPRIO C&D V73 + RAPÒ</title>
<style>
*{box-sizing:border-box}body{background:#0f172a;color:#fff;font-family:sans-serif;margin:0;padding:10px}
h1{color:#facc15;text-align:center;margin:6px 0}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:10px;margin-bottom:10px}
input,select{padding:8px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
button{background:#facc15;color:#000;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th{background:#0f172a;color:#facc15;padding:6px;text-align:left}
td{padding:6px;border-bottom:1px solid #334155}
.bal-pos{color:#22c55e;font-weight:bold}
.bal-neg{color:#ef4444;font-weight:bold}
</style>
</head>
<body>

<script>
// 🔐 MODPAS C&D123 MODIFIABLE
let DEF_PASS="C&D123";
let curPass=localStorage.getItem("proprio_custom_pass")||DEF_PASS;
function checkPass(){
let auth=sessionStorage.getItem("proprio_auth");
if(auth===curPass) return true;
let p=prompt("🔐 Antre Modpas PROPRIO:");
if(p!==curPass){
document.body.innerHTML="<div style='height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center'><h1>⛔ Aksè Refize</h1><button onclick='sessionStorage.clear();location.reload()' style='margin-top:20px;padding:10px 20px;background:#facc15;border:none;border-radius:10px'>Resevwa</button></div>";
throw "blocked";
}
sessionStorage.setItem("proprio_auth",curPass);
}
checkPass();
function chanjeModpas(){
let a=prompt("Ansyen modpas:"); if(a!==curPass){alert("⛔ Pa bon");return;}
let n=prompt("Nouvo modpas:"); if(!n||n.length<3){alert("Twò kout");return;}
localStorage.setItem("proprio_custom_pass",n); curPass=n; sessionStorage.setItem("proprio_auth",n); alert("✅ Nouvo modpas: "+n);
}
</script>

<h1>👑 C&D PROPRIO V73</h1>
<div style="text-align:center;margin-bottom:8px">
<button onclick="chanjeModpas()" style="background:#334155;color:white;font-size:11px">🔑 Chanje Modpas</button>
<button onclick="sessionStorage.clear();location.reload()" style="background:#ef4444;color:white;font-size:11px">🚪 Dekonekte</button>
</div>

<div class="card">
<b>📊 RAPPORT VENTE - Du... Au...</b>
<div class="row">
<div style="flex:1"><label style="font-size:11px">Du:</label><input type="date" id="dateDu" style="width:100%"></div>
<div style="flex:1"><label style="font-size:11px">Au:</label><input type="date" id="dateAu" style="width:100%"></div>
<div style="flex:1"><label style="font-size:11px">Vendeur:</label><select id="filtreVendeur" style="width:100%"><option value="all">Tout Vendeur</option></select></div>
<button onclick="chajeRapò()" style="margin-top:16px">🔍 OK</button>
</div>

<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
<div style="flex:1;background:#0f172a;padding:8px;border-radius:8px;text-align:center"><div style="font-size:10px;color:#94a3b8">VENTE</div><b id="totalVente" style="color:#fff;font-size:16px">0G</b></div>
<div style="flex:1;background:#0f172a;padding:8px;border-radius:8px;text-align:center"><div style="font-size:10px;color:#94a3b8">COMISIÓN 10%</div><b id="totalCom" style="color:#facc15;font-size:16px">0G</b></div>
<div style="flex:1;background:#0f172a;padding:8px;border-radius:8px;text-align:center"><div style="font-size:10px;color:#94a3b8">PAYÉ</div><b id="totalPaye" style="color:#22c55e;font-size:16px">0G</b></div>
<div style="flex:1;background:#0f172a;padding:8px;border-radius:8px;text-align:center"><div style="font-size:10px;color:#94a3b8">BALANCE</div><b id="totalBal" style="color:#ef4444;font-size:16px">0G</b></div>
</div>
</div>

<div class="card">
<table>
<thead><tr><th>Vendeur</th><th>Vente</th><th>Com 10%</th><th>Payé</th><th>Balance</th><th>Aksyon</th></tr></thead>
<tbody id="tbodyRapò"></tbody>
</table>
<div id="detailFich" style="margin-top:10px;font-size:11px;color:#94a3b8"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = { databaseURL: "https://cerdieulotto-default-rtdb.firebaseio.com" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
window.db=db; window.ref=ref; window.get=get; window.child=child; window.set=set;

window.onload=()=>{
let t=new Date().toISOString().split('T')[0];
document.getElementById('dateDu').value=t;
document.getElementById('dateAu').value=t;
chajeRapò();
};
</script>

<script>
let paiementsCache={};

async function chajeRapò(){
let dateDu=document.getElementById('dateDu').value;
let dateAu=document.getElementById('dateAu').value;
let filtre=document.getElementById('filtreVendeur').value;
if(!dateDu) dateDu=new Date().toISOString().split('T')[0];
if(!dateAu) dateAu=new Date().toISOString().split('T')[0];

let snap=await get(child(ref(db),'fiches'));
if(!snap.exists()){document.getElementById('tbodyRapò').innerHTML='<tr><td colspan=6>Pa gen fich</td></tr>';return;}
let all=Object.values(snap.val());

// Chaje paiements
try{
let snapPay=await get(child(ref(db),'paiements'));
if(snapPay.exists()) paiementsCache=snapPay.val();
}catch(e){}

let filtreData=all.filter(f=>{
let fDate=f.date?f.date.split('T')[0]:'';
if(dateDu && fDate < dateDu) return false;
if(dateAu && fDate > dateAu) return false;
if(filtre!=='all' && f.vendeur!==filtre && f.idVendeur!==filtre) return false;
return true;
});

let parVendeur={};
filtreData.forEach(f=>{
let v=f.vendeur||f.idVendeur||'Inconnu';
if(!parVendeur[v]) parVendeur[v]={vente:0, fich:0};
parVendeur[v].vente+=parseInt(f.total||f.montan||0)||0;
parVendeur[v].fich++;
});

// Update select vendeur
let sel=document.getElementById('filtreVendeur');
let vendeursList=[...new Set(all.map(f=>f.vendeur||f.idVendeur))];
if(sel.options.length<=1){
vendeursList.forEach(v=>{
let opt=document.createElement('option'); opt.value=v; opt.textContent=v; sel.appendChild(opt);
});
}

let tbody=document.getElementById('tbodyRapò');
tbody.innerHTML='';
let totVente=0, totCom=0, totPaye=0, totBal=0;

Object.keys(parVendeur).forEach(v=>{
let vente=parVendeur[v].vente;
let com=Math.round(vente*0.1);
let paye=parseInt(paiementsCache[v+`_${dateDu}_${dateAu}`]?.montant || paiementsCache[v]?.montant || 0);
let balance=vente - com - paye;
totVente+=vente; totCom+=com; totPaye+=paye; totBal+=balance;
tbody.innerHTML+=`<tr>
<td><b>${v}</b><br><span style="font-size:10px">${parVendeur[v].fich} fich</span></td>
<td>${vente}G</td>
<td style="color:#facc15">${com}G</td>
<td style="color:#22c55e"><input id="paye_${v}" type="number" value="${paye}" style="width:70px;padding:4px" onchange="sovePaye('${v}')"></td>
<td class="${balance>=0?'bal-pos':'bal-neg'}">${balance}G</td>
<td><button onclick="sovePaye('${v}')" style="padding:4px 6px;font-size:10px">💾</button> <button onclick="detailVendeur('${v}')" style="padding:4px 6px;font-size:10px;background:#334155;color:white">👁️</button></td>
</tr>`;
});

document.getElementById('totalVente').innerText=totVente+'G';
document.getElementById('totalCom').innerText=totCom+'G';
document.getElementById('totalPaye').innerText=totPaye+'G';
document.getElementById('totalBal').innerText=totBal+'G';
}

async function sovePaye(vendeur){
let dateDu=document.getElementById('dateDu').value;
let dateAu=document.getElementById('dateAu').value;
let input=document.getElementById('paye_'+vendeur);
let montant=parseInt(input.value)||0;
let key=`${vendeur}_${dateDu}_${dateAu}`;
try{
await set(ref(db,`paiements/${key}`),{vendeur,montant,dateDu,dateAu,date:new Date().toISOString()});
alert(`✅ Payé ${montant}G pou ${vendeur} sove!`);
chajeRapò();
}catch(e){alert('Erè: '+e.message);}
}
window.sovePaye=sovePaye;

async function detailVendeur(v){
let dateDu=document.getElementById('dateDu').value;
let dateAu=document.getElementById('dateAu').value;
let snap=await get(child(ref(db),'fiches'));
let all=Object.values(snap.val());
let f= all.filter(x=> (x.vendeur===v||x.idVendeur===v) && x.date.split('T')[0]>=dateDu && x.date.split('T')[0]<=dateAu);
let html=`<b>Detail ${v} Du ${dateDu} Au ${dateAu}:</b><br>`;
f.slice(-10).forEach(d=>{
html+=`${d.date.split('T')[0]} - ${d.tiraj} - ${d.total}G - ${d.fiches?.length||1} fich<br>`;
});
document.getElementById('detailFich').innerHTML=html;
}
window.detailVendeur=detailVendeur;
window.chajeRapò=chajeRapò;
</script>
</body>
</html>
