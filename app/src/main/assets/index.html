function getTrueNow(){return new Date(Date.now()+serverOffset);}function getHaitiTime(){try{return new Date(getTrueNow().toLocaleString('en-US',{timeZone:'America/Port-au-Prince'}));}catch(e){return new Date();}}

function getTirajForVendeur(){try{if(CUR&&CUR.proprioId&&DB.tiragesByProprio[CUR.proprioId]&&Object.keys(DB.tiragesByProprio[CUR.proprioId]).length>0){let m={};Object.entries(DB.tiragesByProprio[CUR.proprioId]).forEach(kv=>{m[kv[0]]=kv[1].heure||kv[1];});return m;}if(CUR&&CUR.proprioId&&DB.heuresByProprio[CUR.proprioId]&&Object.keys(DB.heuresByProprio[CUR.proprioId]).length>0) return DB.heuresByProprio[CUR.proprioId];return Object.assign({},Object.fromEntries(TIRAJ_DEFAULT),DB.heures||{});}catch(e){return Object.fromEntries(TIRAJ_DEFAULT);}}

// ✅ SELMAN SA A TE AJOUTE - SYNC BIZNIS NON AUTO - SI NON BIZNIS CHANJE NAN PROPRIO, LI CHANJE OTOMATIKMAN NAN VANDE A TOU
function getBusinessName(){
  try{
    let pid=CUR?CUR.proprioId:null;
    if(!pid) return "C&D VERITE LOTTO";
    // PRIORITE 1 - businesses[pid].businessName - Sa proprio mete nan 7-Entete
    if(DB.businesses[pid]&&DB.businesses[pid].businessName&&DB.businesses[pid].businessName.length>2) return DB.businesses[pid].businessName;
    if(DB.businesses[pid]&&DB.businesses[pid].nom&&DB.businesses[pid].nom.length>2) return DB.businesses[pid].nom;
    // PRIORITE 2 - headers[pid] - ancien system
    if(DB.headers[pid]&&DB.headers[pid].businessName.length>2) return DB.headers[pid].businessName;
    if(DB.headers[pid]&&DB.headers[pid].nomBiznis&&DB.headers[pid].nomBiznis.length>2) return DB.headers[pid].nomBiznis;
    // PRIORITE 3 - proprios[pid]
    if(DB.proprios[pid]){
      let p=DB.proprios[pid];
      if(typeof p==='string'&&p.length>2) return p;
      if(p.businessName&&p.businessName.length>2) return p.businessName;
    }
    return "C&D VERITE LOTTO";
  }catch(e){return "C&D VERITE LOTTO";}
}

function calcMaryajGratis(bets){const MAX_GRATIS=2;let seuil=50, prixGratis=500;let boulBets=bets.filter(b=>b.type==='boul'&&b.mise>=seuil);if(boulBets.length<2) return {gratisList:[], count:0, seuil, MAX_GRATIS, prixGratis};let nums=boulBets.map(b=>b.numero.padStart(2,'0'));let allCombos=[];for(let i=0;i<nums.length;i++){for(let j=i+1;j<nums.length;j++){allCombos.push({numero:nums[i]+nums[j], base:nums[i]+'x'+nums[j]});}}let gratisList=[];for(let k=0;k<Math.min(allCombos.length, MAX_GRATIS);k++){gratisList.push({numero:allCombos[k].numero, type:'maryaj', mise:0, gratis:true, prix:prixGratis, base:allCombos[k].base});}return {gratisList, count:gratisList.length, seuil, MAX_GRATIS, prixGratis};}

let CUR_PAY=null,CUR_PAY_GAIN=0;async function stepPaye1(){let id=document.getElementById('payId').value.trim().toUpperCase();if(!id) return;let snap=await db.ref('tickets/'+id).once('value');let t=snap.val();if(!t) return;let du=t.dateHaiti||t.date||getHaitiDateStr();let resSnap=await db.ref('results').once('value');let allRes=resSnap.val()||{};let resultsForDate={};Object.values(allRes).forEach(r=>{if(r&&r.dat==du) resultsForDate[r.tirage]=r;});let calc=calcGainForTicket({bets:[...(t.bets||[]),...(t.gratisBets||[])],tirages:t.tirages},t.prix||getMyPrix(),resultsForDate);if(calc.gain<=0){alert('PA GANYAN');return;}CUR_PAY=t;CUR_PAY_GAIN=calc.gain;document.getElementById('payRes').innerHTML='<h3>GANYAN $'+calc.gain.toFixed(2)+'</h3>';document.getElementById('stepPay1').style.display='none';document.getElementById('stepPay2').style.display='block';}
function stepPaye2(){document.getElementById('stepPay2').style.display='none';document.getElementById('stepPay3').style.display='block';}
async function doPeyeConf(){await db.ref('tickets/'+CUR_PAY.id).update({paye:true,payeGain:CUR_PAY_GAIN});let bn=getBusinessName();let txt=bn+'\n*** PREV PEYMAN ***\nId: '+CUR_PAY.id+'\nGanyan: $'+CUR_PAY_GAIN.toFixed(2)+'\n';let rp=document.getElementById('payPrint');rp.style.display='block';rp.innerHTML=txt.replace(/\n/g,'<br>');rp.dataset.plain=txt;document.getElementById('btnPayPrint').style.display='block';printBT(txt);}
function printPeye(){let rp=document.getElementById('payPrint');printBT(rp.dataset.plain);}
function goTab(id,el){document.querySelectorAll('.tabPage').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');}
let curV=localStorage.getItem('curV');if(curV){try{CUR=JSON.parse(curV);openMain();}catch(e){hideSplash();}}else{hideSplash();}
document.getElementById('logoFile').addEventListener('change',function(){let f=this.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{MY_LOGO=e.target.result;localStorage.setItem('verite_logo',MY_LOGO);if(db&&CUR&&CUR.proprioId) uploadLogoFirebase(MY_LOGO);applyLogo();applyBusinessName();};r.readAsDataURL(f);});
</script></body></html>
