function calcGainForTicket(t,prix,resultsForDate){let gain=0;for(let ti=0;ti<(t.tirages||[]).length;ti++){let tirage=t.tirages[ti];let res=Object.values(resultsForDate||{}).find(function(r){return r&&r.tirage==tirage;});if(!res) continue;let r1=(res.r1||'').toString().padStart(2,'0'),r2=(res.r2||'').toString().padStart(2,'0'),r3=(res.r3||'').toString().padStart(2,'0');for(let b=0;b<(t.bets||[]).length;b++){let bet=t.bets[b],raw=(bet.numero||'').trim(),mise=parseFloat(bet.mise||0);if(bet.type==='boul'){let num=raw.padStart(2,'0');if(num==r1) gain+=mise*(prix.p1||50);else if(num==r2) gain+=mise*(prix.p2||20);else if(num==r3) gain+=mise*(prix.p3||10);}}}return {gain:gain};}

async function stepPaye1(){var id=document.getElementById('payId').value.trim().toUpperCase();if(!id){alert('Mete ID');return;}var snap=await db.ref('tickets/'+id).once('value');var t=snap.val();var res=document.getElementById('payRes');if(!t){alert('Pa jwenn: '+id);return;}if(t.annule){alert('ANILE - pa ka peye');return;}if(t.paye){alert('DEJA PEYE: $'+(t.payeGain||0));return;}var du=t.date||getHaitiDateStr();var resSnap=await db.ref('results').once('value');var allRes=resSnap.val()||{};var resultsForDate={};Object.values(allRes).forEach(function(r){if(r&&r.dat==du) resultsForDate[r.tirage]=r;});var prixT=t.prix||getMyPrix();var calc=calcGainForTicket({bets:t.bets,tirages:t.tirages||[]},prixT,resultsForDate);if(calc.gain<=0){alert('PA GANYAN');return;}CUR_PAY_TICKET=t;CUR_PAY_GAIN=calc.gain;res.innerHTML='<b>ID:</b> '+t.id+'<br><b>Gain:</b> $'+calc.gain.toFixed(2);document.getElementById('stepPay1').style.display='none';document.getElementById('stepPay2').style.display='block';}

async function doPeyeConf(){if(!CUR_PAY_TICKET) return;try{var chk=await db.ref('tickets/'+CUR_PAY_TICKET.id+'/paye').once('value');if(chk.val()===true){alert('Deja peye!');resetPaye();return;}await db.ref('tickets/'+CUR_PAY_TICKET.id).update({paye:true,payeAt:new Date().toISOString(),payeBy:CUR.serial,payeGain:CUR_PAY_GAIN});var txt='*** FICH GANYAN - PEYE ***\n\nID: '+CUR_PAY_TICKET.id+'\nGAIN: $'+CUR_PAY_GAIN.toFixed(2)+'\n\n';var rp=document.getElementById('payPrint');rp.innerText=txt;rp.dataset.plain=txt;rp.style.display='block';document.getElementById('btnPayPrint').style.display='block';alert('PEYE OK: $'+CUR_PAY_GAIN.toFixed(2));printPeye();}catch(e){alert(e.message);}}
function printPeye(){var rp=document.getElementById('payPrint');var t=rp.dataset.plain||rp.innerText;if(!t){alert('Kalkile avan');return}printBT(t);}
async function calcR(){try{let du=document.getElementById('rdu').value,au=document.getElementById('rau').value;if(!du) du=getHaitiDateStr();if(!au) au=getHaitiDateStr();let rres=document.getElementById('rres');rres.style.display='block';rres.innerHTML='Kalkil...';let snap=await db.ref('tickets').once('value');let all=snap.val()||{};let vente=0,annule=0;Object.values(all).forEach(function(t){let td=t.date||'';if(td<du||td>au) return;if(String(t.serial)!=String(CUR.serial)) return;if(t.annule){annule++;return;}vente+=t.total||0;});let logoU=getLogoUrl();let logoH=logoU&&logoU.length>100?'<img src="'+logoU+'" style="width:60px;height:60px;border-radius:50%;display:block;margin:6px auto;border:2px solid #0a4a2e;object-fit:cover">':'<div style="width:60px;height:60px;border-radius:50%;background:#0a4a2e;color:#d4af37;display:flex;align-items:center;justify-content:center;margin:6px auto;font-weight:900">C&D</div>';rres.innerHTML=logoH+'<div style="background:#0a4a2e;color:#d4af37;padding:12px;text-align:center">RAPO '+du+' -> '+au+'</div><div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px dashed #ccc"><span>Vant</span><b>$'+vente.toFixed(2)+'</b></div><div style="display:flex;justify-content:space-between;padding:12px"><span>Anile</span><b>'+annule+'</b></div>';let txtR='C&D VERITE LOTTO\n\nDu: '+du+'\nAu: '+au+'\nVant: $'+vente.toFixed(2)+'\nAnile: '+annule+'\n';let rp=document.getElementById('rprint');rp.style.display='block';rp.innerHTML=logoH+'<div style="white-space:pre-wrap;text-align:center">'+txtR.replace(/\n/g,'<br>')+'</div>';rp.dataset.plain=txtR;}catch(e){alert(e.message);}}
function printRapport(){let rp=document.getElementById('rprint');let t=rp.dataset.plain||rp.innerText;if(!t){alert('Kalkile avan');return}printBT(t);}
function goTab(id,el){document.querySelectorAll('.tabPage').forEach(function(p){p.classList.remove('active');p.style.display='none';});let target=document.getElementById(id);if(target){target.classList.add('active');target.style.display='block';}document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});if(el)el.classList.add('active');window.scrollTo(0,0);}
function scanAparèy(){let res=document.getElementById('scanResult');res.innerHTML='Ap chèche...';try{if(window.AndroidPrinter&&window.AndroidPrinter.scanDevices){let j=window.AndroidPrinter.scanDevices();let devs=JSON.parse(j);let html='';devs.forEach(function(d){html+='<div onclick="choisiAparèy(\''+d.mac+'\',\''+d.name+'\')" style="background:#fff;border:2px solid #0a4a2e;padding:10px;margin:4px;border-radius:8px">📟 '+d.name+'</div>';});res.innerHTML=html;return;}}catch(e){}res.innerHTML='Sunmi Interne';}
function choisiAparèy(mac,name){document.getElementById('chosenName').innerText=name;document.getElementById('chosenMac').innerText=mac;document.getElementById('configSection').style.display='block';localStorage.setItem('selectedPrinterMac',mac);}
function anrejistreAparèy(){document.getElementById('configSection').innerHTML='✅ Anrejistre';}
function saveLogo(){if(!MY_LOGO){alert('Chwazi logo');return;}localStorage.setItem('verite_logo',MY_LOGO);alert('Logo sove');location.reload();}
function clearLogo(){MY_LOGO='';localStorage.removeItem('verite_logo');alert('Efase');location.reload();}
let curV=localStorage.getItem('curV');if(curV){try{CUR=JSON.parse(curV);openMain();}catch(e){hideSplash();}}
setTimeout(function(){hideSplash();showDeviceSerial();},800);
document.getElementById('logoFile').addEventListener('change',function(){let f=this.files[0];if(!f)return;let r=new FileReader();r.onload=function(e){MY_LOGO=e.target.result;localStorage.setItem('verite_logo',MY_LOGO);let big=document.getElementById('logoBigPreview');if(big){big.src=MY_LOGO;big.style.display='block';}let inf=document.getElementById('logoInfo');if(inf) inf.innerText='Pare';};r.readAsDataURL(f);});
</script></body></html>
