<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>CD V27.1 FIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#eef2f7}
.h{background:#0a4a2e;color:#d4af37;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:100}
.card{background:#fff;border-radius:12px;padding:12px;margin:8px;box-shadow:0 2px 6px rgba(0,0,0,.1);border-left:4px solid #0a4a2e}
.btn{padding:16px;border:0;border-radius:10px;color:#fff;font-weight:800;width:100%;font-size:16px}
.btnG{background:#0a4a2e;color:#d4af37;border:2px solid #d4af37}
.btnB{background:#0a4a2e;color:#d4af37}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a4a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999}
.tabPage{display:none}.tabPage.active{display:block}
.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid #0a4a2e;z-index:5000;height:60px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:0;background:#eee}
.tab.active{background:#0a4a2e;color:#d4af37}
</style>
</head>
<body>

<div id='splash' onclick='hideSplash()'>
<div style='width:110px;height:110px;border:3px solid #d4af37;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;font-size:36px;color:#0a4a2e;font-weight:900'>C&D</div>
<div style='color:#d4af37;font-weight:800;margin-top:15px;font-size:22px'>C&D VERITE LOTTO</div>
<div style='color:#fff;margin-top:8px'>V27.1 FIX - KLIKE POU OUVRI</div>
</div>

<div class='h'><div><b>Vendeur Test</b><br><small style='background:#d4af37;color:#0a4a2e;padding:2px 6px;border-radius:4px'>FIX MODE</small></div><button onclick='hideSplash()' style='background:#d4af37;color:#0a4a2e;border:0;padding:8px 12px;border-radius:6px'>OUVRI</button></div>

<div id='pV' class='tabPage active'>
<div class='card'><h3>1- Vendre (TEST)</h3><p>App la ouvè! Si ou wè sa a, FIX la mache.</p><button class='btn btnG' style='margin-top:10px' onclick='alert("VANN TEST OK")'>TEST VANN</button></div>
</div>

<div id='pP' class='tabPage'>
<div class='card'><h3>5- Paramet - SÈLMAN SCAN</h3>
<div style='background:#fffde7;border:3px solid #ffc107;border-radius:12px;padding:12px;margin-top:12px'>
<div style='background:#fff;border:2px solid #0a4a2e;border-radius:12px;padding:12px'>
<div style='display:flex;gap:8px'>
<button class='btn btnG' style='flex:2' onclick='scanAparèyYo()'>🔍 SCAN APARÈY YO</button>
<button class='btn' style='background:#00c853;color:#fff;flex:1;display:none;' id='btn-konekte' onclick='konekteAparèy()'>✅ KONEKTE</button>
</div>
<div id='printer-status-univ' style='margin-top:10px;font-weight:800;background:#eef2f7;padding:10px;border-radius:8px'>Pa konekte - Klike SCAN</div>
<div id='device-list-univ' style='margin-top:12px;max-height:400px;overflow:auto;'></div>
<div id='printerSaved' style='background:#e8f5e9;border:2px solid #2e7d32;border-radius:8px;padding:8px;margin-top:10px;display:none'></div>
</div>
<button class='btn btnB' style='margin-top:12px' onclick='testPrint()'>🧪 TESTE</button>
</div>
</div>
</div>

<div class='tabs'><button class='tab active' onclick='goTab("pV",this)'>1-Vendre</button><button class='tab' onclick='goTab("pP",this)'>5-Paramet</button></div>

<script>
var currentPrinter=null, aparèyChwazi=null, aparèyJwenn=[];

function hideSplash(){
  var sp=document.getElementById('splash');
  if(sp){ sp.style.display='none'; }
}

// Fòse ouvri apre 1 segonn menm si gen erè
setTimeout(hideSplash, 1000);

function scanAparèyYo(){
  var status=document.getElementById('printer-status-univ');
  var listDiv=document.getElementById('device-list-univ');
  var btnK=document.getElementById('btn-konekte');
  status.innerHTML="🔍 Ap chèche..."; listDiv.innerHTML=""; if(btnK) btnK.style.display="none"; aparèyJwenn=[];

  if(window.Android && window.Android.scanDevices){
    try{
      var jsonStr = window.Android.scanDevices();
      var devices = JSON.parse(jsonStr);
      if(devices.length>0){ aficheAparèyYo(devices); return; }
      status.innerHTML="❌ Pa gen aparèy pè. Ale nan Bluetooth telefòn nan pou fè Pè.";
      return;
    }catch(e){ status.innerHTML="❌ Erè: "+e.message; }
  } else {
    status.innerHTML="❌ Bridge pa jwenn. Men test: "+(window.Android? "Android egziste" : "Android pa egziste");
    // Test data pou wè si UI mache
    aficheAparèyYo([{name:"TEST InnerPrinter", address:"inner_printer", id:"inner_printer"}, {name:"TEST Bluetooth Printer", address:"00:11:22:33:44:55", id:"00:11:22:33:44:55"}]);
  }
}

function aficheAparèyYo(devices){
  var listDiv=document.getElementById('device-list-univ');
  var status=document.getElementById('printer-status-univ');
  devices.forEach(function(d){ aparèyJwenn.push(d); });
  listDiv.innerHTML="<b>✅ "+aparèyJwenn.length+" aparèy jwenn:</b><br>";
  status.innerHTML="✅ "+aparèyJwenn.length+" aparèy jwenn";
  aparèyJwenn.forEach(function(dev,index){
    var div=document.createElement('div');
    div.style.cssText="padding:12px;margin:8px 0;border:2px solid #ccc;border-radius:10px;background:white;display:flex;justify-content:space-between;align-items:center;cursor:pointer";
    var nom=dev.name||dev.address||'Aparèy';
    div.innerHTML="<div><b>📱 "+nom+"</b><br><small>"+(dev.address||'')+"</small></div><div style='background:#0a4a2e;color:#d4af37;padding:6px 10px;border-radius:6px'>CHWAZI</div>";
    div.onclick=(function(i){ return function(){ chwaziAparèy(i); }; })(index);
    div.id="dev-"+index;
    listDiv.appendChild(div);
  });
}

function chwaziAparèy(index){
  var all=document.querySelectorAll('#device-list-univ div[id^="dev-"]');
  for(var i=0;i<all.length;i++){ all[i].style.background='white'; }
  aparèyChwazi=aparèyJwenn[index];
  document.getElementById("dev-"+index).style.background="#d4edda";
  document.getElementById('printer-status-univ').innerHTML="👉 Chwazi: <b>"+(aparèyChwazi.name||aparèyChwazi.address)+"</b>";
  document.getElementById('btn-konekte').style.display="block";
  currentPrinter=aparèyChwazi;
}

function konekteAparèy(){
  if(!aparèyChwazi) return alert("Chwazi yon aparèy!");
  var status=document.getElementById('printer-status-univ');
  try{
    var config={name:aparèyChwazi.name, id:aparèyChwazi.address, address:aparèyChwazi.address};
    localStorage.setItem('printerConfig', JSON.stringify(config));
    status.innerHTML="✅ KONEKTE: "+config.name;
    var el=document.getElementById('printerSaved'); el.style.display='block'; el.innerHTML="✅ Anrejistre: <b>"+config.name+"</b>";
  }catch(e){ status.innerHTML="❌ "+e.message; }
}

function testPrint(){ var cfg=JSON.parse(localStorage.getItem('printerConfig')||'{}'); alert("TEST\nPrinter: "+(cfg.name||'Pa konekte')+"\nSi ou wè InnerPrinter, li bon!"); }

function goTab(id,el){
  var pages=document.querySelectorAll('.tabPage');
  for(var i=0;i<pages.length;i++)pages[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  var tabs=document.querySelectorAll('.tab');
  for(var j=0;j<tabs.length;j++)tabs[j].classList.remove('active');
  if(el)el.classList.add('active');
}

// Double sécurité pou splash pa rete
window.onload=function(){ setTimeout(hideSplash,500); };
</script>
</body>
</html>
