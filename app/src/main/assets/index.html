<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verite Lotto - Sunmi</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: #0f172a; color: white; padding: 12px; }
.card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
h2 { font-size: 18px; margin-bottom: 10px; color: #38bdf8; }
input[type="file"] { width: 100%; background: #334155; padding: 8px; border-radius: 8px; margin-bottom: 8px; }
#logoPreview { width: 120px; height: 120px; object-fit: contain; background: white; border-radius: 8px; display: none; margin: 8px auto; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.num { background: #334155; padding: 12px; text-align: center; border-radius: 8px; font-weight: bold; }
.num.sel { background: #22c55e; color: black; }
input, select { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #334155; color: white; margin: 6px 0; }
.btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; margin-top: 8px; }
.btn-print { background: #22c55e; color: black; }
.btn-logo { background: #38bdf8; color: black; }
.btn-clear { background: #475569; color: white; }
.status { text-align: center; font-size: 12px; color: #94a3b8; margin: 6px; }
#ticketText { background: white; color: black; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; white-space: pre-wrap; margin-top: 10px; min-height: 120px; }
</style>
</head>
<body>

<div class="card">
<h2>1. Logo Bòlèt la</h2>
<input type="file" id="logoInput" accept="image/*" />
<img id="logoPreview" />
<div class="status" id="logoStatus">Pa gen logo chwazi</div>
<button class="btn btn-logo" onclick="clearLogo()">Efase Logo</button>
</div>

<div class="card">
<h2>2. Chwazi Boule (1-100)</h2>
<div class="grid" id="numGrid"></div>
<input type="number" id="montan" placeholder="Montan (ex: 10)" value="10" />
<select id="tiraj">
<option>New York 1h</option>
<option>Florida 1h30</option>
<option>Georgia 12h50</option>
<option>Texas</option>
</select>
<button class="btn btn-clear" onclick="clearSelection()">Efase Seleksyon</button>
</div>

<div class="card">
<h2>3. Aperçu Tikè</h2>
<div id="ticketText">Pa gen boule chwazi...</div>
<div class="status" id="printerStatus">Printer: ap verifye...</div>
<button class="btn btn-print" onclick="printTicket()">🖨️ ENPRIME AK LOGO</button>
<button class="btn btn-logo" onclick="testLogoOnly()">Teste Logo Sèlman</button>
</div>

<script>
let selected = [];
let myLogoBase64 = localStorage.getItem('verite_logo') || null;

// Init grid 1-100
const grid = document.getElementById('numGrid');
for(let i=1; i<=100; i++){
  let d = document.createElement('div');
  d.className='num';
  d.textContent = i.toString().padStart(2,'0');
  d.onclick = () => toggleNum(i, d);
  grid.appendChild(d);
}
function toggleNum(n, el){
  let idx = selected.indexOf(n);
  if(idx>-1){ selected.splice(idx,1); el.classList.remove('sel'); }
  else { if(selected.length>=10){ alert('Max 10 boule'); return; } selected.push(n); el.classList.add('sel'); }
  updatePreview();
}
function clearSelection(){ selected=[]; document.querySelectorAll('.num').forEach(e=>e.classList.remove('sel')); updatePreview(); }

// Logo
const logoInput = document.getElementById('logoInput');
const logoPreview = document.getElementById('logoPreview');
const logoStatus = document.getElementById('logoStatus');

if(myLogoBase64){ logoPreview.src=myLogoBase64; logoPreview.style.display='block'; logoStatus.textContent='Logo sove ✅'; }

logoInput.addEventListener('change', function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    myLogoBase64 = e.target.result;
    localStorage.setItem('verite_logo', myLogoBase64);
    logoPreview.src = myLogoBase64;
    logoPreview.style.display='block';
    logoStatus.textContent='Logo pare ✅ ('+Math.round(myLogoBase64.length/1024)+' KB)';
  };
  reader.readAsDataURL(file);
});
function clearLogo(){ myLogoBase64=null; localStorage.removeItem('verite_logo'); logoPreview.style.display='none'; logoStatus.textContent='Logo efase'; }

// Ticket text
function buildTicketText(){
  if(selected.length==0) return "VERITE LOTTO\n----------------\nPa gen boule\n";
  let now = new Date();
  let dateStr = now.toLocaleDateString('fr-HT') + ' ' + now.toLocaleTimeString('fr-HT');
  let montan = document.getElementById('montan').value || '10';
  let tiraj = document.getElementById('tiraj').value;
  let t = "";
  t += "      VERITE LOTTO\n";
  t += "  --------------------\n";
  t += "Date: "+dateStr+"\n";
  t += "Tiraj: "+tiraj+"\n";
  t += "--------------------\n";
  selected.sort((a,b)=>a-b).forEach(n=>{
    t += "Boule: "+n.toString().padStart(2,'0')+"  Montan: "+montan+" G\n";
  });
  t += "--------------------\n";
  t += "Total: "+(selected.length*parseInt(montan))+" G\n";
  t += "Mesi! Bonne chans!\n";
  t += "Tel: 1234-5678\n";
  return t;
}
function updatePreview(){
  document.getElementById('ticketText').textContent = buildTicketText();
}
updatePreview();

// Printer
function checkPrinter(){
  try{
    if(typeof Android !== 'undefined' && Android.getPrinterStatus){
      document.getElementById('printerStatus').textContent = "Printer: " + Android.getPrinterStatus();
    } else {
      document.getElementById('printerStatus').textContent = "Printer: Navigatè (pa Sunmi)";
    }
  } catch(e){}
}
setInterval(checkPrinter, 2000);
checkPrinter();

function printTicket(){
  let text = buildTicketText();
  if(selected.length==0){ alert('Chwazi omwen 1 boule'); return; }
  try{
    if(typeof Android !== 'undefined'){
      if(myLogoBase64 && myLogoBase64.length > 500){
        Android.printWithLogo(myLogoBase64, text);
      } else {
        Android.printWithoutDialog(text);
      }
    } else {
      alert(text); // test sou PC
    }
  } catch(e){ alert("Erè enprime: "+e.message); }
}

function testLogoOnly(){
  if(!myLogoBase64){ alert('Chwazi yon logo anvan'); return; }
  try{
    if(typeof Android !== 'undefined'){
      Android.printLogo(myLogoBase64);
    }
  } catch(e){ alert(e.message); }
}

// Update montan live
document.getElementById('montan').addEventListener('input', updatePreview);
document.getElementById('tiraj').addEventListener('change', updatePreview);
</script>
</body>
</html>
