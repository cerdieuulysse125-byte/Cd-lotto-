;z-index:9999;padding:8px;grid-template-columns:78px 78px 78px;gap:8px;max-height:70vh;overflow:auto;justify-content:center}.tlist.open{display:grid}.topt{width:78px;min-height:68px;border:2px solid #ccc;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;text-align:center}#loginPage{display:block}#mainPage{display:none;min-height:100vh;padding-bottom:80px}#mainPage.show{display:block}.tabPage{display:none!important}.tabPage.active{display:block!important}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid #0a4a2e;z-index:5000;height:60px}.tab{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:0;background:#eee;border-right:1px solid #ccc}.tab.active{background:#0a4a2e;color:#d4af37}#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a4a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;transition:opacity 0.5s}#prev{background:#fff;margin:8px;padding:6px;font-family:'Courier New',monospace;font-size:12px;line-height:1.25;color:#000;white-space:pre;border:1px dashed #000;width:100%;max-width:56mm;text-align:center}</style></head><body>

printRapport()'>Print</button></div></div><div id='pP' class='tabPage'><div class='card'><h3>Paramèt - Scan Sèlman</h3><div style='background:#e3f2fd;border:3px solid #0a4a2e;border-radius:12px;padding:12px;text-align:center'><h3>🖨️ Aparèy Enprimant</h3><button class='btn' style='background:#0a4a2e;color:#d4af37;padding:15px;font-size:16px;margin-top:10px;width:100%' onclick='scanAparèy()'>🔍 SCAN APARÈY YO (APWOKSIMITE)</button><div id='scanResult' style='background:#fff;border:2px solid #0a4a2e;border-radius:8px;padding:10px;margin-top:12px;text-align:left;max-height:300px;overflow:auto;font-size:13px'>Pa gen scan - Klike SCAN</div><div id='statusPrint' style='margin-top:10px;color:#0a4a2e;font-weight:800'></div></div><div style='background:#e8f5e9;border:2px solid #00c853;border-radius:8px;padding:10px;margin-top:12px'>✅ SAN DYALOG aktive</div><button class='btn btnB' style='margin-top:12px' onclick='testPrintLogo()'>TEST SAN DYALOG</button></div></div><div class='tabs'><button class='tab active' onclick="goTab('pV',this)">1-Vendre</button><button class='tab' onclick="goTab('pC',this)">2-Kopye</button><button class='tab' onclick="goTab('pF',this)">3-Fiches</button><button class='tab' onclick="goTab('pR',this)">4-Rapport</button><button class='tab' onclick="goTab('pP',this)">5-Paramèt</button></div></div>
<script>/* JS SIMPLIFIE + FIX SPLASH + SAN DYALOG */const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};try{firebase.initializeApp(firebaseConfig);}catch(e){}const db=firebase.database?firebase.database():null;const TIRAJ_DEFAULT=[["Borlette Matin","10:00"],["La Suerte 12:30","12:30"],["Haiti 14h","14:00"],["Borlette Soir 18h","18:00"],["Real","12:30"],["Primera dia","11:30"],["Suerte dia","12:00"],["Lote Dom 13:30","13:30"],["Ganamas","14:15"],["Suerte noche","17:50"],["Primera noche","19:50"],["Loteka","19:45"],["Nacional noche","20:50"],["Leidsa","20:45"],["GA midi","12:00"],["FL midi","13:00"],["NY midi","14:00"],["GA soir","18:00"],["FL soir","21:00"],["NY soir","22:00"]];let DB={vendeurs:{},tickets:{},heures:{},results:{}},CUR=null,selT=[],LAST_TXT='',isPrinting=false;function hideSplash(){try{let sp=document.getElementById('splash');if(sp){sp.style.opacity='0';setTimeout(()=>{try{sp.style.display='none';sp.remove();}catch(e){}},400);}}catch(e){}}setTimeout(hideSplash,1200);setTimeout(hideSplash,2500);setTimeout(hideSplash,4000);window.addEventListener('load',()=>setTimeout(hideSplash,500));function getHaitiDateStr(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}function formatHaiti(d){return d.toLocaleTimeString();}function getTirajForVendeur(){return Object.fromEntries(TIRAJ_DEFAULT);}function renderT(){let tlist=document.getElementById('tlist');let all=getTirajForVendeur();let html='';Object.entries(all).forEach(([name,hp])=>{let chk=selT.includes(name)?'checked':'';html+='<label class="topt"><input type="checkbox" value="'+name+'" '+chk+' onchange="chg(this)"><span>'+name+'</span><small>'+hp+'</small></label>';});tlist.innerHTML=html;}function chg(el){if(el.checked)selT.push(el.value);else selT=selT.filter(x=>x!=el.value);document.getElementById('txtT').innerText=selT.length?selT.length+' tiraj':'Chwazi';upd();}function selAll(){selT=Object.keys(getTirajForVendeur());renderT();document.getElementById('txtT').innerText=selT.length+' tiraj';upd();}function addR(){let c=document.getElementById('bets');let d=document.createElement('div');d.className='row betRow';d.innerHTML='<select class="jeu inp"><option value="boul">BOUL 2</option><option value="loto3">L3</option><option value="loto4">L4</option><option value="loto5">L5</option><option value="maryaj">MAR</option></select><input class="boul inpN" type="tel" placeholder="--" oninput="upd()"><input class="mise inpN" type="tel" placeholder="$" oninput="upd()"><button class="btnR" onclick="this.parentElement.remove();upd()">X</button>';c.appendChild(d);upd();return d;}function upd(){let sum=0;document.querySelectorAll('.betRow').forEach(r=>{let mm=parseInt(r.querySelector('.mise').value)||0;if(r.querySelector('.boul').value.trim()&&mm)sum+=mm;});document.getElementById('dt').innerText='Total $'+sum+' x '+selT.length;document.getElementById('gt').innerText='$'+(sum*selT.length);}function build(tk){let txt='C&D VERITE LOTTO\n';txt+='Vendeur: '+(CUR?.serial||'')+'\n';txt+='Date: '+getHaitiDateStr()+'\n';selT.forEach(t=>{txt+=t+'\n';});tk.bets.forEach(b=>{txt+=b.type+' '+b.numero+' $'+b.mise+'\n';});txt+='Total => '+tk.total+' HTG\nMesi!';return txt;}function showPreview(txt){const p=document.getElementById('prev');p.style.display='block';p.innerHTML='<div style="white-space:pre;font-family:monospace;font-size:12px;text-align:center">'+txt.replace(/\n/g,'<br>')+'</div>';}async function printBT(t){if(isPrinting) return;isPrinting=true;let plain=(t||LAST_TXT||'').toString().replace(/<[^>]+>/g,'').trim();if(!plain){isPrinting=false;return;}try{if(window.AndroidPrinter && typeof AndroidPrinter.printWithoutDialog==='function'){AndroidPrinter.printWithoutDialog(plain);setTimeout(()=>{isPrinting=false;},1500);return;}}catch(e){}isPrinting=false;}function printLast(){if(!LAST_TXT){alert('Pa gen fich');return}printBT(LAST_TXT);}function testPrintLogo(){let tk={id:'TEST',bets:[{type:'boul',numero:'44',mise:10}],total:15};let txt=build(tk);showPreview(txt);LAST_TXT=txt;printBT(txt);}function scanAparèy(){let res=document.getElementById('scanResult');res.innerHTML='🔍 Ap chèche...';try{if(window.AndroidPrinter && typeof AndroidPrinter.scanDevices==='function'){let json=AndroidPrinter.scanDevices();let devs=JSON.parse(json);let html='<b>✅ '+devs.length+' aparèy</b><br>';devs.forEach(d=>{html+=`<div style="background:#fff;border:1px solid #0a4a2e;padding:8px;margin:4px 0;border-radius:6px"><b>${d.name}</b> - ${d.mac}<br><button onclick="testeEnprime('${d.name}')" style="padding:5px 10px;background:#0a4a2e;color:#d4af37">Teste</button></div>`;});res.innerHTML=html;return;}}catch(e){res.innerHTML='Erè: '+e.message;}res.innerHTML='⚠️ Enstale APK ak MainActivity FINAL';}function testeEnprime(nom){let text="C&D VERITE LOTTO\nTEST SAN DYALOG\n"+nom+"\n"+getHaitiDateStr()+"\nMesi!\n\n\n";if(window.AndroidPrinter && AndroidPrinter.printWithoutDialog) AndroidPrinter.printWithoutDialog(text);}async function vann(){if(!selT.length){alert('Chwazi Tiraj');return}let bets=[];document.querySelectorAll('.betRow').forEach(r=>{let j=r.querySelector('.jeu').value,b=r.querySelector('.boul').value.trim(),mm=parseInt(r.querySelector('.mise').value);if(j&&b&&mm)bets.push({type:j,numero:b,mise:mm});});if(!bets.length){alert('VID');return}let base=bets.reduce((a,b)=>a+b.mise,0);let tk={id:'T'+Date.now().toString().slice(-7),bets,tirages:selT.slice(),total:base*selT.length,date:getHaitiDateStr(),serial:CUR?.serial};if(db){try{db.ref('tickets/'+tk.id).set(tk);}catch(e){}}let txt=build(tk);LAST_TXT=txt;showPreview(txt);setTimeout(()=>{printBT(txt);},500);setTimeout(()=>{document.getElementById('bets').innerHTML='';addR();upd();},1000);}function goTab(id,el){document.querySelectorAll('.tabPage').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');}async function doLogin(){let s=document.getElementById('inputSerial').value.trim(),p=document.getElementById('inputPass').value.trim();if(!s||!p){document.getElementById('loginMsg').innerText='Mete Serial';return}if(!db){CUR={serial:s,nom:'Vendeur'};localStorage.setItem('curV',JSON.stringify(CUR));openMain();return}try{let snap=await db.ref('vendeurs').once('value');let vs=snap.val()||{};let k=Object.keys(vs).find(k=>String(vs[k].serial)===String(s));let f=k?vs[k]:null;if(!f){document.getElementById('loginMsg').innerText='Serial pa jwenn';return}if(String(f.pass)!==String(p)){document.getElementById('loginMsg').innerText='Modpas pa bon';return}CUR=f;CUR._key=k;localStorage.setItem('curV',JSON.stringify(CUR));openMain();}catch(e){document.getElementById('loginMsg').innerText=e.message;}}function openMain(){document.getElementById('loginPage').style.display='none';document.getElementById('mainPage').style.display='block';document.getElementById('mainPage').classList.add('show');document.getElementById('vName').innerText=CUR.nom||CUR.serial;renderT();upd();hideSplash();}function logout(){localStorage.clear();location.reload();}let curV=localStorage.getItem('curV');if(curV){try{CUR=JSON.parse(curV);openMain();}catch(e){hideSplash();}}setTimeout(hideSplash,3500);</script></body></html>
