<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V36.7.5 VANDE - PRI GLOBAL 50/20/10 + SENKWO PA VANDE</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
body{font-family:system-ui;margin:0;background:#f3f3f3}
.tab{padding:10px 14px;background:#0a4a2e;color:#d4af37;border:none;margin:2px;border-radius:6px}
.tab.active{background:#d4af37;color:#0a4a2e}
#pV,#pC,#pR{display:none;padding:10px}
#pV.active,#pC.active,#pR.active{display:block}
#tlist{border:1px solid #ccc;max-height:200px;overflow:auto;background:#fff;display:none}
#tlist.open{display:block}
</style>
</head>
<body>
<div style="background:#0a4a2e;padding:8px;display:flex;gap:4px;flex-wrap:wrap">
<button class="tab active" onclick="goTab('pV',this)">1-Vendre</button>
<button class="tab" onclick="goTab('pC',this)">2-Copy T1203837</button>
<button class="tab" onclick="goTab('pR',this)">3-Rapport Sync</button>
</div>

<div id="pV" class="active">
<h3>Vendre - <span id="txtT">Chwazi Tiraj Jodi a (0)</span></h3>
<div onclick="document.getElementById('tlist').classList.toggle('open')" style="background:#fff;padding:8px;border:1px solid #0a4a2e">▼ Chwazi Tiraj</div>
<div id="tlist"></div>
<div id="bets" style="margin-top:10px"></div>
<button onclick="addR('boul')">+ Boul</button>
<button onclick="vann()">VANN</button>
<div id="fast" style="margin-top:8px;background:#fff;padding:6px"></div>
<div id="gratisPreview" style="margin-top:6px;color:#0a4a2e"></div>
</div>

<div id="pC">
<h3>Kopye - Pa gen tiraj koche</h3>
<input id="cid" placeholder="ID Ticket ex: T1203837" style="padding:8px;width:200px">
<button onclick="doCopy()">Kopye nan Tiraj Jodi a</button>
</div>

<div id="pR">
<h3>Rapport - Sync Vende ↔ Proprio + Pri pa Vande</h3>
<input id="rdu" type="date"> <input id="rau" type="date">
<select id="rt"><option value="tous">Tous</option></select>
<button onclick="calcR()">Kalkile</button>
<div id="rres" style="margin-top:10px"></div>
<div id="rapportPrintButtons" style="display:none"><button id="rprint">Print</button></div>
</div>

<script>
var firebaseConfig={apiKey:"...",authDomain:"...",databaseURL:"...",projectId:"..."};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
var db=firebase.database();
var DB={prix:{global:{}},vendeurs:{},businesses:{},config:{}};
var CUR={serial:"2222",_key:"-TEST2222",proprioId:"1704012200033",nom:"Vande Test"};
var selT=[];
var allTiraj=["Bolet 10h","Bolet 12h30","Bolet 3h30","Bolet 8h","NY 10h","NY 3h","FL 1h30","FL 10h"];
function getHaitiDateStr(){return new Date().toISOString().slice(0,10);}
function getBusinessName(){return "Bolet Test";}
function getFooter(){return "Mesi";}
function forceTabsVisible(){}
function goTab(id,el){
 document.querySelectorAll('#pV,#pC,#pR').forEach(d=>d.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
 if(el) el.classList.add('active');
}
function addR(type){
 let betsDiv=document.getElementById('bets');
 let r=document.createElement('div');
 r.innerHTML='<select class="jeu"><option value="boul">boul</option><option value="maryaj">maryaj</option><option value="loto3">loto3</option><option value="loto4">loto4</option><option value="loto5">loto5</option></select> <input class="boul" placeholder="No"> <input class="mise" placeholder="Mise" type="number">';
 betsDiv.appendChild(r); return r;
}
function updFast(){
 let total=0;
 document.querySelectorAll('.mise').forEach(m=>total+=parseFloat(m.value)||0);
 document.getElementById('fast').innerText='Total: $'+total;
}
function isMaryajGratisEnabled(){let p=getMyPrix();return p.maryajGratisEnabled!==false;}
function renderGratisPreview(){
 let bets=[];document.querySelectorAll('#bets div').forEach(div=>{
  let b=div.querySelector('.boul'),ms=div.querySelector('.mise'),j=div.querySelector('.jeu');
  if(b&&ms&&j) bets.push({numero:b.value||'',mise:ms.value||0,type:j.value||'boul'});
 });
 let r=calcMaryajGratis(bets);
 document.getElementById('gratisPreview').innerText=r.gratisList.length?('Gratis: '+r.gratisList.map(g=>g.numero).join(', ')+' (Peye '+(getMyPrix().maryajGratis||500)+')'):'';
}
function renderT(){
 let tlist=document.getElementById('tlist');tlist.innerHTML='';
 allTiraj.forEach(t=>{
  let div=document.createElement('div');
  div.innerHTML='<label><input type="checkbox" value="'+t+'" onchange="onTChange(this)"> '+t+'</label>';
  tlist.appendChild(div);
 });
}
function onTChange(cb){
 if(cb.checked){if(!selT.includes(cb.value)) selT.push(cb.value);}else{selT=selT.filter(x=>x!==cb.value);}
 document.getElementById('txtT').innerText='Chwazi Tiraj Jodi a ('+selT.length+' koche)';
}
function buildRapportThermalText(d){return {text:'RAPPORT '+d.du+' Vant:'+d.ventTotal,logo:''};}

// V36.7.5 - PRI GLOBAL 50/20/10 + SENKWO PRI PA VANDE
function getMyPrix(){
  try{
    let global={p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000,kom:10,komActive:true,maryajGratis:500,maryajGratisEnabled:true,maryajGratisCount:1};
    let pid=CUR?CUR.proprioId:null; let vid=CUR?CUR._key:null;
    if(DB.prix && DB.prix.global) Object.assign(global, DB.prix.global);
    if(DB.config && DB.config.prix) Object.assign(global, DB.config.prix);
    if(pid && DB.prix && DB.prix[pid]) Object.assign(global, DB.prix[pid]);
    if(pid && DB.businesses[pid] && DB.businesses[pid].prix) Object.assign(global, DB.businesses[pid].prix);
    // PRI PA VANDE - ECRASE TOUT - SENKWO AUTO
    if(vid && DB.vendeurs[vid]){
      let v=DB.vendeurs[vid];
      if(v.prix) Object.assign(global, v.prix);
      if(v.kom!==undefined) global.kom=v.kom;
      if(v.komActive!==undefined) global.komActive=v.komActive;
      if(v.p1!==undefined) global.p1=v.p1; if(v.p2!==undefined) global.p2=v.p2; if(v.p3!==undefined) global.p3=v.p3;
      if(v.l3!==undefined) global.l3=v.l3; if(v.l4!==undefined) global.l4=v.l4; if(v.l5!==undefined) global.l5=v.l5;
      if(v.m1!==undefined) global.m1=v.m1; if(v.m2!==undefined) global.m2=v.m2; if(v.m3!==undefined) global.m3=v.m3;
    }
    return global;
  }catch(e){
    return {p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000,kom:10,komActive:true,maryajGratis:500,maryajGratisEnabled:true,maryajGratisCount:1};
  }
}

// MARYAJ GRATIS 1 SEL KI PEYE 500
function calcMaryajGratis(bets,totalFich){
  try{
    let prix=getMyPrix();
    if(!isMaryajGratisEnabled()) return {gratisList:[],count:0};
    let total=totalFich!==undefined?totalFich:bets.reduce((a,b)=>a+(parseInt(b.mise)||0),0);
    if(total < (prix.maryajGratis||500)) return {gratisList:[],count:0};
    let nums=bets.filter(b=>b.type==='boul').map(b=>b.numero.padStart(2,'0'));
    if(nums.length<2) return {gratisList:[],count:0};
    let gratis=[{numero: nums[0]+nums[1], type:'maryaj', mise:0, gratis:true, base: nums[0]+'x'+nums[1], paye: prix.maryajGratis||500}];
    return {gratisList: gratis, count:1};
  }catch(e){return {gratisList:[],count:0};}
}

// KOPYE SAN TIRAJ KOCHE
async function doCopy(){
  try{
    let idEl=document.getElementById('cid');
    let id=idEl.value.trim().toUpperCase().replace(/\s+/g,'');
    if(!id) return alert('Mete ID Ticket');
    let snap=await db.ref('tickets/'+id).once('value'); let t=snap.val();
    if(!t && id.startsWith('T')){let s2=await db.ref('tickets/'+id.slice(1)).once('value'); if(s2.val()){t=s2.val();}}
    if(!t) return alert('Fich pa jwenn: '+id);
    selT=[]; document.getElementById('txtT').innerText='Chwazi Tiraj Jodi a (0)';
    document.getElementById('bets').innerHTML='';
    (t.bets||[]).forEach(b=>{let r=addR(b.type||'boul'); r.querySelector('.boul').value=b.numero||''; r.querySelector('.mise').value=b.mise||''; r.querySelector('.jeu').value=b.type||'boul';});
    renderT(); document.querySelectorAll('#tlist input[type=checkbox]').forEach(cb=>cb.checked=false);
    goTab('pV', document.querySelectorAll('.tab')[0]);
    setTimeout(()=>{document.getElementById('tlist').classList.add('open');},100);
    updFast(); renderGratisPreview(); idEl.value='';
  }catch(e){alert('Erè: '+e.message);}
}
function calcGainForTicket(ticket,resultsForDate,fallbackPrix){
  let totalGain=0;
  try{
    let prix=ticket.prix || fallbackPrix || getMyPrix();
    for(let tirage of ticket.tirages||[]){
      let res=resultsForDate[tirage]; if(!res) continue;
      let r1=(res.r1||"").toString().replace(/\D/g,"").slice(-2).padStart(2,"0");
      let r2=(res.r2||"").toString().replace(/\D/g,"").slice(-2).padStart(2,"0");
      let r3=(res.r3||"").toString().replace(/\D/g,"").slice(-2).padStart(2,"0");
      for(let bet of ticket.bets||[]){
        let num=(bet.numero||"").replace(/\D/g,""); let mise=parseFloat(bet.mise||0);
        if(!num||!mise) continue;
        if(bet.type==="boul"){
          let raw=num.slice(-2).padStart(2,"0");
          if(raw===r1) totalGain+=mise*(prix.p1||50);
          else if(raw===r2) totalGain+=mise*(prix.p2||20);
          else if(raw===r3) totalGain+=mise*(prix.p3||10);
        }else if(bet.type==="loto3"){ if(num=== (res.loto3||"")) totalGain+=mise*(prix.l3||500); }
        else if(bet.type==="loto4"){ if(num=== (res.loto4||"")) totalGain+=mise*(prix.l4||5000); }
        else if(bet.type==="loto5"){ if(num=== (res.loto5||"")) totalGain+=mise*(prix.l5||25000); }
      }
    }
  }catch(e){}
  return {totalGain: totalGain};
}

// RAPPORT ORIGINAL - PA GATE - + PRI PA VANDE
async function calcR(){
  let rres=document.getElementById('rres');
  let du=document.getElementById('rdu').value||getHaitiDateStr(),au=document.getElementById('rau').value||getHaitiDateStr(),ti=document.getElementById('rt').value||'tous';
  rres.style.display='block'; rres.innerHTML='Tcheke...';
  try{
    let snap=await db.ref('tickets').once('value'); let all=snap.val()||{};
    let resSnap=await db.ref('results').once('value'); let allRes=resSnap.val()||{};
    let resultsByDate={}; Object.values(allRes).forEach(r=>{ if(!r||!r.dat) return; if(!resultsByDate[r.dat]) resultsByDate[r.dat]={}; resultsByDate[r.dat][r.tirage]=r; });
    let prix=getMyPrix();
    let totalTikeVann=0,ventTotal=0,totalKom=0,aPeye=0; let mySerial=CUR?CUR.serial:null;
    Object.values(all).forEach(t=>{
      let td=t.dateHaiti||t.date; if(!td||td<du||td>au) return;
      if(mySerial&&t.serial&&String(t.serial)!==String(mySerial)) return;
      if(ti!=='tous'&&!(t.tirages||[]).includes(ti)) return;
      if(t.annule) return;
      totalTikeVann++; ventTotal+=t.total||0;
      let prixFich=t.prix || prix;
      let komPerc=parseFloat(prixFich.kom||10);
      if(prixFich.komActive!==false) totalKom+=(t.total||0)*(komPerc/100);
      let calc=calcGainForTicket(t,resultsByDate[td]||{},prixFich);
      if(calc.totalGain>0) aPeye+=calc.totalGain;
    });
    let balansNet=ventTotal-totalKom-aPeye;
    rres.innerHTML='<div style="text-align:center"><div style="background:#0a4a2e;color:#d4af37;padding:10px">Du '+du+' Au '+au+'<br>PRI: P1 '+prix.p1+' / P2 '+prix.p2+' / P3 '+prix.p3+'<br>M:1000 L3:500 L4:5000 L5:25000 Gratis:500(1)</div><div style="background:#fff;border:2px solid #0a4a2e;padding:10px"><div>Vann: '+totalTikeVann+'</div><div>Vant: $'+ventTotal.toFixed(2)+'</div><div>Komisyon: $'+totalKom.toFixed(2)+'</div><div>A peye: $'+aPeye.toFixed(2)+'</div><div style="background:#0a4a2e;color:#d4af37;padding:8px">Balans: $'+balansNet.toFixed(2)+'</div></div></div>';
  }catch(e){rres.innerHTML='Ere: '+e.message;}
}
function vann(){alert('Vann - selT: '+selT.join(','));}
renderT();
</script>
</body>
</html>
