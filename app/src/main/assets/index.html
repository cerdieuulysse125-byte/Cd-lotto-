async function vann(){

  document.querySelectorAll('#bets .row').forEach(function(r){
    var j=r.querySelector('.jeu').value,b=r.querySelector('.boul').value.trim(),mm=parseInt(r.querySelector('.mise').value);

// KALKIL PEYMAN KORIJE 100% - BOUL + MARYAJ + LOTO3/4/5
function calcGainForTicket(ticket, prix, resultsByTirage){
  var totalGain=0;var detay=[];
  if(!ticket || !ticket.bets || !ticket.tirages) return {gain:0,detay:[]};
  for(var ti=0;ti<ticket.tirages.length;ti++){
    var tirajName=ticket.tirages[ti];
    var res=resultsByTirage[tirajName];
    if(!res) continue;
    var r1=String(res.r1||"").padStart(2,'0');
    var r2=String(res.r2||"").padStart(2,'0');
    var r3=String(res.r3||"").padStart(2,'0');
    var l3=String(res.l3||"").padStart(3,'0');
    var l4=String(res.l4||"").padStart(4,'0');
    var l5=String(res.l5||"").padStart(5,'0');
    for(var b=0;b<ticket.bets.length;b++){
      var bet=ticket.bets[b];
      var num=String(bet.numero||"").trim();
      var mise=parseFloat(bet.mise||0);
      if(!mise) continue;
      var gain=0;
      if(bet.type==='boul'){
        var boul2=num.padStart(2,'0');
        if(boul2===r1) gain=mise*(prix.p1||50);
        else if(boul2===r2) gain=mise*(prix.p2||20);
        else if(boul2===r3) gain=mise*(prix.p3||10);
      }else if(bet.type==='maryaj'){
        if(num.length<4) continue;
        var a=num.substring(0,2).padStart(2,'0');
        var bb=num.substring(2,4).padStart(2,'0');
        var g12=((a===r1 && bb===r2) || (a===r2 && bb===r1));
        var g13=((a===r1 && bb===r3) || (a===r3 && bb===r1));
        var g23=((a===r2 && bb===r3) || (a===r3 && bb===r2));
        if(g12) gain=mise*(prix.m1||1000);
        else if(g13) gain=mise*(prix.m2||1000);
        else if(g23) gain=mise*(prix.m3||1000);
      }else if(bet.type==='loto3'){
        if(num.padStart(3,'0')===l3 && l3!=="000") gain=mise*(prix.l3||500);
      }else if(bet.type==='loto4'){
        if(num.padStart(4,'0')===l4 && l4!=="0000") gain=mise*(prix.l4||5000);
      }else if(bet.type==='loto5'){
        if(num.padStart(5,'0')===l5 && l5!=="00000") gain=mise*(prix.l5||25000);
      }
      if(gain>0){totalGain+=gain;detay.push({tiraj:tirajName,type:bet.type,numero:num,mise:mise,gain:gain});}
    }
  }
  return {gain:totalGain,detay:detay};
}

async function stepPaye1(){

  if(t.annule){alert('ANILE - pa ka peye');return;}
  if(t.paye){alert('DEJA PEYE: $'+(t.payeGain||0).toFixed(2));return;}
  var du=t.date||getHaitiDateStr();
  var resSnap=await db.ref('results').once('value');var allRes=resSnap.val()||{};var resultsForDate={};
  for(var k in allRes){var r=allRes[k];if(r && r.dat==du) resultsForDate[r.tirage]=r;}
  if(Object.keys(resultsForDate).length===0){alert('Poko gen rezilta pou dat '+du);return;}
  var prixT=t.prix||getMyPrix();
  var calc=calcGainForTicket({bets:t.bets,tirages:t.tirages},prixT,resultsForDate);
  if(calc.gain<=0){res.innerHTML='<div style="background:#ffebee;padding:12px;text-align:center"><b>PA GANYAN</b><br>Gain $0</div>';document.getElementById('stepPay1').style.display='none';document.getElementById('stepPay2').style.display='block';return;}
  CUR_PAY_TICKET=t;CUR_PAY_GAIN=calc.gain;
  var htmlDetay='';for(var i=0;i<calc.detay.length;i++){var d=calc.detay[i];htmlDetay+='<div style="display:flex;justify-content:space-between;border-bottom:1px dashed #ccc;padding:4px 0"><span>'+d.tiraj+' - '+d.type.toUpperCase()+' '+d.numero+'</span><b style="color:green">$'+d.gain.toFixed(2)+'</b></div>';}
  res.innerHTML='<div style="text-align:center"><b style="color:#2e7d32">GANYAN - KALKIL KORIJE</b><br><div style="background:#eef2f7;padding:10px;text-align:left;margin-top:10px">'+htmlDetay+'<div style="font-size:22px;font-weight:900;color:#2e7d32;text-align:center;margin-top:10px;border-top:2px solid #2e7d32;padding-top:8px">TOTAL: $'+calc.gain.toFixed(2)+'</div></div></div>';
  document.getElementById('stepPay1').style.display='none';document.getElementById('stepPay2').style.display='block';
}
function stepPaye2(){if(!CUR_PAY_TICKET) return;document.getElementById('payFinalInfo').innerHTML='<b>ID:</b> '+CUR_PAY_TICKET.id+'<br><b>Gain:</b> $'+CUR_PAY_GAIN.toFixed(2);document.getElementById('stepPay2').style.display='none';document.getElementById('stepPay3').style.display='block';}
async function doPeyeConf(){if(!CUR_PAY_TICKET) return;try{var chk=await db.ref('tickets/'+CUR_PAY_TICKET.id+'/paye').once('value');if(chk.val()===true){alert('Deja peye!');resetPaye();return;}await db.ref('tickets/'+CUR_PAY_TICKET.id).update({paye:true,payeAt:new Date().toISOString(),payeBy:CUR.serial,payeGain:CUR_PAY_GAIN});var txt='*** PEYE - KALKIL KORIJE ***\n\nID: '+CUR_PAY_TICKET.id+'\nGAIN: $'+CUR_PAY_GAIN.toFixed(2)+'\n\n';var rp=document.getElementById('payPrint');rp.innerText=txt;rp.dataset.plain=txt;rp.style.display='block';document.getElementById('btnPayPrint').style.display='block';alert('PEYE OK: $'+CUR_PAY_GAIN.toFixed(2));printPeye();}catch(e){alert(e.message);}}
function printPeye(){var rp=document.getElementById('payPrint');var t=rp.dataset.plain||rp.innerText;if(!t){alert('Kalkile avan');return}printBT(t);}
async function calcR(){
  try{
    var du=document.getElementById('rdu').value,au=document.getElementById('rau').value;
    if(!du) du=getHaitiDateStr();if(!au) au=getHaitiDateStr();
    var rres=document.getElementById('rres');rres.style.display='block';rres.innerHTML='Kalkil...';
    var snap=await db.ref('tickets').once('value');var all=snap.val()||{};
    var resSnap=await db.ref('results').once('value');var allRes=resSnap.val()||{};
    var resultsByDate={};for(var k in allRes){var r=allRes[k];if(!r||!r.dat) continue;if(r.dat<du||r.dat>au) continue;if(!resultsByDate[r.dat]) resultsByDate[r.dat]={};resultsByDate[r.dat][r.tirage]=r;}
    var vente=0,annule=0,ganyan=0,aPeye=0;var prixG=getMyPrix();
    for(var tk in all){var t=all[tk];var td=t.date||'';if(td<du||td>au) continue;if(String(t.serial)!=String(CUR.serial)) continue;if(t.annule){annule++;continue;}vente+=t.total||0;var resFor=resultsByDate[td]||{};var calc=calcGainForTicket({bets:t.bets,tirages:t.tirages},t.prix||prixG,resFor);if(calc.gain>0){ganyan++;aPeye+=calc.gain;}}
    var logoU=getLogoUrl();var logoH=logoU&&logoU.length>100?'<img src="'+logoU+'" style="width:60px;height:60px;border-radius:50%;display:block;margin:6px auto;border:2px solid #0a4a2e;object-fit:cover">':'<div style="width:60px;height:60px;border-radius:50%;background:#0a4a2e;color:#d4af37;display:flex;align-items:center;justify-content:center;margin:6px auto;font-weight:900">C&D</div>';
    rres.innerHTML=logoH+'<div style="background:#0a4a2e;color:#d4af37;padding:12px;text-align:center">RAPO KORIJE - '+du+' -> '+au+'</div><div style="display:flex;justify-content:space-between;padding:12px"><span>Vant</span><b>$'+vente.toFixed(2)+'</b></div><div style="display:flex;justify-content:space-between;padding:12px"><span>Ganyan</span><b>'+ganyan+'</b></div><div style="display:flex;justify-content:space-between;padding:12px"><span>A peye</span><b>$'+aPeye.toFixed(2)+'</b></div><div style="display:flex;justify-content:space-between;padding:12px"><span>Anile</span><b>'+annule+'</b></div>';
    var txtR='C&D VERITE LOTTO\n\nDu: '+du+'\nAu: '+au+'\nVant: $'+vente.toFixed(2)+'\nGanyan: '+ganyan+'\nA peye: $'+aPeye.toFixed(2)+'\nAnile: '+annule+'\n';var rp=document.getElementById('rprint');rp.style.display='block';rp.innerHTML=logoH+'<div style="white-space:pre-wrap;text-align:center">'+txtR.replace(/\n/g,'<br>')+'</div>';rp.dataset.plain=txtR;
  }catch(e){alert(e.message);}
}
function printRapport(){var rp=document.getElementById('rprint');var t=rp.dataset.plain||rp.innerText;if(!t){alert('Kalkile avan');return}printBT(t);}
function goTab(id,el){var pages=document.querySelectorAll('.tabPage');for(var i=0;i<pages.length;i++){pages[i].classList.remove('active');pages[i].style.display='none';}var target=document.getElementById(id);if(target){target.classList.add('active');target.style.display='block';}var tabs=document.querySelectorAll('.tab');for(var j=0;j<tabs.length;j++) tabs[j].classList.remove('active');if(el) el.classList.add('active');window.scrollTo(0,0);}
var curV=localStorage.getItem('curV');if(curV){try{CUR=JSON.parse(curV);openMain();}catch(e){hideSplash();}}
document.getElementById('logoFile').addEventListener('change',function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){MY_LOGO=e.target.result;localStorage.setItem('verite_logo',MY_LOGO);var big=document.getElementById('logoBigPreview');if(big){big.src=MY_LOGO;big.style.display='block';}};r.readAsDataURL(f);});
function saveLogo(){if(!MY_LOGO){alert('Chwazi logo');return;}localStorage.setItem('verite_logo',MY_LOGO);alert('Logo sove - ap reouvri');location.reload();}
</script></body></html>
