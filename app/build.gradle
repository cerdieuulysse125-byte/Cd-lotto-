plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cd.verite.lotto'
    compileSdk 33

    defaultConfig {
        applicationId "com.cd.verite.lotto"
        minSdk 21
        targetSdk 33
        versionCode 28
        versionName "28.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
