plugins { id 'com.android.application' }
android {
    compileSdk 33
    defaultConfig {
        applicationId "com.cdlotto.app"
        minSdk 21
        targetSdk 33
        versionCode 27
        versionName "V27-SANS-CHROME-FIREBASE-SILENT"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility 1_8; targetCompatibility 1_8 }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar','*.jar'])
}
