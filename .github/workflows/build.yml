name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1
      - name: Setup base
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          printf "pluginManagement{\n repositories{ google(); mavenCentral(); gradlePluginPortal() }\n}\ndependencyResolutionManagement{\n repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n repositories{ google(); mavenCentral() }\n}\ninclude ':app'\n" > settings.gradle
          echo "" > build.gradle
          mkdir -p app/src/main/java/com/cdlotto/app
          mkdir -p app/src/main/res/values
          printf "plugins{ id 'com.android.application' version '8.1.0' }\nandroid{ namespace 'com.cdlotto.app'; compileSdk 33; defaultConfig{ applicationId 'com.cdlotto.app'; minSdk 21; targetSdk 33; versionCode 303; versionName '30.3' } }\n" > app/build.gradle
          echo '<resources><string name="app_name">C&D Verite Lotto</string></resources>' > app/src/main/res/values/strings.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="@string/app_name"><activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.cdlotto.app;import android.app.Activity;import android.os.Bundle;import android.webkit.WebView;import android.webkit.WebViewClient;public class MainActivity extends Activity{protected void onCreate(Bundle b){super.onCreate(b);WebView w=new WebView(this);setContentView(w);w.getSettings().setJavaScriptEnabled(true);w.getSettings().setDomStorageEnabled(true);w.setWebViewClient(new WebViewClient());w.loadUrl("https://cd-lotto.vercel.app/vendeur.html");}}' > app/src/main/java/com/cdlotto/app/MainActivity.java
      - name: Add C&D Logo
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          python3 -c "from PIL import Image, ImageDraw, ImageFont; s=256; img=Image.new('RGB',(s,s),(15,80,40)); d=ImageDraw.Draw(img); d.ellipse([2,2,s-2,s-2], outline=(212,175,55), width=8); d.ellipse([20,20,s-20,s-20], outline=(212,175,55), width=3); f=ImageFont.load_default(); d.text((s//2-30, s//4), 'C&D', fill=(255,215,0), font=f); d.text((s//2-45, s//2), 'VERITE', fill=(255,215,0), font=f); d.text((s//2-35, s//2+30), 'LOTTO', fill=(255,215,0), font=f); img.save('app/src/main/res/mipmap-hdpi/ic_launcher.png'); img.resize((48,48)).save('app/src/main/res/mipmap-mdpi/ic_launcher.png'); img.resize((96,96)).save('app/src/main/res/mipmap-xhdpi/ic_launcher.png'); img.resize((144,144)).save('app/src/main/res/mipmap-xxhdpi/ic_launcher.png'); img.resize((192,192)).save('app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'); print('logos ok')"
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="C&amp;D Verite Lotto" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"><activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          ls -lh app/src/main/res/mipmap-hdpi/
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: APK-C-D-VERITE-LOGO-OK
          path: app/build/outputs/apk/debug/*.apk
