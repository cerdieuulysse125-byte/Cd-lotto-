name: Build V26 SUNMI SILENT
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.2.1 }
      - name: Build SILENT APK
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          printf "pluginManagement{ repositories{ google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement{ repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n repositories{ google(); mavenCentral() } }\ninclude ':app'\n" > settings.gradle
          echo "" > build.gradle
          mkdir -p app/src/main/java/com/cdlotto/app app/src/main/res/values
          printf "plugins{ id 'com.android.application' version '8.1.0' }\nandroid{ namespace 'com.cdlotto.v26silent'; compileSdk 33; defaultConfig{ applicationId 'com.cdlotto.v26silent'; minSdk 21; targetSdk 33; versionCode 26; versionName '26-SILENT' } }\n" > app/build.gradle
          echo '<resources><string name="app_name">C&D V26 SILENT</string></resources>' > app/src/main/res/values/strings.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="C&D V26 SILENT"><activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar.Fullscreen"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          cat > app/src/main/java/com/cdlotto/app/MainActivity.java << 'JAVA'
          package com.cdlotto.app;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; import android.webkit.JavascriptInterface; import android.util.Log;
          import java.lang.reflect.Method;
          public class MainActivity extends Activity{
              WebView mainView; Object sunmiService=null; boolean sunmiReady=false;
              String htmlContent = "<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>V26 SILENT</title><script src='https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js'></script><script src='https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js'></script><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#eef2f7}.h{background:#0a4a2e;color:#d4af37;padding:12px;display:flex;justify-content:space-between}.card{background:#fff;border-radius:12px;padding:12px;margin:8px;border-left:4px solid #0a4a2e}.inpL{width:100%;height:48px;border:2px solid #0a4a2e;border-radius:8px;padding:0 10px;margin-top:8px}.btn{padding:14px;border:0;border-radius:10px;font-weight:800;width:100%}.btnG{background:#0a4a2e;color:#d4af37;border:2px solid #d4af37}.btnB{background:#0a4a2e;color:#d4af37}.betRow{display:flex;gap:6px;margin-bottom:8px;background:#f9fdf9;border:1.5px solid #d4af37;border-radius:10px;padding:8px;align-items:center}.inp{width:80px;height:48px;border:2px solid #0a4a2e;border-radius:8px;text-align:center;font-weight:800}.inpN{width:80px;height:48px;border:2px solid #0a4a2e;border-radius:8px;text-align:center;font-weight:800;font-size:18px}.total{background:#0a4a2e;color:#d4af37;border-radius:12px;padding:12px;display:flex;justify-content:space-between;font-weight:800;margin:8px}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid #0a4a2e;height:60px}.tab{flex:1;display:flex;align-items:center;justify-content:center;font-weight:800;background:#eee;border:0}.tab.active{background:#0a4a2e;color:#d4af37}.tabPage{display:none;padding-bottom:80px}.tabPage.active{display:block}#prev{background:#fff;margin:8px;padding:8px;font-family:monospace;white-space:pre-wrap;text-align:center;border:1px dashed #000;display:none}.rapo-line{display:flex;justify-content:space-between;padding:10px;border-bottom:1px dashed #ccc;font-weight:800}</style></head><body><div class='h'><b>C&D V26 SILENT</b><span id='st' style='background:#00c853;color:#fff;padding:2px 8px;border-radius:6px;font-size:10px'>SUNMI:...</span></div><div id='loginPage'><div class='card' style='max-width:380px;margin:20px auto;text-align:center'><div style='width:80px;height:80px;border-radius:50%;background:#0a4a2e;color:#d4af37;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;margin:0 auto 10px;border:3px solid #d4af37'>C&D</div><h3>V26 SILENT<br><small style='background:#0a4a2e;color:#d4af37;padding:2px 10px;border-radius:6px'>SAN DYALOG</small></h3><input id='serial' class='inpL' placeholder='Serial'><input id='pass' type='password' class='inpL' placeholder='Modpas'><button class='btn btnG' style='margin-top:12px' onclick='doLogin()'>KONEKTE</button><div id='msg' style='color:red;margin-top:8px'></div></div></div><div id='mainPage' style='display:none'><div id='pV' class='tabPage active'><div class='card'><b>Tiraj (<span id='txtT'>0</span>)</b> <button onclick='selAll()' style='float:right;padding:4px 8px'>Tout</button><div id='tlist' style='margin-top:8px;display:flex;flex-wrap:wrap;gap:6px'></div></div><div class='card'><div id='bets'></div><button class='btn btnB' style='margin-top:8px' onclick='addR()'>+ Liy</button></div><div class='total'><span id='dt'>Total $0</span><span id='gt'>$0</span></div><div style='display:flex;gap:8px;margin:8px'><button class='btn btnG' style='flex:1;height:56px;font-size:20px' onclick='vann()'>VANN - SILENT</button><button class='btn btnB' style='flex:1' onclick='printLast()'>RE-PRINT</button></div><div id='prev'></div></div><div id='pR' class='tabPage'><div class='card'><h3>4- Rapò SILENT</h3><div style='display:flex;gap:8px;margin-top:8px'><div style='flex:1'><b>Du</b><input id='rdu' type='date' class='inpL'></div><div style='flex:1'><b>Au</b><input id='rau' type='date' class='inpL'></div></div><button class='btn btnG' style='margin-top:10px' onclick='calcR()'>Kalkile</button><div id='rres' style='display:none;margin-top:10px;background:#f8fff8;border:2px solid #0a4a2e;border-radius:10px;padding:10px'></div><div id='rprint' style='background:#fff;padding:10px;font-family:monospace;font-size:11px;border:2px dashed #0a4a2e;display:none;white-space:pre-wrap;text-align:center;margin-top:10px'></div><button class='btn btnB' style='margin-top:10px' onclick='printRapport()'>PRINT RAPO SILENT</button><button class='btn' style='margin-top:8px;background:#666;color:#fff' onclick='document.getElementById(&quot;rprint&quot;).style.display=&quot;none&quot;;'>RETOUNEN</button></div></div><div class='tabs'><button class='tab active' onclick=\"goTab('pV',this)\">Vendre</button><button class='tab' onclick=\"goTab('pR',this)\">Rapport</button></div></div><script>var firebaseConfig={apiKey:'AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4',authDomain:'cd-lotto.firebaseapp.com',databaseURL:'https://cd-lotto-default-rtdb.firebaseio.com',projectId:'cd-lotto',storageBucket:'cd-lotto.firebasestorage.app',messagingSenderId:'671091732195',appId:'1:671091732195:web:51bcfe8df83bc58fc75fd6'};try{firebase.initializeApp(firebaseConfig);}catch(e){}var db=firebase.database?firebase.database():null;var T=[['Borlette Matin','10:00'],['La Suerte 12:30','12:30'],['Haiti 14h','14:00'],['Borlette Soir 18h','18:00'],['FL midi','13:00'],['FL soir','21:00'],['NY soir','22:00'],['GA soir','18:00']];var DB={vendeurs:{},tickets:{}};var CUR=null,selT=[],LAST='';function getDate(){return new Date().toISOString().slice(0,10);}function listen(){if(!db){renderT();return}db.ref().on('value',function(s){var v=s.val()||{};DB.vendeurs=v.vendeurs||{};DB.tickets=v.tickets||{};renderT();});}async function doLogin(){var s=document.getElementById('serial').value.trim(),p=document.getElementById('pass').value.trim(),m=document.getElementById('msg');if(!s||!p){m.innerText='Mete Serial';return}if(!db){CUR={_key:'15',serial:s,nom:'Test'};openMain();return}var snap=await db.ref('vendeurs').once('value');var vs=snap.val()||{};var k=Object.keys(vs).find(function(k){return String(vs[k].serial)==String(s);});var f=k?vs[k]:null;if(!f||String(f.pass)!=String(p)){m.innerText='Modpas pa bon';return}CUR=f;CUR._key=k;openMain();}function openMain(){document.getElementById('loginPage').style.display='none';document.getElementById('mainPage').style.display='block';var t=getDate();document.getElementById('rdu').value=t;document.getElementById('rau').value=t;listen();addR();}function renderT(){var html='';T.forEach(function(t){var name=t[0];var chk=selT.includes(name)?'checked':'';html+='<label style=\"background:#dcfce7;border:1px solid #0a4a2e;border-radius:8px;padding:6px 10px;display:inline-flex;gap:4px;align-items:center\"><input type=\"checkbox\" value=\"'+name+'\" '+chk+' onchange=\"chg(this)\"> '+name+'</label>';});document.getElementById('tlist').innerHTML=html;}function chg(el){if(el.checked)selT.push(el.value);else selT=selT.filter(function(x){return x!=el.value});document.getElementById('txtT').innerText=selT.length;upd();}function selAll(){selT=[];T.forEach(function(t){selT.push(t[0]);});renderT();document.getElementById('txtT').innerText=selT.length;upd();}function addR(){var c=document.getElementById('bets');var d=document.createElement('div');d.className='betRow';d.innerHTML='<input class=\"boul inpN\" type=\"tel\" placeholder=\"--\" oninput=\"this.value=this.value.replace(/[^0-9]/g,\"\").slice(0,2);upd()\"><input class=\"mise inpN\" type=\"tel\" placeholder=\"$\" oninput=\"upd()\"><button style=\"background:#e11d48;color:#fff;border:0;width:40px;height:40px;border-radius:8px\" onclick=\"this.parentElement.remove();upd()\">X</button>';c.appendChild(d);}function upd(){var sum=0;document.querySelectorAll('.betRow').forEach(function(r){var m=parseInt(r.querySelector('.mise').value)||0;if(r.querySelector('.boul').value.trim()&&m)sum+=m;});document.getElementById('dt').innerText='Total $'+sum+' x '+selT.length;document.getElementById('gt').innerText='$'+(sum*selT.length);}function build(tk){var txt='';txt+='C&D VERITE LOTTO\\nFiche Original\\n----------------\\nVendeur: '+(CUR?CUR.serial:'')+'\\nDate: '+getDate()+'\\n----------------\\n';selT.forEach(function(t){txt+=t+'\\n';});tk.bets.forEach(function(b){txt+=b.numero+' - $'+b.mise+'\\n';});txt+='----------------\\nTotal => '+tk.total+' HTG\\nMesi!\\n\\n\\n';return txt;}function showP(t){var p=document.getElementById('prev');p.style.display='block';p.innerText=t;}function printBT(t){var plain=(t||LAST||'').toString();if(!plain)return;if(window.AndroidPrint&&window.AndroidPrint.printSilent){window.AndroidPrint.printSilent(plain);LAST=plain;showP(plain);return;}if(window.AndroidPrint&&window.AndroidPrint.printText){window.AndroidPrint.printText(plain);LAST=plain;showP(plain);return;}alert(plain);}function printLast(){if(!LAST){alert('Pa gen fich');return}printBT(LAST);}async function vann(){if(!selT.length){alert('Chwazi Tiraj');return}var bets=[];document.querySelectorAll('.betRow').forEach(function(r){var b=r.querySelector('.boul').value.trim(),m=parseInt(r.querySelector('.mise').value);if(b&&m)bets.push({numero:b,mise:m});});if(!bets.length){alert('VID');return}var base=bets.reduce(function(a,b){return a+b.mise;},0);var tk={id:'T'+Date.now().toString().slice(-7),bets:bets,tirages:selT.slice(),total:base*selT.length,date:getDate(),vendeurId:CUR?CUR._key,serial:CUR?CUR.serial};if(db)db.ref('tickets/'+tk.id).set(tk);var txt=build(tk);LAST=txt;showP(txt);printBT(txt);}async function calcR(){var du=document.getElementById('rdu').value,au=document.getElementById('rau').value;var rres=document.getElementById('rres');rres.style.display='block';rres.innerHTML='Kalkil...';var snap=await db.ref('tickets').once('value');var all=snap.val()||{};var vente=0,count=0;Object.values(all).forEach(function(t){var td=t.date;if(td<du||td>au)return;if(String(t.serial)!=String(CUR.serial)&&String(t.vendeurId)!=String(CUR._key))return;count++;vente+=t.total||0;});var kom=vente*0.1;var bal=vente-kom;rres.innerHTML='<div style=\"background:#0a4a2e;color:#d4af37;padding:8px;border-radius:8px;text-align:center\">RAPO '+du+' -> '+au+'</div><div class=\"rapo-line\"><span>Vant</span><b>$'+vente.toFixed(2)+'</b></div><div class=\"rapo-line\"><span>Kom 10%</span><b>$'+kom.toFixed(2)+'</b></div><div class=\"rapo-line\" style=\"background:#0a4a2e;color:#d4af37\"><span>Balans</span><b>$'+bal.toFixed(2)+'</b></div>';var txt='RAPPORT V26 SILENT\\nDu: '+du+' Au: '+au+'\\nFiches: '+count+'\\nVant: $'+vente.toFixed(2)+'\\nKom: $'+kom.toFixed(2)+'\\nBalans: $'+bal.toFixed(2)+'\\n\\n\\n';document.getElementById('rprint').style.display='block';document.getElementById('rprint').innerText=txt;LAST=txt;}function printRapport(){var rp=document.getElementById('rprint');var txt=rp?rp.innerText:'';if(!txt){alert('Kalkile avan');return}printBT(txt);}function goTab(id,el){document.querySelectorAll('.tabPage').forEach(function(p){p.classList.remove('active');});document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});if(el)el.classList.add('active');}</script></body></html>";
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  mainView=new WebView(this);
                  setContentView(mainView);
                  mainView.getSettings().setJavaScriptEnabled(true);
                  mainView.getSettings().setDomStorageEnabled(true);
                  mainView.addJavascriptInterface(new PrintBridge(), "AndroidPrint");
                  mainView.setWebViewClient(new WebViewClient(){
                      public void onPageFinished(WebView v, String u){
                          try{
                              android.webkit.WebView.evaluateJavascript("document.getElementById('st').innerText='SUNMI: '+ (window.AndroidPrint? 'READY SILENT' : '...')", null);
                          }catch(Exception e){}
                      }
                  });
                  mainView.loadDataWithBaseURL(null, htmlContent, "text/html", "utf-8", null);
                  initSunmi();
              }
              void initSunmi(){
                  try{
                      Class<?> managerCls = Class.forName("com.sunmi.peripheral.printer.InnerPrinterManager");
                      Method getInstance = managerCls.getMethod("getInstance");
                      Object manager = getInstance.invoke(null);
                      Class<?> callbackCls = Class.forName("com.sunmi.peripheral.printer.InnerPrinterCallback");
                      Object callback = java.lang.reflect.Proxy.newProxyInstance(callbackCls.getClassLoader(), new Class[]{callbackCls}, (proxy, method, args)->{
                          if(method.getName().equals("onConnected")){
                              sunmiService = args[0];
                              sunmiReady = true;
                              Log.i("SUNMI","Connected SILENT ready");
                              runOnUiThread(()->{ mainView.evaluateJavascript("document.getElementById('st').innerText='SUNMI: SILENT OK'", null); });
                          }
                          return null;
                      });
                      Method init = managerCls.getMethod("init", android.content.Context.class, callbackCls);
                      init.invoke(manager, this, callback);
                  }catch(Exception e){ Log.e("SUNMI","Init fail: "+e); }
              }
              public class PrintBridge{
                  @JavascriptInterface public void printSilent(String txt){ printSunmiSilent(txt); }
                  @JavascriptInterface public void printText(String txt){ printSunmiSilent(txt); }
                  void printSunmiSilent(String txt){
                      runOnUiThread(()->{
                          try{
                              if(sunmiService!=null && sunmiReady){
                                  Method printText = sunmiService.getClass().getMethod("printText", String.class);
                                  Method lineWrap = sunmiService.getClass().getMethod("lineWrap", int.class);
                                  printText.invoke(sunmiService, txt);
                                  lineWrap.invoke(sunmiService, 4);
                                  Log.i("SUNMI","Printed SILENT: "+txt.substring(0, Math.min(30, txt.length())));
                                  return;
                              }
                          }catch(Exception e){ Log.e("SUNMI","Silent fail "+e); }
                          // Fallback to dialog if Sunmi not ready
                          try{
                              String html="<html><body><pre style='font-family:monospace;text-align:center;white-space:pre-wrap'>"+android.text.TextUtils.htmlEncode(txt)+"</pre></body></html>";
                              WebView pv=new WebView(MainActivity.this);
                              pv.setWebViewClient(new WebViewClient(){
                                  public void onPageFinished(WebView v, String u){
                                      try{android.print.PrintManager pm=(android.print.PrintManager)getSystemService(android.content.Context.PRINT_SERVICE); pm.print("C&D", v.createPrintDocumentAdapter("C&D"), new android.print.PrintAttributes.Builder().build());}catch(Exception e){}
                                  }
                              });
                              pv.loadDataWithBaseURL(null, html, "text/HTML", "UTF-8", null);
                          }catch(Exception e){}
                      });
                  }
              }
          }
          JAVA
      - name: Build
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: APK-V26-SUNMI-SILENT-NO-DIALOG, path: app/build/outputs/apk/debug/*.apk }
