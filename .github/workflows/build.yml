name: Build V26 CORRIGE SILENT FINAL
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.2.1 }
      - name: Build V26 SILENT
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          printf "pluginManagement{ repositories{ google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement{ repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n repositories{ google(); mavenCentral() } }\ninclude ':app'\n" > settings.gradle
          echo "" > build.gradle
          mkdir -p app/src/main/java/com/cdlotto/app app/src/main/res/values
          printf "plugins{ id 'com.android.application' version '8.1.0' }\nandroid{ namespace 'com.cdlotto.v26fixed'; compileSdk 33; defaultConfig{ applicationId 'com.cdlotto.v26fixed'; minSdk 21; targetSdk 33; versionCode 26; versionName '26-CORRIGE-SILENT' } }\n" > app/build.gradle
          echo '<resources><string name="app_name">C&D V26 SILENT</string></resources>' > app/src/main/res/values/strings.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="C&D V26 SILENT"><activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar.Fullscreen"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          python3 << 'PY'
          code = '''
          package com.cdlotto.app;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; import android.webkit.JavascriptInterface; import java.lang.reflect.Method;
          public class MainActivity extends Activity{
              WebView mainView; Object sunmiService=null; boolean sunmiReady=false;
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  mainView=new WebView(this);
                  setContentView(mainView);
                  mainView.getSettings().setJavaScriptEnabled(true);
                  mainView.getSettings().setDomStorageEnabled(true);
                  mainView.addJavascriptInterface(new PrintBridge(), "AndroidPrint");
                  mainView.setWebViewClient(new WebViewClient());
                  mainView.loadUrl("https://cd-lotto.vercel.app/vendeur.html");
                  initSunmi();
              }
              void initSunmi(){
                  try{
                      Class<?> managerCls = Class.forName("com.sunmi.peripheral.printer.InnerPrinterManager");
                      Method getInstance = managerCls.getMethod("getInstance");
                      Object manager = getInstance.invoke(null);
                      Class<?> callbackCls = Class.forName("com.sunmi.peripheral.printer.InnerPrinterCallback");
                      Object callback = java.lang.reflect.Proxy.newProxyInstance(callbackCls.getClassLoader(), new Class[]{callbackCls}, (proxy, method, args)->{
                          if(method.getName().equals("onConnected")){
                              sunmiService = args[0];
                              sunmiReady = true;
                          }
                          return null;
                      });
                      Method init = managerCls.getMethod("init", android.content.Context.class, callbackCls);
                      init.invoke(manager, this, callback);
                  }catch(Exception e){}
              }
              public class PrintBridge{
                  @JavascriptInterface public void printSilent(String txt){ printSunmi(txt); }
                  @JavascriptInterface public void printText(String txt){ printSunmi(txt); }
                  void printSunmi(String txt){
                      runOnUiThread(()->{
                          try{
                              if(sunmiService!=null && sunmiReady){
                                  Method m1 = sunmiService.getClass().getMethod("printText", String.class);
                                  Method m2 = sunmiService.getClass().getMethod("lineWrap", int.class);
                                  m1.invoke(sunmiService, txt);
                                  m2.invoke(sunmiService, 4);
                                  return;
                              }
                          }catch(Exception e){}
                      });
                  }
              }
          }
          '''
          open('app/src/main/java/com/cdlotto/app/MainActivity.java','w').write(code)
          PY
      - name: Build
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: APK-V26-CORRIGE-SILENT-FINAL, path: app/build/outputs/apk/debug/*.apk }
