name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1
      - name: Setup App with Logo CD
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          printf "pluginManagement{\n repositories{\n google()\n mavenCentral()\n gradlePluginPortal()\n }\n}\ndependencyResolutionManagement{\n repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n repositories{\n google()\n mavenCentral()\n }\n}\ninclude ':app'\n" > settings.gradle
          echo "" > build.gradle
          mkdir -p app/src/main/java/com/cdlotto/app
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values
          # Create logo with Python - simple and works
          python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          def make(size, out):
              img = Image.new('RGB', (size, size), (13, 27, 100))
              d = ImageDraw.Draw(img)
              # Gold CD text
              try:
                  f = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', size//2)
              except:
                  f = ImageFont.load_default()
              txt='CD'
              bbox=d.textbbox((0,0), txt, font=f)
              w=bbox[2]-bbox[0]
              h=bbox[3]-bbox[1]
              d.text(((size-w)/2, (size-h)/2), txt, font=f, fill=(255,215,0))
              # small lotto dots
              d.ellipse([size*0.1, size*0.1, size*0.25, size*0.25], fill=(255,80,80))
              d.ellipse([size*0.75, size*0.1, size*0.9, size*0.25], fill=(255,220,50))
              d.ellipse([size*0.1, size*0.75, size*0.25, size*0.9], fill=(80,200,255))
              d.ellipse([size*0.75, size*0.75, size*0.9, size*0.9], fill=(100,255,100))
              img.save(out)
              print(f'icon {size} -> {out}')
          make(48, 'app/src/main/res/mipmap-mdpi/ic_launcher.png')
          make(72, 'app/src/main/res/mipmap-hdpi/ic_launcher.png')
          make(96, 'app/src/main/res/mipmap-xhdpi/ic_launcher.png')
          make(144, 'app/src/main/res/mipmap-xxhdpi/ic_launcher.png')
          make(192, 'app/src/main/res/mipmap-xxxhdpi/ic_launcher.png')
          make(48, 'app/src/main/res/mipmap-mdpi/ic_launcher_round.png')
          make(72, 'app/src/main/res/mipmap-hdpi/ic_launcher_round.png')
          make(96, 'app/src/main/res/mipmap-xhdpi/ic_launcher_round.png')
          make(144, 'app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png')
          make(192, 'app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png')
          "
          echo '<resources><string name="app_name">CD Lotto</string></resources>' > app/src/main/res/values/strings.xml
          printf "plugins{\n id 'com.android.application' version '8.1.0'\n}\nandroid{\n namespace 'com.cdlotto.app'\n compileSdk 33\n defaultConfig{\n applicationId 'com.cdlotto.app'\n minSdk 21\n targetSdk 33\n versionCode 259\n versionName '25.9'\n }\n buildTypes{\n debug{ minifyEnabled false }\n }\n}\n" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"><activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.cdlotto.app;import android.app.Activity;import android.os.Bundle;import android.webkit.WebView;import android.webkit.WebViewClient;public class MainActivity extends Activity{protected void onCreate(Bundle b){super.onCreate(b);WebView w=new WebView(this);setContentView(w);w.getSettings().setJavaScriptEnabled(true);w.getSettings().setDomStorageEnabled(true);w.setWebViewClient(new WebViewClient());w.loadUrl("https://cd-lotto.vercel.app/vendeur.html");}}' > app/src/main/java/com/cdlotto/app/MainActivity.java
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Check size
        run: ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: APK-CD-LOTTO-LOGO
          path: app/build/outputs/apk/debug/*.apk
