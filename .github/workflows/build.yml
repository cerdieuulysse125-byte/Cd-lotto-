name: Build APK V26.6 LOGO FIX
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Find and Build APK
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -n 1)
          echo "Found gradlew at: $GRADLEW"
          chmod +x "$GRADLEW"
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-V26.6-LOGO-FIX
          path: "**/app/build/outputs/apk/debug/*.apk"
