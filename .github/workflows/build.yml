name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1
      - name: Setup NEW PACKAGE - PRINT
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          printf "pluginManagement{ repositories{ google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement{ repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n repositories{ google(); mavenCentral() } }\ninclude ':app'\n" > settings.gradle
          echo "" > build.gradle
          mkdir -p app/src/main/java/com/cdlotto/app
          mkdir -p app/src/main/res/values
          printf "plugins{ id 'com.android.application' version '8.1.0' }\nandroid{ namespace 'com.cdlotto.printfix'; compileSdk 33; defaultConfig{ applicationId 'com.cdlotto.printfix'; minSdk 21; targetSdk 33; versionCode 1; versionName '1.0-PRINT' } }\n" > app/build.gradle
          echo '<resources><string name="app_name">C&amp;D Print Fix</string></resources>' > app/src/main/res/values/strings.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="C&amp;D Print Fix"><activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          printf "package com.cdlotto.app;\nimport android.app.Activity;import android.os.Bundle;import android.webkit.WebView;import android.webkit.WebViewClient;import android.webkit.WebChromeClient;import android.print.PrintManager;import android.print.PrintDocumentAdapter;import android.print.PrintAttributes;import android.content.Context;import android.webkit.JavascriptInterface;\npublic class MainActivity extends Activity{ WebView w; protected void onCreate(Bundle b){ super.onCreate(b); w=new WebView(this); setContentView(w); w.getSettings().setJavaScriptEnabled(true); w.getSettings().setDomStorageEnabled(true); w.getSettings().setAllowFileAccess(true); w.getSettings().setSupportMultipleWindows(true); w.getSettings().setJavaScriptCanOpenWindowsAutomatically(true); w.addJavascriptInterface(new Object(){ @JavascriptInterface public void printPage(){ runOnUiThread(new Runnable(){ public void run(){ PrintManager pm=(PrintManager)getSystemService(Context.PRINT_SERVICE); PrintDocumentAdapter ad=w.createPrintDocumentAdapter(\"CD\"); pm.print(\"CD Lotto\", ad, new PrintAttributes.Builder().build()); } }); } }, \"AndroidPrint\"); w.setWebViewClient(new WebViewClient()); w.setWebChromeClient(new WebChromeClient(){ public boolean onCreateWindow(WebView view, boolean d, boolean g, android.os.Message m){ WebView nv=new WebView(MainActivity.this); nv.getSettings().setJavaScriptEnabled(true); nv.setWebViewClient(new WebViewClient(){ public void onPageFinished(WebView v, String u){ PrintManager pm=(PrintManager)getSystemService(Context.PRINT_SERVICE); pm.print(\"Rapport\", v.createPrintDocumentAdapter(\"Rapport\"), new PrintAttributes.Builder().build()); } }); WebView.WebViewTransport t=(WebView.WebViewTransport)m.obj; t.setWebView(nv); m.sendToTarget(); return true; } }); w.loadUrl(\"https://cd-lotto.vercel.app/vendeur.html\"); } public void onBackPressed(){ if(w.canGoBack()) w.goBack(); else super.onBackPressed(); } }\n" > app/src/main/java/com/cdlotto/app/MainActivity.java
      - name: Build
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: APK-CD-PRINT-NEW-PACKAGE
          path: app/build/outputs/apk/debug/*.apk
