name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10
      - name: Setup
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties && echo "pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}" > settings.gradle && echo "include ':app'" >> settings.gradle && echo "" > build.gradle && mkdir -p app/src/main/java/com/cdlotto/app && echo "plugins{id 'com.android.application' version '8.1.0'}" > app/build.gradle && echo "android{namespace 'com.cdlotto.app';compileSdk 34;defaultConfig{applicationId 'com.cdlotto.app';minSdk 21;targetSdk 34;versionCode 257;versionName '25.7'};buildTypes{debug{minifyEnabled false}}}" >> app/build.gradle && echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="CD Lotto"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml && echo 'package com.cdlotto.app;import android.app.Activity;import android.os.Bundle;import android.webkit.WebView;import android.webkit.WebViewClient;public class MainActivity extends Activity{protected void onCreate(Bundle b){super.onCreate(b);WebView w=new WebView(this);setContentView(w);w.getSettings().setJavaScriptEnabled(true);w.setWebViewClient(new WebViewClient());w.loadUrl("https://cd-lotto.vercel.app/vendeur.html");}}' > app/src/main/java/com/cdlotto/app/MainActivity.java
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: APK-FINAL
          path: app/build/outputs/apk/debug/*.apk
