<script>
const DB_ROOT="https://cd-lotto-default-rtdb.firebaseio.com";
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:DB_ROOT,projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const TIRAJ_ALL=['GA midi','FL midi','NY midi','GA soir','FL soir','NY soir','Real','Primera día','Suerte día','Lote Dom','Ganamas','Suerte noche','Primera noche','Loteka','Nacional noche','Leidsa','Anguila 10h','Anguila 18h'];
let DB={vendeurs:{},proprios:{},tickets:{},results:{},limites:{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}},prix:{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000,kom:10}},blokeVendeur:{},blokeProprio:{}};
let CUR=null,MY_VENDEUR_ID=null,MY_SERIAL=null,MY_PROPRIO_ID=null;
let bets=[];
function toggleMenu(){document.getElementById('drawer').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
function goTab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');toggleMenu();}
function init(){db.ref().on('value',snap=>{let v=snap.val()||{};DB.vendeurs=v.vendeurs||{};DB.proprios=v.proprios||{};DB.tickets=v.tickets||{};DB.results=v.results||{};DB.limites=v.limites||{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}};DB.prix=v.prix||{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000,kom:10}};DB.blokeVendeur=v.blokeVendeur||{};DB.blokeProprio=v.blokeProprio||{};syncInfo.innerText=Object.keys(DB.results).length+'R';if(mainBox.style.display!='none')loadAll();});}
function setToday(){const t=new Date().toISOString().split('T')[0];if(fDate)fDate.value=t;if(rDu)rDu.value=t;if(rAu)rAu.value=t;}
function doLogin(){let s=ln.value.trim(),p=lp.value.trim();if(!s||!p){loginMsg.innerText='Antre seri ak modpas';return;}db.ref('vendeurs').once('value').then(snap=>{let all=snap.val()||{},f=null,fId=null;for(let id in all){if((all[id].serial||'').toLowerCase()===s.toLowerCase()||id.toLowerCase()===s.toLowerCase()){f=all[id];fId=id;break;}}if(!f||(f.pass||'')!==p){loginMsg.innerText='Pa bon';return;}db.ref('blokeVendeur/'+fId).once('value').then(sb=>{if(sb.val()===true||f.bloke===true||f.actif===false){loginMsg.innerText='BLOKE';return;}CUR={nom:f.nom,serial:f.serial,id:fId,proprioId:f.proprioId};MY_VENDEUR_ID=fId;MY_SERIAL=f.serial;MY_PROPRIO_ID=f.proprioId;localStorage.setItem('curV',JSON.stringify(CUR));document.getElementById('loginBox').style.display='none';document.getElementById('mainBox').style.display='block';vUser.innerText=f.nom;vSerial.innerText=f.serial;dLogo.innerText=f.nom.substring(0,2).toUpperCase();loadAll();setToday();});});}
function logout(){localStorage.removeItem('curV');location.reload();}
function loadAll(){
 let sel=document.getElementById('selTirage');if(sel)sel.innerHTML=TIRAJ_ALL.map(t=>`<option>${t}</option>`).join('');
 loadAkey();loadFiches();
 let limG=DB.limites.global||{bor:1500,mar:100,l3:100,l4:20,l5:5};
 let limV=DB.limites[MY_VENDEUR_ID]||DB.limites[MY_SERIAL]||limG;
 limitInfo.innerText=`Global Bor ${limG.bor} Mar ${limG.mar} L3 ${limG.l3} L4 ${limG.l4} L5 ${limG.l5} | Pa Vandè ${MY_SERIAL} Bor ${limV.bor} Mar ${limV.mar} L3 ${limV.l3} L4 ${limV.l4} L5 ${limV.l5}`;
 paramSeri.innerText=MY_SERIAL;paramProp.innerText=DB.proprios[MY_PROPRIO_ID]?.nom||MY_PROPRIO_ID;
}
function loadAkey(){
 let results=Object.values(DB.results).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''));
 let now=new Date();updatedTxt.innerText='Updated today • '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
 let bases=[
  {key:'new york',logoBase:'NY',color:' #1e40af',logoTxt:'NEW YORK LOTTERY',cols:['pill-blue','pill-orange','pill-lightblue']},
  {key:'florida',logoBase:'FL',logoTxt:'FLORIDA LOTTERY',cols:['pill-teal','pill-orange','pill-pink']},
  {key:'georgia',logoBase:'GA',logoTxt:'GEORGIA LOTTERY',cols:['pill-green','pill-yellow','pill-lightgreen']},
  {key:'anguilla',logoBase:'AG',logoTxt:'ANGUILLA LOTTERY',cols:['pill-yellow','pill-darkblue','pill-yellow']},
  {key:'real',logoBase:'REAL',logoTxt:'REAL',cols:['pill-blue','pill-orange','pill-lightblue']},
  {key:'loteka',logoBase:'LOTEKA',logoTxt:'LOTEKA',cols:['pill-green','pill-yellow','pill-lightgreen']}
 ];
 let html='';
 bases.forEach(b=>{
  let soir=results.filter(r=>r.tirage.toLowerCase().includes(b.key) && r.tirage.toLowerCase().includes('soir')).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''))[0] || results.filter(r=>r.tirage.toLowerCase().includes(b.key)).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''))[0];
  let midi=results.filter(r=>r.tirage.toLowerCase().includes(b.key) && r.tirage.toLowerCase().includes('midi')).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''))[0];
  if(!soir &&!midi) return;
  let l3S=soir?((soir.l3||'000').padStart(3,'0')):'---';let r1S=soir?((soir.r1||l3S.slice(-2)).padStart(2,'0')):'--';let r2S=soir?((soir.r2||'--').padStart(2,'0')):'--';let r3S=soir?((soir.r3||'--').padStart(2,'0')):'--';
  let l3M=midi?((midi.l3||'000').padStart(3,'0')):'---';let r1M=midi?((midi.r1||'--').padStart(2,'0')):'--';let r2M=midi?((midi.r2||'--').padStart(2,'0')):'--';
  let logoHtml=soir||midi?`<div style="width:72px;height:72px;border-radius:50%;background:#fff;border:2px solid #0a4a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:9px;text-align:center;line-height:1.1"><span style="font-size:10px;color:#0a4a2e">${b.logoBase}</span><span style="font-size:8px;color:#6b7280">${(soir?soir.dat||'':'' ).slice(5)}</span></div>`: `<div style="width:72px;height:72px;border-radius:50%;background:#0a4a2e;color:#d4af37;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px">${b.logoBase}</div>`;
  html+=`<div class="lottoCard"><div class="lottoLogo">${logoHtml}</div><div style="flex:1"><h3 style="font-size:15px;font-weight:800">${b.key.toUpperCase()} Lottery</h3><div class="pills"><span class="pill ${b.cols[0]}">${l3S}</span><span class="pill ${b.cols[1]}">${r1S}</span><span class="pill ${b.cols[2]}">${r2S}</span><span class="pill pill-blue">${r3S}</span></div><div class="midi">Aujourd'hui Soir <b>${soir?soir.tirage:''} ${l3S} • ${r1S} • ${r2S} • ${r3S}</b><br>Aujourd'hui Midi <b>${midi?midi.tirage:''} ${l3M} • ${r1M} • ${r2M}</b></div></div></div>`;
 });
 if(!html){
  html=`<div class="lottoCard"><div class="lottoLogo">NY</div><div style="flex:1"><h3>NY Lottery - Pa gen rezilta - Menm Baz</h3><div class="pills"><span class="pill pill-blue">---</span><span class="pill pill-orange">--</span><span class="pill pill-lightblue">--</span></div><div class="midi">Aucun tirage - Antre rezilta nan Proprio</div></div></div>`;
 }
 document.getElementById('lottoCards').innerHTML=html;
 document.getElementById('tableResAkey').innerHTML=results.map(r=>{
  let l3=(r.l3||'000').padStart(3,'0'),r1=(r.r1||l3.slice(-2)).padStart(2,'0'),r2=(r.r2||'00').padStart(2,'0'),r3=(r.r3||'00').padStart(2,'0'),m1=r.m1||r1+r2,m2=r.m2||r1+r3,m3=r.m3||r2+r3,l4=r.l4||r2+r3,l5=r.l5||l3+r2;
  return `<tr><td>${r.dat}</td><td>${r.tirage}</td><td>${l3}</td><td>${r1}</td><td>${r2}</td><td>${r3}</td><td>${m1}</td><td>${m2}</td><td>${m3}</td><td>${l4}</td><td>${l5}</td></tr>`;
 }).join('')||'<tr><td colspan="11">Pa gen rezilta</td></tr>';
}
function addBet(){bets.push({type:'boul',numero:'',mise:10});renderBets();}
function renderBets(){let box=document.getElementById('betsBox');box.innerHTML=bets.map((b,i)=>`<div style="display:flex;gap:6px;margin-top:6px"><select onchange="bets[${i}].type=this.value" style="flex:1"><option value="boul" ${b.type==='boul'?'selected':''}>Boul</option><option value="maryaj" ${b.type==='maryaj'?'selected':''}>Maryaj</option><option value="loto3" ${b.type==='loto3'?'selected':''}>Loto3</option><option value="loto4" ${b.type==='loto4'?'selected':''}>Loto4 LÒD</option><option value="loto5" ${b.type==='loto5'?'selected':''}>Loto5 LÒD</option></select><input placeholder="Num" value="${b.numero}" oninput="bets[${i}].numero=this.value;updateTotal()" style="flex:1"><input type="number" value="${b.mise}" oninput="bets[${i}].mise=+this.value;updateTotal()" style="flex:0.7"><button onclick="bets.splice(${i},1);renderBets()" style="background:#c62828;color:#fff;border:0;padding:8px 10px;border-radius:8px">X</button></div>`).join('');updateTotal();}
function updateTotal(){let t=bets.reduce((a,b)=>a+(+b.mise||0),0);totalVente.innerText=t;}
function saveFich(){
 if(!bets.length)return alert('Ajoute miz');
 let tirage=selTirage.value;let total=bets.reduce((a,b)=>a+(+b.mise||0),0);
 let limG=DB.limites.global||{bor:1500,mar:100,l3:100,l4:20,l5:5};let limV=DB.limites[MY_VENDEUR_ID]||DB.limites[MY_SERIAL]||limG;
 let c={bor:0,mar:0,l3:0,l4:0,l5:0};bets.forEach(b=>{if(b.type==='boul')c.bor+=+b.mise||0;if(b.type==='maryaj')c.mar+=+b.mise||0;if(b.type==='loto3')c.l3+=+b.mise||0;if(b.type==='loto4')c.l4+=+b.mise||0;if(b.type==='loto5')c.l5+=+b.mise||0;});
 if(c.bor>limV.bor||c.mar>limV.mar||c.l3>limV.l3||c.l4>limV.l4||c.l5>limV.l5)return alert(`Limit depase ${MY_SERIAL} Bor ${limV.bor} Mar ${limV.mar} L3 ${limV.l3} L4 ${limV.l4} L5 ${limV.l5}`);
 let dateHaiti=new Date().toISOString().slice(0,10);let id='f_'+Date.now();
 db.ref('tickets/'+id).set({id,serial:MY_SERIAL,vendeurId:MY_VENDEUR_ID,proprioId:MY_PROPRIO_ID,tirage,tirages:[tirage],bets:bets.map(b=>({type:b.type,numero:String(b.numero).padStart(b.type==='loto3'?3:b.type==='loto5'?5:2,'0'),mise:+b.mise})),total,dateHaiti,dat:dateHaiti}).then(()=>{bets=[];renderBets();alert(`Fich ${id} $${total}`);loadFiches();});
}
function copyFich(){let id=copyId.value.trim();if(!id)return;db.ref('tickets/'+id).once('value').then(snap=>{let t=snap.val();if(!t)return;bets=(t.bets||[]).map(b=>({type:b.type,numero:b.numero,mise:b.mise}));selTirage.value=t.tirage||TIRAJ_ALL[0];renderBets();copyPreview.innerHTML=`<div class="card"><b>${id}</b><br>${(t.bets||[]).map(b=>b.type+' '+b.numero+' $'+b.mise).join(' | ')}</div>`;goTab('t1');});}
function loadFiches(){let d=fDate.value||new Date().toISOString().slice(0,10);let arr=Object.values(DB.tickets).filter(t=>t.serial===MY_SERIAL && (t.dateHaiti||'').substring(0,10)===d);fList.innerHTML=arr.map(t=>`<div class="card"><b>${t.id}</b> $${t.total} - ${t.tirage} - ${(t.bets||[]).map(b=>b.type+' '+b.numero+' $'+b.mise).join(' | ')}<br><button onclick="copyId.value='${t.id}';copyFich()" style="background:#4a148c;color:#fff;border:0;padding:6px 10px;border-radius:6px;margin-top:6px">Kopye</button></div>`).join('')||'Pa gen fich';}
function checkPeye(){
 let id=payId.value.trim();if(!id)return;
 db.ref('tickets/'+id).once('value').then(snap=>{
  let tic=snap.val();if(!tic)return;
  let results=Object.values(DB.results).filter(r=> (tic.tirages||[tic.tirage]).includes(r.tirage) || r.dat===tic.dat);
  let prix=DB.prix[MY_VENDEUR_ID]||DB.prix[MY_PROPRIO_ID]||DB.prix.global;
  let totalPeye=0,det='';
  (tic.bets||[]).forEach(b=>{
   let num=String(b.numero||'').padStart(b.type==='loto3'?3:b.type==='loto5'?5:2,'0'),mise=b.mise||0,type=b.type||'boul';
   results.forEach(r=>{
    let l3=(r.l3||'000').padStart(3,'0'),r1=(r.r1||l3.slice(-2)).padStart(2,'0'),r2=(r.r2||'00').padStart(2,'0'),r3=(r.r3||'00').padStart(2,'0'),l4=r2+r3,m1=r1+r2,m2=r1+r3,m3=r2+r3,l5=l3+r2;

 });

function calcRapport(){
 let du=rDu.value,au=rAu.value;if(!du||!au)return;

    let gain=0;if(type==='boul'){if(num===r1)gain=mise*prix.p1;else if(num===r2)gain=mise*prix.p2;else if(num===r3)gain=mise*prix.p3;}else if(type==='loto3'){if(num===l3)gain=mise*prix.l3;}else if(type==='maryaj'){if(num===m1||num===r2+r1)gain=mise*prix.m1;else if(num===m2||num===r3+r1)gain=mise*prix.m2;else if(num===m3||num===r3+r2)gain=mise*prix.m3;}else if(type==='loto4'){if(num===l4)gain=mise*5000;}else if(type==='loto5'){if(num===l5)gain=mise*prix.l5;}
    if(gain>0){peye+=gain;det+=`<div style="padding:6px;border-bottom:1px dashed #ccc"><b>${r.tirage} ${r.dat} ${type} ${num} $${mise} → $${gain}</b></div>`;printTxt+=`${r.tirage} ${type} ${num} $${mise} -> $${gain}\n`;}
   });
  });
 });
 let balans=vente-kom-peye;
 rapportRes.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="background:#e8f5e9;padding:10px;border-radius:8px"><b>Vant</b><br>$${vente}</div><div style="background:#fff3e0;padding:10px;border-radius:8px"><b>Komisyon</b><br>$${kom.toFixed(2)}</div><div style="background:#ffebee;padding:10px;border-radius:8px"><b>A Peye</b><br>$${peye}</div><div style="background:#e3f2fd;padding:10px;border-radius:8px"><b>Balans Net</b><br>$${balans.toFixed(2)}</div></div>`;
 rapportDetail.innerHTML=det||'Pa gen gayan';printZone.innerText=printTxt+`Vant $${vente}\nKomisyon $${kom.toFixed(2)}\nA Peye $${peye}\nBalans $${balans.toFixed(2)}`;printZone.style.display='block';btnPrint.style.display='block';
}
