<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C&D VÉRITÉ LOTTO</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:Arial, sans-serif}
.card{background:#fff;border-radius:24px;padding:28px;width:92%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
h1{text-align:center;margin:0 0 5px 0;font-size:30px;letter-spacing:1px}
.sub{text-align:center;font-size:14px;margin-bottom:20px;color:#333}
input{width:100%;padding:16px;border:2.5px solid #000;border-radius:14px;margin:10px 0;font-size:16px;outline:none}
button{width:100%;padding:16px;background:#000;color:#fff;border:none;border-radius:14px;font-size:18px;font-weight:bold;margin-top:12px;cursor:pointer}
button:active{transform:scale(0.98)}
#dashboard{display:none}
.ticket{border:2px dashed #000;padding:15px;border-radius:12px;margin-top:15px}
.badge{background:#000;color:#fff;padding:5px 10px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<div class="card">
<div id="loginDiv">
<h1>C&D VÉRITÉ LOTTO</h1>
<div class="sub">Login Vendeur - Modpas separe ak Proprio</div>
<input id="nom" placeholder="Non Vendeur">
<input id="pass" type="password" placeholder="Modpas Vendeur ••••">
<button onclick="login()">ANTRE</button>
<p id="msg" style="color:red;text-align:center;min-height:20px;margin-top:10px"></p>
</div>

<div id="dashboard">
<h2 id="welcome" style="text-align:center"></h2>
<p style="text-align:center">Ou konekte avèk siksè ✅</p>
<div class="ticket">
<p><b>Vandè:</b> <span id="vName"></span></p>
<p>Kontni vant lotto ou ap vini isit la...</p>
<p style="font-size:12px;color:#666">Firestore konekte: cd-lotto</p>
</div>
<button onclick="logout()" style="background:#fff;color:#000;border:2px solid #000;margin-top:20px">Dekonekte</button>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",
  authDomain: "cd-lotto.firebaseapp.com",
  databaseURL: "https://cd-lotto-default-rtdb.firebaseio.com",
  projectId: "cd-lotto",
  storageBucket: "cd-lotto.firebasestorage.app",
  messagingSenderId: "671091732195",
  appId: "1:671091732195:web:51bcfe8df83bc58fc75fd6",
  measurementId: "G-TWK9N38BS0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function login(){
  const nom = document.getElementById('nom').value.trim();
  const pass = document.getElementById('pass').value.trim();
  const msg = document.getElementById('msg');
  if(!nom || !pass){ msg.innerText="Ranpli tout chan yo"; return; }
  msg.innerText="Ap verifye...";
  try{
    const snap = await db.collection('vendeurs').where('nom','==',nom).where('modpas','==',pass).get();
    if(snap.empty){
      const snap2 = await db.collection('vendeurs').where('nom','==',nom).get();
      if(snap2.empty) msg.innerText="Vandè sa pa egziste";
      else msg.innerText="Modpas pa kòrèk";
    } else {
      document.getElementById('loginDiv').style.display='none';
      document.getElementById('dashboard').style.display='block';
      document.getElementById('welcome').innerText="Bonjou "+nom+" !";
      document.getElementById('vName').innerText=nom;
      msg.innerText="";
    }
  } catch(e){
    msg.innerText="Erè Firestore: "+e.message;
    console.log(e);
  }
}
function logout(){
  document.getElementById('dashboard').style.display='none';
  document.getElementById('loginDiv').style.display='block';
  document.getElementById('nom').value=""; 
  document.getElementById('pass').value="";
  document.getElementById('msg').innerText="";
}
</script>
</body>
</html>
