<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;padding:8px;background:#fff}
.header{font-weight:900;font-size:22px;padding:10px 0}
.yellow{background:#FFD500;text-align:center;padding:8px;font-weight:900;border:2px solid #000}
.black{background:#000;color:#FFD500;text-align:center;padding:6px;font-weight:900;font-size:12px}
.menu{display:flex;gap:2px;margin:6px 0}
.menu div{flex:1;border:2px solid #000;text-align:center;padding:8px;font-size:11px;font-weight:900}
.menu div.active{background:#FFD500}
.limite{background:#FFD500;border:2px solid red;border-radius:30px;padding:8px;text-align:center;font-weight:900;font-size:11px;margin:8px 0}
.tiraj{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tiraj button{border:2px solid #000;border-radius:30px;padding:12px 0;font-weight:900;background:#fff}
.tiraj button.active{background:#FFD500}
.center{border:2px solid #000;border-radius:30px;padding:10px;text-align:center;font-weight:900;margin:10px 0}
.line{display:flex;gap:5px;margin-bottom:8px}
.line select{flex:1;border:2px solid #000;border-radius:30px;padding:12px 5px;font-weight:900;text-align:center}
.line input{flex:1;border:2px solid #000;border-radius:30px;padding:12px 5px;font-weight:900;text-align:center}
.line input.miz{background:#FFD500}
.btn-x{border:2px solid red;color:red;background:#fff;border-radius:30px;width:48px;height:48px;font-weight:900}
.btn-d{background:#FFD500;border:2px solid #000;border-radius:30px;width:48px;height:48px;font-weight:900}
.total{border:2px solid #000;border-radius:30px;padding:12px;text-align:center;font-weight:900;margin:10px 0}
.actions{display:flex;gap:6px}
.btn-v{flex:1;background:#000;color:#FFD500;border-radius:30px;padding:14px;font-weight:900}
.btn-p{flex:1;background:#0A8A00;color:#FFD500;border-radius:30px;padding:10px;font-weight:900;font-size:12px;border:2px solid #000}
</style>
</head>
<body>

<div class="header">VÉRITÉ LOTTO</div>
<div class="yellow">VENDEUR - JEAN - V7.9.1 RESTORE</div>
<div class="black">2026-08-18 | JEAN | 10%</div>

<div class="menu">
<div class="active">1.VENTE</div><div>2.KOPYE</div><div>3.FICHES</div><div>4.RAPPORT</div>
</div>

<div class="limite">Limite Global Vandè1+Vandè2+... Respekte - Bòlèt 1500 Maryaj 100 L3 100 L4 20 L5 5</div>

<div class="tiraj" id="tirajGrid">
<button class="active">GA MIDI ✓</button><button>FL MIDI</button><button>NY MIDI</button>
<button>GA SOIR</button><button>FL SOIR</button><button>NY SOIR</button>
</div>

<div class="center">GA MIDI ✓</div>

<div id="container">
  <div class="line">
    <select><option>MARYAJ</option><option>LOTO3</option><option>BOLET</option></select>
    <input type="text" inputmode="numeric" placeholder="50" class="boul">
    <input type="text" inputmode="numeric" placeholder="25" class="miz">
    <button class="btn-x">X</button>
    <button class="btn-d" onclick="addLine(this)">↓</button>
  </div>
</div>

<div class="total">Total ×tiraj - $0 × 1 = $0 - Flèche ↓ kenbe je</div>

<div class="actions">
<button class="btn-v" onclick="valider()">💾 VALIDER</button>
<button class="btn-p" onclick="valider()">🖨️ VALIDER + IMPRIMER SANTRÉ</button>
</div>

<script>
function addLine(btn){
  const line = btn.closest('.line');
  const type = line.querySelector('select').value; // KENBE JE A
  const newLine = line.cloneNode(true);
  newLine.querySelector('select').value = type;
  newLine.querySelectorAll('input').forEach(i=>i.value='');
  // CHIF SÈLMAN
  newLine.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^0-9]/g,'')});
  });
  document.getElementById('container').appendChild(newLine);
}
function valider(){
  const lines = document.querySelectorAll('.line');
  const valides = [];
  lines.forEach(l=>{
    const boul = l.querySelector('.boul')?.value || l.querySelectorAll('input')[0].value;
    const miz = l.querySelector('.miz')?.value || l.querySelectorAll('input')[1].value;
    if(boul.trim()!=="" && miz.trim()!==""){valides.push({boul,miz});}
  });
  if(valides.length==0){alert("Antre boul svp");return;}
  alert(valides.length+" fich valide - Pa gen pwoblèm vid ankò!");
}
// CHIF SÈLMAN pou premye liy
document.querySelectorAll('input').forEach(inp=>{
  inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^0-9]/g,'')});
});
</script>
</body>
</html>
