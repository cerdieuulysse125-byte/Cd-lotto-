<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C&D VENDEUR V94</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box} body{font-family:Arial;margin:0;background:#fff}
.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:bold}
.tabs{display:flex;background:#000}.tabs button{flex:1;padding:12px;background:#000;color:#FFD700;border:none;font-weight:bold}.tabs button.active{background:#FFD700;color:#000}
.card{padding:10px;max-width:480px;margin:0 auto}
input,select{padding:12px;border:2px solid #000;border-radius:8px;width:100%;font-size:18px}
.line{display:grid;grid-template-columns:85px 1fr 80px;gap:6px;margin:6px 0}
.tiraj{padding:9px 14px;margin:4px;border:2px solid #000;border-radius:25px;font-weight:bold;cursor:pointer;display:inline-block}
.tiraj.active{background:#000;color:#FFD700}
.tiraj.ferme{background:#ccc;color:#666;border-color:#999;pointer-events:none;opacity:0.4}
.tiraj.ferme::after{content:" FÈMEN";font-size:10px;color:red}
.btn{padding:14px;width:100%;border:none;border-radius:10px;font-weight:bold;margin:6px 0}
.bK{background:#000;color:#FFD700}
.ticket{border:2px dashed #000;padding:15px;text-align:center;font-size:19px;line-height:1.5;max-width:360px;margin:auto}
@media print{body *{visibility:hidden} #printArea,#printArea *{visibility:visible} #printArea{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div class="h">C&D VÉRITÉ LOTTO</div>
<div id="login" class="card" style="text-align:center;padding-top:40px">
<h2>Connexion Vendeur</h2>
<input id="uName" value="Tamouche"><input id="uPass" type="password" value="1234">
<button class="btn bK" onclick="login()">Antre</button><p id="msg" style="color:red"></p>
</div>
<div id="app" style="display:none">
<div class="tabs"><button class="active" onclick="tab('vendre',this)">Vendre</button><button onclick="tab('fiches',this)">Mes Fiches</button><button onclick="tab('rapport',this)">Rapport</button></div>
<div id="vendre" class="card">
<div style="text-align:center;font-weight:bold">TIRAJ MULTIP - Chwazi</div>
<div id="tirajBox" style="text-align:center;padding:8px"></div>
<div style="display:flex;background:#000;color:#FFD700;padding:8px;font-weight:bold;border-radius:6px"><div style="width:85px">JEUX</div><div style="flex:1">BOUL</div><div style="width:80px">MIZ</div></div>
<div id="lines"></div>
<div style="background:#000;color:#fff;padding:10px;border-radius:10px;text-align:center;margin-top:8px">Total <span id="tot">0$</span> × <span id="nb">1</span> <h2 style="color:#FFD700;margin:4px">A PEYE <span id="paye">0$</span></h2></div>
<button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button>
<div id="printArea" style="display:none"></div>
</div>
<div id="fiches" class="card" style="display:none"><h3>Mes Fiches</h3><div id="listF"></div></div>
<div id="rapport" class="card" style="display:none"><h3>Rapport</h3>Du <input id="du" type="date"> Au <input id="au" type="date"><select id="fT"><option value="tous">Tous</option><option>GA midi</option><option>GA soir</option><option>FL midi</option><option>FL soir</option><option>NY midi</option><option>NY soir</option></select><button class="btn bK" onclick="genRap()">Générer</button><div id="rap"></div><button class="btn bK" onclick="window.print()">Imprimer</button></div>
</div>
<script>
const firebaseConfig={databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com"}; firebase.initializeApp(firebaseConfig); const db=firebase.database();
let curV='', selT=[], lineId=0, cfg={}, fichesLocal=JSON.parse(localStorage.getItem('fiches')||'[]');

function login(){
 const n=uName.value.trim(), p=uPass.value.trim();
 if(!n) return;
 db.ref('vendors/'+n).once('value',s=>{
   if(!s.exists()){ db.ref('vendors/'+n).set({name:n,pass:p,status:'OUVE'}).then(()=>enter(n)); }
   else{ const v=s.val(); if(v.pass&&v.pass!==p){msg.innerText='Modpas pa bon, se: '+v.pass; return;} if(v.status==='FERME'){msg.innerText='OU FERMEN'; return;} enter(n); }
 },e=>{ // si Firebase bloke, antre kanmenm
   enter(n);
 });
}
function enter(n){curV=n; login.style.display='none'; app.style.display='block'; loadConfig(); addLine(true);}

function loadConfig(){
 db.ref('config').on('value',snap=>{ cfg=snap.val()||{}; renderTiraj(); });
}
function isFerme(heureStr){
 if(!heureStr) return false; const now=new Date(); const [h,m]=heureStr.split(':').map(Number); const f=new Date(); f.setHours(h,m,0,0); return now>=f;
}
function renderTiraj(){
 const box=document.getElementById('tirajBox'); box.innerHTML='';
 const map={'GA midi':'gaMidi','GA soir':'gaSoir','FL midi':'flMidi','FL soir':'flSoir','NY midi':'nyMidi','NY soir':'nySoir'};
 const heures=cfg.heures||{};
 ['GA midi','GA soir','FL midi','FL soir','NY midi','NY soir'].forEach(t=>{
   const key=map[t]; const h=heures[key]||''; const ferme=isFerme(h);
   const cls=ferme?'tiraj ferme':'tiraj';
   box.innerHTML+=`<span class="${cls}" data-t="${t}" onclick="toggleT(this,'${t}')">${t}${ferme?'':' <small>'+h+'</small>'}</span>`;
 });
}
function toggleT(el,t){ if(el.classList.contains('ferme')) return; el.classList.toggle('active'); if(selT.includes(t)) selT=selT.filter(x=>x!==t); else selT.push(t); document.getElementById('nb').innerText=selT.length||1; updateTot(); }

function tab(id,btn){ document.getElementById('vendre').style.display=id==='vendre'?'block':'none'; document.getElementById('fiches').style.display=id==='fiches'?'block':'none'; document.getElementById('rapport').style.display=id==='rapport'?'block':'none'; document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); if(id==='fiches') loadF(); }

function addLine(first=false){
 lineId++; const div=document.createElement('div'); div.className='line';
 div.innerHTML=`<select id="j${lineId}"><option>Borlette</option><option>Mariage</option><option>Loto3</option></select>
 <input id="b${lineId}" inputmode="numeric" pattern="[0-9]*" placeholder="Boul" onkeydown="handleKey(event,${lineId},'b')">
 <input id="m${lineId}" inputmode="numeric" pattern="[0-9]*" placeholder="Miz" onkeydown="handleKey(event,${lineId},'m')" oninput="updateTot()">`;
 document.getElementById('lines').appendChild(div);
 if(!first) document.getElementById('b'+lineId).focus();
}
function handleKey(e,id,type){
 if(e.key==='ArrowDown' || e.key==='Enter'){
   e.preventDefault();
   if(type==='b'){ document.getElementById('m'+id).focus(); }
   else { // soti nan Miz -> nouvo liy
     addLine();
   }
 }
}
function updateTot(){
 let t=0; for(let i=1;i<=lineId;i++){ const m=document.getElementById('m'+i); if(m) t+=parseInt(m.value)||0; }
 document.getElementById('tot').innerText=t+'$'; document.getElementById('paye').innerText=(t*(selT.length||1))+'$';
}
function vann(){
 if(selT.length===0) return alert('Chwazi tiraj ki OUVE'); if(lineId===0) return;
 let corps=''; let has=false; for(let i=1;i<=lineId;i++){ const b=document.getElementById('b'+i), m=document.getElementById('m'+i), j=document.getElementById('j'+i); if(b&&b.value&&m&&m.value){ corps+=`${j.value} ${b.value} - ${m.value}$<br>`; has=true; } }
 if(!has) return alert('Mete boul');
 const id=Date.now(); const now=new Date();
 const ticket=`<div class="ticket"><b>C&D VÉRITÉ LOTTO</b><br>Date: ${now.toLocaleDateString()} ${now.toLocaleTimeString()}<br>Tirage: ${selT.join(', ')}<br>ID: ${id}<br>Vandè: ${curV}<br>........................................<br>${corps}........................................<br>Total × Tiraj<br>${document.getElementById('tot').innerText} × ${selT.length} = <b>${document.getElementById('paye').innerText}</b><br><br>Mèsi pou konfyans ou fè n'</div>`;
 document.getElementById('printArea').innerHTML=ticket; document.getElementById('printArea').style.display='block';
 const f={id,vendor:curV,tiraj:selT.join(','),total:parseInt(document.getElementById('tot').innerText),nb:selT.length,ticket,date:now.toISOString(),time:Date.now()};
 fichesLocal.push(f); localStorage.setItem('fiches',JSON.stringify(fichesLocal));
 try{ db.ref('fiches/'+id).set({id,vendor:curV,tiraj:selT.join(','),total:f.total,nbTiraj:selT.length,date:Date.now(),html:ticket}); }catch(e){}
 window.print(); document.getElementById('lines').innerHTML=''; lineId=0; addLine(true); updateTot();
}
function loadF(){ const c=document.getElementById('listF'); c.innerHTML=''; fichesLocal.filter(f=>f.vendor===curV).reverse().forEach(f=>{ c.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #ccc"><span>${new Date(f.time).toLocaleString()}<br>${f.tiraj} - ${f.total*f.nb}$</span><button class="btn bK" style="width:auto;padding:6px" onclick="reprint(${f.id})">Kopye</button></div>`; }); }
function reprint(id){ const f=fichesLocal.find(x=>x.id===id); if(f){ document.getElementById('printArea').innerHTML=f.ticket; document.getElementById('printArea').style.display='block'; window.print(); } }
function genRap(){ let v=0; fichesLocal.filter(f=>f.vendor===curV).forEach(f=>v+=f.total*f.nb); document.getElementById('rap').innerHTML=`<div style="text-align:center;font-weight:bold;font-size:20px">Vente ${v}$<br>Commission ${Math.round(v*0.15)}$<br>Balance Net ${Math.round(v*0.85)}$</div>`; }
</script>
</body>
</html>
