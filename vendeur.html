<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D V6.14 RAPÒ VENDEUR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Arial;min-height:100vh}
#login{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center}
.loginBox{background:#fff;border:3px solid #000;padding:18px;width:92%;max-width:350px;text-align:center;border-radius:14px}
.loginBox input{width:100%;padding:10px;margin:5px 0;border:2px solid #000;font-weight:900;text-align:center;border-radius:20px}
.loginBox button{width:100%;padding:11px;background:#FFD700;color:#000;font-weight:900;border:2px solid #000;border-radius:20px}
.h{background:#FFD700;color:#000;text-align:center;padding:8px;font-weight:900;border-bottom:3px solid #000;font-size:11px}
.g{background:#000;color:#FFD700;text-align:center;padding:5px;font-weight:900;font-size:10px}
.tabs{display:flex;background:#fff;border-bottom:2px solid #000;position:sticky;top:0;z-index:99}.tab{flex:1;padding:10px 1px;text-align:center;font-size:9px;font-weight:900;border:1px solid #000;background:#fff}.tab.active{background:#FFD700}
.page{display:none;padding:6px;background:#fff;min-height:80vh}.page.active{display:block}
.tirages{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}.tirages div{background:#fff;border:2px solid #00A000;padding:10px 1px;text-align:center;font-weight:900;border-radius:12px;font-size:10px;position:relative}.tirages div.on{background:#FFD700;border-color:#000}.tirages div.on::after{content:"✓";position:absolute;top:0;right:3px;color:#F00}
.tirages div.off{background:#F00;color:#fff;pointer-events:none}
.row{display:flex;gap:4px;margin:5px 0;align-items:center}.row select{flex:.8;height:34px;border:2px solid #000;font-weight:900;border-radius:12px;font-size:11px}
.row input.boul{flex:.55;max-width:100px;height:34px;border:2px solid #000;font-weight:900;text-align:center;border-radius:12px}
.row input.miz{flex:.3;max-width:65px;height:34px;border:2px solid #000;font-weight:900;text-align:center;background:#FFD700;border-radius:12px}
.btnX{width:28px;height:34px;background:#fff;color:#F00;border:2px solid #F00;font-weight:900;border-radius:12px}.btnF{width:28px;height:34px;background:#000;color:#FFD700;border:2px solid #000;font-weight:900;border-radius:12px}
.total{background:#fff;border:2px solid #000;padding:6px;text-align:center;font-weight:900;margin:6px 0;border-radius:12px;font-size:12px}
.btnV{background:#000;color:#FFD700;padding:10px;text-align:center;font-weight:900;border:2px solid #000;margin:6px 0;border-radius:20px;font-size:12px}
.fich{background:#f9f9f9;border:1px solid #000;padding:6px;margin:4px 0;font-size:9px;border-radius:10px}
.kaz{border:2px solid #000;border-radius:14px;padding:8px;margin:8px 0;background:#fff}
.kaz select,.kaz input{width:100%;padding:8px;border:2px solid #000;border-radius:20px;font-weight:900;text-align:center;font-size:12px;background:#fff}
.ligneRap{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #000;font-weight:900;font-size:13px}.ligneRap.b{background:#FFD700}.ligneRap.g{background:#000;color:#FFD700}.ligneRap.gr{background:#00A000;color:#fff}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head><body>
<div id="login"><div class="loginBox"><div style="background:#FFD700;padding:6px;font-weight:900;border-radius:10px">C&D V6.14 VENDEUR</div><input id="nomV" placeholder="Non vandè" value=""><input id="passV" type="password" placeholder="Modpas" onkeydown="if(event.key==='Enter')checkPass()" value=""><button onclick="checkPass()">🔓 OUVRI</button><div id="passErr" style="color:red;font-weight:900;margin-top:6px"></div></div></div>
<div class="h" id="hTitle">C&D V6.14 VENDEUR</div><div class="g" id="gDate"></div>
<div class="tabs"><div class="tab active" onclick="op(1)">1.VANT</div><div class="tab" onclick="op(2)">2.KOPYE</div><div class="tab" onclick="op(3)">3.FICH</div><div class="tab active" onclick="op(4)">4.RAPÒ</div></div>
<div id="p1" class="page active"><div class="tirages" id="tirages"></div><div class="total" id="lineInfo">Chwazi tiraj</div><div id="rows"></div><div class="total" id="tot">Total $0</div><div class="btnV" onclick="valide()">💾 VALIDE</div></div>
<div id="p2" class="page"><div id="copyBox"></div><div class="btnV" onclick="kopyeLast()">📋 KOPYE DÈNYE</div></div>
<div id="p3" class="page"><input type="date" id="dateFich" style="width:100%;padding:6px;border:2px solid #000;border-radius:12px"><div id="fichBox"></div></div>
<div id="p4" class="page active"><div style="border:3px solid #000;border-radius:14px;padding:8px">
<div style="background:#000;color:#FFD700;padding:8px;font-weight:900;text-align:center;border-radius:10px" id="titRap">RAPPORT VENDEUR</div>

<div class="kaz"><div style="font-size:10px;font-weight:900;text-align:center">Du... Au...</div><div style="display:flex;gap:4px;margin-top:4px"><input type="date" id="dateDebut" style="flex:1;padding:6px;border:2px solid #000;border-radius:12px;font-size:11px"><input type="date" id="dateAu" style="flex:1;padding:6px;border:2px solid #000;border-radius:12px;font-size:11px"></div></div>

<div class="kaz"><div style="font-size:10px;font-weight:900;text-align:center">Tirage (..., tous)</div><select id="selTirajRap" onchange="calcRap()" style="background:#FFD700"><option value="tous">TOUS TIRAGES</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select></div>

<div class="kaz" id="resRap" style="background:#f9f9f9">
<div class="ligneRap"><span>Vente</span><b id="vVente">$0</b></div>
<div class="ligneRap b"><span>Commission (10%)</span><b id="vCom">$0</b></div>
<div class="ligneRap gr"><span>A payer (Gain kliyan)</span><b id="vApayer">$0</b></div>
<div class="ligneRap g"><span>Balance net (Rete pou bòs)</span><b id="vBalance">$0</b></div>
</div>

<div class="btnV" style="background:#FFD700;color:#000" onclick="calcRap()">📊 KALKILE</div>
<div class="btnV" style="background:#000;color:#fff" onclick="imprimerVendeur()">🖨️ IMPRIMER RAPÒ</div>
<div id="detTir" style="font-size:10px;margin-top:6px"></div>
<div id="detGain" style="font-size:9px;margin-top:6px"></div>
</div></div>
<script>
const firebaseConfig = {apiKey: "AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain: "cd-lotto.firebaseapp.com",databaseURL: "https://cd-lotto-default-rtdb.firebaseio.com",projectId: "cd-lotto",storageBucket: "cd-lotto.firebasestorage.app",messagingSenderId: "671091732195",appId: "1:671091732195:web:51bcfe8df83bc58fc75fd6",measurementId: "G-TWK9N38BS0"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let HEURES={GA_MIDI:"12:15",FL_MIDI:"13:15",NY_MIDI:"14:15",GA_SOIR:"18:15",FL_SOIR:"21:15",NY_SOIR:"22:15"};
let PRIX={B1:50,B2:20,B3:10,MARYAJ:1000,L3:500,L4:5000,L5:25000},RESULTATS=[],vendeurNom="",vendeurPass="",vendeurCom=10,lastJeux='BOLET',tirajSel=new Set(),fiches=JSON.parse(localStorage.getItem('cdV5')||'[]');
function haitiISO(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Port-au-Prince'});}function haitiFR(){return new Date().toLocaleDateString('fr-HT',{timeZone:'America/Port-au-Prince',day:'2-digit',month:'2-digit',year:'numeric'});}function haitiHeure(){return new Date().toLocaleTimeString('fr-HT',{timeZone:'America/Port-au-Prince',hour:'2-digit',minute:'2-digit',hour12:true});}
function haitiNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Port-au-Prince'}));}
async function checkPass(){const n=document.getElementById('nomV').value.trim(),p=document.getElementById('passV').value.trim();if(!n||!p){document.getElementById('passErr').innerText="⛔ VID";return;}document.getElementById('passErr').innerText="⏳...";try{const s=await db.collection('vendeurs').where('code','==',p).get();if(s.empty){document.getElementById('passErr').innerText="⛔ Modpas";return;}const vd=s.docs[0].data();if(vd.ouvert===false){document.getElementById('passErr').innerText="⛔ FÈMEN";return;}if(vd.nom.toLowerCase()!==n.toLowerCase()){document.getElementById('passErr').innerText=`⛔ Non: ${vd.nom}`;return;}vendeurNom=vd.nom;vendeurPass=vd.code;vendeurCom=vd.com||10;document.getElementById('login').style.display='none';init();}catch(e){document.getElementById('passErr').innerText="❌ Erè";}}
function op(n){document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i+1==n));document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i+1==n));}
async function loadConfig(){try{const d=await db.collection('config').doc('main').get();if(d.exists){const c=d.data();if(c.HEURES)HEURES=c.HEURES;if(c.PRIX){PRIX.B1=parseInt(c.PRIX.B1)||50;PRIX.B2=parseInt(c.PRIX.B2)||20;PRIX.B3=parseInt(c.PRIX.B3)||10;PRIX.MARYAJ=parseInt(c.PRIX.MARYAJ)||1000;PRIX.L3=parseInt(c.PRIX.L3)||500;PRIX.L4=parseInt(c.PRIX.L4)||5000;PRIX.L5=parseInt(c.PRIX.L5)||25000;}}}catch(e){}}
async function loadResultats(){try{const snap=await db.collection('resultats').get();RESULTATS=[];snap.forEach(d=>RESULTATS.push(d.data()));}catch(e){}}
function initTirage(){document.getElementById('tirages').innerHTML=['GA MIDI','FL MIDI','NY MIDI','GA SOIR','FL SOIR','NY SOIR'].map(t=>`<div data-t="${t}">${t}</div>`).join('');document.querySelectorAll('#tirages div').forEach(el=>el.onclick=()=>{if(tirajSel.has(el.dataset.t)){tirajSel.delete(el.dataset.t);el.classList.remove('on');}else{tirajSel.add(el.dataset.t);el.classList.add('on');}calc();});}
function addLigne(jeu=lastJeux,b='',m=''){lastJeux=jeu;const id=Date.now()+Math.random().toString(36).substr(2,4);const d=document.createElement('div');d.className='row';d.id='l_'+id;d.innerHTML=`<select id="s_${id}"><option ${jeu=='BOLET'?'selected':''}>BOLET</option><option ${jeu=='MARYAJ'?'selected':''}>MARYAJ</option><option ${jeu=='LOTO3'?'selected':''}>LOTO3</option><option ${jeu=='LOTO4'?'selected':''}>LOTO4</option><option ${jeu=='LOTO5'?'selected':''}>LOTO5</option></select><input class="boul" id="b_${id}" value="${b}" placeholder="Boul" oninput="this.value=this.value.replace(/[^0-9]/g,'');calc()"><input class="miz" id="m_${id}" value="${m}" placeholder="$" oninput="this.value=this.value.replace(/[^0-9]/g,'');calc()"><button class="btnX" onclick="document.getElementById('l_${id}').remove();calc()">X</button><button class="btnF" onclick="addLigne(document.getElementById('s_${id}').value)">↓</button>`;document.getElementById('rows').appendChild(d);calc();}
function calc(){let base=0;document.querySelectorAll('.row').forEach(r=>{base+=parseInt(r.querySelector('.miz')?.value)||0;});const nb=tirajSel.size||1;const tot=base*nb;document.getElementById('lineInfo').innerText=tirajSel.size?Array.from(tirajSel).join('+'):`Chwazi tiraj`;document.getElementById('tot').innerText=`Total Fich $${tot} | Chak $${base}`;document.getElementById('tot').dataset.base=base;document.getElementById('tot').dataset.total=tot;}
async function valide(){if(!tirajSel.size)return alert('Tiraj');const base=parseInt(document.getElementById('tot').dataset.base||0);const total=parseInt(document.getElementById('tot').dataset.total||0);if(!base)return alert('Boul');let list=[];document.querySelectorAll('.row').forEach(r=>{const j=r.querySelector('select').value,b=r.querySelector('.boul').value.trim(),m=parseInt(r.querySelector('.miz').value)||0;if(b&&m)list.push({jeux:j,boul:b,miz:m});});const id=Math.floor(100000+Math.random()*900000);const fich={id,ticketId:id,date:haitiFR(),dateISO:haitiISO(),heure:haitiHeure(),tirages:Array.from(tirajSel),nbTiraj:tirajSel.size,list,base,parTiraj:base,total,vendeur:vendeurNom,code:vendeurPass,com:vendeurCom};fiches.unshift(fich);localStorage.setItem('cdV5',JSON.stringify(fiches));try{await db.collection('ventes').add(fich);}catch(e){}let w=window.open('','','width=400,height=700');w.document.write(`<html><body style="width:76mm;margin:0 auto;text-align:center;font-family:Arial Black"><div style="font-size:28px">C&D LOTTO</div><div>Dat:${fich.date} ${fich.heure}<br>Tiraj:${fich.tirages.join('+')}<br>ID:${fich.ticketId}<br>Vandè:${fich.vendeur}</div><hr>${fich.list.map(l=>`<div style="font-size:22px">${l.jeux} ${l.boul} $${l.miz}</div>`).join('')}<hr><div style="border:3px solid #000;padding:8px"><div>CHAK $${fich.parTiraj}</div><div style="font-size:28px">TOTAL $${fich.total}</div></div><script>setTimeout(()=>{print();close()},400)<\/script></body></html>`);document.getElementById('rows').innerHTML='';addLigne();refreshF();calc();}
function refreshF(){const iso=document.getElementById('dateFich').value;let h='';fiches.filter(f=>!iso||f.dateISO==iso).filter(f=>f.vendeur===vendeurNom).forEach(f=>{h+=`<div class="fich"><b>${f.date} ${f.heure} ${f.tirages.join('+')} x${f.nbTiraj} ID:${f.ticketId}</b><br>${f.list.map(l=>l.jeux+' '+l.boul+'($'+l.miz+')').join(' - ')}<br>Chak $${f.parTiraj} Total $${f.total}</div>`;});document.getElementById('fichBox').innerHTML=h||'Pa gen';document.getElementById('copyBox').innerHTML=h;}
function kopyeLast(){if(!fiches[0])return;document.getElementById('rows').innerHTML='';fiches[0].list.forEach(l=>addLigne(l.jeux,l.boul,l.miz));tirajSel=new Set(fiches[0].tirages);document.querySelectorAll('#tirages div').forEach(el=>{if(tirajSel.has(el.dataset.t))el.classList.add('on');});addLigne();calc();}
function getGain(jeux,boul,miz,res){if(!res)return 0;boul=boul.trim();const r1=(res.r1||'').trim(),r2=(res.r2||'').trim(),r3=(res.r3||'').trim(),m1=(res.m1||'').trim(),m2=(res.m2||'').trim(),m3=(res.m3||'').trim(),l3=(res.l3||'').trim(),l4=(res.l4||'').trim(),l5=(res.l5||'').trim();if(jeux==='BOLET'){if(boul===r1)return miz*PRIX.B1;if(boul===r2)return miz*PRIX.B2;if(boul===r3)return miz*PRIX.B3;}if(jeux==='MARYAJ'){if(boul===m1||boul===m2||boul===m3)return miz*PRIX.MARYAJ;}if(jeux==='LOTO3'&&l3&&boul===l3)return miz*PRIX.L3;if(jeux==='LOTO4'&&l4&&boul===l4)return miz*PRIX.L4;if(jeux==='LOTO5'&&l5&&boul===l5)return miz*PRIX.L5;return 0;}
let lastCalc={vente:0,com:0,apayer:0,balance:0,tirage:'',du:'',au:'',details:''};
async function calcRap(){await loadResultats();const d1=document.getElementById('dateDebut').value,d2=document.getElementById('dateAu').value,selT=document.getElementById('selTirajRap').value;let parT={},tot=0,gainTot=0,gagnants=[];fiches.filter(f=>f.vendeur===vendeurNom).forEach(f=>{if(f.dateISO>=d1&&f.dateISO<=d2){const filt=selT==='tous'?f.tirages:f.tirages.filter(t=>t===selT);if(!filt.length)return;const nb=selT==='tous'?f.nbTiraj:filt.length;const calc= (f.parTiraj||f.base)*nb;filt.forEach(t=>{if(!parT[t])parT[t]={v:0,g:0};parT[t].v+=f.parTiraj||f.base;const res=RESULTATS.find(r=>r.date===f.dateISO&&r.tiraj===t);if(res){f.list.forEach(l=>{const g=getGain(l.jeux,l.boul,l.miz,res);if(g>0){parT[t].g+=g;gainTot+=g;gagnants.push(`${f.date} ${t} ${l.jeux} ${l.boul} $${l.miz} → $${g} (ID ${f.ticketId})`);}});}});tot+=calc;}});const com=Math.round(tot*vendeurCom/100);const bal=tot-com-gainTot;document.getElementById('vVente').innerText='$'+tot;document.getElementById('vCom').innerText='$'+com;document.getElementById('vApayer').innerText='$'+gainTot;document.getElementById('vBalance').innerText='$'+bal;let det='';Object.keys(parT).forEach(t=>{det+=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #000;padding:4px;font-size:11px"><span>${t}</span><span>V:$${parT[t].v} G:$${parT[t].g}</span></div>`;});document.getElementById('detTir').innerHTML=det;document.getElementById('detGain').innerHTML=gagnants.length?`<div style="border:2px solid #00A000;border-radius:10px;padding:6px;background:#f0fff0"><b>Ganyan:</b><br>${gagnants.join('<br>')}</div>`:`<div style="text-align:center;font-size:9px">Pa gen ganyan - ap korije aprè rezilta</div>`;lastCalc={vente:tot,com,apayer:gainTot,balance:bal,tirage:selT,du:d1,au:d2,details:det};}
function imprimerVendeur(){const w=window.open('','','width=400,height=800');w.document.write(`<html><head><title>Rapport Vendeur ${vendeurNom}</title><style>body{width:76mm;margin:0 auto;font-family:Arial;font-weight:900;text-align:center}.ligne{display:flex;justify-content:space-between;border-bottom:1px solid #000;padding:6px;font-size:12px}.titre{font-size:18px;background:#FFD700;padding:8px;border:2px solid #000}</style></head><body><div class="titre">RAPPORT VENDEUR<br>${vendeurNom.toUpperCase()}</div><div style="font-size:11px;margin:6px 0">Du ${lastCalc.du} Au ${lastCalc.au}<br>Tirage: ${lastCalc.tirage.toUpperCase()}</div><hr><div class="ligne"><span>Vente</span><b>$${lastCalc.vente}</b></div><div class="ligne" style="background:#FFD700"><span>Commission ${vendeurCom}%</span><b>$${lastCalc.com}</b></div><div class="ligne" style="background:#00A000;color:#fff"><span>A payer (Gain kliyan)</span><b>$${lastCalc.apayer}</b></div><div class="ligne" style="background:#000;color:#FFD700;font-size:14px"><span>Balance net</span><b>$${lastCalc.balance}</b></div><hr><div style="font-size:9px;text-align:left">${lastCalc.details}</div><hr><div style="font-size:8px">Imprime ${haitiFR()} ${haitiHeure()} | ${vendeurNom}</div><script>setTimeout(()=>{print();},300)<\/script></body></html>`);}
async function init(){await loadConfig();await loadResultats();const iso=haitiISO();document.getElementById('dateDebut').value=iso;document.getElementById('dateAu').value=iso;document.getElementById('dateFich').value=iso;document.getElementById('gDate').innerText=`${haitiFR()} ${haitiHeure()} | ${vendeurNom} | ${vendeurCom}%`;document.getElementById('hTitle').innerText=`C&D VENDEUR - ${vendeurNom.toUpperCase()} - PRIVE`;document.getElementById('titRap').innerText=`🔒 RAPPORT VENDEUR - ${vendeurNom.toUpperCase()} - ${vendeurCom}%`;initTirage();addLigne();refreshF();calc();calcRap();}
init();
</script></body></html>
