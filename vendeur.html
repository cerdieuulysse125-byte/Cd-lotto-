<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VENDEUR V114 FLECH</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f2f2f2}.h{background:#000;color:#FFD700;padding:10px;text-align:center;font-weight:bold}.card{background:#fff;padding:12px;margin:8px;border-radius:12px}.tirajBtn{padding:10px 14px;border:2px solid #000;border-radius:20px;font-weight:bold;margin:4px;background:#fff}.tirajBtn.active{background:#000;color:#FFD700}.tirajBtn.ferme{background:#ddd;color:#999;text-decoration:line-through}.line{display:flex;gap:6px;margin:6px 0}.line input,.line select{flex:1;padding:14px;border:2px solid #000;border-radius:12px;font-size:18px;font-weight:bold;text-align:center}input[type=tel]{font-size:20px} .totalBox{background:#000;color:#fff;padding:12px;border-radius:12px;text-align:center;margin:8px 0}.btnVendre{background:#000;color:#FFD700;font-weight:bold;padding:16px;width:100%;border:none;border-radius:12px;font-size:18px;margin-top:8px}.ticket{background:#fff;border:1px dashed #000;padding:8px;font-size:13px;white-space:pre-wrap}</style>
</head><body>
<div class="h">C&D LOTTO VENDEUR V114 - FLECH</div>
<div id="loginDiv" class="card"><h3>Konekte</h3><input id="vName" placeholder="Non vandè"><input id="vPass" type="password" placeholder="Kòd"><button class="btnVendre" onclick="login()">KONEKTE</button></div>

<div id="mainDiv" style="display:none">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b>TIRAJ - <span id="dateAff"></span></b><span id="statusOuve" style="background:#0a0;color:#fff;padding:4px 8px;border-radius:8px;font-size:12px">OUVE</span></div>
<div id="tirajList" style="margin-top:8px"></div>
</div>

<div class="card">
<div style="display:flex;background:#000;color:#FFD700;padding:8px;border-radius:8px;font-weight:bold"><div style="flex:1">JEUX</div><div style="flex:1">BOUL</div><div style="flex:1">MIZ</div></div>
<div class="line">
<select id="jeux" style="flex:1"><option>Borlette</option><option>Mariage</option><option>Loto3</option><option>Loto4</option><option>Loto5</option></select>
<input id="boul" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="55" autocomplete="off">
<input id="miz" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="25" autocomplete="off">
</div>
<div style="font-size:11px;color:#555;text-align:center">💡 Tape boul → klike flèch ble → tape miz → flèch ble → liy ajoute otomatik</div>
<div class="totalBox"><div>Total <span id="totalTxt">0$ x 1</span></div><div style="color:#FFD700;font-size:22px;font-weight:bold">A PEYE <span id="aPeye">0$</span></div></div>
<button class="btnVendre" onclick="vendre()">VENDRE & IMPRIMER</button>
<div id="ticketDiv" style="margin-top:10px"></div>
</div>
</div>

<script>
const firebaseConfig={databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com"}; firebase.initializeApp(firebaseConfig); const db=firebase.database();
let cfg={}, vendor='', ticket=[], selectedTiraj=[];
let prix={p1:50,p2:20,p3:10,maryaj:1000,loto3:500,loto4:5000,loto5:25000};
function getESTNow(){const now=new Date(); const estStr=now.toLocaleString('en-US',{timeZone:'America/Port-au-Prince',hour12:false}); const parts=estStr.split(', '); const tPart=parts[1]||'00:00:00'; const [h,m]=tPart.split(':').map(Number); const dateEST=now.toLocaleDateString('en-CA',{timeZone:'America/Port-au-Prince'}); return {dateStr:dateEST,hm:h*60+m};}
function isPastEST(hs){if(!hs) return false; const [hh,mm]=hs.split(':').map(Number); return getESTNow().hm >= (hh*60+(mm||0));}
function getLocalDateStr(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Port-au-Prince'});}

const boulInput=document.getElementById('boul');
const mizInput=document.getElementById('miz');

// KLAVYE CHIF SÈLMAN + FLÈCH POU AVANSE - SA OU TE MANDE A
boulInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    if(boulInput.value.trim()!=='') mizInput.focus();
  }
});
mizInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    if(mizInput.value.trim()!==''){
      addLigne();
      boulInput.focus();
    } else {
      boulInput.focus();
    }
  }
});
// Blokaj pou sèlman chif
[boulInput,mizInput].forEach(inp=>{
  inp.addEventListener('input',()=>{
    inp.value=inp.value.replace(/[^0-9]/g,'');
  });
});

db.ref('config').on('value',s=>{
  cfg=s.val()||{};
  prix=cfg.prix||prix;
  renderTirages();
});

function login(){
  const n=vName.value.trim(); const p=vPass.value.trim();
  if(!n) return alert('Mete non');
  db.ref('vendors/'+n).once('value',snap=>{
    const v=snap.val();
    if(!v) return alert('Vandè pa egziste');
    if(v.pass!==p) return alert('Kòd pa bon');
    if((v.status||'OUVE').toUpperCase()!=='OUVE') return alert('Vandè FERMÉ pa proprio');
    vendor=n;
    loginDiv.style.display='none';
    mainDiv.style.display='block';
    dateAff.innerText=getLocalDateStr();
    renderTirages();
  });
}

function renderTirages(){
  const he=cfg.heures||{gaMidi:'12:30',flMidi:'13:30',nyMidi:'14:30',gaSoir:'18:30',flSoir:'21:00',nySoir:'21:30'};
  const et=cfg.tirages||{};
  const list=[{id:'gaMidi',l:'GA midi'},{id:'gaSoir',l:'GA soir'},{id:'flMidi',l:'FL midi'},{id:'flSoir',l:'FL soir'},{id:'nyMidi',l:'NY midi'},{id:'nySoir',l:'NY soir'}];
  let html='';
  list.forEach(o=>{
    const h=he[o.id]||'';
    const ferme = (cfg.autoClose!==false && isPastEST(h)) || et[o.id]==='FERME';
    const cls = ferme ? 'tirajBtn ferme' : (selectedTiraj.includes(o.l)?'tirajBtn active':'tirajBtn');
    html+='<button class="'+cls+'" '+(ferme?'disabled':'onclick="toggleTiraj(\''+o.l+'\')"')+'>'+o.l+(ferme?' FÈMÈN':'')+'</button>';
  });
  document.getElementById('tirajList').innerHTML=html;
  updateTotal();
}
setInterval(renderTirages,15000);

function toggleTiraj(t){
  if(selectedTiraj.includes(t)) selectedTiraj=selectedTiraj.filter(x=>x!==t);
  else selectedTiraj.push(t);
  renderTirages();
}

function addLigne(){
  const j=jeux.value;
  const b=boul.value.trim().replace(/[^0-9]/g,'');
  const m=parseInt(miz.value)||0;
  if(!b || !m) return;
  // Verifikasyon limit
  const lim=cfg.limites||{};
  if(j==='Borlette' && m> (lim.bolet||1000)) return alert('Limit Borlette '+(lim.bolet||1000));
  if(j==='Mariage' && m> (lim.maryaj||50)) return alert('Limit Mariage '+(lim.maryaj||50));
  ticket.push({jeu:j,boul:b,mise:m});
  boul.value=''; miz.value='';
  renderTicket();
  boulInput.focus();
}

function renderTicket(){
  let html='', total=0;
  ticket.forEach((t,i)=>{
    total+=t.mise;
    html+= t.jeu+' '+t.boul+' - '+t.mise+'$ <button onclick="ticket.splice('+i+',1);renderTicket()" style="color:red">x</button><br>';
  });
  ticketDiv.innerHTML='<div class="ticket">'+(html||'Vide')+'</div>';
  totalTxt.innerText=total+'$ x '+selectedTiraj.length;
  aPeye.innerText=(total*selectedTiraj.length)+'$';
}

function updateTotal(){
  const total=ticket.reduce((s,t)=>s+t.mise,0);
  totalTxt.innerText=total+'$ x '+selectedTiraj.length;
  aPeye.innerText=(total*selectedTiraj.length)+'$';
}

function vendre(){
  if(selectedTiraj.length===0) return alert('Chwazi tiraj');
  if(ticket.length===0) return alert('Ajoute boul');
  const total=ticket.reduce((s,t)=>s+t.mise,0);
  const fichId=Date.now()+'_'+vendor;
  const data={
    id:fichId,
    vendor:vendor,
    tiraj:selectedTiraj.join(','),
    total:total,
    nbTiraj:selectedTiraj.length,
    details:ticket,
    ticketHtml:ticket.map(t=>t.jeu+' '+t.boul+' - '+t.mise+'$').join('<br>'),
    date:Date.now(),
    dateStr:getLocalDateStr(),
    gain:0
  };
  db.ref('fiches/'+fichId).set(data).then(()=>{
    alert('Vann! '+aPeye.innerText);
    ticket=[]; renderTicket();
    // pa efase tiraj yo pou vann vit
    boulInput.focus();
  });
}
</script></body></html>
