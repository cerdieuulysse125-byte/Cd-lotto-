<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push, get, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
function getDatePAP(){return new Intl.DateTimeFormat('en-CA',{timeZone:"America/Port-au-Prince",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}
function normM(b){if(!b) return ""; b=b.toString().trim().toLowerCase().replace(/[^0-9x]/g,''); if(!b.includes('x')&&b.length==4) b=b.slice(0,2)+'x'+b.slice(2); const p=b.split('x').filter(x=>x!=""); if(p.length!=2) return b; return [p[0].padStart(2,'0'),p[1].padStart(2,'0')].sort().join('x');}
function getHeurePAP(){const d=new Date(); const s=new Intl.DateTimeFormat('en-CA',{timeZone:"America/Port-au-Prince",hour:"2-digit",minute:"2-digit",hour12:false}).format(d); const [h,m]=s.split(':').map(Number); return h*60+m;}
const dateStr=getDatePAP(); let vendeurActif=null, pourActif=10, tirajChwazi=[], lignes=[{type:"BOLET",boul:"",miz:""}];
let cacheLimGlobal={BOLET:500,MARYAJ:500,LOTO3:500,LOTO4:500,LOTO5:500};
let cacheLimVendeur={BOLET:500,MARYAJ:500,LOTO3:500,LOTO4:500,LOTO5:500};
function chifSelman(v,t){if(t=="MARYAJ") return v.replace(/[^0-9xX]/g,'').toLowerCase(); return v.replace(/[^0-9]/g,'');}
async function loadLimitesCache(){
  try{
    const snapG=await get(ref(db,`limites_global`));
    if(snapG.exists()){
      const l=snapG.val();
      cacheLimGlobal={BOLET:parseInt(l.BOLET||500),MARYAJ:parseInt(l.MARYAJ||500),LOTO3:parseInt(l.LOTO3||500),LOTO4:parseInt(l.LOTO4||500),LOTO5:parseInt(l.LOTO5||500)};
    }
    const snapV=await get(ref(db,`limites/${vendeurActif}`));
    if(snapV.exists()){
      const l=snapV.val();
      cacheLimVendeur={BOLET:parseInt(l.BOLET||500),MARYAJ:parseInt(l.MARYAJ||500),LOTO3:parseInt(l.LOTO3||500),LOTO4:parseInt(l.LOTO4||500),LOTO5:parseInt(l.LOTO5||500)};
    } else {
      cacheLimVendeur={...cacheLimGlobal};
    }
    document.getElementById('alertLim').innerHTML=`LIMIT MIZ BLOKE PA TIRAJ - GLOBAL=v1+v2 PA TIRAJ<br>Global BOLET ${cacheLimGlobal.BOLET}$ - ${vendeurActif} ${cacheLimVendeur.BOLET}$ pa tiraj - Jan 300$+Joseph 200$=500$ BLOKE - DEFAULT 500$`;
  }catch(e){
    document.getElementById('alertLim').innerHTML=`LIMIT DEFAULT 500$ PA TIRAJ - GLOBAL=v1+v2 - BLOKE`;
  }
}
async function checkLogin(){const n=document.getElementById('inpLoginNom').value.trim().toUpperCase(); let p=document.getElementById('inpLoginPass').value.trim().replace(/[^0-9]/g,''); if(!n||!p){document.getElementById('loginMsg').innerText="NON + MODPAS CHIF SÈLMAN!";return;} const snap=await get(ref(db,`vendeurs`)); let ok=false, pour=10, vrai=n; if(snap.exists()) Object.values(snap.val()).forEach(v=>{if(v.nom.toUpperCase()==n&&v.pass==p&&v.status!="FERME"){ok=true; pour=v.pour||10; vrai=v.nom;}}); if(!ok){document.getElementById('loginMsg').innerText="⛔ PA BON";return;} vendeurActif=vrai; pourActif=pour; localStorage.setItem("vendeur",vrai); localStorage.setItem("vendeurPass",p); document.getElementById('loginOverlay').style.display='none'; initApresLogin();}
function initApresLogin(){document.getElementById('nomV').innerText=vendeurActif; document.getElementById('nomTop').innerText=vendeurActif; document.getElementById('nomRap').innerText=vendeurActif; document.getElementById('dateTop').innerText=dateStr; document.getElementById('dateFich').innerText=dateStr; document.getElementById('dateDu').value=dateStr; document.getElementById('dateAu').value=dateStr; loadLimitesCache(); renderLignes(); updateTotal();}
function openOnglet(n){document.querySelectorAll('.onglet').forEach(o=>o.classList.remove('active')); document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active')); if(n==1){document.getElementById('o1').classList.add('active'); document.getElementById('b1').classList.add('active');} if(n==2){document.getElementById('o2').classList.add('active'); document.getElementById('b2').classList.add('active'); loadCopier();} if(n==3){document.getElementById('o3').classList.add('active'); document.getElementById('b3').classList.add('active'); loadFiches();} if(n==4){document.getElementById('o4').classList.add('active'); document.getElementById('b4').classList.add('active');} if(n==5){if(confirm("Dekonekte?")){localStorage.clear(); location.reload();}}}
function renderLignes(){const c=document.getElementById('lignesContainer'); c.innerHTML=""; lignes.forEach((l,i)=>{const d=document.createElement('div'); d.className="ligne"; d.innerHTML=`<select class="kaz" id="type-${i}" style="font-size:11px"><option value="BOLET" ${l.type=="BOLET"?"selected":""}>BOLET</option><option value="MARYAJ" ${l.type=="MARYAJ"?"selected":""}>MARYAJ</option><option value="LOTO3" ${l.type=="LOTO3"?"selected":""}>LOTO3</option><option value="LOTO4" ${l.type=="LOTO4"?"selected":""}>LOTO4</option><option value="LOTO5" ${l.type=="LOTO5"?"selected":""}>LOTO5</option></select><input class="kaz" id="boul-${i}" placeholder="Boul" inputmode="numeric" pattern="[0-9x]*" value="${l.boul}"><input class="kaz kazMiz" id="miz-${i}" placeholder="Miz" inputmode="numeric" pattern="[0-9]*" value="${l.miz}"><button type="button" class="btnRond btnX" id="x-${i}">X</button><button type="button" class="btnRond btnFlech" id="down-${i}">↓</button>`; c.appendChild(d);}); lignes.forEach((l,i)=>{const t=document.getElementById(`type-${i}`), b=document.getElementById(`boul-${i}`), m=document.getElementById(`miz-${i}`); t.addEventListener('change',()=>{lignes[i].type=t.value; b.focus(); updateTotal();}); b.addEventListener('input',()=>{b.value=chifSelman(b.value,lignes[i].type); lignes[i].boul=b.value; updateTotal();}); m.addEventListener('input',()=>{m.value=chifSelman(m.value,"BOLET"); lignes[i].miz=m.value; updateTotal();}); b.addEventListener('keydown',(e)=>{if(e.key=="Enter"||e.key=="ArrowRight"){e.preventDefault(); m.focus();} if(e.key=="ArrowDown"){e.preventDefault(); addNewLigne(i,true);}}); m.addEventListener('keydown',(e)=>{if(e.key=="Enter"||e.key=="ArrowDown"){e.preventDefault(); addNewLigne(i,true);}}); document.getElementById(`x-${i}`).addEventListener('click',()=>{if(lignes.length>1)lignes.splice(i,1);else lignes[i]={type:lignes[i].type,boul:"",miz:""}; renderLignes(); updateTotal();}); document.getElementById(`down-${i}`).addEventListener('click',()=>addNewLigne(i,true));});}
// LIMIT BLOKE PA TIRAJ - KORIJE - DEFAULT 500$
async function checkLimitPaTiraj(ligne, ignoreForm){
  let boul=ligne.boul; if(ligne.type=="MARYAJ") boul=normM(boul); const miz=parseInt(ligne.miz)||0; const type=ligne.type; if(tirajChwazi.length==0) return true;
  if(miz>cacheLimGlobal[type]){ alert(`⛔ MIZ TWÒ GWO - ${type} ${boul}\nMiz ou: ${miz}$ > Limit Global pa tiraj: ${cacheLimGlobal[type]}$\nYon sèl fich pa ka depase limit la\nPA KA ENPRIME`); return false; }
  try{
    const maxV=cacheLimVendeur[type]||500;
    const maxG=cacheLimGlobal[type]||500;
    const snapAll=await get(ref(db,`ventes/${dateStr}`));
    for(const tiraj of tirajChwazi){
      let dejaV=0, dejaG=0; let detail=[];
      if(snapAll.exists()){
        Object.entries(snapAll.val()).forEach(([vNom,vFiches])=>{
          Object.values(vFiches).forEach(fiche=>{
            if(!fiche.tiraj||!fiche.tiraj.includes(tiraj)) return;
            if(!fiche.fiches) return;
            fiche.fiches.forEach(f=>{
              if(!f.type) return; if(f.type!=type) return;
              let match=false; if(type=="MARYAJ") match=normM(f.boul)==normM(boul); else match=f.boul==boul;
              if(match){ if(vNom==vendeurActif) dejaV+=parseInt(f.miz)||0; dejaG+=parseInt(f.miz)||0; detail.push(`${vNom}:${f.miz}$`); }
            });
          });
        });
      }
      if(!ignoreForm){
        lignes.forEach(l=>{
          if(!l.boul||!l.miz||l==ligne) return; if(l.type!=type) return;
          let mm=false; if(type=="MARYAJ") mm=normM(l.boul)==normM(boul); else mm=l.boul==boul;
          if(mm){ dejaV+=parseInt(l.miz)||0; dejaG+=parseInt(l.miz)||0; }
        });
      }
      if((dejaV+miz)>maxV){
        alert(`⛔ DEPASE LIMIT PA VANDÈ nan ${tiraj}\n${type} ${boul} - ${tiraj}\nMax ${vendeurActif} pou ${tiraj}: ${maxV}$\nDeja vann pa ${vendeurActif} nan ${tiraj}: ${dejaV}$\nOu vle ajoute: ${miz}$\nTotal: ${dejaV+miz}$ > ${maxV}$\nPA KA ENPRIME - LIMIT VANDÈ PA TIRAJ\nEgzanp screenshot la: FL SOIR 00 deja 5000$ - pa ka vann 5000$ ankò`);
        return false;
      }
      if((dejaG+miz)>maxG){
        alert(`⛔ DEPASE LIMIT GLOBAL nan ${tiraj}\n${type} ${boul} - ${tiraj}\nMax Global pou ${tiraj}: ${maxG}$\nDeja Global nan ${tiraj}: ${dejaG}$ (${detail.join(' + ')||'0$'})\nOu vle: ${miz}$\nTotal Global: ${dejaG+miz}$ > ${maxG}$\nEx: Jan 300$ + Joseph 200$ = 500$ nan ${tiraj} - Lòt pa ka vann 00 nan ${tiraj} - Men ka vann nan lòt tiraj\nPA KA ENPRIME - GLOBAL=v1+v2 PA TIRAJ`);
        return false;
      }
    }
  }catch(e){ console.log(e); }
  return true;
}
async function checkAllFinal(){
  const map={};
  lignes.forEach(l=>{
    if(!l.boul.trim()||!l.miz.trim()) return;
    const k=l.type+"_"+(l.type=="MARYAJ"?normM(l.boul):l.boul);
    if(!map[k]) map[k]={type:l.type,boul:l.type=="MARYAJ"?normM(l.boul):l.boul,miz:0,tirajList:[...tirajChwazi]};
    map[k].miz+=parseInt(l.miz)||0;
  });
  for(const k in map){
    const t=map[k];
    const ok=await checkLimitPaTiraj({type:t.type,boul:t.boul,miz:t.miz.toString()}, true);
    if(!ok) return false;
  }
  return true;
}
function addNewLigne(i,go){
  const l=lignes[i];
  if(l.boul.trim()==""||l.miz.trim()==""){alert("Boul + Miz CHIF SÈLMAN");return;}
  if(tirajChwazi.length==0){alert("Chwazi tiraj - LIMIT PA TIRAJ");return;}
  checkLimitPaTiraj(l,false).then(ok=>{
    if(!ok) return;
    lignes.splice(i+1,0,{type:l.type,boul:"",miz:""});
    renderLignes(); updateTotal();
    if(go) setTimeout(()=>{const nb=document.getElementById(`boul-${i+1}`); if(nb) nb.focus();},80);
  });
}
function updateTotal(){
  let s=0; lignes.forEach(l=>{if(l.boul!=""&&l.miz!="") s+=parseInt(l.miz)||0;});
  const nb=tirajChwazi.length||0;
  document.getElementById('totalBar').innerText=`Total $${s} × ${nb} = $${s*nb} - LIMIT GLOBAL ${cacheLimGlobal.BOLET}$ / VANDÈ ${cacheLimVendeur.BOLET}$ PA TIRAJ ${tirajChwazi.join('/')} - CHIF SÈLMAN`;
}

  tirajChwazi=Array.from(document.querySelectorAll('.tiraj input:checked')).map(i=>i.value);

  tirajChwazi.forEach(t=>{const id={ "GA MIDI":"l1","FL MIDI":"l2","NY MIDI":"l3","GA SOIR":"l4","FL SOIR":"l5","NY SOIR":"l6"}[t]; if(id) document.getElementById(id).innerText=t+" ✓";});
  document.getElementById('infoTiraj').innerText=tirajChwazi.length>0?tirajChwazi.join(' + ')+" ✓ LIMIT=v1+v2 PA TIRAJ - "+dateStr:"Chwazi tiraj";
  updateTotal();
}));
async function loadCopier(){const c=document.getElementById('copierList'); c.innerHTML="Chargement..."; const snap=await get(ref(db,`ventes/${dateStr}/${vendeurActif}`)); if(!snap.exists()){c.innerHTML="Pa gen fich";return;} c.innerHTML=""; Object.entries(snap.val()).slice(-10).reverse().forEach(([k,f])=>{const d=document.createElement('div'); d.className="ficheItem"; d.innerHTML=`<b>${f.id}</b> - ${f.tiraj.join('/')} - ${f.fiches.map(ff=>`${ff.type} ${ff.boul} $${ff.miz}`).join(' | ')} - $${f.total} <button class="btn btn-y" data-cop="${k}">KOPIYE</button>`; c.appendChild(d);}); c.querySelectorAll('[data-cop]').forEach(b=>b.addEventListener('click',async()=>{const s=await get(ref(db,`ventes/${dateStr}/${vendeurActif}/${b.dataset.cop}`)); if(s.exists()){const f=s.val(); tirajChwazi=f.tiraj; lignes=f.fiches.map(ff=>({type:ff.type,boul:ff.boul,miz:ff.miz.toString()})); document.querySelectorAll('.tiraj input').forEach(inp=>{inp.checked=tirajChwazi.includes(inp.value); const lbl=document.getElementById({ "GA MIDI":"l1","FL MIDI":"l2","NY MIDI":"l3","GA SOIR":"l4","FL SOIR":"l5","NY SOIR":"l6"}[inp.value]); if(lbl) lbl.innerText=inp.checked?inp.value+" ✓":inp.value;}); openOnglet(1); renderLignes(); updateTotal();}}));}
async function loadFiches(){const c=document.getElementById('fichesList'); c.innerHTML="Chargement..."; const snap=await get(ref(db,`ventes/${dateStr}/${vendeurActif}`)); if(!snap.exists()){c.innerHTML="Pa gen fich";return;} c.innerHTML=""; Object.entries(snap.val()).reverse().forEach(([k,f])=>{const d=document.createElement('div'); d.className="ficheItem"; d.innerHTML=`<b>${f.id}</b> - ${f.tiraj.join('/')} - ${f.fiches.map(ff=>`${ff.type} ${ff.boul} $${ff.miz}`).join(' | ')} - $${f.total}<br><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><button class="btn btn-b" data-reprint="${k}">REIMPRIMER</button><button class="btn btn-r" data-del="${k}">EFASÈ</button></div>`; c.appendChild(d);}); c.querySelectorAll('[data-reprint]').forEach(b=>b.addEventListener('click',async()=>{const s=await get(ref(db,`ventes/${dateStr}/${vendeurActif}/${b.dataset.reprint}`)); if(s.exists()){const f=s.val(); const lignesHtml=f.fiches.map(ff=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed #999"><span style="width:90px;text-align:left">${ff.type}</span><span style="flex:1;text-align:center;font-weight:900">${ff.boul}</span><span style="width:70px;text-align:right">$${ff.miz}</span></div>`).join(''); const html=`<div style="text-align:center;font-family:monospace;font-weight:900;width:300px;margin:0 auto;background:#fff;color:#000;padding:10px"><div style="font-size:20px">C&D VÉRITÉ LOTTO</div><div style="font-size:12px;margin-top:8px">Date ${f.date} EST PAP - LIMIT=v1+v2 PA TIRAJ</div><div style="font-size:12px">Tirages ${f.tiraj.join('/')} </div><div style="font-size:12px">Resp ${vendeurActif}</div><div style="font-size:12px">Ticket ${f.id} REPRINT</div><div style="margin:12px 0">----------------</div><div style="text-align:left">${lignesHtml}</div><div style="margin:12px 0">----------------</div><div style="font-size:18px">TOTAL $${f.total}</div></div>`; const pa=document.getElementById('printArea'); pa.innerHTML=html; pa.style.display='block'; setTimeout(()=>{window.print(); pa.style.display='none';},300);}})); c.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm("Efase? Sa ap libere limit la"))return; await remove(ref(db,`ventes/${dateStr}/${vendeurActif}/${b.dataset.del}`)); loadFiches();}));}
async function getPrixActif(){let P={lot1:50,lot2:20,lot3:10,maryaj:1000,loto3:500,loto4:5000,loto5:25000}; try{const sV=await get(ref(db,`prix/${vendeurActif}`)); if(sV.exists()){const p=sV.val(); P={lot1:parseInt(p.lot1||50),lot2:parseInt(p.lot2||20),lot3:parseInt(p.lot3||10),maryaj:parseInt(p.maryaj||1000),loto3:parseInt(p.loto3||500),loto4:parseInt(p.loto4||5000),loto5:parseInt(p.loto5||25000)}; return P;} const sG=await get(ref(db,`prix_global`)); if(sG.exists()){const p=sG.val(); P={lot1:parseInt(p.lot1||50),lot2:parseInt(p.lot2||20),lot3:parseInt(p.lot3||10),maryaj:parseInt(p.maryaj||1000),loto3:parseInt(p.loto3||500),loto4:parseInt(p.loto4||5000),loto5:parseInt(p.loto5||25000)}; return P;}}catch(e){} return P;}
async function genRap(){const du=document.getElementById('dateDu').value||dateStr, au=document.getElementById('dateAu').value||du, filT=document.getElementById('selTirajRap').value||"TOUS"; const dDu=new Date(du), dAu=new Date(au); let vente=0,gain=0,nb=0; const PRIX=await getPrixActif(); for(let d=new Date(dDu);d<=dAu;d.setDate(d.getDate()+1)){const ds=d.toISOString().slice(0,10); const sV=await get(ref(db,`ventes/${ds}/${vendeurActif}`)); const sR=await get(ref(db,`resultats/${ds}`)); if(!sV.exists())continue; Object.values(sV.val()).forEach(f=>{const filt=filT=="TOUS"?f.tiraj:f.tiraj.filter(t=>t==filT); if(filt.length==0)return; const r=filt.length/f.tiraj.length; nb++; vente+=f.total*r; if(sR.exists()){filt.forEach(t=>{if(!sR.child(t).exists())return; const res=sR.child(t).val(); f.fiches.forEach(l=>{const m=parseInt(l.miz)||0; if(l.type=="BOLET"){if(l.boul==res.r1)gain+=m*PRIX.lot1*r; else if(l.boul==res.r2)gain+=m*PRIX.lot2*r; else if(l.boul==res.r3)gain+=m*PRIX.lot3*r;} if(l.type=="MARYAJ"){const b=normM(l.boul); if(b==normM(res.m1||"")||b==normM(res.m2||"")||b==normM(res.m3||"")) gain+=m*PRIX.maryaj*r;} if(l.type=="LOTO3"&&l.boul==res.l3)gain+=m*PRIX.loto3*r; if(l.type=="LOTO4"&&l.boul==res.l4)gain+=m*PRIX.loto4*r; if(l.type=="LOTO5"&&l.boul==res.l5)gain+=m*PRIX.loto5*r;});});}});} const comm=vente*pourActif/100, bal=vente-comm-gain; document.getElementById('rapContent').innerHTML=`Du ${du} Au ${au} - LIMIT=v1+v2 PA TIRAJ - BLOKE<br>Tirage ${filT}<br><br>Vente $${vente.toFixed(0)}<br>Comm ${pourActif}% $${comm.toFixed(0)}<br>Gain $${gain.toFixed(0)}<br><div style="background:#000;color:#FFD500;padding:8px;border-radius:10px;margin-top:8px;text-align:center">Balance $${bal.toFixed(0)}</div>`; window.dernierRap={du,au,filT,vente,comm,gain,bal,nb};}
window.valider=async function(doPrint){
  const sp=localStorage.getItem("vendeurPass"); if(!vendeurActif||!sp){alert("MODPAS OBLIGATWA"); location.reload(); return;}
  const sC=await get(ref(db,`vendeurs`)); let ok=false; if(sC.exists()) Object.values(sC.val()).forEach(v=>{if(v.nom==vendeurActif&&v.pass==sp&&v.status!="FERME") ok=true;});
  if(!ok){alert("MODPAS PA RESPEKTE"); localStorage.clear(); location.reload(); return;}
  const vals=lignes.filter(f=>f.boul.trim()!=""&&f.miz.trim()!="").map(f=>({...f,boul:f.type=="MARYAJ"?normM(f.boul):f.boul}));
  if(vals.length==0||tirajChwazi.length==0){alert("Chwazi tiraj + boul - CHIF SÈLMAN");return;}
  const cur=getHeurePAP(); const sH=await get(ref(db,`heures`)); if(sH.exists()){const h=sH.val(); for(let t of tirajChwazi){const hm=h[t.replace(' ','_')]; if(!hm)continue; const [hh,mm]=hm.split(':').map(Number); if(cur>hh*60+mm){alert(`FÈMÈ ${t}`);return;}}}
  await loadLimitesCache();
  const all=await checkAllFinal();
  if(!all){alert("⛔ BLOKE - DEPASE LIMIT PA TIRAJ - PA KA ENPRIME - Gade screenshot ou: 2×5000$ FL SOIR depase 500$ - Kounya BLOKE");return;}
  const id="T-"+Date.now().toString().slice(-6); const tot=vals.reduce((s,f)=>s+(parseInt(f.miz)||0),0)*tirajChwazi.length;
  await push(ref(db,`ventes/${dateStr}/${vendeurActif}`),{id,tiraj:tirajChwazi,fiches:vals,total:tot,date:dateStr,timestamp:Date.now(),vendeur:vendeurActif});
  const fichL=vals.map(f=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed #999"><span style="width:90px;text-align:left;font-size:16px">${f.type}</span><span style="flex:1;text-align:center;font-size:18px;font-weight:900">${f.boul}</span><span style="width:70px;text-align:right;font-size:16px">$${f.miz}</span></div>`).join('');
  const html=`<div style="text-align:center;font-family:monospace;font-weight:900;width:300px;margin:0 auto;color:#000;background:#fff;padding:10px"><div style="font-size:20px">C&D VÉRITÉ LOTTO</div><div style="font-size:12px;margin-top:8px">Date ${dateStr} EST PAP - LIMIT=v1+v2 PA TIRAJ</div><div style="font-size:12px">Tirages ${tirajChwazi.join('/')} </div><div style="font-size:12px">Resp ${vendeurActif}</div><div style="font-size:12px">Ticket ${id}</div><div style="margin:12px 0">----------------</div><div style="text-align:left">${fichL}</div><div style="margin:12px 0">----------------</div><div style="font-size:18px">TOTAL $${tot}</div></div>`;
  const pa=document.getElementById('printArea'); pa.innerHTML=html; pa.style.display='block'; if(doPrint) setTimeout(()=>{window.print(); pa.style.display='none';},300); else pa.style.display='none'; lignes=[{type:"BOLET",boul:"",miz:""}]; renderLignes(); updateTotal();
}
document.addEventListener('DOMContentLoaded',async()=>{const sV=localStorage.getItem("vendeur"), sP=localStorage.getItem("vendeurPass"); if(sV&&sP){const snap=await get(ref(db,`vendeurs`)); let ok=false, p=10; if(snap.exists()) Object.values(snap.val()).forEach(v=>{if(v.nom==sV&&v.pass==sP&&v.status!="FERME"){ok=true; p=v.pour||10;}}); if(ok){vendeurActif=sV; pourActif=p; document.getElementById('loginOverlay').style.display='none'; initApresLogin();}} document.getElementById('btnLogin').addEventListener('click',checkLogin); document.getElementById('inpLoginNom').addEventListener('keydown',(e)=>{if(e.key=="Enter")document.getElementById('inpLoginPass').focus();}); document.getElementById('inpLoginPass').addEventListener('keydown',(e)=>{if(e.key=="Enter")checkLogin();}); document.getElementById('inpLoginPass').addEventListener('input',()=>{document.getElementById('inpLoginPass').value=document.getElementById('inpLoginPass').value.replace(/[^0-9]/g,'');}); document.getElementById('b1').addEventListener('click',()=>openOnglet(1)); document.getElementById('b2').addEventListener('click',()=>openOnglet(2)); document.getElementById('b3').addEventListener('click',()=>openOnglet(3)); document.getElementById('b4').addEventListener('click',()=>openOnglet(4)); document.getElementById('bX').addEventListener('click',()=>openOnglet(5)); document.getElementById('btnVal').addEventListener('click',()=>valider(false)); document.getElementById('btnPrint').addEventListener('click',()=>valider(true)); document.getElementById('btnReloadCopier').addEventListener('click',loadCopier); document.getElementById('btnReloadFich').addEventListener('click',loadFiches); document.getElementById('btnGenRap').addEventListener('click',genRap); document.getElementById('btnPrintRap').addEventListener('click',()=>{const r=window.dernierRap; if(!r){alert("Jenere rapport");return;} const html=`<div style="text-align:center;font-family:monospace;font-weight:900;width:300px;margin:0 auto;background:#fff;color:#000;padding:10px"><div style="font-size:16px">RAPPORT VANDÈ - ${vendeurActif} - LIMIT=v1+v2 PA TIRAJ</div><div style="font-size:10px;margin-top:6px">Du ${r.du} Au ${r.au} - ${r.filT} EST PAP</div><div style="margin:8px 0">----------------</div><div style="text-align:left;font-size:11px">Vente $${r.vente.toFixed(0)}<br>Comm $${r.comm.toFixed(0)}<br>Gain $${r.gain.toFixed(0)}<br>Balance $${r.bal.toFixed(0)}</div></div>`; const pa=document.getElementById('printArea'); pa.innerHTML=html; pa.style.display='block'; setTimeout(()=>{window.print(); pa.style.display='none';},300);});});
</script>
