<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V116 MWAYEN</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f2f2f2}.h{background:#000;color:#FFD700;padding:9px;text-align:center;font-weight:bold;font-size:15px}.card{background:#fff;padding:8px;margin:6px;border-radius:10px}.tirajBtn{padding:7px 12px;border:1.5px solid #000;border-radius:18px;font-weight:bold;margin:3px;background:#fff;font-size:13px}.tirajBtn.active{background:#000;color:#FFD700}.tirajBtn.ferme{background:#ddd;color:#999;text-decoration:line-through}.line{display:flex;gap:6px;margin:5px 0;align-items:center}.line select{flex:0.85;padding:10px 4px;border:2px solid #000;border-radius:10px;font-size:14px;font-weight:bold;height:48px;text-align:center} .kaz{flex:1.1;height:50px !important;padding:10px !important;border:2px solid #000 !important;border-radius:10px !important;font-size:18px !important;font-weight:bold !important;text-align:center !important} #miz{flex:1} .totalBox{background:#000;color:#fff;padding:9px;border-radius:10px;text-align:center;margin:6px 0}.btnVendre{background:#000;color:#FFD700;font-weight:bold;padding:13px;width:100%;border:none;border-radius:10px;font-size:16px;margin-top:6px}.ticket{background:#fff;border:1px dashed #000;padding:6px;font-size:13px;white-space:pre-wrap}</style>
</head><body>
<div class="h">C&D LOTTO VENDEUR V116 - MWAYEN</div>
<div id="loginDiv" class="card"><input id="vName" placeholder="Non vandè" style="width:100%;padding:11px;border:2px solid #000;border-radius:10px;margin:4px 0"><input id="vPass" type="password" placeholder="Kòd" style="width:100%;padding:11px;border:2px solid #000;border-radius:10px;margin:4px 0"><button class="btnVendre" onclick="login()">KONEKTE</button></div>
<div id="mainDiv" style="display:none">
<div class="card" style="padding:7px"><div style="display:flex;justify-content:space-between;font-size:13px"><b>TIRAJ - <span id="dateAff"></span></b><span style="background:#0a0;color:#fff;padding:3px 8px;border-radius:8px">OUVE</span></div><div id="tirajList" style="margin-top:6px"></div></div>
<div class="card" style="padding:7px">
<div style="display:flex;background:#000;color:#FFD700;padding:7px;border-radius:8px;font-weight:bold;font-size:13px;text-align:center"><div style="flex:0.85">JEUX</div><div style="flex:1.1">BOUL</div><div style="flex:1">MIZ</div></div>
<div class="line">
<select id="jeux"><option>Borlette</option><option>Mariage</option><option>Loto3</option><option>Loto4</option><option>Loto5</option></select>
<input id="boul" class="kaz" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="BOUL" autocomplete="off">
<input id="miz" class="kaz" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="MIZ" autocomplete="off">
</div>
<div style="font-size:11px;color:#666;text-align:center">55 → flèch ble → 25 → flèch ble → ajoute</div>
<div class="totalBox"><div style="font-size:13px">Total <span id="totalTxt">0$ x 0</span></div><div style="color:#FFD700;font-size:20px;font-weight:bold">A PEYE <span id="aPeye">0$</span></div></div>
<button class="btnVendre" onclick="vendre()">VENDRE & IMPRIMER</button>
<div id="ticketDiv" style="margin-top:6px"></div>
</div></div>
<script>
const firebaseConfig={databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com"}; firebase.initializeApp(firebaseConfig); const db=firebase.database();
let cfg={},vendor='',ticket=[],selectedTiraj=[];
function getESTNow(){const now=new Date(); const t=now.toLocaleString('en-US',{timeZone:'America/Port-au-Prince',hour12:false}).split(', ')[1]||'00:00:00'; const [h,m]=t.split(':').map(Number); return {dateStr:now.toLocaleDateString('en-CA',{timeZone:'America/Port-au-Prince'}),hm:h*60+m};}
function isPastEST(hs){if(!hs)return false; const [hh,mm]=hs.split(':').map(Number); return getESTNow().hm >= (hh*60+(mm||0));}
const boulInput=document.getElementById('boul'); const mizInput=document.getElementById('miz');
boulInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(boulInput.value) mizInput.focus(); }});
mizInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(mizInput.value){ addLigne(); boulInput.focus(); } }});
[boulInput,mizInput].forEach(inp=>{ inp.addEventListener('input',()=>{ inp.value=inp.value.replace(/[^0-9]/g,''); });});
db.ref('config').on('value',s=>{ cfg=s.val()||{}; renderTirages();});
function login(){const n=vName.value.trim(); const p=vPass.value.trim(); if(!n)return alert('Non'); db.ref('vendors/'+n).once('value',snap=>{ const v=snap.val(); if(!v)return alert('Pa egziste'); if(v.pass!==p)return alert('Kòd pa bon'); if((v.status||'OUVE').toUpperCase()!=='OUVE')return alert('FERMÉ'); vendor=n; loginDiv.style.display='none'; mainDiv.style.display='block'; dateAff.innerText=getESTNow().dateStr; renderTirages();});}
function renderTirages(){const he=cfg.heures||{gaMidi:'12:30',flMidi:'13:30',nyMidi:'14:30',gaSoir:'18:30',flSoir:'21:00',nySoir:'21:30'}; const et=cfg.tirages||{}; const list=[{id:'gaMidi',l:'GA midi'},{id:'gaSoir',l:'GA soir'},{id:'flMidi',l:'FL midi'},{id:'flSoir',l:'FL soir'},{id:'nyMidi',l:'NY midi'},{id:'nySoir',l:'NY soir'}]; let html=''; list.forEach(o=>{ const h=he[o.id]||''; const ferme=(cfg.autoClose!==false && isPastEST(h)) || et[o.id]==='FERME'; const cls=ferme?'tirajBtn ferme':(selectedTiraj.includes(o.l)?'tirajBtn active':'tirajBtn'); html+='<button class="'+cls+'" '+(ferme?'disabled':'onclick="toggleTiraj(\''+o.l+'\')"')+'>'+o.l+(ferme?' FÈMÈN':'')+'</button>';}); document.getElementById('tirajList').innerHTML=html; updateTotal();}
setInterval(renderTirages,15000);
function toggleTiraj(t){ if(selectedTiraj.includes(t)) selectedTiraj=selectedTiraj.filter(x=>x!==t); else selectedTiraj.push(t); renderTirages();}
function addLigne(){ const j=jeux.value; const b=boul.value.trim().replace(/[^0-9]/g,''); const m=parseInt(miz.value)||0; if(!b||!m)return; ticket.push({jeu:j,boul:b,mise:m}); boul.value=''; miz.value=''; renderTicket(); boulInput.focus();}
function renderTicket(){ let html='', total=0; ticket.forEach((t,i)=>{ total+=t.mise; html+= t.jeu+' '+t.boul+' - '+t.mise+'$ <b onclick="ticket.splice('+i+',1);renderTicket()" style="color:red"> x</b><br>';}); ticketDiv.innerHTML=html?'<div class="ticket">'+html+'</div>':''; totalTxt.innerText=total+'$ x '+selectedTiraj.length; aPeye.innerText=(total*selectedTiraj.length)+'$';}
function updateTotal(){ const total=ticket.reduce((s,t)=>s+t.mise,0); totalTxt.innerText=total+'$ x '+selectedTiraj.length; aPeye.innerText=(total*selectedTiraj.length)+'$';}
function vendre(){ if(selectedTiraj.length===0)return alert('Chwazi tiraj'); if(ticket.length===0)return alert('Ajoute boul'); const total=ticket.reduce((s,t)=>s+t.mise,0); const fichId=Date.now()+'_'+vendor; const data={id:fichId,vendor:vendor,tiraj:selectedTiraj.join(','),total:total,nbTiraj:selectedTiraj.length,details:ticket,ticketHtml:ticket.map(t=>t.jeu+' '+t.boul+' - '+t.mise+'$').join('<br>'),date:Date.now(),dateStr:getESTNow().dateStr,gain:0}; db.ref('fiches/'+fichId).set(data).then(()=>{ alert('Vann! '+aPeye.innerText); ticket=[]; renderTicket(); boulInput.focus();});}
</script></body></html>
