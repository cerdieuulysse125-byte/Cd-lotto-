<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C&D VÉRITÉ LOTTO V4.9.1</title>
<style>
body{margin:0;font-family:Arial;background:#000;color:#fff}
.header{background:#000;color:#FFD700;text-align:center;padding:10px;font-weight:bold}
.tabs{display:flex;background:#222}
.tabs div{flex:1;padding:12px;text-align:center;cursor:pointer}
.tabs .active{background:#FFD700;color:#000;font-weight:bold}
#RAPO{padding:15px}
.date-box{display:flex;gap:10px;margin-bottom:10px}
.date-box input, .date-box select{flex:1;padding:14px;border-radius:10px;border:none;font-weight:bold;font-size:16px}
.btn{width:100%;padding:16px;background:#000;color:#FFD700;border:2px solid #FFD700;border-radius:12px;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="header">C&D VÉRITÉ LOTTO- Jean - MES FICHES OK - CHIF SELMAN - FLÈCH</div>
<div class="tabs">
<div>1.VANT</div><div>2.KOPYE</div><div>3.FICH</div><div class="active">4.RAPÒ</div>
</div>

<div id="RAPO">
<h2 style="text-align:center">RAPÒ - 500/2=250 CHAK TIRAJ</h2>

<div class="date-box">
<input type="date" id="dateDebut">
<input type="date" id="dateFin">
</div>

<div class="date-box">
<select id="tirageSelect"><option>Tirage Tous</option><option>New York</option><option>Florida</option></select>
</div>

<button class="btn" onclick="jenereRapò()">📊 Jenere Rapò</button>
<p id="dateInfo" style="text-align:center;margin-top:15px;color:#FFD700"></p>
</div>

<script>
// ===== FIX DEFINITIF DAT AYITI - PA JANM 16 ANKÒ =====
function getHaitiISO(){
  return new Date().toLocaleDateString('en-CA',{timeZone:'America/Port-au-Prince'});
}
function getHaitiFR(){
  return new Date().toLocaleDateString('fr-HT',{timeZone:'America/Port-au-Prince',day:'2-digit',month:'2-digit',year:'numeric'});
}
function getHaitiHeure(){
  return new Date().toLocaleTimeString('fr-HT',{timeZone:'America/Port-au-Prince',hour:'2-digit',minute:'2-digit',hour12:true});
}

// APLIKE DAT JODI A OTOMATIKMAN
window.onload = function(){
  const iso = getHaitiISO();
  const fr = getHaitiFR();
  const heure = getHaitiHeure();
  document.getElementById('dateDebut').value = iso;
  document.getElementById('dateFin').value = iso;
  document.getElementById('dateInfo').innerHTML = `Date du jour: <b>${fr}</b> - L'heure de l'Est: <b>${heure}</b>`;
  console.log("Dat korije: "+fr+" "+heure);
};

// POU LÈ OU KREYE FICH
function getDatePourFich(){
  return getHaitiFR(); // Itilize sa nan fich ou yo, pa new Date()
}

function jenereRapò(){
  const d1 = document.getElementById('dateDebut').value;
  const d2 = document.getElementById('dateFin').value;
  // Konvèti ISO -> FR pou rapò
  const fr1 = new Date(d1+'T12:00:00').toLocaleDateString('fr-HT',{timeZone:'America/Port-au-Prince'});
  const fr2 = new Date(d2+'T12:00:00').toLocaleDateString('fr-HT',{timeZone:'America/Port-au-Prince'});
  alert("Rapò soti "+fr1+" rive "+fr2+" - Lè Ayiti: "+getHaitiHeure());
}
</script>
</body>
</html>
