<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C&D V4.8 - FICH 500/2=250 CHAK</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#000}.card{max-width:520px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}.hdr{background:#000;color:#fff;text-align:center;padding:12px;font-weight:bold}.tabs{display:flex;background:#111;position:sticky;top:0;z-index:20}.tab{flex:1;padding:12px 2px;text-align:center;color:#888;font-size:10px;font-weight:bold;cursor:pointer;border-bottom:3px solid #111}.tab.active{color:#fff;border-bottom-color:#fff}.content{padding:10px;flex:1}.panel{display:none}.panel.active{display:block}.tirages{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.tir{border:2.5px solid #000;padding:12px 4px;border-radius:10px;text-align:center;font-size:11px;font-weight:bold;cursor:pointer}.tir.sel{background:#000;color:#fff}.tir.ferme{opacity:0.25;pointer-events:none;background:#ccc}.ligne{display:flex;gap:5px;margin:8px 0;align-items:center;background:#f5f5f5;padding:7px;border-radius:12px;border:2px solid #000}.jeuxBtn{width:26%;border:2.5px solid #000;border-radius:8px;padding:13px 2px;font-size:12px;font-weight:bold;text-align:center;background:#fff;cursor:pointer}.boul{width:28%;border:2.5px solid #000;border-radius:8px;padding:13px 4px;font-size:18px;font-weight:bold;text-align:center;background:#fff}.miz{width:20%;border:2.5px solid #000;border-radius:8px;padding:13px 2px;font-size:18px;font-weight:bold;text-align:center;background:#fff}.del{width:12%;background:#fff;border:2.5px solid red;color:red;border-radius:8px;padding:13px 0;font-weight:bold;cursor:pointer}.arrowBtn{width:14%;background:#000;color:#fff;border:2.5px solid #000;border-radius:8px;padding:13px 0;font-weight:bold;cursor:pointer;font-size:18px}.totalBox{background:#000;color:#fff;border-radius:12px;padding:14px;text-align:center;font-size:18px;font-weight:bold;margin:12px 0}.btn{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:16px;margin:6px 0;cursor:pointer}.btn-out{background:#fff;color:#000;border:2.5px solid #000}.list{border:2.5px solid #000;border-radius:12px;padding:12px;margin:8px 0;font-size:12px;background:#fff}.inputBox{width:100%;padding:12px;border:2px solid #000;border-radius:10px;margin:6px 0;font-weight:bold}.rapBox{border:3px solid #000;border-radius:14px;padding:22px;margin-top:12px;background:#f9f9f9;white-space:pre-line;text-align:center;font-family:Arial Black,Arial,sans-serif;font-size:18px;font-weight:900;line-height:2;color:#000}.configBar{background:#00ff88;color:#000;padding:7px 10px;font-size:11px;font-weight:bold;text-align:center}
</style>
</head>
<body>
<div class="card">
<div class="hdr">C&D - <span id="vNameHdr">Vandè</span> - V4.8</div>
<div class="configBar">✅ 500/2=250 CHAK | FERMETURE | LIMIT GLOBAL | FIZYON | DEZÒD 27x12</div>
<div id="loginDiv" style="padding:30px"><input id="nom" placeholder="Non Vandè" class="inputBox"><input id="pass" type="password" placeholder="Modpas" class="inputBox"><button class="btn" onclick="login()">ANTRE</button><p id="msg" style="color:red;text-align:center;margin-top:10px;font-weight:bold"></p></div>
<div id="appDiv" style="display:none;flex-direction:column;flex:1">
<div class="tabs"><div class="tab active" onclick="openTab(0)">1.VANT</div><div class="tab" onclick="openTab(1)">2.KOPYE</div><div class="tab" onclick="openTab(2)">3.FICH</div><div class="tab" onclick="openTab(3)">4.RAPÒ</div></div>
<div class="content">
<div class="panel active" id="p0"><div class="tirages"><div class="tir" id="t1" onclick="toggleTir('GA MIDI')">GA MIDI</div><div class="tir" id="t2" onclick="toggleTir('FL MIDI')">FL MIDI</div><div class="tir" id="t3" onclick="toggleTir('NY MIDI')">NY MIDI</div><div class="tir" id="t4" onclick="toggleTir('GA SOIR')">GA SOIR</div><div class="tir" id="t5" onclick="toggleTir('FL SOIR')">FL SOIR</div><div class="tir" id="t6" onclick="toggleTir('NY SOIR')">NY SOIR</div></div><div id="resultLive" class="small" style="background:#000;color:#0f0;padding:8px;border-radius:8px;text-align:center;font-size:11px"></div><div id="lignes"></div><button class="btn btn-out" style="background:#eee" onclick="addLigne(lastJeux)">⬇️ Liy swivan</button><div class="totalBox" id="totalBox">Total: $0 x 0 = $0</div><button class="btn" onclick="validerEtImprimer()">💾 VALIDE & IMPRIMER GWO LÈT</button></div>
<div class="panel" id="p1"><input id="searchTicket" class="inputBox" placeholder="Chèche Id oswa boul..." oninput="filtrerCopy()"><div id="copyList"></div></div>
<div class="panel" id="p2"><h4 style="text-align:center">FICHES <span id="dateJour"></span></h4><button class="btn btn-out" onclick="loadFiches()">🔄 Rechaje</button><div id="fichesList"></div></div>
<div class="panel" id="p3"><h4 style="text-align:center">RAPÒ SENP - 500/2=250</h4><div style="display:flex;gap:6px"><div style="flex:1"><label style="font-size:11px;font-weight:bold">Du</label><input id="du" type="date" class="inputBox"></div><div style="flex:1"><label style="font-size:11px;font-weight:bold">Au</label><input id="au" type="date" class="inputBox"></div></div><select id="rapTirage" class="inputBox"><option value="TOUS">Tirage tous</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><button class="btn" onclick="genRapport()">📊 Jenere Rapò</button><div id="rapportRes"></div><button class="btn btn-out" id="btnPrintRap" style="display:none" onclick="printRapport()">🖨️ Imprimer GWO LÈT</button></div>
</div>
</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let current=null, tiragesSel=new Set(), lignesData=[], lastJeux='BOLET', allVentes=[], allResultats=[];
const JEUX_LIST=['BOLET','MARYAJ','LOTO3','LOTO4','LOTO5'];
let PRIX={BOLET_1ER:50,BOLET_2E:20,BOLET_3E:10,MARYAJ:1000,M1:1000,M2:1000,M3:1000,LOTO3:500,LOTO4:5000,LOTO5:25000};
let ENTETE={nom:"C&D VÉRITÉ LOTTO", footer:"Mèsi, bòn chans!"};
let FERMETURE={}, LIMITES_GLOBAL={BOLET:5000,MARYAJ:5000,LOTO3:3000,LOTO4:2000,LOTO5:1000}, TOTAL_VENTES_JOUR={};
function isFerme(d){ if(!d) return true; if(d.actif===false||d.femen===true) return true; const s=String(d.status||'').toUpperCase(), e=String(d.etat||'').toUpperCase(); if(s.includes('FERM')||e.includes('FERM')) return true; return false; }
function openTab(i){document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));document.querySelectorAll('.panel').forEach((p,idx)=>p.classList.toggle('active',idx===i));}
async function loadConfig(){ try{ const doc=await db.collection('config').doc('global').get(); if(doc.exists){ const c=doc.data(); if(c.prix){ PRIX={...PRIX,...c.prix}; PRIX.M1=c.prix.MARYAJ||1000; PRIX.M2=c.prix.MARYAJ||1000; PRIX.M3=c.prix.MARYAJ||1000; } if(c.entete) ENTETE=c.entete; if(c.fermeture) FERMETURE=c.fermeture; if(c.limites) LIMITES_GLOBAL={...LIMITES_GLOBAL,...c.limites}; } }catch(e){} }
async function loadFermetureEtLimites(){ try{ const today=new Date().toISOString().slice(0,10); const snap=await db.collection('ventes').where('dateStr','==',today).get(); TOTAL_VENTES_JOUR={}; snap.forEach(d=>{ const v=d.data(); (v.tirages||[]).forEach(tir=>{ (v.lignes||[]).forEach(l=>{ const key=`${tir}|${l.jeux}|${String(l.boul).replace(/[^0-9x\-]/gi,'').toUpperCase()}`; TOTAL_VENTES_JOUR[key]=(TOTAL_VENTES_JOUR[key]||0)+(parseFloat(l.miz)||0); }); }); }); checkFermeture(); }catch(e){} }
function checkFermeture(){ const now=new Date(); const hhmm=now.getHours()*60+now.getMinutes(); const map={'GA MIDI':'t1','FL MIDI':'t2','NY MIDI':'t3','GA SOIR':'t4','FL SOIR':'t5','NY SOIR':'t6'}; for(let tirage in FERMETURE){ if(!FERMETURE[tirage]) continue; const [h,m]=FERMETURE[tirage].split(':').map(Number); const limitH=h*60+(m||0); const el=document.getElementById(map[tirage]); if(!el) continue; if(hhmm>=limitH){ el.classList.add('ferme'); tiragesSel.delete(tirage); el.classList.remove('sel'); }else{ el.classList.remove('ferme'); } } }
function canToggleTir(n){ const el=document.getElementById('t'+{'GA MIDI':1,'FL MIDI':2,'NY MIDI':3,'GA SOIR':4,'FL SOIR':5,'NY SOIR':6}[n]); if(el&&el.classList.contains('ferme')){ alert("⛔ "+n+" FÈMEN"); return false; } return true; }
function toggleTir(n){ if(!canToggleTir(n)) return; const m={'GA MIDI':1,'FL MIDI':2,'NY MIDI':3,'GA SOIR':4,'FL SOIR':5,'NY SOIR':6}; const el=document.getElementById('t'+m[n]); if(tiragesSel.has(n)){tiragesSel.delete(n);el.classList.remove('sel')}else{tiragesSel.add(n);el.classList.add('sel')} calcTotal(); }
function addLigne(j, focusBoul=true, boulValue='', mizValue=''){ const jeux=j||lastJeux||'BOLET'; lastJeux=jeux; if(boulValue){ const exist=lignesData.find(x=>x.jeux===jeux && String(x.boul).toUpperCase()===String(boulValue).toUpperCase()); if(exist){ exist.miz=(parseFloat(exist.miz)||0)+(parseFloat(mizValue)||0); const mEl=document.getElementById('m_'+exist.id); if(mEl) mEl.value=exist.miz; calcTotal(); return exist.id; } } const id=Date.now()+Math.random(); lignesData.push({id,jeux,boul:boulValue,miz:mizValue}); const div=document.createElement('div'); div.className='ligne'; div.id='row_'+id; div.innerHTML=`<div class="jeuxBtn" id="jbtn_${id}" onclick="cycleJeux('${id}')">${jeux} ▼</div><input class="boul" id="b_${id}" type="text" inputmode="numeric" value="${boulValue}"><input class="miz" id="m_${id}" type="text" inputmode="numeric" value="${mizValue}"><button class="arrowBtn" onclick="addLigne(lastJeux)">⬇️</button><button class="del" onclick="delLigne('${id}')">X</button>`; document.getElementById('lignes').appendChild(div); const bEl=document.getElementById('b_'+id); const mEl=document.getElementById('m_'+id); bEl.addEventListener('input', e=>{ e.target.value=e.target.value.replace(/[^0-9xX\- ]/g,''); updateBoul(id,e.target.value); }); mEl.addEventListener('input', e=>{ e.target.value=e.target.value.replace(/[^0-9]/g,''); updateMiz(id,e.target.value); }); bEl.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key==='ArrowDown'){ e.preventDefault(); mEl.focus(); } }); mEl.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key==='ArrowDown'){ e.preventDefault(); const curB=document.getElementById('b_'+id).value.trim().toUpperCase(); const curM=document.getElementById('m_'+id).value.trim(); if(!curB) return; const doublon=lignesData.find(x=>x.id!=id && x.jeux===lignesData.find(y=>y.id==id).jeux && String(x.boul).toUpperCase()===curB); if(doublon){ doublon.miz=(parseFloat(doublon.miz)||0)+(parseFloat(curM)||0); document.getElementById('m_'+doublon.id).value=doublon.miz; delLigne(id); calcTotal(); addLigne(lastJeux); }else{ addLigne(lastJeux); } } }); if(focusBoul) setTimeout(()=>bEl.focus(),80); calcTotal(); return id; }
function cycleJeux(id){ const o=lignesData.find(x=>x.id==id); let idx=JEUX_LIST.indexOf(o.jeux); idx=(idx+1)%JEUX_LIST.length; o.jeux=JEUX_LIST[idx]; lastJeux=JEUX_LIST[idx]; document.getElementById('jbtn_'+id).innerText=JEUX_LIST[idx]+' ▼'; }
function updateBoul(id,v){ const o=lignesData.find(x=>x.id==id); if(o)o.boul=v; } function updateMiz(id,v){ const o=lignesData.find(x=>x.id==id); if(o) o.miz=parseFloat(v)||0; calcTotal(); } function delLigne(id){ const el=document.getElementById('row_'+id); if(el)el.remove(); lignesData=lignesData.filter(o=>o.id!=id); calcTotal(); }
function calcTotal(){let sum=0; lignesData.forEach(l=>{if(l.miz)sum+=parseFloat(l.miz)||0}); document.getElementById('totalBox').innerText=`Total: $${sum} x ${tiragesSel.size} = $${sum*tiragesSel.size}`; return sum*tiragesSel.size;}
function checkLimiteGlobal(){ if(tiragesSel.size===0) return true; for(let l of lignesData){ if(!l.boul||!l.miz) continue; const boulClean=String(l.boul).replace(/[^0-9x\-]/gi,'').toUpperCase(); const mise=parseFloat(l.miz)||0; for(let tir of tiragesSel){ const key=`${tir}|${l.jeux}|${boulClean}`; const deja=TOTAL_VENTES_JOUR[key]||0; const limite=LIMITES_GLOBAL[l.jeux]||LIMITES_GLOBAL['BOLET']||999999; if(deja+mise>limite){ alert(`⛔ LIMITE GLOBAL!\n${tir} ${l.jeux} ${boulClean}\nDeja $${deja} + $${mise} > $${limite}`); return false; } } } return true; }
async function login(){ const nom=document.getElementById('nom').value.trim(), pass=document.getElementById('pass').value.trim(); const msg=document.getElementById('msg'); if(!nom||!pass){msg.innerText="Ranpli";return;} msg.innerText="Ap verifye..."; try{ const s=await db.collection('vendeurs').where('nom','==',nom).where('modpas','==',pass).get(); if(s.empty){msg.innerText="Pa kòrèk";return;} const data=s.docs[0].data(); if(isFerme(data)){ msg.innerText="⛔ FÈMEN"; return; } current={id:s.docs[0].id,...data}; document.getElementById('loginDiv').style.display='none'; document.getElementById('appDiv').style.display='flex'; document.getElementById('vNameHdr').innerText=nom; document.getElementById('dateJour').innerText=new Date().toLocaleDateString(); const t=new Date().toISOString().slice(0,10); document.getElementById('du').value=t; document.getElementById('au').value=t; await loadConfig(); addLigne('BOLET'); await fetchAll(); await loadFermetureEtLimites(); setInterval(checkFermeture,60000); }catch(e){msg.innerText=e.message} }
async function fetchAll(){ if(!current)return; const snap=await db.collection('ventes').where('vendeurId','==',current.id).limit(800).get(); allVentes=[]; snap.forEach(d=>allVentes.push({docId:d.id,...d.data()})); allVentes.sort((a,b)=>(b.created?.seconds||0)-(a.created?.seconds||0)); try{ const rSnap=await db.collection('resultats').orderBy('dateStr','desc').limit(100).get(); allResultats=[]; rSnap.forEach(d=>allResultats.push({id:d.id,...d.data()})); showLiveResult(); }catch(e){} }
function showLiveResult(){ const today=new Date().toISOString().slice(0,10); const live=allResultats.filter(r=>r.dateStr===today); if(!live.length){ document.getElementById('resultLive').innerHTML="M1=M2=M3=1000 | Dezòd 27x12=12x27 | 500/2=250"; return; } document.getElementById('resultLive').innerHTML=live.map(r=>`${r.tirage}: ${r.premier}-${r.deuxieme}-${r.troisieme} | M1:${r.maryaj1||r.M1} M2:${r.maryaj2||r.M2} M3:${r.maryaj3||r.M3}`).join('<br>'); }
function buildFicheTxt(v){ const tStr=(v.tirages||[]).join('/'); const idT=(v.idTicket||v.docId||'').toString().slice(-6).toUpperCase(); const now=new Date().toLocaleString('fr-HT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); return `${ENTETE.nom}\nDate ${now}\nTirage ${tStr}\nId ${idT} Vandè ${v.vendeur}\n--------------------------------\n${(v.lignes||[]).map(l=>` ${l.jeux.padEnd(7)} ${String(l.boul).toUpperCase().padEnd(10)} $${l.miz}`).join('\n')}\n--------------------------------\n Total: $${v.total}\n--------------------------------\n${ENTETE.footer}`; }
function printTicketOnly(text){ const win=window.open('', '_blank','width=420,height=900'); win.document.write(`<html><head><style>@page{size:80mm auto;margin:0;} html,body{margin:0;padding:0;display:flex;justify-content:center}.ticket{width:78mm;margin:0 auto;padding:6mm 3mm;font-family:Arial Black,Arial,sans-serif;font-size:22px;font-weight:900;line-height:1.65;text-align:center;white-space:pre-line;color:#000}</style></head><body><div class="ticket">${text}</div><script>window.onload=function(){setTimeout(()=>window.print(),400); setTimeout(()=>window.close(),1200);}<\/script></body></html>`); win.document.close(); }
function printRapportTicket(text){ const win=window.open('', '_blank','width=420,height=900'); win.document.write(`<html><head><style>@page{size:80mm auto;margin:0;} html,body{margin:0;padding:0;display:flex;justify-content:center}.ticket{width:78mm;margin:0 auto;padding:6mm 3mm;font-family:Arial Black,Arial,sans-serif;font-size:22px;font-weight:900;line-height:2;text-align:center;white-space:pre-line;color:#000}</style></head><body><div class="ticket">${text}</div><script>window.onload=function(){setTimeout(()=>window.print(),400);}<\/script></body></html>`); win.document.close(); }
function parseMaryajPair(str){ let parts=String(str||'').toLowerCase().split(/[^0-9]+/).filter(Boolean).map(x=>x.slice(-2)); if(parts.length<2){ let clean=String(str).replace(/[^0-9]/g,''); if(clean.length>=4) parts=[clean.slice(0,2), clean.slice(2,4)]; } if(parts.length>=2) return [parts[0].padStart(2,'0'), parts[1].padStart(2,'0')]; return null; }
function isSameMaryajDezod(a,b){ const pa=parseMaryajPair(a); const pb=parseMaryajPair(b); if(!pa||!pb) return false; return (pa[0]===pb[0] && pa[1]===pb[1]) || (pa[0]===pb[1] && pa[1]===pb[0]); }
function calculGain(ligne, res){ if(!res) return 0; const miz=parseFloat(ligne.miz)||0; if(!miz) return 0; const boul=String(ligne.boul).trim(); const premier=String(res.premier||'').replace(/[^0-9]/g,'').slice(-2); const deuxieme=String(res.deuxieme||'').replace(/[^0-9]/g,'').slice(-2); const troisieme=String(res.troisieme||'').replace(/[^0-9]/g,'').slice(-2); if(ligne.jeux==='BOLET'){ const b=boul.replace(/[^0-9]/g,'').slice(-2); if(premier&&b===premier) return miz*PRIX.BOLET_1ER; if(deuxieme&&b===deuxieme) return miz*PRIX.BOLET_2E; if(troisieme&&b===troisieme) return miz*PRIX.BOLET_3E; } if(ligne.jeux==='LOTO3'&&boul.replace(/[^0-9]/g,'')===String(res.loto3||'').replace(/[^0-9]/g,'')) return miz*PRIX.LOTO3; if(ligne.jeux==='LOTO4'&&boul.replace(/[^0-9]/g,'')===String(res.loto4||'').replace(/[^0-9]/g,'')) return miz*PRIX.LOTO4; if(ligne.jeux==='LOTO5'&&boul.replace(/[^0-9]/g,'')===String(res.loto5||'').replace(/[^0-9]/g,'')) return miz*PRIX.LOTO5; if(ligne.jeux==='MARYAJ'){ if(isSameMaryajDezod(boul,res.maryaj1||res.M1||'')) return miz*PRIX.M1; if(isSameMaryajDezod(boul,res.maryaj2||res.M2||'')) return miz*PRIX.M2; if(isSameMaryajDezod(boul,res.maryaj3||res.M3||'')) return miz*PRIX.M3; } return 0; }
async function genRapport(){ const du=document.getElementById('du').value, au=document.getElementById('au').value, tirFiltre=document.getElementById('rapTirage').value; if(!du||!au){alert("Du Au");return;} await fetchAll(); let vente=0,aPayer=0,fich=0, detaye={}; allVentes.forEach(v=>{ if(v.dateStr>=du && v.dateStr<=au){ const nbT=(v.tirages||[]).length||1; const venteParT=(Number(v.total)||0)/nbT; if(tirFiltre==='TOUS' || (v.tirages||[]).includes(tirFiltre)){ if(tirFiltre==='TOUS'){ vente+=Number(v.total)||0; } else { vente+=venteParT; } fich++; (v.tirages||[]).forEach(t=>{ if(tirFiltre!=='TOUS' && t!==tirFiltre) return; const res=allResultats.find(r=> r.dateStr===v.dateStr && r.tirage===t); if(res){ (v.lignes||[]).forEach(l=>{ aPayer+=calculGain(l,res); }); } detaye[t]=(detaye[t]||0)+venteParT; }); } } }); const commission=vente*0.10; let detayeTxt=""; if(tirFiltre==='TOUS'){ detayeTxt="\nDETAYE:\n"+Object.entries(detaye).map(([t,m])=>`${t}: $${m.toFixed(2)}`).join('\n'); } const txt=`${ENTETE.nom}\nRAPÒ V4.8\nDu ${du} Au ${au}\nTirage ${tirFiltre}\n------------------------\nVente $${vente.toFixed(2)}${detayeTxt}\nCommission $${commission.toFixed(2)}\nA payer $${aPayer.toFixed(2)}\nBalance net $${(vente-commission-aPayer).toFixed(2)}\n------------------------\nFich ${fich}\n500/2=250 OK`; document.getElementById('rapportRes').innerHTML=`<div class="rapBox">${txt}</div>`; document.getElementById('rapportRes').dataset.txt=txt; document.getElementById('btnPrintRap').style.display='block'; }
function printRapport(){ const txt=document.getElementById('rapportRes').dataset.txt; if(!txt)return; printRapportTicket(txt); }
async function validerEtImprimer(){ if(tiragesSel.size==0){alert("Chwazi tiraj");return;} const lignes=lignesData.filter(l=>l.boul&&l.miz); if(!lignes.length){alert("Antre boul+miz");return;} if(!checkLimiteGlobal()) return; const total=calcTotal(); const data={vendeur:current.nom,vendeurId:current.id,tirages:Array.from(tiragesSel),lignes:lignes.map(l=>({jeux:l.jeux,boul:String(l.boul).toUpperCase(),miz:l.miz})),total,dateStr:new Date().toISOString().slice(0,10),created:firebase.firestore.FieldValue.serverTimestamp(),idTicket:'CD-'+Date.now().toString().slice(-6)}; try{ const ref=await db.collection('ventes').add(data); printTicketOnly(buildFicheTxt({...data,docId:ref.id})); lignesData=[]; document.getElementById('lignes').innerHTML=""; addLigne(lastJeux); calcTotal(); await fetchAll(); await loadFermetureEtLimites(); }catch(e){alert(e.message)} }
function filtrerCopy(){ const q=document.getElementById('searchTicket').value.toLowerCase().trim(); if(!q){renderCopy(allVentes);return;} const f=allVentes.filter(v=> (v.idTicket||'').toLowerCase().includes(q) || (v.lignes||[]).some(l=>String(l.boul).toLowerCase().includes(q)) ); renderCopy(f); }
function renderCopy(list){ const el=document.getElementById('copyList'); if(!list.length){el.innerHTML="<p>Pa gen fich</p>";return;} el.innerHTML=list.slice(0,100).map(v=>`<div class="list"><b>🎫 ${v.idTicket||v.docId.slice(-6).toUpperCase()} - $${v.total} (${v.tirages.length} tiraj => $${(v.total/v.tirages.length).toFixed(2)}/tiraj)</b><br>${(v.lignes||[]).map(l=>l.jeux+' '+l.boul+' $'+l.miz).join(' | ')}<br><button class="btn" style="margin-top:8px;padding:10px;background:#00a000" onclick="copyTicket('${v.docId}')">📋 KOPYE</button></div>`).join('');}
function copyTicket(docId){ const v=allVentes.find(x=>x.docId===docId); if(!v)return; tiragesSel=new Set(v.tirages); document.querySelectorAll('.tir').forEach(t=>t.classList.toggle('sel',tiragesSel.has(t.innerText.trim()))); lignesData=[]; document.getElementById('lignes').innerHTML=""; v.lignes.forEach(l=>{ addLigne(l.jeux,false,l.boul,l.miz); }); calcTotal(); openTab(0); setTimeout(()=>addLigne(lastJeux),200); }
async function loadFiches(){ const today=new Date().toISOString().slice(0,10); const list=allVentes.filter(v=>v.dateStr===today); const el=document.getElementById('fichesList'); if(!list.length){el.innerHTML="<p>Pa gen fich</p>";return;} el.innerHTML=list.map(v=>`<div class="list"><b>${v.idTicket||v.docId.slice(-6).toUpperCase()} - $${v.total} / ${v.tirages.length} = $${(v.total/v.tirages.length).toFixed(2)} chak</b></div>`).join('');}
loadConfig();
