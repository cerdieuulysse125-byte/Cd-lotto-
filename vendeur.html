<!DOCTYPE html><html lang='ht'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no'><title>VANDEUR - CD-LOTTO</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f0f2f5}.header{background:#0d47a1;color:#fff;padding:10px 12px;display:flex;justify-content:space-between}.tabs{display:flex;background:#fff;border-bottom:2px solid #ddd;overflow-x:auto;position:sticky;top:0;z-index:10}.tab{padding:11px 12px;cursor:pointer;font-weight:700;color:#555;border-bottom:3px solid transparent;white-space:nowrap;font-size:11px}.tab.active{color:#0d47a1;border-bottom-color:#0d47a1;background:#e3f2fd}.panel{display:none;padding:8px;max-width:600px;margin:auto}.panel.active{display:block}.card{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);margin-bottom:8px}input,select{padding:10px;border:1px solid #ccc;border-radius:6px;width:100%;margin:4px 0;font-size:16px}input[type=number]{-moz-appearance:textfield}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}label{font-weight:700;font-size:11px}.btn{padding:10px 14px;border:0;border-radius:6px;color:#fff;font-weight:700;cursor:pointer;margin:2px}.btn-blue{background:#0d47a1}.btn-green{background:#2e7d32}.btn-red{background:#c62828}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bet-row{display:flex;gap:4px;align-items:center;margin-bottom:6px;background:#f8f9fa;padding:6px;border-radius:6px}.bet-row input{margin:0;font-size:15px}.bet-row select{width:90px;margin:0;font-size:12px;font-weight:700}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.key{padding:16px;text-align:center;background:#fff;border:1px solid #ddd;border-radius:8px;font-size:20px;font-weight:700;cursor:pointer}.key:active{background:#0d47a1;color:#fff}.key.func{background:#e3f2fd;color:#0d47a1;font-size:14px}.key.ok{background:#2e7d32;color:#fff}.arrow-keys{display:flex;gap:6px;margin-top:6px}.arrow{flex:1;padding:12px;text-align:center;background:#0d47a1;color:#fff;border-radius:6px;font-weight:700;cursor:pointer}.total-box{background:#0d47a1;color:#fff;padding:12px;border-radius:8px;text-align:center;margin-top:8px}.total-box b{font-size:22px}@media print{@page{size:58mm auto;margin:0}body{background:#fff;margin:0;padding:0}.header,.tabs,.panel:not(#printArea),.no-print{display:none!important}#printArea{display:block!important;position:absolute;left:50%;top:0;transform:translateX(-50%);width:58mm;margin:0;padding:2mm}.ticket{width:54mm;margin:0 auto;font-family:monospace;font-size:9px;line-height:1.2;color:#000}.ticket *{text-align:center}.ticket.left{text-align:left}.ticket.right{text-align:right}}.ticket-preview{width:280px;max-width:90%;margin:10px auto;background:#fff;border:1px dashed #999;padding:8px;font-family:monospace;font-size:10px}.printer-list{max-height:150px;overflow-y:auto;border:1px solid #ddd;border-radius:6px;padding:6px}
.boul-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}.boul{padding:8px 2px;text-align:center;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-weight:700;background:#fff;font-size:13px}.boul.blocked{background:#c62828;color:#fff}
</style></head><body>
<div class='header'><div><b id='vNom'>VANDEUR</b><br><small id='vSerial' style='font-size:10px'></small></div><div><button class='btn btn-red' style='padding:5px 10px;font-size:11px' onclick='logout()'>Soti</button></div></div>
<div id='loginBox' class='panel active' style='max-width:380px;margin-top:30px'><div class='card'><h3>🔐 Vandè</h3><input id='loginNom' placeholder='Non Vandè'><input id='loginPass' type='password' placeholder='Modpas'><button class='btn btn-blue' style='width:100%;margin-top:8px' onclick='login()'>Konekte</button></div></div>
<div id='mainBox' style='display:none'>
<div class='tabs'><div class='tab active' onclick="openTab(event,'vann')">Vann tikè</div><div class='tab' onclick="openTab(event,'kopye')">Kopye tikè</div><div class='tab' onclick="openTab(event,'fich')">Fich Mwen</div><div class='tab' onclick="openTab(event,'rapo')">Rapò</div><div class='tab' onclick="openTab(event,'param')">⚙️ Paramèt</div></div>
<div id='vann' class='panel active'>
<div class='card'><label>TIRAJ</label><select id='tirageSel'><option>GA midi</option><option>FL midi</option><option>NY midi</option><option>GA soir</option><option>FL soir</option><option>NY soir</option><option>Real</option><option>Primera día</option><option>Suerte día</option><option>Lote Dom</option><option>Ganamas</option><option>Suerte noche</option><option>Primera noche</option><option>Loteka</option><option>Nacional noche</option><option>Leidsa</option><option>Anguila 10h</option><option>Anguila 18h</option></select><div style='font-size:10px;color:#666' id='heureTiraj'></div></div>
<div class='card'>
<div style='display:flex;justify-content:space-between;align-items:center'><h4>Vann - Chif sèlman</h4><button class='btn btn-red' style='padding:4px 8px;font-size:11px' onclick='clearBets()'>Efase Tout</button></div>
<div id='betsList'></div>
<button class='btn btn-blue' style='width:100%;margin-top:6px' onclick='addBet()'>+ Ajoute Liy (conserve jwèt)</button>
<div class='arrow-keys no-print'><div class='arrow' onclick='moveFocus(1)'>➡️ Dwat</div><div class='arrow' onclick='moveFocusNextLine()'>⬇️ Liy Anba</div><div class='arrow' onclick='moveFocus(-1)'>⬅️ Goch</div></div>
<div class='keypad no-print'>
<div class='key' onclick='pressKey("1")'>1</div><div class='key' onclick='pressKey("2")'>2</div><div class='key' onclick='pressKey("3")'>3</div>
<div class='key' onclick='pressKey("4")'>4</div><div class='key' onclick='pressKey("5")'>5</div><div class='key' onclick='pressKey("6")'>6</div>
<div class='key' onclick='pressKey("7")'>7</div><div class='key' onclick='pressKey("8")'>8</div><div class='key' onclick='pressKey("9")'>9</div>
<div class='key func' onclick='pressKey("clear")'>C</div><div class='key' onclick='pressKey("0")'>0</div><div class='key ok' onclick='moveFocusNextLine()'>OK ⬇️</div>
</div><div style='background:#0e7a3c;color:#fff;padding:14px;border-radius:12px;text-align:center;margin-top:10px;font-weight:700;font-size:18px;border:2px solid #000' id='totalBox2'>Total <span id='totalCalc'>0 × 1 = 0</span> HTG</div>
<button class='btn' style='width:100%;padding:16px;font-size:18px;margin-top:10px;background:#000;color:#fff;border-radius:12px;border:2px solid #000' onclick='vannMitan()'>🖨️ IMPRIMER - MITAN PAJ GWO LÈT</button>
<button class='btn' style='width:100%;padding:16px;font-size:16px;margin-top:10px;background:#1e88e5;color:#fff;border-radius:12px;border:2px solid #000' onclick='printRawBT()'>⚡ PRINT DIRÈK V2 PRO 58mm (RawBT)</button>
</div>
</div>
<div id='kopye' class='panel'><div class='card'><h3>📋 Kopye Tikè</h3><input id='copyId' type='number' inputmode='numeric' placeholder='ID Tikè'><button class='btn btn-blue' style='width:100%' onclick='copyTicket()'>Chache & Kopye</button><div id='copyResult'></div></div></div>
<div id='fich' class='panel'><div class='card'><h3>📄 Fich Mwen Jodi a</h3><input type='date' id='fDate'><button class='btn btn-blue' onclick='renderFich()'>Filtre</button><div id='fichList'></div></div></div>
<div id='rapo' class='panel'><div class='card'><h3>📊 Rapò</h3><div class='grid2'><div><label>Soti</label><input type='date' id='rFrom'></div><div><label>Rive</label><input type='date' id='rTo'></div></div><button class='btn btn-green' onclick='calcRapo()'>Kalkile</button><div id='rapoResult'></div></div></div>
<div id='param' class='panel'><div class='card'><h3>🖨️ Ajoute Enprimant - Chache Tout</h3><button class='btn btn-blue' style='width:100%' onclick='searchPrinters()'>🔍 Chache Enprimant</button><div class='printer-list' id='printerList'><p style='font-size:11px'>Klike Chache</p></div><div style='margin-top:10px'><label>Chwazi</label><input id='selectedPrinter' readonly><select id='paperWidth'><option value='58'>58mm Thermik - Santre</option><option value='80'>80mm</option><option value='A4'>A4</option></select><button class='btn btn-green' style='width:100%;margin-top:6px' onclick='savePrinter()'>Save</button></div><button class='btn btn-orange' style='width:100%;margin-top:10px' onclick='testPrint()'>🧾 Teste - Mitan Paj</button></div></div>
</div>
<div id='printArea' style='display:none'><div class='ticket' id='ticketPrint'></div></div>
<script>
var DB;try{DB=JSON.parse(localStorage.getItem('cd-lotto-db')||'null')}catch(e){DB=null}
if(!DB)DB={proprios:[],vendeurs:[],results:[],tickets:[],msgs:[],limites:{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}},prix:{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000}},heures:{},headers:{},logos:{},commissions:{},blockedBouls:{},blockedJeux:{},printers:{}};
function saveDB(){localStorage.setItem('cd-lotto-db',JSON.stringify(DB))}
function openTab(e,id){var t=document.querySelectorAll('.tab');for(var i=0;i<t.length;i++)t[i].classList.remove('active');var p=document.querySelectorAll('.panel');for(var j=0;j<p.length;j++)p[j].classList.remove('active');e.target.classList.add('active');document.getElementById(id).classList.add('active')}
var CUR=null;var bets=[];var currentGame='borlette';var focusedIdx=0;fDate.valueAsDate=new Date();rFrom.valueAsDate=new Date();rTo.valueAsDate=new Date();
function login(){var n=loginNom.value.trim(),pa=loginPass.value.trim(),v=null;for(var i=0;i<DB.vendeurs.length;i++)if(DB.vendeurs[i].nom.toLowerCase()==n.toLowerCase()&&DB.vendeurs[i].pass==pa)v=DB.vendeurs[i];if(!v){alert('Pa bon');return}CUR=v;loginBox.style.display='none';mainBox.style.display='block';vNom.innerText=v.nom;vSerial.innerText='Serial: '+v.serial;addBet();refreshHeure();renderFich()}
function logout(){location.reload()}function refreshHeure(){var t=tirageSel.value;var h=DB.heures[t]||'';heureTiraj.innerText=h?'Fèmeti: '+h:''}tirageSel.addEventListener('change',refreshHeure);
function addBet(game){if(game)currentGame=game;else if(bets.length>0)currentGame=bets[bets.length-1].type;else currentGame='borlette';bets.push({type:currentGame,num:'',mise:''});renderBets();focusBet(bets.length-1,'num')}
function clearBets(){if(confirm('Efase?')){bets=[];addBet(currentGame)}}function renderBets(){var html='';for(var i=0;i<bets.length;i++){var b=bets[i];html+='<div class="bet-row" id="row_'+i+'"><select onchange="changeGame('+i+',this.value)"><option value="borlette" '+(b.type=='borlette'?'selected':'')+'>BORL</option><option value="mariage" '+(b.type=='mariage'?'selected':'')+'>MAR</option><option value="loto3" '+(b.type=='loto3'?'selected':'')+'>L3</option><option value="loto4" '+(b.type=='loto4'?'selected':'')+'>L4</option><option value="loto5" '+(b.type=='loto5'?'selected':'')+'>L5</option></select><input id="num_'+i+'" type="text" inputmode="numeric" pattern="[0-9-]*" placeholder="Boul" value="'+b.num+'" oninput="updateBet('+i+',\'num\',this.value);onlyNumbers(this)" onfocus="focusedIdx='+i+';this.select()" onkeydown="handleArrow(event,'+i+',\'num\')"><input id="mise_'+i+'" type="text" inputmode="numeric" placeholder="$" value="'+b.mise+'" oninput="updateBet('+i+',\'mise\',this.value);onlyNumbers(this)" onfocus="focusedIdx='+i+'" onkeydown="handleArrow(event,'+i+',\'mise\')" style="width:70px"><button onclick="removeBet('+i+')" style="background:#c62828;color:#fff;border:0;padding:6px 8px;border-radius:4px">X</button></div>'}betsList.innerHTML=html;calcTotal()}
function changeGame(i,val){bets[i].type=val;currentGame=val;calcTotal()}function updateBet(i,f,v){bets[i][f]=v;calcTotal()}function removeBet(i){bets.splice(i,1);if(bets.length==0)addBet(currentGame);else renderBets()}function focusBet(i,f){setTimeout(function(){var el=document.getElementById(f+'_'+i);if(el){el.focus();el.select();focusedIdx=i}},50)}function moveFocus(dir){var curField=document.activeElement.id.includes('num')?'num':'mise';var curIdx=focusedIdx;var curPos=curIdx*2+(curField=='mise'?1:0);var nextPos=curPos+dir;if(nextPos<0)nextPos=0;if(nextPos>=bets.length*2)nextPos=bets.length*2-1;var nextIdx=Math.floor(nextPos/2);var nextField=nextPos%2==0?'num':'mise';focusBet(nextIdx,nextField)}function moveFocusNextLine(){if(focusedIdx<bets.length-1){focusBet(focusedIdx+1,'num')}else{addBet();}}function handleArrow(e,i,f){if(e.key=='ArrowRight'){e.preventDefault();if(f=='num'){focusBet(i,'mise')}else{if(i<bets.length-1)focusBet(i+1,'num');else addBet()}}if(e.key=='ArrowLeft'){e.preventDefault();if(f=='mise'){focusBet(i,'num')}else if(i>0)focusBet(i-1,'mise')}if(e.key=='ArrowDown'){e.preventDefault();moveFocusNextLine()}if(e.key=='ArrowUp'){e.preventDefault();if(i>0)focusBet(i-1,f)}if(e.key=='Enter'){e.preventDefault();moveFocusNextLine()}}function onlyNumbers(el){el.value=el.value.replace(/[^0-9-]/g,'')}function pressKey(k){var active=document.activeElement;if(!active||(!active.id.startsWith('num_')&&!active.id.startsWith('mise_'))){if(bets.length>0)active=document.getElementById('num_'+(bets.length-1));else return}if(k=='clear'){active.value='';var m=active.id.split('_');updateBet(parseInt(m[1]),m[0].includes('num')?'num':'mise','');return}var start=active.selectionStart;var end=active.selectionEnd;active.value=active.value.substring(0,start)+k+active.value.substring(end);active.selectionStart=active.selectionEnd=start+1;var parts=active.id.split('_');updateBet(parseInt(parts[1]),parts[0].includes('num')?'num':'mise',active.value)}function calcTotal(){var tot=0;for(var i=0;i<bets.length;i++)tot+=parseInt(bets[i].mise)||0;var el=document.getElementById('totalCalc');if(el)el.innerText=tot+' × 1 = '+tot;}
function buildTicketMitan(t){return '<div style="width:58mm;margin:0 auto;text-align:center;font-family:monospace;font-weight:700;font-size:14px;line-height:1.4;color:#000"><div style="font-size:20px">CD-LOTTO</div>'+(DB.headers[CUR.proprioId]?.nom||'')+'<br>Tiraj: <b>'+t.tirage+'</b><br>Vandè: '+CUR.nom+'<br>------------------------------<br>'+t.bets.map(b=>'<div style="display:flex;justify-content:space-between;font-size:16px"><span>'+b.type.toUpperCase()+' '+b.num+'</span><span>$'+b.mise+'</span></div>').join('')+'<br>------------------------------<br><div style="font-size:22px">TOTAL: $'+t.total+' HTG</div><br>ID:'+t.id+'<br>'+new Date().toLocaleString()+'</div>'}
function vannMitan(){var tot=0;for(var i=0;i<bets.length;i++)tot+=parseInt(bets[i].mise)||0;if(tot==0){alert('Pa gen mise');return}var id=Date.now().toString().slice(-6);var ticket={id:id,vendeurId:CUR.id,proprioId:CUR.proprioId,tirage:tirageSel.value,bets:JSON.parse(JSON.stringify(bets)),total:tot,date:new Date().toISOString().slice(0,10),annule:false};if(!DB.tickets)DB.tickets=[];DB.tickets.push(ticket);saveDB();document.getElementById('ticketPrint').innerHTML=buildTicketMitan(ticket);document.getElementById('printArea').style.display='block';setTimeout(function(){window.print();document.getElementById('printArea').style.display='none'},300);bets=[];addBet(currentGame);}
function printRawBT(){var tot=0;for(var i=0;i<bets.length;i++)tot+=parseInt(bets[i].mise)||0;if(tot==0){alert('Pa gen mise');return}var id=Date.now().toString().slice(-6);var ticket={id:id,vendeurId:CUR.id,proprioId:CUR.proprioId,tirage:tirageSel.value,bets:JSON.parse(JSON.stringify(bets)),total:tot,date:new Date().toISOString().slice(0,10),annule:false};if(!DB.tickets)DB.tickets=[];DB.tickets.push(ticket);saveDB();var txt='';txt+='CD-LOTTO\n';txt+=(DB.headers[CUR.proprioId]?.nom||'LOTTO')+'\n';txt+='Tiraj: '+ticket.tirage+'\n';txt+='Vandè: '+CUR.nom+' | ID:'+id+'\n';txt+='------------------------------\n';for(var i=0;i<ticket.bets.length;i++){txt+=ticket.bets[i].type.toUpperCase()+' '+ticket.bets[i].num+' $'+ticket.bets[i].mise+'\n';}txt+='------------------------------\n';txt+='TOTAL: $'+tot+' HTG\n\nID:'+id+' '+new Date().toLocaleString()+'\n\n\n';var scheme='rawbt:print?text='+encodeURIComponent(txt);try{window.location.href=scheme;}catch(e){}navigator.clipboard.writeText(txt).then(function(){alert('Kopye pou RawBT! Ticket '+id);});bets=[];addBet(currentGame);}
function copyTicket(){var id=copyId.value.trim();if(!id){alert('ID');return}var t=null;for(var i=0;i<DB.tickets.length;i++)if(DB.tickets[i].id==id)t=DB.tickets[i];if(!t){copyResult.innerHTML='Pa jwenn';return}bets=JSON.parse(JSON.stringify(t.bets));tirageSel.value=t.tirage;renderBets();document.querySelectorAll('.tab')[0].click();}
function renderFich(){if(!CUR)return;var date=fDate.value;var tix=[];for(var i=0;i<DB.tickets.length;i++)if(DB.tickets[i].vendeurId==CUR.id)tix.push(DB.tickets[i]);if(date){var ft=[];for(var i=0;i<tix.length;i++)if(tix[i].date==date)ft.push(tix[i]);tix=ft}var html='';for(var i=tix.length-1;i>=0;i--){var t=tix[i];html+='<div class=card><b>ID '+t.id+'</b> - '+t.tirage+' - $'+t.total+'<br><small>'+t.bets.map(b=>b.type+' '+b.num).join(' | ')+'</small></div>'}fichList.innerHTML=html||'Pa gen';}
function calcRapo(){var from=rFrom.value,to=rTo.value,tix=[];for(var i=0;i<DB.tickets.length;i++)if(DB.tickets[i].vendeurId==CUR.id&&!DB.tickets[i].annule)tix.push(DB.tickets[i]);if(from){var ft=[];for(var i=0;i<tix.length;i++)if(tix[i].date>=from)ft.push(tix[i]);tix=ft}if(to){var ft=[];for(var i=0;i<tix.length;i++)if(tix[i].date<=to)ft.push(tix[i]);tix=ft}var tot=0;for(var i=0;i<tix.length;i++)tot+=tix[i].total;rapoResult.innerHTML='<div class=card style=text-align:center><div>Vant</div><b>$'+tot+'</b><div>'+tix.length+' tikè</div></div>';}
function searchPrinters(){var list=document.getElementById('printerList');list.innerHTML='🔍 Ap chache...';setTimeout(function(){list.innerHTML='<div style=padding:6px;background:#e3f2fd;border-bottom:1px solid #ddd;cursor:pointer' onclick=selectPrinter("58mm Thermik Bluetooth")><b>🖨️ 58mm Thermik Bluetooth</b><br><small>Santre - Rekòmande</small></div><div style=padding:6px;border-bottom:1px solid #ddd;cursor:pointer onclick=selectPrinter("80mm")><b>🖨️ 80mm</b></div><div style=padding:6px;cursor:pointer onclick=selectPrinter("PDF")><b>📄 PDF / A4</b></div>';},600)}
function selectPrinter(n){selectedPrinter.value=n;printerList.innerHTML='<p style=color:green>✅ '+n+'</p>'}function savePrinter(){var n=selectedPrinter.value;var w=paperWidth.value;if(!n){alert('Chwazi');return}if(!DB.printers)DB.printers={};DB.printers[CUR.id]={name:n,width:w};saveDB();alert('Save: '+n);}function testPrint(){var fake={id:'TEST',tirage:tirageSel.value,bets:[{type:'borlette',num:'00',mise:'25'}],total:25};document.getElementById('ticketPrint').innerHTML=buildTicketMitan(fake);document.getElementById('printArea').style.display='block';window.print();document.getElementById('printArea').style.display='none';}
</script></body></html>
