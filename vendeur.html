<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VÉRITÉ LOTTO</title>
<style>
  *{box-sizing:border-box;font-family: Arial, sans-serif;}
  body{margin:0;background:white;padding:8px}
 .header{font-weight:900;font-size:22px;padding:10px 0}
 .yellow-bar{background:#FFD500;text-align:center;padding:8px;font-weight:900;border:2px solid black}
 .black-bar{background:black;color:#FFD500;text-align:center;padding:6px;font-weight:900}
 .tiraj-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
 .btn-tiraj{border:2px solid black;border-radius:30px;padding:12px 0;font-weight:900;background:white}
 .btn-tiraj.active{background:#FFD500}
 .limit-bar{background:#FFD500;border:2px solid red;border-radius:30px;padding:8px;text-align:center;font-weight:900;font-size:12px;color:black;margin-bottom:10px}
 .center-tiraj{border:2px solid black;border-radius:30px;padding:10px;text-align:center;font-weight:900;margin-bottom:10px}
 .line{display:flex;gap:6px;margin-bottom:8px;align-items:center}
  select, input{border:2px solid black;border-radius:30px;padding:12px 5px;font-weight:900;text-align:center;flex:1}
  input.miz{background:#FFD500}
 .btn-x{border:2px solid red;color:red;background:white;border-radius:30px;width:50px;height:48px;font-weight:900}
 .btn-down{background:#FFD500;border:2px solid black;border-radius:30px;width:50px;height:48px;font-weight:900}
 .total{border:2px solid black;border-radius:30px;padding:12px;text-align:center;font-weight:900;margin:10px 0}
 .actions{display:flex;gap:8px}
 .btn-valider{flex:1;background:black;color:#FFD500;border-radius:30px;padding:16px;font-weight:900;border:2px solid black}
 .btn-print{flex:1;background:#0A8A00;color:#FFD500;border-radius:30px;padding:10px;font-weight:900;border:2px solid black}
</style>
</head>
<body>

<div class="header">VÉRITÉ LOTTO</div>
<div class="yellow-bar">VENDEUR - JEAN - V7.9 FIX BOUL + LIMITE</div>
<div class="black-bar">2026-08-18 | JEAN | 10%</div>

<div style="display:flex;gap:2px;margin:8px 0">
  <div class="yellow-bar" style="flex:1">1.VENTE</div>
  <div style="flex:1;text-align:center;border:2px solid black;padding:8px;font-weight:900">2.KOPYE</div>
  <div style="flex:1;text-align:center;border:2px solid black;padding:8px;font-weight:900">3.FICHES</div>
  <div style="flex:1;text-align:center;border:2px solid black;padding:8px;font-weight:900">4.RAPPORT</div>
</div>

<div class="limit-bar">Limite Global Vandè1+Vandè2+... Respekte - Bòlèt 1500 Maryaj 100 L3 100 L4 20 L5 5</div>

<div class="tiraj-grid">
  <button class="btn-tiraj active" onclick="setTiraj(this)">GA MIDI ✓</button>
  <button class="btn-tiraj" onclick="setTiraj(this)">FL MIDI</button>
  <button class="btn-tiraj" onclick="setTiraj(this)">NY MIDI</button>
  <button class="btn-tiraj" onclick="setTiraj(this)">GA SOIR</button>
  <button class="btn-tiraj" onclick="setTiraj(this)">FL SOIR</button>
  <button class="btn-tiraj" onclick="setTiraj(this)">NY SOIR</button>
</div>

<div id="tirajSelect" class="center-tiraj">GA MIDI ✓</div>

<div id="container">
  <!-- Liy yo ap ajoute isit la -->
</div>

<div id="total" class="total">Total ×tiraj - $0 × 1 = $0 - Flèche ↓ kenbe je</div>

<div class="actions">
  <button class="btn-valider" onclick="valider()">💾 VALIDER</button>
  <button class="btn-print" onclick="valider()">🖨️ VALIDER + IMPRIMER SANTRÉ</button>
</div>

<script>
let tirajActif = "GA MIDI";
let lignes = [
  {type:"MARYAJ", boul:"", miz:""},
  {type:"MARYAJ", boul:"", miz:""}
];

function setTiraj(btn){
  document.querySelectorAll('.btn-tiraj').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  tirajActif = btn.innerText.replace(' ✓','');
  document.getElementById('tirajSelect').innerText = tirajActif + ' ✓';
  calculTotal();
}

function render(){
  const cont = document.getElementById('container');
  cont.innerHTML = "";
  lignes.forEach((l, i)=>{
    cont.innerHTML += `
      <div class="line">
        <select onchange="changeType(${i}, this.value)">
          <option ${l.type=="MARYAJ"?"selected":""}>MARYAJ</option>
          <option ${l.type=="LOTO3"?"selected":""}>LOTO3</option>
          <option ${l.type=="LOTO4"?"selected":""}>LOTO4</option>
          <option ${l.type=="LOTO5"?"selected":""}>LOTO5</option>
          <option ${l.type=="BOLET"?"selected":""}>BOLET</option>
        </select>
        <input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Boul" value="${l.boul}" oninput="changeBoul(${i}, this.value)">
        <input type="text" inputmode="numeric" pattern="[0-9]*" class="miz" placeholder="Miz" value="${l.miz}" oninput="changeMiz(${i}, this.value)">
        <button class="btn-x" onclick="supprimer(${i})">X</button>
        <button class="btn-down" onclick="ajouteLigne(${i})">↓</button>
      </div>
    `;
  });
  calculTotal();
}

function changeType(i, val){ lignes[i].type = val; }
function changeBoul(i, val){
  // CHIF SÈLMAN
  lignes[i].boul = val.replace(/[^0-9]/g,"");
  render(); document.querySelectorAll('input')[i*2].focus();
}
function changeMiz(i, val){
  lignes[i].miz = val.replace(/[^0-9]/g,"");
  calculTotal();
}
function supprimer(i){
  if(lignes.length>1){ lignes.splice(i,1); render(); }
}
function ajouteLigne(i){
  // KENBE MENM JE A
  const typeKounya = lignes[i].type;
  lignes.splice(i+1, 0, {type:typeKounya, boul:"", miz:""});
  render();
}
function calculTotal(){
  const valides = lignes.filter(f=>f.boul!=="" && f.miz!=="");
  const total = valides.reduce((s,f)=>s+ (parseInt(f.miz)||0),0);
  document.getElementById('total').innerText = `Total ×tiraj - $${total} × 1 = $${total} - Flèche ↓ kenbe je`;
}
function valider(){
  // FIX: IGNORE LIY VID YO
  const valides = lignes.filter(f=>f.boul.trim()!=="" && f.miz.trim()!=="");

  if(valides.length===0){
    alert("Antre boul svp");
    return;
  }
  alert(valides.length + " fich valide! Total: $" + valides.reduce((s,f)=>s+parseInt(f.miz),0));
  console.log(valides);
}

// Premye afichaj
render();
</script>

</body>
</html>
