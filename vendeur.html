<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VANDÈ 4 ONGLÈ - C&D VERITE</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#fff}
.y1{background:#FFD500;text-align:center;padding:10px;font-weight:900;border-bottom:2px solid #000}
.y2{background:#000;color:#FFD500;text-align:center;padding:7px;font-weight:900}
.menu{display:flex;border:2px solid #000;border-top:none}.menu button{flex:1;padding:11px 0;font-weight:900;background:#fff;border:none;border-right:2px solid #000;font-size:11px}.menu button.active{background:#FFD500}
.banner{margin:8px;border:3px solid red;background:#FFD500;border-radius:14px;padding:7px;text-align:center;font-weight:900;font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px}.grid button{border:2px solid #000;border-radius:30px;padding:12px 0;font-weight:900;background:#fff}.grid button.active{background:#FFD500}
.sel{margin:8px;border:2px solid #000;border-radius:30px;padding:11px;text-align:center;font-weight:900}
.ligne{display:flex;gap:4px;padding:0 8px;margin-bottom:7px}.kaz{flex:1;border:2px solid #000;border-radius:30px;height:44px;text-align:center;font-weight:900}.kaz-miz{background:#FFD500!important}
.bx{border:2px solid red;color:red;background:#fff;border-radius:12px;width:42px;height:44px;font-weight:900}.bd{border:2px solid #000;background:#FFD500;border-radius:12px;width:42px;height:44px;font-weight:900}
.total{margin:8px;border:2px solid #000;border-radius:30px;padding:11px;text-align:center;font-weight:900}
.btns{display:flex;gap:6px;padding:8px}.btn{flex:1;padding:13px;border-radius:30px;font-weight:900;border:2px solid #000}.black{background:#000;color:#FFD500}.green{background:#0B8A0B;color:#fff}
.onglet{display:none}.onglet.active{display:block}
.kf{width:calc(100% - 16px);margin:8px;border:2px solid #000;border-radius:30px;padding:11px;text-align:center;font-weight:900}
.box{margin:8px;border:2px solid #000;border-radius:12px;padding:10px;background:#FFF8DC;font-weight:900;font-size:12px}
.fiche{margin:8px;border:1px solid #000;border-radius:10px;padding:8px;font-size:12px;background:#fff}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;text-align:center;font-size:28px;font-weight:900;line-height:1.8;font-family:monospace}}
</style>
</head>
<body>
<div class="y1">VENDEUR - JEAN - V7.9 FIX BOUL + LIMITE</div>
<div class="y2" id="dateBar"></div>
<div class="menu"><button class="active" id="m1" onclick="openO(1)">1.VENTE</button><button id="m2" onclick="openO(2)">2.KOPYE</button><button id="m3" onclick="openO(3)">3.FICHES</button><button id="m4" onclick="openO(4)">4.RAPPORT</button></div>

<div id="o1" class="onglet active">
<div class="banner">Limite Global Vandè1+Vandè2+... = Limite Global - Bòlèt 1500 Maryaj 100 L3 100 L4 20 L5 5 - Maryaj Lòd/Dezòd 12x47=47x12 Bon</div>
<div class="grid" id="grid"></div><div class="sel" id="sel"></div>
<div id="container"></div>
<div class="total" id="total"></div>
<div class="btns"><button class="btn black" onclick="valider(false)">VALIDER</button><button class="btn green" onclick="valider(true)">🖨️ VALIDER + IMPRIMER SANTRÉ GRAN LÈT V2 PRO</button></div>
</div>

<div id="o2" class="onglet"><div class="box">COPIER - Mete Id ticket a pou kopye</div><input id="idT" class="kf" placeholder="ID Ticket ex: T-123456"><button class="btn black" style="width:calc(100% - 16px);margin:8px" onclick="copier()">KOPIYE</button><div id="resC"></div></div>

<div id="o3" class="onglet"><input type="date" id="dateF" class="kf"><input id="searchF" class="kf" placeholder="Recherche fiches..." oninput="renderF()"><div id="listF"></div></div>

<div id="o4" class="onglet">
<div class="box">RAPPORT - Du Au Tirage</div>
Du <input type="date" id="du" class="kf"> Au <input type="date" id="au" class="kf">
<select id="filT" class="kf"><option value="TOUS">Tirage - Tous</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select>
<button onclick="jenereR()" style="width:calc(100% - 16px);margin:8px;padding:14px;border-radius:30px;background:#FFD500;border:2px solid #000;font-weight:900">📊 JENERE RAPÒ</button>
<div id="rapV" class="box" style="background:#fff"></div>
<button class="btn black" style="width:calc(100% - 16px);margin:8px" onclick="printR()">🖨️ IMPRIMER</button>
</div>

<div id="printArea" style="display:none"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = { apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4", authDomain:"cd-lotto.firebaseapp.com", databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com", projectId:"cd-lotto", storageBucket:"cd-lotto.firebasestorage.app", messagingSenderId:"671091732195", appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6" };
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
let tirajChwazi=["FL MIDI"]; let lignes=[{type:"MARYAJ",boul:"",miz:""}];
const tirajList=["GA MIDI","FL MIDI","NY MIDI","GA SOIR","FL SOIR","NY SOIR"];
let prix={lot1:50,lot2:20,lot3:10,maryaj:1000,loto3:500,loto4:5000,loto5:25000};
function norm(b){ if(!b)return""; b=b.trim().replace(/[^0-9x]/gi,''); if(!b.includes('x')&&b.length==4) b=b.slice(0,2)+'x'+b.slice(2); const p=b.toLowerCase().split('x'); if(p.length==2) return [p[0],p[1]].sort().join('x'); return b; }
window.openO=function(n){ document.querySelectorAll('.onglet').forEach(o=>o.classList.remove('active')); document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active')); document.getElementById('o'+n).classList.add('active'); document.getElementById('m'+n).classList.add('active'); if(n==3)renderF(); }
function renderT(){ const g=document.getElementById('grid'); g.innerHTML=""; tirajList.forEach(t=>{ const a=tirajChwazi.includes(t); g.innerHTML+=`<button class="${a?'active':''}" onclick="toggleT('${t}')">${t} ${a?'✓':''}</button>`}); document.getElementById('sel').innerText=tirajChwazi.join(' / ')+' ✓'; }
window.toggleT=function(t){ if(tirajChwazi.includes(t)){ if(tirajChwazi.length>1) tirajChwazi=tirajChwazi.filter(x=>x!==t);} else tirajChwazi.push(t); renderT(); calc(); }
window.renderV=function(){ const c=document.getElementById('container'); c.innerHTML=""; lignes.forEach((l,i)=>{ c.innerHTML+=`<div class="ligne"><select class="kaz" onchange="lignes[${i}].type=this.value"><option ${l.type=="MARYAJ"?"selected":""}>MARYAJ</option><option ${l.type=="BOLET"?"selected":""}>BOLET</option><option ${l.type=="LOTO3"?"selected":""}>LOTO3</option><option ${l.type=="LOTO4"?"selected":""}>LOTO4</option><option ${l.type=="LOTO5"?"selected":""}>LOTO5</option></select><input class="kaz" placeholder="Boul" value="${l.boul}" oninput="lignes[${i}].boul=this.value;calc()" inputmode="numeric"><input class="kaz kaz-miz" placeholder="Mise" value="${l.miz}" oninput="this.value=this.value.replace(/[^0-9]/g,'');lignes[${i}].miz=this.value;calc()" inputmode="numeric"><button class="bx" onclick="supp(${i})">X</button><button class="bd" onclick="down(${i})">↓</button></div>`}); }
window.supp=function(i){ lignes.splice(i,1); if(lignes.length==0) lignes=[{type:"MARYAJ",boul:"",miz:""}]; renderV(); calc(); }
window.down=function(i){ const jeu=lignes[i].type; lignes.splice(i+1,0,{type:jeu,boul:"",miz:""}); renderV(); calc(); setTimeout(()=>{ document.querySelectorAll('.ligne')[i+1]?.querySelectorAll('input')[0]?.focus(); },80); }
window.calc=function(){ const v=lignes.filter(f=>f.boul.trim()!=""&&f.miz.trim()!=""); const base=v.reduce((s,f)=>s+(parseInt(f.miz)||0),0); document.getElementById('total').innerText=`Total × tiraj sélectionné - $${base} × ${tirajChwazi.length} = $${base*tirajChwazi.length} - Flèche ↓ kenbe je - Chif sèlman`; }
window.valider=async function(doPrint){
  const valides=lignes.filter(f=>f.boul.trim()!=""&&f.miz.trim()!="").map(f=>({...f,boul:f.type=="MARYAJ"?norm(f.boul):f.boul}));
  if(valides.length==0) return; const dateStr=new Date().toISOString().slice(0,10); const id="T-"+Date.now().toString().slice(-6);
  const tot=valides.reduce((s,f)=>s+(parseInt(f.miz)||0),0)*tirajChwazi.length;
  const snap=await get(ref(db,`ventes/${dateStr}`)); let g={BOLET:0,MARYAJ:0,LOTO3:0,LOTO4:0,LOTO5:0}; if(snap.exists()){ Object.values(snap.val()).forEach(vs=>Object.values(vs).forEach(fc=>fc.fiches.forEach(x=>{g[x.type]=(g[x.type]||0)+parseInt(x.miz);}))) }
  const lim={BOLET:15000,MARYAJ:100,LOTO3:100,LOTO4:20,LOTO5:5}; for(let f of valides){ if((g[f.type]||0)+parseInt(f.miz)>lim[f.type]){alert(`LIMITE GLOBAL ${f.type} DEPASE`); return; } }
  await push(ref(db,`ventes/${dateStr}/JEAN`),{id,tiraj:tirajChwazi,fiches:valides,total:tot,date:dateStr,timestamp:Date.now(),vendeur:"JEAN",prix});
  const printHTML=`C&D VÉRITÉ LOTTO<br>Date ${dateStr} ${new Date().toLocaleTimeString()}<br>Tirages ${tirajChwazi.join('/')} <br>Responsable JEAN<br>----------------<br>${valides.map(f=>`${f.type} ${f.boul} $${f.miz}`).join('<br>')}<br>----------------<br>TOTAL $${tot}<br><br>Bòn chans, lave chodyè w`;
  document.getElementById('printArea').innerHTML=printHTML;
  if(doPrint){ document.getElementById('printArea').style.display='block'; window.print(); document.getElementById('printArea').style.display='none'; }
  lignes=[{type:lignes[lignes.length-1].type,boul:"",miz:""}]; renderV(); calc();
}
window.copier=async function(){ const id=document.getElementById('idT').value.trim(); if(!id)return; const snap=await get(ref(db,`ventes`)); let found=null; snap.forEach(d=>{d.forEach(v=>{Object.values(v.val()).forEach(f=>{if(f.id==id) found=f;})})}); if(found){ lignes=found.fiches.map(x=>({...x})); tirajChwazi=found.tiraj; openO(1); renderT(); renderV(); calc(); document.getElementById('resC').innerText="✅ Kopye "+found.id; } else document.getElementById('resC').innerText="❌ Pa jwenn"; }
window.renderF=async function(){ const dateFil=document.getElementById('dateF').value||new Date().toISOString().slice(0,10); const s=document.getElementById('searchF').value.toLowerCase(); const snap=await get(ref(db,`ventes/${dateFil}/JEAN`)); const cont=document.getElementById('listF'); cont.innerHTML=""; if(!snap.exists()){cont.innerHTML="Pa gen fich";return;} Object.values(snap.val()).filter(f=>JSON.stringify(f).toLowerCase().includes(s)).forEach(f=>{cont.innerHTML+=`<div class="fiche"><b>${f.id}</b> - ${f.tiraj.join('+')} - $${f.total}<br>${f.fiches.map(x=>x.type+' '+x.boul+' $'+x.miz).join('<br>')}</div>`}); }
window.jenereR=async function(){ const du=document.getElementById('du').value||new Date().toISOString().slice(0,10); const au=document.getElementById('au').value||du; const fil=document.getElementById('filT').value; const snap=await get(ref(db,`ventes/${du}`)); let vente=0, cnt=0; if(snap.exists()&&snap.child('JEAN').exists()){ Object.values(snap.val().JEAN).forEach(f=>{ const tirajMatch=fil=="TOUS"||f.tiraj.includes(fil); if(tirajMatch){ vente+=f.total; cnt++; } }); } const comm=vente*0.1; document.getElementById('rapV').innerHTML=`Du ${du} Au ${au}<br>Tirage ${fil}<br>Vente $${vente}<br>Commission $${comm}<br>Gain $0 (ap kalkile ak rezilta)<br><b>Balance Net $${vente-comm}</b><br>Fiches ${cnt}<br><br>Si nan yon fich gen plizyè tiraj, chak tiraj kalkile separeman selon rezilta yo`; }
window.printR=function(){ document.getElementById('printArea').innerHTML=document.getElementById('rapV').innerHTML; document.getElementById('printArea').style.display='block'; window.print(); document.getElementById('printArea').style.display='none'; }
document.getElementById('dateBar').innerText=new Date().toISOString().slice(0,10)+" | JEAN | 10%"; renderT(); renderV(); calc();
</script>
</body>
</html>
