<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANDE V115.7 - RAPO PA TIRAJ + MARYAJ DEZOD</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0;padding:0}
.header{background:#6a0dad;color:#fff;padding:12px;text-align:center;font-weight:bold;font-size:18px}
.tabs{display:flex;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{border-color:#6a0dad;color:#6a0dad;font-weight:bold;background:#f9f0ff}
.onglet{display:none;padding:15px}
.onglet.active{display:block}
.card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:12px}
input,select,button{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
button{background:#6a0dad;color:#fff;border:none;font-weight:bold;cursor:pointer}
button:active{transform:scale(.98)}
.tir-box{display:flex;gap:5px;flex-wrap:wrap}
.tir-box label{background:#eee;padding:6px 12px;border-radius:20px;cursor:pointer}
.tir-box input:checked+span{color:#6a0dad;font-weight:bold}
.rapportTir{border:1px solid #ddd;margin:8px 0;padding:10px;border-radius:10px;background:#fff}
</style>
</head>
<body>
<div class="header">VANDÈ V115.7 - RAPÒ DETAYE PA TIRAJ - MARYAJ DEZÒD</div>
<div class="tabs">
<div class="tab active" onclick="openOnglet(0)">1-Saisie</div>
<div class="tab" onclick="openOnglet(1)">2-Fiches</div>
<div class="tab" onclick="openOnglet(2)">3-Rapò</div>
<div class="tab" onclick="openOnglet(3)">4-Rezilta</div>
</div>

<!-- ONGLET 1 - SAISIE -->
<div class="onglet active" id="ong0">
<div class="card">
<input id="boule" placeholder="Boul / Maryaj ex: 08 ou 19x08">
<input id="miz" type="number" placeholder="Miz">
<div class="tir-box" id="boxTiraj">
<label><input type="checkbox" value="8h"> <span>8h</span></label>
<label><input type="checkbox" value="10h"> <span>10h</span></label>
<label><input type="checkbox" value="12h"> <span>12h</span></label>
<label><input type="checkbox" value="2h"> <span>2h</span></label>
<label><input type="checkbox" value="4h"> <span>4h</span></label>
<label><input type="checkbox" value="5h"> <span>5h</span></label>
</div>
<button onclick="saveFiche()">ANREJISTRE</button>
</div>
</div>

<!-- ONGLET 2 - LISTE FICHES -->
<div class="onglet" id="ong1">
<div class="card"><h3>Fich Jodia</h3><div id="listeFiches">Chaje...</div></div>
</div>

<!-- ONGLET 3 - RAPO DETAYE PA TIRAJ -->
<div class="onglet" id="ong2">
<div class="card">
<h3>Rapò Detaye Pa Chak Tiraj</h3>
<input type="date" id="dateDu"><input type="date" id="dateAu">
<select id="filTiraj">
<option value="tous">TOUS TIRAJ</option>
<option value="8h">8h</option><option value="10h">10h</option><option value="12h">12h</option>
<option value="2h">2h</option><option value="4h">4h</option><option value="5h">5h</option>
</select>
<button onclick="genererRapport()">Générer Rapport Korije</button>
<div id="rapportDetail" style="margin-top:12px"></div>
</div>
</div>

<!-- ONGLET 4 - REZILTA -->
<div class="onglet" id="ong3">
<div class="card"><h3>Rezilta</h3><div id="zoneRezilta">Chaje...</div></div>
</div>

<script type="module">
// --- FIREBASE CONFIG OU (KENBE SA OU GENYEN AN) ---
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSy...", authDomain: "...", projectId: "..." }; // METE KONFIG OU LA
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.fiches=[]; window.resultats={}; window.comMap={};

// --- ONGLET ---
window.openOnglet = (i)=>{
 document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active', idx==i));
 document.querySelectorAll('.onglet').forEach((o,idx)=>o.classList.toggle('active', idx==i));
}

// --- MARYAJ AN DEZOD: 0819 = 19x08 = 08x19 ---
window.separeMaryaj = (txt)=>{
 if(!txt) return null;
 var t = txt.toString().toLowerCase().replace(/×/g,'x').replace(/\*/g,'x').trim();
 var p=null;
 if(t.includes('x')) p=t.split('x');
 else if(t.includes('-')) p=t.split('-');
 else if(t.length>=4) p=[t.slice(0,2), t.slice(2,4)];
 else return null;
 if(!p||p.length<2) return null;
 var a = (p[0]||"").replace(/\D/g,'').padStart(2,'0').slice(-2);
 var b = (p[1]||"").replace(/\D/g,'').padStart(2,'0').slice(-2);
 return [a,b];
}
window.maryajGagne = (bet,res)=>{
 var B=separeMaryaj(bet), R=separeMaryaj(res);
 if(!B||!R) return false;
 return (B[0]==R[0]&&B[1]==R[1]) || (B[0]==R[1]&&B[1]==R[0]);
}

// --- KALKIL GEN PAR TIRAJ AK DEZOD ---
window.calkilGenParTiraj = ()=>{
 var du=document.getElementById('dateDu').value;
 var au=document.getElementById('dateAu').value||du;
 var filT=document.getElementById('filTiraj').value||"tous";
 var fiches=window.fiches||[];
 var resu=window.resultats||{};
 var vPar={}, pPar={}, comPar={}, gPar={};
 var vTot=0,pTot=0,comTot=0;
 fiches.forEach(fd=>{
  if(du && fd.date<du) return;
  if(au && fd.date>au) return;
  if(!fd.tirajs||!Array.isArray(fd.tirajs)) return;
  var miz=parseFloat(fd.miz)||0; if(miz<=0) return;
  fd.tirajs.forEach(tir=>{
   if(filT!=="tous" && tir!==filT) return;
   if(!vPar[tir]){vPar[tir]=0; pPar[tir]=0; comPar[tir]=0; gPar[tir]=0;}
   vPar[tir]+=miz; vTot+=miz;
   var com=miz*10/100; comPar[tir]+=com; comTot+=com;
   var re=resu[fd.date] && resu[fd.date][tir];
   var pey=0; var boule=(fd.boule||"").toString().trim();
   if(re){
     if(boule==re.p1) pey=miz*50;
     else if(boule==re.p2) pey=miz*20;
     else if(boule==re.p3) pey=miz*10;
     else if(maryajGagne(boule, re.M1||re.m1) || maryajGagne(boule, re.M2||re.m2) || maryajGagne(boule, re.M3||re.m3)){
       pey=miz*500;
     }
   }
   if(pey>0){ pPar[tir]+=pey; pTot+=pey; }
   gPar[tir]=vPar[tir]-comPar[tir]-pPar[tir];
  });
 });
 return {vPar,pPar,comPar,gPar,vTot,pTot,comTot,gainTot:vTot-comTot-pTot};
}

window.genererRapport = ()=>{
 var R=calkilGenParTiraj();
 var html=`<div style="padding:5px">`;
 for(var tir in R.vPar){
   html+=`<div class="rapportTir">
     <b style="color:#6a0dad">TIRAJ ${tir.toUpperCase()}</b><br>
     Vente: <b>${R.vPar[tir]}</b> Gdes | Kom: ${R.comPar[tir]} | Peye: <b style="color:red">${R.pPar[tir]||0}</b><br>
     <span style="color:green">Gain: <b>${R.gPar[tir]}</b> Gdes</span>
   </div>`;
 }
 html+=`<hr><div style="text-align:center;font-size:18px"><b>TOTAL: Vente ${R.vTot} | Peye ${R.pTot} | Gain ${R.gainTot}</b></div></div>`;
 document.getElementById('rapportDetail').innerHTML=html;
}

// --- SAVE FICHE (EGZANP) ---
window.saveFiche = async()=>{
 var boule=document.getElementById('boule').value.trim();
 var miz=document.getElementById('miz').value;
 var tirajs=[...document.querySelectorAll('#boxTiraj input:checked')].map(i=>i.value);
 if(!boule||!miz||tirajs.length==0) return alert("Ranpli tout");
 var fd={boule,miz,tirajs,date:new Date().toISOString().slice(0,10),vendeur:"vande1"};
 window.fiches.push(fd);
 // await addDoc(collection(db,"fiches"), fd);
 alert("Anrejistre: "+boule+" "+miz+" - "+tirajs.join(","));
 document.getElementById('boule').value=""; document.getElementById('miz').value="";
}
</script>
</body>
</html>
