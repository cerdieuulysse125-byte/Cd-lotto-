<!DOCTYPE html><html lang='ht'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>V19 TABS IZOLE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#eef2f7;overflow-x:hidden}
.h{background:#1e2a8a;color:#fff;padding:10px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:100}
.card{background:#fff;border-radius:12px;padding:10px;margin:8px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;justify-content:center}
.kz{width:78px;min-width:78px;height:52px;border:2.5px solid #1e2a8a;border-radius:12px;font-weight:800;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer}
.kzT{width:260px;min-width:260px;justify-content:space-between;padding:0 12px}
.inpL{width:100%;height:48px;border:2.5px solid #1e2a8a;border-radius:10px;padding:0 10px}
.btn{padding:14px;border:0;border-radius:10px;color:#fff;font-weight:800;width:100%}.btnG{background:#16a34a}.btnB{background:#1e2a8a}.btnR{background:#e11d48;width:52px;height:52px;border-radius:12px;border:0;color:#fff;font-weight:800}
.total{background:#1e2a8a;color:#fff;border-radius:12px;padding:12px;display:flex;justify-content:space-between;font-weight:800;margin:8px}
.tlist{display:none;position:fixed;left:8px;right:8px;top:90px;background:#fff;border:3px solid #1e2a8a;border-radius:12px;z-index:9999;padding:8px;grid-template-columns:78px 78px 78px;gap:8px;max-height:70vh;overflow:auto;justify-content:center}.tlist.open{display:grid}
.topt{width:78px;min-height:68px;border:2px solid #ccc;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;text-align:center}
/* TABS IZOLE - CHAK PAJ APA */
#loginPage{display:block}
#mainPage{display:none;min-height:100vh;padding-bottom:80px}
#mainPage.show{display:block}
.tabPage{display:none!important}
.tabPage.active{display:block!important}
.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid #1e2a8a;z-index:5000;height:60px}.tab{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:0;background:#eee;border-right:1px solid #ccc}.tab.active{background:#1e2a8a;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:99999;align-items:center;justify-content:center}.modal.on{display:flex}
.modalBox{background:#fff;border-radius:16px;padding:16px;width:92%;max-width:340px}
.keypad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.key{height:60px;border:2px solid #1e2a8a;border-radius:12px;font-size:20px;font-weight:800;background:#fff}.key.ok{background:#16a34a;color:#fff}
</style></head><body>
<div class='h'><div><b id='vName'>Tamouche</b><br><small id='heureHaiti' style='background:#16a34a;padding:2px 8px;border-radius:6px'>SYNC...</small></div><div><button onclick='localStorage.clear();location.reload()' style='background:#ff9800;color:#fff;border:0;padding:6px 10px;border-radius:6px;margin-right:4px'>Cache</button><button onclick='logout()' style='background:#e11d48;color:#fff;border:0;padding:6px 10px;border-radius:6px'>Soti</button></div></div>

<div id='loginPage'><div class='card' style='max-width:400px;margin:20px auto;text-align:center'><h3>🔐 Vandè</h3><input id='inputSerial' class='inpL' placeholder='Serial' style='margin-top:8px'><input id='inputPass' type='password' class='inpL' placeholder='Modpas' style='margin-top:8px'><button class='btn btnG' style='margin-top:10px' onclick='doLogin()'>Konekte</button><div id='loginMsg' style='color:red;font-weight:700;margin-top:8px'></div></div></div>

<div id='mainPage'>
<!-- 1-VENDRE SÈLMAN ENFÒMASYON POU VANN -->
<div id='pV' class='tabPage active'><div class='card'><div style='display:flex;justify-content:space-between'><b>🎯 Tiraj</b><button onclick='selAll()' style='padding:6px 12px;border-radius:8px'>Tout ouvè</button></div><div class='row' style='margin-top:10px'><div class='kz'>Tiraj</div><div id='kazT' class='kz kzT' onclick='document.getElementById("tlist").classList.toggle("open")'><span id='txtT' style='color:#999'>Chwazi tiraj</span><span>▼</span></div></div><div id='tlist' class='tlist'></div><div id='limitInfo' style='font-size:11px;background:#fff3e0;padding:6px;border-radius:6px;margin-top:6px'></div></div>
<div class='card'><div class='row' style='font-size:11px;font-weight:800'><div style='width:78px;text-align:center'>JEUX</div><div style='width:78px;text-align:center'>BOUL</div><div style='width:78px;text-align:center'>MIZ</div><div style='width:52px'></div></div><div id='bets'></div><button class='btn btnB' style='margin-top:10px' onclick='addR()'>+ Liy</button></div>
<div class='total'><span id='dt'>Total $0 x 0 = $0</span><span id='gt'>$0</span></div><div style='display:flex;gap:8px;margin:8px'><button class='btn btnG' style='flex:1;height:58px;font-size:22px' onclick='vann()'>VANN</button><button class='btn btnB' style='flex:1;height:58px' onclick='printBT()'>🖨️</button></div><div id='prev' style='background:#fff;margin:8px;padding:12px;font-family:monospace;white-space:pre-line;text-align:center;display:none;border:2px dashed #000'></div></div>

<!-- 2-KOPYE APA -->
<div id='pC' class='tabPage'><div class='card'><h3>2- Kopye</h3><input id='cid' class='inpL' placeholder='ID Ticket'><button class='btn btnB' style='margin-top:8px' onclick='doCopy()'>Kopye Fich</button></div></div>

<!-- 3-FICHES APA -->
<div id='pF' class='tabPage'><div class='card'><h3>3- Mes Fiches</h3><div class='row'><input id='fd' type='date' style='width:150px;height:48px;border:2.5px solid #1e2a8a;border-radius:10px;padding:0 10px'><button class='btn btnB' style='width:78px;height:48px' onclick='loadF()'>Wè</button></div><div id='ftot' style='background:#1e2a8a;color:#fff;padding:10px;border-radius:10px;display:none'></div><div id='flist'></div></div></div>

<!-- 4-RAPPORT APA -->
<div id='pR' class='tabPage'><div class='card'><h3>4- Rapò</h3><div class='row'><input id='rdu' type='date' style='width:48%;height:48px;border:2.5px solid #1e2a8a;border-radius:10px'><input id='rau' type='date' style='width:48%;height:48px;border:2.5px solid #1e2a8a;border-radius:10px'></div><select id='rt' class='inpL' style='margin-top:8px'><option value='tous'>Tous</option></select><button class='btn btnB' style='margin-top:8px' onclick='calcR()'>Kalkile</button><div id='rres' style='display:none;margin-top:8px'></div><div id='rprint' style='background:#fff;padding:8px;font-family:monospace;font-size:11px;border:1px dashed #000;display:none;white-space:pre-line;text-align:center'></div><button class='btn btnB' style='margin-top:8px' onclick='printRapport()'>🖨️ Rapport</button></div></div>

<!-- 5-PARAM APA -->
<div id='pP' class='tabPage'><div class='card'><h3>5- Paramèt</h3><div id='prixInfo'></div><div id='heureList' style='margin-top:10px'></div></div><div class='card' style='border:2px solid #ff9800'><h3>🖼️ Logo Tèt Fich</h3><input id='logoUrl' class='inpL' placeholder='https://...'><button class='btn btnB' style='margin-top:8px' onclick='saveLogo()'>Sove Logo</button><div id='logoPreview' style='text-align:center;margin-top:8px'></div></div></div>

<div class='tabs'><button class='tab active' onclick="goTab('pV',this)">1-Vendre</button><button class='tab' onclick="goTab('pC',this)">2-Kopye</button><button class='tab' onclick="goTab('pF',this)">3-Fiches</button><button class='tab' onclick="goTab('pR',this)">4-Rapport</button><button class='tab' onclick="goTab('pP',this)">5-Param</button></div>
</div>

<!-- MODAL BOUL -->
<div id='mJeux' class='modal' onclick='if(event.target===this)this.classList.remove("on")'><div class='modalBox'><h3 style='text-align:center'>Chwazi JEUX</h3><div style='display:grid;gap:10px;margin-top:12px'><button class='btn btnB' onclick='setJeux("boul")'>BOUL - 2 chif</button><button class='btn btnB' onclick='setJeux("maryaj")'>MARYAJ - 4 chif</button><button class='btn btnB' onclick='setJeux("loto3")'>LOTO3 - 3 chif</button><button class='btn btnB' onclick='setJeux("loto4")'>LOTO4 - 4 chif</button><button class='btn btnB' onclick='setJeux("loto5")'>LOTO5 - 5 chif</button></div><button class='btn' style='background:#ccc;color:#000;margin-top:12px' onclick='document.getElementById("mJeux").classList.remove("on")'>Fèmen</button></div></div>
<div id='mBoul' class='modal'><div class='modalBox'><h3 style='text-align:center'><span id='boulJeuxLabel'>BOUL - 2 chif</span></h3><small style='background:#e0f2fe;padding:6px;border-radius:6px;display:block;text-align:center;margin-top:6px'>Bòlèt 2 | Loto3 3 | Loto4 4 | Loto5 5 | Maryaj 4</small><input id='boulInput' class='inpL' style='font-size:28px;text-align:center;height:60px;margin-top:10px' readonly><div class='keypad'><button class='key' onclick='addB("1")'>1</button><button class='key' onclick='addB("2")'>2</button><button class='key' onclick='addB("3")'>3</button><button class='key' onclick='addB("4")'>4</button><button class='key' onclick='addB("5")'>5</button><button class='key' onclick='addB("6")'>6</button><button class='key' onclick='addB("7")'>7</button><button class='key' onclick='addB("8")'>8</button><button class='key' onclick='addB("9")'>9</button><button class='key' style='background:#fee2e2' onclick='delB()'>⌫</button><button class='key' onclick='addB("0")'>0</button><button class='key ok' onclick='okB()'>OK</button></div></div></div>
<div id='mMiz' class='modal'><div class='modalBox'><h3 style='text-align:center'>MIZ</h3><div id='mizLimitLabel' style='font-size:11px;background:#fff3e0;padding:6px;border-radius:6px;margin:8px 0'></div><input id='mizInput' class='inpL' style='font-size:28px;text-align:center;height:60px' readonly><div class='keypad'><button class='key' onclick='addM("5")'>5</button><button class='key' onclick='addM("10")'>10</button><button class='key' onclick='addM("20")'>20</button><button class='key' onclick='addM("50")'>50</button><button class='key' onclick='addM("100")'>100</button><button class='key' onclick='addM("25")'>25</button><button class='key' style='background:#fee2e2' onclick='document.getElementById("mizInput").value=""'>C</button><button class='key' onclick='addM("0")'>0</button><button class='key ok' onclick='okM()'>OK</button></div></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const TIRAJ_DEFAULT=[["GA midi","12:00"],["FL midi","13:00"],["NY midi","14:00"],["Real","12:30"],["GA soir","18:00"],["FL soir","21:00"],["NY soir","22:00"],["Primera día","11:30"],["Suerte día","12:00"],["Lote Dom","13:30"],["Ganamas","14:15"],["Suerte noche","17:50"],["Primera noche","19:50"],["Loteka","19:45"],["Nacional noche","20:50"],["Leidsa","20:45"],["Anguila 10h","09:40"],["Anguila 18h","17:40"]];
let DB={vendeurs:{},tickets:{},heures:{},results:{},config:{},prix:{global:{p1:50,p2:20,p3:10,m1:1000,l3:500,l4:5000,l5:25000,kom:10,komActive:true}},limites:{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}}},CUR=null,selT=[],LAST_TXT='',curRow=null;
function getHaitiTime(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Port-au-Prince'}));}
function formatHaiti(d){let h=d.getHours(),m=d.getMinutes().toString().padStart(2,'0'),ap=h>=12?'PM':'AM',h12=h%12||12;return h12+':'+m+' '+ap;}
function getHeureProprio(n){return DB.heures&&DB.heures[n]?DB.heures[n]:(TIRAJ_DEFAULT.find(x=>x[0]==n)?.[1]||'');}
function isOpen(n){let s=getHeureProprio(n);if(!s)return true;let p=s.split(':'),fh=parseInt(p[0]),fm=parseInt(p[1]||0),h=getHaitiTime();return h.getHours()*60+h.getMinutes() < fh*60+fm;}
function getMyLimite(){return DB.limites[CUR?._key]||DB.limites[CUR?.serial]||DB.limites.global||{bor:1500,mar:100,l3:100,l4:20,l5:5};}
function getMyPrix(k){let key=k||CUR?._key;return DB.prix[key]||DB.prix.global||{p1:50,p2:20,p3:10,m1:1000,l3:500,l4:5000,l5:25000,kom:10,komActive:true};}
function getLimiteForJeu(j){let lim=getMyLimite();if(j==='boul')return lim.bor;if(j==='maryaj')return lim.mar;if(j==='loto3')return lim.l3;if(j==='loto4')return lim.l4;if(j==='loto5')return lim.l5;return 99999;}
function getChifRequis(jeu){if(jeu==='boul')return 2;if(jeu==='loto3')return 3;if(jeu==='loto4')return 4;if(jeu==='loto5')return 5;if(jeu==='maryaj')return 4;return 2;}
function getLogoUrl(){return DB.config?.logoUrl||localStorage.getItem('lotto_logo')||'';}
function saveLogo(){let url=document.getElementById('logoUrl').value.trim();if(!url){alert('Mete URL');return}db.ref('config/logoUrl').set(url).then(()=>{localStorage.setItem('lotto_logo',url);alert('✅ Logo sove');});}
function listenDB(){db.ref().on('value',snap=>{let v=snap.val()||{};DB.vendeurs=v.vendeurs||{};DB.tickets=v.tickets||{};DB.heures=v.heures||{};DB.results=v.results||{};DB.prix=v.prix||DB.prix;DB.limites=v.limites||DB.limites;DB.config=v.config||{};renderT();document.getElementById('heureHaiti').innerText='SYNC:'+formatHaiti(getHaitiTime())+'-'+Object.keys(DB.vendeurs).length+'V';});}
async function doLogin(){let s=document.getElementById('inputSerial').value.trim(),p=document.getElementById('inputPass').value.trim(),msg=document.getElementById('loginMsg');if(!s){msg.innerText='Mete Serial';return}if(!p){msg.innerText='Modpas Obligatwa';return}let snap=await db.ref('vendeurs').once('value');let vendeurs=snap.val()||{};let key=Object.keys(vendeurs).find(k=>String(vendeurs[k].serial)===String(s));let f=key?vendeurs[key]:null;if(!f){msg.innerText='Vandè '+s+' pa egziste';return}if(!f.pass||String(f.pass)!==String(p)){msg.innerText='Modpas pa bon';return}CUR=f;CUR._key=key;localStorage.setItem('curV',JSON.stringify(CUR));openMain();}
function openMain(){document.getElementById('loginPage').style.display='none';document.getElementById('mainPage').style.display='block';document.getElementById('mainPage').classList.add('show');document.getElementById('vName').innerText=CUR.nom||('Vandè '+CUR.serial);listenDB();addR();upd();}
function logout(){localStorage.clear();location.reload();}
function renderT(){let tlist=document.getElementById('tlist');let html='<div style="grid-column:1/-1;display:flex;justify-content:space-between;background:#1e2a8a;color:#fff;padding:8px;border-radius:8px"><div><b>Tiraj</b><br><small>'+formatHaiti(getHaitiTime())+'</small></div><span onclick="tlist.classList.remove(\'open\')" style="background:#e11d48;padding:6px 12px;border-radius:6px">X</span></div>';TIRAJ_DEFAULT.forEach(t=>{let name=t[0],hp=getHeureProprio(name),open=isOpen(name),chk=selT.includes(name)?'checked':'',bg=open?'background:#dcfce7;border-color:#16a34a':'background:#fee2e2;border-color:#e11d48';html+='<label class="topt" style="'+bg+'"><input type="checkbox" value="'+name+'" '+chk+' '+(open?'':'disabled')+' onchange="chg(this)"><span>'+name+'</span><small>'+hp+' '+(open?'✅':'⛔')+'</small></label>';});tlist.innerHTML=html;document.getElementById('rt').innerHTML='<option value="tous">Tous</option>'+TIRAJ_DEFAULT.map(t=>'<option>'+t[0]+'</option>').join('');let lim=getMyLimite();document.getElementById('limitInfo').innerHTML='Limit: Boul $'+lim.bor+' Mar $'+lim.mar;}
function chg(el){if(!isOpen(el.value)&&el.checked){alert('Fèmen');el.checked=false;return}if(el.checked)selT.push(el.value);else selT=selT.filter(x=>x!=el.value);document.getElementById('txtT').innerText=selT.length?selT.length+' tiraj':'Chwazi tiraj';upd();if(selT.length)document.getElementById('tlist').classList.remove('open')}
function selAll(){selT=[];TIRAJ_DEFAULT.forEach(t=>{if(isOpen(t[0]))selT.push(t[0])});renderT();document.getElementById('txtT').innerText=selT.length?selT.length+' tiraj':'Chwazi tiraj';upd()}
function addR(keep='boul'){let c=document.getElementById('bets');let d=document.createElement('div');d.className='row betRow';d.innerHTML='<div class="kz" onclick="openJeux(this.parentElement)">'+keep.toUpperCase()+'</div><div class="kz" onclick="openBoul(this.parentElement)">--</div><div class="kz" onclick="openMiz(this.parentElement)">$</div><select class="jeu" style="display:none"><option value="boul">boul</option><option value="maryaj">maryaj</option><option value="loto3">loto3</option><option value="loto4">loto4</option><option value="loto5">loto5</option></select><input class="boul" type="hidden"><input class="mise" type="hidden"><button class="btnR" onclick="this.parentElement.remove();upd()">X</button>';c.appendChild(d);d.querySelector('.jeu').value=keep;upd();}
function openJeux(row){curRow=row;document.getElementById('mJeux').classList.add('on');}
function setJeux(val){if(curRow){curRow.querySelector('.jeu').value=val;curRow.querySelector('.kz').innerText=val.toUpperCase();}document.getElementById('mJeux').classList.remove('on');upd();setTimeout(()=>openBoul(curRow),300);}
function openBoul(row){curRow=row;let jeu=row.querySelector('.jeu').value;let req=getChifRequis(jeu);document.getElementById('boulJeuxLabel').innerText=jeu.toUpperCase()+' - '+req+' chif obligatwa';document.getElementById('boulInput').value=row.querySelector('.boul').value||'';document.getElementById('mBoul').classList.add('on');}
function addB(d){let i=document.getElementById('boulInput');let max=getChifRequis(curRow.querySelector('.jeu').value);if(i.value.length>=max)return;i.value+=d;}
function delB(){document.getElementById('boulInput').value=document.getElementById('boulInput').value.slice(0,-1);}
function okB(){let val=document.getElementById('boulInput').value.trim();let jeu=curRow.querySelector('.jeu').value;let req=getChifRequis(jeu);if(val.length!==req){alert('⛔ '+jeu.toUpperCase()+' dwe '+req+' chif - Bòlèt 2, Loto3 3, Loto4 4, Loto5 5, Maryaj 4');return;}curRow.querySelector('.boul').value=val;curRow.querySelectorAll('.kz')[1].innerText=val;document.getElementById('mBoul').classList.remove('on');upd();setTimeout(()=>openMiz(curRow),200);}
function openMiz(row){curRow=row;let max=getLimiteForJeu(row.querySelector('.jeu').value);document.getElementById('mizLimitLabel').innerText='Max $'+max;document.getElementById('mizInput').value=row.querySelector('.mise').value||'';document.getElementById('mMiz').classList.add('on');}
function addM(v){document.getElementById('mizInput').value=v;}
function okM(){let val=parseInt(document.getElementById('mizInput').value)||0;let max=getLimiteForJeu(curRow.querySelector('.jeu').value);if(val>max){alert('Limit $'+max);return}curRow.querySelector('.mise').value=val;curRow.querySelectorAll('.kz')[2].innerText='$'+val;document.getElementById('mMiz').classList.remove('on');upd();let last=document.querySelectorAll('.betRow');if(last[last.length-1]===curRow)addR(curRow.querySelector('.jeu').value);}
function upd(){let sum=0;document.querySelectorAll('.betRow').forEach(r=>{let mm=parseInt(r.querySelector('.mise').value)||0;if(r.querySelector('.boul').value.trim()&&mm)sum+=mm;});document.getElementById('dt').innerText='Total $'+sum+' x '+selT.length+' = $'+(sum*selT.length);document.getElementById('gt').innerText='$'+(sum*selT.length);}
function build(tk){let txt='';let logo=getLogoUrl();if(logo){txt+='[C]<img>'+logo+'</img>\n';}txt+='[C]C-D VERITE LOTTO\n';txt+='[C]Le Ayiti:'+formatHaiti(getHaitiTime())+'\n';txt+='[C]Tiraj:'+tk.tirages.join(',').substring(0,28)+'\n';txt+='[C]Vande:'+(CUR?.serial||'')+'\n';txt+='[C]Id:'+tk.id+'\n';txt+='[C]--------------------------------\n';txt+='[C]JEU BOUL MIZ\n';txt+='[C]--------------------------------\n';tk.bets.forEach(b=>{txt+='[C]'+b.type.toUpperCase()+' '+b.numero+' $'+b.mise+'\n';});txt+='[C]--------------------------------\n';txt+='[C]TOTAL $'+tk.baseTotal+' x '+tk.tirages.length+' = $'+tk.total+'\n';txt+='[C]'+new Date().toLocaleDateString('fr-FR')+' '+formatHaiti(getHaitiTime())+'\n\n\n';return txt;}
async function vann(){if(!selT.length){alert('Chwazi Tiraj');return}let bets=[];document.querySelectorAll('.betRow').forEach(r=>{let j=r.querySelector('.jeu').value,b=r.querySelector('.boul').value.trim(),mm=parseInt(r.querySelector('.mise').value);if(j&&b&&mm)bets.push({type:j,numero:b,mise:mm})});if(!bets.length){alert('VID');return}let base=bets.reduce((a,b)=>a+b.mise,0);let tk={id:'T'+Date.now().toString().slice(-7),bets,tirages:selT.slice(),baseTotal:base,total:base*selT.length,date:getHaitiTime().toISOString().slice(0,10),dateHaiti:getHaitiTime().toLocaleDateString('fr-CA',{timeZone:'America/Port-au-Prince'}),vendeurId:CUR?._key,serial:CUR?.serial};await db.ref('tickets/'+tk.id).set(tk);let txt=build(tk);document.getElementById('prev').style.display='block';document.getElementById('prev').innerText=txt.replace(/\[C\]|<img>.*<\/img>/g,'');LAST_TXT=txt;printBT(txt);document.getElementById('bets').innerHTML='';addR();upd();}
function printBT(t){let enc=encodeURIComponent(t||LAST_TXT);window.location.href='rawbt://print?text='+enc;}
async function calcR(){let du=document.getElementById('rdu').value,au=document.getElementById('rau').value,ti=document.getElementById('rt').value;if(!du||!au){alert('Chwazi dat');return}let snap=await db.ref('tickets').once('value');let all=snap.val()||{};let resSnap=await db.ref('results').once('value');let results=resSnap.val()||{};let vente=0,count=0,gain=0;Object.values(all).forEach(t=>{let td=t.dateHaiti||t.date;if(td<du||td>au)return;if(t.serial!=CUR.serial&&t.vendeurId!=CUR._key)return;if(ti!='tous'&&t.tirages.indexOf(ti)==-1)return;count++;vente+=ti=='tous'?t.total:t.baseTotal;let prix=getMyPrix(t.vendeurId);for(let tirage of t.tirages){if(ti!='tous'&&tirage!=ti)continue;let res=Object.values(results).find(r=>r.tirage==tirage);if(!res)continue;for(let bet of t.bets){if(bet.type==='boul'){if(bet.numero===res.r1)gain+=bet.mise*prix.p1;else if(bet.numero===res.r2)gain+=bet.mise*prix.p2;else if(bet.numero===res.r3)gain+=bet.mise*prix.p3;}else if(bet.type==='maryaj'){let a=bet.numero.substring(0,2),b=bet.numero.substring(2,4);if([res.r1,res.r2,res.r3].includes(a)&&[res.r1,res.r2,res.r3].includes(b))gain+=bet.mise*prix.m1;}else if(bet.type==='loto3'&&bet.numero===res.l3)gain+=bet.mise*prix.l3;else if(bet.type==='loto4'&&bet.numero===res.l4)gain+=bet.mise*prix.l4;else if(bet.type==='loto5'&&bet.numero===res.l5)gain+=bet.mise*prix.l5;}}});let prixCur=getMyPrix();let kom=prixCur.komActive?vente*prixCur.kom/100:0;let bal=vente-kom-gain;document.getElementById('rres').style.display='block';document.getElementById('rres').innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center"><div style="background:#e3f2fd;padding:8px;border-radius:8px"><small>Vant</small><div>$'+vente.toFixed(2)+'</div></div><div style="background:#fff3e0;padding:8px;border-radius:8px"><small>Kom</small><div>$'+kom.toFixed(2)+'</div></div><div style="background:#fce4ec;padding:8px;border-radius:8px"><small>Peye</small><div>$'+gain.toFixed(2)+'</div></div><div style="background:#e8f5e9;padding:8px;border-radius:8px"><small>Balans</small><div>$'+bal.toFixed(2)+'</div></div></div>';let txt='[C]RAPPORT '+du+' AU '+au+'\n[C]Vant:$'+vente.toFixed(2)+'\n[C]Balans:$'+bal.toFixed(2)+'\n';document.getElementById('rprint').innerText=txt;document.getElementById('rprint').style.display='block';LAST_TXT=txt;}
function printRapport(){let enc=encodeURIComponent(LAST_TXT);window.location.href='rawbt://print?text='+enc;}
function goTab(id,el){document.querySelectorAll('.tabPage').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');window.scrollTo(0,0);if(id==='pF')loadF();}
async function loadF(){let d=document.getElementById('fd').value||getHaitiTime().toISOString().slice(0,10);let snap=await db.ref('tickets').once('value');let all=snap.val()||{};let list=Object.values(all).filter(t=>(t.date==d||t.dateHaiti==d)&&(t.serial==CUR.serial||t.vendeurId==CUR._key));let total=list.reduce((a,b)=>a+b.total,0);document.getElementById('ftot').style.display=list.length?'block':'none';document.getElementById('ftot').innerHTML='Total $'+total+' - '+list.length+' fiches';document.getElementById('flist').innerHTML=list.reverse().map(t=>'<div class="card"><b>'+t.id+'</b> '+t.tirages.join(',')+'<br>'+t.bets.map(b=>b.type+':'+b.numero+' $'+b.mise).join(' | ')+'<br><b>$'+t.total+'</b></div>').join('')||'Pa gen';}
function doCopy(){let id=document.getElementById('cid').value.trim();db.ref('tickets/'+id).once('value',snap=>{let tk=snap.val();if(!tk){alert('Pa jwenn');return}selT=tk.tirages.filter(x=>isOpen(x));document.getElementById('bets').innerHTML='';tk.bets.forEach(b=>{addR(b.type);let r=document.querySelectorAll('.betRow');let rr=r[r.length-1];rr.querySelector('.jeu').value=b.type;rr.querySelectorAll('.kz')[0].innerText=b.type.toUpperCase();rr.querySelector('.boul').value=b.numero;rr.querySelectorAll('.kz')[1].innerText=b.numero;rr.querySelector('.mise').value=b.mise;rr.querySelectorAll('.kz')[2].innerText='$'+b.mise;});goTab('pV',document.querySelectorAll('.tab')[0]);upd();});}
(function(){let cv=localStorage.getItem('curV');if(cv){try{CUR=JSON.parse(cv);openMain();}catch(e){localStorage.clear();}}listenDB();})();
</script></body></html>
