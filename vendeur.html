<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V107 LIMIT GLOBAL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:900}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:13px;border:2px solid #000;border-radius:11px;width:100%;font-size:16px;margin:4px 0;background:#fff}.line{display:grid;grid-template-columns:90px 1fr 80px;gap:6px;margin:6px 0}.tiraj{padding:6px 10px;margin:3px;border:2px solid #000;border-radius:20px;font-weight:bold;display:inline-block;font-size:12px;cursor:pointer;text-align:center}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{background:#eee;color:#aaa;pointer-events:none;opacity:.5}.tiraj.full{background:#ef4444!important;color:#fff!important}.btn{padding:13px;width:100%;border:none;border-radius:11px;font-weight:900;font-size:15px;margin:6px 0}.bK{background:#000;color:#FFD700}.ticket{border:1.5px dashed #000;padding:14px;text-align:center;max-width:320px;margin:auto;font-family:monospace;font-size:15px;font-weight:900;line-height:20px;letter-spacing:0.3px}.ticket b{font-size:16px}.tab2{display:flex;background:#000;gap:1px}.tab2 button{flex:1;padding:11px 2px;font-size:11px;font-weight:900;background:#000;color:#FFD700;border:none}.tab2 button.active{background:#FFD700;color:#000}.blocked{position:fixed;inset:0;background:rgba(0,0,0,.93);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;text-align:center;padding:20px}</style>
</head><body>
<div class="h">C&D VÉRITÉ LOTTO - V107</div>
<div id="blockedBox" class="blocked" style="display:none"><h1>VANDEUR FERMÉ</h1><button class="btn bK" onclick="location.reload()">Réessayer</button></div>
<div id="loginBox" class="card" style="text-align:center;padding-top:30px"><h2>Connexion</h2><input id="uName" placeholder="Code vendeur"><input id="uPass" type="password" value="1234"><button class="btn bK" onclick="go()">Antre</button><div id="loginErr" style="color:red"></div></div>
<div id="appBox" style="display:none">
<div class="tab2"><button id="btnV" class="active" onclick="showTab('vendre')">Vendre</button><button onclick="showTab('kopyeTab')">Copier</button><button onclick="showTab('fichesTab')">Mes Fiches</button><button onclick="showTab('rapportTab')">Rapport</button></div>
<div id="vendre" class="card">
<div style="text-align:center;font-weight:900;font-size:12px">TIRAJ - <span id="dateToday" style="background:#FFD700;color:#000;padding:2px 6px;border-radius:6px"></span> <span style="font-size:9px;color:#666"> LIMIT GLOBAL AKTIF</span></div>
<div id="tirajBox" style="text-align:center;margin:8px 0"></div>
<div style="display:flex;background:#000;color:#FFD700;padding:7px;font-weight:900;border-radius:7px;font-size:11px"><div style="width:90px">JEUX</div><div style="flex:1">BOUL</div><div style="width:80px">MIZ</div></div>
<div id="lines"></div>
<div style="background:#000;color:#fff;padding:12px;border-radius:10px;text-align:center;margin-top:6px">Total <span id="tot">0$</span> × <span id="nbT">1</span><div style="font-size:26px;color:#FFD700;font-weight:900">A PEYE <span id="paye">0$</span></div><div id="limitInfo" style="font-size:10px;color:#ff9999;margin-top:4px"></div></div>
<button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button>
<div id="lastTicket" style="margin-top:10px"></div>
</div>
<div id="kopyeTab" class="card" style="display:none"><h3>Copier</h3><input id="searchId" type="tel" placeholder="ID"><button class="btn bK" onclick="searchById()">Chèche</button><div id="resKopye"></div></div>
<div id="fichesTab" class="card" style="display:none"><h3>Mes Fiches - <span id="mn"></span></h3><div id="listF"></div></div>
<div id="rapportTab" class="card" style="display:none"><h3>Rapport</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="rapDu" type="date"><input id="rapAu" type="date"></div><select id="rapTiraj"><option value="">Tous</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><button class="btn bK" onclick="genRapV()">Générer</button><div id="rapData"></div></div>
</div>
<script>
const firebaseConfig={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"}; firebase.initializeApp(firebaseConfig); const db=firebase.database();
let curUser=null, selectedT=[], config={}, limites={}, journal={};
let tirajDef=[{id:'gaMidi',nom:'GA MIDI',h:'12:15'},{id:'flMidi',nom:'FL MIDI',h:'13:15'},{id:'nyMidi',nom:'NY MIDI',h:'14:15'},{id:'gaSoir',nom:'GA SOIR',h:'18:20'},{id:'flSoir',nom:'FL SOIR',h:'21:10'},{id:'nySoir',nom:'NY SOIR',h:'21:30'}];
function getHaitiDate(){ const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getESTHM(){ const now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return now.getHours()*60+now.getMinutes(); }
function go(){ const u=document.getElementById('uName').value.trim().toLowerCase(); const p=document.getElementById('uPass').value.trim(); db.ref('vendors/'+u).once('value',s=>{ if(s.exists()){ const v=s.val(); if(v.pass && v.pass!==p){ document.getElementById('loginErr').innerText="Modpas pa bon"; return; } if((v.status||'OUVE')==='FERME'){ document.getElementById('blockedBox').style.display='flex'; return; } } curUser={name:u}; initApp(); }); }
function initApp(){ document.getElementById('loginBox').style.display='none'; document.getElementById('appBox').style.display='block'; document.getElementById('mn').innerText=curUser.name; document.getElementById('dateToday').innerText=getHaitiDate(); document.getElementById('rapDu').value=getHaitiDate(); document.getElementById('rapAu').value=getHaitiDate(); db.ref('config').on('value',snap=>{ config=snap.val()||{}; limites=config.limites||{bolet:1000,maryaj:50,loto3:100,loto4:20,loto5:10}; renderTiraj(); }); db.ref('venteJournaliere/'+getHaitiDate()).on('value',s=>{ journal=s.val()||{}; renderTiraj(); checkAllLimits(); }); document.getElementById('lines').innerHTML=''; addLine(); }
function renderTiraj(){ const he=config.heures||{}; const ti=config.tirages||{}; let html=''; const cur=getESTHM(); tirajDef.forEach(t=>{ const realH=he[t.id]||t.h; const [hh][mm]=realH.split(':').map(Number); const m=hh*60+mm; const ferme=ti[t.id]==='FERME' || cur>=m; const active=selectedT.includes(t.nom); html+=`<span class="tiraj ${active?'active':''} ${ferme?'ferme':''}" onclick="toggleTiraj('${t.nom}')">${t.nom}<br><small>${realH}</small></span>`; }); document.getElementById('tirajBox').innerHTML=html; calc(); }
function toggleTiraj(nom){ if(selectedT.includes(nom)) selectedT=selectedT.filter(x=>x!==nom); else selectedT.push(nom); renderTiraj(); checkAllLimits(); }
function addLine(){ const div=document.createElement('div'); div.className='line'; div.innerHTML=`<select class="j"><option value="bolet">Bolèt</option><option value="maryaj">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select><input class="b" type="tel" inputmode="numeric" placeholder="00" maxlength="5"><input class="m" type="tel" inputmode="numeric" placeholder="25">`; document.getElementById('lines').appendChild(div); attachFlech(div); }
function attachFlech(row){
  const j=row.querySelector('.j'), b=row.querySelector('.b'), m=row.querySelector('.m');
  [j,b,m].forEach(inp=>{
    inp.addEventListener('input',e=>{ if(inp!==j) e.target.value=e.target.value.replace(/[^0-9]/g,''); calc(); if(inp===b || inp===m) setTimeout(checkAllLimits,200); });
    inp.addEventListener('keydown',e=>{
      const allRows=[...document.querySelectorAll('#lines.line')]; const idx=allRows.indexOf(row);
      if(e.key==='Enter' || e.key==='ArrowDown'){ e.preventDefault(); if(inp===j){ b.focus(); b.select(); } else if(inp===b){ m.focus(); m.select(); } else if(inp===m){ let next=allRows[idx+1]; if(!next){ addLine(); next=document.querySelectorAll('#lines.line')[idx+1]; } next.querySelector('.b').focus(); } }
    });
  });
}
function getLim(type){ return limites[type]||(type==='bolet'?1000:type==='maryaj'?50:type==='loto3'?100:type==='loto4'?20:10); }
function checkAllLimits(){
  let info=""; let hasBlock=false;
  document.querySelectorAll('#lines.line').forEach(r=>{
    const type=r.querySelector('.j').value; const boul=r.querySelector('.b').value.trim(); const miz=parseInt(r.querySelector('.m').value)||0;
    if(!boul || miz===0) { r.style.border=""; return; }
    const lim=getLim(type);
    selectedT.forEach(tName=>{
      const sold=(journal[tName] && journal[tName][type+"_"+boul])||0;
      if(sold+miz>lim){ r.style.border="2px solid red"; r.style.borderRadius="8px"; info+=`⛔ ${tName} ${boul} BOUCHE (${sold}/${lim}$)<br>`; hasBlock=true; } else { r.style.border=""; }
    });
  });
  document.getElementById('limitInfo').innerHTML=info; return!hasBlock;
}
function calc(){ let tot=0; document.querySelectorAll('#lines.line').forEach(r=>{ tot+=parseInt(r.querySelector('.m').value)||0; }); const nb=selectedT.length||1; document.getElementById('tot').innerText=tot+"$"; document.getElementById('nbT').innerText=nb; document.getElementById('paye').innerText=(tot*nb)+"$"; }
function showTab(id){ ['vendre','kopyeTab','fichesTab','rapportTab'].forEach(x=>document.getElementById(x).style.display='none'); document.getElementById(id).style.display='block'; }
function printTicket(html){
  document.getElementById('lastTicket').innerHTML=`<div class="ticket">${html}</div>`;
  const w=window.open('', '', 'width=360,height=700');
  w.document.write(`<html><head><title>Ticket</title><style>@page{size:80mm auto;margin:2mm} body{margin:0;padding:0;font-family:Courier,monospace}.ticket{width:72mm;padding:4mm;font-size:16px;font-weight:900;line-height:20px;letter-spacing:0.2px;text-align:center;color:#000}.ticket.small{font-size:13px;font-weight:700}.ticket.big{font-size:19px;font-weight:900}.sep{border-top:2px dashed #000;margin:6px 0} @media print{button{display:none}}</style></head><body><div class="ticket">${html}</div><script>setTimeout(()=>{window.print();window.close()},400)<\/script></body></html>`); w.document.close();
}
async function vann(){
  if(selectedT.length===0){alert('Chwazi tiraj');return;}
  let details=[]; document.querySelectorAll('#lines.line').forEach(r=>{ const j=r.querySelector('.j').value; const b=r.querySelector('.b').value.trim(); const m=parseInt(r.querySelector('.m').value)||0; if(b!=="" && m>0) details.push({type:j,boul:b,montan:m,row:r}); });
  if(details.length===0){alert('Mete boul');return;}
  // VERIFYE LIMIT GLOBAL FRE
  const dateStr=getHaitiDate();
  const snap=await db.ref('venteJournaliere/'+dateStr).once('value'); const curJournal=snap.val()||{};
  for(let d of details){ for(let tName of selectedT){ const key=d.type+"_"+d.boul; const sold=(curJournal[tName]&&curJournal[tName][key])||0; const lim=getLim(d.type); if(sold+d.montan>lim){ alert(`⛔ LIMIT GLOBAL RIVE!\\n${tName} - ${d.boul} deja vann ${sold}$ / limit ${lim}$\\nOu pa ka vann ${d.montan}$ ankò. Li bloke pou tout bank.`); return; } } }
  // OK - SOVE
  const base=details.reduce((a,b)=>a+b.montan,0); const total=base*selectedT.length; const id=db.ref('fiches').push().key;
  // Update journaliere atomik
  let updates={}; updates['fiches/'+id]={id:id,vendeur:curUser.name,tirajs:selectedT,details:details.map(x=>({type:x.type,boul:x.boul,montan:x.montan})),total:total,totalBase:base,nbTiraj:selectedT.length,date:new Date().toISOString(),dateStr:dateStr,gain:0};
  details.forEach(d=>{ selectedT.forEach(tName=>{ const key=d.type+"_"+d.boul; const cur=(curJournal[tName]&&curJournal[tName][key])||0; updates['venteJournaliere/'+dateStr+'/'+tName+'/'+key]=cur+d.montan; }); });
  await db.ref().update(updates);
  const ent=`<div class="big">${config.entete||'C&D VÉRITÉ LOTTO'}</div><div class="small">${new Date().toLocaleString("en-US",{timeZone:"America/New_York"})} - ${dateStr}<br>Vandè: ${curUser.name.toUpperCase()}</div>`;
  const corps=details.map(d=>`<div style="display:flex;justify-content:space-between"><span>${d.type.toUpperCase()} ${d.boul}</span><span>${d.montan}$</span></div>`).join('');
  const html=`${ent}<div class="sep"></div><div class="small">Tirage: <b>${selectedT.join(' / ')}</b><br>Id: <b style="font-size:18px">${id.slice(-5).toUpperCase()}</b></div><div class="sep"></div>${corps}<div class="sep"></div><div style="display:flex;justify-content:space-between;font-size:18px"><span>TOTAL</span><span>${total}$</span></div><div class="sep"></div><div class="big">${config.pied||'Bonne chance!'}</div>`;
  printTicket(html); document.getElementById('lines').innerHTML=''; addLine(); calc();
}
function searchById(){ const q=document.getElementById('searchId').value.trim().toLowerCase(); db.ref('fiches').once('value',s=>{ const all=Object.values(s.val()||[]); const f=all.find(x=>x.id.toLowerCase().includes(q)||x.id.slice(-5).toLowerCase()===q); document.getElementById('resKopye').innerHTML=f?`<b>${f.total}$</b> ${f.tirajs}<br><button class="btn bK" onclick="kopye('${f.id}')">Kopye</button> <button class="btn bK" onclick="reprint('${f.id}')">Print</button>`:"Pa jwenn"; }); }
function kopye(id){ db.ref('fiches/'+id).once('value',s=>{ const f=s.val(); selectedT=f.tirajs||[]; document.getElementById('lines').innerHTML=''; f.details.forEach(d=>{ addLine(); const rows=document.querySelectorAll('#lines.line'); const row=rows[rows.length-1]; row.querySelector('.j').value=d.type; row.querySelector('.b').value=d.boul; row.querySelector('.m').value=d.montan; }); renderTiraj(); calc(); showTab('vendre'); }); }
function reprint(id){ db.ref('fiches/'+id).once('value',s=>{ const f=s.val(); const ent=`<div class="big">${config.entete||'C&D VÉRITÉ LOTTO'}</div><div class="small">${f.dateStr} - ${f.vendeur}</div>`; const corps=(f.details||[]).map(d=>`<div style="display:flex;justify-content:space-between"><span>${d.type.toUpperCase()} ${d.boul}</span><span>${d.montan}$</span></div>`).join(''); const html=`${ent}<div class="sep"></div>Tirage: ${f.tirajs}<br>Id: <b>${f.id.slice(-5).toUpperCase()}</b><div class="sep"></div>${corps}<div class="sep"></div>TOTAL: ${f.total}$<div class="sep"></div>${config.pied||'Bonne chance!'}`; printTicket(html); }); }
function genRapV(){ const du=document.getElementById('rapDu').value||getHaitiDate(); const au=document.getElementById('rapAu').value||getHaitiDate(); const tf=document.getElementById('rapTiraj').value; db.ref('fiches').once('value',s=>{ let all=Object.values(s.val()||[]).filter(f=> f.vendeur===curUser.name && f.dateStr>=du && f.dateStr<=au ); if(tf) all=all.filter(f=> (f.tirajs||[]).includes(tf)); const vente=all.reduce((a,b)=>a+(b.total||0),0); const com=Math.round(vente*0.1); const apaye=all.reduce((a,b)=>a+(b.gain||0),0); const net=vente-com-apaye; const html=`RAPPORT ${curUser.name.toUpperCase()}<br>${du} Au ${au} - ${tf||'Tous'}<div class="sep"></div><div style="display:flex;justify-content:space-between"><span>Vente</span><span>${vente}$</span></div><div style="display:flex;justify-content:space-between"><span>Commission</span><span>${com}$</span></div><div style="display:flex;justify-content:space-between"><span>A payer</span><span>${apaye}$</span></div><div class="sep"></div><div style="display:flex;justify-content:space-between;font-size:18px"><span>Balance net</span><span>${net}$</span></div>`; document.getElementById('rapData').innerHTML=`<div class="ticket" id="rapTicket">${html}</div><button class="btn bK" onclick="printTicket(document.getElementById('rapTicket').innerHTML)">Imprimer</button>`; }); }
</script></body></html>
