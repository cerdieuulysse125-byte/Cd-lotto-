<!DOCTYPE html><html lang='ht'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>V13 Kaz Vid 75px</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#eef2f7}.h{background:#1e2a8a;color:#fff;padding:10px;display:flex;justify-content:space-between}.card{background:#fff;border-radius:12px;padding:12px;margin:8px}.row{display:flex;gap:16px;align-items:center;margin-bottom:10px}.kz{width:75px;height:46px;border:2px solid #1e2a8a;border-radius:8px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#fff}.kzT{width:240px;min-width:240px;justify-content:space-between;padding:0 10px;background:#fff;cursor:pointer}.inp{width:75px;min-width:75px;height:50px;border:2.5px solid #1e2a8a;border-radius:8px;font-weight:800;font-size:20px;text-align:center;background:#fff}.inp::placeholder{color:#bbb;font-size:14px}.btn{padding:14px;border:0;border-radius:10px;color:#fff;font-weight:800;width:100%}.btnG{background:#16a34a}.btnB{background:#1e2a8a}.btnR{background:#e11d48;width:50px;height:50px;border-radius:8px;border:0;color:#fff;font-weight:800}.total{background:#1e2a8a;color:#fff;border-radius:10px;padding:12px;display:flex;justify-content:space-between;font-weight:800;margin:8px}.tlist{display:none;position:fixed;left:90px;right:8px;top:120px;background:#fff;border:3px solid #1e2a8a;border-radius:12px;z-index:999;padding:6px;grid-template-columns:75px 75px;gap:8px;max-height:300px;overflow:auto}.tlist.open{display:grid}.topt{width:75px;height:62px;border:1px solid #ccc;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700}.page{display:none;padding-bottom:90px}.page.on{display:block}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #1e2a8a}.tab{flex:1;padding:14px;text-align:center;font-size:11px;font-weight:800}.tab.on{background:#1e2a8a;color:#fff}.prevView{background:#f0fdf4;border:2px solid #16a34a;border-radius:10px;padding:10px;margin:8px}</style></head><body>
<div class='h'><div><b id='vName'>Vandè</b><br><small id='vSer'>---</small></div><span id='dateH' style='font-size:11px'></span></div>

<div id='pV' class='page on' style='position:relative'>
<div class='card'><b>🎯 Tiraj - Chwazi (vid)</b><div class='row' style='margin-top:10px'><div class='kz'>Tiraj</div><div id='kazT' class='kz kzT' onclick='document.getElementById("tlist").classList.toggle("open")'><span id='txtT' style='color:#999'>VID - Chwazi</span><span>▼</span></div></div><div id='tlist' class='tlist'></div><div id='cnt' style='font-size:11px;color:#999;margin-top:6px'>Kaz vid - vandè a dwe chwazi</div></div>

<div class='card'>
<div class='row' style='font-size:10px;color:#666'><div style='width:75px;text-align:center'>Jeux<br>75px VID</div><div style='width:75px;text-align:center'>Boul<br>75px VID</div><div style='width:75px;text-align:center;margin-left:16px'>Miz<br>75px VID</div></div>
<div id='bets'></div>
<div id='boxList' class='prevView' style='display:none'><b style='font-size:12px;color:#16a34a'>📋 Lis Boul/Miz vandè a tape:</b><div id='listIn' style='margin-top:8px'></div></div>
<button class='btn btnB' style='margin-top:10px' onclick='addR()'>+ Liy VID (→ ↓)</button>
</div>

<div class='total'><span id='dt'>Total $0 x 0 = $0</span><span id='gt'>$0</span></div>
<div style='display:flex;gap:10px;margin:8px'><button class='btn btnG' style='flex:1;height:56px;font-size:20px' onclick='vann()'>VANN</button><button class='btn btnB' style='flex:1;height:56px;font-size:11px' onclick='printBT()'>🖨️ RawBT V2 Pro</button></div>
<div id='prev' style='background:#fff;margin:8px;padding:10px;font-family:monospace;white-space:pre-line;text-align:center;display:none;border:2px dashed #000'></div>
</div>

<script>
const TIRAJ=[["GA midi","12:15"],["FL midi","13:15"],["NY midi","14:15"],["Real","12:45"],["GA soir","18:15"],["FL soir","21:15"],["NY soir","22:15"],["Primera día","11:50"],["Suerte día","12:20"],["Lote Dom","13:45"],["Ganamas","14:15"],["Suerte noche","17:50"],["Primera noche","19:50"],["Loteka","19:45"],["Nacional noche","20:50"],["Leidsa","20:45"],["Anguila 10h","09:55"],["Anguila 18h","17:55"]];
let DB=JSON.parse(localStorage.getItem('cd-lotto-db')||'null')||{tickets:[],heures:{"GA midi":"12:00","FL midi":"13:00","NY midi":"14:00","Real":"12:30","GA soir":"18:00","FL soir":"21:00","NY soir":"22:00","Primera día":"11:30","Suerte día":"12:00","Lote Dom":"13:30","Ganamas":"14:00","Suerte noche":"17:30","Primera noche":"19:30","Loteka":"19:30","Nacional noche":"20:30","Leidsa":"20:30","Anguila 10h":"09:40","Anguila 18h":"17:40"}};
let selT=[];
function isOpen(n){let h=DB.heures[n];if(!h)return true;let now=new Date();let a=h.split(':');let c=new Date();c.setHours(parseInt(a[0]),parseInt(a[1]),0,0);return now < c}
function renderT(){let html='<div style="grid-column:1/-1;display:flex;justify-content:space-between;background:#1e2a8a;color:#fff;padding:6px;border-radius:6px"><b>LÈ FÈMTI</b><span onclick="document.getElementById(\'tlist\').classList.remove(\'open\')" style="background:red;padding:2px 10px;border-radius:4px">X</span></div>';TIRAJ.forEach(t=>{let open=isOpen(t[0]);let chk=selT.includes(t[0])?'checked':'';html+='<label class="topt" style="'+(open?'background:#dcfce7':'background:#fee2e2;opacity:.6')+'"><input type="checkbox" value="'+t[0]+'" '+chk+' '+(open?'':'disabled')+' onchange="chg(this)"><span>'+t[0]+'</span><small>'+(DB.heures[t[0]]||t[1])+' '+(open?'✅':'⛔')+'</small></label>'});document.getElementById('tlist').innerHTML=html}
function chg(el){if(!isOpen(el.value)&&el.checked){alert('⛔ '+el.value+' fèmen');el.checked=false;return}if(el.checked)selT.push(el.value);else selT=selT.filter(x=>x!=el.value);document.getElementById('txtT').innerText=selT.length?selT.length+' tiraj':'';document.getElementById('txtT').style.color=selT.length?'#000':'#999';if(!selT.length)document.getElementById('txtT').innerText='VID - Chwazi';document.getElementById('cnt').innerText=selT.length?selT.length+' tiraj':'Kaz vid - vandè a dwe chwazi';upd();if(selT.length)document.getElementById('tlist').classList.remove('open')}
function addR(k=''){let c=document.getElementById('bets');let d=document.createElement('div');d.className='row betRow';d.style.cssText='display:flex;gap:16px;align-items:center;margin-bottom:10px';d.innerHTML='<select class="kz jeu"><option value="">---</option><option value="boul">Boul</option><option value="maryaj">Mar</option><option value="loto3">L3</option><option value="loto4">L4</option><option value="loto5">L5</option></select><input class="inp boul" placeholder="" inputmode="numeric"><input class="inp mise" placeholder="" type="number" style="margin-left:16px"><button class="btnR" onclick="this.parentElement.remove();upd()">X</button>';c.appendChild(d);let b=d.querySelector('.boul'),m=d.querySelector('.mise'),j=d.querySelector('.jeu');if(k)j.value=k;b.addEventListener('input',function(){this.value=this.value.replace(/[^0-9xX]/g,'').slice(0,7);upd()});m.addEventListener('input',upd);b.focus()}
function upd(){let sum=0;let arr=[];document.querySelectorAll('.betRow').forEach(r=>{let j=r.querySelector('.jeu').value;let b=r.querySelector('.boul').value.trim();let m=parseInt(r.querySelector('.mise').value)||0;if(j&&b&&m){sum+=m;arr.push({j:j.toUpperCase(),b:b,m:m})}});let nb=selT.length;let g=sum*nb;document.getElementById('dt').innerText='Total $'+sum+' x '+nb+' = $'+g;document.getElementById('gt').innerText='$'+g;let box=document.getElementById('boxList');let lin=document.getElementById('listIn');if(arr.length>0){box.style.display='block';let h='';for(let i=0;i<arr.length;i++){let o=arr[i];h+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #ccc"><span style="display:flex;gap:16px"><b>'+(i+1)+'.</b><span style="width:50px">'+o.j+'</span><span style="width:75px;border:2px solid #1e2a8a;border-radius:6px;text-align:center">'+o.b+'</span><span style="width:75px;background:#fef08a;border:2px solid #1e2a8a;border-radius:6px;text-align:center;margin-left:16px">$'+o.m+'</span></span>✓</div>'}lin.innerHTML=h}else{box.style.display='none'}}
function build(tk){let now=new Date().toLocaleString('fr-FR');let txt=' C&D VERITE LOTTO\n '+now+'\n----------------------------\nTiraj: '+(tk.tirages.join(', ')||'VID')+'\nVandè: VID - Tape non\nId tikè: '+tk.id+'\n----------------------------\nJEU BOUL MIZ\n----------------------------\n';for(let i=0;i<tk.bets.length;i++){let b=tk.bets[i];txt+=b.type.toUpperCase().padEnd(6,' ')+b.numero.padEnd(8,' ')+'$'+b.mise+'\n'}txt+='----------------------------\nTOTAL $'+tk.baseTotal+' x '+tk.tirages.length+' = $'+tk.total+'\n----------------------------\n\n\n';return txt}
function vann(){if(selT.length==0){alert('Kaz Tiraj vid - vandè a dwe chwazi');return}let bets=[];document.querySelectorAll('.betRow').forEach(r=>{let j=r.querySelector('.jeu').value;let b=r.querySelector('.boul').value.trim();let m=parseInt(r.querySelector('.mise').value);if(j&&b&&m)bets.push({type:j,numero:b,mise:m})});if(bets.length==0){alert('Kaz Boul/Miz vid - vandè a dwe tape');return}let base=0;for(let i=0;i<bets.length;i++)base+=bets[i].mise;let tk={id:'T'+Date.now().toString().slice(-7),bets:bets,tirages:selT.slice(),baseTotal:base,total:base*selT.length,date:new Date().toISOString().slice(0,10)};DB.tickets.push(tk);localStorage.setItem('cd-lotto-db',JSON.stringify(DB));let txt=build(tk);document.getElementById('prev').style.display='block';document.getElementById('prev').innerText=txt;printBT(txt);document.getElementById('bets').innerHTML='';addR();upd()}
function printBT(t){let txt=t||document.getElementById('prev').innerText;if(!txt)return;let enc=encodeURIComponent(txt);window.location.href='rawbt://print?text='+enc;setTimeout(function(){window.location.href='intent://print?text='+enc+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'},700)}
document.getElementById('dateH').innerText=new Date().toLocaleDateString('fr-FR');renderT();addR();upd();
</script></body></html>
