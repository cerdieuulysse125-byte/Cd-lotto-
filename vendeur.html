<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D V106 FINAL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:900}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:12px;border:2px solid #000;border-radius:10px;width:100%;font-size:15px;margin:4px 0;background:#fff}.line{display:grid;grid-template-columns:75px 1fr 65px;gap:6px;margin:5px 0}.tiraj{padding:6px 10px;margin:3px;border:2px solid #000;border-radius:20px;font-weight:bold;display:inline-block;font-size:12px;cursor:pointer;text-align:center}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{background:#eee;color:#aaa;pointer-events:none;opacity:.5}.btn{padding:12px;width:100%;border:none;border-radius:10px;font-weight:900;font-size:15px;margin:6px 0}.bK{background:#000;color:#FFD700}.ticket{border:1.5px dashed #000;padding:12px;text-align:center;max-width:340px;margin:auto;font-family:monospace;font-size:13px}.tab2{display:flex;background:#000;gap:1px}.tab2 button{flex:1;padding:11px 2px;font-size:11px;font-weight:900;background:#000;color:#FFD700;border:none}.tab2 button.active{background:#FFD700;color:#000}.blocked{position:fixed;inset:0;background:rgba(0,0,0,.93);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;text-align:center;padding:20px}@media print{body *{visibility:hidden}#prt,#prt *{visibility:visible}#prt{position:absolute;left:0;top:0;width:100%}}</style>
</head><body>
<div class="h">C&D VÉRITÉ LOTTO - V106</div>
<div id="blockedBox" class="blocked" style="display:none"><div style="font-size:60px">🔒</div><h1>VANDEUR FERMÉ</h1><p id="blockedMsg"></p><button class="btn bK" style="max-width:200px" onclick="location.reload()">Réessayer</button></div>
<div id="loginBox" class="card" style="text-align:center;padding-top:30px"><h2>Connexion</h2><input id="uName" placeholder="Code vendeur"><input id="uPass" type="password" placeholder="Mot de passe" value="1234"><button class="btn bK" onclick="go()">Antre</button><div id="loginErr" style="color:red"></div></div>
<div id="appBox" style="display:none">
<div class="tab2"><button id="btnV" class="active" onclick="showTab('vendre')">Vendre</button><button id="btnC" onclick="showTab('kopyeTab')">Copier</button><button id="btnF" onclick="showTab('fichesTab')">Mes Fiches</button><button id="btnR" onclick="showTab('rapportTab')">Rapport</button></div>

<div id="vendre" class="card">
<div style="text-align:center;font-weight:900;font-size:12px">TIRAJ - <span id="dateToday" style="background:#FFD700;color:#000;padding:2px 6px;border-radius:6px"></span> - <span id="statusV" style="font-size:11px;padding:2px 6px;border-radius:6px;background:green;color:#fff">OUVE</span> <span style="font-size:9px;color:#666">↓ Enter = avanse</span></div>
<div id="tirajBox" style="text-align:center;margin:8px 0"></div>
<div style="display:flex;background:#000;color:#FFD700;padding:6px;font-weight:900;border-radius:6px;font-size:11px"><div style="width:75px">JEUX</div><div style="flex:1">BOUL</div><div style="width:65px">MIZ</div></div>
<div id="lines"></div>
<button class="btn" style="background:#222;color:#fff" onclick="addLine()">+ Liy</button>
<div style="background:#000;color:#fff;padding:10px;border-radius:10px;text-align:center;margin-top:6px">Total <span id="tot">0$</span> × <span id="nbT">1</span><div style="font-size:22px;color:#FFD700;font-weight:900">A PEYE <span id="paye">0$</span></div></div>
<button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button>
<div id="prt" style="display:none"></div>
</div>

<div id="kopyeTab" class="card" style="display:none"><h3>🔍 Copier Ticket (Nenpòt Ticket)</h3><input id="searchId" type="tel" placeholder="Tape ID 5 chif"><button class="btn bK" onclick="searchById()">Chèche</button><div id="resKopye"></div></div>
<div id="fichesTab" class="card" style="display:none"><h3>Mes Fiches Jodi a - <span id="mn"></span></h3><div id="listF"></div></div>

<div id="rapportTab" class="card" style="display:none">
<h3>📊 Rapport</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><label style="font-size:11px;font-weight:900">Du</label><input id="rapDu" type="date"></div><div><label style="font-size:11px;font-weight:900">Au</label><input id="rapAu" type="date"></div></div>
<div><label style="font-size:11px;font-weight:900">Tirage</label><select id="rapTiraj"><option value="">Tous</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select></div>
<button class="btn bK" onclick="genRapV()">Générer</button>
<div id="rapData" style="margin-top:10px"></div>
<button id="btnPrintRap" class="btn" style="background:#22c55e;color:#fff;display:none" onclick="printRap()">🖨️ Imprimer Rapport</button>
</div>
</div>

<script>
const firebaseConfig={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let curUser=null, selectedT=[], config={}, limites={}, gains={};
let tirajDef=[{id:'gaMidi',nom:'GA MIDI',h:'12:15'},{id:'flMidi',nom:'FL MIDI',h:'13:15'},{id:'nyMidi',nom:'NY MIDI',h:'14:15'},{id:'gaSoir',nom:'GA SOIR',h:'18:20'},{id:'flSoir',nom:'FL SOIR',h:'21:10'},{id:'nySoir',nom:'NY SOIR',h:'21:30'}];
function getHaitiDate(){ const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getESTHM(){ const now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return now.getHours()*60+now.getMinutes(); }
function go(){
  const u=document.getElementById('uName').value.trim().toLowerCase(); const p=document.getElementById('uPass').value.trim();
  if(!u) return document.getElementById('loginErr').innerText="Mete kòd";
  db.ref('vendors/'+u).once('value',s=>{
    if(s.exists()){
      const v=s.val(); if(v.pass && v.pass!==p){ document.getElementById('loginErr').innerText="Modpas pa bon"; return; }
      if((v.status||'OUVE')==='FERME'){ document.getElementById('blockedBox').style.display='flex'; document.getElementById('blockedMsg').innerText="Proprio fèmen "+u.toUpperCase(); return; }
    }
    curUser={name:u}; initApp();
  });
}
function initApp(){
  document.getElementById('loginBox').style.display='none'; document.getElementById('appBox').style.display='block';
  document.getElementById('mn').innerText=curUser.name; document.getElementById('dateToday').innerText=getHaitiDate();
  document.getElementById('rapDu').value=getHaitiDate(); document.getElementById('rapAu').value=getHaitiDate();
  db.ref('config').on('value',snap=>{ config=snap.val()||{}; limites=config.limites||{}; gains=config.gains||{}; renderTiraj(); checkBlocked(); });
  document.getElementById('lines').innerHTML=''; for(let i=0;i<4;i++) addLine();
  setInterval(checkBlocked,12000);
}
function renderTiraj(){
  const he=config.heures||{}; const ti=config.tirages||{}; let html=''; const cur=getESTHM();
  tirajDef.forEach(t=>{
    const realH=he[t.id]||t.h; const [hh,mm]=realH.split(':').map(Number); const m=hh*60+mm;
    const ferme=ti[t.id]==='FERME' || cur>=m; const active=selectedT.includes(t.nom);
    html+=`<span class="tiraj ${active?'active':''} ${ferme?'ferme':''}" onclick="toggleTiraj('${t.nom}')">${t.nom}<br><small>${realH}</small></span>`;
  });
  document.getElementById('tirajBox').innerHTML=html; calc();
}
function toggleTiraj(nom){ if(selectedT.includes(nom)) selectedT=selectedT.filter(x=>x!==nom); else selectedT.push(nom); renderTiraj(); }
function checkBlocked(){
  if(!curUser) return;
  db.ref('vendors/'+curUser.name+'/status').once('value',s=>{ if(s.exists()&&s.val()==='FERME'){ document.getElementById('blockedBox').style.display='flex'; document.getElementById('appBox').style.display='none'; document.getElementById('blockedMsg').innerText="Proprio fèmen "+curUser.name.toUpperCase(); } });
  renderTiraj();
}
function addLine(){
  const div=document.createElement('div'); div.className='line';
  div.innerHTML=`<select class="j"><option value="bolet">Bolet</option><option value="maryaj">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select><input class="b" type="tel" inputmode="numeric" placeholder="BOUL" maxlength="5"><input class="m" type="tel" inputmode="numeric" placeholder="G">`;
  document.getElementById('lines').appendChild(div); attachFlech(div);
}
function attachFlech(row){
  const j=row.querySelector('.j'), b=row.querySelector('.b'), m=row.querySelector('.m');
  [j,b,m].forEach((inp,idx)=>{
    inp.addEventListener('input',e=>{
      if(inp!==j) e.target.value=e.target.value.replace(/[^0-9]/g,'');
      // Limite mise
      if(idx===2){ const type=j.value; const lim=limites[type]; if(lim && parseInt(e.target.value)>lim){ alert('Limit '+type+' se '+lim+'$'); e.target.value=lim; } }
      calc();
    });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter' || e.key==='ArrowDown' || e.key==='ArrowRight'){
        e.preventDefault();
        if(idx===0){ b.focus(); b.select(); }
        else if(idx===1){ m.focus(); m.select(); }
        else {
          const all=[...document.querySelectorAll('#lines.line')]; const curRow=all.indexOf(row);
          let next=all[curRow+1]; if(!next){ addLine(); next=document.querySelectorAll('#lines.line')[curRow+1]; }
          if(next){ next.querySelector('.b').focus(); }
        }
      }
      if(e.key==='ArrowUp' || e.key==='ArrowLeft'){
        e.preventDefault();
        if(idx===2){ b.focus(); } else if(idx===1){ j.focus(); }
        else { const all=[...document.querySelectorAll('#lines.line')]; const curRow=all.indexOf(row); if(curRow>0){ all[curRow-1].querySelector('.m').focus(); } }
      }
    });
  });
}
function calc(){ let tot=0; document.querySelectorAll('#lines.line').forEach(r=>{ tot+=parseInt(r.querySelector('.m').value)||0; }); const nb=selectedT.length||1; document.getElementById('tot').innerText=tot+"$"; document.getElementById('nbT').innerText=nb; document.getElementById('paye').innerText=(tot*nb)+"$"; }
function showTab(id){ ['vendre','kopyeTab','fichesTab','rapportTab'].forEach(x=>document.getElementById(x).style.display='none'); document.getElementById(id).style.display='block'; document.querySelectorAll('.tab2 button').forEach(b=>b.classList.remove('active')); document.getElementById('btn'+id.charAt(0).toUpperCase()).classList.add('active'); if(id==='fichesTab') loadFiches(); if(id==='rapportTab') genRapV(); }
function loadFiches(){ const today=getHaitiDate(); db.ref('fiches').orderByChild('dateStr').equalTo(today).once('value',s=>{ if(!s.exists()){document.getElementById('listF').innerHTML="Pa gen";return;} let html=''; Object.values(s.val()).filter(f=>f.vendeur===curUser.name).reverse().forEach(f=>{ const w=f.gain?`<b style="color:green"> WIN:${f.gain}$</b>`:''; html+=`<div style="border:1px solid #ccc;padding:6px;margin:4px 0;border-radius:8px;font-size:12px"><b>${(f.tirajs||[]).join('/')} - ${f.total}$</b>${w}<br>${(f.details||[]).map(d=>d.boul+' '+d.montan+'$').join(', ')}</div>`; }); document.getElementById('listF').innerHTML=html; }); }
function enteteHTML(){ const d=new Date().toLocaleString("en-US",{timeZone:"America/New_York"}); return `<div style="text-align:center;font-weight:900">C&D VÉRITÉ LOTTO<br><span style="font-size:10px">${d}</span></div>`; }
function vann(){
  if(selectedT.length===0){alert('Chwazi tiraj');return;}
  let details=[]; document.querySelectorAll('#lines.line').forEach(r=>{ const j=r.querySelector('.j').value; const b=r.querySelector('.b').value.trim(); const m=parseInt(r.querySelector('.m').value)||0; if(b&&m) details.push({type:j,boul:b,montan:m}); });
  if(details.length===0){alert('Mete boul');return;}
  const base=details.reduce((a,b)=>a+b.montan,0); const total=base*selectedT.length; const id=db.ref('fiches').push().key;
  db.ref('fiches/'+id).set({id:id,vendeur:curUser.name,tirajs:selectedT,details:details,total:total,totalBase:base,nbTiraj:selectedT.length,date:new Date().toISOString(),dateStr:getHaitiDate(),gain:0}).then(()=>{
    const corps=details.map(d=>`${d.type.toUpperCase()} ${d.boul} - ${d.montan}$ x${selectedT.length}`).join('<br>');
    const html=`<div class="ticket">${enteteHTML()}<br>Tirage: ${selectedT.join('/')}<br>Id: ${id.slice(-5).toUpperCase()}<br>......................................<br>${corps}<br>......................................<br>Total: ${total}$<br><br>Bonne chance!</div>`;
    document.getElementById('prt').innerHTML=html; window.print();
    document.querySelectorAll('#lines.line').forEach(r=>{ r.querySelector('.b').value=''; r.querySelector('.m').value=''; }); calc();
  });
}
function searchById(){ const q=document.getElementById('searchId').value.trim().toLowerCase(); if(!q) return; db.ref('fiches').once('value',s=>{ if(!s.exists()) return; const f=Object.values(s.val()).find(x=>x.id.toLowerCase().includes(q)||x.id.slice(-5).toLowerCase()===q); if(!f){document.getElementById('resKopye').innerHTML="Pa jwenn";return;} document.getElementById('resKopye').innerHTML=`<div style="background:#dcfce7;padding:10px;border-radius:8px"><b>${f.id.slice(-5).toUpperCase()} - ${f.total}$ - ${(f.tirajs||[]).join('/')}</b><br><button class="btn bK" onclick="kopye('${f.id}')">Kopye Ticket Sa</button> <button class="btn bK" onclick="reprint('${f.id}')">Print</button></div>`; }); }
function kopye(id){ db.ref('fiches/'+id).once('value',s=>{ const f=s.val(); selectedT=f.tirajs||[]; document.getElementById('lines').innerHTML=''; f.details.forEach(d=>{ addLine(); const rows=document.querySelectorAll('#lines.line'); const row=rows[rows.length-1]; row.querySelector('.j').value=d.type; row.querySelector('.b').value=d.boul; row.querySelector('.m').value=d.montan; }); renderTiraj(); calc(); showTab('vendre'); }); }
function reprint(id){ db.ref('fiches/'+id).once('value',s=>{ const f=s.val(); const html=`<div class="ticket">${enteteHTML()}<br>Tirage: ${(f.tirajs||[]).join('/')}<br>Id: ${f.id.slice(-5).toUpperCase()}<br>......................................<br>${(f.details||[]).map(d=>`${d.type.toUpperCase()} ${d.boul} ${d.montan}$`).join('<br>')}<br>......................................<br>Total: ${f.total}$<br><br>Bonne chance!</div>`; document.getElementById('prt').innerHTML=html; window.print(); }); }
function genRapV(){
  const du=document.getElementById('rapDu').value||getHaitiDate(); const au=document.getElementById('rapAu').value||getHaitiDate(); const tf=document.getElementById('rapTiraj').value;
  db.ref('fiches').once('value',s=>{
    if(!s.exists()){ document.getElementById('rapData').innerHTML="Pa gen fich"; return; }
    let all=Object.values(s.val()).filter(f=> f.vendeur===curUser.name && f.dateStr>=du && f.dateStr<=au );
    if(tf) all=all.filter(f=> (f.tirajs||[]).includes(tf));
    const vente=all.reduce((a,b)=>a+(b.total||0),0); const com=Math.round(vente*0.1); const apaye=all.reduce((a,b)=>a+(b.gain||0),0); const net=vente-com-apaye;
    document.getElementById('rapData').innerHTML=`<div id="zonePrintRap"><div style="text-align:center;font-weight:900;border-bottom:2px dashed #000;padding-bottom:6px">C&D VÉRITÉ LOTTO<br>RAPPORT ${curUser.name.toUpperCase()}<br>${du} Au ${au} - ${tf||'Tous'}</div><div style="margin-top:8px;line-height:26px"><div style="display:flex;justify-content:space-between"><span>Vente</span><b>${vente}$</b></div><div style="display:flex;justify-content:space-between"><span>Commission (10%)</span><b>${com}$</b></div><div style="display:flex;justify-content:space-between"><span>A payer</span><b style="color:green">${apaye}$</b></div><div style="display:flex;justify-content:space-between;font-weight:900;font-size:18px;border-top:2px solid #000;margin-top:6px;padding-top:6px"><span>Balance net</span><span>${net}$</span></div><div style="text-align:center;margin-top:6px;font-size:12px">Fiches: ${all.length}</div></div></div>`;
    document.getElementById('btnPrintRap').style.display='block';
  });
}
function printRap(){ document.getElementById('prt').innerHTML=`<div class="ticket">${document.getElementById('zonePrintRap').innerHTML}</div>`; window.print(); }
</script></body></html>
