<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VANDE V10.8 - FOTO FORM - JEAN - FLÈCH ↓</title>
<style>
*{box-sizing:border-box;font-family:Arial Black,Arial;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#fff;touch-action:manipulation;overflow-x:hidden}
.top1{background:#FFD500;color:#000;text-align:center;padding:16px 5px;font-weight:900;font-size:18px;border-bottom:3px solid #000}
.top2{background:#000;color:#FFD500;text-align:center;padding:10px 5px;font-weight:900;font-size:12px}
.menu{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 0.8fr;gap:3px;padding:3px;background:#000}
.menu button{padding:14px 2px;font-weight:900;font-size:12px;border:3px solid #000;background:#fff;cursor:pointer}
.menu button.active{background:#FFD500}.menu button.red{background:red;color:#fff}
.alertJaune{background:#FFD500;border:3px solid red;border-radius:30px;padding:14px;text-align:center;font-weight:900;font-size:13px;margin:12px 8px;line-height:1.3}
.tiraj{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 8px}
.tiraj label{border:3px solid #000;border-radius:50px;padding:18px 5px;text-align:center;font-weight:900;font-size:13px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:56px}
.tiraj input{display:none}.tiraj input:checked+label{background:#FFD500}
.infoTiraj{border:3px solid #000;border-radius:50px;padding:16px;text-align:center;font-weight:900;font-size:12px;margin:12px 8px;background:#fff}
.ligne{display:grid;grid-template-columns:0.9fr 0.8fr 0.7fr 0.5fr 0.5fr;gap:8px;margin:10px 8px;align-items:center}
.kaz{border:3px solid #000;border-radius:50px;height:60px;text-align:center;font-weight:900;font-size:16px;width:100%;background:#fff}
.kaz:focus{background:#FFD500;outline:none}
.kazMiz{background:#FFD500}.kazMiz:focus{background:#FFD500}
.btnRond{border:3px solid #000;border-radius:50%;height:60px;width:60px;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btnX{background:#fff;color:red;border-color:red}.btnFlech{background:#FFD500;color:#000}
.totalBar{border:3px solid #000;border-radius:50px;padding:16px;text-align:center;font-weight:900;font-size:12px;margin:12px 8px;background:#fff}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 8px}
.btnBig{border:3px solid #000;border-radius:50px;height:66px;font-weight:900;font-size:13px;cursor:pointer}
.btnVal{background:#000;color:#FFD500}.btnPrint{background:#0A8A00;color:#FFD500}
.listFich{margin:8px;border:3px solid #000;border-radius:20px;padding:10px;min-height:40px;background:#FFF8DC}
.badge{display:inline-block;background:#fff;border:2px solid #000;border-radius:14px;padding:6px 10px;font-weight:900;font-size:11px;margin:4px}
#printArea{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;display:block!important;background:#fff}}
</style>
</head>
<body>
<div class="top1">VENDEUR - <span id="nomV">Jean</span> - <span id="pourV">10%</span> - MODEPAS OK</div>
<div class="top2"><span id="dateTop">2026-08-19</span> | <span id="nomTop">Jean</span> | <span id="pourTop">10%</span> | EST PAP | MODPAS RESPEKTE</div>

<div class="menu">
<button type="button" class="active">1.VENTE</button>
<button type="button">2.COPIER</button>
<button type="button">3.FICHES</button>
<button type="button">4.RAPPORT</button>
<button type="button" class="red">X</button>
</div>

<div class="alertJaune">L'heure fermeture (heure de l'est, Port au Prince) respekte:<br>Tout ouvè EST PAP</div>

<div class="tiraj" id="tirajBox">
<input type="checkbox" value="GA MIDI" id="t1"><label for="t1" id="l1">GA MIDI</label>
<input type="checkbox" value="FL MIDI" id="t2"><label for="t2" id="l2">FL MIDI ✓</label>
<input type="checkbox" value="NY MIDI" id="t3"><label for="t3" id="l3">NY MIDI</label>
<input type="checkbox" value="GA SOIR" id="t4"><label for="t4" id="l4">GA SOIR</label>
<input type="checkbox" value="FL SOIR" id="t5"><label for="t5" id="l5">FL SOIR</label>
<input type="checkbox" value="NY SOIR" id="t6"><label for="t6" id="l6">NY SOIR</label>
</div>

<div class="infoTiraj" id="infoTiraj">FL MIDI ✓ EST PAP - 2026-08-19</div>

<div id="lignesContainer"></div>

<div class="totalBar" id="totalBar">Total ×tiraj - $0 × 1 = $0 - Flèche ↓ kenbe je - EST PAP</div>

<div class="listFich" id="listFich" style="display:none"></div>

<div class="btns">
<button type="button" class="btnBig btnVal" id="btnVal">💾 VALIDER</button>
<button type="button" class="btnBig btnPrint" id="btnPrint">🖨️ VALIDER + IMPRIMER</button>
</div>

<div id="printArea"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
const vendeurActif=localStorage.getItem("vendeur")||"Jean";
document.getElementById('nomV').innerText=vendeurActif; document.getElementById('nomTop').innerText=vendeurActif;
let pourActif=10; try{const s=await get(ref(db,`vendeurs`)); if(s.exists()) Object.values(s.val()).forEach(v=>{if(v.nom==vendeurActif) pourActif=v.pour||10});}catch(e){}
document.getElementById('pourV').innerText=pourActif+"%"; document.getElementById('pourTop').innerText=pourActif+"%";
function getDatePAP(){return new Intl.DateTimeFormat('en-CA',{timeZone:"America/Port-au-Prince",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}
function getHeurePAP(){const d=new Date(); const s=new Intl.DateTimeFormat('en-CA',{timeZone:"America/Port-au-Prince",hour:"2-digit",minute:"2-digit",hour12:false}).format(d); const [h,m]=s.split(':').map(Number); return h*60+m;}
function normM(b){if(!b) return ""; b=b.toString().trim().toLowerCase().replace(/[^0-9x]/g,''); if(!b.includes('x')&&b.length==4) b=b.slice(0,2)+'x'+b.slice(2); const p=b.split('x').filter(x=>x!=""); if(p.length!=2) return b; return [p[0].padStart(2,'0'),p[1].padStart(2,'0')].sort().join('x');}
document.getElementById('dateTop').innerText=getDatePAP();
let tirajChwazi=["FL MIDI"]; // default jan foto a
let lignes=[{type:"BOLET",boul:"",miz:""}];

function chifSelman(val, type){
  if(type=="MARYAJ") return val.replace(/[^0-9xX]/g,'').toLowerCase();
  return val.replace(/[^0-9]/g,'');
}

function renderLignes(){
  const cont=document.getElementById('lignesContainer'); cont.innerHTML="";
  lignes.forEach((l,i)=>{
    const div=document.createElement('div'); div.className="ligne";
    div.innerHTML=`
      <select class="kaz" id="type-${i}" style="font-size:12px"><option value="BOLET" ${l.type=="BOLET"?"selected":""}>BOLET</option><option value="MARYAJ" ${l.type=="MARYAJ"?"selected":""}>MARYAJ</option><option value="LOTO3" ${l.type=="LOTO3"?"selected":""}>LOTO3</option><option value="LOTO4" ${l.type=="LOTO4"?"selected":""}>LOTO4</option><option value="LOTO5" ${l.type=="LOTO5"?"selected":""}>LOTO5</option></select>
      <input class="kaz" id="boul-${i}" placeholder="Boul" inputmode="numeric" value="${l.boul}" autocomplete="off">
      <input class="kaz kazMiz" id="miz-${i}" placeholder="Miz" inputmode="numeric" value="${l.miz}" autocomplete="off">
      <button type="button" class="btnRond btnX" id="x-${i}">X</button>
      <button type="button" class="btnRond btnFlech" id="down-${i}">↓</button>
    `;
    cont.appendChild(div);
  });
  lignes.forEach((l,i)=>{
    const typeEl=document.getElementById(`type-${i}`);
    const boulEl=document.getElementById(`boul-${i}`);
    const mizEl=document.getElementById(`miz-${i}`);
    typeEl.addEventListener('change',()=>{lignes[i].type=typeEl.value; if(typeEl.value=="MARYAJ") boulEl.placeholder="12x34"; else boulEl.placeholder="Boul"; boulEl.focus();});
    boulEl.addEventListener('input',()=>{ boulEl.value=chifSelman(boulEl.value, lignes[i].type); lignes[i].boul=boulEl.value; updateTotal();});
    mizEl.addEventListener('input',()=>{ mizEl.value=chifSelman(mizEl.value, "BOLET"); lignes[i].miz=mizEl.value; updateTotal();});
    // FLÈCH - TOUCHE POU AVANSE A LA LIGNE SUIVANTE - A DROITE, AN BA - KENBE JE SELEKSYONE
    boulEl.addEventListener('keydown',(e)=>{
      if(e.key=="Enter" || e.key=="ArrowRight"){ e.preventDefault(); mizEl.focus(); }
      if(e.key=="ArrowDown"){ e.preventDefault(); addNewLigne(i); }
    });
    mizEl.addEventListener('keydown',(e)=>{
      if(e.key=="Enter" || e.key=="ArrowDown"){ e.preventDefault(); addNewLigne(i); }
      if(e.key=="ArrowLeft"){ e.preventDefault(); boulEl.focus(); }
      if(e.key=="ArrowRight"){ e.preventDefault(); addNewLigne(i); }
    });
    document.getElementById(`x-${i}`).addEventListener('click',()=>{ if(lignes.length>1){lignes.splice(i,1);}else{lignes[i]={type:lignes[i].type,boul:"",miz:""};} renderLignes(); updateTotal(); });
    document.getElementById(`down-${i}`).addEventListener('click',()=>{ addNewLigne(i); });
    document.getElementById(`down-${i}`).addEventListener('touchend',()=>{ addNewLigne(i); });
  });
  if(lignes.length>0) document.getElementById(`boul-${lignes.length-1}`).focus();
}

function addNewLigne(fromIndex){
  // VALIDE LIGNE KOUNYA ANTES AVANSE - CHIF SÈLMAN
  const l=lignes[fromIndex];
  if(l.boul.trim()=="" || l.miz.trim()=="") { alert("Antre Boul + Miz - Chif sèlman"); return; }
  // DOUBLE LIMIT V9.8 CHECK
  checkDoubleLimit(l).then(ok=>{
    if(!ok) return;
    // AJOUTE NOUVO LIGNE - KENBE JE SELEKSYONE (tirajChwazi rete menm)
    const newType=l.type; // KENBE JE - menm tip je
    lignes.splice(fromIndex+1,0,{type:newType,boul:"",miz:""});
    renderLignes(); updateTotal();
  });
}

async function checkDoubleLimit(ligne){
  let boul=ligne.boul; if(ligne.type=="MARYAJ") boul=normM(boul); const miz=parseInt(ligne.miz)||0; const type=ligne.type; const dateStr=getDatePAP();
  try{
    const snapLimV=await get(ref(db,`limites/${vendeurActif}`)); const maxV=snapLimV.exists()?parseInt(snapLimV.val()[type]||999999):999999;
    const snapLimG=await get(ref(db,`limites_global`)); const maxG=snapLimG.exists()?parseInt(snapLimG.val()[type]||999999):999999;
    const snapAll=await get(ref(db,`ventes/${dateStr}`)); let dejaV=0, dejaG=0;
    if(snapAll.exists()){
      Object.entries(snapAll.val()).forEach(([vNom,vFiches])=>{
        Object.values(vFiches).forEach(fiche=>{
          fiche.fiches.forEach(f=>{
            if(f.type!=type) return;
            let match=false; if(type=="MARYAJ") match=normM(f.boul)==normM(boul); else match=f.boul==boul;
            if(match){ if(vNom==vendeurActif) dejaV+=parseInt(f.miz)||0; dejaG+=parseInt(f.miz)||0; }
          });
        });
      });
    }
    lignes.forEach(l=>{
      if(l.boul==""||l.miz=="") return; if(l==ligne) return;
      if(l.type!=type) return; let m=false; if(type=="MARYAJ") m=normM(l.boul)==normM(boul); else m=l.boul==boul;
      if(m){ dejaV+=parseInt(l.miz)||0; dejaG+=parseInt(l.miz)||0; }
    });
    if((dejaV+miz)>maxV){alert(`⛔ LIMIT PA VANDÈ\n${type} ${boul}\nMax ${vendeurActif}: ${maxV}$\nDeja: ${dejaV}$`); return false;}
    if((dejaG+miz)>maxG){alert(`⛔ LIMIT GLOBAL VANDE 1+2+...\n${type} ${boul}\nMax Global: ${maxG}$\nDeja Global: ${dejaG}$`); return false;}
  }catch(e){}
  return true;
}

function updateTotal(){
  let sum=0; lignes.forEach(l=>{if(l.boul!=""&&l.miz!="") sum+=parseInt(l.miz)||0;});
  const nb=tirajChwazi.length||1; const tot=sum*nb;
  document.getElementById('totalBar').innerText=`Total ×tiraj - $${sum} × ${nb} = $${tot} - Flèche ↓ kenbe je - EST PAP`;
}

document.querySelectorAll('.tiraj input').forEach(inp=>{
  inp.addEventListener('change',()=>{
    tirajChwazi=Array.from(document.querySelectorAll('.tiraj input:checked')).map(i=>i.value);
    // UPDATE LABEL ✓
    document.querySelectorAll('.tiraj label').forEach(lbl=>{lbl.innerText=lbl.innerText.replace(' ✓','');});
    tirajChwazi.forEach(t=>{const id={ "GA MIDI":"l1","FL MIDI":"l2","NY MIDI":"l3","GA SOIR":"l4","FL SOIR":"l5","NY SOIR":"l6"}[t]; if(id) document.getElementById(id).innerText=t+" ✓";});
    const txt=tirajChwazi.length>0?tirajChwazi.join(' + ')+" ✓ EST PAP - "+getDatePAP():"Chwazi tiraj - EST PAP"; document.getElementById('infoTiraj').innerText=txt; updateTotal();
  });
});
// INIT TIRAJ FL MIDI coche jan foto
document.getElementById('t2').checked=true; updateTotal();

window.valider=async function(doPrint){
  const valides=lignes.filter(f=>f.boul.trim()!=""&&f.miz.trim()!="").map(f=>({...f,boul:f.type=="MARYAJ"?normM(f.boul):f.boul}));
  if(valides.length==0){alert("Pa gen fich");return;} if(tirajChwazi.length==0){alert("Chwazi tiraj");return;}
  const dateStr=getDatePAP(); const cur=getHeurePAP(); const snapH=await get(ref(db,`heures`));
  if(snapH.exists()){const h=snapH.val(); for(let t of tirajChwazi){const hm=h[t.replace(' ','_')]; if(!hm) continue; const [hh,mm]=hm.split(':').map(Number); if(cur>hh*60+mm){alert(`FÈMÈ ${t} - ${hm} EST PAP`);return;}}}
  const id="T-"+Date.now().toString().slice(-6); const tot=valides.reduce((s,f)=>s+(parseInt(f.miz)||0),0)*tirajChwazi.length;
  await push(ref(db,`ventes/${dateStr}/${vendeurActif}`),{id,tiraj:tirajChwazi,fiches:valides,total:tot,date:dateStr,timestamp:Date.now(),vendeur:vendeurActif});
  // FICH AK PLIS ESPAS + BON CHANS
  const fichLignes=valides.map(f=>`<div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px dashed #999"><span style="width:100px;text-align:left;font-size:18px">${f.type}</span><span style="flex:1;text-align:center;font-size:20px;font-weight:900;letter-spacing:2px">${f.boul}</span><span style="width:70px;text-align:right;font-size:18px">$${f.miz}</span></div>`).join('');
  const html=`<div style="text-align:center;font-family:monospace;font-weight:900;width:320px;margin:0 auto;color:#000;background:#fff;padding:12px"><div style="font-size:22px">C&D VÉRITÉ LOTTO</div><div style="font-size:14px;margin-top:10px">Date ${dateStr} EST PAP</div><div style="font-size:14px">Tirages ${tirajChwazi.join('/')} </div><div style="font-size:14px">Responsable ${vendeurActif}</div><div style="font-size:14px">Ticket ${id}</div><div style="margin:14px 0">----------------</div><div style="text-align:left">${fichLignes}</div><div style="margin:14px 0">----------------</div><div style="font-size:20px">TOTAL $${tot}</div><div style="margin-top:32px;font-size:17px;text-transform:lowercase">bòn chans, lave chodyè w</div></div>`;
  const pa=document.getElementById('printArea'); pa.innerHTML=html; pa.style.display='block'; if(doPrint) setTimeout(()=>{window.print(); pa.style.display='none';},300);
  lignes=[{type:"BOLET",boul:"",miz:""}]; renderLignes(); updateTotal();
}

document.getElementById('btnVal').addEventListener('click',()=>valider(false));
document.getElementById('btnPrint').addEventListener('click',()=>valider(true));
renderLignes();
</script>
</body>
</html>
