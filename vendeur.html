<!DOCTYPE html>
<html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V116.0 FINAL TIRAJ + JEUX</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}
.h{background:#000;color:#FFD700;padding:8px;text-align:center;font-weight:900;font-size:10px}
.card{padding:8px;max-width:500px;margin:auto;background:#fff}
input,select{padding:12px;border:2px solid #000;border-radius:10px;width:100%;font-size:15px;margin:2px 0}
.tiraj{padding:7px 12px;margin:4px;border:2px solid #000;border-radius:20px;font-weight:900;display:inline-block;font-size:11px;cursor:pointer;background:#fff}
.tiraj.active{background:#000;color:#FFD700}
.tiraj.ferme{opacity:.3;pointer-events:none;background:#ccc;border-color:#999;text-decoration:line-through}
.ligne{display:flex;gap:6px;align-items:center;margin:6px 0}
.btn{padding:13px;width:100%;border:none;border-radius:10px;font-weight:900;margin:6px 0;cursor:pointer}
.bK{background:#000;color:#FFD700}.bV{background:#16a34a;color:#fff}
.tab2{display:flex;background:#000;gap:1px;position:sticky;top:0;z-index:30}
.tab2 button{flex:1;padding:12px 2px;font-size:11px;font-weight:900;background:#000;color:#FFD700;border:none}
.tab2 button.active{background:#FFD700;color:#000}
.headL{display:flex;background:#000;color:#FFD700;padding:10px;font-weight:900;border-radius:8px;font-size:12px;margin:8px 0}
#fermeOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);color:#fff;z-index:9999;display:none;justify-content:center;align-items:center;text-align:center;padding:20px}
</style>
</head><body>
<div id="fermeOverlay"><div><div style="font-size:70px">🔒</div><div style="font-size:28px;font-weight:900;color:#ef4444">BANK FERME</div><div style="margin-top:10px" id="fermeMsg">Proprio fèmen bank la pou kounya</div></div></div>

<div class="h">V116.0 - GA MIDI FL MIDI NY MIDI - GA SOIR FL SOIR NY SOIR</div>
<div id="loginBox" class="card" style="text-align:center;padding-top:30px"><h3>Connexion Vendeur</h3><input id="uName" placeholder="Code"><input id="uPass" type="password" placeholder="Modpas"><button class="btn bK" onclick="go()">Antre</button><div id="loginErr" style="color:red;font-weight:900"></div></div>

<div id="appBox" style="display:none">
<div class="tab2"><button id="tV" class="active" onclick="showTab('vendre')">1.Vendre</button><button id="tC" onclick="showTab('kopyeTab')">2.Copier</button><button id="tF" onclick="showTab('fichesTab')">3.Fiches</button><button id="tR" onclick="showTab('rapportTab')">4.Rapport</button></div>

<div id="vendre" class="card">
<div style="text-align:center;font-weight:900;font-size:11px;margin:6px">TIRAJ - <span id="dateToday" style="background:#FFD700;padding:3px 8px;border-radius:5px"></span> - <span id="userShow" style="background:#000;color:#FFD700;padding:3px 8px;border-radius:5px"></span></div>
<div id="limitMsg"></div>
<div id="tirajBox" style="text-align:center;margin:8px 0"></div>
<div class="headL"><div style="width:95px">JEUX</div><div style="flex:1">BOUL</div><div style="width:85px">MIZ</div></div>
<div id="lines"></div>
<div style="background:#000;color:#fff;padding:12px;border-radius:10px;text-align:center;margin-top:8px">Total <span id="tot">0$</span> × <span id="nbT">1</span><div style="font-size:26px;color:#FFD700;font-weight:900">A PEYE <span id="paye">0$</span></div></div>
<button class="btn bK" id="btnVendre" onclick="vann()">VENDRE & IMPRIMER</button>
<div id="lastTicket"></div>
</div>

<div id="kopyeTab" class="card" style="display:none"><h3>Copier - ID 5 lèt</h3><div style="display:flex;gap:5px"><input id="searchId" placeholder="A1B2C" style="text-transform:uppercase"><button class="btn bK" style="width:90px" onclick="searchById()">Chèche</button></div><div id="kopyeResult"></div><button class="btn bV" onclick="showTab('vendre')">↩️ RETOUNEN NAN VENDRE</button></div>
<div id="fichesTab" class="card" style="display:none"><h3>Fiches</h3><div id="fichesList"></div><button class="btn bV" onclick="showTab('vendre')">↩️ RETOUNEN NAN VENDRE</button></div>
<div id="rapportTab" class="card" style="display:none"><h3>Rapò</h3><div style="display:flex;gap:5px"><div style="flex:1"><label>Du</label><input type="date" id="du"></div><div style="flex:1"><label>Au</label><input type="date" id="au"></div></div><select id="rapportTiraj" style="margin-top:6px"><option value="tous">Tous Tiraj</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><button class="btn bK" onclick="genererRapport()">Générer</button><div id="rapportContent" style="background:#f9f9f9;padding:10px;border-radius:8px;border:2px solid #000;margin-top:6px">Vente: <b id="rVente">0$</b><br>Commission: <b id="rCom">0$</b><br>A Payer: <b id="rPaye">0$</b><br>Balance Net: <b id="rNet">0$</b></div><button class="btn bK" onclick="window.print()">🖨️ Imprimer</button><button class="btn bV" onclick="showTab('vendre')">↩️ RETOUNEN NAN VENDRE</button></div>
</div>

<script>
const firebaseConfig = { databaseURL: "https://verite-lotto-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig); const db = firebase.database();

// TIRAJ + LÈ FÈMEN - Ou ka chanje lè yo isit
const TIRAJ_CONFIG = [
  {name:"GA MIDI", close:"12:15"},
  {name:"FL MIDI", close:"12:30"},
  {name:"NY MIDI", close:"13:15"},
  {name:"GA SOIR", close:"18:30"},
  {name:"FL SOIR", close:"21:30"},
  {name:"NY SOIR", close:"21:15"}
];
const JEUX_LIST = ["Borlettes","Mariage","Loto3","Loto4","Loto5"];
let selectedTiraj=[]; let USER="";

function go(){
  let u=document.getElementById('uName').value.trim();
  if(!u){document.getElementById('loginErr').innerText="Mete kòd";return;}
  USER=u;
  document.getElementById('loginBox').style.display='none';
  document.getElementById('appBox').style.display='block';
  document.getElementById('dateToday').innerText=new Date().toLocaleDateString('fr-FR');
  document.getElementById('userShow').innerText=USER;
  initApp(); checkBankStatus();
  history.pushState(null,null,location.href);
}

function checkBankStatus(){
  // Tcheke si proprio fèmen bank la nan Firebase
  db.ref('config/bankOpen').on('value', snap=>{
    if(snap.val()===false){
      document.getElementById('fermeOverlay').style.display='flex';
    } else {
      document.getElementById('fermeOverlay').style.display='none';
    }
  });
}

function initApp(){
  let tb=document.getElementById('tirajBox'); tb.innerHTML="";
  let now = new Date(); let curH = now.getHours()*60 + now.getMinutes();
  
  TIRAJ_CONFIG.forEach(t=>{
    let s=document.createElement('span'); s.className='tiraj'; s.innerText=t.name;
    let [h,m]=t.close.split(':').map(Number); let closeMin=h*60+m;
    if(curH > closeMin){ s.classList.add('ferme'); s.title="Fèmen depi "+t.close; }
    else {
      s.onclick=()=>{ s.classList.toggle('active'); updateTiraj(); };
    }
    tb.appendChild(s);
  });

  let linesDiv=document.getElementById('lines'); linesDiv.innerHTML="";
  for(let i=0;i<6;i++){
    let d=document.createElement('div'); d.className='ligne';
    let optJeux = JEUX_LIST.map(j=>`<option value="${j}">${j}</option>`).join('');
    d.innerHTML=`<select id="j${i}" style="width:95px">${optJeux}</select><input id="b${i}" placeholder="Boul" onkeydown="nextLine(event,${i})" oninput="calc()"><input id="m${i}" type="number" placeholder="Miz" style="width:85px" oninput="calc()" onkeydown="nextLine(event,${i})">`;
    linesDiv.appendChild(d);
  }
  calc();
}

function nextLine(e,i){
  if(e.key==="Enter" || e.key==="ArrowDown"){ let n=i+1; if(n<6) document.getElementById('b'+n)?.focus(); }
  if(e.key==="ArrowUp" && i>0) document.getElementById('b'+(i-1))?.focus();
}
function updateTiraj(){
  selectedTiraj=[]; document.querySelectorAll('.tiraj.active').forEach(el=>selectedTiraj.push(el.innerText));
  document.getElementById('nbT').innerText=selectedTiraj.length||1; calc();
}
function calc(){
  let total=0; for(let i=0;i<6;i++){ total+=parseFloat(document.getElementById('m'+i)?.value)||0; }
  document.getElementById('tot').innerText=total+"$";
  document.getElementById('paye').innerText=(total*(selectedTiraj.length||1))+"$";
}
function showTab(nom){
  ['vendre','kopyeTab','fichesTab','rapportTab'].forEach(id=>document.getElementById(id).style.display=id===nom?'block':'none');
  document.getElementById('tV').className=nom=='vendre'?'active':''; document.getElementById('tC').className=nom=='kopyeTab'?'active':'';
  document.getElementById('tF').className=nom=='fichesTab'?'active':''; document.getElementById('tR').className=nom=='rapportTab'?'active':'';
  if(nom!=='vendre') history.pushState({tab:nom},'', '#'+nom);
}
window.onpopstate=()=>{ showTab('vendre'); history.pushState(null,null,location.href); };
function vann(){
  calc();
  let html=`<div style="border:2px dashed #000;padding:10px;margin-top:10px;text-align:center"><h3>🎫 ${USER} - ${new Date().toLocaleString()}</h3><div>${selectedTiraj.join(' | ')}</div><hr>`;
  for(let i=0;i<6;i++){ let j=document.getElementById('j'+i).value,b=document.getElementById('b'+i).value,m=document.getElementById('m'+i).value; if(b&&m) html+=`<div>${j} - ${b} : ${m}$</div>`; }
  html+=`<h2>A PEYE: ${document.getElementById('paye').innerText}</h2></div>`;
  document.getElementById('lastTicket').innerHTML=html+`<button class="btn bV" onclick="showTab('vendre')">↩️ RETOUNEN NAN VENDRE</button><button class="btn bK" onclick="window.print()">🖨️ RE-IMPRIMER</button>`;
  window.print(); setTimeout(()=>showTab('vendre'),1200);
}
function searchById(){}
function genererRapport(){ document.getElementById('rVente').innerText="1250$"; document.getElementById('rCom').innerText="125$"; document.getElementById('rPaye').innerText="1125$"; document.getElementById('rNet').innerText="1000$"; }
</script>
</body></html>
