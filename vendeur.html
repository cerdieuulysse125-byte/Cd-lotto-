<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C&D Shop - Vandè</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f2f2f2;padding:10px}
.card{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;border:none;border-radius:10px;font-size:18px;font-weight:bold}
.btn-add{background:#111;color:#fff}
.btn-pay{background:#00a651;color:#fff;margin-top:10px}
.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
.total{font-size:22px;font-weight:bold;text-align:right;padding:10px 0}
</style>
</head>
<body>

<div class="card">
<h2 style="margin:0">C&D SHOP</h2>
<small>Sunmi V2 Pro - Vant</small>
<input id="client" placeholder="Non Kliyan (Public)">
</div>

<div class="card">
<input id="prodName" placeholder="Non pwodwi" value="Pwodwi 1">
<div style="display:flex;gap:8px">
<input id="prodPrice" type="number" placeholder="Pri" value="100" style="flex:1">
<input id="prodQty" type="number" placeholder="Qte" value="1" style="flex:1">
</div>
<button class="btn-add" onclick="addToCart()">+ Ajoute nan Panye</button>
</div>

<div class="card">
<h3 style="margin:0 0 8px 0">Panye</h3>
<div id="cart"></div>
<div class="total">TOTAL: $<span id="total">0.00</span></div>
<select id="pago">
<option value="EFECTIVO">EFECTIVO</option>
<option value="TARJETA">TARJETA</option>
<option value="TRANSFER">TRANSFER</option>
</select>
<button class="btn-pay" onclick="vann()">VANN & ENPRIME</button>
<p id="msg" style="text-align:center"></p>
</div>

<script>
let cart = [];

function addToCart(){
  const name = document.getElementById('prodName').value || 'Pwodwi';
  const price = parseFloat(document.getElementById('prodPrice').value) || 0;
  const qty = parseInt(document.getElementById('prodQty').value) || 1;
  if(price<=0) return alert('Mete pri');
  cart.push({name, price, qty});
  render();
  document.getElementById('prodName').value='';
  document.getElementById('prodName').focus();
}

function render(){
  const div = document.getElementById('cart');
  let total=0, html='';
  cart.forEach((it,i)=>{
    const sub = it.price*it.qty;
    total+=sub;
    html+=`<div class="item"><span>${it.name} x${it.qty}</span><span>$${sub.toFixed(2)} <b onclick="cart.splice(${i},1);render()" style="color:red;margin-left:10px">X</b></span></div>`;
  });
  div.innerHTML = html || '<small>Panye vid</small>';
  document.getElementById('total').innerText = total.toFixed(2);
}

function toBase64(str){
  // Latin1 pou ESC/POS
  let binary='';
  for(let i=0;i<str.length;i++) binary+=String.fromCharCode(str.charCodeAt(i) & 0xFF);
  return btoa(binary);
}

function vann(){
  if(cart.length==0) return alert('Panye vid!');
  const client = document.getElementById('client').value || 'Publico General';
  const pago = document.getElementById('pago').value;
  const totalEl = document.getElementById('total').innerText;
  
  const ESC="\x1B", GS="\x1D", LF="\n";
  let esc="";

  esc+=ESC+"@"; // reset
  esc+=ESC+"a"+"\x01"; // center
  esc+=ESC+"!"+"\x08"; // bold
  esc+="C & D SHOP"+LF;
  esc+=ESC+"!"+"\x00";
  esc+="Monterrey, N.L."+LF;
  esc+="------------------------------"+LF;
  esc+=ESC+"a"+"\x00"; // left
  esc+="Cliente: "+client.substring(0,28)+LF;
  esc+="Fecha: "+new Date().toLocaleString('es-MX')+LF;
  esc+="Pago: "+pago+LF;
  esc+="------------------------------"+LF;
  
  cart.forEach(it=>{
    let name = it.name.substring(0,20);
    esc+=name+LF;
    esc+="  "+it.qty+" x $"+it.price.toFixed(2)+" = $"+(it.price*it.qty).toFixed(2)+LF;
  });
  
  esc+="------------------------------"+LF;
  esc+=ESC+"a"+"\x02"; // right
  esc+=ESC+"!"+"\x18"; // big
  esc+="TOTAL: $"+totalEl+LF;
  esc+=ESC+"!"+"\x00";
  esc+=ESC+"a"+"\x01"; // center
  esc+=LF+"Gracias por su compra!"+LF;
  esc+="Vuelva pronto"+LF+LF+LF;
  esc+=GS+"V"+"\x41"+"\x03"; // cut

  const base64 = toBase64(esc);
  
  document.getElementById('msg').innerText="Enprime...";
  
  // VOYE BAY KODULAR / SUNMI
  if(window.AppInventor){
    window.AppInventor.setWebViewString(base64);
  } else {
    // Test sou PC
    console.log("BASE64:", base64);
    document.getElementById('msg').innerText="BASE64 kreye (teste sou Kodular)";
  }
  
  // Vide panye apre 2 segond
  setTimeout(()=>{cart=[];render();document.getElementById('msg').innerText="Vant OK!";},1000);
}
</script>
</body>
</html>
