<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V111 FINAL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:900}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:14px;border:2px solid #000;border-radius:11px;width:100%;font-size:16px;margin:4px 0}.line{display:grid;grid-template-columns:90px 1fr 80px;gap:6px;margin:8px 0}.tiraj{padding:6px 10px;margin:3px;border:2px solid #000;border-radius:20px;font-weight:bold;display:inline-block;font-size:12px;cursor:pointer;text-align:center}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{background:#eee;color:#aaa;pointer-events:none;opacity:.5}.btn{padding:14px;width:100%;border:none;border-radius:11px;font-weight:900;font-size:15px;margin:6px 0}.bK{background:#000;color:#FFD700}.ticket{border:2px dashed #000;padding:14px;text-align:center;max-width:340px;margin:auto;font-family:monospace;font-size:15px;font-weight:900;line-height:20px}.tab2{display:flex;background:#000;gap:1px}.tab2 button{flex:1;padding:11px 2px;font-size:11px;font-weight:900;background:#000;color:#FFD700;border:none}.tab2 button.active{background:#FFD700;color:#000}</style>
</head><body>
<div class="h">C&D VÉRITÉ LOTTO - V111</div>
<div id="loginBox" class="card" style="text-align:center;padding-top:30px"><h2>Connexion</h2><input id="uName" placeholder="Code vendeur" value="Jules"><input id="uPass" type="password" value="1234"><button class="btn bK" onclick="go()">Antre</button><div id="loginErr" style="color:red"></div></div>
<div id="appBox" style="display:none">
<div class="tab2"><button id="tV" class="active" onclick="showTab('vendre')">Vendre</button><button id="tK" onclick="showTab('kopyeTab')">Copier</button><button id="tF" onclick="showTab('fichesTab')">Mes Fiches</button><button id="tR" onclick="showTab('rapportTab')">Rapport</button></div>
<div id="vendre" class="card">
<div style="text-align:center;font-weight:900;font-size:12px">TIRAJ - <span id="dateToday" style="background:#FFD700;padding:2px 6px;border-radius:6px"></span> - <span id="userShow"></span></div>
<div id="tirajBox" style="text-align:center;margin:8px 0"></div>
<div style="display:flex;background:#000;color:#FFD700;padding:7px;font-weight:900;border-radius:7px;font-size:11px"><div style="width:90px">JEUX</div><div style="flex:1">BOUL</div><div style="width:80px">MIZ</div></div>
<div id="lines"></div>
<div style="text-align:center"><button onclick="addLine()" style="width:auto;padding:6px 14px;border:2px dashed #000;background:#fff;border-radius:8px">+ Ajoute Liy</button></div>
<div style="background:#000;color:#fff;padding:12px;border-radius:10px;text-align:center;margin-top:8px">Total <span id="tot">0$</span> × <span id="nbT">1</span><div style="font-size:28px;color:#FFD700">A PEYE <span id="paye">0$</span></div><div id="limitInfo" style="font-size:11px;color:#ff8888"></div></div>
<button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button>
<div id="lastTicket"></div>
</div>
<div id="kopyeTab" class="card" style="display:none"><h3>📋 Copier</h3><input id="searchId" placeholder="ID 5 chif"><button class="btn bK" onclick="searchById()">Chèche</button><div id="resKopye"></div></div>
<div id="fichesTab" class="card" style="display:none"><h3>Mes Fiches - <span id="mn"></span></h3><div id="listF"></div></div>
<div id="rapportTab" class="card" style="display:none">
<h3>📊 Rapport Vendeur</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><label style="font-size:10px">Du</label><input id="rapDu" type="date"></div><div><label style="font-size:10px">Au</label><input id="rapAu" type="date"></div></div>
<div><label style="font-size:10px">Tirage</label><select id="rapTiraj"><option value="">Tous les tirages</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select></div>
<button class="btn bK" onclick="genRapV()">Générer Rapport</button>
<div id="rapData" style="margin-top:10px"></div>
</div>
</div>
<script>
const firebaseConfig={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"}; firebase.initializeApp(firebaseConfig); const db=firebase.database();
let curUser=null, selectedT=[], config={}, limites={}, journal={};
let tirajDef=[{id:'gaMidi',nom:'GA MIDI',h:'12:15'},{id:'flMidi',nom:'FL MIDI',h:'13:15'},{id:'nyMidi',nom:'NY MIDI',h:'14:15'},{id:'gaSoir',nom:'GA SOIR',h:'18:20'},{id:'flSoir',nom:'FL SOIR',h:'21:10'},{id:'nySoir',nom:'NY SOIR',h:'21:30'}];
function getHaitiDate(){ const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getESTHM(){ const now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return now.getHours()*60+now.getMinutes(); }
function go(){ const u=document.getElementById('uName').value.trim().toLowerCase(); const p=document.getElementById('uPass').value.trim(); if(!u) return; document.getElementById('loginErr').innerText="Ap antre..."; db.ref('vendors/'+u).once('value').then(s=>{ curUser={name:u}; initApp(); }).catch(()=>{ curUser={name:u}; initApp(); }); }
function initApp(){
  document.getElementById('loginBox').style.display='none'; document.getElementById('appBox').style.display='block';
  document.getElementById('mn').innerText=curUser.name; document.getElementById('userShow').innerText=curUser.name.toUpperCase();
  document.getElementById('dateToday').innerText=getHaitiDate(); document.getElementById('rapDu').value=getHaitiDate(); document.getElementById('rapAu').value=getHaitiDate();
  db.ref('config').on('value',s=>{ config=s.val()||{}; limites=config.limites||{bolet:1000,maryaj:50,loto3:100,loto4:20,loto5:10}; renderTiraj(); });
  db.ref('venteJournaliere/'+getHaitiDate()).on('value',s=>{ journal=s.val()||{}; });
  document.getElementById('lines').innerHTML=''; addLine(); addLine(); recalc();
}
function renderTiraj(){ const he=config.heures||{}; const ti=config.tirages||{}; let html=''; const cur=getESTHM(); tirajDef.forEach(t=>{ const realH=he[t.id]||t.h; const hh=parseInt(realH.split(':')[0]); const mm=parseInt(realH.split(':')[1]); const m=hh*60+mm; const ferme=ti[t.id]==='FERME'||cur>=m; const active=selectedT.includes(t.nom); html+=`<span class="tiraj ${active?'active':''} ${ferme?'ferme':''}" onclick="toggleTiraj('${t.nom}')">${t.nom}<br><small>${realH}</small></span>`; }); document.getElementById('tirajBox').innerHTML=html; recalc(); }
function toggleTiraj(nom){ if(selectedT.includes(nom)) selectedT=selectedT.filter(x=>x!==nom); else selectedT.push(nom); renderTiraj(); }
function addLine(){
  const div=document.createElement('div'); div.className='line';
  div.innerHTML=`<select class="j"><option value="bolet">Bolèt</option><option value="maryaj">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select><input class="b" type="tel" inputmode="numeric" placeholder="00"><input class="m" type="tel" inputmode="numeric" placeholder="25">`;
  document.getElementById('lines').appendChild(div);
  const j=div.querySelector('.j'); const b=div.querySelector('.b'); const m=div.querySelector('.m');
  [j,b,m].forEach(inp=>{
    inp.addEventListener('input', ()=>{ if(inp!==j) inp.value=inp.value.replace(/[^0-9]/g,''); recalc(); });
    inp.addEventListener('change', recalc);
    inp.addEventListener('keyup', recalc);
  });
  j.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); b.focus(); } });
  b.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); m.focus(); m.select(); }
    if(e.key==='ArrowDown'){ e.preventDefault(); const nxt=getNextLine(div); if(nxt) nxt.querySelector('.b').focus(); else { addLine(); document.querySelectorAll('.line')[document.querySelectorAll('.line').length-1].querySelector('.b').focus(); } }
    if(e.key==='ArrowUp'){ e.preventDefault(); const prv=getPrevLine(div); if(prv) prv.querySelector('.b').focus(); }
  });
  m.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key==='ArrowDown'){ e.preventDefault(); const nxt=getNextLine(div); if(nxt){ nxt.querySelector('.b').focus(); } else { addLine(); const all=document.querySelectorAll('.line'); all[all.length-1].querySelector('.b').focus(); } }
    if(e.key==='ArrowUp'){ e.preventDefault(); const prv=getPrevLine(div); if(prv) prv.querySelector('.m').focus(); }
  });
}
function getNextLine(cur){ const rows=Array.from(document.querySelectorAll('.line')); const idx=rows.indexOf(cur); return idx>=0 && idx<rows.length-1? rows[idx+1] : null; }
function getPrevLine(cur){ const rows=Array.from(document.querySelectorAll('.line')); const idx=rows.indexOf(cur); return idx>0? rows[idx-1] : null; }
function recalc(){
  let tot=0;
  document.querySelectorAll('.line').forEach(r=>{
    const v=parseInt(r.querySelector('.m').value)||0;
    const b=r.querySelector('.b').value.trim();
    if(b!=="" && v>0) tot+=v;
  });
  const nb=selectedT.length||1;
  document.getElementById('tot').innerText=tot+'$';
  document.getElementById('nbT').innerText=selectedT.length||1;
  document.getElementById('paye').innerText=(tot*nb)+'$';
}
function showTab(id){ ['vendre','kopyeTab','fichesTab','rapportTab'].forEach(x=>document.getElementById(x).style.display='none'); document.getElementById(id).style.display='block'; document.querySelectorAll('.tab2 button').forEach(b=>b.classList.remove('active')); if(id==='vendre') document.getElementById('tV').classList.add('active'); if(id==='kopyeTab') document.getElementById('tK').classList.add('active'); if(id==='fichesTab'){ document.getElementById('tF').classList.add('active'); loadFiches(); } if(id==='rapportTab') document.getElementById('tR').classList.add('active'); }
function loadFiches(){ const today=getHaitiDate(); db.ref('fiches').orderByChild('dateStr').equalTo(today).once('value',s=>{ if(!s.exists()){document.getElementById('listF').innerHTML="Pa gen";return;} let html=''; Object.values(s.val()).filter(f=>f.vendeur===curUser.name).reverse().forEach(f=>{ html+=`<div style="border:1px solid #ccc;padding:6px;margin:4px 0;border-radius:8px;font-size:12px"><b>${(f.tirajs||[]).join('/')} - ${f.total}$</b> ${f.details.map(d=>d.boul).join(',')} <button onclick="kopyeFiche('${f.id}')" style="width:auto;padding:4px 8px">Kopye</button></div>`; }); document.getElementById('listF').innerHTML=html; }); }
function printTicket(html){ window.lastHtml=html; document.getElementById('lastTicket').innerHTML=`<div class="ticket">${html}<br><button class="btn bK" onclick="doPrint()">🖨️ IMPRIMER</button></div>`; doPrint(); }
function doPrint(){ const w=window.open('', '', 'width=380,height=700'); w.document.write(`<html><head><style>@page{size:80mm auto;margin:2mm} body{margin:0;padding:2mm;font-family:Courier,monospace}.ticket{width:74mm;font-size:17px;font-weight:900;line-height:22px;text-align:center;color:#000}.sep{border-top:2px dashed #000;margin:8px 0}</style></head><body><div class="ticket">${window.lastHtml}</div><script>setTimeout(()=>{window.print();},400)<\/script></body></html>`); w.document.close(); }
async function vann(){
  if(selectedT.length===0){alert('Chwazi FL SOIR / NY SOIR');return;}
  let details=[]; document.querySelectorAll('.line').forEach(r=>{ const j=r.querySelector('.j').value; const b=r.querySelector('.b').value.trim(); const m=parseInt(r.querySelector('.m').value)||0; if(b!=="" && m>0) details.push({type:j,boul:b,montan:m}); });
  if(details.length===0){alert('Mete boul');return;}
  const dateStr=getHaitiDate(); const snap=await db.ref('venteJournaliere/'+dateStr).once('value'); const curJ=snap.val()||{};
  const base=details.reduce((a,b)=>a+b.montan,0); const total=base*selectedT.length; const id=db.ref('fiches').push().key;
  let updates={}; updates['fiches/'+id]={id:id,vendeur:curUser.name,tirajs:selectedT,details:details,total:total,totalBase:base,nbTiraj:selectedT.length,date:new Date().toISOString(),dateStr:dateStr,gain:0};
  details.forEach(d=>{ selectedT.forEach(tName=>{ const key=d.type+"_"+d.boul; const cur=(curJ[tName]&&curJ[tName][key])||0; updates['venteJournaliere/'+dateStr+'/'+tName+'/'+key]=cur+d.montan; }); });
  await db.ref().update(updates);
  const ent=`<div style="font-size:20px">${config.entete||'C&D VÉRITÉ LOTTO'}</div><div style="font-size:12px">${new Date().toLocaleString()}<br>${curUser.name.toUpperCase()}</div>`;
  const corps=details.map(d=>`<div style="display:flex;justify-content:space-between"><span>${d.type.toUpperCase()} ${d.boul}</span><span>${d.montan}$</span></div>`).join('');
  const html=`${ent}<div class="sep"></div>Tirage: <b>${selectedT.join(' / ')}</b><br>Id: <b style="font-size:20px">${id.slice(-5).toUpperCase()}</b><div class="sep"></div>${corps}<div class="sep"></div><div style="display:flex;justify-content:space-between;font-size:20px"><span>TOTAL</span><span>${total}$</span></div><div class="sep"></div>${config.pied||'Bonne chance!'}`;
  printTicket(html); document.getElementById('lines').innerHTML=''; addLine(); addLine(); addLine(); recalc();
}
function searchById(){ const q=document.getElementById('searchId').value.trim().toLowerCase(); db.ref('fiches').once('value',s=>{ const all=Object.values(s.val()||[]); const f=all.find(x=>x.id.toLowerCase().includes(q)||x.id.slice(-5).toLowerCase()===q); document.getElementById('resKopye').innerHTML=f?`<b>${f.total}$</b> ${f.tirajs}<br><button class="btn bK" onclick="kopyeFiche('${f.id}')">Kopye</button> <button class="btn bK" onclick="reprint('${f.id}')">Print</button>`:"Pa jwenn"; }); }
function kopyeFiche(id){ db.ref('fiches/'+id).once('value',s=>{ const f=s.val(); selectedT=f.tirajs||[]; document.getElementById('lines').innerHTML=''; f.details.forEach(d=>{ addLine(); const rows=document.querySelectorAll('.line'); const row=rows[rows.length-1]; row.querySelector('.j').value=d.type; row.querySelector('.b').value=d.boul; row.querySelector('.m').value=d.montan; }); renderTiraj(); showTab('vendre'); recalc(); }); }
function reprint(id){ db.ref('fiches/'+id).once('value',s=>{ const f=s.val(); const corps=f.details.map(d=>`<div style="display:flex;justify-content:space-between"><span>${d.type.toUpperCase()} ${d.boul}</span><span>${d.montan}$</span></div>`).join(''); printTicket(`Id:${f.id.slice(-5)}<br>${f.tirajs}<div class="sep"></div>${corps}<div class="sep"></div>TOTAL:${f.total}$`); }); }
function genRapV(){
  const du=document.getElementById('rapDu').value||getHaitiDate();
  const au=document.getElementById('rapAu').value||getHaitiDate();
  const tf=document.getElementById('rapTiraj').value;
  db.ref('fiches').once('value',s=>{
    let all=Object.values(s.val()||[]).filter(f=> f.vendeur===curUser.name && f.dateStr>=du && f.dateStr<=au );
    if(tf) all=all.filter(f=> (f.tirajs||[]).includes(tf));
    const vente=all.reduce((a,b)=>a+(b.total||0),0);
    const commission=Math.round(vente*0.10);
    const apayer=all.reduce((a,b)=>a+(b.gain||0),0);
    const balance=vente-commission-apayer;
    const html=`<div id="rapPrint"><div style="text-align:center;font-weight:900">RAPPORT ${curUser.name.toUpperCase()}<br>Du ${du} Au ${au}<br>Tirage: ${tf||'Tous'}</div><div class="sep"></div><div style="display:flex;justify-content:space-between"><span>Vente:</span><span><b>${vente}$</b></span></div><div style="display:flex;justify-content:space-between"><span>Commission (10%):</span><span><b>${commission}$</b></span></div><div style="display:flex;justify-content:space-between"><span>A payer (gain):</span><span><b>${apayer}$</b></span></div><div class="sep"></div><div style="display:flex;justify-content:space-between;font-size:20px"><span>Balance net:</span><span><b>${balance}$</b></span></div><div style="font-size:11px;margin-top:8px">Fiches: ${all.length}</div></div><br><button class="btn bK" onclick="printRapport()">🖨️ Imprimer Rapport</button>`;
    document.getElementById('rapData').innerHTML=`<div class="ticket">${html}</div>`;
    window.rapHtml=document.getElementById('rapPrint').innerHTML;
  });
}
function printRapport(){ const w=window.open('', '', 'width=380,height=700'); w.document.write(`<html><body><div style="font-family:monospace;font-size:16px;font-weight:900;text-align:center;width:74mm">${window.rapHtml}</div><script>setTimeout(()=>{window.print();},400)<\/script></body></html>`); w.document.close(); }
</script></body></html>
