<script>
//... nan fonksyon login() ajoute sa a:
async function login(){
 const nom=document.getElementById('nom').value.trim(), pass=document.getElementById('pass').value.trim();
 const msg=document.getElementById('msg');
 try{
  const s=await db.collection('vendeurs').where('nom','==',nom).where('modpas','==',pass).get();
  if(s.empty){msg.innerText="Non oswa modpas pa kòrèk";return;}
  const data=s.docs[0].data();
  // RESPÈK VANDÈ FÈMEN NAN PROPRIO
  if(data.actif===false || data.femen===true || data.status==='femen'){
    msg.innerText="⛔ Kont sa fèmen pa Proprio. Kontakte Proprio.";
    return;
  }
  current={id:s.docs[0].id,...data};
  document.getElementById('loginDiv').style.display='none';
  document.getElementById('appDiv').style.display='flex';
  document.getElementById('vNameHdr').innerText=nom;
  const t=new Date().toISOString().slice(0,10);
  document.getElementById('du').value=t; document.getElementById('au').value=t;
  addLigne('BOLET'); await fetchAll(); loadFiches();
 }catch(e){msg.innerText=e.message}
}

// ENPRESYON SANTRE 58MM - KORIJE PDF A4 la
function printTicketOnly(text){
  const win=window.open('', '_blank','width=400,height=700');
  win.document.write(`
<html><head><title>Print</title>
<style>
  @page { size: 58mm auto; margin: 0; }
  html,body { margin:0; padding:0; background:#fff; display:flex; justify-content:center; }
 .ticket {
    width:58mm;
    padding:4mm 3mm;
    font-family:Courier, monospace;
    font-size:13px;
    text-align:center;
    white-space:pre-line;
    line-height:1.6;
    margin:0 auto;
  }
</style></head>
<body>
<div class="ticket">${text}</div>
<script>window.onload=function(){window.print(); setTimeout(()=>window.close(),800);}<\/script>
</body></html>`);
  win.document.close();
}
</script>
