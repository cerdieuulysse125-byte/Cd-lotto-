<!DOCTYPE html><html lang='ht'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0,maximum-scale=1.0'><title>VANDEUR 72px V6</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#eef2f7;overflow-x:hidden}.h{background:#1e2a8a;color:#fff;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.page{display:none;padding:8px 6px 80px;max-width:400px;margin:auto}.page.active{display:block}.card{background:#fff;border-radius:12px;padding:8px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.1)}.row{display:flex;gap:4px;align-items:center;margin-bottom:4px}.kz{width:72px;min-width:72px;max-width:72px;height:44px;border:2px solid #1e2a8a;border-radius:8px;font-weight:700;font-size:13px;text-align:center;background:#fff;display:flex;align-items:center;justify-content:center}.kz-tiraj{width:220px;min-width:220px;max-width:220px;justify-content:space-between;padding:0 8px;background:#f5f7ff;cursor:pointer}.inp{width:72px;min-width:72px;max-width:72px;height:44px;border:2px solid #cbd5e1;border-radius:8px;font-weight:800;font-size:18px;text-align:center;background:#fff}.inp:focus{border-color:#1e2a8a;background:#eef2ff;outline:none}.btn{padding:12px;border:0;border-radius:10px;color:#fff;font-weight:800;cursor:pointer}.btn-g{background:#16a34a}.btn-b{background:#1e2a8a}.btn-r{background:#e11d48;width:44px;height:44px;border:0;border-radius:8px;color:#fff;font-weight:800}.total{background:#1e2a8a;color:#fff;border-radius:10px;padding:10px;display:flex;justify-content:space-between;font-weight:800}.tlist{display:none;position:absolute;left:6px;right:6px;background:#fff;border:2px solid #1e2a8a;border-radius:10px;max-height:260px;overflow-y:auto;z-index:99;padding:4px;grid-template-columns:72px 72px 72px;gap:4px;justify-content:center}.tlist.open{display:grid}.topt{width:72px;height:52px;border:1px solid #e2e8f0;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;z-index:20}.tab{flex:1;padding:12px 2px;text-align:center;font-size:10px;font-weight:700;color:#666;border-top:3px solid transparent}.tab.active{color:#1e2a8a;border-top-color:#1e2a8a;background:#e8eaf6}.preview{font-family:monospace;white-space:pre-line;text-align:center;font-size:12px;background:#fff;border:1px dashed #000;padding:8px}</style></head><body>
<div class='h'><div style='font-size:13px'><b>Vandè 2222</b><br>2222</div><div><span style='font-size:12px' id='dateH'></span> <button onclick='localStorage.removeItem("curV");location.reload()' style='background:#e11d48;color:#fff;border:0;padding:6px 8px;border-radius:6px;margin-left:4px'>Soti</button></div></div>

<div id='login' class='page active'><div class='card'><input id='vs' class='inp' style='width:100%;max-width:100%' value='2222'><input id='vp' class='inp' style='width:100%;max-width:100%;margin-top:4px' type='password' value='123'><button class='btn btn-g' style='width:100%;margin-top:6px' onclick='login()'>Konekte</button></div></div>

<div id='main' style='display:none'>
<!-- 1 VENDRE SEULEMENT -->
<div id='pageVendre' class='page active' style='position:relative'>
<div class='card'><div style='display:flex;justify-content:space-between;margin-bottom:4px'><b style='font-size:12px'>🎯 Tiraj (miltip)</b><button onclick='selAll()' style='font-size:10px;padding:2px 6px'>Tout</button></div><div class='row'><div class='kz' style='background:#e8eaf6'>Tiraj</div><div id='kazT' class='kz kz-tiraj' onclick='document.getElementById("tlist").classList.toggle("open")'><span id='txtT'>Chwazi</span><span>▼</span></div></div><div id='tlist' class='tlist'></div><div id='cnt' style='font-size:10px;color:#1e2a8a'>0 tiraj chwazi</div></div>

<div class='card'><div class='row' style='font-size:10px;color:#666'><div style='width:72px;text-align:center'>Jeux</div><div style='width:72px;text-align:center'>Boul</div><div style='width:72px;text-align:center'>Mise</div><div style='width:44px'></div></div><div id='bets'></div><button class='btn btn-b' style='width:100%;margin-top:6px' onclick='addR()'>+ Liy</button><div style='font-size:9px;background:#fff7ed;padding:4px;border-radius:4px;margin-top:4px'>Global B1000=V1+V2 | M100 L3 100 L4 50 L5 50 - 12x47=47x12</div></div>

<div class='card total'><span id='dt'>Total $0 x 0= $0</span><span id='gt'>$0</span></div>
<div class='row'><button class='btn btn-g' style='flex:1;height:52px;font-size:18px' onclick='vann()'>VANN</button><button class='btn btn-b' style='flex:1;height:52px;font-size:11px' onclick='printRawBT()'>🖨️ RawBT V2 Pro</button></div>
<div id='prev' class='preview' style='display:none'></div>
<!-- PA GEN COPIER LA ANKÒ -->
</div>

<!-- 2 COPIER SEPARE -->
<div id='pageCopier' class='page'><div class='card'><h4>2-Copier</h4><input id='cid' class='inp' style='width:100%;max-width:100%' placeholder='Id Ticket'><button class='btn btn-b' style='width:100%;margin-top:6px' onclick='doCopy()'>Kopye</button><div id='cres'></div></div></div>
<div id='pageFiches' class='page'><div class='card'><h4>3-Fiches</h4><input id='fd' type='date' class='inp' style='width:100%;max-width:100%'><div id='flist'></div></div></div>
<div id='pageRapport' class='page'><div class='card'><h4>4-Rapport</h4><div class='row'><input id='rdu' type='date' class='inp' style='width:48%'><input id='rau' type='date' class='inp' style='width:48%'></div><select id='rt' class='kz' style='width:100%;max-width:100%;margin-top:4px'><option value='tous'>Tous tiraj</option></select><button class='btn btn-b' style='width:100%;margin-top:6px' onclick='calcR()'>Kalkile</button><div id='rres' class='card' style='background:#f0fdf4;margin-top:6px'></div><button class='btn btn-b' style='width:100%' onclick='printRapportRawBT()'>🖨️ Imprimer RawBT</button></div></div>
<div id='pageParam' class='page'><div class='card'><h4>5-Printer V2 Pro RawBT</h4><button class='btn btn-b' style='width:100%' onclick='searchP()'>Ajouter imprimante</button><div id='plist'></div></div></div>

<div class='tabs'><div class='tab active' onclick="go('pageVendre',this)">1-Vendre</div><div class='tab' onclick="go('pageCopier',this)">2-Copier</div><div class='tab' onclick="go('pageFiches',this)">3-Fiches</div><div class='tab' onclick="go('pageRapport',this)">4-Rapport</div><div class='tab' onclick="go('pageParam',this)">5-Param</div></div>
</div>

<script>
const TIRAJ=[["GA midi","12:15"],["FL midi","13:15"],["NY midi","14:15"],["Real","12:45"],["GA soir","18:15"],["FL soir","21:15"],["NY soir","22:15"],["Primera día","11:50"],["Suerte día","12:20"],["Lote Dom","13:45"],["Ganamas","14:15"],["Suerte noche","17:50"],["Primera noche","19:50"],["Loteka","19:45"],["Nacional noche","20:50"],["Nacional Dim","17:50"],["Leidsa","20:45"],["Leidsa Dim","15:45"],["Anguila 10h","09:55"],["Anguila 18h","17:55"]];
let DB=JSON.parse(localStorage.getItem('cd-lotto-db')||'null')||{vendeurs:[],tickets:[],results:[],heures:{},limites:{global:{bor:1000,mar:100,l3:100,l4:50,l5:50}},prix:{global:{p1:50,p2:20,p3:10,m1:1000,m2:100,m3:20,l3:500,l4:5000,l5:25000}},commission:10};
function sDB(){localStorage.setItem('cd-lotto-db',JSON.stringify(DB))}
let CUR=null,selT=[];
function go(id,el){document.querySelectorAll('.page').forEach(p=>{if(p.id!='login')p.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');if(id=='pageFiches')loadF();if(id=='pageRapport')initR()}
function login(){let s=document.getElementById('vs').value.trim();let f=(DB.vendeurs||[]).find(v=>v.serial==s);if(!f){f={id:'v_'+Date.now(),serial:s,nom:'Vandè '+s,pass:'123'};DB.vendeurs.push(f);sDB()}CUR=f;localStorage.setItem('curV',JSON.stringify(CUR));document.getElementById('login').classList.remove('active');document.getElementById('main').style.display='block';document.getElementById('pageVendre').classList.add('active');document.getElementById('dateH').innerText=new Date().toLocaleDateString('fr-FR');renderTL();addR();upd();initR()}
function isOpen(n){let h=DB.heures&&DB.heures[n]?DB.heures[n]:(TIRAJ.find(x=>x[0]==n)?.[1]||'');if(!h)return true;let now=new Date();let [hh,mm]=h.split(':').map(Number);let c=new Date();c.setHours(hh,mm,0,0);return now<c}
function renderTL(){document.getElementById('tlist').innerHTML=TIRAJ.map(t=>{let op=isOpen(t[0]);return `<label class='topt' style='${op?'':'opacity:.3;background:#fee2e2'}'><input type='checkbox' value='${t[0]}' ${selT.includes(t[0])?'checked':''} ${op?'':'disabled'} onchange='chgT(this)'><span>${t[0]}</span><small>${DB.heures[t[0]]||t[1]}</small></label>`}).join('');document.getElementById('rt').innerHTML='<option value="tous">Tous tiraj</option>'+TIRAJ.map(t=>`<option>${t[0]}</option>`).join('')}
function chgT(el){if(el.checked)selT.push(el.value);else selT=selT.filter(x=>x!=el.value);document.getElementById('txtT').innerText=selT.length?selT.length+' tiraj':'Chwazi';document.getElementById('cnt').innerText=selT.length+' tiraj chwazi';upd();if(selT.length>=1)document.getElementById('tlist').classList.remove('open')}
function selAll(){selT=TIRAJ.filter(t=>isOpen(t[0])).map(t=>t[0]);renderTL();document.getElementById('txtT').innerText=selT.length+' tiraj';document.getElementById('cnt').innerText=selT.length+' tiraj';upd()}
function addR(keep='boul'){let c=document.getElementById('bets');let d=document.createElement('div');d.className='row betRow';d.innerHTML=`<select class='kz jeu'><option value='boul'>Boul</option><option value='maryaj'>Mar</option><option value='loto3'>L3</option><option value='loto4'>L4</option><option value='loto5'>L5</option></select><input class='inp boul' placeholder='00' inputmode='numeric'><input class='inp mise' placeholder='25' inputmode='numeric' type='number'><button class='btn-r' onclick='this.parentElement.remove();upd()'>X</button>`;c.appendChild(d);let b=d.querySelector('.boul'),m=d.querySelector('.mise'),j=d.querySelector('.jeu');j.value=keep;b.addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^0-9xX]/g,'').slice(0,7);upd()});m.addEventListener('input',upd);b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();m.focus()}if(e.key==='ArrowDown'){e.preventDefault();addR(j.value)}});m.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();addR(j.value)}});b.focus()}
function upd(){let sum=0;document.querySelectorAll('.betRow.mise').forEach(i=>{sum+=parseInt(i.value)||0});let nb=selT.length||0;let g=sum*nb;document.getElementById('dt').innerText=`Total $${sum} x ${nb}= $${g}`;document.getElementById('gt').innerText=`$${g}`}
function getSold(t,n){let tot=0,today=new Date().toISOString().slice(0,10);DB.tickets.forEach(tk=>{if(tk.date!=today)return;tk.bets.forEach(b=>{if(b.type!=t)return;if(t=='maryaj'){let a=b.numero.toLowerCase(),bb=n.toLowerCase();let norm=s=>{let p=s.split('x');if(p.length!=2)return [s];return [p[0]+'x'+p[1],p[1]+'x'+p[0]]};let na=norm(a),nb=norm(bb);if(na[0]==nb[0]||na[0]==nb[1]||na[1]==nb[0]||na[1]==nb[1])tot+=b.mise}else if(b.numero==n)tot+=b.mise})});return tot}
function buildFiche(tk){let now=new Date();let ds=now.toLocaleDateString('fr-FR')+' '+now.toLocaleTimeString();let txt=` C&D VERITE LOTTO\n ${ds}\n----------------------------\nTiraj: ${tk.tirages.join(', ')}\nVandè: ${CUR.serial}\nId tikè: ${tk.id}\n----------------------------\nJEU BOUL MISE\n----------------------------\n`;tk.bets.forEach(b=>{let jeu=b.type.toUpperCase().padEnd(4,' ');let boul=b.numero.padEnd(6,' ');let mise=('$'+b.mise).padStart(6,' ');txt+=`${jeu} ${boul} ${mise}\n`});txt+=`----------------------------\nTOTAL $${tk.baseTotal} x ${tk.tirages.length} = $${tk.total}\n----------------------------\n bòn chans,\n Lave chodyè w\n\n\n`;return txt}
function vann(){if(selT.length==0)return alert('Chwazi tiraj');let bets=[],ok=true;document.querySelectorAll('.betRow').forEach(r=>{let jeu=r.querySelector('.jeu').value;let num=r.querySelector('.boul').value.trim();let mise=parseInt(r.querySelector('.mise').value);if(!num||!mise)return;let lim=DB.limites.global;let max=jeu=='boul'?lim.bor:jeu=='maryaj'?lim.mar:jeu=='loto3'?lim.l3:jeu=='loto4'?lim.l4:lim.l5;let sold=getSold(jeu,num);if(sold+mise>max){alert(`LIMIT ${num} $${sold}+$${mise}>$${max}`);ok=false;return}bets.push({type:jeu,numero:num,mise})});if(!ok)return;if(bets.length==0)return alert('Mete Boul ex: 00 ak Mise ex: 25');let base=bets.reduce((a,b)=>a+b.mise,0);let ticket={id:'T'+Date.now().toString().slice(-7),vendeurId:CUR.id,serial:CUR.serial,bets,tirages:selT.slice(),baseTotal:base,total:base*selT.length,date:new Date().toISOString().slice(0,10),time:new Date().toLocaleTimeString()};DB.tickets.push(ticket);sDB();let txt=buildFiche(ticket);document.getElementById('prev').style.display='block';document.getElementById('prev').innerText=txt;printRawBT(txt);document.getElementById('bets').innerHTML='';addR();upd()}
function printRawBT(text){let txt=text||document.getElementById('prev').innerText;if(!txt)return;let enc=encodeURIComponent(txt);window.location.href='rawbt://print?text='+enc;setTimeout(()=>{window.location.href='intent://print?text='+enc+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'},600)}
function doCopy(){let id=document.getElementById('cid').value.trim();let t=DB.tickets.find(x=>x.id==id);if(!t){document.getElementById('cres').innerText='Pa jwenn';return}selT=t.tirages.slice();document.getElementById('bets').innerHTML='';t.bets.forEach(b=>{addR(b.type);let rows=document.querySelectorAll('.betRow');let r=rows[rows.length-1];r.querySelector('.jeu').value=b.type;r.querySelector('.boul').value=b.numero;r.querySelector('.mise').value=b.mise});renderTL();go('pageVendre',document.querySelectorAll('.tab')[0]);upd()}
function loadF(){let d=document.getElementById('fd').value||new Date().toISOString().slice(0,10);let html='';DB.tickets.slice().reverse().forEach(t=>{if(t.vendeurId!=CUR?.id)return;if(t.date!=d)return;html+=`<div class='card'><b>${t.id}</b> ${t.tirages.join(',')}<br>${t.bets.map(b=>b.type+':'+b.numero+' $'+b.mise).join(' | ')}<br><b>$${t.total}</b> <button onclick='printRawBT(buildFiche(DB.tickets.find(x=>x.id=="${t.id}")))' class='btn btn-b' style='float:right;padding:6px'>🖨️</button></div>`});document.getElementById('flist').innerHTML=html||'Pa gen'}
function initR(){let today=new Date().toISOString().slice(0,10);document.getElementById('rdu').value=today;document.getElementById('rau').value=today}
function calcR(){let du=document.getElementById('rdu').value,au=document.getElementById('rau').value,ti=document.getElementById('rt').value;let vente=0,gain=0;DB.tickets.forEach(t=>{if(t.vendeurId!=CUR?.id)return;if(t.date<du||t.date>au)return;if(ti!='tous'&&!t.tirages.includes(ti))return;if(ti=='tous')vente+=t.total;else vente+=t.baseTotal;(DB.results||[]).forEach(r=>{if(r.date!=t.date)return;if(!t.tirages.includes(r.tirage))return;if(ti!='tous'&&r.tirage!=ti)return;t.bets.forEach(b=>{if(b.type=='boul'){if(b.numero==r.p1)gain+=b.mise*(DB.prix.global.p1||50);else if(b.numero==r.p2)gain+=b.mise*(DB.prix.global.p2||20);else if(b.numero==r.p3)gain+=b.mise*(DB.prix.global.p3||10)}})})});let com=vente*(DB.commission||10)/100;let bal=vente-com-gain;document.getElementById('rres').innerHTML=`<div style='display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #ccc'><span>Vant</span><span>$${vente}</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #ccc'><span>Komisyon 10%</span><span>$${com.toFixed(0)}</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #ccc'><span>A Peye</span><span>$${gain}</span></div><div style='display:flex;justify-content:space-between;padding:6px 0;font-size:16px;font-weight:800;color:#1e2a8a;border-top:2px solid #1e2a8a'><span>Balans net</span><span>$${bal.toFixed(0)}</span></div>`;window._lastRap=`C&D VERITE LOTTO\nRAPPORT ${du} Au ${au}\nTiraj: ${ti}\n----------------------------\nVant: $${vente}\nKomisyon: $${com.toFixed(0)}\nA Peye: $${gain}\nBalans net: $${bal.toFixed(0)}\n\n\n`}
function printRapportRawBT(){let txt=window._lastRap||'Pa gen rapò';let enc=encodeURIComponent(txt);window.location.href='rawbt://print?text='+enc;setTimeout(()=>{window.location.href='intent://print?text='+enc+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'},600)}
function searchP(){document.getElementById('plist').innerHTML='🔍 Recherche V2 Pro...';setTimeout(()=>{document.getElementById('plist').innerHTML='<div class=card>✅ RawBT V2 Pro ready<br>POS-58</div>'},500)}
try{let cv=localStorage.getItem('curV');if(cv){CUR=JSON.parse(cv);document.getElementById('login').classList.remove('active');document.getElementById('main').style.display='block';document.getElementById('pageVendre').classList.add('active');document.getElementById('dateH').innerText=new Date().toLocaleDateString('fr-FR');renderTL();addR();upd();initR()}}catch(e){}
</script></body></html>
