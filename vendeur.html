<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V114.9 NOUVO FICH KORIJE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:10px;text-align:center;font-weight:900;font-size:12px}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:14px;border:2px solid #000;border-radius:11px;width:100%;font-size:16px;margin:4px 0}.tiraj{padding:7px 11px;margin:3px;border:2px solid #000;border-radius:20px;font-weight:900;display:inline-block;font-size:12px;cursor:pointer}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{opacity:.25;pointer-events:none;background:#ccc}.btn{padding:14px;width:100%;border:none;border-radius:11px;font-weight:900;margin:6px 0}.bK{background:#000;color:#FFD700}.tab2{display:flex;background:#000;gap:1px;position:sticky;top:0;z-index:10}.tab2 button{flex:1;padding:11px 1px;font-size:10px;font-weight:900;background:#000;color:#FFD700;border:none}.tab2 button.active{background:#FFD700;color:#000}.limit-alert{background:#fee2e2;border:2px solid #ef4444;padding:8px;border-radius:8px;color:#b91c1c;font-weight:900;font-size:12px;margin:6px 0;text-align:center}</style>
</head><body>
<div class="h">V114.9 - NOUVO FICH KORIJE - 50/20/10/1000/500/5000/25000</div>
<div id="loginBox" class="card" style="text-align:center;padding-top:30px"><h3>Connexion</h3><input id="uName" placeholder="Code"><input id="uPass" type="password" placeholder="Modpas"><button class="btn bK" onclick="go()">Antre</button><div id="loginErr" style="color:red;font-weight:900"></div></div>
<div id="appBox" style="display:none"><div class="tab2"><button id="tV" class="active" onclick="showTab('vendre')">Vendre</button><button id="tK" onclick="showTab('kopyeTab')">Copier</button><button id="tF" onclick="showTab('fichesTab')">Fiches</button><button id="tR" onclick="showTab('rapportTab')">Rapport</button></div>
<div id="vendre" class="card"><div style="text-align:center;font-weight:900;font-size:11px">TIRAJ - <span id="dateToday" style="background:#FFD700;padding:2px 6px;border-radius:6px"></span> - <span id="userShow"></span></div><div id="limitMsg"></div><div id="tirajBox" style="text-align:center;margin:8px 0"></div><div style="display:flex;background:#000;color:#FFD700;padding:7px;font-weight:900;border-radius:7px;font-size:11px"><div style="width:90px">JEUX</div><div style="flex:1">BOUL</div><div style="width:80px">MIZ</div></div><div id="lines"></div><div style="background:#000;color:#fff;padding:12px;border-radius:10px;text-align:center;margin-top:8px">Total <span id="tot">0$</span> × <span id="nbT">1</span><div style="font-size:28px;color:#FFD700">A PEYE <span id="paye">0$</span></div></div><button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button><div id="lastTicket"></div></div>
<div id="kopyeTab" class="card" style="display:none"><h3>Copier</h3><input id="searchId" placeholder="ID"><button class="btn bK" onclick="searchById()">Chèche</button><div id="resKopye"></div></div>
<div id="fichesTab" class="card" style="display:none"><h3>Fiches - <span id="mn"></span> <button onclick="loadFiches()" style="width:auto;padding:6px 10px;font-size:10px;background:#000;color:#FFD700;border-radius:20px">🔄 KORIJE KOUNYA</button></h3><div id="debugRes" style="font-size:9px;background:#f0f0f0;padding:6px;border-radius:6px;margin:4px 0"></div><div id="listF"></div></div>
<div id="rapportTab" class="card" style="display:none"><h3>Rapport</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div>Du<input id="rapDu" type="date"></div><div>Au<input id="rapAu" type="date"></div></div><select id="rapTiraj"><option value="">Tous</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><button class="btn bK" onclick="genRapV()">Générer</button><div id="rapData"></div></div>
</div>
<script>
const firebaseConfig={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"}; firebase.initializeApp(firebaseConfig); const db=firebase.database();
let curUser=null, selectedT=[], config={}, venteDuJour={}, lastRapportHtml='';
let tirajDef=[{id:'gaMidi',nom:'GA MIDI',h:'12:15'},{id:'flMidi',nom:'FL MIDI',h:'13:15'},{id:'nyMidi',nom:'NY MIDI',h:'14:15'},{id:'gaSoir',nom:'GA SOIR',h:'18:20'},{id:'flSoir',nom:'FL SOIR',h:'21:10'},{id:'nySoir',nom:'NY SOIR',h:'21:30'}];
function getHaitiDate(){ const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getESTHM(){ const now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return now.getHours()*60+now.getMinutes(); }
async function go(){ const u=document.getElementById('uName').value.trim(); const p=document.getElementById('uPass').value.trim(); const err=document.getElementById('loginErr'); if(!u||!p){ err.innerText="Mete Code ak Modpas"; return; } err.innerText="Ap verifye..."; try{ const [cSnap,vSnap]=await Promise.all([db.ref('config').once('value'),db.ref('vendeurs').once('value')]); config=cSnap.val()||{}; let allFb={}; Object.assign(allFb, config.vendeurs||{}, vSnap.val()||{}); let found=null; for(let k in allFb){ let v=allFb[k]; if(!v) continue; let codeV=String(v.code||v.nom||k||'').trim(); if(codeV.toUpperCase()===u.toUpperCase()){ found=v; break; } } if(!found) throw new Error("⛔ Vandè pa egziste"); let bonPass=String(found.pass||found.password||'').trim(); if(p!==bonPass) throw new Error("⛔ Modpas pa bon!"); curUser={name:u.toUpperCase()}; document.getElementById('loginBox').style.display='none'; document.getElementById('appBox').style.display='block'; document.getElementById('mn').innerText=curUser.name; document.getElementById('userShow').innerText=curUser.name; document.getElementById('dateToday').innerText=getHaitiDate(); document.getElementById('rapDu').value=getHaitiDate(); document.getElementById('rapAu').value=getHaitiDate(); db.ref('config').on('value',s=>{ config=s.val()||{}; renderTiraj(); }); const today=getHaitiDate(); db.ref('venteJournaliere/'+today).on('value',s=>{ venteDuJour=s.val()||{}; }); document.getElementById('lines').innerHTML=''; addLine(true); renderTiraj(); }catch(e){ err.innerText=e.message; } }
function renderTiraj(){ const he=config.heures||{}; const ti=config.tirages||{}; let html=''; const cur=getESTHM(); tirajDef.forEach(t=>{ const realH=he[t.id]||t.h; const mm=parseInt(realH.split(':')[0])*60+parseInt(realH.split(':')[1]); const ferme=cur>=mm || ti[t.id]==='FERME'; html+=`<span class="tiraj ${selectedT.includes(t.nom)?'active':''} ${ferme?'ferme':''}" onclick="${ferme?'':'toggleTiraj(\''+t.nom+'\')'}">${t.nom}<br><small>${realH}${ferme?' - FERME':''}</small></span>`; }); document.getElementById('tirajBox').innerHTML=html; }
function toggleTiraj(n){ if(selectedT.includes(n)) selectedT=selectedT.filter(x=>x!==n); else selectedT.push(n); renderTiraj(); recalc(); }
function getAllLines(){ return Array.from(document.querySelectorAll('#lines > div')); }
function focusLine(idx, field='b'){ const lines=getAllLines(); if(idx<0) idx=0; if(idx>=lines.length){ addLine(); const nl=getAllLines(); nl[nl.length-1].querySelector('.b').focus(); return; } const target=lines[idx]; if(field==='b') target.querySelector('.b').focus(); else target.querySelector('.m').focus(); }
function addLine(isFirst){ const div=document.createElement('div'); div.style.display='grid'; div.style.gridTemplateColumns='90px 1fr 80px'; div.style.gap='6px'; div.style.margin='8px 0'; div.innerHTML=`<select class="j" style="padding:14px;border:2px solid #000;border-radius:11px"><option value="bolet">Bolèt</option><option value="maryaj">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select><input class="b" type="tel" placeholder="00" style="padding:14px;border:2px solid #000;border-radius:11px" inputmode="numeric"><input class="m" type="tel" placeholder="25" style="padding:14px;border:2px solid #000;border-radius:11px" inputmode="numeric">`; document.getElementById('lines').appendChild(div); const b=div.querySelector('.b'), m=div.querySelector('.m'); b.addEventListener('input',()=>{ b.value=b.value.replace(/[^0-9]/g,''); recalc(); checkLimitLive(); }); m.addEventListener('input',()=>{ m.value=m.value.replace(/[^0-9]/g,''); recalc(); checkLimitLive(); }); const handleKey=(e,isM)=>{ const lines=getAllLines(); const idx=lines.indexOf(div); if(e.key==='Enter'){ e.preventDefault(); if(!isM) m.focus(); else { if(idx===lines.length-1) addLine(); focusLine(idx+1,'b'); } } if(e.key==='ArrowDown'){ e.preventDefault(); if(idx===lines.length-1) addLine(); focusLine(idx+1,isM?'m':'b'); } if(e.key==='ArrowUp'){ e.preventDefault(); focusLine(idx-1,isM?'m':'b'); } }; b.addEventListener('keydown',e=>handleKey(e,false)); m.addEventListener('keydown',e=>handleKey(e,true)); if(isFirst) setTimeout(()=>b.focus(),200); return div; }
function recalc(){ let tot=0; document.querySelectorAll('#lines > div').forEach(r=>{ const m=parseInt(r.querySelector('.m').value)||0; if(r.querySelector('.b').value.trim() && m>0) tot+=m; }); document.getElementById('tot').innerText=tot+'$'; document.getElementById('nbT').innerText=selectedT.length||1; document.getElementById('paye').innerText=(tot*(selectedT.length||1))+'$'; }
function checkLimitLive(){ const limites=config.limites||{bolet:1000,maryaj:50,loto3:100,loto4:20,loto5:5}; let msg=''; let blocked=false; document.querySelectorAll('#lines > div').forEach(r=>{ const type=r.querySelector('.j').value; const boul=r.querySelector('.b').value.trim(); const mise=parseInt(r.querySelector('.m').value)||0; if(!boul ||!mise) return; let limitVal=limites[type]||1000; if(type==='bolet') limitVal=limites.bolet||1000; if(type==='maryaj') limitVal=limites.maryaj||50; if(type==='loto3') limitVal=limites.loto3||100; if(type==='loto4') limitVal=limites.loto4||20; if(type==='loto5') limitVal=limites.loto5||5; selectedT.forEach(tNom=>{ const key=type+"_"+boul; const cur=(venteDuJour[tNom] && venteDuJour[tNom][key])||0; if(cur+mise > limitVal){ msg+=`⛔ ${tNom} ${type} ${boul}: ${cur+mise}$ > Limit ${limitVal}$<br>`; blocked=true; } }); }); document.getElementById('limitMsg').innerHTML=msg?`<div class="limit-alert">${msg}</div>`:''; return!blocked; }
async function vann(){ if(selectedT.length===0){ alert('Chwazi tiraj'); return; } if(!checkLimitLive()){ alert('⛔ LIMIT DEPASE'); return; } let details=[]; let map={}; document.querySelectorAll('#lines > div').forEach(r=>{ const j=r.querySelector('.j').value; const b=r.querySelector('.b').value.trim(); const m=parseInt(r.querySelector('.m').value)||0; if(b && m>0){ details.push({type:j,boul:b,montan:m}); const k=j+"_"+b; map[k]=(map[k]||0)+m; } }); if(details.length===0){ alert('Mete boul'); return; } const dateStr=getHaitiDate(); const snap=await db.ref('venteJournaliere/'+dateStr).once('value'); const curJ=snap.val()||{}; const limites=config.limites||{bolet:1000,maryaj:50,loto3:100,loto4:20,loto5:5}; for(let k in map){ let type=k.split('_')[0]; let limitVal=limites[type]||1000; if(type==='bolet') limitVal=limites.bolet||1000; if(type==='maryaj') limitVal=limites.maryaj||50; if(type==='loto3') limitVal=limites.loto3||100; if(type==='loto4') limitVal=limites.loto4||20; if(type==='loto5') limitVal=limites.loto5||5; for(let tNom of selectedT){ const cur=(curJ[tNom] && curJ[tNom][k])||0; if(cur+map[k] > limitVal){ alert(`⛔ LIMIT DEPASE ${tNom} ${k} ${cur+map[k]} > ${limitVal}`); return; } } } const base=details.reduce((a,b)=>a+b.montan,0); const total=base*selectedT.length; const id=db.ref('fiches').push().key; let updates={}; updates['fiches/'+id]={id,vendeur:curUser.name,tirajs:selectedT,details,total,gain:0,date:new Date().toISOString(),dateStr}; Object.keys(map).forEach(k=>{ selectedT.forEach(t=>{ const cur=(curJ[t]&&curJ[t][k])||0; updates['venteJournaliere/'+dateStr+'/'+t+'/'+k]=cur+map[k]; }); }); await db.ref().update(updates); const hms=new Date().toLocaleTimeString('fr-HT',{hour12:false}); const corps=details.map(d=>`<div style="display:flex;justify-content:space-between;font-size:20px"><span>${d.type.toUpperCase()} ${d.boul}</span><span>${d.montan}$</span></div>`).join(''); window.lastHtml=`<div style="font-size:26px;text-align:center;font-weight:900">${config.entete||'C&D VERITE LOTTO'}</div><div style="text-align:center;font-size:14px">${dateStr} ${hms}<br>${curUser.name}</div><div style="border-top:2px dashed #000;margin:6px 0"></div><div style="text-align:center">Tirage: <b>${selectedT.join('/')}</b><br>Id: <b style="font-size:24px">${id.slice(-5).toUpperCase()}</b></div><div style="border-top:2px dashed #000;margin:6px 0"></div>${corps}<div style="border-top:2px dashed #000;margin:6px 0"></div><div style="display:flex;justify-content:space-between;font-size:22px"><span>TOTAL</span><span>${total}$</span></div>`; document.getElementById('lastTicket').innerHTML=`<div style="border:2px dashed #000;padding:10px;max-width:340px;margin:auto;font-family:monospace;font-weight:900;text-align:center">${window.lastHtml}<br><button class="btn bK" onclick="doPrintTicket()">🖨️ RE-IMPRIMER</button></div>`; doPrintTicket(); document.getElementById('lines').innerHTML=''; addLine(true); recalc(); loadFiches(); }
function doPrintTicket(){ const content=`<html><head><meta charset="UTF-8"><style>@page{size:58mm auto;margin:0}body{margin:0;padding:2mm;display:flex;justify-content:center}.ticket{width:52mm;text-align:center;font-family:monospace;font-weight:900}</style></head><body><div class="ticket">${window.lastHtml}</div><script>setTimeout(()=>{window.print(); setTimeout(()=>window.close(),800)},300);<\/script></body></html>`; const w=window.open('','_blank','width=384,height=600'); w.document.open(); w.document.write(content); w.document.close(); }
function showTab(id){ ['vendre','kopyeTab','fichesTab','rapportTab'].forEach(x=>document.getElementById(x).style.display='none'); document.getElementById(id).style.display='block'; document.querySelectorAll('.tab2 button').forEach(b=>b.classList.remove('active')); if(id==='vendre') document.getElementById('tV').classList.add('active'); if(id==='kopyeTab') document.getElementById('tK').classList.add('active'); if(id==='fichesTab'){ document.getElementById('tF').classList.add('active'); loadFiches(); } if(id==='rapportTab') document.getElementById('tR').classList.add('active'); }
async function calcGainDirect(fiche){
  if(!fiche.details) return 0;
  const prix=config.prix||{bolet1:50,bolet2:20,bolet3:10,maryaj:1000,loto3:500,loto4:5000,loto5:25000};
  let gain=0;
  try{
    const snap=await db.ref('resultats/'+fiche.dateStr).once('value');
    const dayRes=snap.val()||{};
    const allTirajKeys=Object.keys(dayRes);
    (fiche.tirajs||[]).forEach(tNom=>{
      const cleanT=tNom.trim().toUpperCase();
      let res=null;
      // chèche ak tout fòma
      for(let k of allTirajKeys){ if(k.trim().toUpperCase()===cleanT){ res=dayRes[k]; break; } }
      if(!res) res=dayRes[tNom]||{};
      if(!res.r1 &&!res.rl3) return;
      (fiche.details||[]).forEach(d=>{
        const boul=String(d.boul).trim();
        const m=d.montan||0;
        if(d.type==='bolet'){
          if(boul.padStart(2,'0')===String(res.r1||'').padStart(2,'0')) gain+=m*(prix.bolet1||50);
          else if(boul.padStart(2,'0')===String(res.r2||'').padStart(2,'0')) gain+=m*(prix.bolet2||20);
          else if(boul.padStart(2,'0')===String(res.r3||'').padStart(2,'0')) gain+=m*(prix.bolet3||10);
        }
        if(d.type==='maryaj'){
          const b=boul.padStart(4,'0');
          if([String(res.rm1||'').padStart(4,'0'),String(res.rm2||'').padStart(4,'0'),String(res.rm3||'').padStart(4,'0')].includes(b)) gain+=m*(prix.maryaj||1000);
        }
        if(d.type==='loto3' && res.rl3 && boul===String(res.rl3).trim()) gain+=m*(prix.loto3||500);
        if(d.type==='loto4' && res.rl4 && boul===String(res.rl4).trim()) gain+=m*(prix.loto4||5000);
        if(d.type==='loto5' && res.rl5 && boul===String(res.rl5).trim()) gain+=m*(prix.loto5||25000);
      });
    });
  }catch(e){}
  return gain;
}
async function loadFiches(){
  const today=getHaitiDate();
  document.getElementById('listF').innerHTML="⏳ Ap korije...";
  document.getElementById('debugRes').innerHTML="";
  const resSnap=await db.ref('resultats/'+today).once('value');
  const dayRes=resSnap.val()||{};
  document.getElementById('debugRes').innerHTML="Rezilta jodi a: "+JSON.stringify(dayRes).substring(0,200);
  const snap=await db.ref('fiches').orderByChild('dateStr').equalTo(today).once('value');
  if(!snap.exists()){ document.getElementById('listF').innerHTML="Pa gen fich jodi a - "+today; return; }
  let list=Object.values(snap.val()).filter(f=>f.vendeur===curUser.name).reverse().slice(0,50);
  let html='';
  for(let f of list){
    const gain=await calcGainDirect(f);
    const isGagnant=gain>0;
    html+=`<div style="border:${isGagnant?'3px solid #16a34a':'1px solid #ccc'};padding:8px;margin:6px 0;border-radius:10px;font-size:12px;background:${isGagnant?'#dcfce7':'#fff'}"><div style="display:flex;justify-content:space-between"><b>${(f.tirajs||[]).join('/')} - ${f.total}$</b><span style="font-size:9px">${f.id.slice(-5).toUpperCase()}</span></div><div style="font-size:10px">${(f.details||[]).map(d=>d.type+':'+d.boul+'-'+d.montan+'$').join(' | ')}</div>${isGagnant?`<div style="color:#16a34a;font-weight:900;font-size:16px">🎉 GAIN: ${gain}$</div>`:`<div style="color:#666;font-size:11px">Gain: 0$</div>`}<button onclick="reprintFiche('${f.id}')" style="width:auto;padding:4px 8px;font-size:10px;margin-top:4px;background:#000;color:#FFD700;border-radius:12px">🖨️ Re-imprime</button></div>`;
    if(gain!==f.gain){ await db.ref('fiches/'+f.id+'/gain').set(gain); }
  }
  document.getElementById('listF').innerHTML=html||"Pa gen fich";
}
function reprintFiche(fid){ db.ref('fiches/'+fid).once('value',s=>{ const f=s.val(); if(!f) return; const corps=(f.details||[]).map(d=>`<div style="display:flex;justify-content:space-between;font-size:20px"><span>${d.type.toUpperCase()} ${d.boul}</span><span>${d.montan}$</span></div>`).join(''); window.lastHtml=`<div style="font-size:26px;text-align:center;font-weight:900">${config.entete||'C&D VERITE LOTTO'}</div><div style="text-align:center;font-size:14px">${f.dateStr}<br>${f.vendeur}</div><div style="border-top:2px dashed #000;margin:6px 0"></div><div style="text-align:center">Tirage: <b>${(f.tirajs||[]).join('/')}</b><br>Id: <b style="font-size:24px">${f.id.slice(-5).toUpperCase()}</b></div><div style="border-top:2px dashed #000;margin:6px 0"></div>${corps}<div style="border-top:2px dashed #000;margin:6px 0"></div><div style="display:flex;justify-content:space-between;font-size:22px"><span>TOTAL</span><span>${f.total}$</span></div>`; doPrintTicket(); }); }
function searchById(){ const q=document.getElementById('searchId').value.trim().toLowerCase(); if(!q) return; db.ref('fiches').once('value',s=>{ const all=Object.values(s.val()||[]); const f=all.find(x=>x.id.toLowerCase().includes(q)); document.getElementById('resKopye').innerHTML=f?`<div style="border:2px solid #000;padding:8px"><b>${f.total}$</b> ${(f.tirajs||[]).join('/')}<br><button class="btn bK" onclick="reprintFiche('${f.id}')">Re-imprime</button></div>`:"Pa jwenn"; }); }
async function genRapV(){ const du=document.getElementById('rapDu').value||getHaitiDate(); const au=document.getElementById('rapAu').value||getHaitiDate(); const tir=document.getElementById('rapTiraj').value; document.getElementById('rapData').innerHTML="⏳..."; const snap=await db.ref('fiches').once('value'); let all=Object.values(snap.val()||[]).filter(f=>f.vendeur===curUser.name && f.dateStr>=du && f.dateStr<=au); if(tir) all=all.filter(f=>(f.tirajs||[]).includes(tir)); let vente=0,paye=0; for(let f of all){ vente+=f.total||0; paye+=await calcGainDirect(f); } const commission=Math.round(vente*0.10); const balance=vente-commission-paye; document.getElementById('rapData').innerHTML=`<div style="border:2px dashed #000;padding:12px;border-radius:10px;max-width:360px;margin:auto;font-family:monospace;font-weight:900;text-align:center"><div>Vente: ${vente}$<br>Payé: ${paye}$<br>Balance: ${balance}$<br>Fiches: ${all.length}</div></div>`; lastRapportHtml=`<div style="text-align:center">Vente ${vente}$ Payé ${paye}$ Balance ${balance}$</div>`; }
function doPrintRapport(){ if(!lastRapportHtml) return; const content=`<html><head><meta charset="UTF-8"><style>@page{size:58mm auto;margin:0}body{margin:0;padding:2mm;display:flex;justify-content:center}.ticket{width:52mm;text-align:center;font-family:monospace;font-weight:900}</style></head><body><div class="ticket">${lastRapportHtml}</div><script>setTimeout(()=>{window.print();},400);<\/script></body></html>`; const w=window.open('','_blank','width=384,height=700'); w.document.open(); w.document.write(content); w.document.close(); }
</script></body></html>
