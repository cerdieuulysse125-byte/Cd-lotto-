<!DOCTYPE html><html lang='ht'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>C&D V25.7 - UNIVERSAL DIRECT PRINT</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#eef2f7}.h{background:#0a4a2e;color:#d4af37;padding:10px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:3px solid #d4af37}.card{background:#fff;border-radius:12px;padding:10px;margin:8px;box-shadow:0 2px 6px rgba(0,0,0,.08);border-left:4px solid #0a4a2e}.row{display:flex;gap:12px;align-items:center;margin-bottom:12px;justify-content:space-between;padding:0 6px}.inp{width:88px;min-width:88px;height:52px;border:2.5px solid #0a4a2e;border-radius:10px;font-weight:800;font-size:14px;text-align:center;background:#fff;margin-right:8px}.inpN{width:82px;min-width:82px;height:52px;border:2.5px solid #0a4a2e;border-radius:10px;font-weight:800;font-size:20px;text-align:center;background:#fff;margin-right:8px}.inpL{width:100%;height:48px;border:2.5px solid #0a4a2e;border-radius:10px;padding:0 10px;font-size:16px}.btn{padding:14px;border:0;border-radius:10px;color:#fff;font-weight:800;width:100%}.btnG{background:#0a4a2e;color:#d4af37;border:2px solid #d4af37}.btnB{background:#0a4a2e;color:#d4af37;border:1px solid #d4af37}.btnR{background:#e11d48;width:42px;height:52px;border-radius:10px;border:0;color:#fff;font-weight:800;margin-left:8px}.btnF{width:36px;height:52px;border:2px solid #0a4a2e;border-radius:10px;background:#fff;font-size:18px;font-weight:900;margin-left:8px}.betRow{background:#f9fdf9;border:1.5px solid #d4af37;border-radius:10px;padding:8px;margin-bottom:12px}.total{background:#0a4a2e;color:#d4af37;border:2px solid #d4af37;border-radius:12px;padding:12px;display:flex;justify-content:space-between;font-weight:800;margin:8px}.tlist{display:none;position:fixed;left:8px;right:8px;top:90px;background:#fff;border:3px solid #0a4a2e;border-radius:12px;z-index:9999;padding:8px;grid-template-columns:78px 78px 78px;gap:8px;max-height:70vh;overflow:auto;justify-content:center}.tlist.open{display:grid}.topt{width:78px;min-height:68px;border:2px solid #ccc;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;text-align:center}#loginPage{display:block}#mainPage{display:none;min-height:100vh;padding-bottom:80px}#mainPage.show{display:block}.tabPage{display:none!important}.tabPage.active{display:block!important}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid #0a4a2e;z-index:5000;height:60px}.tab{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:0;background:#eee;border-right:1px solid #ccc}.tab.active{background:#0a4a2e;color:#d4af37}#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a4a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;transition:opacity 0.5s}#prev{background:#fff;margin:8px;padding:6px;font-family:'Courier New',monospace;font-size:12px;line-height:1.25;color:#000;white-space:pre;border:1px dashed #000;width:100%;max-width:56mm;text-align:center}.printer-bar{background:#dcfce7;border:3px solid #00c853;border-radius:12px;padding:10px;margin:8px}</style></head><body>
<div id='splash'><div style='width:110px;height:110px;border:3px solid #d4af37;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;font-size:36px;color:#0a4a2e;font-weight:900'>C&D</div><div style='color:#d4af37;font-weight:800;margin-top:15px'>C&D VERITE LOTTO V25.7 UNIVERSAL</div></div>
<div class='h'><div><b id='vName'>Vendeur</b><br><small id='heureHaiti'>SYNC...</small></div><div><button onclick='localStorage.clear();location.reload()'>Cache</button></div></div>
<div id='loginPage'><div class='card' style='max-width:400px;margin:20px auto;text-align:center'><h3>C&D VERITE LOTTO V25.7 UNIVERSAL</h3><input id='inputSerial' class='inpL' placeholder='Serial' style='margin-top:12px'><input id='inputPass' type='password' class='inpL' placeholder='Modpas' style='margin-top:8px'><button class='btn btnG' style='margin-top:10px' onclick='doLogin()'>Konekte</button><div id='loginMsg' style='color:red'></div></div></div>
<div id='mainPage'>
<div id='pV' class='tabPage active'>
<div class='printer-bar'><b>🖨️ V25.7 UNIVERSAL - ENPRIME DIRÈK</b><br><small>Pa bezwen SCAN - Depi ou peze VANN li enprime!</small><br><span id='sdkStatus'>Prè</span> | <span id='btStatus'>Auto</span></div>
<div id='priceInfo' style='background:#0a4a2e;color:#d4af37;padding:6px;text-align:center'>SYNC...</div>
<div class='card'><div style='display:flex;justify-content:space-between'><b id='tirajTitle'>Tiraj</b><button onclick='selAll()'>Tout ouve</button></div><div class='row' style='margin-top:10px'><div id='kazT' style='border:2px solid #0a4a2e;padding:10px;border-radius:10px' onclick='document.getElementById("tlist").classList.toggle("open")'><span id='txtT'>Chwazi tiraj</span></div></div><div id='tlist' class='tlist'></div><div id='fermetiInfo'></div></div>
<div class='card'><div id='bets'></div><button class='btn btnB' onclick='addR()'>+ Liy</button></div>
<div class='total'><span id='dt'>Total $0</span><span id='gt'>$0</span></div>
<div style='display:flex;gap:8px;margin:8px'><button class='btn btnG' style='flex:1;height:58px;font-size:20px' onclick='vann()'>VANN & ENPRIME DIRÈK</button><button class='btn btnB' style='flex:1' onclick='printLast()'>RE-PRINT</button></div>
<div id='prev' style='display:none'></div></div>
<div id='pP' class='tabPage'><div class='card'><h3>5- Paramèt UNIVERSAL</h3><div id='scanResult' style='background:#fff;border:2px solid #0a4a2e;padding:10px;white-space:pre-wrap'>✅ READY - Peze VANN pou enprime dirèk</div><div style='display:flex;gap:8px;margin-top:10px'><button class='btn btnG' onclick='testPrintAdvanced()'>TÈS DIRÈK</button><button class='btn' style='background:#000;color:#fff' onclick='diagnostik()'>DIAGNOSTIK</button></div><button class='btn' style='background:#ff9800;color:#fff;margin-top:8px' onclick='clearBT()'>Efase BT</button></div></div>
<div class='tabs'><button class='tab active' onclick="goTab('pV',this)">Vendre</button><button class='tab' onclick="goTab('pP',this)">Paramèt</button></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com",projectId:"cd-lotto"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database?firebase.database():null;
const TIRAJ_DEFAULT=[["FL soir","21:00"],["NY soir","22:00"],["FL midi","13:00"]];
let DB={vendeurs:{},tickets:{},heures:{},results:{},config:{tel:'+52 7298079596'},prix:{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000}},limites:{global:{bor:1500,mar:100}}},CUR=null,selT=[],LAST_TXT='',serverOffset=0,isPrinting=false;window._lastPrintTime=0;window._btChar=null;
function hideSplash(){let sp=document.getElementById('splash');if(sp){sp.style.opacity='0';setTimeout(()=>sp.style.display='none',400);}}setTimeout(hideSplash,2000);
function getHaitiTime(){return new Date();}function getHaitiDateStr(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}function formatHaiti(d){return d.toLocaleTimeString();}
function getTirajForVendeur(){return Object.fromEntries(TIRAJ_DEFAULT);}function getHeureProprio(n){return TIRAJ_DEFAULT.find(x=>x[0]==n)?.[1]||'';}function isOpen(){return true;}
function getMyPrix(){return DB.prix.global;}function getMyLimite(){return DB.limites.global;}function getChifRequis(j){return j==='boul'?2:j==='loto3'?3:j==='loto4'?4:j==='loto5'?5:4;}function getLimiteForJeu(){return 1500;}
function getTel(){return '+52 7298079596';}function getLogoUrl(){return localStorage.getItem('verite_logo')||'';}
function getPrintText(){return (window.lastTicketText||LAST_TXT||'').toString().trim();}
async function printUniversel(t){
  if(isPrinting && Date.now()-window._lastPrintTime<2500) return;
  isPrinting=true; window._lastPrintTime=Date.now(); setTimeout(()=>{isPrinting=false;},5000);
  let txt=(t||getPrintText()||'').toString().trim(); if(!txt){isPrinting=false;return;}
  let res=document.getElementById('scanResult'); if(res) res.innerText='🖨️ Ap enprime...\n'+txt.substring(0,100);
  try{ if(window.woyou?.printerService?.printText){ window.woyou.printerService.printText(txt+"\n\n\n\n",null); try{window.woyou.printerService.cutPaper(null);}catch(e){} if(res) res.innerText='✅ Sunmi V2 Pro - ENPRIME!'; isPrinting=false; return; } }catch(e){}
  try{ if(window.sunmiInnerPrinter?.printText){ window.sunmiInnerPrinter.printText(txt+"\n\n\n\n"); try{window.sunmiInnerPrinter.cutPaper();}catch(e){} if(res) res.innerText='✅ Sunmi Inner - ENPRIME!'; isPrinting=false; return; } }catch(e){}
  try{ if(window.InnerPrinterManager){ window.InnerPrinterManager.getInstance().bindService(this,{onServiceConnected:s=>{s.printText(txt+"\n\n\n\n",null); s.cutPaper(null); if(res) res.innerText='✅ Sunmi Manager - ENPRIME!';}}); await new Promise(r=>setTimeout(r,1200)); isPrinting=false; return; } }catch(e){}
  try{ if(window._btChar?.writeValue){ let d=new TextEncoder().encode('\x1B\x40'+txt+'\n\n\n\x1D\x56\x00'); for(let i=0;i<d.length;i+=80) await window._btChar.writeValue(d.slice(i,i+80)); if(res) res.innerText='✅ BT - ENPRIME!'; isPrinting=false; return; } }catch(e){}
  try{ if(navigator.bluetooth){ if(res) res.innerText='📱 Chwazi enprimant BT...'; let dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['0000ff00-0000-1000-8000-00805f9b34fb']}); if(dev.name?.toLowerCase().includes('inner')){ if(res) res.innerText='⛔ Pa chwazi InnerPrinter nan BT! Fè Dissocier li nan paramèt Android.'; isPrinting=false; return; } let srv=await dev.gatt.connect(); let ch=null; for(let svc of await srv.getPrimaryServices()){ for(let c of await svc.getCharacteristics()){ if(c.properties.write){ch=c;break;}} if(ch) break; } window._btChar=ch; let d=new TextEncoder().encode('\x1B\x40'+txt+'\n\n\n\x1D\x56\x00'); for(let i=0;i<d.length;i+=80) await ch.writeValue(d.slice(i,i+80)); if(res) res.innerText='✅ BT '+dev.name+' - ENPRIME!'; isPrinting=false; return; } }catch(e){}
  try{ let iframe=document.createElement('iframe'); iframe.style.display='none'; document.body.appendChild(iframe); iframe.contentDocument.write('<pre>'+txt+'</pre>'); iframe.contentDocument.close(); iframe.contentWindow.print(); if(res) res.innerText='✅ Chrome Print'; }catch(e){}
  isPrinting=false;
}
function printBT(t){return printUniversel(t);}function enprimeSunmiNatif(){return printUniversel();}function scanBT(){return printUniversel();}function scanSunmi(){return printUniversel();}
function clearBT(){window._btChar=null; localStorage.removeItem('printerConfig'); alert('BT efase');}
function diagnostik(){let i='UA:'+navigator.userAgent+'\nwoyou:'+!!window.woyou+'\ninner:'+!!window.sunmiInnerPrinter+'\nbt:'+!!navigator.bluetooth; document.getElementById('scanResult').innerText=i; alert(i);}
function renderT(){let tlist=document.getElementById('tlist');let html='';TIRAJ_DEFAULT.forEach(([name,hp])=>{let chk=selT.includes(name)?'checked':'';html+='<label class="topt"><input type="checkbox" value="'+name+'" '+chk+' onchange="chg(this)"><span>'+name+'</span><small>'+hp+'</small></label>';});tlist.innerHTML=html;}
function chg(el){if(el.checked)selT.push(el.value);else selT=selT.filter(x=>x!=el.value);document.getElementById('txtT').innerText=selT.length?selT.join(','):'Chwazi';upd();}
function selAll(){selT=TIRAJ_DEFAULT.map(x=>x[0]);renderT();document.getElementById('txtT').innerText=selT.join(',');upd();}
function addR(){let c=document.getElementById('bets');let d=document.createElement('div');d.className='row betRow';d.innerHTML='<select class="jeu inp"><option value="boul">BOUL</option><option value="maryaj">MARYAJ</option></select><input class="boul inpN" placeholder="--"><input class="mise inpN" placeholder="$" oninput="upd()"><button class="btnR" onclick="this.parentElement.remove();upd()">X</button>';c.appendChild(d);return d;}
function upd(){let sum=0;document.querySelectorAll('.betRow').forEach(r=>{let mm=parseInt(r.querySelector('.mise').value)||0; if(mm) sum+=mm;});document.getElementById('dt').innerText='Total $'+sum+' x '+selT.length+' = $'+(sum*selT.length);document.getElementById('gt').innerText='$'+(sum*selT.length);}
function build(tk){let W=32;function center(t){t=String(t).trim(); if(t.length>=W) return t; let l=Math.floor((W-t.length)/2); return ' '.repeat(l)+t;} let txt=''; txt+=center('C&D VERITE LOTTO')+'\n'; txt+=center('****************************')+'\n'; txt+=center('ID TICKET: '+tk.id)+'\n'; txt+=center('****************************')+'\n'; txt+=center('Date: '+getHaitiDateStr())+'\n'; selT.forEach(t=>{txt+=center(t)+'\n';}); txt+='----------------------------\n'; tk.bets.forEach(b=>{txt+=b.numero+' x $'+b.mise+'\n';}); txt+='----------------------------\n'; txt+=center('Total => '+tk.total+' HTG')+'\n'; txt+=center('ID: '+tk.id)+'\n'; txt+=center('Mesi!')+'\n'; return txt;}
function showPreview(txt){let p=document.getElementById('prev');p.style.display='block';p.innerText=txt;}
function printLast(){printUniversel(LAST_TXT);}function testPrintAdvanced(){let tk={id:'TEST-'+Date.now().toString().slice(-4),bets:[{type:'boul',numero:'44',mise:10}],total:10};let txt=build(tk);LAST_TXT=txt;showPreview(txt);printUniversel(txt);}
async function doLogin(){let s=document.getElementById('inputSerial').value.trim();CUR={_key:'15',serial:s,nom:'Vendeur'};localStorage.setItem('curV',JSON.stringify(CUR));openMain();}
function openMain(){document.getElementById('loginPage').style.display='none';document.getElementById('mainPage').style.display='block';renderT();addR();upd();hideSplash();}
function logout(){localStorage.clear();location.reload();}
async function vann(){let bets=[];document.querySelectorAll('.betRow').forEach(r=>{let b=r.querySelector('.boul').value.trim(),m=parseInt(r.querySelector('.mise').value); if(b&&m) bets.push({numero:b,mise:m});});if(!bets.length){alert('VID');return}if(!selT.length){alert('Chwazi Tiraj');return}let tk={id:'T'+Date.now().toString().slice(-6),bets,total:bets.reduce((a,b)=>a+b.mise,0)};let txt=build(tk);LAST_TXT=txt;window.lastTicketText=txt;showPreview(txt);printUniversel(txt);}
function goTab(id,el){document.querySelectorAll('.tabPage').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');}
let curV=localStorage.getItem('curV');if(curV){try{CUR=JSON.parse(curV);openMain();}catch(e){}}
</script></body></html>
