<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V114.5 FLECH KORIJE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:900}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:14px;border:2px solid #000;border-radius:11px;width:100%;font-size:16px;margin:4px 0}.line{display:grid;grid-template-columns:90px 1fr 80px;gap:6px;margin:8px 0}.line.focused{outline:2px solid #FFD700;border-radius:11px}.tiraj{padding:7px 11px;margin:3px;border:2px solid #000;border-radius:20px;font-weight:900;display:inline-block;font-size:12px;cursor:pointer}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{opacity:.25;pointer-events:none;background:#ccc}.btn{padding:14px;width:100%;border:none;border-radius:11px;font-weight:900;margin:6px 0}.bK{background:#000;color:#FFD700}.tab2{display:flex;background:#000;gap:1px;position:sticky;top:0;z-index:10}.tab2 button{flex:1;padding:11px 1px;font-size:11px;font-weight:900;background:#000;color:#FFD700;border:none}.tab2 button.active{background:#FFD700;color:#000}.printer-ok{background:#d4edda;color:#155724;border:1px solid #155724;padding:6px;border-radius:8px;text-align:center;font-size:11px;font-weight:900;margin:6px 0}</style>
</head><body>
<div class="h">V114.5 FLECH + KORIJE - SYNC V127.3</div>
<div id="loginBox" class="card" style="text-align:center;padding-top:30px"><h3>Connexion</h3><input id="uName" placeholder="Code"><input id="uPass" type="password" placeholder="Modpas"><button class="btn bK" onclick="go()">Antre</button><div id="loginErr" style="color:red;font-weight:900;font-size:13px"></div></div>
<div id="appBox" style="display:none"><div class="tab2"><button id="tV" class="active" onclick="showTab('vendre')">Vendre</button><button id="tK" onclick="showTab('kopyeTab')">Copier</button><button id="tF" onclick="showTab('fichesTab')">Fiches</button><button id="tR" onclick="showTab('rapportTab')">Rapport</button></div>
<div id="vendre" class="card"><div style="text-align:center;font-weight:900;font-size:12px">TIRAJ - <span id="dateToday" style="background:#FFD700;padding:2px 6px;border-radius:6px"></span> - <span id="userShow"></span><div style="font-size:10px;color:#666">⏎ Enter / ↓ Flèch desann = liy suivan, ↑ = liy anvan</div></div><div id="printerStatus" class="printer-ok">🖨️ Sunmi pare</div><div id="tirajBox" style="text-align:center;margin:8px 0"></div><div style="display:flex;background:#000;color:#FFD700;padding:7px;font-weight:900;border-radius:7px;font-size:11px"><div style="width:90px">JEUX</div><div style="flex:1">BOUL</div><div style="width:80px">MIZ</div></div><div id="lines"></div><div style="background:#000;color:#fff;padding:12px;border-radius:10px;text-align:center;margin-top:8px">Total <span id="tot">0$</span> × <span id="nbT">1</span><div style="font-size:28px;color:#FFD700">A PEYE <span id="paye">0$</span></div></div><button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button><div id="lastTicket"></div></div>
<div id="kopyeTab" class="card" style="display:none"><h3>Copier</h3><input id="searchId" placeholder="ID"><button class="btn bK" onclick="searchById()">Chèche</button><div id="resKopye"></div></div>
<div id="fichesTab" class="card" style="display:none"><h3>Fiches - <span id="mn"></span> <button onclick="loadFiches()" style="width:auto;padding:6px 10px;font-size:10px;background:#000;color:#FFD700;border-radius:20px">🔄 Rafrechi</button></h3><div id="listF"></div></div>
<div id="rapportTab" class="card" style="display:none"><h3>📊 Rapport</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><label style="font-size:11px;font-weight:900">Du</label><input id="rapDu" type="date"></div><div><label style="font-size:11px;font-weight:900">Au</label><input id="rapAu" type="date"></div></div><div><label style="font-size:11px;font-weight:900">Tirage</label><select id="rapTiraj"><option value="">Tous</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select></div><button class="btn bK" onclick="genRapV()">Générer</button><div id="rapData"></div></div>
</div>
<script>
const firebaseConfig={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"}; firebase.initializeApp(firebaseConfig); const db=firebase.database();
let curUser=null, selectedT=[], config={}, resultats={}, lastRapportHtml='';
let tirajDef=[{id:'gaMidi',nom:'GA MIDI',h:'12:15'},{id:'flMidi',nom:'FL MIDI',h:'13:15'},{id:'nyMidi',nom:'NY MIDI',h:'14:15'},{id:'gaSoir',nom:'GA SOIR',h:'18:20'},{id:'flSoir',nom:'FL SOIR',h:'21:10'},{id:'nySoir',nom:'NY SOIR',h:'21:30'}];
function getHaitiDate(){ const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getESTHM(){ const now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return now.getHours()*60+now.getMinutes(); }
async function go(){ const u=document.getElementById('uName').value.trim(); const p=document.getElementById('uPass').value.trim(); const err=document.getElementById('loginErr'); if(!u||!p){ err.innerText="Mete Code ak Modpas"; return; } err.innerText="Ap verifye..."; try{ const [cSnap,vSnap,rSnap]=await Promise.all([db.ref('config').once('value'),db.ref('vendeurs').once('value'),db.ref('resultats').once('value')]); config=cSnap.val()||{}; resultats=rSnap.val()||{}; let allFb={}; Object.assign(allFb, config.vendeurs||{}, vSnap.val()||{}); let found=null, foundKey=null; for(let k in allFb){ let v=allFb[k]; if(!v) continue; let codeV=String(v.code||v.nom||k||'').trim(); if(codeV.toUpperCase()===u.toUpperCase()){ found=v; foundKey=k; break; } } if(!found){ throw new Error("⛔ Vandè pa egziste"); } let bonPass=String(found.pass||found.password||'').trim(); if(p!==bonPass){ throw new Error("⛔ Modpas pa bon!"); } if(String(found.statut||'OUVERT').toUpperCase().includes('FERME')||found.actif===false){ throw new Error("⛔ Vandè sa FÈMEN"); } curUser={name:u.toUpperCase(),key:foundKey}; document.getElementById('loginBox').style.display='none'; document.getElementById('appBox').style.display='block'; document.getElementById('mn').innerText=curUser.name; document.getElementById('userShow').innerText=curUser.name; document.getElementById('dateToday').innerText=getHaitiDate(); document.getElementById('rapDu').value=getHaitiDate(); document.getElementById('rapAu').value=getHaitiDate(); db.ref('config').on('value',s=>{ config=s.val()||{}; renderTiraj(); }); db.ref('resultats').on('value',s=>{ resultats=s.val()||{}; }); document.getElementById('lines').innerHTML=''; addLine(true); renderTiraj(); }catch(e){ err.innerText=e.message; } }
function renderTiraj(){ const he=config.heures||{}; const ti=config.tirages||{}; let html=''; const cur=getESTHM(); tirajDef.forEach(t=>{ const realH=he[t.id]||t.h; const mm=parseInt(realH.split(':')[0])*60+parseInt(realH.split(':')[1]); const ferme=cur>=mm || ti[t.id]==='FERME'; html+=`<span class="tiraj ${selectedT.includes(t.nom)?'active':''} ${ferme?'ferme':''}" onclick="${ferme?'':'toggleTiraj(\''+t.nom+'\')'}">${t.nom}<br><small>${realH}${ferme?' - FERME':''}</small></span>`; }); document.getElementById('tirajBox').innerHTML=html; }
function toggleTiraj(n){ if(selectedT.includes(n)) selectedT=selectedT.filter(x=>x!==n); else selectedT.push(n); renderTiraj(); recalc(); }
function getAllLines(){ return Array.from(document.querySelectorAll('#lines > div')); }
function focusLine(idx, field='b'){ const lines=getAllLines(); if(idx<0) idx=0; if(idx>=lines.length){ addLine(); const nl=getAllLines(); nl[nl.length-1].querySelector('.b').focus(); return; } const target=lines[idx]; target.classList.add('focused'); setTimeout(()=>target.classList.remove('focused'),400); if(field==='b') target.querySelector('.b').focus(); else target.querySelector('.m').focus(); }
function addLine(isFirst){ const div=document.createElement('div'); div.className='line'; div.style.display='grid'; div.style.gridTemplateColumns='90px 1fr 80px'; div.style.gap='6px'; div.style.margin='8px 0'; div.innerHTML=`<select class="j" style="padding:14px;border:2px solid #000;border-radius:11px"><option value="bolet">Bolèt</option><option value="maryaj">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select><input class="b" type="tel" placeholder="00" style="padding:14px;border:2px solid #000;border-radius:11px" inputmode="numeric"><input class="m" type="tel" placeholder="25" style="padding:14px;border:2px solid #000;border-radius:11px" inputmode="numeric">`; document.getElementById('lines').appendChild(div); const b=div.querySelector('.b'), m=div.querySelector('.m'), j=div.querySelector('.j');
  j.addEventListener('change',recalc);
  b.addEventListener('input',()=>{ b.value=b.value.replace(/[^0-9]/g,''); recalc(); });
  m.addEventListener('input',()=>{ m.value=m.value.replace(/[^0-9]/g,''); recalc(); });
  // TOUCHE FLECHE + ENTER - AVANSE LIY SUIVAN
  const handleKey=(e, isM)=>{
    const lines=getAllLines(); const idx=lines.indexOf(div);
    if(e.key==='Enter'){
      e.preventDefault();
      if(!isM){ m.focus(); } else { // mizan -> liy suivan
        if(idx===lines.length-1) addLine();
        focusLine(idx+1,'b');
      }
    }
    if(e.key==='ArrowDown'){
      e.preventDefault();
      if(idx===lines.length-1) addLine();
      focusLine(idx+1, isM?'m':'b');
    }
    if(e.key==='ArrowUp'){
      e.preventDefault();
      focusLine(idx-1, isM?'m':'b');
    }
  };
  b.addEventListener('keydown', (e)=>handleKey(e,false));
  m.addEventListener('keydown', (e)=>handleKey(e,true));
  if(isFirst) setTimeout(()=>b.focus(),200);
  return div;
}
function recalc(){ let tot=0; document.querySelectorAll('#lines > div').forEach(r=>{ const m=parseInt(r.querySelector('.m').value)||0; if(r.querySelector('.b').value.trim() && m>0) tot+=m; }); document.getElementById('tot').innerText=tot+'$'; document.getElementById('nbT').innerText=selectedT.length||1; document.getElementById('paye').innerText=(tot*(selectedT.length||1))+'$'; }
async function vann(){ if(selectedT.length===0){ alert('Chwazi tiraj'); return; } let details=[]; let map={}; document.querySelectorAll('#lines > div').forEach(r=>{ const j=r.querySelector('.j').value; const b=r.querySelector('.b').value.trim(); const m=parseInt(r.querySelector('.m').value)||0; if(b && m>0){ details.push({type:j,boul:b,montan:m}); const k=j+"_"+b; map[k]=(map[k]||0)+m; } }); if(details.length===0){ alert('Mete boul'); return; } const dateStr=getHaitiDate(); const snap=await db.ref('venteJournaliere/'+dateStr).once('value'); const curJ=snap.val()||{}; const base=details.reduce((a,b)=>a+b.montan,0); const total=base*selectedT.length; const id=db.ref('fiches').push().key; let updates={}; updates['fiches/'+id]={id,vendeur:curUser.name,tirajs:selectedT,details,total,gain:0,date:new Date().toISOString(),dateStr}; Object.keys(map).forEach(k=>{ selectedT.forEach(t=>{ const cur=(curJ[t]&&curJ[t][k])||0; updates['venteJournaliere/'+dateStr+'/'+t+'/'+k]=cur+map[k]; }); }); await db.ref().update(updates); const hms=new Date().toLocaleTimeString('fr-HT',{hour12:false}); const corps=details.map(d=>`<div style="display:flex;justify-content:space-between;font-size:20px"><span>${d.type.toUpperCase()} ${d.boul}</span><span>${d.montan}$</span></div>`).join(''); window.lastHtml=`<div style="font-size:26px;text-align:center;font-weight:900">${config.entete||'C&D VERITE LOTTO'}</div><div style="text-align:center;font-size:14px">${dateStr} ${hms}<br>${curUser.name}</div><div style="border-top:2px dashed #000;margin:6px 0"></div><div style="text-align:center">Tirage: <b>${selectedT.join('/')}</b><br>Id: <b style="font-size:24px">${id.slice(-5).toUpperCase()}</b></div><div style="border-top:2px dashed #000;margin:6px 0"></div>${corps}<div style="border-top:2px dashed #000;margin:6px 0"></div><div style="display:flex;justify-content:space-between;font-size:22px"><span>TOTAL</span><span>${total}$</span></div>`; document.getElementById('lastTicket').innerHTML=`<div style="border:2px dashed #000;padding:10px;max-width:340px;margin:auto;font-family:monospace;font-weight:900;text-align:center">${window.lastHtml}<br><button class="btn bK" onclick="doPrintTicket()">🖨️ RE-IMPRIMER</button></div>`; doPrintTicket(); document.getElementById('lines').innerHTML=''; addLine(true); recalc(); loadFiches(); }
function doPrintTicket(){ const content=`<html><head><meta charset="UTF-8"><style>@page{size:58mm auto;margin:0}body{margin:0;padding:2mm;display:flex;justify-content:center}.ticket{width:52mm;text-align:center;font-family:monospace;font-weight:900}</style></head><body><div class="ticket">${window.lastHtml}</div><script>setTimeout(()=>{window.print(); setTimeout(()=>window.close(),800)},300);<\/script></body></html>`; const w=window.open('','_blank','width=384,height=600'); w.document.open(); w.document.write(content); w.document.close(); }
function showTab(id){ ['vendre','kopyeTab','fichesTab','rapportTab'].forEach(x=>document.getElementById(x).style.display='none'); document.getElementById(id).style.display='block'; document.querySelectorAll('.tab2 button').forEach(b=>b.classList.remove('active')); if(id==='vendre') document.getElementById('tV').classList.add('active'); if(id==='kopyeTab') document.getElementById('tK').classList.add('active'); if(id==='fichesTab'){ document.getElementById('tF').classList.add('active'); loadFiches(); } if(id==='rapportTab') document.getElementById('tR').classList.add('active'); }
// FICH KORIJE - KALKIL GAIN OTOMATIK AK PRIX 3 LOT
function calcGain(fiche){
  if(!fiche.details) return 0;
  let gain=0;
  const prix=config.prix||{bolet1:50,bolet2:20,bolet3:10,maryaj:1000,loto3:500,loto4:5000,loto5:25000};
  const dateRes=fiche.dateStr;
  const tirajs=fiche.tirajs||[];
  tirajs.forEach(tNom=>{
    const resDay=resultats[dateRes]||{}; const res=resDay[tNom]||{}; if(!res.r1) return;
    fiche.details.forEach(d=>{
      const boul=String(d.boul).trim(); const m=d.montan||0;
      if(d.type==='bolet'){
        if(boul===String(res.r1).padStart(2,'0')) gain+=m*(prix.bolet1||50);
        else if(boul===String(res.r2).padStart(2,'0')) gain+=m*(prix.bolet2||20);
        else if(boul===String(res.r3).padStart(2,'0')) gain+=m*(prix.bolet3||10);
      }
      if(d.type==='maryaj'){
        const combos=[res.rm1,res.rm2,res.rm3]; if(combos.includes(boul)) gain+=m*(prix.maryaj||1000);
      }
    });
  });
  return gain;
}
function loadFiches(){
  const today=getHaitiDate();
  db.ref('fiches').orderByChild('dateStr').equalTo(today).once('value',s=>{
    if(!s.exists()){ document.getElementById('listF').innerHTML="Pa gen fich jodi a"; return; }
    let list=Object.values(s.val()).filter(f=>f.vendeur===curUser.name).reverse().slice(0,50);
    let html=''; list.forEach(f=>{
      const gain=calcGain(f);
      const isGagnant=gain>0;
      html+=`<div style="border:${isGagnant?'3px solid #16a34a':'1px solid #ccc'};padding:8px;margin:6px 0;border-radius:10px;font-size:12px;background:${isGagnant?'#dcfce7':'#fff'}">
        <div style="display:flex;justify-content:space-between"><b>${(f.tirajs||[]).join('/')} - ${f.total}$</b><span style="font-size:10px">${f.id.slice(-5).toUpperCase()}</span></div>
        <div style="font-size:10px">${(f.details||[]).map(d=>d.type+':'+d.boul+'-'+d.montan+'$').join(' | ')}</div>
        ${isGagnant?`<div style="color:#16a34a;font-weight:900;font-size:14px">🎉 GAIN: ${gain}$</div>`:`<div style="color:#666;font-size:11px">Gain: ${gain}$ - Pa genyen</div>`}
        <button onclick="reprintFiche('${f.id}')" style="width:auto;padding:4px 8px;font-size:10px;margin-top:4px;background:#000;color:#FFD700;border-radius:12px">🖨️ Re-imprime</button>
      </div>`;
      if(gain!==f.gain){ db.ref('fiches/'+f.id+'/gain').set(gain); }
    });
    document.getElementById('listF').innerHTML=html;
  });
}
function reprintFiche(fid){ db.ref('fiches/'+fid).once('value',s=>{ const f=s.val(); if(!f) return; const corps=(f.details||[]).map(d=>`<div style="display:flex;justify-content:space-between;font-size:20px"><span>${d.type.toUpperCase()} ${d.boul}</span><span>${d.montan}$</span></div>`).join(''); window.lastHtml=`<div style="font-size:26px;text-align:center;font-weight:900">${config.entete||'C&D VERITE LOTTO'}</div><div style="text-align:center;font-size:14px">${f.dateStr}<br>${f.vendeur}</div><div style="border-top:2px dashed #000;margin:6px 0"></div><div style="text-align:center">Tirage: <b>${(f.tirajs||[]).join('/')}</b><br>Id: <b style="font-size:24px">${f.id.slice(-5).toUpperCase()}</b></div><div style="border-top:2px dashed #000;margin:6px 0"></div>${corps}<div style="border-top:2px dashed #000;margin:6px 0"></div><div style="display:flex;justify-content:space-between;font-size:22px"><span>TOTAL</span><span>${f.total}$</span></div>`; doPrintTicket(); }); }
function searchById(){ const q=document.getElementById('searchId').value.trim().toLowerCase(); if(!q) return; db.ref('fiches').once('value',s=>{ const all=Object.values(s.val()||[]); const f=all.find(x=>x.id.toLowerCase().includes(q)); document.getElementById('resKopye').innerHTML=f?`<div style="border:2px solid #000;padding:8px"><b>${f.total}$</b> ${(f.tirajs||[]).join('/')}<br><button class="btn bK" onclick="reprintFiche('${f.id}')">Re-imprime</button></div>`:"Pa jwenn"; }); }
function genRapV(){ const du=document.getElementById('rapDu').value||getHaitiDate(); const au=document.getElementById('rapAu').value||getHaitiDate(); const tirageFiltre=document.getElementById('rapTiraj').value; db.ref('fiches').once('value',s=>{ let all=Object.values(s.val()||[]).filter(f=>f.vendeur===curUser.name && f.dateStr>=du && f.dateStr<=au); if(tirageFiltre) all=all.filter(f=>(f.tirajs||[]).includes(tirageFiltre)); const vente=all.reduce((a,b)=>a+(b.total||0),0); const commission=Math.round(vente*0.10); const paye=all.reduce((a,b)=>a+(calcGain(b)||0),0); const balance=vente-commission-paye; document.getElementById('rapData').innerHTML=`<div style="border:2px dashed #000;padding:12px;border-radius:10px;max-width:360px;margin:auto;font-family:monospace;font-weight:900;text-align:center;background:#fff"><div style="font-size:16px">RAPPORT - ${curUser.name}<br>${du} au ${au}</div><div style="border-top:2px dashed #000;margin:8px 0"></div><div style="text-align:left;font-size:13px;line-height:22px">Tirage: ${tirageFiltre||'Tous'}<br>Du: ${du}<br>Au: ${au}<br>--------------------------<br>Vente: ${vente}$<br>Commission (10%): ${commission}$<br>Payé (Gain): ${paye}$<br>--------------------------<br><div style="font-size:18px">Balance net: ${balance}$</div>Fiches: ${all.length}</div><div style="border-top:2px dashed #000;margin-top:8px;padding-top:8px"><button class="btn bK" onclick="doPrintRapport()" style="padding:14px">🖨️ IMPRIMER RAPPORT</button></div></div>`; lastRapportHtml=`<div style="font-size:20px;font-weight:900;text-align:center">${config.entete||'C&D VERITE LOTTO'}<br><span style="font-size:14px">RAPPORT</span></div><div style="border-top:2px dashed #000;margin:6px 0"></div><div style="font-size:14px;text-align:center">${du} - ${au}<br>${curUser.name}<br>Tirage: ${tirageFiltre||'Tous'}</div><div style="border-top:2px dashed #000;margin:6px 0"></div><div style="font-size:16px;text-align:left;line-height:24px">Vente: ${vente}$<br>Commission: ${commission}$<br>Payé: ${paye}$</div><div style="border-top:2px dashed #000;margin:6px 0"></div><div style="font-size:20px;text-align:center">BALANCE NET<br><b style="font-size:26px">${balance}$</b></div>`; }); }
function doPrintRapport(){ if(!lastRapportHtml){ alert('Genere rapò a anvan'); return; } const content=`<html><head><meta charset="UTF-8"><style>@page{size:58mm auto;margin:0}body{margin:0;padding:2mm;display:flex;justify-content:center}.ticket{width:52mm;text-align:center;font-family:monospace;font-weight:900}</style></head><body><div class="ticket">${lastRapportHtml}</div><script>setTimeout(()=>{window.print(); setTimeout(()=>window.close(),1000)},400);<\/script></body></html>`; const w=window.open('','_blank','width=384,height=700'); w.document.open(); w.document.write(content); w.document.close(); }
</script></body></html>
