<!DOCTYPE html><html lang='ht'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>VANDEUR 72px</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#eef2f7}.h{background:#1e2a8a;color:#fff;padding:8px 10px;display:flex;justify-content:space-between;align-items:center}.panel{padding:8px 6px 70px;max-width:360px;margin:auto}.card{background:#fff;border-radius:12px;padding:8px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.1)}.row{display:flex;gap:4px;align-items:center;margin-bottom:4px}.kz{width:72px;min-width:72px;max-width:72px;height:44px;border:2px solid #1e2a8a;border-radius:8px;font-weight:700;font-size:13px;text-align:center;background:#fff}.kz-tiraj{width:216px;min-width:216px;max-width:216px;display:flex;justify-content:space-between;align-items:center;padding:0 6px;cursor:pointer;background:#f5f7ff}.inp{width:72px;min-width:72px;max-width:72px;height:44px;border:2px solid #cbd5e1;border-radius:8px;font-weight:700;font-size:16px;text-align:center}.inp:focus{border-color:#1e2a8a;background:#eef2ff;outline:none}.btn{padding:12px;border:0;border-radius:10px;color:#fff;font-weight:800}.btn-g{background:#1a8a3a}.btn-b{background:#1e2a8a}.btn-r{background:#e11d48;width:44px;min-width:44px;height:44px}.total{background:#1e2a8a;color:#fff;border-radius:10px;padding:10px;display:flex;justify-content:space-between;font-weight:800}.tlist{display:none;position:absolute;left:6px;right:6px;background:#fff;border:2px solid #1e2a8a;border-radius:10px;max-height:260px;overflow-y:auto;z-index:99;padding:4px;grid-template-columns:72px 72px 72px;gap:4px;justify-content:center}.tlist.open{display:grid}.topt{display:flex;flex-direction:column;align-items:center;justify-content:center;width:72px;height:52px;border:1px solid #e2e8f0;border-radius:6px;font-size:10px;font-weight:700;text-align:center}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd}.tab{flex:1;padding:10px 2px;text-align:center;font-size:9px;font-weight:700;color:#666;border-top:3px solid transparent}.tab.active{color:#1e2a8a;border-top-color:#1e2a8a;background:#e8eaf6}.preview{font-family:monospace;white-space:pre-line;text-align:center;font-size:12px;line-height:1.3;background:#fff;border:1px dashed #000;padding:8px}</style></head><body>
<div class='h'><div style='font-size:13px'><b>Vandè 2222</b><br>2222</div><div><span style='font-size:12px' id='dateH'></span> <button onclick='logout()' style='background:#e11d48;color:#fff;border:0;padding:6px 8px;border-radius:6px;margin-left:4px'>Soti</button></div></div>

<div id='login' class='panel' style='display:block'><div class='card'><input id='vs' class='inp' style='width:100%;max-width:100%' placeholder='Serial 2222' value='2222'><input id='vp' class='inp' style='width:100%;max-width:100%;margin-top:4px' type='password' value='123'><button class='btn btn-g' style='width:100%;margin-top:6px' onclick='login()'>Konekte</button></div></div>

<div id='main' style='display:none'>
<div id='pV' class='panel' style='display:block;position:relative'>
<div class='card'>
<div style='display:flex;justify-content:space-between;margin-bottom:4px'><b style='font-size:12px'>🎯 Tiraj (miltip)</b><button onclick='clearT()' style='font-size:10px;padding:2px 6px'>Tout</button></div>
<div class='row'><div class='kz' style='display:flex;align-items:center;justify-content:center;background:#e8eaf6'>Tiraj</div><div id='kazT' class='kz kz-tiraj' onclick='toggleL()'><span id='txtT' style='font-size:11px'>Chwazi</span><span>▼</span></div></div>
<div id='tlist' class='tlist'></div>
<div id='cnt' style='font-size:10px;color:#1e2a8a;margin-top:2px'>0 tiraj</div>
</div>

<div class='card'>
<div class='row' style='font-size:10px;font-weight:700;color:#555'><div class='kz' style='border:0;height:auto;background:transparent'>Jeux</div><div class='kz' style='border:0;height:auto;background:transparent'>Boul</div><div class='kz' style='border:0;height:auto;background:transparent'>Mise</div></div>
<div id='bets'></div>
<button class='btn btn-b' style='width:100%;margin-top:4px' onclick='addR()'>+ Liy</button>
<div style='font-size:9px;background:#fff7ed;padding:4px;border-radius:4px;margin-top:4px'>Global: B1000=V1+V2 | M100 L3 100 L4 50 L5 50 - 12x47=47x12</div>
</div>

<div class='card total'><span id='dt'>Total $0 x 0 = $0</span><span id='gt'>$0</span></div>
<div class='row'><button class='btn btn-g' style='flex:1;height:52px;font-size:18px' onclick='vann()'>VANN</button><button class='btn btn-b' style='flex:1;height:52px;font-size:12px' onclick='printRawBT()'>🖨️ RawBT V2 Pro</button></div>
<div id='prev' class='preview' style='display:none'></div>
</div>

<div id='pC' class='panel'><div class='card'><h4>Copier</h4><input id='cid' class='inp' style='width:100%;max-width:100%' placeholder='Id Ticket'><button class='btn btn-b' style='width:100%;margin-top:4px' onclick='doCopy()'>Kopye</button></div></div>
<div id='pF' class='panel'><div class='card'><h4>Mes Fiches</h4><input id='fd' type='date' class='inp' style='width:100%;max-width:100%'><div id='flist'></div></div></div>
<div id='pR' class='panel'><div class='card'><h4>Rapport</h4><div class='row'><input id='rdu' type='date' class='inp' style='width:100%'><input id='rau' type='date' class='inp' style='width:100%'></div><button class='btn btn-b' style='width:100%;margin-top:4px' onclick='calcR()'>Kalkile</button><div id='rres' class='card'></div></div></div>
<div id='pP' class='panel'><div class='card'><h4>Printer v2 Pro RawBT</h4><button class='btn btn-b' style='width:100%' onclick='searchP()'>Ajouter imprimante</button><div id='plist'></div></div></div>

<div class='tabs'><div class='tab active' onclick="ot('pV',this)">1-Vendre</div><div class='tab' onclick="ot('pC',this)">2-Copier</div><div class='tab' onclick="ot('pF',this)">3-Fiches</div><div class='tab' onclick="ot('pR',this)">4-Rapport</div><div class='tab' onclick="ot('pP',this)">5-Param</div></div>
</div>

<script>
const TIRAJ=[["GA midi","12:15"],["FL midi","13:15"],["NY midi","14:15"],["Real","12:45"],["GA soir","18:15"],["FL soir","21:15"],["NY soir","22:15"],["Primera día","11:50"],["Suerte día","12:20"],["Lote Dom","13:45"],["Ganamas","14:15"],["Suerte noche","17:50"],["Primera noche","19:50"],["Loteka","19:45"],["Nacional 20h50","20:50"],["Nacional Dim 17h50","17:50"],["Leidsa 20h45","20:45"],["Leidsa Dim 15h45","15:45"],["Anguila 10h","09:55"],["Anguila 18h","17:55"]];
let DB=JSON.parse(localStorage.getItem('cd-lotto-db')||'{}');if(!DB.tickets)DB={vendeurs:[],tickets:[],heures:{},limites:{global:{bor:1000,mar:100,l3:100,l4:50,l5:50}},prix:{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000}}};function sDB(){localStorage.setItem('cd-lotto-db',JSON.stringify(DB))}
let CUR=null,selT=[];
function ot(id,el){document.querySelectorAll('.panel').forEach(p=>{if(p.id!='login')p.style.display='none'});document.getElementById(id).style.display='block';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active')}
function login(){let s=document.getElementById('vs').value.trim(),p=document.getElementById('vp').value.trim();let f=(DB.vendeurs||[]).find(v=>v.serial==s);if(!f){f={id:'v_'+Date.now(),serial:s,nom:'Vandè '+s,pass:p};DB.vendeurs.push(f);sDB()}CUR=f;localStorage.setItem('curV',JSON.stringify(CUR));document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';document.getElementById('dateH').innerText=new Date().toLocaleDateString('fr-FR');renderTL();addR();upd()}
function logout(){localStorage.removeItem('curV');location.reload()}
function isOpen(n){let h=DB.heures&&DB.heures[n]?DB.heures[n]:(TIRAJ.find(x=>x[0]==n)?.[1]||'');if(!h)return true;let now=new Date();let [hh,mm]=h.split(':').map(Number);let c=new Date();c.setHours(hh,mm,0,0);return now<c}
function renderTL(){document.getElementById('tlist').innerHTML=TIRAJ.map(t=>{let op=isOpen(t[0]);return `<label class='topt ${op?'':'off'}' style='${op?'':'opacity:.3'}'><input type='checkbox' value='${t[0]}' ${selT.includes(t[0])?'checked':''} ${op?'':'disabled'} onchange='chgT(this)' style='margin-bottom:2px'><span>${t[0]}</span><small>${DB.heures[t[0]]||t[1]}</small></label>`}).join('')}
function toggleL(){document.getElementById('tlist').classList.toggle('open')}
function chgT(el){if(el.checked)selT.push(el.value);else selT=selT.filter(x=>x!=el.value);upd();document.getElementById('txtT').innerText=selT.length?selT.length+' tiraj':'Chwazi';document.getElementById('cnt').innerText=selT.length+' tiraj chwazi';if(selT.length>3)document.getElementById('tlist').classList.remove('open')}
function clearT(){selT=TIRAJ.filter(t=>isOpen(t[0])).map(t=>t[0]);renderTL();document.getElementById('txtT').innerText=selT.length+' tiraj';document.getElementById('cnt').innerText=selT.length+' tiraj chwazi';upd()}
function addR(keep='boul'){let c=document.getElementById('bets');let d=document.createElement('div');d.className='row';d.innerHTML=`<select class='kz jeu'><option value='boul' ${keep=='boul'?'selected':''}>Boul</option><option value='maryaj' ${keep=='maryaj'?'selected':''}>Mar</option><option value='loto3' ${keep=='loto3'?'selected':''}>L3</option><option value='loto4' ${keep=='loto4'?'selected':''}>L4</option><option value='loto5' ${keep=='loto5'?'selected':''}>L5</option></select><input class='inp boul' placeholder='Boul' inputmode='numeric'><input class='inp mise' placeholder='Mise' inputmode='numeric' type='number'><button class='btn-r' onclick='this.parentElement.remove();upd()'>X</button>`;c.appendChild(d);let b=d.querySelector('.boul'),m=d.querySelector('.mise'),j=d.querySelector('.jeu');b.addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^0-9xX]/g,'');upd()});m.addEventListener('input',upd);b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();m.focus()}if(e.key==='ArrowDown'){e.preventDefault();addR(j.value)}});m.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();addR(j.value)}});b.focus()}
function getSold(type,num){let tot=0,today=new Date().toISOString().slice(0,10);DB.tickets.forEach(t=>{if(t.date!=today)return;t.bets.forEach(b=>{if(b.type!=type)return;if(type=='maryaj'){let a=b.numero.toLowerCase(),bb=num.toLowerCase();let norm=s=>{let p=s.split('x');if(p.length!=2)return [s];return [p[0]+'x'+p[1],p[1]+'x'+p[0]]};let na=norm(a),nb=norm(bb);if(na[0]==nb[0]||na[0]==nb[1]||na[1]==nb[0]||na[1]==nb[1])tot+=b.mise}else if(b.numero==num)tot+=b.mise})});return tot}
function upd(){let sum=0;document.querySelectorAll('#bets.row').forEach(r=>{sum+=parseInt(r.querySelector('.mise').value)||0});let nb=selT.length;let g=sum*nb;document.getElementById('dt').innerText=`Total $${sum} x ${nb}= $${g}`;document.getElementById('gt').innerText=`$${g}`}
function buildFiche(ticket){let now=new Date();let dateStr=now.toLocaleDateString('fr-FR');let txt='';txt+=` C&D VERITE LOTTO\n`;txt+=` ${dateStr}\n`;txt+=`---------------------------\n`;txt+=`Tiraj: ${ticket.tirages.join(',')}\n`;txt+=`Vandè: ${CUR.serial}\n`;txt+=`Id: ${ticket.id}\n`;txt+=`---------------------------\n`;txt+=`JEU BOUL MISE\n`;txt+=`---------------------------\n`;ticket.bets.forEach(b=>{let jeu=b.type.toUpperCase().padEnd(4,' ');let boul=b.numero.toString().padEnd(6,' ');let mise=('$'+b.mise).padStart(6,' ');txt+=`${jeu} ${boul} ${mise}\n`});txt+=`---------------------------\n`;txt+=`TOTAL $${ticket.baseTotal} x ${ticket.tirages.length} = $${ticket.total}\n`;txt+=`---------------------------\n`;txt+=` bòn chans,\n Lave chodyè w\n\n\n`;return txt}
function vann(){if(selT.length==0)return alert('Chwazi tiraj');let bets=[],ok=true;document.querySelectorAll('#bets.row').forEach(r=>{let jeu=r.querySelector('.jeu').value;let num=r.querySelector('.boul').value.trim();let mise=parseInt(r.querySelector('.mise').value);if(!num||!mise)return;let lim=DB.limites.global;let max=jeu=='boul'?lim.bor:jeu=='maryaj'?lim.mar:jeu=='loto3'?lim.l3:jeu=='loto4'?lim.l4:lim.l5;let sold=getSold(jeu,num);if(sold+mise>max){alert(`LIMIT ${num} $${sold}+$${mise}>$${max}`);ok=false;return}bets.push({type:jeu,numero:num,mise})});if(!ok)return;if(bets.length==0)return alert('Mete Boul/Mise');let base=bets.reduce((a,b)=>a+b.mise,0);let ticket={id:'T'+Date.now().toString().slice(-8),vendeurId:CUR.id,serial:CUR.serial,bets,tirages:selT.slice(),baseTotal:base,total:base*selT.length,date:new Date().toISOString().slice(0,10),time:new Date().toLocaleTimeString()};DB.tickets.push(ticket);sDB();let txt=buildFiche(ticket);document.getElementById('prev').style.display='block';document.getElementById('prev').innerText=txt;printRawBT(txt);document.getElementById('bets').innerHTML='';addR();upd()}
function printRawBT(text){let txt=text||document.getElementById('prev').innerText;if(!txt)return alert('Pa gen fich');let enc=encodeURIComponent(txt);try{window.location.href='rawbt://print?text='+enc;}catch(e){}setTimeout(()=>{try{window.location.href='intent://print?text='+enc+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'}catch(e){}},400);setTimeout(()=>{try{window.open('https://api.rawbt.ru/v2/print?text='+enc,'_blank')}catch(e){}},800)}
function doCopy(){let id=document.getElementById('cid').value.trim();let t=DB.tickets.find(x=>x.id==id);if(!t)return alert('Pa jwenn');selT=t.tirages.slice();document.getElementById('bets').innerHTML='';t.bets.forEach(b=>{addR(b.type);let rows=document.querySelectorAll('#bets.row');let r=rows[rows.length-1];r.querySelector('.jeu').value=b.type;r.querySelector('.boul').value=b.numero;r.querySelector('.mise').value=b.mise});renderTL();ot('pV',document.querySelectorAll('.tab')[0]);upd()}
function calcR(){}
function searchP(){document.getElementById('plist').innerHTML='🔍 Recherche Printer v2 Pro...';setTimeout(()=>{document.getElementById('plist').innerHTML='<div class=card>✅ Printer Direct V2 Pro RawBT<br>POS-58 / 80mm<br>Bluetooth ready</div>'},600)}
try{let cv=localStorage.getItem('curV');if(cv){CUR=JSON.parse(cv);document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';document.getElementById('dateH').innerText=new Date().toLocaleDateString('fr-FR');renderTL();addR();upd()}}catch(e){}
</script></body></html>
