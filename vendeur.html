<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendeur</title>
<style>
body{font-family:monospace;padding:10px}
#ticket{white-space:pre-wrap;border:1px dashed #000;padding:10px;margin:10px 0}
button{padding:15px;width:100%;font-size:18px;margin-top:10px;background:#000;color:#fff}
</style>
</head>
<body>

<h2>CD LOTO - Vendeur</h2>
<div id="ticket"></div>
<button onclick="printBT()">ENPRIME BÒLÈT LA</button>

<script>
let LAST_TXT = "";

function centerText(t){ 
  let s = 32; 
  let pad = Math.floor((s - t.length)/2);
  return " ".repeat(pad>0?pad:0)+t; 
}

function genTicketExemple(){
  // SE SA KI PRAL ENPRIME - SAN IMAG
  let d = new Date().toLocaleString();
  let txt = "";
  txt += "      CD LOTO\n";
  txt += "  ----------------\n";
  txt += "Date: "+d+"\n";
  txt += "  ----------------\n";
  txt += "Bolet: 45 x 500G\n";
  txt += "Maryaj: 12-34\n";
  txt += "Total: 500 Gdes\n";
  txt += "  ----------------\n";
  txt += "    Mesi!\n";
  txt += "\n\n\n"; // 3 liy sèlman = 1 paj epi kanpe
  return txt;
}

// Lè ou vann, rele sa a
function setTicket(textBolet){
  LAST_TXT = textBolet || genTicketExemple();
  document.getElementById('ticket').innerText = LAST_TXT;
  // Logo a ka rete sou ekran si ou vle, men li pap enprime
}

// FONKSYON ENPRIME FINAL KI KANPE SOU 1 PAJ
function printBT(t){
  let plain = (t || LAST_TXT || genTicketExemple());
  if(!plain) return;

  // RETIRE TOUT IMAJ BASE64 KI TAP MANJE PAPYE A
  plain = plain.toString();
  plain = plain.replace(/<img[^>]*>/gi, '');
  plain = plain.replace(/data:image\/jpeg;base64,[A-Za-z0-9+/=\s]+/gi, '');
  plain = plain.replace(/data:image\/[^;]+;base64,[A-Za-z0-9+/=]+/gi, '');
  plain = plain.replace(/<[^>]+>/g, '');
  plain = plain.trim();
  plain = plain.replace(/\n{4,}/g, '\n\n\n');

  try{
    let b64 = btoa(unescape(encodeURIComponent(plain)));
    let url = "rawbt:base64," + b64;
    if(window.AppInventor && window.AppInventor.setWebViewString){
      window.AppInventor.setWebViewString(url);
    } else {
      window.location.href = url;
    }
  }catch(e){
    alert("Erè: "+e.message);
  }
}

function testPrintLogo(){}

// Demo
setTicket(genTicketExemple());
</script>
</body>
</html>
