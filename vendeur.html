<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V122 VENDEUR</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:8px;text-align:center;font-weight:900;font-size:10px}.card{padding:12px;max-width:500px;margin:auto;background:#fff;border:1px solid #000;border-radius:12px}input,select{padding:15px;border:2px solid #000;border-radius:10px;width:100%;font-size:18px;font-weight:800;margin:5px 0;text-align:center}.tiraj{padding:12px 16px;margin:4px;border:2px solid #000;border-radius:24px;font-weight:900;display:inline-block;font-size:12px;cursor:pointer;background:#fff}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{opacity:.25;pointer-events:none}.btn{padding:15px;width:100%;border:none;border-radius:12px;font-weight:900;margin:7px 0}.bK{background:#000;color:#FFD700}.bV{background:#16a34a;color:#fff}.tab2{display:flex;background:#000;gap:1px;position:sticky;top:0;z-index:20}.tab2 button{flex:1;padding:14px 1px;font-size:11px;font-weight:900;background:#000;color:#FFD700;border:none}.tab2 button.active{background:#FFD700;color:#000}.jeux{padding:11px 16px;margin:4px;border:2px solid #000;border-radius:22px;font-weight:900;display:inline-block;font-size:11px;background:#fff}.jeux.sel{background:#FFD700;color:#000}</style>
</head><body>
<div class="h">V122 VENDEUR</div>
<div id="loginBox" class="card" style="margin-top:40px;text-align:center"><input id="uName" placeholder="KÒD VENDEUR" style="text-transform:uppercase"><input id="uPass" type="password" placeholder="MODPAS"><input id="pCode" placeholder="KÒD PROPRIO" style="text-transform:uppercase"><button class="btn bK" onclick="go()">ANTRE</button><div id="err" style="color:red;font-weight:900"></div></div>
<div id="appBox" style="display:none">
<div class="tab2"><button id="tV" class="active" onclick="showTab('vendre')">Vendre</button><button id="tC" onclick="showTab('kopyeTab')">Copier</button><button id="tF" onclick="showTab('fichesTab')">Mes Fiches</button><button id="tR" onclick="showTab('rapportTab')">Rapport</button></div>
<div id="vendre" class="card">
<div style="text-align:center;font-size:11px;font-weight:900"><span id="dateToday" style="background:#FFD700;padding:6px 10px;border-radius:6px"></span> <span id="userShow" style="background:#000;color:#FFD700;padding:6px 10px;border-radius:6px"></span> <span id="proprioShow" style="background:#16a34a;color:#fff;padding:6px 10px;border-radius:6px"></span></div>
<div id="enteteShow" style="text-align:center;font-weight:900;margin:8px;font-size:14px"></div>
<div id="tirajBox" style="text-align:center;margin:10px 0;padding:12px;border:2px solid #000;border-radius:12px"></div>
<div style="text-align:center"><span class="jeux" id="jBorlettes" onclick="setJeux('Borlettes')">BÒLÈT</span><span class="jeux" id="jMariage" onclick="setJeux('Mariage')">MARYAJ</span><span class="jeux" id="jLoto3" onclick="setJeux('Loto3')">LOTO3</span><span class="jeux" id="jLoto4" onclick="setJeux('Loto4')">LOTO4</span><span class="jeux" id="jLoto5" onclick="setJeux('Loto5')">LOTO5</span></div>
<div style="display:flex;background:#000;color:#FFD700;padding:8px;font-weight:900;border-radius:8px;font-size:11px;margin-top:8px"><div style="width:65px">A)JEUX</div><div style="flex:1">B)BOUL</div><div style="width:90px">C)MIZ</div></div>
<div style="display:flex;gap:8px;margin-top:8px;align-items:center"><div id="jeuxLabel" style="width:65px;font-weight:900;text-align:center;font-size:11px;background:#FFD700;padding:12px 2px;border-radius:8px">BOLET</div><input id="b0" type="text" inputmode="numeric" pattern="[0-9x]*" placeholder="BOUL" oninput="this.value=this.value.replace(/[^0-9xX]/g,'');calc()" onkeydown="handleKey(event,'b')"><input id="m0" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="MIZ" style="width:90px" oninput="this.value=this.value.replace(/[^0-9]/g,'');calc()" onkeydown="handleKey(event,'m')"></div>
<div style="background:#000;color:#fff;padding:14px;border-radius:12px;text-align:center;margin-top:12px">Total <span id="tot">0$</span> × <span id="nbT">0</span><div style="font-size:32px;color:#FFD700;font-weight:900">A PEYE <span id="paye">0$</span></div></div>
<button class="btn bK" onclick="vann()">VALIDER + IMPRIMER</button><div id="lastTicket"></div>
</div>
<div id="kopyeTab" class="card" style="display:none"><input id="searchId" placeholder="ID 5 lèt" style="text-transform:uppercase"><button class="btn bK" onclick="searchById()">Chèche</button><div id="kopyeResult"></div><button class="btn bV" onclick="showTab('vendre')">VENDRE</button></div>
<div id="fichesTab" class="card" style="display:none"><h3>Mes Fiches (<span id="nbFiches">0</span>)</h3><div id="fichesList"></div><button class="btn bV" onclick="showTab('vendre')">VENDRE</button></div>
<div id="rapportTab" class="card" style="display:none"><div style="display:flex;gap:8px"><input type="date" id="du"><input type="date" id="au"></div><select id="rapportTiraj" style="margin-top:8px"><option value="tous">Tous Tiraj</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><button class="btn bK" onclick="genererRapport()">GENERER</button><div style="border:2px solid #000;border-radius:12px;padding:12px;margin-top:10px"><div>Vente: <b id="rVente">0$</b></div><div>Commission: <b id="rCom">0$</b></div><div>A Payer: <b id="rPaye">0$</b></div><div style="background:#000;color:#FFD700;padding:10px;border-radius:8px;margin-top:8px;font-size:20px">Balance Net: <b id="rNet">0$</b></div></div><div id="rapportDetail" style="margin-top:10px"></div><button class="btn bK" onclick="window.print()">Imprimer</button></div>
</div>
<script>
const firebaseConfig={databaseURL:"https://verite-lotto-default-rtdb.firebaseio.com"};firebase.initializeApp(firebaseConfig);const db=firebase.database();
const TIRAJ_LIST=["GA MIDI","FL MIDI","NY MIDI","GA SOIR","FL SOIR","NY SOIR"];
let selectedTiraj=[],USER="",PROPRIO_ID="",FICHES=[],JEUX="Borlettes",PRIX={Borlettes:[50,20,10],Mariage:1000,Loto3:500,Loto4:5000,Loto5:25000},COMM=10,LIMITES={Borlettes:1500,Mariage:100,Loto3:100,Loto4:20,Loto5:5},FERM={},ENT={},VDATA=null;
async function go(){
let u=document.getElementById('uName').value.trim().toUpperCase(),pass=document.getElementById('uPass').value.trim(),pc=document.getElementById('pCode').value.trim().toUpperCase();
if(!u||!pass){document.getElementById('err').innerText="Mete kòd ak modpas";return;}
try{
if(pc)PROPRIO_ID=pc;else{let s=localStorage.getItem('vendeur_'+u+'_proprio');if(s)PROPRIO_ID=s;else{let all=await db.ref('proprios').once('value');all.forEach(pp=>{if(pp.child('vendeurs/'+u).exists())PROPRIO_ID=pp.key;});}}
if(!PROPRIO_ID){document.getElementById('err').innerText="Kòd Proprio obligatwa";return;}
let vs=await db.ref('proprios/'+PROPRIO_ID+'/vendeurs/'+u).once('value');if(!vs.exists()){document.getElementById('err').innerText="Vandè pa jwenn";return;}
VDATA=vs.val();if(VDATA.pass!==pass){document.getElementById('err').innerText="Modpas pa bon";return;}
if(VDATA.statut==="ferme"){document.getElementById('err').innerText="Vandè FERME";return;}
USER=u;localStorage.setItem('vendeur_'+USER+'_proprio',PROPRIO_ID);
let sj=localStorage.getItem('vendeur_'+USER+'_jeux');if(sj)JEUX=sj;
try{FICHES=JSON.parse(localStorage.getItem('fiches_'+USER)||'[]')}catch(e){FICHES=[]}
document.getElementById('loginBox').style.display='none';document.getElementById('appBox').style.display='block';
document.getElementById('dateToday').innerText=new Date().toLocaleDateString();document.getElementById('userShow').innerText=USER;document.getElementById('proprioShow').innerText=PROPRIO_ID;
let t=new Date().toISOString().split('T')[0];document.getElementById('du').value=t;document.getElementById('au').value=t;
initApp();await loadConfig();
}catch(e){document.getElementById('err').innerText=e.message;}
}
async function loadConfig(){let c=await db.ref('proprios/'+PROPRIO_ID+'/config').once('value');if(c.exists()){let cfg=c.val();if(cfg.prix)PRIX=cfg.prix;if(cfg.limites)LIMITES=cfg.limites;if(cfg.fermeture)FERM=cfg.fermeture;if(cfg.entete)ENT=cfg.entete;COMM=VDATA.commission||10;document.getElementById('enteteShow').innerText=(ENT.nom||PROPRIO_ID)+" "+(ENT.tel||"");}checkFerm();}
function checkFerm(){let now=new Date();let cur=now.getHours()*60+now.getMinutes();let def={"GA MIDI":12*60+15,"FL MIDI":13*60+15,"NY MIDI":14*60+15,"GA SOIR":18*60+15,"FL SOIR":21*60+15,"NY SOIR":21*60+30};TIRAJ_LIST.forEach(t=>{let f=FERM[t];let fMin=f?parseInt(f.split(':')[0])*60+parseInt(f.split(':')[1]):def[t];let el=document.querySelector('.tiraj[data-t="'+t+'"]');if(el){if(cur>=fMin){el.classList.add('ferme');el.classList.remove('active');}else el.classList.remove('ferme');}});}
function initApp(){let tb=document.getElementById('tirajBox');tb.innerHTML="";TIRAJ_LIST.forEach((t,i)=>{let el=document.createElement('span');el.className='tiraj';el.innerText=(i+1)+"-"+t;el.setAttribute('data-t',t);el.onclick=function(){this.classList.toggle('active');updateT();};tb.appendChild(el);});setJeux(JEUX);calc();}
function setJeux(j){JEUX=j;localStorage.setItem('vendeur_'+USER+'_jeux',j);document.querySelectorAll('.jeux').forEach(e=>e.classList.remove('sel'));document.getElementById('j'+j).classList.add('sel');document.getElementById('jeuxLabel').innerText=j.substring(0,5).toUpperCase();}
function updateT(){selectedTiraj=[];document.querySelectorAll('.tiraj.active').forEach(x=>selectedTiraj.push(x.getAttribute('data-t')));document.getElementById('nbT').innerText=selectedTiraj.length;calc();}
function calc(){let m=parseFloat(document.getElementById('m0').value)||0;document.getElementById('tot').innerText=m+"$";document.getElementById('paye').innerText=(m*selectedTiraj.length)+" $";}
function handleKey(e,from){if(e.key==="Enter"||e.key==="ArrowDown"||e.key==="ArrowRight"){e.preventDefault();if(from==='b')document.getElementById('m0').focus();else vann();}if(e.key==="ArrowUp"&&from==='m')document.getElementById('b0').focus();}
function showTab(n){['vendre','kopyeTab','fichesTab','rapportTab'].forEach(id=>document.getElementById(id).style.display=id===n?'block':'none');document.getElementById('tV').className=n=='vendre'?'active':'';document.getElementById('tC').className=n=='kopyeTab'?'active':'';document.getElementById('tF').className=n=='fichesTab'?'active':'';document.getElementById('tR').className=n=='rapportTab'?'active':'';if(n==='fichesTab')loadFiches();}
function genId(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
async function vann(){
if(selectedTiraj.length===0){alert("Chwazi Tiraj");return;}
let b=document.getElementById('b0').value.trim(),m=parseFloat(document.getElementById('m0').value)||0;
if(!b||!m)return;
let lim=LIMITES[JEUX]!==undefined?LIMITES[JEUX]:LIMITES.Borlettes;let deja=0;
try{let snap=await db.ref('proprios/'+PROPRIO_ID+'/fiches').once('value');if(snap.exists()){snap.forEach(ch=>{let f=ch.val();if(f.jeux===JEUX&&f.boul===b){if(f.tirajs)for(let tir of selectedTiraj)if(f.tirajs.includes(tir))deja+=parseFloat(f.miz)||0;}});}}catch(e){}
if(deja+m>lim){alert("Limite depase "+JEUX+" "+b+" deja "+deja+"$ limite "+lim+"$");return;}
let id=genId();let now=new Date();let fiche={id:id,vendeur:USER,proprio:PROPRIO_ID,date:now.toISOString().split('T')[0],heure:now.toLocaleTimeString(),total:m,tirajs:selectedTiraj,aPeye:m*selectedTiraj.length,jeux:JEUX,boul:b,miz:m,timestamp:Date.now()};
FICHES.push(fiche);localStorage.setItem('fiches_'+USER,JSON.stringify(FICHES));
try{await db.ref('fiches/'+id).set(fiche);await db.ref('proprios/'+PROPRIO_ID+'/fiches/'+id).set(fiche);}catch(e){}
document.getElementById('lastTicket').innerHTML=`<div style="border:2px dashed #000;padding:12px;margin-top:12px;text-align:center"><b>${ENT.nom||PROPRIO_ID}</b><br>ID:<b style="font-size:22px">${id}</b><br>${fiche.date} ${fiche.heure}<br><b>${selectedTiraj.join(' | ')}</b><hr>${JEUX} ${b} ${m}$<hr><b>A PEYE: ${fiche.aPeye}$</b></div><button class="btn bV" onclick="clearV()">NOUVO</button><button class="btn bK" onclick="window.print()">IMPRIMER</button>`;
loadFiches();
}
function clearV(){document.getElementById('b0').value="";document.getElementById('m0').value="";document.getElementById('lastTicket').innerHTML="";calc();document.getElementById('b0').focus();}
function loadFiches(){let h="";FICHES.slice().reverse().forEach(f=>{h+=`<div style="border:1px solid #000;padding:8px;margin:6px 0;border-radius:8px;font-size:12px"><b>${f.id}</b> ${f.heure} ${f.tirajs.join(',')}<br>${f.jeux} ${f.boul}:${f.miz}$ = ${f.aPeye}$</div>`;});document.getElementById('fichesList').innerHTML=h||"Pa gen";document.getElementById('nbFiches').innerText=FICHES.length;}
function searchById(){let id=document.getElementById('searchId').value.trim().toUpperCase();let f=FICHES.find(x=>x.id===id);document.getElementById('kopyeResult').innerHTML=f?`<div style="border:2px solid #000;padding:10px"><b>${f.id}</b> ${f.jeux} ${f.boul}<br><button class="btn bK" onclick="applyF('${f.id}')">Copier</button></div>`:"Pa jwenn";}
function applyF(id){let f=FICHES.find(x=>x.id===id);if(!f)return;showTab('vendre');document.querySelectorAll('.tiraj').forEach(el=>{if(f.tirajs.includes(el.getAttribute('data-t')))el.classList.add('active');else el.classList.remove('active');});updateT();setJeux(f.jeux);document.getElementById('b0').value=f.boul;document.getElementById('m0').value=f.miz;calc();}
async function genererRapport(){
let du=document.getElementById('du').value,au=document.getElementById('au').value,filtre=document.getElementById('rapportTiraj').value;
let resultats={};try{let r=await db.ref('proprios/'+PROPRIO_ID+'/resultats').once('value');if(r.exists())resultats=r.val();}catch(e){}
let venteParTiraj={},payeParTiraj={},venteTotal=0,payeTotal=0,detail="";
FICHES.forEach(f=>{
if(f.date<du||f.date>au)return;let miz=parseFloat(f.miz)||0;
f.tirajs.forEach(tir=>{
if(!venteParTiraj[tir])venteParTiraj[tir]=0;venteParTiraj[tir]+=miz;venteTotal+=miz;
let res=resultats[f.date]&&resultats[f.date][tir]?resultats[f.date][tir]:null;if(!res)return;let gain=0;
if(f.jeux==="Borlettes"){if(f.boul===res.premier)gain=miz*(PRIX.Borlettes?.[0]||50);else if(f.boul===res.deuxieme)gain=miz*(PRIX.Borlettes?.[1]||20);else if(f.boul===res.troisieme)gain=miz*(PRIX.Borlettes?.[2]||10);}
else if(f.jeux==="Mariage"&&res.mariage&&res.mariage.includes(f.boul))gain=miz*(PRIX.Mariage||1000);
else if(f.jeux==="Loto3"&&f.boul===res.loto3)gain=miz*(PRIX.Loto3||500);
else if(f.jeux==="Loto4"&&f.boul===res.loto4)gain=miz*(PRIX.Loto4||5000);
else if(f.jeux==="Loto5"&&f.boul===res.loto5)gain=miz*(PRIX.Loto5||25000);
if(gain>0){if(!payeParTiraj[tir])payeParTiraj[tir]=0;payeParTiraj[tir]+=gain;payeTotal+=gain;detail+=`<div style="font-size:11px;border-bottom:1px dashed #ccc;padding:4px">${f.date} <b>${tir}</b> ${f.jeux} ${f.boul} => ${gain}$</div>`;}
});
});
let vAffiche=filtre==="tous"?venteTotal:(venteParTiraj[filtre]||0);let pAffiche=filtre==="tous"?payeTotal:(payeParTiraj[filtre]||0);
document.getElementById('rVente').innerText=vAffiche+"$";document.getElementById('rCom').innerText=Math.round(vAffiche*COMM/100)+"$";document.getElementById('rPaye').innerText=pAffiche+"$";document.getElementById('rNet').innerText=(vAffiche-pAffiche)+"$";
let bd="<div style='background:#f9f9f9;padding:10px;border:1px solid #000;border-radius:8px;margin-top:10px'>";for(let t in venteParTiraj){let vp=venteParTiraj[t]||0;let pp=payeParTiraj[t]||0;bd+=`<div style="display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid #ddd"><b>${t}</b><span>V:${vp}$</span><span>P:${pp}$</span><span>N:${vp-pp}$</span></div>`;}bd+="</div>";
document.getElementById('rapportDetail').innerHTML=bd+detail;
}
</script>
</body></html>
