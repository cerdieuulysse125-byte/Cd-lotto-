<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C&D VERITE - Print FIX</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#000}
.card{max-width:520px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:#000;color:#fff;text-align:center;padding:12px;font-weight:bold}
.tabs{display:flex;background:#111;position:sticky;top:0;z-index:10}
.tab{flex:1;padding:12px 2px;text-align:center;color:#888;font-size:10px;font-weight:bold;cursor:pointer;border-bottom:3px solid #111}
.tab.active{color:#fff;border-bottom-color:#fff}
.content{padding:10px;flex:1}
.panel{display:none}.panel.active{display:block}
.tirages{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.tir{border:2px solid #000;padding:10px 4px;border-radius:8px;text-align:center;font-size:11px;font-weight:bold;cursor:pointer}
.tir.sel{background:#000;color:#fff}
.ligne{display:flex;gap:5px;margin:8px 0;align-items:center;background:#f5f5f5;padding:7px;border-radius:12px}
.jeuxBtn{width:28%;border:2.5px solid #000;border-radius:8px;padding:13px 4px;font-size:12px;font-weight:bold;text-align:center;background:#fff;cursor:pointer}
.boul{width:32%;border:2px solid #000;border-radius:8px;padding:13px 6px;font-size:16px;font-weight:bold;text-align:center}
.miz{width:22%;border:2px solid #000;border-radius:8px;padding:13px 4px;font-size:16px;font-weight:bold;text-align:center}
.del{width:13%;background:#fff;border:2px solid red;color:red;border-radius:8px;padding:13px 0;font-weight:bold;cursor:pointer}
.totalBox{background:#000;color:#fff;border-radius:12px;padding:14px;text-align:center;font-size:18px;font-weight:bold;margin:12px 0}
.btn{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:16px;margin:6px 0;cursor:pointer}
.btn-out{background:#fff;color:#000;border:2.5px solid #000}
.list{border:1px solid #000;border-radius:10px;padding:10px;margin:6px 0;font-size:12px;cursor:pointer}
.small{font-size:11px;color:#555;text-align:center;margin:6px 0}
</style>
</head>
<body>
<div class="card">
<div class="hdr">C&D VÉRITÉ LOTTO - <span id="vNameHdr">Vandè</span></div>
<div id="loginDiv" style="padding:30px">
<input id="nom" placeholder="Non Vandè" style="width:100%;padding:16px;border:2.5px solid #000;border-radius:14px;margin:8px 0">
<input id="pass" type="password" placeholder="Modpas" style="width:100%;padding:16px;border:2.5px solid #000;border-radius:14px;margin:8px 0">
<button class="btn" onclick="login()">ANTRE</button><p id="msg" style="color:red;text-align:center;margin-top:10px"></p>
</div>
<div id="appDiv" style="display:none;flex-direction:column;flex:1">
<div class="tabs"><div class="tab active" onclick="openTab(0)">1.VANT</div><div class="tab" onclick="openTab(1)">2.KOPYE</div><div class="tab" onclick="openTab(2)">3.FICH</div><div class="tab" onclick="openTab(3)">4.RAPÒ</div></div>
<div class="content">
<div class="panel active" id="p0">
<div class="small">TIRAJ MILTIP - Chwazi:</div>
<div class="tirages">
<div class="tir" id="t1" onclick="toggleTir('GA MIDI')">GA MIDI</div>
<div class="tir" id="t2" onclick="toggleTir('FL MIDI')">FL MIDI</div>
<div class="tir" id="t3" onclick="toggleTir('NY MIDI')">NY MIDI</div>
<div class="tir" id="t4" onclick="toggleTir('GA SOIR')">GA SOIR</div>
<div class="tir" id="t5" onclick="toggleTir('FL SOIR')">FL SOIR</div>
<div class="tir" id="t6" onclick="toggleTir('NY SOIR')">NY SOIR</div>
</div>
<div class="small">Chwazi pami [Jeux ▼] | Boul | Miz | X</div>
<div id="lignes"></div>
<button class="btn btn-out" onclick="addLigne(lastJeux)">+ Liy (Enter ↓)</button>
<div class="totalBox" id="totalBox">Total: $0 x 0 tiraj = $0</div>
<button class="btn" onclick="validerEtImprimer()">💾 VALIDE & IMPRIMER</button>
</div>
<div class="panel" id="p1"><h4 style="text-align:center">Kopye nenpòt ticket</h4><div id="copyList"></div></div>
<div class="panel" id="p2"><h4 style="text-align:center">Mes Fiches - <span id="dateJour"></span></h4><div id="fichesList"></div></div>
<div class="panel" id="p3">
<div style="display:flex;gap:4px"><input id="du" type="date" style="flex:1;padding:10px;border:2px solid #000;border-radius:8px"><input id="au" type="date" style="flex:1;padding:10px;border:2px solid #000;border-radius:8px"></div>
<select id="rapTirage" style="width:100%;padding:10px;border:2px solid #000;border-radius:8px;margin:6px 0"><option value="TOUS">Tirage (TOUS)</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select>
<button class="btn" onclick="genRapport()">Jenere Rapò</button><div id="rapportRes"></div><button class="btn btn-out" onclick="printRapport()">🖨️ Imprimer Rapò</button><button class="btn btn-out" onclick="location.reload()">Dekonekte</button>
</div>
</div>
</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let current=null, tiragesSel=new Set(), lignesData=[], lastJeux='BOLET';
const JEUX_LIST=['BOLET','MARYAJ','LOTO3','LOTO4','LOTO5'];
function openTab(i){document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));document.querySelectorAll('.panel').forEach((p,idx)=>p.classList.toggle('active',idx===i));}
function toggleTir(n){const m={'GA MIDI':1,'FL MIDI':2,'NY MIDI':3,'GA SOIR':4,'FL SOIR':5,'NY SOIR':6}; const el=document.getElementById('t'+m[n]); if(tiragesSel.has(n)){tiragesSel.delete(n);el.classList.remove('sel')}else{tiragesSel.add(n);el.classList.add('sel')} calcTotal();}
function addLigne(jeuxKeep){ const id=Date.now()+Math.random(); const jeux=jeuxKeep||lastJeux||'BOLET'; lastJeux=jeux; const obj={id,jeux,boul:'',miz:''}; lignesData.push(obj);
 const div=document.createElement('div'); div.className='ligne'; div.id='row_'+id;
 div.innerHTML=`<div class="jeuxBtn" id="jbtn_${id}" onclick="cycleJeux('${id}')">${jeux} ▼</div>
 <input class="boul" id="b_${id}" inputmode="numeric" placeholder="Boul" oninput="updateBoul('${id}',this.value)" onkeydown="handleEnter(event)">
 <input class="miz" id="m_${id}" type="number" inputmode="numeric" placeholder="$" oninput="updateMiz('${id}',this.value)" onkeydown="handleEnter(event)">
 <button class="del" onclick="delLigne('${id}')">X</button>`;
 document.getElementById('lignes').appendChild(div); setTimeout(()=>document.getElementById('b_'+id).focus(),80);
}
function cycleJeux(rowId){ const obj=lignesData.find(x=>x.id==rowId); if(!obj)return; let idx=JEUX_LIST.indexOf(obj.jeux); idx=(idx+1)%JEUX_LIST.length; obj.jeux=JEUX_LIST[idx]; lastJeux=JEUX_LIST[idx]; document.getElementById('jbtn_'+rowId).innerText=JEUX_LIST[idx]+' ▼';}
function updateBoul(id,v){ const o=lignesData.find(x=>x.id==id); if(o)o.boul=v.replace(/[^0-9xX]/g,''); calcTotal();}
function updateMiz(id,v){ const o=lignesData.find(x=>x.id==id); if(o)o.miz=v; calcTotal();}
function handleEnter(e){ if(e.key==='Enter'){e.preventDefault(); addLigne(lastJeux);} }
function delLigne(id){ const el=document.getElementById('row_'+id); if(el)el.remove(); lignesData=lignesData.filter(o=>o.id!=id); calcTotal();}
function calcTotal(){let sum=0; lignesData.forEach(l=>{if(l.miz)sum+=parseFloat(l.miz)||0}); const nb=tiragesSel.size; document.getElementById('totalBox').innerText=`Total: $${sum} x ${nb} tiraj = $${sum*nb}`; return sum*nb;}

// ===== FONKSYON ENPRESYON KORIJE - SÈLMAN TIKÈ A =====
function printTicketOnly(text){
  const win = window.open('', '_blank', 'width=350,height=600');
  win.document.write(`
<html><head><title>Ticket</title>
<style>
@page { size: 58mm auto; margin: 2mm; }
body { width:58mm; margin:0; padding:2mm; font-family:Courier, monospace; font-size:13px; text-align:center; line-height:1.4; white-space:pre-line; }
</style></head><body>
${text}
<script>window.onload=function(){window.print(); setTimeout(()=>window.close(),500);}<\/script>
</body></html>`);
  win.document.close();
}

async function login(){const nom=document.getElementById('nom').value.trim(), pass=document.getElementById('pass').value.trim(); const msg=document.getElementById('msg'); if(!nom||!pass){msg.innerText="Ranpli";return;} msg.innerText="Ap verifye..."; try{const s=await db.collection('vendeurs').where('nom','==',nom).where('modpas','==',pass).get(); if(s.empty){msg.innerText="Pa kòrèk";return;} current={id:s.docs[0].id,...s.docs[0].data()}; document.getElementById('loginDiv').style.display='none'; document.getElementById('appDiv').style.display='flex'; document.getElementById('vNameHdr').innerText=nom; document.getElementById('dateJour').innerText=new Date().toLocaleDateString(); addLigne('BOLET'); loadFiches();}catch(e){msg.innerText=e.message}}
function buildFiche(v){const tStr=Array.from(tiragesSel).join('/')||v.tirages?.join('/')||''; const d=new Date().toLocaleString(); return ` C&D VÉRITÉ LOTTO\n Date ${d} Tirage ${tStr}\n Id ticket ${v.idTicket||''} Vandè ${current.nom}\n------------------------------\n${v.lignes.map(l=>` ${l.jeux.padEnd(6)} ${l.boul.padEnd(10)} $${l.miz}`).join('\n')}\n------------------------------\n Total: $${v.total}\n------------------------------\n Mèsi, bòn chans!`; }
async function validerEtImprimer(){if(tiragesSel.size==0){alert("Chwazi tiraj");return;} const lignes=lignesData.filter(l=>l.boul&&l.miz); if(!lignes.length){alert("Antre boul+miz");return;} const total=calcTotal(); const data={vendeur:current.nom,vendeurId:current.id,tirages:Array.from(tiragesSel),lignes:lignes.map(l=>({jeux:l.jeux,boul:l.boul,miz:l.miz})),total,dateStr:new Date().toISOString().slice(0,10),created:firebase.firestore.FieldValue.serverTimestamp(),idTicket:'CD-'+Date.now().toString().slice(-6)}; try{const ref=await db.collection('ventes').add(data); const ficheTxt=buildFiche({...data,idTicket:ref.id.slice(-6).toUpperCase()}); printTicketOnly(ficheTxt); lignesData=[]; document.getElementById('lignes').innerHTML=""; addLigne(lastJeux); calcTotal(); loadFiches();}catch(e){alert(e.message)}}
async function loadFiches(){if(!current)return; const today=new Date().toISOString().slice(0,10); const snap=await db.collection('ventes').where('vendeurId','==',current.id).where('dateStr','==',today).orderBy('created','desc').limit(50).get(); let h=""; snap.forEach(d=>{const v=d.data(); h+=`<div class="list" onclick="reprint('${d.id}')"><b>${v.idTicket||d.id.slice(-6)}</b> - ${v.tirages?.join(',')} - $${v.total}</div>`}); document.getElementById('fichesList').innerHTML=h||"Pa gen fich"; document.getElementById('copyList').innerHTML=h||"Pa gen fich";}
async function reprint(id){const doc=await db.collection('ventes').doc(id).get(); const v=doc.data(); const txt=` C&D VÉRITÉ LOTTO\n Date ${new Date().toLocaleString()} Tirage ${v.tirages?.join('/')}\n Id ticket ${v.idTicket||id.slice(-6)} Vandè ${v.vendeur}\n------------------------------\n${v.lignes.map(l=>` ${l.jeux.padEnd(6)} ${l.boul.padEnd(10)} $${l.miz}`).join('\n')}\n------------------------------\n Total: $${v.total}\n------------------------------\n Mèsi, bòn chans!`; printTicketOnly(txt);}
async function genRapport(){const du=document.getElementById('du').value, au=document.getElementById('au').value, tir=document.getElementById('rapTirage').value; if(!du||!au){alert("Chwazi dat");return;} const snap=await db.collection('ventes').where('vendeurId','==',current.id).where('dateStr','>=',du).where('dateStr','<=',au).get(); let vente=0,c=0; snap.forEach(d=>{const v=d.data(); if(tir==='TOUS'||v.tirages?.includes(tir)){vente+=v.total||0;c++;}}); const com=vente*0.1; const rapTxt=` C&D VÉRITÉ LOTTO\n RAPPORT ${du} au ${au}\n Tirage: ${tir}\n Vandè: ${current.nom}\n------------------------------\n Vente: $${vente}\n Commission: $${com.toFixed(2)}\n A payer: $${(vente-com).toFixed(2)}\n Balance net: $${(vente-com).toFixed(2)}\n Nbre: ${c}\n------------------------------`; document.getElementById('rapportRes').innerHTML=`<div style="white-space:pre-line;text-align:center;font-family:Courier;font-size:12px;border:1px solid #000;border-radius:10px;padding:10px;margin-top:10px">${rapTxt}</div>`; document.getElementById('rapportRes').dataset.txt=rapTxt;}
function printRapport(){ const txt=document.getElementById('rapportRes').dataset.txt; if(!txt){alert("Jenere rapò anvan");return;} printTicketOnly(txt); }
</script>
</body>
</html>
