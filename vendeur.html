<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V106 ANSYEN RAPORT KORIJE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:bold}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:13px;border:2px solid #000;border-radius:11px;width:100%;font-size:16px;margin:5px 0;background:#fff}.line{display:grid;grid-template-columns:80px 1fr 70px;gap:6px;margin:5px 0}.tiraj{padding:7px 11px;margin:3px;border:2px solid #000;border-radius:20px;font-weight:bold;display:inline-block;font-size:13px;cursor:pointer;text-align:center}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{background:#eee;color:#aaa;pointer-events:none;opacity:.5}.btn{padding:13px;width:100%;border:none;border-radius:11px;font-weight:bold;font-size:16px;margin:6px 0}.bK{background:#000;color:#FFD700}.ticket{border:2px dashed #000;padding:12px;text-align:center;max-width:360px;margin:auto;font-family:monospace}.tab2{display:flex;background:#000;gap:1px}.tab2 button{flex:1;padding:11px 2px;font-size:12px;font-weight:bold;background:#000;color:#FFD700;border:none}.tab2 button.active{background:#FFD700;color:#000}.blocked{position:fixed;inset:0;background:rgba(0,0,0,0.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;text-align:center;padding:20px}@media print{body *{visibility:hidden}#prt,#prt *{visibility:visible}#prt{position:absolute;left:0;top:0;width:100%}}</style>
</head><body>
<div class="h">C&D LOTTO - V106</div>
<div id="blockedBox" class="blocked" style="display:none"><div style="font-size:60px">🔒</div><h1>VANDEUR FERMÉ</h1><p>Proprio fèmen ou</p><button class="btn bK" style="max-width:200px" onclick="location.reload()">Réessayer</button></div>
<div id="loginBox" class="card" style="text-align:center;padding-top:30px"><h2>Connexion</h2><input id="uName" value="Tamouche"><input id="uPass" type="password" value="1234"><button class="btn bK" onclick="go()">Antre</button><div id="loginErr" style="color:red"></div></div>
<div id="appBox" style="display:none">
<div class="tab2"><button id="btnV" class="active" onclick="showTab('vendre')">Vendre</button><button id="btnF" onclick="showTab('fichesTab')">Mes Fiches</button><button id="btnK" onclick="showTab('kopyeTab')">Kopye</button><button id="btnR" onclick="showTab('rapportTab')">Rapport</button></div>
<div id="vendre" class="card">
<div style="text-align:center;font-weight:bold">TIRAJ - <span id="dateToday" style="font-size:12px;background:#FFD700;color:#000;padding:2px 6px;border-radius:6px"></span> - <span id="statusV" style="font-size:11px;padding:2px 6px;border-radius:6px;background:green;color:#fff">OUVE</span></div>
<div id="tirajBox" style="text-align:center;margin:8px 0"></div>
<div style="display:flex;background:#000;color:#FFD700;padding:6px;font-weight:bold;border-radius:6px"><div style="width:80px">JEUX</div><div style="flex:1">BOUL</div><div style="width:70px">MIZ</div></div>
<div id="lines"></div>
<div style="background:#000;color:#fff;padding:10px;border-radius:10px;text-align:center;margin-top:6px">Total <span id="tot">0$</span> × <span id="nbT">1</span><div style="font-size:24px;color:#FFD700;font-weight:bold">A PEYE <span id="paye">0$</span></div></div>
<button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button>
<div id="prt" style="display:none"></div>
</div>
<div id="fichesTab" class="card" style="display:none"><h3>Mes Fiches - <span id="mn"></span></h3><div id="listF"></div></div>
<div id="kopyeTab" class="card" style="display:none"><h3>🔍 Kopye</h3><input id="searchId" type="tel" placeholder="ID 5 chif"><button class="btn bK" onclick="searchById()">Chèche</button><div id="resKopye"></div></div>
<div id="rapportTab" class="card" style="display:none">
<h3>Rapport Jodi a</h3>
<div><label>Du</label><input id="rapDu" type="date"></div>
<div><label>Au</label><input id="rapAu" type="date"></div>
<div style="margin-top:6px"><select id="rapTiraj"><option value="">Tous</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select></div>
<button class="btn bK" onclick="genRap()">Générer</button>
<div id="rapData" style="margin-top:10px"></div>
</div>
</div>
<script>
const firebaseConfig={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let curUser=null, selectedT=[], config={};
let tirajDef=[{id:'gaMidi',nom:'GA MIDI',h:'12:15'},{id:'flMidi',nom:'FL MIDI',h:'13:15'},{id:'nyMidi',nom:'NY MIDI',h:'14:15'},{id:'gaSoir',nom:'GA SOIR',h:'18:15'},{id:'flSoir',nom:'FL SOIR',h:'21:20'},{id:'nySoir',nom:'NY SOIR',h:'21:30'}];
function getHaitiDate(){ const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getESTHM(){ const now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return now.getHours()*60+now.getMinutes(); }
function go(){
  const u=document.getElementById('uName').value.trim().toLowerCase(); const p=document.getElementById('uPass').value.trim();
  db.ref('vendors/'+u).once('value',s=>{
    if(s.exists()){
      const v=s.val(); if(v.pass && v.pass!==p){ document.getElementById('loginErr').innerText="Modpas pa bon"; return; }
      if((v.status||'OUVE')==='FERME'){ document.getElementById('blockedBox').style.display='flex'; return; }
    }
    curUser={name:u}; initApp();
  });
}
function initApp(){
  document.getElementById('loginBox').style.display='none'; document.getElementById('appBox').style.display='block';
  document.getElementById('mn').innerText=curUser.name; document.getElementById('dateToday').innerText=getHaitiDate();
  document.getElementById('rapDu').value=getHaitiDate(); document.getElementById('rapAu').value=getHaitiDate();
  db.ref('config').on('value',snap=>{ config=snap.val()||{}; renderTiraj(); checkBlocked(); });
  document.getElementById('lines').innerHTML=''; for(let i=0;i<4;i++) addLine();
  setInterval(checkBlocked,10000);
}
function renderTiraj(){
  const he=config.heures||{}; const ti=config.tirages||{}; let html=''; const cur=getESTHM();
  tirajDef.forEach(t=>{
    const realH=he[t.id]||t.h; const [hh,mm]=realH.split(':').map(Number); const m=hh*60+mm;
    const ferme=ti[t.id]==='FERME' || cur>=m; const active=selectedT.includes(t.nom);
    html+=`<span class="tiraj ${active?'active':''} ${ferme?'ferme':''}" onclick="toggleTiraj('${t.nom}')">${t.nom}<br><small>${realH}</small></span>`;
  });
  document.getElementById('tirajBox').innerHTML=html; calc();
}
function toggleTiraj(nom){ if(selectedT.includes(nom)) selectedT=selectedT.filter(x=>x!==nom); else selectedT.push(nom); renderTiraj(); }
function checkBlocked(){
  if(!curUser) return;
  db.ref('vendors/'+curUser.name+'/status').once('value',s=>{ if(s.exists()&&s.val()==='FERME'){ document.getElementById('blockedBox').style.display='flex'; document.getElementById('appBox').style.display='none'; } });
  renderTiraj();
  const cur=getESTHM(); let ouve=0; const he=config.heures||{}; const ti=config.tirages||{};
  tirajDef.forEach(t=>{ const realH=he[t.id]||t.h; const [hh,mm]=realH.split(':').map(Number); const m=hh*60+mm; if(ti[t.id]!=='FERME' && cur<m) ouve++; });
  const st=document.getElementById('statusV'); if(ouve===0){ st.innerText="FERMÉ"; st.style.background="red"; } else { st.innerText=ouve+" OUVE"; st.style.background="green"; }
}
function addLine(){
  const div=document.createElement('div'); div.className='line';
  div.innerHTML=`<select class="j"><option value="bolet">Bole</option><option value="maryaj">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select><input class="b" type="tel" inputmode="numeric" placeholder="BOUL" maxlength="5"><input class="m" type="tel" inputmode="numeric" placeholder="G">`;
  document.getElementById('lines').appendChild(div); attachFlech(div);
}
function attachFlech(row){
  const je=row.querySelector('.j'), bo=row.querySelector('.b'), mi=row.querySelector('.m');
  [je,bo,mi].forEach((inp,idx)=>{
    inp.addEventListener('input',e=>{ if(inp!==je) e.target.value=e.target.value.replace(/[^0-9]/g,''); calc(); });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter' || e.key==='ArrowDown'){
        e.preventDefault();
        if(idx===0){ bo.focus(); }
        else if(idx===1){ mi.focus(); }
        else if(idx===2){
          // MIZ -> LIY SWIVANT - SA KI TE MANKE A
          const all=[...document.querySelectorAll('#lines .line')]; const curRow=all.indexOf(row);
          let next=all[curRow+1];
          if(!next){ addLine(); next=document.querySelectorAll('#lines .line')[curRow+1]; }
          if(next){ next.querySelector('.b').focus(); next.querySelector('.b').select(); }
        }
      }
      if(e.key==='ArrowUp'){
        e.preventDefault();
        if(idx===2){ bo.focus(); }
        else if(idx===1){ je.focus(); }
        else if(idx===0){
          const all=[...document.querySelectorAll('#lines .line')]; const curRow=all.indexOf(row);
          if(curRow>0){ const prev=all[curRow-1]; prev.querySelector('.m').focus(); }
        }
      }
    });
  });
}
function calc(){ let tot=0; document.querySelectorAll('#lines .line').forEach(r=>{ tot+=parseInt(r.querySelector('.m').value)||0; }); const nb=selectedT.length||1; document.getElementById('tot').innerText=tot+"$"; document.getElementById('nbT').innerText=nb; document.getElementById('paye').innerText=(tot*nb)+"$"; }
function showTab(id){ document.getElementById('vendre').style.display=id==='vendre'?'block':'none'; document.getElementById('fichesTab').style.display=id==='fichesTab'?'block':'none'; document.getElementById('kopyeTab').style.display=id==='kopyeTab'?'block':'none'; document.getElementById('rapportTab').style.display=id==='rapportTab'?'block':'none'; document.querySelectorAll('.tab2 button').forEach(b=>b.classList.remove('active')); if(id==='vendre') document.getElementById('btnV').classList.add('active'); if(id==='fichesTab'){document.getElementById('btnF').classList.add('active'); loadFiches();} if(id==='kopyeTab') document.getElementById('btnK').classList.add('active'); if(id==='rapportTab'){document.getElementById('btnR').classList.add('active'); genRap();} }
function loadFiches(){ const today=getHaitiDate(); db.ref('fiches').orderByChild('dateStr').equalTo(today).once('value',s=>{ if(!s.exists()){document.getElementById('listF').innerHTML="Pa gen";return;} let html=''; Object.values(s.val()).filter(f=>f.vendeur===curUser.name).reverse().forEach(f=>{ html+=`<div style="border:1px solid #ccc;padding:6px;margin:4px 0;border-radius:8px;font-size:12px"><b>${(f.tirajs||[]).join('/')} - ${f.total}$</b> ${(f.details||[]).map(d=>d.boul).join(',')}</div>`; }); document.getElementById('listF').innerHTML=html; }); }
// RAPORT KORIJE JAN NAN FOTO A
function genRap(){
  const du=document.getElementById('rapDu').value||getHaitiDate(); const au=document.getElementById('rapAu').value||getHaitiDate(); const tirajF=document.getElementById('rapTiraj').value;
  db.ref('fiches').once('value',s=>{
    if(!s.exists()){ document.getElementById('rapData').innerHTML="Pa gen fich"; return; }
    let all=Object.values(s.val()).filter(f=> f.vendeur===curUser.name && f.dateStr>=du && f.dateStr<=au );
    if(tirajF) all=all.filter(f=> (f.tirajs||[]).includes(tirajF));
    const vente=all.reduce((a,b)=>a+(b.total||0),0);
    const com=Math.round(vente*0.10);
    const gain=all.reduce((a,b)=>a+(b.gain||0),0);
    const net=vente-com-gain;
    let listHtml=''; all.sort((a,b)=>b.date.localeCompare(a.date)).forEach(f=>{
      const win=f.gain?` <b style="color:green">WIN:${f.gain}$</b>`:'';
      listHtml+=`<div style="border-bottom:1px solid #ddd;padding:6px 0;font-size:12px">${f.dateStr} - ${(f.tirajs||[]).join(',')} - ${f.total}$${win}</div>`;
    });
    document.getElementById('rapData').innerHTML=`
      <div style="border:2px solid #000;padding:10px;border-radius:8px;text-align:center">
        <div>Vente: ${vente}$ | Com 10%: ${com}$ | Gain: ${gain}$</div>
        <div style="background:#000;color:#FFD700;padding:10px;border-radius:8px;margin:8px 0;font-size:18px;font-weight:900">A PEYE / Net: ${net}$</div>
        <div>Fiches: ${all.length}</div>
      </div>
      <div style="margin-top:10px">${listHtml}</div>
      <button class="btn bK" style="margin-top:10px" onclick="window.print()">🖨️ Imprimer Rapport</button>
    `;
  });
}
function vann(){ if(selectedT.length===0){alert('Chwazi tiraj');return;} let details=[]; document.querySelectorAll('#lines .line').forEach(r=>{ const j=r.querySelector('.j').value; const b=r.querySelector('.b').value.trim(); const m=parseInt(r.querySelector('.m').value)||0; if(b&&m) details.push({type:j,boul:b,montan:m}); }); if(details.length===0){alert('Mete boul');return;} const base=details.reduce((a,b)=>a+b.montan,0); const total=base*selectedT.length; const id=db.ref('fiches').push().key; db.ref('fiches/'+id).set({id:id,vendeur:curUser.name,tirajs:selectedT,details:details,total:total,totalBase:base,nbTiraj:selectedT.length,date:new Date().toISOString(),dateStr:getHaitiDate(),gain:0}).then(()=>{ const html=`<div class="ticket"><b>C&D LOTTO</b><br>${curUser.name}<br>${selectedT.join('/')}<br>-------------------<br>${details.map(d=>`${d.type.toUpperCase()} ${d.boul} ${d.montan}$ x${selectedT.length}`).join('<br>')}<br>-------------------<br>Total: ${base}$ x ${selectedT.length} = ${total}$<br>ID:${id.slice(-5).toUpperCase()}</div>`; document.getElementById('prt').innerHTML=html; window.print(); document.querySelectorAll('#lines .line').forEach(r=>{ r.querySelector('.b').value=''; r.querySelector('.m').value=''; }); calc(); document.querySelector('#lines .line .b').focus(); }); }
function searchById(){ const q=document.getElementById('searchId').value.trim().toLowerCase(); db.ref('fiches').once('value',s=>{ const all=Object.values(s.val()||[]); const f=all.find(x=>x.id.toLowerCase().includes(q)||x.id.slice(-5).toLowerCase()===q); document.getElementById('resKopye').innerHTML=f?`<b>${f.total}$</b> ${f.tirajs}<br><button class="btn bK" onclick="kopye('${f.id}')">Kopye</button>`:"Pa jwenn"; }); }
function kopye(id){ db.ref('fiches/'+id).once('value',s=>{ const f=s.val(); selectedT=f.tirajs||[]; document.getElementById('lines').innerHTML=''; f.details.forEach(d=>{ addLine(); const rows=document.querySelectorAll('#lines .line'); const row=rows[rows.length-1]; row.querySelector('.j').value=d.type; row.querySelector('.b').value=d.boul; row.querySelector('.m').value=d.montan; }); renderTiraj(); calc(); showTab('vendre'); }); }
</script></body></html>
