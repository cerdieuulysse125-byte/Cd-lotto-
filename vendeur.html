<!DOCTYPE html>
<html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V115.8 BACK TO VENDRE FINAL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:8px;text-align:center;font-weight:900;font-size:9px}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:12px;border:2px solid #000;border-radius:10px;width:100%;font-size:15px;margin:4px 0}.tiraj{padding:5px 9px;margin:2px;border:2px solid #000;border-radius:20px;font-weight:900;display:inline-block;font-size:10px;cursor:pointer}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{opacity:.2;pointer-events:none;background:#ccc}.btn{padding:13px;width:100%;border:none;border-radius:10px;font-weight:900;margin:5px 0;cursor:pointer}.bK{background:#000;color:#FFD700}.bV{background:#16a34a;color:#fff;font-size:16px}.tab2{display:flex;background:#000;gap:1px;position:sticky;top:0;z-index:20}.tab2 button{flex:1;padding:10px 1px;font-size:9px;font-weight:900;background:#000;color:#FFD700;border:none}.tab2 button.active{background:#FFD700;color:#000}#fermeOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);color:#fff;z-index:9999;display:none;justify-content:center;align-items:center;text-align:center;padding:20px}</style>
</head><body>
<div id="fermeOverlay"><div><div style="font-size:70px">🔒</div><div style="font-size:30px;font-weight:900;color:#ef4444">BANK FERME</div><div style="margin-top:8px">Vandè: <span id="fermeNom"></span><br>Proprio fèmen w</div></div></div>
<div class="h">V115.8 - BACK RETOUNEN NAN VENDRE - V115.7 COPIER KORIJE</div>
<div id="loginBox" class="card" style="text-align:center;padding-top:30px"><h3>Connexion</h3><input id="uName" placeholder="Code"><input id="uPass" type="password" placeholder="Modpas"><button class="btn bK" onclick="go()">Antre</button><div id="loginErr" style="color:red;font-weight:900"></div></div>
<div id="appBox" style="display:none">
<div class="tab2"><button id="tV" class="active" onclick="showTab('vendre')">1.Vendre</button><button id="tC" onclick="showTab('kopyeTab')">2.Copier</button><button id="tF" onclick="showTab('fichesTab')">3.Fiches</button><button id="tR" onclick="showTab('rapportTab')">4.Rapport</button></div>

<div id="vendre" class="card"><div style="text-align:center;font-weight:900;font-size:9px">TIRAJ - <span id="dateToday" style="background:#FFD700;padding:2px 5px;border-radius:5px"></span> - <span id="userShow" style="background:#000;color:#FFD700;padding:2px 5px;border-radius:5px"></span> <span id="comShow" style="background:#16a34a;color:#fff;padding:2px 5px;border-radius:5px"></span></div><div id="limitMsg"></div><div id="tirajBox" style="text-align:center;margin:5px 0"></div><div style="display:flex;background:#000;color:#FFD700;padding:6px;font-weight:900;border-radius:6px;font-size:10px"><div style="width:85px">JEUX</div><div style="flex:1">BOUL</div><div style="width:75px">MIZ</div></div><div id="lines"></div><div style="background:#000;color:#fff;padding:10px;border-radius:8px;text-align:center;margin-top:6px">Total <span id="tot">0$</span> × <span id="nbT">1</span><div style="font-size:24px;color:#FFD700">A PEYE <span id="paye">0$</span></div></div><button class="btn bK" id="btnVendre" onclick="vann()">VENDRE & IMPRIMER</button><div id="lastTicket"></div></div>

<div id="kopyeTab" class="card" style="display:none"><h3>2.Copier - Chèche pa ID (5 lèt)</h3><input id="searchId" placeholder="Ex: A1B2C" style="text-transform:uppercase"><button class="btn bK" onclick="searchById()">Chèche</button><div id="kopyeResult"></div><div style="margin-top:15px"><button class="btn bV" onclick="showTab('vendre')">↩️ RETOUNEN NAN VENDRE</button></div></div>

<div id="fichesTab" class="card" style="display:none"><h3>3.Fiches</h3><div id="fichesList"></div><div style="margin-top:15px"><button class="btn bV" onclick="showTab('vendre')">↩️ RETOUNEN NAN VENDRE</button></div></div>

<div id="rapportTab" class="card" style="display:none"><h3>4.Rapport</h3><div id="rapportContent"></div><div style="margin-top:15px"><button class="btn bV" onclick="showTab('vendre')">↩️ RETOUNEN NAN VENDRE</button></div></div>

</div>

<script>
// FIREBASE CONFIG OU A - KITE SA OU TE GENYEN AN
const firebaseConfig = { databaseURL: "https://verite-lotto-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// KÒD KONEKSYON OU A - KITE L JAN L YE A
function go(){ /* kite kòd login ou a isit */ 
  document.getElementById('loginBox').style.display='none';
  document.getElementById('appBox').style.display='block';
  document.getElementById('dateToday').innerText = new Date().toLocaleDateString();
  initApp();
}

function initApp(){
  // kite kòd tiraj ou yo isit
  history.pushState(null, null, location.href); // Aktive BACK la
}

// ===== NOUVO KÒD BACK -> VENDRE - V115.8 =====
function showTab(nom){
  document.getElementById('vendre').style.display = nom=='vendre' ? 'block' : 'none';
  document.getElementById('kopyeTab').style.display = nom=='kopyeTab' ? 'block' : 'none';
  document.getElementById('fichesTab').style.display = nom=='fichesTab' ? 'block' : 'none';
  document.getElementById('rapportTab').style.display = nom=='rapportTab' ? 'block' : 'none';
  
  document.getElementById('tV').className = nom=='vendre' ? 'active' : '';
  document.getElementById('tC').className = nom=='kopyeTab' ? 'active' : '';
  document.getElementById('tF').className = nom=='fichesTab' ? 'active' : '';
  document.getElementById('tR').className = nom=='rapportTab' ? 'active' : '';

  if(nom !== 'vendre'){
     history.pushState({tab: nom}, '', '#' + nom);
  }
}

window.onpopstate = function(){
   // TOUJOU RETOUNEN NAN VENDRE
   document.getElementById('vendre').style.display = 'block';
   document.getElementById('kopyeTab').style.display = 'none';
   document.getElementById('fichesTab').style.display = 'none';
   document.getElementById('rapportTab').style.display = 'none';
   document.getElementById('tV').className = 'active';
   document.getElementById('tC').className = '';
   document.getElementById('tF').className = '';
   document.getElementById('tR').className = '';
   history.pushState(null, null, location.href);
};

// Apre enprime - ajoute bouton retounen
function apreImprime(){
   const div = document.getElementById('lastTicket');
   div.innerHTML += '<br><button class="btn bV" onclick="showTab(\'vendre\');window.scrollTo(0,0)">↩️ RETOUNEN NAN VENDRE</button>';
   setTimeout(()=>{ showTab('vendre'); }, 1500);
}
window.addEventListener('afterprint', apreImprime);

// FONKSYON VANN OU A - AJOUTE apreImprime() nan fen li
function vann(){
  // ... kite tout kòd vann ou a ...
  // nan fen vann(), ajoute:
  // apreImprime();
  document.getElementById('lastTicket').innerHTML = '<div style="border:2px dashed #000;padding:10px;text-align:center"><h3>🎫 FICH ANPRIMTE</h3><p>Bòn chans!</p></div>';
  apreImprime();
}
function searchById(){}
</script>
</body></html>
