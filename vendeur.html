<script>
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const TIRAJ_DEFAULT=[["GA midi","12:00"],["FL midi","13:00"],["NY midi","14:00"],["Real","12:30"],["GA soir","18:00"],["FL soir","21:00"],["NY soir","22:00"],["Primera día","11:30"],["Suerte día","12:00"],["Lote Dom","13:30"],["Ganamas","14:15"],["Suerte noche","17:50"],["Primera noche","19:50"],["Loteka","19:45"],["Nacional noche","20:50"],["Leidsa","20:45"],["Anguila 10h","09:40"],["Anguila 18h","17:40"]];
let DB={vendeurs:{},tickets:{},heures:{},results:{},config:{},prix:{global:{p1:50,p2:20,p3:10,m1:1000,l3:500,l4:5000,l5:25000,kom:10,komActive:true}},limites:{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}}},CUR=null,selT=[],LAST_TXT='',curRow=null;

function getHaitiTime(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Port-au-Prince'}));}
function formatHaiti(d){let h=d.getHours(),m=d.getMinutes().toString().padStart(2,'0'),ap=h>=12?'PM':'AM',h12=h%12||12;return h12+':'+m+' '+ap;}
function getHeureProprio(n){return DB.heures&&DB.heures[n]?DB.heures[n]:(TIRAJ_DEFAULT.find(x=>x[0]==n)?.[1]||'');}
function isOpen(n){let s=getHeureProprio(n);if(!s)return true;let p=s.split(':'),fh=parseInt(p[0]),fm=parseInt(p[1]||0),h=getHaitiTime();return h.getHours()*60+h.getMinutes() < fh*60+fm;}
function getMyLimite(){return DB.limites[CUR?._key]||DB.limites[CUR?.serial]||DB.limites.global||{bor:1500,mar:100,l3:100,l4:20,l5:5};}
function getMyPrix(k){let key=k||CUR?._key;return DB.prix[key]||DB.prix.global||{p1:50,p2:20,p3:10,m1:1000,l3:500,l4:5000,l5:25000,kom:10,komActive:true};}
function getLimiteForJeu(j){let lim=getMyLimite();if(j==='boul')return lim.bor;if(j==='maryaj')return lim.mar;if(j==='loto3')return lim.l3;if(j==='loto4')return lim.l4;if(j==='loto5')return lim.l5;return 99999;}
function getChifRequis(jeu){if(jeu==='boul')return 2;if(jeu==='loto3')return 3;if(jeu==='loto4')return 4;if(jeu==='loto5')return 5;if(jeu==='maryaj')return 4;return 2;}
function getLogoUrl(){return DB.config?.logoUrl||localStorage.getItem('lotto_logo')||'';}
function saveLogo(){let url=document.getElementById('logoUrl').value.trim();if(!url){alert('Mete URL logo');return}db.ref('config/logoUrl').set(url).then(()=>{localStorage.setItem('lotto_logo',url);alert('✅ Logo sove');});}

function listenDB(){db.ref().on('value',snap=>{let v=snap.val()||{};DB.vendeurs=v.vendeurs||{};DB.tickets=v.tickets||{};DB.heures=v.heures||{};DB.results=v.results||{};DB.prix=v.prix||DB.prix;DB.limites=v.limites||DB.limites;DB.config=v.config||{};renderT();document.getElementById('heureHaiti').innerText='SYNC:'+formatHaiti(getHaitiTime())+'-'+Object.keys(DB.vendeurs).length+'V';let logo=getLogoUrl();if(logo){document.getElementById('logoPreview').innerHTML='<img src="'+logo+'" style="max-width:120px;max-height:120px;border:2px solid #1e2a8a;border-radius:8px"><br><small>✅ Logo aktif</small>';document.getElementById('logoUrl').value=logo;}});}
async function doLogin(){let s=document.getElementById('inputSerial').value.trim(),p=document.getElementById('inputPass').value.trim(),msg=document.getElementById('loginMsg');if(!s){msg.innerText='Mete Serial';return}if(!p){msg.innerText='Modpas Obligatwa';return}let snap=await db.ref('vendeurs').once('value');let vendeurs=snap.val()||{};let key=Object.keys(vendeurs).find(k=>String(vendeurs[k].serial)===String(s));let f=key?vendeurs[key]:null;if(!f){msg.innerText='Vandè '+s+' pa egziste';return}if(!f.pass||String(f.pass)!==String(p)){msg.innerText='Modpas pa bon';return}CUR=f;CUR._key=key;localStorage.setItem('curV',JSON.stringify(CUR));openMain();}
function openMain(){document.getElementById('loginPage').style.display='none';document.getElementById('mainPage').style.display='block';document.getElementById('mainPage').classList.add('show');document.getElementById('vName').innerText=CUR.nom||('Vandè '+CUR.serial);listenDB();addR();upd();}
function logout(){localStorage.clear();location.reload();}
function renderT(){let tlist=document.getElementById('tlist');let html='<div style="grid-column:1/-1;display:flex;justify-content:space-between;background:#1e2a8a;color:#fff;padding:8px;border-radius:8px"><div><b>Tiraj</b><br><small>'+formatHaiti(getHaitiTime())+'</small></div><span onclick="tlist.classList.remove(\'open\')" style="background:#e11d48;padding:6px 12px;border-radius:6px">X</span></div>';TIRAJ_DEFAULT.forEach(t=>{let name=t[0],hp=getHeureProprio(name),open=isOpen(name),chk=selT.includes(name)?'checked':'',bg=open?'background:#dcfce7;border-color:#16a34a':'background:#fee2e2;border-color:#e11d48';html+='<label class="topt" style="'+bg+'"><input type="checkbox" value="'+name+'" '+chk+' '+(open?'':'disabled')+' onchange="chg(this)"><span>'+name+'</span><small>'+hp+' '+(open?'✅':'⛔')+'</small></label>';});tlist.innerHTML=html;document.getElementById('rt').innerHTML='<option value="tous">Tous</option>'+TIRAJ_DEFAULT.map(t=>'<option>'+t[0]+'</option>').join('');let lim=getMyLimite();let prix=getMyPrix();document.getElementById('limitInfo').innerHTML='⛔ Limit: Boul $'+lim.bor+' Mar $'+lim.mar+' L3 $'+lim.l3;document.getElementById('heureList').innerHTML=TIRAJ_DEFAULT.map(t=>'<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee"><span>'+t[0]+'</span><span><b>'+getHeureProprio(t[0])+'</b> '+(isOpen(t[0])?'✅':'⛔')+'</span></div>').join('');document.getElementById('prixInfo').innerHTML='<div style="background:#e8f5e9;padding:8px;border-radius:8px;border:2px solid #16a34a"><b>Pri chak vandè</b><br>1er:'+prix.p1+' 2e:'+prix.p2+' 3e:'+prix.p3+' | M:'+prix.m1+'</div>';}
function chg(el){if(!isOpen(el.value)&&el.checked){alert('Fèmen');el.checked=false;return}if(el.checked)selT.push(el.value);else selT=selT.filter(x=>x!=el.value);document.getElementById('txtT').innerText=selT.length?selT.length+' tiraj':'Chwazi tiraj';upd();if(selT.length)document.getElementById('tlist').classList.remove('open')}
function selAll(){selT=[];TIRAJ_DEFAULT.forEach(t=>{if(isOpen(t[0]))selT.push(t[0])});renderT();document.getElementById('txtT').innerText=selT.length?selT.length+' tiraj':'Chwazi tiraj';upd()}
function addR(keep='boul'){let c=document.getElementById('bets');let d=document.createElement('div');d.className='row betRow';d.innerHTML='<div class="kz kz-jeux" onclick="openJeux(this.parentElement)">'+keep.toUpperCase()+'</div><div class="kz kz-boul" onclick="openBoul(this.parentElement)">--</div><div class="kz kz-miz" onclick="openMiz(this.parentElement)">$</div><select class="jeu" style="display:none"><option value="boul">boul</option><option value="maryaj">maryaj</option><option value="loto3">loto3</option><option value="loto4">loto4</option><option value="loto5">loto5</option></select><input class="boul" type="hidden"><input class="mise" type="hidden"><button class="btnR" onclick="this.parentElement.remove();upd()">X</button>';c.appendChild(d);d.querySelector('.jeu').value=keep;upd();}
function openJeux(row){curRow=row;document.getElementById('mJeux').classList.add('on');}
function setJeux(val){if(curRow){curRow.querySelector('.jeu').value=val;curRow.querySelector('.kz-jeux').innerText=val.toUpperCase();}document.getElementById('mJeux').classList.remove('on');upd();setTimeout(()=>openBoul(curRow),300);}
function openBoul(row){curRow=row;let jeu=row.querySelector('.jeu').value;let req=getChifRequis(jeu);document.getElementById('boulJeuxLabel').innerText=jeu.toUpperCase()+' - '+req+' chif obligatwa';document.getElementById('boulInfo').innerText=jeu==='boul'?'Bòlèt dwe 2 chif':jeu==='loto3'?'Loto3 dwe 3 chif':jeu==='loto4'?'Loto4 dwe 4 chif':jeu==='loto5'?'Loto5 dwe 5 chif':'Maryaj dwe 4 chif (12 34)';document.getElementById('boulInput').value=row.querySelector('.boul').value||'';document.getElementById('mBoul').classList.add('on');}
function addB(d){let i=document.getElementById('boulInput');let jeu=curRow.querySelector('.jeu').value;let max=getChifRequis(jeu);if(i.value.length>=max)return;i.value+=d;}
function delB(){let i=document.getElementById('boulInput');i.value=i.value.slice(0,-1);}
function okB(){let val=document.getElementById('boulInput').value.trim();let jeu=curRow.querySelector('.jeu').value;let req=getChifRequis(jeu);if(val.length!==req){if(jeu==='boul')alert('⛔ Bòlèt dwe 2 chif - ou mete '+val.length);else if(jeu==='loto3')alert('⛔ Loto3 dwe 3 chif');else if(jeu==='loto4')alert('⛔ Loto4 dwe 4 chif');else if(jeu==='loto5')alert('⛔ Loto5 dwe 5 chif');else if(jeu==='maryaj')alert('⛔ Maryaj dwe 4 chif ex: 1234');return;}if(curRow){curRow.querySelector('.boul').value=val;curRow.querySelector('.kz-boul').innerText=val;}document.getElementById('mBoul').classList.remove('on');upd();setTimeout(()=>openMiz(curRow),300);}
function openMiz(row){curRow=row;let max=getLimiteForJeu(row.querySelector('.jeu').value);document.getElementById('mizLimitLabel').innerText='Limit Proprio: Max $'+max+' - '+row.querySelector('.jeu').value.toUpperCase();document.getElementById('mizInput').value=row.querySelector('.mise').value||'';document.getElementById('mMiz').classList.add('on');}
function addM(v){document.getElementById('mizInput').value=v;}
function okM(){let val=parseInt(document.getElementById('mizInput').value)||0;let max=getLimiteForJeu(curRow.querySelector('.jeu').value);if(val>max){alert('⛔ Limit depase Max $'+max);return}if(curRow){curRow.querySelector('.mise').value=val;curRow.querySelector('.kz-miz').innerText=val?'$'+val:'$';}document.getElementById('mMiz').classList.remove('on');upd();let last=document.querySelectorAll('.betRow');if(last[last.length-1]===curRow)addR(curRow.querySelector('.jeu').value);}
function upd(){let sum=0;document.querySelectorAll('.betRow').forEach(r=>{let mm=parseInt(r.querySelector('.mise').value)||0;if(r.querySelector('.boul').value.trim()&&mm)sum+=mm;});document.getElementById('dt').innerText='Total $'+sum+' x '+selT.length+' = $'+(sum*selT.length);document.getElementById('gt').innerText='$'+(sum*selT.length);}

// SANTRE, SAN PA GEN LIY VID - LOGO NAN TÈT
function build(tk){
 let txt='';
 let logo=getLogoUrl();
 if(logo){txt+='[C]<img>'+logo+'</img>\n';}
 txt+='[C]C-D VERITE LOTTO\n';
 txt+='[C]Le Ayiti:'+formatHaiti(getHaitiTime())+'\n';
 txt+='[C]Tiraj:'+tk.tirages.join(',').substring(0,28)+'\n';
 txt+='[C]Vande:'+(CUR?.serial||'')+'\n';
 txt+='[C]Id:'+tk.id+'\n';
 txt+='[C]--------------------------------\n';
 txt+='[C]JEU BOUL MIZ\n';
 txt+='[C]--------------------------------\n';
 tk.bets.forEach(b=>{
   txt+='[C]'+b.type.toUpperCase()+' '+b.numero+' $'+b.mise+'\n';
 });
 txt+='[C]--------------------------------\n';
 txt+='[C]TOTAL $'+tk.baseTotal+' x '+tk.tirages.length+' = $'+tk.total+'\n';
 txt+='[C]'+new Date().toLocaleDateString('fr-FR')+' '+formatHaiti(getHaitiTime())+'\n';

 return txt;
}

async function vann(){if(!selT.length){alert('Chwazi Tiraj - Total $0 x 0 = $0 paske tiraj pa chwazi');return}let bets=[];let err='';document.querySelectorAll('.betRow').forEach(r=>{let j=r.querySelector('.jeu').value,b=r.querySelector('.boul').value.trim(),mm=parseInt(r.querySelector('.mise').value);if(j&&b&&mm){let max=getLimiteForJeu(j);let req=getChifRequis(j);if(b.length!==req){err+='⛔ '+j.toUpperCase()+' '+b+' dwe '+req+' chif\n';return;}if(mm>max)err+='⛔ '+j.toUpperCase()+' '+b+' $'+mm+' depase $'+max+'\n';bets.push({type:j,numero:b,mise:mm})}});if(err){alert(err);return}if(!bets.length){alert('VID - Bòlèt 2 chif, Loto3 3, Loto4 4, Loto5 5, Maryaj 4');return}let base=bets.reduce((a,b)=>a+b.mise,0);let tk={id:'T'+Date.now().toString().slice(-7),bets,tirages:selT.slice(),baseTotal:base,total:base*selT.length,date:getHaitiTime().toISOString().slice(0,10),dateHaiti:getHaitiTime().toLocaleDateString('fr-CA',{timeZone:'America/Port-au-Prince'}),vendeurId:CUR?._key,serial:CUR?.serial};await db.ref('tickets/'+tk.id).set(tk);let txt=build(tk);document.getElementById('prev').style.display='block';document.getElementById('prev').innerText=txt.replace(/\[C\]|\[L\]|<img>.*<\/img>/g,'');LAST_TXT=txt;printBT(txt);document.getElementById('bets').innerHTML='';addR(bets[bets.length-1]?.type||'boul');upd();}
function printBT(t){let enc=encodeURIComponent(t||LAST_TXT);window.location.href='rawbt://print?text='+enc;}
async function calcR(){let du=document.getElementById('rdu').value,au=document.getElementById('rau').value,ti=document.getElementById('rt').value;if(!du||!au){alert('Chwazi dat');return}let snap=await db.ref('tickets').once('value');let all=snap.val()||{};let resSnap=await db.ref('results').once('value');let results=resSnap.val()||{};let vente=0,count=0,gain=0;Object.values(all).forEach(t=>{let td=t.dateHaiti||t.date;if(td<du||td>au)return;if(t.serial!=CUR.serial&&t.vendeurId!=CUR._key)return;if(ti!='tous'&&t.tirages.indexOf(ti)==-1)return;count++;vente+=ti=='tous'?t.total:t.baseTotal;let prix=getMyPrix(t.vendeurId);for(let tirage of t.tirages){if(ti!='tous'&&tirage!=ti)continue;let res=Object.values(results).find(r=>r.tirage==tirage);if(!res)continue;for(let bet of t.bets){if(bet.type==='boul'){if(bet.numero===res.r1)gain+=bet.mise*prix.p1;else if(bet.numero===res.r2)gain+=bet.mise*prix.p2;else if(bet.numero===res.r3)gain+=bet.mise*prix.p3;}else if(bet.type==='maryaj'){let a=bet.numero.substring(0,2),b=bet.numero.substring(2,4);let r=[res.r1,res.r2,res.r3];if(r.includes(a)&&r.includes(b))gain+=bet.mise*prix.m1;}else if(bet.type==='loto3'&&bet.numero===res.l3)gain+=bet.mise*prix.l3;else if(bet.type==='loto4'&&bet.numero===res.l4)gain+=bet.mise*prix.l4;else if(bet.type==='loto5'&&bet.numero===res.l5)gain+=bet.mise*prix.l5;}}});let prixCur=getMyPrix();let kom=prixCur.komActive?vente*prixCur.kom/100:0;let bal=vente-kom-gain;document.getElementById('rres').style.display='block';document.getElementById('rres').innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center"><div style="background:#e3f2fd;padding:8px;border-radius:8px"><small>Vant ('+count+')</small><div style="font-size:18px;font-weight:800">$'+vente.toFixed(2)+'</div></div><div style="background:#fff3e0;padding:8px;border-radius:8px"><small>Komisyon</small><div style="font-size:18px;font-weight:800">$'+kom.toFixed(2)+'</div></div><div style="background:#fce4ec;padding:8px;border-radius:8px"><small>A Peye</small><div style="font-size:18px;font-weight:800">$'+gain.toFixed(2)+'</div></div><div style="background:#e8f5e9;padding:8px;border-radius:8px"><small>Balans</small><div style="font-size:18px;font-weight:800">$'+bal.toFixed(2)+'</div></div></div>';let txt='[C]C-D VERITE LOTTO\n[C]RAPPORT '+du+' AU '+au+'\n[C]Vande:'+CUR.serial+'\n[C]--------------------------------\n[C]Vant:$'+vente.toFixed(2)+'\n[C]Komisyon:$'+kom.toFixed(2)+'\n[C]A Peye:$'+gain.toFixed(2)+'\n[C]Balans:$'+bal.toFixed(2)+'\n';document.getElementById('rprint').innerText=txt.replace(/\[C\]/g,'');document.getElementById('rprint').style.display='block';LAST_TXT=txt;}
function printRapport(){let enc=encodeURIComponent(LAST_TXT);window.location.href='rawbt://print?text='+enc;}
function go(id,el){document.querySelectorAll('#mainPage.page').forEach(p=>{p.classList.remove('on');p.style.display='none';});let target=document.getElementById(id);target.classList.add('on');target.style.display='block';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));if(el)el.classList.add('on');window.scrollTo(0,0);if(id=='pF')loadF();}
async function loadF(){let d=document.getElementById('fd').value||getHaitiTime().toISOString().slice(0,10);let snap=await db.ref('tickets').once('value');let all=snap.val()||{};let list=Object.values(all).filter(t=>(t.date==d||t.dateHaiti==d)&&(t.serial==CUR.serial||t.vendeurId==CUR._key));let total=list.reduce((a,b)=>a+b.total,0);document.getElementById('ftot').style.display=list.length?'block':'none';document.getElementById('ftot').innerHTML='Total $'+total+' - '+list.length+' fiches';document.getElementById('flist').innerHTML=list.reverse().map(t=>'<div class="card"><b>'+t.id+'</b> '+t.tirages.join(',')+'<br>'+t.bets.map(b=>b.type+':'+b.numero+' $'+b.mise).join(' | ')+'<br><b>$'+t.total+'</b></div>').join('')||'Pa gen';}
function doCopy(){let id=document.getElementById('cid').value.trim();db.ref('tickets/'+id).once('value',snap=>{let tk=snap.val();if(!tk){alert('Pa jwenn');return}selT=tk.tirages.filter(x=>isOpen(x));document.getElementById('bets').innerHTML='';tk.bets.forEach(b=>{addR(b.type);let r=document.querySelectorAll('.betRow');let rr=r[r.length-1];rr.querySelector('.jeu').value=b.type;rr.querySelector('.kz-jeux').innerText=b.type.toUpperCase();rr.querySelector('.boul').value=b.numero;rr.querySelector('.kz-boul').innerText=b.numero;rr.querySelector('.mise').value=b.mise;rr.querySelector('.kz-miz').innerText='$'+b.mise;});go('pV',document.getElementById('tabV'));upd();});}
