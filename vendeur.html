<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C&D - RAPPORT DETAYE + MARYAJ 12x34=34x12</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#000}
.card{max-width:540px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:#000;color:#fff;text-align:center;padding:12px;font-weight:bold}
.tabs{display:flex;background:#111;position:sticky;top:0;z-index:20}
.tab{flex:1;padding:12px 2px;text-align:center;color:#888;font-size:10px;font-weight:bold;cursor:pointer;border-bottom:3px solid #111}
.tab.active{color:#fff;border-bottom-color:#fff}
.content{padding:10px;flex:1}
.panel{display:none}.panel.active{display:block}
.tirages{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.tir{border:2px solid #000;padding:10px 4px;border-radius:8px;text-align:center;font-size:11px;font-weight:bold;cursor:pointer}
.tir.sel{background:#000;color:#fff}
.ligne{display:flex;gap:5px;margin:8px 0;align-items:center;background:#f5f5f5;padding:7px;border-radius:12px}
.jeuxBtn{width:28%;border:2.5px solid #000;border-radius:8px;padding:13px 2px;font-size:12px;font-weight:bold;text-align:center;background:#fff;cursor:pointer}
.boul{width:32%;border:2px solid #000;border-radius:8px;padding:13px 4px;font-size:16px;font-weight:bold;text-align:center}
.miz{width:22%;border:2px solid #000;border-radius:8px;padding:13px 2px;font-size:16px;font-weight:bold;text-align:center}
.del{width:13%;background:#fff;border:2px solid red;color:red;border-radius:8px;padding:13px 0;font-weight:bold;cursor:pointer}
.totalBox{background:#000;color:#fff;border-radius:12px;padding:14px;text-align:center;font-size:18px;font-weight:bold;margin:12px 0}
.btn{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:16px;margin:6px 0;cursor:pointer}
.btn-out{background:#fff;color:#000;border:2.5px solid #000}
.list{border:2px solid #000;border-radius:12px;padding:12px;margin:8px 0;font-size:12px;cursor:pointer;background:#fff}
.inputBox{width:100%;padding:12px;border:2px solid #000;border-radius:10px;margin:6px 0;font-weight:bold}
.rapBox{border:2.5px solid #000;border-radius:14px;padding:14px;margin-top:12px;background:#f9f9f9;white-space:pre-line;text-align:left;font-family:Courier, monospace;font-size:11.5px;line-height:1.4}
.small{font-size:11px;color:#555;text-align:center;margin:6px 0}
</style>
</head>
<body>
<div class="card">
<div class="hdr">C&D VÉRITÉ LOTTO - <span id="vNameHdr">Vandè</span></div>
<div id="loginDiv" style="padding:30px">
<input id="nom" placeholder="Non Vandè" class="inputBox">
<input id="pass" type="password" placeholder="Modpas" class="inputBox">
<button class="btn" onclick="login()">ANTRE</button><p id="msg" style="color:red;text-align:center;margin-top:10px"></p>
</div>
<div id="appDiv" style="display:none;flex-direction:column;flex:1">
<div class="tabs"><div class="tab active" onclick="openTab(0)">1.VANT</div><div class="tab" onclick="openTab(1)">2.KOPYE</div><div class="tab" onclick="openTab(2)">3.FICH</div><div class="tab" onclick="openTab(3)">4.RAPÒ</div></div>
<div class="content">
<div class="panel active" id="p0">
<div class="small">TIRAJ MILTIP - Chwazi:</div>
<div class="tirages">
<div class="tir" id="t1" onclick="toggleTir('GA MIDI')">GA MIDI</div>
<div class="tir" id="t2" onclick="toggleTir('FL MIDI')">FL MIDI</div>
<div class="tir" id="t3" onclick="toggleTir('NY MIDI')">NY MIDI</div>
<div class="tir" id="t4" onclick="toggleTir('GA SOIR')">GA SOIR</div>
<div class="tir" id="t5" onclick="toggleTir('FL SOIR')">FL SOIR</div>
<div class="tir" id="t6" onclick="toggleTir('NY SOIR')">NY SOIR</div>
</div>
<div class="small">Chwazi pami [Jeux ▼] | Boul | Miz | X</div>
<div id="lignes"></div>
<button class="btn btn-out" onclick="addLigne(lastJeux)">+ Liy (Enter ↓)</button>
<div class="totalBox" id="totalBox">Total: $0 x 0 tiraj = $0</div>
<button class="btn" onclick="validerEtImprimer()">💾 VALIDE & IMPRIMER</button>
</div>
<div class="panel" id="p1"><h4 style="text-align:center">2. KOPYE</h4><input id="searchTicket" class="inputBox" placeholder="Chèche Id, boul..." oninput="filtrerCopy()"><div id="copyList"></div></div>
<div class="panel" id="p2"><h4 style="text-align:center">3. MES FICHES - <span id="dateJour"></span></h4><button class="btn btn-out" onclick="loadFiches(true)">🔄 Rechaje</button><div id="fichesList"></div></div>
<div class="panel" id="p3">
<h4 style="text-align:center">4. RAPPORT DETAYE / TIRAJ</h4>
<div style="display:flex;gap:6px"><div style="flex:1"><label style="font-size:11px;font-weight:bold">Du</label><input id="du" type="date" class="inputBox"></div><div style="flex:1"><label style="font-size:11px;font-weight:bold">Au</label><input id="au" type="date" class="inputBox"></div></div>
<select id="rapTirage" class="inputBox"><option value="TOUS">Tirage (..., tous)</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select>
<button class="btn" onclick="genRapport()">📊 Jenere Rapò Detaye</button>
<div id="rapportRes"></div>
<button class="btn btn-out" id="btnPrintRap" style="display:none" onclick="printRapport()">🖨️ Imprimer Rapò</button>
<button class="btn btn-out" onclick="location.reload()">Dekonekte</button>
</div>
</div>
</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();

// PRIX MODIFIABLE
const PRIX={BOLET_1ER:50, BOLET_2E:20, BOLET_3E:10, MARYAJ:1000, LOTO3:500, LOTO4:5000, LOTO5:25000};

let current=null, tiragesSel=new Set(), lignesData=[], lastJeux='BOLET', allVentes=[], allResultats=[];
const JEUX_LIST=['BOLET','MARYAJ','LOTO3','LOTO4','LOTO5'];

function openTab(i){document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));document.querySelectorAll('.panel').forEach((p,idx)=>p.classList.toggle('active',idx===i));}
function toggleTir(n){const m={'GA MIDI':1,'FL MIDI':2,'NY MIDI':3,'GA SOIR':4,'FL SOIR':5,'NY SOIR':6}; const el=document.getElementById('t'+m[n]); if(tiragesSel.has(n)){tiragesSel.delete(n);el.classList.remove('sel')}else{tiragesSel.add(n);el.classList.add('sel')} calcTotal();}
function addLigne(jeuxKeep){ const id=Date.now()+Math.random(); const jeux=jeuxKeep||lastJeux||'BOLET'; lastJeux=jeux; lignesData.push({id,jeux,boul:'',miz:''});
 const div=document.createElement('div'); div.className='ligne'; div.id='row_'+id;
 div.innerHTML=`<div class="jeuxBtn" id="jbtn_${id}" onclick="cycleJeux('${id}')">${jeux} ▼</div>
 <input class="boul" id="b_${id}" inputmode="numeric" placeholder="Boul" oninput="updateBoul('${id}',this.value)" onkeydown="handleEnter(event)">
 <input class="miz" id="m_${id}" type="number" inputmode="numeric" placeholder="$" oninput="updateMiz('${id}',this.value)" onkeydown="handleEnter(event)">
 <button class="del" onclick="delLigne('${id}')">X</button>`;
 document.getElementById('lignes').appendChild(div); setTimeout(()=>document.getElementById('b_'+id).focus(),80);
}
function cycleJeux(rowId){ const o=lignesData.find(x=>x.id==rowId); if(!o)return; let idx=JEUX_LIST.indexOf(o.jeux); idx=(idx+1)%JEUX_LIST.length; o.jeux=JEUX_LIST[idx]; lastJeux=JEUX_LIST[idx]; document.getElementById('jbtn_'+rowId).innerText=JEUX_LIST[idx]+' ▼';}
function updateBoul(id,v){ const o=lignesData.find(x=>x.id==id); if(o)o.boul=v.replace(/[^0-9xX-]/g,''); calcTotal();}
function updateMiz(id,v){ const o=lignesData.find(x=>x.id==id); if(o)o.miz=v; calcTotal();}
function handleEnter(e){ if(e.key==='Enter'){e.preventDefault(); addLigne(lastJeux);} }
function delLigne(id){ const el=document.getElementById('row_'+id); if(el)el.remove(); lignesData=lignesData.filter(o=>o.id!=id); calcTotal();}
function calcTotal(){let sum=0; lignesData.forEach(l=>{if(l.miz)sum+=parseFloat(l.miz)||0}); const nb=tiragesSel.size; document.getElementById('totalBox').innerText=`Total: $${sum} x ${nb} tiraj = $${sum*nb}`; return sum*nb;}
function printTicketOnly(text){ const win=window.open('', '_blank','width=400,height=700'); win.document.write(`<html><head><title>Rapport</title><style>@page{size:58mm auto;margin:2mm}body{width:58mm;margin:0;padding:3mm;font-family:Courier,monospace;font-size:11px;text-align:center;white-space:pre-line;line-height:1.4}</style></head><body>${text}<script>window.onload=function(){window.print(); setTimeout(()=>window.close(),600);}<\/script></body></html>`); win.document.close();}
async function login(){const nom=document.getElementById('nom').value.trim(), pass=document.getElementById('pass').value.trim(); const msg=document.getElementById('msg'); if(!nom||!pass){msg.innerText="Ranpli";return;} msg.innerText="Ap verifye..."; try{const s=await db.collection('vendeurs').where('nom','==',nom).where('modpas','==',pass).get(); if(s.empty){msg.innerText="Pa kòrèk";return;} current={id:s.docs[0].id,...s.docs[0].data()}; document.getElementById('loginDiv').style.display='none'; document.getElementById('appDiv').style.display='flex'; document.getElementById('vNameHdr').innerText=nom; document.getElementById('dateJour').innerText=new Date().toLocaleDateString(); const today=new Date().toISOString().slice(0,10); document.getElementById('du').value=today; document.getElementById('au').value=today; addLigne('BOLET'); await fetchAll(); loadFiches();}catch(e){msg.innerText=e.message}}
async function fetchAll(){ if(!current)return; const snap=await db.collection('ventes').where('vendeurId','==',current.id).limit(600).get(); allVentes=[]; snap.forEach(d=>allVentes.push({docId:d.id,...d.data()})); allVentes.sort((a,b)=>(b.created?.seconds||0)-(a.created?.seconds||0));
 try{ const rSnap=await db.collection('resultats').limit(400).get(); allResultats=[]; rSnap.forEach(d=>allResultats.push({id:d.id,...d.data()})); }catch(e){ allResultats=[]; }
}
function buildFicheTxt(v){ const tStr=(v.tirages||[]).join('/'); const idT=(v.idTicket||v.docId||'').toString().slice(-6).toUpperCase(); return ` C&D VÉRITÉ LOTTO\n Date ${new Date().toLocaleString()} Tirage ${tStr}\n Id ticket ${idT} Vandè ${v.vendeur||current.nom}\n------------------------------\n${(v.lignes||[]).map(l=>` ${l.jeux.padEnd(6)} ${String(l.boul).padEnd(10)} $${l.miz}`).join('\n')}\n------------------------------\n Total: $${v.total}\n------------------------------\n Mèsi, bòn chans!`; }
async function validerEtImprimer(){if(tiragesSel.size==0){alert("Chwazi tiraj");return;} const lignes=lignesData.filter(l=>l.boul&&l.miz); if(!lignes.length){alert("Antre boul+miz");return;} const total=calcTotal(); const data={vendeur:current.nom,vendeurId:current.id,tirages:Array.from(tiragesSel),lignes:lignes.map(l=>({jeux:l.jeux,boul:l.boul,miz:l.miz})),total,dateStr:new Date().toISOString().slice(0,10),created:firebase.firestore.FieldValue.serverTimestamp(),idTicket:'CD-'+Date.now().toString().slice(-6)}; try{const ref=await db.collection('ventes').add(data); const txt=buildFicheTxt({...data,docId:ref.id}); printTicketOnly(txt); lignesData=[]; document.getElementById('lignes').innerHTML=""; addLigne(lastJeux); calcTotal(); await fetchAll(); loadFiches();}catch(e){alert(e.message)}}
function loadCopy(){ renderCopy(allVentes); }
function filtrerCopy(){ const q=document.getElementById('searchTicket').value.toLowerCase().trim(); if(!q){renderCopy(allVentes);return;} const f=allVentes.filter(v=>(v.idTicket||'').toLowerCase().includes(q)||(v.docId||'').toLowerCase().includes(q)||(v.lignes||[]).some(l=>String(l.boul).includes(q))); renderCopy(f); }
function renderCopy(list){ const el=document.getElementById('copyList'); if(!list.length){el.innerHTML="<p class='small'>Pa gen fich</p>";return;} el.innerHTML=list.slice(0,80).map(v=>`<div class="list" onclick="copyTicket('${v.docId}')"><b>🎫 ${v.idTicket||v.docId.slice(-6)} - $${v.total} - ${v.tirages?.join('/')}</b><br>${(v.lignes||[]).map(l=>l.jeux+' '+l.boul+' $'+l.miz).join(' | ')}<br><span style="color:green;font-weight:bold">▶ Klike pou KOPYE</span></div>`).join('');}
function copyTicket(docId){ const v=allVentes.find(x=>x.docId===docId); if(!v)return; tiragesSel=new Set(v.tirages); document.querySelectorAll('.tir').forEach(t=>t.classList.toggle('sel',tiragesSel.has(t.innerText.trim()))); lignesData=[]; document.getElementById('lignes').innerHTML=""; v.lignes.forEach(l=>{ const id=Date.now()+Math.random(); lignesData.push({id,jeux:l.jeux,boul:l.boul,miz:l.miz}); const div=document.createElement('div'); div.className='ligne'; div.id='row_'+id; div.innerHTML=`<div class="jeuxBtn" id="jbtn_${id}" onclick="cycleJeux('${id}')">${l.jeux} ▼</div><input class="boul" id="b_${id}" value="${l.boul}" inputmode="numeric" oninput="updateBoul('${id}',this.value)"><input class="miz" id="m_${id}" value="${l.miz}" type="number" inputmode="numeric" oninput="updateMiz('${id}',this.value)"><button class="del" onclick="delLigne('${id}')">X</button>`; document.getElementById('lignes').appendChild(div); }); calcTotal(); openTab(0); }
async function loadFiches(){ const today=new Date().toISOString().slice(0,10); const list=allVentes.filter(v=>v.dateStr===today); const el=document.getElementById('fichesList'); if(!list.length){el.innerHTML="<p class='small'>Pa gen fich jodi a</p>";return;} el.innerHTML=list.map(v=>`<div class="list" onclick="reprint('${v.docId}')"><b>🎫 ${v.idTicket||v.docId.slice(-6)} - ${v.tirages?.join(',')} - $${v.total}</b><br>${(v.lignes||[]).map(l=>l.boul).join(', ')}<br><span style="color:blue">🖨️ Re-imprime</span></div>`).join('');}
async function reprint(docId){ const v=allVentes.find(x=>x.docId===docId); if(!v)return; printTicketOnly(buildFicheTxt(v)); }

// MARYAJ 12x34 = 34x12 - LÒD OU DEZÒD
function isMaryajWin(boulJoueur, resultat){
 // boulJoueur ka "12x34" oswa "1234" oswa "12-34"
 let p1,p2;
 const cleaned = String(boulJoueur).replace(/\s/g,'');
 if(cleaned.includes('x')||cleaned.includes('X')||cleaned.includes('-')){
   const parts = cleaned.split(/[^0-9]+/).filter(Boolean);
   if(parts.length>=2){ p1=parts[0].slice(-2); p2=parts[1].slice(-2); }
 } else if(cleaned.length>=4){
   p1=cleaned.slice(0,2); p2=cleaned.slice(2,4);
 } else return false;
 if(!p1||!p2) return false;
 // Rezilta gagnants - premier, deuxieme, troisieme
 const r = resultat;
 const pool = [String(r.premier||'').slice(-2), String(r.deuxieme||'').slice(-2), String(r.troisieme||'').slice(-2)].filter(Boolean);
 // Si maryaj egziste dirèk nan dokiman rezilta
 if(r.maryaj && Array.isArray(r.maryaj)){
   const mPool = r.maryaj.map(x=>String(x).slice(-2));
   return (mPool.includes(p1)&&mPool.includes(p2)) && p1!==p2 || (p1===p2 && mPool.filter(x=>x===p1).length>=1);
 }
 // Lòd oswa dezòd: 12x34 = 34x12 -> tou 2 genyen si 12 ak 34 nan 3 lo yo
 return (pool.includes(p1) && pool.includes(p2));
}

function calculGain(ligne, res){
 if(!res) return 0;
 const miz = parseFloat(ligne.miz)||0;
 const boul = String(ligne.boul).trim();
 if(!miz) return 0;
 const premier = String(res.premier||res.loto3||res.bolet_1er||'').replace(/[^0-9]/g,'');
 const deuxieme = String(res.deuxieme||res.bolet_2e||'').replace(/[^0-9]/g,'');
 const troisieme = String(res.troisieme||res.bolet_3e||'').replace(/[^0-9]/g,'');

 if(ligne.jeux==='BOLET'){
   const b = boul.replace(/[^0-9]/g,'').slice(-2);
   if(premier && b===premier.slice(-2)) return miz * PRIX.BOLET_1ER;
   if(deuxieme && b===deuxieme.slice(-2)) return miz * PRIX.BOLET_2E;
   if(troisieme && b===troisieme.slice(-2)) return miz * PRIX.BOLET_3E;
   if(res.bolet && b===String(res.bolet).slice(-2)) return miz * PRIX.BOLET_1ER;
 }
 if(ligne.jeux==='LOTO3'){
   const r = String(res.loto3||premier||'').replace(/[^0-9]/g,'');
   if(r && boul.replace(/[^0-9]/g,'')===r) return miz * PRIX.LOTO3;
 }
 if(ligne.jeux==='LOTO4'){
   const r = String(res.loto4||'').replace(/[^0-9]/g,'');
   if(r && boul.replace(/[^0-9]/g,'')===r) return miz * PRIX.LOTO4;
 }
 if(ligne.jeux==='LOTO5'){
   const r = String(res.loto5||'').replace(/[^0-9]/g,'');
   if(r && boul.replace(/[^0-9]/g,'')===r) return miz * PRIX.LOTO5;
 }
 if(ligne.jeux==='MARYAJ'){
   if(isMaryajWin(boul, res)) return miz * PRIX.MARYAJ;
 }
 return 0;
}

async function genRapport(){
 const du=document.getElementById('du').value, au=document.getElementById('au').value, tirFiltre=document.getElementById('rapTirage').value;
 if(!du||!au){alert("Chwazi Du ak Au");return;}
 await fetchAll();

 // Agregasyon pou chak tiraj
 let perTiraj = {}; // { "GA MIDI": {vente, aPayer, fich} }
 let totalVente=0, totalAPayer=0, totalFich=0;
 let details=[];

 allVentes.forEach(v=>{
   if(v.dateStr>=du && v.dateStr<=au){
     const nbTiraj = (v.tirages||[]).length||1;
     const venteParTiraj = (Number(v.total)||0) / nbTiraj; // Si fich gen 2 tiraj, vente separe pou chak tiraj
     (v.tirages||[]).forEach(t=>{
       if(tirFiltre!=='TOUS' && t!==tirFiltre) return;
       if(!perTiraj[t]) perTiraj[t]={vente:0, aPayer:0, fich:0, gains:[]};
       perTiraj[t].vente += venteParTiraj;
       perTiraj[t].fich += 1/nbTiraj; // konte fich pwopòsyonèl
       totalVente += (tirFiltre==='TOUS'? venteParTiraj : (tirFiltre===t? venteParTiraj:0));

       const res = allResultats.find(r=> r.dateStr===v.dateStr && r.tirage===t);
       if(res){
         (v.lignes||[]).forEach(l=>{
           const gain = calculGain(l, res);
           if(gain>0){
             perTiraj[t].aPayer += gain;
             perTiraj[t].gains.push(`${v.idTicket||v.docId.slice(-6)} ${l.jeux} ${l.boul} $${l.miz} => $${gain}`);
             details.push(`${t} ${v.idTicket||v.docId.slice(-6)} ${l.jeux} ${l.boul} -> $${gain}`);
           }
         });
       }
     });
     totalFich++;
   }
 });

 // Total A payer
 Object.values(perTiraj).forEach(o=> totalAPayer+=o.aPayer);

 let txt=` C&D VÉRITÉ LOTTO
 RAPPORT DETAYE / TIRAJ
 Du ${du} Au ${au}
 Tirage (${tirFiltre})
 Vandè ${current.nom}

`;

 // Detay pou chak tiraj si fich gen plizyè tiraj
 for(const [tiraj, data] of Object.entries(perTiraj)){
   const com = data.vente*0.10;
   const bal = data.vente - com - data.aPayer;
   txt+=`${tiraj}\n Vente $${data.vente.toFixed(2)}\n A payer $${data.aPayer.toFixed(2)}\n Balance $${bal.toFixed(2)} (${data.fich.toFixed(0)} fich)\n`;
   if(data.gains.length){ txt+=` Gagnants ${tiraj}:\n ${data.gains.join('\n ')}\n`; }
   txt+=`------------------------------\n`;
 }

 const totalCom = totalVente*0.10;
 const totalBal = totalVente - totalCom - totalAPayer;

 txt+=`TOTAL ${tirFiltre}\n Vente $${totalVente.toFixed(2)}\n Commission $${totalCom.toFixed(2)}\n A payer $${totalAPayer.toFixed(2)}${allResultats.length?'':' (0-pa gen rezilta)'}\n Balance net $${totalBal.toFixed(2)}\n Nbre fich ${totalFich}\n------------------------------\n Prix: 1er ${PRIX.BOLET_1ER}/2e ${PRIX.BOLET_2E}/3e ${PRIX.BOLET_3E}/Maryaj ${PRIX.MARYAJ}/L3 ${PRIX.LOTO3}/L4 ${PRIX.LOTO4}/L5 ${PRIX.LOTO5}\n Maryaj: 12x34=34x12 = $${PRIX.MARYAJ}\n`;

 document.getElementById('rapportRes').innerHTML=`<div class="rapBox">${txt}</div>`;
 document.getElementById('rapportRes').dataset.txt=txt;
 document.getElementById('btnPrintRap').style.display='block';
}
function printRapport(){ const txt=document.getElementById('rapportRes').dataset.txt; if(!txt){alert("Jenere rapò anvan");return;} printTicketOnly(txt); }
</script>
</body>
</html>
