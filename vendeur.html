<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C&D V97 FIX</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:bold}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:14px;border:2px solid #000;border-radius:10px;width:100%;font-size:18px;margin:6px 0}.line{display:grid;grid-template-columns:85px 1fr 75px;gap:6px;margin:6px 0}.tiraj{padding:9px 14px;margin:4px;border:2px solid #000;border-radius:25px;font-weight:bold;display:inline-block;cursor:pointer}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{background:#eee;color:#aaa;border-color:#ccc;pointer-events:none;opacity:.6;position:relative}.tiraj.ferme::after{content:" FÈMEN";color:red;font-size:9px;font-weight:bold}.btn{padding:15px;width:100%;border:none;border-radius:10px;font-weight:bold;font-size:18px;margin:6px 0}.bK{background:#000;color:#FFD700}.ticket{border:2px dashed #000;padding:14px;text-align:center;font-size:18px;max-width:360px;margin:auto}@media print{body *{visibility:hidden}#prt,#prt *{visibility:visible}#prt{position:absolute;left:0;top:0;width:100%}}</style>
</head><body>
<div class="h">C&D VÉRITÉ LOTTO - V97 FIX</div>
<div id="loginBox" class="card" style="text-align:center;padding-top:30px"><h2>Connexion Vendeur</h2>
<input id="uName" value="Tamouche"><input id="uPass" type="password" value="1234"><button class="btn bK" onclick="go()">Antre</button><p id="msg" style="color:red"></p></div>
<div id="appBox" style="display:none">
<div style="display:flex;background:#000"><button class="btn bK" style="flex:1;margin:2px;background:#FFD700;color:#000" onclick="showTab('vendre')">Vendre</button><button class="btn bK" style="flex:1;margin:2px" onclick="showTab('fichesTab')">Fiches</button><button class="btn bK" style="flex:1;margin:2px" onclick="showTab('rapportTab')">Rapport</button></div>

<div id="vendre" class="card"><div style="text-align:center;font-weight:bold">TIRAJ MULTIP - Chwazi</div><div id="tirajBox" style="text-align:center;padding:6px">Chaje...</div>
<div style="display:flex;background:#000;color:#FFD700;padding:7px;font-weight:bold;border-radius:6px"><div style="width:85px">JEUX</div><div style="flex:1">BOUL</div><div style="width:75px">MIZ</div></div><div id="lines"></div>
<div style="background:#000;color:#fff;padding:10px;border-radius:10px;text-align:center;margin-top:8px">Total <span id="tot">0$</span> × <span id="nbT">1</span><h2 style="color:#FFD700;margin:3px">A PEYE <span id="paye">0$</span></h2></div><button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button><div id="prt" style="display:none"></div></div>

<div id="fichesTab" class="card" style="display:none"><h3>Mes Fiches - <span id="mn"></span></h3><div id="listF">Pa gen fich</div><button class="btn bK" onclick="showTab('vendre')">Retounen</button></div>
<div id="rapportTab" class="card" style="display:none"><h3>Rapport</h3>Du <input id="du" type="date"> Au <input id="au" type="date"><select id="fT"><option value="tous">Tous</option><option>GA midi</option><option>GA soir</option><option>FL midi</option><option>FL soir</option><option>NY midi</option><option>NY soir</option></select><button class="btn bK" onclick="genRap()">Générer</button><div id="rap" style="margin-top:10px"></div><button class="btn bK" onclick="showTab('vendre')">Retounen</button></div>
</div>
<script>
const firebaseConfig={databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com"}; firebase.initializeApp(firebaseConfig); const db=firebase.database();
let curV='',selT=[],lineId=0,cfg={},fichesData=JSON.parse(localStorage.getItem('fiches')||'[]');

function go(){const n=document.getElementById('uName').value.trim(); if(!n)return; curV=n; localStorage.setItem('curV',n);
 document.getElementById('loginBox').style.display='none'; document.getElementById('appBox').style.display='block'; document.getElementById('mn').innerText=n;
 db.ref('config').on('value',snap=>{cfg=snap.val()||{}; renderTiraj();}); addLine(true);
}
function isFerme(heureStr){
 if(!heureStr) return false;
 try{const now=new Date(); const parts=heureStr.split(':'); const hh=parseInt(parts[0]); const mm=parseInt(parts[1])||0; if(isNaN(hh))return false; const f=new Date(); f.setHours(hh,mm,0,0); return now>=f;}catch(e){return false}
}
function renderTiraj(){
 const box=document.getElementById('tirajBox'); if(!box) return; box.innerHTML='';
 const map={'GA midi':'gaMidi','GA soir':'gaSoir','FL midi':'flMidi','FL soir':'flSoir','NY midi':'nyMidi','NY soir':'nySoir'};
 const heures=cfg.heures||{}; const etat=cfg.tirages||cfg.etat||{};
 ['GA midi','GA soir','FL midi','FL soir','NY midi','NY soir'].forEach(t=>{
   const key=map[t]; const h=heures[key]||''; let ferme=false;
   if(etat[key]==='FERME' || etat[t]==='FERME') ferme=true;
   if(!ferme && h) ferme=isFerme(h);
   const cls=ferme?'tiraj ferme':'tiraj'; const extra=ferme?'':' '+(h?'<small>('+h+')</small>':'');
   box.innerHTML+=`<span class="${cls}" data-t="${t}" onclick="toggleT(this,'${t}')">${t}${ferme?'':extra}</span>`;
 });
}
function toggleT(el,t){
 if(el.classList.contains('ferme')){ alert(t+' FÈMEN - ou pa ka vann li'); return;}
 el.classList.toggle('active');
 if(selT.includes(t)) selT=selT.filter(x=>x!==t); else selT.push(t);
 document.getElementById('nbT').innerText=selT.length||1; upd();
}
function showTab(id){
 document.getElementById('vendre').style.display=id==='vendre'?'block':'none';
 document.getElementById('fichesTab').style.display=id==='fichesTab'?'block':'none';
 document.getElementById('rapportTab').style.display=id==='rapportTab'?'block':'none';
 if(id==='fichesTab') loadF();
}
function addLine(first){lineId++; const d=document.createElement('div'); d.className='line'; d.innerHTML=`<select id="j${lineId}"><option>Borlette</option><option>Mariage</option><option>Loto3</option></select><input id="b${lineId}" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Boul" onkeydown="kB(event,${lineId})"><input id="m${lineId}" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Miz" onkeydown="kM(event,${lineId})" oninput="upd()">`; document.getElementById('lines').appendChild(d); if(!first)setTimeout(()=>document.getElementById('b'+lineId).focus(),50);}
function kB(e,id){if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault(); document.getElementById('m'+id).focus();}}
function kM(e,id){if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault(); addLine();}}
function upd(){let t=0; for(let i=1;i<=lineId;i++){const m=document.getElementById('m'+i); if(m)t+=parseInt(m.value)||0;} document.getElementById('tot').innerText=t+'$'; document.getElementById('paye').innerText=(t*(selT.length||1))+'$';}
function vann(){if(selT.length===0)return alert('Chwazi tiraj ki OUVE'); let corps='',has=false; for(let i=1;i<=lineId;i++){const b=document.getElementById('b'+i),m=document.getElementById('m'+i),j=document.getElementById('j'+i); if(b&&b.value&&m&&m.value){corps+=`${j.value.slice(0,3)} ${b.value} - ${m.value}$<br>`; has=true;}} if(!has)return alert('Mete boul'); const id=Date.now(),now=new Date(); const ticket=`<div class="ticket"><b>C&D VÉRITÉ LOTTO</b><br>${now.toLocaleString()}<br>Tirage: ${selT.join(', ')}<br>ID: ${id}<br>Vandè: ${curV}<br>.........................<br>${corps}.........................<br>${document.getElementById('tot').innerText} × ${selT.length} = <b>${document.getElementById('paye').innerText}</b><br><br>Mèsi</div>`; document.getElementById('prt').innerHTML=ticket; document.getElementById('prt').style.display='block'; const f={id,vendor:curV,tiraj:selT.join(','),total:parseInt(document.getElementById('tot').innerText)||0,nb:selT.length,ticket,time:Date.now()}; fichesData.push(f); localStorage.setItem('fiches',JSON.stringify(fichesData)); db.ref('fiches/'+id).set({id,vendor:curV,tiraj:selT.join(','),total:f.total,nbTiraj:selT.length,date:Date.now()}); window.print(); document.getElementById('lines').innerHTML=''; lineId=0; addLine(true); upd();}
function loadF(){const c=document.getElementById('listF'); const list=fichesData.filter(f=>f.vendor===curV).reverse(); if(list.length===0){c.innerHTML='Pa gen fich'; return;} c.innerHTML=''; list.forEach(f=>{c.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #ccc"><span>${new Date(f.time).toLocaleString()}<br>${f.tiraj} - ${f.total*f.nb}$</span><button class="btn bK" style="width:auto;padding:6px 10px" onclick="reprint(${f.id})">Kopye</button></div>`;});}
function reprint(id){const f=fichesData.find(x=>x.id===id); if(f){document.getElementById('prt').innerHTML=f.ticket; document.getElementById('prt').style.display='block'; window.print();}}
function genRap(){let v=0; fichesData.filter(f=>f.vendor===curV).forEach(f=>v+=f.total*f.nb); document.getElementById('rap').innerHTML=`<div style="text-align:center;font-weight:bold;border:2px solid #000;padding:10px">Vente: ${v}$<br>Commission (15%): ${Math.round(v*0.15)}$<br>Net: ${Math.round(v*0.85)}$</div>`;}
</script></body></html>
