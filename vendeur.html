<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V115.7 FINAL KORIJE - COMPLET</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:8px;text-align:center;font-weight:900;font-size:9px}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:12px;border:2px solid #000;border-radius:10px;width:100%;font-size:15px;margin:4px 0}.tiraj{padding:5px 9px;margin:2px;border:2px solid #000;border-radius:20px;font-weight:900;display:inline-block;font-size:10px;cursor:pointer}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{opacity:.2;pointer-events:none;background:#ccc}.btn{padding:13px;width:100%;border:none;border-radius:10px;font-weight:900;margin:5px 0}.bK{background:#000;color:#FFD700}.bV{background:#16a34a;color:#fff}.tab2{display:flex;background:#000;gap:1px;position:sticky;top:0;z-index:20}.tab2 button{flex:1;padding:10px 1px;font-size:9px;font-weight:900;background:#000;color:#FFD700;border:none}.tab2 button.active{background:#FFD700;color:#000}.limit-bad{background:#fee2e2;border:2px solid #ef4444;padding:7px;border-radius:7px;color:#b91c1c;font-weight:900;font-size:11px;margin:3px 0;text-align:center}#fermeOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);color:#fff;z-index:9999;display:none;justify-content:center;align-items:center;text-align:center;padding:20px}</style>
</head><body>
<div id="fermeOverlay"><div><div style="font-size:70px">🔒</div><div style="font-size:30px;font-weight:900;color:#ef4444">BANK FERME</div><div style="margin-top:8px">Vandè: <span id="fermeNom"></span><br>Proprio fèmen w</div></div></div>
<div class="h">V115.7 FINAL - COPIER + RAPPORT TIRAJ KORIJE + BACK TO VENDRE</div>
<div id="loginBox" class="card" style="text-align:center;padding-top:30px"><h3>Connexion</h3><input id="uName" placeholder="Code"><input id="uPass" type="password" placeholder="Modpas"><button class="btn bK" onclick="go()">Antre</button><div id="loginErr" style="color:red;font-weight:900"></div></div>
<div id="appBox" style="display:none">
<div class="tab2"><button id="tV" class="active" onclick="showTab('vendre')">1.Vendre</button><button id="tC" onclick="showTab('kopyeTab')">2.Copier</button><button id="tF" onclick="showTab('fichesTab')">3.Fiches</button><button id="tR" onclick="showTab('rapportTab')">4.Rapport</button></div>

<div id="vendre" class="card"><div style="text-align:center;font-weight:900;font-size:9px">TIRAJ - <span id="dateToday" style="background:#FFD700;padding:2px 5px;border-radius:5px"></span> - <span id="userShow" style="background:#000;color:#FFD700;padding:2px 5px;border-radius:5px"></span> <span id="comShow" style="background:#16a34a;color:#fff;padding:2px 5px;border-radius:5px"></span></div><div id="limitMsg"></div><div id="tirajBox" style="text-align:center;margin:5px 0"></div><div style="display:flex;background:#000;color:#FFD700;padding:6px;font-weight:900;border-radius:6px;font-size:10px"><div style="width:85px">JEUX</div><div style="flex:1">BOUL</div><div style="width:75px">MIZ</div></div><div id="lines"></div><div style="background:#000;color:#fff;padding:10px;border-radius:8px;text-align:center;margin-top:6px">Total <span id="tot">0$</span> × <span id="nbT">1</span><div style="font-size:24px;color:#FFD700">A PEYE <span id="paye">0$</span></div></div><button class="btn bK" id="btnVendre" onclick="vann()">VENDRE & IMPRIMER</button><div id="lastTicket"></div></div>

<div id="kopyeTab" class="card" style="display:none"><h3>2.Copier - Chèche pa ID (5 lèt sou tikè a)</h3><div style="display:grid;grid-template-columns:1fr 90px;gap:6px"><input id="searchId" placeholder="Ex: A1B2C" style="text-transform:uppercase"><button class="btn bK" onclick="searchById()" style="margin:0">🔍 Chèche</button></div><div id="kopyeResult" style="margin-top:10px"></div><button class="btn bV" onclick="showTab('vendre')">↩️ RETOUNEN NAN VENDRE</button></div>

<div id="fichesTab" class="card" style="display:none"><h3>3.Fiches</h3><div id="fichesList"></div><button class="btn bV" onclick="showTab('vendre')">↩️ RETOUNEN NAN VENDRE</button></div>

<div id="rapportTab" class="card" style="display:none"><h3>4.Rapport</h3><div style="display:flex;gap:6px"><div style="flex:1"><label>Du</label><input type="date" id="du"></div><div style="flex:1"><label>Au</label><input type="date" id="au"></div></div><div style="margin:6px 0"><label>Tiraj</label><select id="rapportTiraj"><option value="tous">Tous Tiraj</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select></div><button class="btn bK" onclick="genererRapport()">Générer Rapport</button><div id="rapportContent" style="background:#fff;border:2px solid #000;border-radius:10px;padding:10px;margin-top:8px"><div>Vente: <b id="rVente">0$</b></div><div>Commission: <b id="rCom">0$</b></div><div>A Payer: <b id="rPaye">0$</b></div><div>Balance Net: <b id="rNet">0$</b></div></div><div id="rapportDetail"></div><button class="btn bK" onclick="window.print()">🖨️ Imprimer Rapport</button><button class="btn bV" onclick="showTab('vendre')">↩️ RETOUNEN NAN VENDRE</button></div>

</div>
<script>
const firebaseConfig={databaseURL:"https://verite-lotto-default-rtdb.firebaseio.com"};firebase.initializeApp(firebaseConfig);const db=firebase.database();
const TIRAJ_CONFIG=[{name:"GA MIDI",close:"12:15"},{name:"FL MIDI",close:"12:30"},{name:"NY MIDI",close:"13:15"},{name:"GA SOIR",close:"18:30"},{name:"FL SOIR",close:"21:30"},{name:"NY SOIR",close:"21:15"}];
const JEUX_LIST=["Borlettes","Mariage","Loto3","Loto4","Loto5"];
let selectedTiraj=[],USER="",USER_DATA=null;
function go(){let u=document.getElementById('uName').value.trim().toUpperCase();if(!u){document.getElementById('loginErr').innerText="Mete kòd";return;}USER=u;document.getElementById('loginBox').style.display='none';document.getElementById('appBox').style.display='block';document.getElementById('dateToday').innerText=new Date().toLocaleDateString();document.getElementById('userShow').innerText=USER;document.getElementById('fermeNom').innerText=USER;initApp();checkBank();history.pushState(null,null,location.href);let t=new Date().toISOString().split('T')[0];document.getElementById('du').value=t;document.getElementById('au').value=t;}
function checkBank(){db.ref('config/bankOpen').on('value',s=>{document.getElementById('fermeOverlay').style.display=s.val()===false?'flex':'none';});}
function initApp(){
let tb=document.getElementById('tirajBox');tb.innerHTML="";let now=new Date();let cur=now.getHours()*60+now.getMinutes();
TIRAJ_CONFIG.forEach(t=>{let el=document.createElement('span');el.className='tiraj';el.innerText=t.name;let[h,m]=t.close.split(':').map(Number);if(cur>h*60+m){el.classList.add('ferme');}else{el.onclick=()=>{el.classList.toggle('active');updateTiraj();};}tb.appendChild(el);});
let ld=document.getElementById('lines');ld.innerHTML="";for(let i=0;i<6;i++){let d=document.createElement('div');d.style.display='flex';d.style.gap='4px';d.style.margin='4px 0';let opts=JEUX_LIST.map(j=>`<option>${j}</option>`).join('');d.innerHTML=`<select id="j${i}" style="width:85px">${opts}</select><input id="b${i}" placeholder="Boul" onkeydown="nextLine(event,${i})" oninput="calc()" style="flex:1"><input id="m${i}" type="number" placeholder="Miz" style="width:75px" oninput="calc()" onkeydown="nextLine(event,${i})">`;ld.appendChild(d);}calc();}
function nextLine(e,i){if(e.key==="Enter"||e.key==="ArrowDown"){let n=i+1;if(n<6)document.getElementById('b'+n).focus();}if(e.key==="ArrowUp"&&i>0)document.getElementById('b'+(i-1)).focus();}
function updateTiraj(){selectedTiraj=[];document.querySelectorAll('.tiraj.active').forEach(x=>selectedTiraj.push(x.innerText));document.getElementById('nbT').innerText=selectedTiraj.length||1;calc();}
function calc(){let tot=0;for(let i=0;i<6;i++)tot+=parseFloat(document.getElementById('m'+i)?.value)||0;document.getElementById('tot').innerText=tot+"$";document.getElementById('paye').innerText=(tot*(selectedTiraj.length||1))+"$";}
function showTab(nom){['vendre','kopyeTab','fichesTab','rapportTab'].forEach(id=>document.getElementById(id).style.display=id===nom?'block':'none');document.getElementById('tV').className=nom=='vendre'?'active':'';document.getElementById('tC').className=nom=='kopyeTab'?'active':'';document.getElementById('tF').className=nom=='fichesTab'?'active':'';document.getElementById('tR').className=nom=='rapportTab'?'active':'';if(nom!=='vendre')history.pushState({tab:nom},'', '#'+nom);if(nom==='fichesTab')loadFiches();}
window.onpopstate=()=>{showTab('vendre');setTimeout(()=>history.pushState(null,null,location.href),10);};
function genId(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function clearForm(){for(let i=0;i<6;i++){document.getElementById('b'+i).value="";document.getElementById('m'+i).value="";}calc();}
function vann(){
if(selectedTiraj.length===0){alert("Chwazi tiraj! GA MIDI FL MIDI NY MIDI");return;}
let lignes=[],total=0;for(let i=0;i<6;i++){let j=document.getElementById('j'+i).value,b=document.getElementById('b'+i).value.trim(),m=parseFloat(document.getElementById('m'+i).value)||0;if(b&&m>0){lignes.push({jeux:j,boul:b,miz:m});total+=m;}}
if(!lignes.length){alert("Mete boul!");return;}
let id=genId();let now=new Date();let fiche={id:id,vendeur:USER,date:now.toISOString().split('T')[0],heure:now.toLocaleTimeString(),total:total,tirajs:selectedTiraj,nbTiraj:selectedTiraj.length,aPeye:total*selectedTiraj.length,lignes:lignes,timestamp:Date.now()};
db.ref('fiches/'+id).set(fiche);db.ref('fiches_vendeur/'+USER+'/'+id).set(fiche);
let html=`<div style="border:2px dashed #000;padding:10px;margin-top:10px;text-align:center;font-size:12px"><b>VERITE LOTTO - ${USER}</b><br>ID: <b style="font-size:16px">${id}</b><br>${fiche.date} ${fiche.heure}<br>${selectedTiraj.join(' | ')}<hr>`;lignes.forEach(l=>html+=`<div style="display:flex;justify-content:space-between"><span>${l.jeux} ${l.boul}</span><span>${l.miz}$</span></div>`);html+=`<hr><b>A PEYE: ${fiche.aPeye}$</b></div>`;
document.getElementById('lastTicket').innerHTML=html+`<button class="btn bV" onclick="showTab('vendre');clearForm()">↩️ RETOUNEN NAN VENDRE</button><button class="btn bK" onclick="window.print()">🖨️ RE-IMPRIMER</button>`;
window.print();setTimeout(()=>{showTab('vendre');clearForm();},900);
}
function searchById(){let id=document.getElementById('searchId').value.trim().toUpperCase();if(!id)return;db.ref('fiches/'+id).once('value').then(s=>{if(!s.exists()){document.getElementById('kopyeResult').innerHTML="<div class='limit-bad'>Fich pa jwenn</div>";return;}let f=s.val();let html=`<div style="border:2px solid #000;padding:10px;border-radius:8px"><b>ID: ${f.id}</b><br>${f.date} ${f.heure}<br>Tiraj: ${f.tirajs.join(', ')}<br>`;f.lignes.forEach(l=>html+=`${l.jeux} ${l.boul} - ${l.miz}$<br>`);html+=`<b>Total: ${f.aPeye}$</b><br><button class="btn bK" onclick="copierFiche('${f.id}')">Copier vers VENDRE</button></div>`;document.getElementById('kopyeResult').innerHTML=html;});}
function copierFiche(id){db.ref('fiches/'+id).once('value').then(s=>{let f=s.val();if(!f)return;showTab('vendre');document.querySelectorAll('.tiraj').forEach(el=>{el.classList.toggle('active',f.tirajs.includes(el.innerText));});updateTiraj();for(let i=0;i<6;i++){document.getElementById('b'+i).value="";document.getElementById('m'+i).value="";}f.lignes.forEach((l,idx)=>{if(idx<6){document.getElementById('j'+idx).value=l.jeux;document.getElementById('b'+idx).value=l.boul;document.getElementById('m'+idx).value=l.miz;}});calc();});}
function loadFiches(){db.ref('fiches_vendeur/'+USER).orderByChild('timestamp').limitToLast(30).on('value',snap=>{let html="";let arr=[];snap.forEach(c=>arr.push(c.val()));arr.reverse();arr.forEach(f=>{html+=`<div style="border:1px solid #000;padding:8px;margin:5px 0;border-radius:8px;font-size:12px"><b>${f.id}</b> - ${f.heure} - ${f.tirajs.join(', ')}<br>${f.lignes.map(l=>l.jeux+' '+l.boul+':'+l.miz+'$').join(' | ')}<br><b>${f.aPeye}$</b></div>`;});document.getElementById('fichesList').innerHTML=html||"Pa gen fich";});}
function genererRapport(){
let du=document.getElementById('du').value,au=document.getElementById('au').value,filtre=document.getElementById('rapportTiraj').value;
db.ref('fiches_vendeur/'+USER).once('value').then(snap=>{
let venteGeneral=0,venteFiltre=0,peyeFiltre=0;
snap.forEach(child=>{
let f=child.val();if(!f.date)return;if(f.date<du||f.date>au)return;
let miz=f.total||0;let nb=f.tirajs?f.tirajs.length:1;
venteGeneral+=miz*nb;
if(filtre==="tous"){venteFiltre=venteGeneral;}
else if(f.tirajs&&f.tirajs.includes(filtre)){
venteFiltre+=miz; // KORIJE: SÈLMAN MIZ, PA x NB
if(f.gains&&f.gains[filtre])peyeFiltre+=f.gains[filtre];
}
});
if(filtre==="tous"){document.getElementById('rVente').innerText=venteGeneral+"$";document.getElementById('rCom').innerText=Math.round(venteGeneral*0.10)+"$";document.getElementById('rPaye').innerText=peyeFiltre+"$";document.getElementById('rNet').innerText=(venteGeneral-peyeFiltre)+"$";document.getElementById('rapportDetail').innerHTML="";}
else{document.getElementById('rVente').innerText=venteFiltre+"$";document.getElementById('rCom').innerText=Math.round(venteFiltre*0.10)+"$";document.getElementById('rPaye').innerText=peyeFiltre+"$";document.getElementById('rNet').innerText=(venteFiltre-peyeFiltre)+"$";document.getElementById('rapportDetail').innerHTML=`<div style="background:#FFD700;padding:6px;border-radius:6px;text-align:center;font-weight:900;margin-top:6px">${filtre}: ${venteFiltre}$ (kòrèk)</div>`;}
});
}
</script>
</body></html>
