<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V106 FLECH</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f1f5f9;padding:6px;padding-bottom:95px}
.hdr{background:#facc15;padding:10px 12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:12px}
.ouvert{background:#dcfce7;border:2px solid #22c55e;padding:8px;border-radius:10px;text-align:center;font-weight:800;margin:8px 0;font-size:11px}
.card{background:#fff;border-radius:14px;padding:12px;margin:6px 0;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.tirajGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tirajItem{background:#fef2f2;border:1.5px solid #fecaca;border-radius:10px;padding:10px 6px;display:flex;gap:6px;font-size:11px;align-items:center;justify-content:center;font-weight:600;cursor:pointer;text-align:center}
.tirajItem.on{background:#dcfce7;border-color:#22c55e}
.tirajItem.ferme{background:#f3f4f6!important;opacity:.4;pointer-events:none}
.row3{display:grid;grid-template-columns:0.8fr 1fr 0.7fr;gap:6px;margin-top:8px;align-items:center}
.row3 select{height:38px!important;padding:6px 4px!important;border:1.8px solid #000!important;border-radius:8px!important;font-size:13px!important;font-weight:800!important}
.kazPiti{height:38px!important;padding:6px 4px!important;border:1.8px solid #000!important;border-radius:8px!important;font-size:15px!important;font-weight:900!important;text-align:center!important}
.btnAdd{background:#22c55e;color:#fff;width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;font-size:15px;margin-top:8px}
.totalBox{background:#0f172a;color:#fff;padding:10px;border-radius:10px;margin:10px 0}
.totalFinal{display:flex;justify-content:space-between;font-weight:900;font-size:18px;border-top:1px solid #334155;padding-top:6px;margin-top:4px}
.btnValide{background:#facc15;color:#000;width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;font-size:15px}
.sec{display:none}.sec.active{display:block}
.tabs{position:fixed;bottom:0;left:0;width:100%;background:#0f172a;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:8px;z-index:9999}
.tabBtn{background:#1e293b;color:#94a3b8;padding:10px 2px;border-radius:10px;font-size:10px;font-weight:800;border:none}
.tabBtn.active{background:#facc15;color:#000}
#ticketSantee{display:none}
@media print{ @page{size:58mm auto;margin:0} body *{display:none!important} #ticketSantee{display:flex!important;position:fixed;top:0;left:50%;transform:translateX(-50%);width:58mm;background:#fff;color:#000;justify-content:center} #ticketContent{width:54mm;font-family:'Courier New',monospace;font-size:14px;line-height:1.3;font-weight:900;text-align:center;white-space:pre-line;padding:6px} }
</style></head><body>
<div class="hdr"><span>tamouche - V106 FLECH</span><span id="dateNow">--</span></div>
<div class="ouvert">✅ Ouvè - Lè Ayiti: <span id="heureAyiti">--:--</span> - <span id="etatOuv">--</span><br><span style="font-size:9px;color:#555">Flèch ↓ / Enter = avanse | ↑ = retounen</span></div>
<div id="secVANN" class="sec active">
<div id="bannerFerme" style="display:none;background:#ef4444;color:#fff;padding:10px;border-radius:10px;text-align:center;font-weight:900;margin:6px 0">🚫 FERMÉ</div>
<div class="card"><div style="font-weight:800;margin-bottom:6px;font-size:12px">Tiraj - <span id="msgFerme" style="color:#ef4444;font-size:10px"></span></div><div class="tirajGrid" id="tirajGrid"></div></div>
<div class="card" style="border:2px solid #000">
<div id="entetePreview" style="background:#f8fafc;padding:6px;border-radius:6px;font-size:10px;border:1px dashed #cbd5e1;margin-bottom:6px"></div>
<div class="row3">
<select id="tip" tabindex="1"><option value="bolet">Bolet</option><option value="mariage">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select>
<input id="boul" class="kazPiti" placeholder="BOUL" inputmode="numeric" pattern="[0-9]*" maxlength="5" tabindex="2">
<input id="montan" class="kazPiti" placeholder="G" inputmode="numeric" type="tel" pattern="[0-9]*" tabindex="3">
</div>
<button id="btnAdd" class="btnAdd" tabindex="4">+ AJOUTE (↓ / Enter)</button>
<div id="liste" style="margin-top:8px;font-size:12px"></div>
<div class="totalBox"><div style="display:flex;justify-content:space-between;font-size:11px"><span id="tDetail">0G x 0</span><span id="tBase">0G</span></div><div class="totalFinal"><span>Total</span><span id="tTotal">0G</span></div></div>
<button onclick="valideFich()" class="btnValide" tabindex="5">✅ Validé</button>
</div>
</div>
<div id="secKOPYE" class="sec"><div class="card"><b>📋 Kopye</b><div style="display:grid;grid-template-columns:1fr auto;gap:6px;margin:10px 0"><input id="searchId" placeholder="ID 5 chif" style="padding:10px;border-radius:8px;border:2px solid #000"><button onclick="chercheParId()" style="background:#0f172a;color:#facc15;padding:10px 14px;border-radius:8px;font-weight:900;border:none">CHÈCHE</button></div><div id="resultSearch"></div></div></div>
<div id="secRAPO" class="sec"><div class="card"><b>📊 Rapò</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0"><input id="rapDu" type="date" style="width:100%;padding:8px;border-radius:6px;border:2px solid #000"><input id="rapAu" type="date" style="width:100%;padding:8px;border-radius:6px;border:2px solid #000"></div><button onclick="genererRapport()" style="width:100%;padding:10px;background:#0f172a;color:#facc15;border:none;border-radius:8px;font-weight:900">Générer</button><div id="rapData" style="margin-top:10px;background:#f8fafc;padding:10px;border-radius:8px;font-size:12px"></div></div></div>
<div id="secFICHES" class="sec"><div class="card"><b>🎫 Fiches</b><div id="listFiches"></div></div></div>
<div class="tabs"><button onclick="showTab('VANN')" id="tabVANN" class="tabBtn active">VANN</button><button onclick="showTab('KOPYE')" id="tabKOPYE" class="tabBtn">KOPYE</button><button onclick="showTab('RAPO')" id="tabRAPO" class="tabBtn">RAPÒ</button><button onclick="showTab('FICHES')" id="tabFICHES" class="tabBtn">FICHES</button></div>
<div id="ticketSantee"><div id="ticketContent"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, child, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const cfg={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"}; const app=initializeApp(cfg); const db=getDatabase(app);
let vendeur="tamouche", panier=[], vandeFerme=false;
let TIRAJS=[{n:"FL MIDI",h:"13:15",m:795},{n:"FL SOIR",h:"21:20",m:1280},{n:"GA MIDI",h:"12:15",m:735},{n:"GA SOIR",h:"18:15",m:1095},{n:"NY MIDI",h:"14:15",m:855},{n:"NY SOIR",h:"21:30",m:1290}];
let configProprio={};
function getDateHaiti(d=new Date()){ let h=new Date(d.toLocaleString("en-US",{timeZone:"America/New_York"})); return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`; }
function getESTHM(){ let now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return now.getHours()*60+now.getMinutes(); }
function init(){
 let g=document.getElementById('tirajGrid'); g.innerHTML=""; TIRAJS.forEach(t=>{ g.innerHTML+=`<label class="tirajItem" id="box-${t.n.replace(/ /g,'')}"><input type="checkbox" value="${t.n}" class="chkT" onchange="updT('${t.n}')"> ${t.n}<br>(${t.h})</label>`; });
 let today=getDateHaiti(); document.getElementById('rapDu').value=today; document.getElementById('rapAu').value=today;
 setInterval(()=>{ let e=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); document.getElementById('heureAyiti').innerText=e.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); },1000);
 render(); loadAll(); setupFleches();
 onValue(ref(db,'config'),snap=>{ configProprio=snap.val()||{}; const he=configProprio.heures||{}; const map={flmidi:'flMidi',flsoir:'flSoir',gamidi:'gaMidi',gasoir:'gaSoir',nymidi:'nyMidi',nysoir:'nySoir'}; TIRAJS=TIRAJS.map(t=>{ const key=t.n.toLowerCase().replace(' ',''); const real=map[key]; if(he[real]){ const [hh,mm]=he[real].split(':').map(Number); t.h=he[real]; t.m=hh*60+mm; } return t; }); checkFermeture(); });
 setInterval(checkFermeture,15000);
}
function setupFleches(){
  const tip=document.getElementById('tip'), boul=document.getElementById('boul'), montan=document.getElementById('montan'), btn=document.getElementById('btnAdd');
  tip.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowRight'){ e.preventDefault(); boul.focus(); }});
  boul.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowRight'){ e.preventDefault(); montan.focus(); }
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ e.preventDefault(); tip.focus(); }
  });
  montan.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowRight'){ e.preventDefault(); btn.focus(); }
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ e.preventDefault(); boul.focus(); }
  });
  btn.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key==='ArrowDown'){ e.preventDefault(); addPanier(); setTimeout(()=>boul.focus(),100); }
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ e.preventDefault(); montan.focus(); }
  });
  // filtre chif selman
  boul.addEventListener('input',e=>{ e.target.value=e.target.value.replace(/[^0-9]/g,''); });
  montan.addEventListener('input',e=>{ e.target.value=e.target.value.replace(/[^0-9]/g,''); });
}
function checkFermeture(){ let cur=getESTHM(); let ouve=0; let tiragesFerme=configProprio.tirages||{}; TIRAJS.forEach(t=>{ let box=document.getElementById('box-'+t.n.replace(/ /g,'')); if(!box)return; const key=t.n.toLowerCase().replace(' ',''); const map={flmidi:'flMidi',flsoir:'flSoir',gamidi:'gaMidi',gasoir:'gaSoir',nymidi:'nyMidi',nysoir:'nySoir'}; const real=map[key]; const fermeManuel=tiragesFerme[real]==='FERME'; const fermeHeure=cur>=t.m; if(fermeManuel||fermeHeure){ box.classList.add('ferme'); box.querySelector('input').disabled=true; } else{ box.classList.remove('ferme'); box.querySelector('input').disabled=false; ouve++; } }); document.getElementById('etatOuv').innerText=ouve>0?`${ouve} ouvè`:"FERMÉ"; document.getElementById('bannerFerme').style.display=ouve===0?"block":"none"; }
window.updT=(n)=>{ let b=document.getElementById('box-'+n.replace(/ /g,'')); if(b.classList.contains('ferme'))return; let c=document.querySelector(`input[value="${n}"]`); b.classList.toggle('on',c.checked); render(); }
function getT(){return [...document.querySelectorAll('.chkT:checked')].map(c=>c.value);}
function render(){ let div=document.getElementById('liste'); div.innerHTML=''; let base=0; panier.forEach((p,i)=>{ base+=p.montan; div.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee"><span><b>${p.type}</b> ${p.boul}</span><span>${p.montan}G <button onclick="retire(${i})" style="background:#ef4444;color:#fff;border:none;padding:1px 6px;border-radius:4px">x</button></span></div>`; }); let nb=getT().length||0; let total=base*nb; document.getElementById('tBase').innerText=base+"G"; document.getElementById('tDetail').innerText=`${base}G x ${nb}`; document.getElementById('tTotal').innerText=total+"G"; document.getElementById('entetePreview').innerHTML=`${getT().join(' / ')||'Pa chwazi'} - ${base}G x ${nb} = ${total}G`; }
window.retire=(i)=>{ panier.splice(i,1);render();}
function addPanier(){ let tip=document.getElementById('tip').value; let boul=document.getElementById('boul').value.trim(); let montan=parseInt(document.getElementById('montan').value); if(getT().length===0){alert('Chwazi tiraj');return;} if(!boul||!montan){alert('Mete BOUL ak G');return;} panier.push({type:tip,boul:boul,montan:montan}); render(); document.getElementById('boul').value=""; document.getElementById('montan').value=""; document.getElementById('boul').focus(); }
document.getElementById('btnAdd').addEventListener('click',addPanier);
window.showTab=(t)=>{ document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active')); document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active')); document.getElementById('sec'+t).classList.add('active'); document.getElementById('tab'+t).classList.add('active'); };
window.genererRapport=async()=>{ let s=await get(child(ref(db),'fiches')); if(!s.exists())return; let all=Object.values(s.val()).filter(f=>f.vendeur===vendeur); document.getElementById('rapData').innerHTML=`Fich: ${all.length} - Vente: ${all.reduce((a,b)=>a+(b.total||0),0)}G`; };
window.chercheParId=async()=>{ let q=document.getElementById('searchId').value.trim(); let s=await get(child(ref(db),'fiches')); if(!s.exists())return; let f=Object.values(s.val()).find(x=>x.id.includes(q)); document.getElementById('resultSearch').innerHTML=f?`${f.total}G - ${f.tirajs}`:"Pa jwenn"; };
window.valideFich=async()=>{ let tirajs=getT(); if(tirajs.length===0)return alert('Chwazi tiraj'); if(panier.length===0)return alert('Vide'); let base=panier.reduce((a,b)=>a+b.montan,0); let total=base*tirajs.length; let id=push(child(ref(db),'fiches')).key; await set(ref(db,'fiches/'+id),{id:id,vendeur:vendeur,tirajs:tirajs,details:panier,total:total,totalBase:base,nbTiraj:tirajs.length,date:new Date().toISOString(),gain:0,dateStr:getDateHaiti()}); let ticket=`C&D\n${tirajs.join('/')}\n${panier.map(p=>`${p.type} ${p.boul} ${p.montan}G`).join('\n')}\nTotal ${base}G x ${tirajs.length}=${total}G\nID:${id.slice(-5)}\n`; document.getElementById('ticketContent').innerText=ticket; window.print(); panier=[]; render(); };
async function loadAll(){}
init();
</script></body></html>
