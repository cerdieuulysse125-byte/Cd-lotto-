<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f5f5f7}.top{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;border-bottom:1px solid #eee}.menuBtn{font-size:26px;background:0;border:0;cursor:pointer}.drawer{position:fixed;top:0;left:-280px;width:270px;height:100%;background:#fff;z-index:200;transition:.25s;box-shadow:3px 0 12px rgba(0,0,0,.3);overflow:auto}.drawer.open{left:0}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:150}.overlay.show{display:block}.drawerHead{background:#0a4a2e;color:#d4af37;padding:14px;text-align:center}.drawerItem{padding:14px 16px;border-bottom:1px solid #eee;cursor:pointer;font-weight:700;font-size:12px}.drawerItem.active{background:#e8f5e9;color:#0a4a2e;border-left:4px solid #0a4a2e}.panel{display:none;padding:12px;max-width:1100px;margin:auto}.panel.active{display:block}.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:10px}.btn{padding:12px;border:0;border-radius:10px;color:#fff;font-weight:800;width:100%;margin-top:8px;cursor:pointer}.btnG{background:#0a4a2e;color:#d4af37}.btnR{background:#c62828}.btnP{background:#4a148c}.btnB{background:#111}input,select{padding:11px;border:1.5px solid #ddd;border-radius:10px;width:100%;margin:5px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.loginPage{position:fixed;inset:0;background:#0a4a2e;display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}.loginBox{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:380px;text-align:center;border:3px solid #d4af37}
.lottoCard{background:#fff;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.06)}.lottoLogo{width:72px;height:72px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #eee;font-weight:900;font-size:10px;text-align:center}.pills{display:flex;gap:8px;margin:4px 0;flex-wrap:wrap}.pill{padding:6px 12px;border-radius:10px;font-weight:800;color:#fff;font-size:13px;min-width:38px;text-align:center}.pill-blue{background:#3b82f6}.pill-orange{background:#f97316}.pill-lightblue{background:#93c5fd;color:#1e40af}.pill-teal{background:#0d9488}.pill-pink{background:#f9a8d4;color:#9d174d}.pill-green{background:#22c55e}.pill-yellow{background:#facc15;color:#000}.pill-darkblue{background:#1d4ed8}
table{width:100%;border-collapse:collapse;font-size:11px}th{background:#0a4a2e;color:#d4af37;padding:6px}td{padding:4px;border-bottom:1px solid #eee;text-align:center}
.tirajMulti{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:200px;overflow:auto;background:#fff;padding:8px;border-radius:10px;border:1.5px solid #ddd}.tirajMulti label{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:700;background:#f8f9fa;padding:6px;border-radius:6px}
.betTable th{background:#0a4a2e;color:#d4af37;font-size:11px}.betTable td{padding:4px}.betTable input,.betTable select{padding:8px;margin:0;font-size:12px}
</style></head><body>

<script>
const DB_ROOT="https://cd-lotto-default-rtdb.firebaseio.com";
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:DB_ROOT,projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const TIRAJ_ALL=['GA midi','FL midi','NY midi','GA soir','FL soir','NY soir','Real','Primera día','Suerte día','Lote Dom','Ganamas','Suerte noche','Primera noche','Loteka','Nacional noche','Leidsa','Anguila 10h','Anguila 18h'];
let DB={vendeurs:{},proprios:{},tickets:{},results:{},limites:{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}},prix:{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000,kom:10}},blokeVendeur:{},blokeProprio:{}};
let CUR=null,MY_VENDEUR_ID=null,MY_SERIAL=null,MY_PROPRIO_ID=null;
let bets=[];
let lastFichData=null;
function toggleMenu(){document.getElementById('drawer').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
function goTab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');toggleMenu();}
function init(){db.ref().on('value',snap=>{let v=snap.val()||{};DB.vendeurs=v.vendeurs||{};DB.proprios=v.proprios||{};DB.tickets=v.tickets||{};DB.results=v.results||{};DB.limites=v.limites||{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}};DB.prix=v.prix||{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000,kom:10}};DB.blokeVendeur=v.blokeVendeur||{};DB.blokeProprio=v.blokeProprio||{};syncInfo.innerText='V25.6 '+Object.keys(DB.results).length+'R';if(mainBox.style.display!='none')loadAll();});}
function setToday(){const t=new Date().toISOString().split('T')[0];if(fDate)fDate.value=t;if(rDu)rDu.value=t;if(rAu)rAu.value=t;}
function doLogin(){let s=ln.value.trim(),p=lp.value.trim();if(!s||!p){loginMsg.innerText='Antre seri ak modpas';return;}db.ref('vendeurs').once('value').then(snap=>{let all=snap.val()||{},f=null,fId=null;for(let id in all){if((all[id].serial||'').toLowerCase()===s.toLowerCase()||id.toLowerCase()===s.toLowerCase()){f=all[id];fId=id;break;}}if(!f||(f.pass||'')!==p){loginMsg.innerText='Pa bon';return;}db.ref('blokeVendeur/'+fId).once('value').then(sb=>{if(sb.val()===true||f.bloke===true||f.actif===false){loginMsg.innerText='BLOKE';return;}CUR={nom:f.nom,serial:f.serial,id:fId,proprioId:f.proprioId};MY_VENDEUR_ID=fId;MY_SERIAL=f.serial;MY_PROPRIO_ID=f.proprioId;localStorage.setItem('curV',JSON.stringify(CUR));document.getElementById('loginBox').style.display='none';document.getElementById('mainBox').style.display='block';vUser.innerText=f.nom;vSerial.innerText=f.serial;dLogo.innerText=f.nom.substring(0,2).toUpperCase();loadAll();setToday();});});}
function logout(){localStorage.removeItem('curV');location.reload();}
function loadAll(){
 let multi=document.getElementById('tirajMulti');multi.innerHTML=TIRAJ_ALL.map(t=>`<label><input type="checkbox" value="${t}"> ${t}</label>`).join('');
 bets=[];renderBetsTable();loadAkey();loadFiches();
 let limG=DB.limites.global||{bor:1500,mar:100,l3:100,l4:20,l5:5};let limV=DB.limites[MY_VENDEUR_ID]||DB.limites[MY_SERIAL]||limG;
 limitInfo.innerText=`G Bor ${limG.bor} Mar ${limG.mar} L3 ${limG.l3} L4 ${limG.l4} L5 ${limG.l5} | ${MY_SERIAL} Bor ${limV.bor} Mar ${limV.mar} L3 ${limV.l3} L4 ${limV.l4} L5 ${limV.l5}`;
 paramSeri.innerText=MY_SERIAL;paramProp.innerText=DB.proprios[MY_PROPRIO_ID]?.nom||MY_PROPRIO_ID;
}
function loadAkey(){
 let results=Object.values(DB.results).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''));
 let bases=[{key:'new york',logo:'NY',cols:['pill-blue','pill-orange','pill-lightblue']},{key:'florida',logo:'FL',cols:['pill-teal','pill-orange','pill-pink']},{key:'georgia',logo:'GA',cols:['pill-green','pill-yellow','pill-lightgreen']},{key:'anguilla',logo:'AN',cols:['pill-yellow','pill-darkblue','pill-yellow']},{key:'real',logo:'RL',cols:['pill-blue','pill-orange','pill-lightblue']},{key:'loteka',logo:'LT',cols:['pill-green','pill-yellow','pill-lightgreen']}];
 let html='';bases.forEach(b=>{
  let soir=results.filter(r=>r.tirage.toLowerCase().includes(b.key) && r.tirage.toLowerCase().includes('soir')).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''))[0] || results.filter(r=>r.tirage.toLowerCase().includes(b.key)).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''))[0];
  let midi=results.filter(r=>r.tirage.toLowerCase().includes(b.key) && r.tirage.toLowerCase().includes('midi')).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''))[0];
  if(!soir &&!midi) return;
  let l3S=soir?((soir.l3||'000').padStart(3,'0')):'---';let r1S=soir?((soir.r1||'--').padStart(2,'0')):'--';let r2S=soir?((soir.r2||'--').padStart(2,'0')):'--';let r3S=soir?((soir.r3||'--').padStart(2,'0')):'--';
  let l3M=midi?((midi.l3||'000').padStart(3,'0')):'---';let r1M=midi?((midi.r1||'--').padStart(2,'0')):'--';let r2M=midi?((midi.r2||'--').padStart(2,'0')):'--';
  html+=`<div class="lottoCard"><div class="lottoLogo">${b.logo}</div><div style="flex:1"><h3 style="font-size:14px;font-weight:800">${b.key.toUpperCase()}</h3><div class="pills"><span class="pill ${b.cols[0]}">${l3S}</span><span class="pill ${b.cols[1]}">${r1S}</span><span class="pill ${b.cols[2]}">${r2S}</span><span class="pill pill-blue">${r3S}</span></div><div class="midi">Soir <b>${l3S} • ${r1S} • ${r2S} • ${r3S}</b><br>Midi <b>${l3M} • ${r1M} • ${r2M}</b></div></div></div>`;
 });
 document.getElementById('lottoCards').innerHTML=html||'<div class="card">Pa gen rezilta - Boul ki sòti yo nan logo NY FL GA</div>';
 document.getElementById('tableResAkey').innerHTML=results.map(r=>{
  let l3=(r.l3||'000').padStart(3,'0'),r1=(r.r1||l3.slice(-2)).padStart(2,'0'),r2=(r.r2||'00').padStart(2,'0'),r3=(r.r3||'00').padStart(2,'0'),m1=r.m1||r1+r2,m2=r.m2||r1+r3,m3=r.m3||r2+r3,l4=r.l4||r2+r3,l5=r.l5||l3+r2;
  return `<tr><td>${r.dat}</td><td>${r.tirage}</td><td>${l3}</td><td>${r1}</td><td>${r2}</td><td>${r3}</td><td>${m1}</td><td>${m2}</td><td>${m3}</td><td>${l4}</td><td>${l5}</td></tr>`;
 }).join('')||'<tr><td colspan="11">Pa gen rezilta</td></tr>';
}
function renderBetsTable(){
 let tbody=document.getElementById('betsBody');
 tbody.innerHTML=bets.map((b,i)=>`<tr>
  <td><select id="type_${i}" onchange="bets[${i}].type=this.value" style="padding:6px;font-size:11px"><option value="boul" ${b.type==='boul'?'selected':''}>Boul</option><option value="maryaj" ${b.type==='maryaj'?'selected':''}>Maryaj</option><option value="loto3" ${b.type==='loto3'?'selected':''}>Loto3</option><option value="loto4" ${b.type==='loto4'?'selected':''}>Loto4 LÒD</option><option value="loto5" ${b.type==='loto5'?'selected':''}>Loto5 LÒD KORIJE</option></select></td>
  <td><input id="num_${i}" value="${b.numero}" onkeydown="handleKey(event,${i},'num')" oninput="bets[${i}].numero=this.value;updateTotal()" style="padding:6px"></td>
  <td><input id="mise_${i}" type="number" value="${b.mise}" onkeydown="handleKey(event,${i},'mise')" oninput="bets[${i}].mise=+this.value;updateTotal()" style="padding:6px"></td>
  <td><button onclick="bets.splice(${i},1);renderBetsTable()" style="background:#c62828;color:#fff;border:0;padding:6px 8px;border-radius:6px">X</button></td>
 </tr>`).join('');
 updateTotal();
}
function handleKey(e,row,col){
 if(e.key==='Enter' || e.key==='ArrowRight' || e.key==='ArrowDown'){
  e.preventDefault();
  if(col==='num'){let el=document.getElementById(`mise_${row}`);if(el)el.focus();}
  else if(col==='mise'){
   let nextRow=row+1;
   if(nextRow>=bets.length){
    let lastType=bets[row].type||'boul';bets.push({id:Date.now(),type:lastType,numero:'',mise:bets[row].mise||''});renderBetsTable();setTimeout(()=>{let el=document.getElementById(`num_${nextRow}`);if(el)el.focus();},30);return;
   }
   let el=document.getElementById(`num_${nextRow}`);if(el)el.focus();
  }
 }
 if(e.key==='ArrowUp' && row>0){let el=document.getElementById(`num_${row-1}`);if(el)el.focus();}
}
function addRow(){let lastType=bets.length?bets[bets.length-1].type:'boul';let lastMise=bets.length?bets[bets.length-1].mise:'';bets.push({id:Date.now(),type:lastType,numero:'',mise:lastMise});renderBetsTable();setTimeout(()=>{let el=document.getElementById(`num_${bets.length-1}`);if(el)el.focus();},30);}
function updateTotal(){let t=bets.reduce((a,b)=>a+(+b.mise||0),0);totalVente.innerText=t;}
function getSelectedTiraj(){let checks=document.querySelectorAll('#tirajMulti input:checked');return Array.from(checks).map(c=>c.value);}
function saveFich(){
 let tirages=getSelectedTiraj();if(!tirages.length)return alert('Chwazi tiraj');
 if(!bets.length||bets.every(b=>!b.numero))return alert('Antre nimewo');
 let total=bets.reduce((a,b)=>a+(+b.mise||0),0);
 let limG=DB.limites.global||{bor:1500,mar:100,l3:100,l4:20,l5:5};let limV=DB.limites[MY_VENDEUR_ID]||DB.limites[MY_SERIAL]||limG;
 let c={bor:0,mar:0,l3:0,l4:0,l5:0};bets.forEach(b=>{if(!b.numero)return;if(b.type==='boul')c.bor+=+b.mise||0;if(b.type==='maryaj')c.mar+=+b.mise||0;if(b.type==='loto3')c.l3+=+b.mise||0;if(b.type==='loto4')c.l4+=+b.mise||0;if(b.type==='loto5')c.l5+=+b.mise||0;});
 if(c.bor>limV.bor||c.mar>limV.mar||c.l3>limV.l3||c.l4>limV.l4||c.l5>limV.l5)return alert(`Limit depase Bor ${limV.bor} Mar ${limV.mar} L3 ${limV.l3} L4 ${limV.l4} L5 ${limV.l5}`);
 let dateHaiti=new Date().toISOString().slice(0,10);let id='f_'+Date.now();
 let data={id,serial:MY_SERIAL,vendeurId:MY_VENDEUR_ID,proprioId:MY_PROPRIO_ID,tirage:tirages[0],tirages:tirages,bets:bets.filter(b=>b.numero).map(b=>({type:b.type,numero:String(b.numero).padStart(b.type==='loto3'?3:b.type==='loto5'?5:2,'0'),mise:+b.mise||0})),total,dateHaiti,dat:dateHaiti,date:new Date().toLocaleString(),paye:false};
 db.ref('tickets/'+id).set(data).then(()=>{lastFichData=data;document.getElementById('lastFichPreview').innerHTML=`<div class="card"><b>${id} $${total} ${tirages.join(', ')} ${data.bets.map(b=>b.type+' '+b.numero+' $'+b.mise).join(' | ')}</b><br><button class="btn btnB" onclick="printLastFich()">Enprime</button></div>`;bets=[];renderBetsTable();loadFiches();});
}
function printLastFich(){
 if(!lastFichData)return alert('Pa gen fich');
 let t=lastFichData;let txt=`FICH ${t.id}\nSeri ${t.serial} ${t.date}\n${(t.tirages||[t.tirage]).join(', ')}\n`;t.bets.forEach(b=>{txt+=`${b.type} ${b.numero} $${b.mise}\n`;});txt+=`TOTAL $${t.total}\n`;
 let printer=document.getElementById('printerSelect').value;
 if(printer==='rawbt'){window.open('rawbt:base64,'+btoa(unescape(encodeURIComponent(txt))));}
 else{let w=window.open('','_blank');w.document.write('<pre>'+txt+'</pre>');w.print();}
}
function copyFich(){let id=copyId.value.trim();if(!id)return;db.ref('tickets/'+id).once('value').then(snap=>{let t=snap.val();if(!t)return;bets=(t.bets||[]).map(b=>({type:b.type,numero:b.numero,mise:b.mise}));renderBetsTable();let multi=document.querySelectorAll('#tirajMulti input');multi.forEach(m=>{m.checked=(t.tirages||[t.tirage]).includes(m.value);});copyPreview.innerHTML=`<div class="card"><b>${id}</b><br>${(t.bets||[]).map(b=>b.type+' '+b.numero+' $'+b.mise).join(' | ')}</div>`;goTab('t1');});}

function checkPeye(){
 let id=payId.value.trim();if(!id)return;
 db.ref('tickets/'+id).once('value').then(snap=>{
  let tic=snap.val();if(!tic){payRes.innerHTML='Pa jwenn';return;}
  if(tic.paye===true){payRes.innerHTML=`<div style="background:#c62828;color:#fff;padding:10px;border-radius:8px">Deja PEYE - Yon sèl fwa</div>`;return;}
  let results=Object.values(DB.results).filter(r=> (tic.tirages||[tic.tirage]).includes(r.tirage));
  let prix=DB.prix[MY_VENDEUR_ID]||DB.prix[MY_PROPRIO_ID]||DB.prix.global;
  let totalPeye=0,det='';
  (tic.bets||[]).forEach(b=>{
   let num=String(b.numero||'').padStart(b.type==='loto3'?3:b.type==='loto5'?5:2,'0'),mise=b.mise||0,type=b.type||'boul';
   results.forEach(r=>{
    let l3=(r.l3||'000').padStart(3,'0'),r1=(r.r1||l3.slice(-2)).padStart(2,'0'),r2=(r.r2||'00').padStart(2,'0'),r3=(r.r3||'00').padStart(2,'0'),l4=r2+r3,m1=r1+r2,m2=r1+r3,m3=r2+r3,l5=l3+r2;
    let gain=0;if(type==='boul'){if(num===r1)gain=mise*prix.p1;else if(num===r2)gain=mise*prix.p2;else if(num===r3)gain=mise*prix.p3;}else if(type==='loto3'){if(num===l3)gain=mise*prix.l3;}else if(type==='maryaj'){if(num===m1||num===r2+r1)gain=mise*prix.m1;else if(num===m2||num===r3+r1)gain=mise*prix.m2;else if(num===m3||num===r3+r2)gain=mise*prix.m3;}else if(type==='loto4'){if(num===l4)gain=mise*5000;}else if(type==='loto5'){if(num===l5)gain=mise*prix.l5;}
    if(gain>0){totalPeye+=gain;det+=`<div style="padding:6px;border-bottom:1px dashed #ccc"><b>${r.tirage} ${r.dat} ${type} ${num} $${mise} → $${gain}</b></div>`;}
   });
  });
  payRes.innerHTML=`<div style="background:#e8f5e9;padding:10px;border-radius:8px"><b>${id} $${tic.total} ${(tic.tirages||[tic.tirage]).join(', ')}</b></div><div style="background:#ffebee;padding:10px;border-radius:8px;border:2px solid #c62828;margin-top:8px"><b>A Peye: $${totalPeye}</b><br>${det?`<button class="btn btnR" onclick="confirmPeye('${id}',${totalPeye})">Konfime Peye $${totalPeye}</button>`:'Pa gen gayan'}</div><div style="margin-top:10px">${det}</div>`;
 });
}
function confirmPeye(id,amount){if(!confirm(`Konfime Peye ${id} $${amount}?`))return;db.ref('tickets/'+id).update({paye:true,payeAmount:amount,payeDate:new Date().toLocaleString(),payeBy:MY_SERIAL}).then(()=>{payRes.innerHTML=`<div style="background:#2e7d32;color:#fff;padding:12px;border-radius:8px">Fich ${id} PEYE $${amount} - Yon sèl fwa</div>`;loadFiches();});}
function calcRapport(){
 let du=rDu.value,au=rAu.value;if(!du||!au)return;
 let tickets=Object.values(DB.tickets).filter(t=>t.serial===MY_SERIAL && (t.dateHaiti||'').substring(0,10)>=du && (t.dateHaiti||'').substring(0,10)<=au);
 let results=Object.values(DB.results).filter(r=>r.dat>=du&&r.dat<=au);
 let prix=DB.prix[MY_VENDEUR_ID]||DB.prix[MY_PROPRIO_ID]||DB.prix.global;
 let vente=0,peye=0,kom=0,det='',printTxt=`Du ${du} Au ${au} ${MY_SERIAL}\n`;
 let v=DB.vendeurs[MY_VENDEUR_ID]||{};let komP=v.kom||10;
 tickets.forEach(tic=>{
  vente+=tic.total||0;kom+=(tic.total||0)*komP/100;
  (tic.bets||[]).forEach(b=>{
   let num=String(b.numero||'').padStart(b.type==='loto3'?3:b.type==='loto5'?5:2,'0'),mise=b.mise||0,type=b.type||'boul';
   results.forEach(r=>{
    let l3=(r.l3||'000').padStart(3,'0'),r1=(r.r1||l3.slice(-2)).padStart(2,'0'),r2=(r.r2||'00').padStart(2,'0'),r3=(r.r3||'00').padStart(2,'0'),l4=r2+r3,m1=r1+r2,m2=r1+r3,m3=r2+r3,l5=l3+r2;
    let gain=0;if(type==='boul'){if(num===r1)gain=mise*prix.p1;else if(num===r2)gain=mise*prix.p2;else if(num===r3)gain=mise*prix.p3;}else if(type==='loto3'){if(num===l3)gain=mise*prix.l3;}else if(type==='maryaj'){if(num===m1||num===r2+r1)gain=mise*prix.m1;else if(num===m2||num===r3+r1)gain=mise*prix.m2;else if(num===m3||num===r3+r2)gain=mise*prix.m3;}else if(type==='loto4'){if(num===l4)gain=mise*5000;}else if(type==='loto5'){if(num===l5)gain=mise*prix.l5;}
    if(gain>0){peye+=gain;det+=`<div style="padding:6px;border-bottom:1px dashed #ccc"><b>${r.tirage} ${r.dat} ${type} ${num} $${mise} → $${gain}</b></div>`;printTxt+=`${r.tirage} ${type} ${num} $${mise} -> $${gain}\n`;}
   });
  });
 });
 let balans=vente-kom-peye;
 rapportRes.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="background:#e8f5e9;padding:10px;border-radius:8px"><b>Vant</b><br>$${vente}</div><div style="background:#fff3e0;padding:10px;border-radius:8px"><b>Komisyon</b><br>$${kom.toFixed(2)}</div><div style="background:#ffebee;padding:10px;border-radius:8px"><b>A Peye</b><br>$${peye}</div><div style="background:#e3f2fd;padding:10px;border-radius:8px"><b>Balans</b><br>$${balans.toFixed(2)}</div></div>`;
 rapportDetail.innerHTML=det||'Pa gen gayan';printZone.innerText=printTxt+`Vant $${vente}\nKomisyon $${kom.toFixed(2)}\nA Peye $${peye}\nBalans $${balans.toFixed(2)}`;printZone.style.display='block';btnPrint.style.display='block';
}
