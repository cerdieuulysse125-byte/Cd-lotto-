<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VANDE V10.6 - ESPAS + BON CHANS</title>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{background:#fff;touch-action:manipulation}
.top{background:#000;color:#FFD500;text-align:center;padding:12px;font-weight:900;font-size:12px}
.card{background:#fff;border:3px solid #000;border-radius:20px;padding:10px;margin:10px}
.tiraj{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}.tiraj label{border:3px solid #000;border-radius:20px;padding:10px;text-align:center;font-weight:900;font-size:10px;display:flex;align-items:center;justify-content:center;min-height:48px;background:#fff}.tiraj input{display:none}.tiraj input:checked+label{background:#FFD500}
.row{display:grid;grid-template-columns:0.9fr 1.2fr 0.6fr 0.4fr;gap:6px;align-items:center;margin:6px 0}
.kf{border:3px solid #000;border-radius:20px;height:50px;text-align:center;font-weight:900;font-size:14px;width:100%;background:#fff}
.btn{border:3px solid #000;border-radius:20px;height:50px;font-weight:900;width:100%;font-size:12px;cursor:pointer}.btn-y{background:#FFD500}.btn-b{background:#000;color:#FFD500}.btn-r{background:red;color:#fff}
.list{border:3px solid #000;border-radius:20px;padding:8px;min-height:60px;margin:8px 0}
.badge{display:inline-block;background:#FFD500;border:2px solid #000;border-radius:12px;padding:4px 8px;font-weight:900;font-size:10px;margin:2px}
#printArea{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;display:block!important}}
</style>
</head>
<body>
<div class="top">C&D VÉRITÉ LOTTO - VANDE V10.6 - 12×34=34×12 BON - FICH AK ESPAS</div>
<div class="card">
<div style="font-weight:900;text-align:center">Chwazi Tiraj</div>
<div class="tiraj" id="tirajBox">
<input type="checkbox" value="GA MIDI" id="t1"><label for="t1">GA MIDI</label>
<input type="checkbox" value="FL MIDI" id="t2"><label for="t2">FL MIDI</label>
<input type="checkbox" value="NY MIDI" id="t3"><label for="t3">NY MIDI</label>
<input type="checkbox" value="GA SOIR" id="t4"><label for="t4">GA SOIR</label>
<input type="checkbox" value="FL SOIR" id="t5"><label for="t5">FL SOIR</label>
<input type="checkbox" value="NY SOIR" id="t6"><label for="t6">NY SOIR</label>
</div>
<div class="row">
<select id="typeSel" class="kf" style="font-size:10px"><option value="BOLET">BOLET</option><option value="MARYAJ">MARYAJ</option><option value="LOTO3">LOTO3</option><option value="LOTO4">LOTO4</option><option value="LOTO5">LOTO5</option></select>
<input id="boulIn" class="kf" placeholder="Boul" inputmode="numeric">
<input id="mizIn" class="kf" placeholder="$" inputmode="numeric">
<button type="button" class="btn btn-y" id="btnAdd">+</button>
</div>
<div id="list" class="list"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<button type="button" class="btn btn-b" id="btnSave">💾 ANREJISTRE</button>
<button type="button" class="btn btn-y" id="btnPrint">🖨️ IMPRIMER</button>
</div>
<div id="total" style="text-align:center;font-weight:900;margin-top:10px;font-size:14px">TOTAL $0</div>
</div>

<div id="printArea"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push, get, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
const vendeurActif=localStorage.getItem("vendeur")||"Jules";
let lignes=[]; let tirajChwazi=[];

function getDatePAP(){return new Intl.DateTimeFormat('en-CA',{timeZone:"America/Port-au-Prince",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}
function getHeurePAP(){const d=new Date(); const s=new Intl.DateTimeFormat('en-CA',{timeZone:"America/Port-au-Prince",hour:"2-digit",minute:"2-digit",hour12:false}).format(d); const [h,m]=s.split(':').map(Number); return h*60+m;}
function normM(b){if(!b) return ""; b=b.toString().trim().toLowerCase().replace(/[^0-9x]/g,''); if(!b.includes('x')&&b.length==4) b=b.slice(0,2)+'x'+b.slice(2); const p=b.split('x').filter(x=>x!=""); if(p.length!=2) return b; return [p[0].padStart(2,'0'),p[1].padStart(2,'0')].sort().join('x');}

function renderV(){
  const cont=document.getElementById('list'); cont.innerHTML="";
  let tot=0;
  lignes.forEach((l,i)=>{
    if(l.boul==""&&l.miz=="") return;
    const lb=l.type=="MARYAJ"?normM(l.boul):l.boul;
    tot+=parseInt(l.miz)||0;
    cont.innerHTML+=`<span class="badge">${l.type} ${lb} $${l.miz} <span data-i="${i}" style="color:red;cursor:pointer;padding-left:6px">X</span></span>`;
  });
  document.getElementById('total').innerText=`TOTAL $${tot*tirajChwazi.length} (${tirajChwazi.length} tiraj)`;
  cont.querySelectorAll('[data-i]').forEach(e=>{ e.addEventListener('click',()=>{lignes.splice(parseInt(e.dataset.i),1);renderV();}); });
}

document.getElementById('btnAdd').addEventListener('click',async()=>{
  const type=document.getElementById('typeSel').value;
  let boul=document.getElementById('boulIn').value.trim();
  const miz=document.getElementById('mizIn').value.trim();
  if(!boul||!miz){alert("Antre boul + $");return;}
  if(type=="MARYAJ") boul=normM(boul);
  // LIMIT 12x34=34x12 konte ansanm
  try{
    const snapLim=await get(ref(db,`limites/${vendeurActif}`));
    if(snapLim.exists()){
      const lim=snapLim.val();
      let limKey=type; if(type=="BOLET") limKey="BOLET"; else if(type=="MARYAJ") limKey="MARYAJ"; else limKey=type;
      const maxLim=parseInt(lim[limKey]||999999);
      const snapV=await get(ref(db,`ventes/${getDatePAP()}/${vendeurActif}`));
      let deja=0;
      if(snapV.exists()){
        Object.values(snapV.val()).forEach(fiche=>{
          fiche.fiches.forEach(f=>{
            if(type=="MARYAJ"){
              if(normM(f.boul)==normM(boul) && f.type=="MARYAJ") deja+=parseInt(f.miz)||0;
            }else{
              if(f.boul==boul && f.type==type) deja+=parseInt(f.miz)||0;
            }
          });
        });
      }
      lignes.forEach(l=>{
        if(type=="MARYAJ"){ if(normM(l.boul)==normM(boul)&&l.type=="MARYAJ") deja+=parseInt(l.miz)||0; }
        else{ if(l.boul==boul&&l.type==type) deja+=parseInt(l.miz)||0; }
      });
      if((deja+parseInt(miz))>maxLim){alert(`LIMIT ${type} ${boul} - Max ${maxLim}$ - Deja ${deja}$ - 12x34=34x12 konte ansanm`);return;}
    }
  }catch(e){}
  lignes.push({type,boul,miz});
  document.getElementById('boulIn').value=""; document.getElementById('mizIn').value="";
  renderV();
});

document.querySelectorAll('.tiraj input').forEach(inp=>{
  inp.addEventListener('change',()=>{
    tirajChwazi=Array.from(document.querySelectorAll('.tiraj input:checked')).map(i=>i.value);
    renderV();
  });
});

// FIX FICH - BAY PLIS ESPAS ANT BÒLÈT, BOUL AK PRI + BÒN CHANS LAVE CHODYÈ W
window.valider=async function(doPrint){
  const valides=lignes.filter(f=>f.boul.trim()!=""&&f.miz.trim()!="").map(f=>({...f,boul:f.type=="MARYAJ"?normM(f.boul):f.boul}));
  if(valides.length==0){alert("Pa gen fich");return;}
  if(tirajChwazi.length==0){alert("Chwazi tiraj");return;}
  const dateStr=getDatePAP(); const cur=getHeurePAP();
  const snapH=await get(ref(db,`heures`));
  if(snapH.exists()){
    const h=snapH.val();
    for(let t of tirajChwazi){
      const hm=h[t.replace(' ','_')];
      if(!hm) continue;
      const [hh,mm]=hm.split(':').map(Number);
      if(cur>hh*60+mm){alert(`FÈMÈ ${t} - ${hm} EST PAP`);return;}
    }
  }
  const id="T-"+Date.now().toString().slice(-6);
  const tot=valides.reduce((s,f)=>s+(parseInt(f.miz)||0),0)*tirajChwazi.length;
  await push(ref(db,`ventes/${dateStr}/${vendeurActif}`),{id,tiraj:tirajChwazi,fiches:valides,total:tot,date:dateStr,timestamp:Date.now(),vendeur:vendeurActif});

  // BAY PLIS ESPAS - TABLE AK 20px
  const fichLignes = valides.map(f=>{
    return `<tr>
      <td style="text-align:left;padding:10px 24px;font-size:18px">${f.type}</td>
      <td style="text-align:center;padding:10px 24px;font-size:18px;letter-spacing:1px">${f.boul}</td>
      <td style="text-align:right;padding:10px 24px;font-size:18px">$${f.miz}</td>
    </tr>`;
  }).join('');

  const html=`
  <div style="text-align:center;font-family:Courier New, monospace;font-weight:900;color:#000;width:320px;margin:0 auto;padding:10px">
    <div style="font-size:20px;padding:12px 0">C&D VÉRITÉ LOTTO</div>
    <div style="font-size:15px">Date ${dateStr} EST PAP</div>
    <div style="font-size:15px;margin:8px 0">Tirages ${tirajChwazi.join('/')} </div>
    <div style="font-size:15px">Responsable ${vendeurActif}</div>
    <div style="font-size:15px;margin:8px 0">Ticket ${id}</div>
    <div style="margin:12px 0;font-size:16px">----------------</div>
    <table style="width:100%;border-collapse:collapse;font-weight:900;margin:10px 0">
      ${fichLignes}
    </table>
    <div style="margin:12px 0;font-size:16px">----------------</div>
    <div style="font-size:18px;margin:14px 0">TOTAL $${tot}</div>
    <div style="margin-top:28px;font-size:16px;text-transform:lowercase;letter-spacing:0.5px">bòn chans, lave chodyè w</div>
  </div>`;

  const pa=document.getElementById('printArea');
  pa.innerHTML=html;
  if(doPrint){
    pa.style.display='block';
    setTimeout(()=>{ window.print(); pa.style.display='none'; },200);
  }else{
    pa.style.display='block';
    pa.style.position='fixed'; pa.style.top='10px'; pa.style.left='0'; pa.style.background='#fff'; pa.style.zIndex='9999'; pa.style.width='100%'; pa.style.height='100%'; pa.style.overflow='auto';
    setTimeout(()=>{ pa.style.display='none'; pa.style.position='absolute'; },4000);
  }
  lignes=[];
  renderV();
}

document.getElementById('btnSave').addEventListener('click',()=>valider(false));
document.getElementById('btnPrint').addEventListener('click',()=>valider(true));
renderV();
</script>
</body>
</html>
