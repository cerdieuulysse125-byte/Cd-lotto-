<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VANDE V9.7 - KAZ BOUL MIZ KOUT MENM TIRAJ + MODPAS</title>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0;padding:0}body{background:#fff}
.top-y{background:#FFD500;text-align:center;padding:14px;font-weight:900}.top-b{background:#000;color:#FFD500;text-align:center;padding:10px;font-weight:900;font-size:11px}
.login-box{margin:20px;border:3px solid #000;border-radius:22px;padding:15px;background:#FFF8DC}.kf{width:100%;border:3px solid #000;border-radius:25px;height:52px;text-align:center;font-weight:900;margin:6px 0}
.btn{border:3px solid #000;border-radius:25px;height:52px;font-weight:900;width:100%}.btn-y{background:#FFD500}
.menu{display:flex;border:2px solid #000}.menu button{flex:1;padding:13px 2px;font-weight:900;background:#fff;border:none;border-right:2px solid #000;font-size:11px}.menu button.active{background:#FFD500}
.grid{padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.t-btn{border:3px solid #000;border-radius:25px;height:52px;font-weight:900;background:#fff;font-size:11px}.t-btn.active{background:#FFD500}.t-btn.ferme{background:red;color:#fff}
/* KAZ POU METE BOUL AK MIZ YO TWÒ LONG - FÈ YO MENM FÒS AK KAZ TIRAJ YO - KOUT 52px */
.ligne{display:grid;grid-template-columns:82px 1fr 1fr 52px 52px;gap:8px;padding:0 10px;margin-bottom:10px;align-items:center}
.k-jeux{height:52px;border:3px solid #000;border-radius:25px;font-weight:900;text-align:center;background:#fff;font-size:10px;width:100%}
.k-boul{height:52px;border:3px solid #000;border-radius:25px;font-weight:900;text-align:center;font-size:18px;background:#fff;width:100%;max-width:100%}
.k-miz{height:52px;border:3px solid #000;border-radius:25px;font-weight:900;text-align:center;background:#FFD500;font-size:18px;width:100%;max-width:100%}
.b-x{width:52px;height:52px;border:3px solid red;color:red;background:#fff;border-radius:25px;font-weight:900}.b-d{width:52px;height:52px;border:3px solid #000;background:#FFD500;border-radius:25px;font-weight:900;font-size:18px}
.total{margin:10px;border:3px solid #000;border-radius:25px;min-height:52px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;padding:8px;text-align:center}
.btns{display:flex;gap:10px;padding:10px}.bb{flex:1;height:52px;border:3px solid #000;border-radius:25px;font-weight:900;font-size:11px}.black{background:#000;color:#FFD500}.green{background:#0A9A0A;color:#FF0}
.onglet{display:none}.onglet.active{display:block}
.ferm-box{margin:10px;border:3px solid red;background:#FFD500;border-radius:25px;padding:12px;text-align:center;font-weight:900;font-size:11px}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;text-align:center;font-size:32px;font-weight:900;line-height:1.9}}
</style>
</head>
<body>
<div id="loginScreen"><div class="top-y">C&D VÉRITÉ LOTTO - LOGIN - MODEPAS RESPEKTE</div><div class="login-box"><h3 style="text-align:center;font-weight:900">Antre Non + Modpas - Modepas dwe respekte - Konekte ak Proprio</h3><input id="loginNom" class="kf" placeholder="Non vendeur"><input id="loginPass" class="kf" placeholder="Modpas" type="password"><button class="btn btn-y" onclick="login()">🔓 KONEKTE - MODPAS RESPEKTE</button><div id="loginMsg" style="margin-top:10px;font-weight:900;text-align:center"></div></div></div>
<div id="vandeScreen" style="display:none"><div class="top-y">VENDEUR - <span id="nomV"></span></div><div class="top-b" id="dateBar"></div><div class="menu"><button id="m1" class="active" onclick="openO(1)">1.VENTE</button><button id="m2" onclick="openO(2)">2.COPIER</button><button id="m3" onclick="openO(3)">3.FICHES</button><button id="m4" onclick="openO(4)">4.RAPPORT</button><button onclick="logout()" style="background:red;color:#fff;border:none;padding:13px;font-weight:900">X</button></div>
<div id="o1" class="onglet active"><div id="fermMsg" class="ferm-box"></div><div class="grid" id="grid"></div><div id="tSel" style="margin:10px;border:3px solid #000;border-radius:25px;height:52px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px"></div><div id="container"></div><div class="total" id="totalBar"></div><div class="btns"><button class="bb black" onclick="valider(false)">💾 VALIDER</button><button class="bb green" onclick="valider(true)">🖨️ VALIDER + IMPRIMER</button></div></div>
<div id="o2" class="onglet"><input id="idT" class="kf" placeholder="ID Ticket" inputmode="numeric"><button class="bb black" style="margin:10px;width:calc(100% - 20px)" onclick="copier()">KOPIYE</button><div id="resC" style="margin:10px;border:2px solid #000;border-radius:12px;padding:10px;font-weight:900"></div></div>
<div id="o3" class="onglet"><input type="date" id="dateF" class="kf"><div id="listF"></div></div>
<div id="o4" class="onglet"><div style="margin:10px;border:3px solid #000;border-radius:18px;padding:12px"><h3 style="text-align:center;background:#FFD500;border:2px solid #000;border-radius:12px;padding:8px;margin-bottom:8px;font-size:11px">Rapport Du Au Tiraj Vente Commission Gain Balance net Imprimer - EST PAP</h3>Du <input type="date" id="du" class="kf"> Au <input type="date" id="au" class="kf">Tiraj <select id="filT" class="kf"><option value="TOUS">Tiraj (..., tous)</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><div id="rapV" style="background:#fff;border:2px solid #000;border-radius:12px;padding:10px;font-weight:900;min-height:100px;margin-top:8px">Vente: $0<br>Commission: $0<br>Gain (kliyan): $0<br>Balance net: $0</div><button class="bb black" style="width:100%;margin-top:8px" onclick="printR()">🖨️ IMPRIMER</button></div></div></div>
<div id="printArea" style="display:none"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = { apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4", authDomain:"cd-lotto.firebaseapp.com", databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com", projectId:"cd-lotto", storageBucket:"cd-lotto.firebasestorage.app", messagingSenderId:"671091732195", appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6" };
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
let vendeurActif=null,pourV=10,tirajChwazi=["FL MIDI"],lignes=[{type:"BOLET",boul:"",miz:""}];
const tirajList=["GA MIDI","FL MIDI","NY MIDI","GA SOIR","FL SOIR","NY SOIR"];
function normM(b){ if(!b)return""; b=b.toString().trim().toLowerCase().replace(/[^0-9x]/g,''); if(!b.includes('x')&&b.length==4) b=b.slice(0,2)+'x'+b.slice(2); const p=b.split('x').filter(x=>x!=""); if(p.length!=2) return b; return [p[0].padStart(2,'0'),p[1].padStart(2,'0')].sort().join('x'); }
function getHeurePAP(){ const now=new Date(); const opt={timeZone:"America/Port-au-Prince",hour12:false,hour:"2-digit",minute:"2-digit"}; const str=new Intl.DateTimeFormat('en-US',opt).format(now); const [hh,mm]=str.split(':').map(Number); return hh*60+mm; }
// MODEPAS DWE RESPEKTE - LOGIN AK MODPAS KONEKTE AK PROPRIO
window.login=async function(){ const nom=document.getElementById('loginNom').value.trim(); const pass=document.getElementById('loginPass').value.trim(); const msg=document.getElementById('loginMsg'); if(!nom||!pass){msg.innerText="Antre non + modpas - Modepas dwe respekte";return;} const snap=await get(ref(db,`vendeurs`)); if(!snap.exists()){msg.innerText="Pa gen vandè nan proprio";return;} let ok=false,found=false; Object.values(snap.val()).forEach(v=>{ if(v.nom.toLowerCase()==nom.toLowerCase()){ found=true; if(v.pass==pass){ if(v.status=="FERME"){msg.innerText="❌ Vendeur sa FERME pa proprio";return;} ok=true; vendeurActif=v.nom; pourV=parseInt(v.pour||10);} else {msg.innerText="❌ Modpas pa bon - Modepas dwe respekte";} } }); if(!found){msg.innerText="❌ Non vendeur pa egziste nan proprio";return;} if(!ok)return; localStorage.setItem('vendeur',vendeurActif); localStorage.setItem('pour',pourV); startVande(); }
function startVande(){ document.getElementById('loginScreen').style.display='none'; document.getElementById('vandeScreen').style.display='block'; document.getElementById('nomV').innerText=vendeurActif+" - "+pourV+"% - MODEPAS OK"; document.getElementById('dateBar').innerText=new Date().toISOString().slice(0,10)+" | "+vendeurActif+" | "+pourV+"% | EST PAP | MODPAS RESPEKTE"; document.getElementById('du').value=new Date().toISOString().slice(0,10); document.getElementById('au').value=new Date().toISOString().slice(0,10); document.getElementById('dateF').value=new Date().toISOString().slice(0,10); renderT(); renderV(); checkFermeture(); }
window.logout=function(){ localStorage.clear(); location.reload(); }
async function checkFermeture(){ const snap=await get(ref(db,`heures`)); const cur=getHeurePAP(); let msg="L'heure fermeture (heure de l'est, Port au Prince) respekte: "; let fermList=[]; if(snap.exists()){ const h=snap.val(); const map={"GA MIDI":h.GA_MIDI,"FL MIDI":h.FL_MIDI,"NY MIDI":h.NY_MIDI,"GA SOIR":h.GA_SOIR,"FL SOIR":h.FL_SOIR,"NY SOIR":h.NY_SOIR}; tirajList.forEach(t=>{ const hm=map[t]; if(!hm)return; const [hh,mm]=hm.split(':').map(Number); if(cur>hh*60+mm){ fermList.push(t); msg+=` ${t} FÈME (${hm} EST) |`; tirajChwazi=tirajChwazi.filter(x=>x!==t);} }); } if(fermList.length==0) msg+=" Tout ouvè EST PAP - Modepas respekte"; document.getElementById('fermMsg').innerText=msg; window.fermList=fermList; renderT(); }
window.openO=function(n){ document.querySelectorAll('.onglet').forEach(o=>o.classList.remove('active')); document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active')); document.getElementById('o'+n).classList.add('active'); document.getElementById('m'+n)?.classList.add('active'); if(n==3)renderF(); if(n==4)jenereR(); }
function renderT(){ const g=document.getElementById('grid'); g.innerHTML=""; tirajList.forEach(t=>{ const a=tirajChwazi.includes(t); const ferme=(window.fermList||[]).includes(t); g.innerHTML+=`<button class="t-btn ${ferme?'ferme':a?'active':''}" ${ferme?'disabled':''} onclick="toggleT('${t}')">${t} ${ferme?'FÈME':a?'✓':''}</button>`}); document.getElementById('tSel').innerText=tirajChwazi.join(' / ')+' ✓ EST PAP'; }
window.toggleT=function(t){ if((window.fermList||[]).includes(t)){ alert(t+" FÈME EST PAP - L'heure fermeture respekte"); return; } if(tirajChwazi.includes(t)){ if(tirajChwazi.length>1) tirajChwazi=tirajChwazi.filter(x=>x!==t);} else tirajChwazi.push(t); renderT(); calc(); }
window.renderV=function(){ const c=document.getElementById('container'); c.innerHTML=""; lignes.forEach((l,i)=>{ c.innerHTML+=`<div class="ligne"><select class="k-jeux" id="type-${i}"><option ${l.type=="BOLET"?"selected":""}>BOLET</option><option ${l.type=="MARYAJ"?"selected":""}>MARYAJ</option><option ${l.type=="LOTO3"?"selected":""}>LOTO3</option><option ${l.type=="LOTO4"?"selected":""}>LOTO4</option><option ${l.type=="LOTO5"?"selected":""}>LOTO5</option></select><input class="k-boul" id="boul-${i}" value="${l.boul}" placeholder="Boul" inputmode="numeric" autocomplete="off"><input class="k-miz" id="miz-${i}" value="${l.miz}" placeholder="Miz" inputmode="numeric" autocomplete="off"><button class="b-x" onclick="supp(${i})">X</button><button class="b-d" onclick="down(${i})">↓</button></div>`;}); lignes.forEach((_,i)=>{ document.getElementById(`type-${i}`).addEventListener('change',e=>lignes[i].type=e.target.value); const elB=document.getElementById(`boul-${i}`); const elM=document.getElementById(`miz-${i}`); elB.addEventListener('input',e=>{ let v=e.target.value.toLowerCase(); if(lignes[i].type=="MARYAJ") v=v.replace(/[^0-9x]/g,''); else v=v.replace(/[^0-9]/g,''); e.target.value=v; lignes[i].boul=v; calc(); }); elM.addEventListener('input',e=>{ e.target.value=e.target.value.replace(/[^0-9]/g,''); lignes[i].miz=e.target.value; calc(); }); elB.addEventListener('keydown',e=>{ if(e.key=="Enter"||e.key=="ArrowRight"||e.key=="ArrowDown"){ e.preventDefault(); document.getElementById(`miz-${i}`)?.focus(); } }); elM.addEventListener('keydown',e=>{ if(e.key=="Enter"||e.key=="ArrowDown"){ e.preventDefault(); down(i); } }); }); calc(); }
window.supp=function(i){ lignes.splice(i,1); if(lignes.length==0) lignes=[{type:"BOLET",boul:"",miz:""}]; renderV(); }
window.down=function(i){ const curType=document.getElementById(`type-${i}`)?.value||lignes[i].type; lignes[i].type=curType; lignes[i].boul=document.getElementById(`boul-${i}`)?.value||""; lignes[i].miz=document.getElementById(`miz-${i}`)?.value||""; lignes.splice(i+1,0,{type:curType,boul:"",miz:""}); renderV(); setTimeout(()=>document.getElementById(`boul-${i+1}`)?.focus(),80); }
window.calc=function(){ let base=0; lignes.forEach(l=>{ if(l.boul.trim()!=""&&parseInt(l.miz)>0) base+=parseInt(l.miz); }); document.getElementById('totalBar').innerText=`Total ×tiraj sélectionné - $${base} × ${tirajChwazi.length} = $${base*tirajChwazi.length} - Flèche ↓ kenbe je - Chif sèlman - EST PAP - Modpas respekte`; }
window.valider=async function(doPrint){
  const valides=lignes.filter(f=>f.boul.trim()!=""&&f.miz.trim()!="").map(f=>({...f,boul:f.type=="MARYAJ"?normM(f.boul):f.boul})); if(valides.length==0)return;
  const dateStr=new Date().toISOString().slice(0,10); const cur=getHeurePAP(); const snapH=await get(ref(db,`heures`)); if(snapH.exists()){ const h=snapH.val(); for(let t of tirajChwazi){ const hm=h[t.replace(' ','_')]; if(!hm)continue; const [hh,mm]=hm.split(':').map(Number); if(cur>hh*60+mm){alert(`FÈMTI ${t} RESPEKTE EST PAP - ${hm}`);return;} } }
  const snap=await get(ref(db,`ventes/${dateStr}`)); let gB={},gM={},gO={LOTO3:0,LOTO4:0,LOTO5:0}; if(snap.exists()){ Object.values(snap.val()).forEach(vs=>Object.values(vs).forEach(fc=>fc.fiches.forEach(x=>{ if(x.type=="BOLET"){gB[x.boul]=(gB[x.boul]||0)+parseInt(x.miz);} else if(x.type=="MARYAJ"){ const n=normM(x.boul); gM[n]=(gM[n]||0)+parseInt(x.miz);} else {gO[x.type]=(gO[x.type]||0)+parseInt(x.miz);} }))); }
  const snapLim=await get(ref(db,`limites/${vendeurActif}`)); const lim=snapLim.exists()?snapLim.val():{BOLET:15000,MARYAJ:100,LOTO3:100,LOTO4:20,LOTO5:5};
  for(let f of valides){ if(f.type=="MARYAJ"){ const n=normM(f.boul); if((gM[n]||0)+parseInt(f.miz)>parseInt(lim.MARYAJ)){alert(`LIMIT GLOBAL MARYAJ ${n} DEPASE`);return;} } else if(f.type=="BOLET"){ if((gB[f.boul]||0)+parseInt(f.miz)>parseInt(lim.BOLET)){alert(`LIMIT BOLET DEPASE`);return;} } else { if((gO[f.type]||0)+parseInt(f.miz)>parseInt(lim[f.type])){alert(`LIMIT ${f.type} DEPASE`);return;} } }
  const id="T-"+Date.now().toString().slice(-6); const tot=valides.reduce((s,f)=>s+(parseInt(f.miz)||0),0)*tirajChwazi.length;
  await push(ref(db,`ventes/${dateStr}/${vendeurActif}`),{id,tiraj:tirajChwazi,fiches:valides,total:tot,date:dateStr,timestamp:Date.now(),vendeur:vendeurActif});
  const html=`C&D VÉRITÉ LOTTO<br>Date ${dateStr} EST PAP<br>Tirages ${tirajChwazi.join('/')} <br>Responsable ${vendeurActif}<br>Ticket ${id}<br>----------------<br>${valides.map(f=>`${f.type} ${f.boul} $${f.miz}`).join('<br>')}<br>----------------<br>TOTAL $${tot}`;
  document.getElementById('printArea').innerHTML=html; if(doPrint){ document.getElementById('printArea').style.display='block'; window.print(); document.getElementById('printArea').style.display='none'; }
  lignes=[{type:lignes[lignes.length-1].type,boul:"",miz:""}]; renderV();
}
window.copier=async function(){ const id=document.getElementById('idT').value.trim(); if(!id)return; const snap=await get(ref(db,`ventes`)); let found=null; snap.forEach(d=>{d.forEach(v=>{Object.values(v.val()).forEach(f=>{if(f.id==id)found=f;})})}); if(found){ lignes=found.fiches.map(x=>({...x})); tirajChwazi=found.tiraj; openO(1); renderT(); renderV(); } }
window.renderF=async function(){ const dateFil=document.getElementById('dateF').value||new Date().toISOString().slice(0,10); const snap=await get(ref(db,`ventes/${dateFil}/${vendeurActif}`)); const cont=document.getElementById('listF'); cont.innerHTML=""; if(!snap.exists()){cont.innerHTML="Pa gen fich";return;} Object.values(snap.val()).forEach(f=>{cont.innerHTML+=`<div style="margin:8px 10px;border:2px solid #000;border-radius:12px;padding:8px;background:#fff;font-size:11px"><b>${f.id}</b> - ${f.tiraj.join('+')} - $${f.total}<br>${f.fiches.map(x=>x.type+' '+x.boul+' $'+x.miz).join('<br>')}</div>`}); }
window.jenereR=async function(){
  const du=document.getElementById('du').value||new Date().toISOString().slice(0,10); const au=document.getElementById('au').value||du; const filT=document.getElementById('filT').value;
  const snapR=await get(ref(db,`resultats/${du}`)); const snapP=await get(ref(db,`prix/${vendeurActif}`)); const prixV=snapP.exists()?snapP.val():{lot1:50,lot2:20,lot3:10,maryaj:1000,loto3:500,loto4:5000,loto5:25000};
  let vente=0,gain=0; const start=new Date(du); const end=new Date(au);
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const ds=d.toISOString().slice(0,10); const snapV=await get(ref(db,`ventes/${ds}/${vendeurActif}`)); if(!snapV.exists()) continue;
    Object.values(snapV.val()).forEach(fiche=>{
      const tList=filT=="TOUS"?fiche.tiraj:fiche.tiraj.filter(t=>t==filT); if(tList.length==0) return; const ratio=tList.length/fiche.tiraj.length; vente+=fiche.total*ratio;
      tList.forEach(t=>{ if(snapR.exists()&&snapR.child(t).exists()){ const res=snapR.child(t).val(); fiche.fiches.forEach(l=>{ let g=0; if(l.type=="BOLET"){ if(l.boul==res.r1) g=parseInt(l.miz)*prixV.lot1*ratio; else if(l.boul==res.r2) g=parseInt(l.miz)*prixV.lot2*ratio; else if(l.boul==res.r3) g=parseInt(l.miz)*prixV.lot3*ratio; } if(l.type=="MARYAJ"&&(normM(l.boul)==normM(res.m1)||normM(l.boul)==normM(res.m2)||normM(l.boul)==normM(res.m3))) g=parseInt(l.miz)*prixV.maryaj*ratio; if(l.type=="LOTO3"&&l.boul==res.l3) g=parseInt(l.miz)*prixV.loto3*ratio; if(l.type=="LOTO4"&&l.boul==res.l4) g=parseInt(l.miz)*prixV.loto4*ratio; if(l.type=="LOTO5"&&l.boul==res.l5) g=parseInt(l.miz)*prixV.loto5*ratio; gain+=g; }); } });
    });
  }
  const comm=vente*pourV/100; const bal=vente-comm-gain;
  document.getElementById('rapV').innerHTML=`Du ${du} Au ${au}<br>Tiraj ${filT}<br><br>Vente: $${vente.toFixed(0)}<br>Commission ${pourV}%: $${comm.toFixed(0)}<br>Gain (kliyan): $${gain.toFixed(0)}<br><b>Balance net: $${bal.toFixed(0)}</b><br><br>EST PAP - Modepas respekte`;
}
window.printR=function(){ document.getElementById('printArea').innerHTML=document.getElementById('rapV').innerHTML; document.getElementById('printArea').style.display='block'; window.print(); document.getElementById('printArea').style.display='none'; }
const saved=localStorage.getItem('vendeur'); if(saved){ vendeurActif=saved; pourV=parseInt(localStorage.getItem('pour')||10); startVande(); }
</script>
</body>
</html>
