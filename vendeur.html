<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VANDÈ - C&D VERITE</title>
<style>
*{box-sizing:border-box;font-family:monospace}
body{margin:0;padding:6px;background:#fff}
.center{text-align:center}
.yellow{background:#FFD500;border:2px solid #000;padding:7px;font-weight:900}
.menu{display:flex;gap:3px;margin:6px 0}
.menu button{flex:1;border:2px solid #000;border-radius:30px;padding:10px 2px;font-weight:900;background:#fff;font-size:11px}
.menu button.active{background:#FFD500}
.onglet{display:none}.onglet.active{display:block}
.tiraj{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.tiraj button{border:2px solid #000;border-radius:30px;padding:11px 0;font-weight:900;background:#fff}
.tiraj button.active{background:#FFD500}
.ligne{display:flex;gap:4px;margin-bottom:6px}
.kaz{flex:1;border:2px solid #000;border-radius:30px;height:42px;text-align:center;font-weight:900;font-size:13px}
.kaz-miz{background:#FFD500}
.btn-x{border:2px solid red;color:red;background:#fff;border-radius:30px;width:38px;height:42px;font-weight:900}
.btn-d{background:#FFD500;border:2px solid #000;border-radius:30px;width:38px;height:42px;font-weight:900}
.total{border:2px solid #000;border-radius:30px;padding:10px;text-align:center;font-weight:900;margin:8px 0}
.btn-val{width:100%;padding:14px;border-radius:30px;font-weight:900;border:2px solid #000}
.btn-black{background:#000;color:#FFD500}.btn-green{background:#0A8A00;color:#fff;margin-top:6px}
.fiche{border:2px solid #000;border-radius:12px;padding:8px;margin-bottom:6px;font-size:12px}
@media print{
 body *{visibility:hidden}
 #printArea, #printArea *{visibility:visible}
 #printArea{position:absolute;left:0;top:0;width:100%;text-align:center;font-size:22px;font-weight:900;line-height:1.6}
}
</style>
</head>
<body>

<div class="center" style="font-weight:900;font-size:18px">C&D VÉRITÉ LOTTO - VANDÈ</div>
<div class="yellow" id="infoVendeur">JEAN - 10% - Konekte ak cd-lotto</div>

<div class="menu">
<button class="active" onclick="openO(1)">1.VENDRE</button>
<button onclick="openO(2)">2.COPIER</button>
<button onclick="openO(3)">3.FICHES</button>
<button onclick="openO(4)">4.RAPPORT</button>
</div>

<!-- 1 VENDRE -->
<div id="o1" class="onglet active">
<div class="yellow" style="font-size:10px">Limite Global: Bolet 15000 Maryaj 100 L3 100 L4 20 L5 5 - Maryaj Lòd/Dezòd 12x47=47x12</div>
<div class="tiraj" id="tirajGrid"></div>
<div id="container"></div>
<div id="total" class="total"></div>
<button class="btn-val btn-black" onclick="valider(false)">💾 VALIDER</button>
<button class="btn-val btn-green" onclick="valider(true)">🖨️ IMPRIMER - SANTRE GRAN LÈT TERMINAL V2 PRO</button>
</div>

<!-- 2 COPIER -->
<div id="o2" class="onglet">
<div class="yellow">COPIER - Mete ID Ticket</div>
<input id="idTicket" class="kaz" style="width:100%;margin:8px 0" placeholder="ID Ticket ex: T-123456">
<button class="btn-val btn-black" onclick="copierTicket()">📋 CHERCHE & KOPIYE</button>
<div id="resCopie"></div>
</div>

<!-- 3 MES FICHES -->
<div id="o3" class="onglet">
<input type="date" id="dateF" class="kaz" style="width:100%;margin:6px 0">
<input id="searchF" class="kaz" style="width:100%" placeholder="Recherche fiches..." oninput="renderFiches()">
<div id="listFiches"></div>
</div>

<!-- 4 RAPPORT -->
<div id="o4" class="onglet">
Du <input type="date" id="du" class="kaz"> Au <input type="date" id="au" class="kaz">
<select id="filTiraj" class="kaz" style="width:100%;margin:6px 0"><option value="TOUS">Tous Tirages</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select>
<div id="rapportV" class="fiche"></div>
<button class="btn-val btn-black" onclick="printRapport()">🖨️ IMPRIMER RAPPORT</button>
</div>

<div id="printArea" style="display:none"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push, get, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = { apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4", authDomain:"cd-lotto.firebaseapp.com", databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com", projectId:"cd-lotto", storageBucket:"cd-lotto.firebasestorage.app", messagingSenderId:"671091732195", appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6" };
const app=initializeApp(firebaseConfig); const db=getDatabase(app);

let tirajChwazi=["FL MIDI"]; let lignes=[{type:"MARYAJ",boul:"",miz:""}];
let prix={lot1:50,lot2:20,lot3:10,maryaj:1000,loto3:500,loto4:5000,loto5:25000};
const tirajList=["GA MIDI","FL MIDI","NY MIDI","GA SOIR","FL SOIR","NY SOIR"];

function normalizeMaryaj(b){
  if(!b.includes('x')){b=b.replace('-','x'); if(b.length==4) b=b.slice(0,2)+'x'+b.slice(2);}
  const parts=b.toLowerCase().split('x'); if(parts.length==2) return [parts[0],parts[1]].sort().join('x');
  return b;
}

window.openO=function(n){document.querySelectorAll('.onglet').forEach(o=>o.classList.remove('active'));document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));document.getElementById('o'+n).classList.add('active');document.querySelectorAll('.menu button')[n-1].classList.add('active'); if(n==3)renderFiches(); if(n==4)renderRapport();}

function renderTiraj(){
  const g=document.getElementById('tirajGrid');g.innerHTML="";
  tirajList.forEach(t=>{
    const active=tirajChwazi.includes(t)?'active':'';
    g.innerHTML+=`<button class="${active}" onclick="toggleT('${t}')">${t} ${active?'✓':''}</button>`;
  });
}
window.toggleT=function(t){if(tirajChwazi.includes(t)){if(tirajChwazi.length>1)tirajChwazi=tirajChwazi.filter(x=>x!==t);}else tirajChwazi.push(t);renderTiraj();calcul();}

window.renderVente=function(){
  const c=document.getElementById('container');c.innerHTML="";
  lignes.forEach((l,i)=>{
    c.innerHTML+=`<div class="ligne">
    <select class="kaz" onchange="lignes[${i}].type=this.value"><option ${l.type=="MARYAJ"?"selected":""}>MARYAJ</option><option ${l.type=="BOLET"?"selected":""}>BOLET</option><option ${l.type=="LOTO3"?"selected":""}>LOTO3</option><option ${l.type=="LOTO4"?"selected":""}>LOTO4</option><option ${l.type=="LOTO5"?"selected":""}>LOTO5</option></select>
    <input class="kaz" placeholder="Boul" value="${l.boul}" oninput="lignes[${i}].boul=this.value;calcul()" inputmode="numeric">
    <input class="kaz kaz-miz" placeholder="Mise" value="${l.miz}" oninput="this.value=this.value.replace(/[^0-9]/g,'');lignes[${i}].miz=this.value;calcul()" inputmode="numeric">
    <button class="btn-x" onclick="lignes.splice(${i},1);if(lignes.length==0)lignes=[{type:'MARYAJ',boul:'',miz:''}];renderVente();calcul()">X</button>
    <button class="btn-d" onclick="const t=lignes[${i}].type;lignes.splice(${i}+1,0,{type:t,boul:'',miz:''});renderVente();">↓</button>
    </div>`;
  });
}
window.calcul=function(){
  const v=lignes.filter(f=>f.boul.trim()!=""&&f.miz.trim()!="");
  const tot=v.reduce((s,f)=>s+(parseInt(f.miz)||0),0)*tirajChwazi.length;
  document.getElementById('total').innerText=`Total × ${tirajChwazi.length} (${tirajChwazi.join('+')}) = $${tot} - Flèche ↓ kenbe je - Chif sèlman`;
}
window.valider=async function(doPrint){
  const valides=lignes.filter(f=>f.boul.trim()!=""&&f.miz.trim()!="").map(f=>({...f,boul:f.type=="MARYAJ"?normalizeMaryaj(f.boul):f.boul}));
  if(valides.length==0) return;
  const dateStr=new Date().toISOString().slice(0,10);
  const id="T-"+Date.now().toString().slice(-6);
  const total=valides.reduce((s,f)=>s+(parseInt(f.miz)||0),0)*tirajChwazi.length;

  // Limite Global Firebase
  const snap=await get(ref(db,`ventes/${dateStr}`));
  let globalTot={BOLET:0,MARYAJ:0,LOTO3:0,LOTO4:0,LOTO5:0};
  if(snap.exists()){Object.values(snap.val()).forEach(vs=>Object.values(vs).forEach(fc=>fc.fiches.forEach(x=>{globalTot[x.type]=(globalTot[x.type]||0)+parseInt(x.miz);}))) }
  for(let f of valides){ if((globalTot[f.type]||0)+parseInt(f.miz) > {BOLET:15000,MARYAJ:100,LOTO3:100,LOTO4:20,LOTO5:5}[f.type]){alert(`LIMITE GLOBAL ${f.type} DEPASE`);return;} }

  await push(ref(db,`ventes/${dateStr}/JEAN`),{id,tiraj:tirajChwazi,fiches:valides,total,date:dateStr,timestamp:Date.now(),vendeur:"JEAN",prix});

  // FICH ENPRIME SANTRE GRAN LET
  const printHTML=`<div style="text-align:center">
  C&D VÉRITÉ LOTTO<br>
  Date ${dateStr} ${new Date().toLocaleTimeString()}<br>
  Tirages ${tirajChwazi.join('/')} <br>
  Responsable JEAN<br>
  Ticket ${id}<br><br>
  ${valides.map(f=>`${f.type} ${f.boul} $${f.miz}`).join('<br>')}<br><br>
  TOTAL $${total}<br><br>
  Bòn chans, lave chodyè w<br>
  </div>`;
  document.getElementById('printArea').innerHTML=printHTML;
  if(doPrint){document.getElementById('printArea').style.display='block';window.print();document.getElementById('printArea').style.display='none';}
  lignes=[{type:lignes[lignes.length-1].type,boul:"",miz:""}];renderVente();calcul();
}
window.copierTicket=async function(){
  const id=document.getElementById('idTicket').value.trim(); if(!id)return;
  const snap=await get(ref(db,`ventes`)); let found=null;
  snap.forEach(dateNode=>{dateNode.forEach(vNode=>{Object.values(vNode.val()).forEach(f=>{if(f.id==id) found=f;})})});
  if(found){lignes=found.fiches.map(f=>({...f}));openO(1);renderVente();calcul();document.getElementById('resCopie').innerText="✅ Kopye "+found.fiches.length+" fich";}
  else document.getElementById('resCopie').innerText="❌ Pa jwenn";
}
window.renderFiches=async function(){
  const dateFil=document.getElementById('dateF').value||new Date().toISOString().slice(0,10);
  const search=document.getElementById('searchF').value.toLowerCase();
  const snap=await get(ref(db,`ventes/${dateFil}/JEAN`));
  const cont=document.getElementById('listFiches'); cont.innerHTML="";
  if(!snap.exists()){cont.innerHTML="Pa gen fich";return;}
  Object.values(snap.val()).filter(f=>JSON.stringify(f).toLowerCase().includes(search)).forEach(f=>{cont.innerHTML+=`<div class="fiche">${f.id} - ${f.tiraj.join('+')} - $${f.total}<br>${f.fiches.map(x=>x.type+' '+x.boul+' $'+x.miz).join('<br>')}</div>`});
}
window.renderRapport=async function(){
  const du=document.getElementById('du').value||new Date().toISOString().slice(0,10); const au=document.getElementById('au').value||du;
  const snap=await get(ref(db,`ventes/${du}`)); let vente=0;
  if(snap.exists()&&snap.child('JEAN').exists()){Object.values(snap.val().JEAN).forEach(f=>{if(f.tiraj.some(t=>document.getElementById('filTiraj').value=="TOUS"||f.tiraj.includes(document.getElementById('filTiraj').value))) vente+=f.total;})}
  const comm=vente*0.1; const gain=0; // ap kalkile ak rezilta
  document.getElementById('rapportV').innerHTML=`Du ${du} Au ${au}<br>Vente $${vente}<br>Commission $${comm}<br>Gain $${gain}<br>Balance Net $${vente-comm-gain}`;
}
renderTiraj();renderVente();calcul();
</script>
</body>
</html>
