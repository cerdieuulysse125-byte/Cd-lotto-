let curUser=null, selectedT=[], config={}, resultats={}, venteDuJour={}, lastHtml='', lastRapportHtml='', myCommission=10, isFerme=false;
let tirajDef=[{id:'gaMidi',nom:'GA MIDI',h:'12:15'},{id:'flMidi',nom:'FL MIDI',h:'13:15'},{id:'nyMidi',nom:'NY MIDI',h:'14:15'},{id:'gaSoir',nom:'GA SOIR',h:'18:20'},{id:'flSoir',nom:'FL SOIR',h:'21:10'},{id:'nySoir',nom:'NY SOIR',h:'21:30'}];
function getHaitiDate(){ const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getESTHM(){ const now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return now.getHours()*60+now.getMinutes(); }
async function go(){ const u=document.getElementById('uName').value.trim(); const p=document.getElementById('uPass').value.trim(); const err=document.getElementById('loginErr'); if(!u||!p){ err.innerText="Mete Code"; return; } err.innerText="Ap verifye..."; try{ const [cSnap,vSnap]=await Promise.all([db.ref('config').once('value'),db.ref('vendeurs').once('value')]); config=cSnap.val()||{}; let allFb={}; Object.assign(allFb, config.vendeurs||{}, vSnap.val()||{}); let found=null; for(let k in allFb){ let v=allFb[k]; if(!v) continue; if(String(v.code||k).trim().toUpperCase()===u.toUpperCase()){ found=v; break; } } if(!found) throw new Error("Vandè pa egziste"); if(String(found.pass||found.password).trim()!==p) throw new Error("Modpas pa bon"); if((found.statut||'OUVERT').includes('FERME')){ err.innerHTML="🔒 BANK FERME pa Proprio"; return; } curUser={name:u.toUpperCase()}; myCommission=found.commission!==undefined?found.commission:(config.commission||10); document.getElementById('loginBox').style.display='none'; document.getElementById('appBox').style.display='block'; document.getElementById('mn').innerText=curUser.name; document.getElementById('userShow').innerText=curUser.name; document.getElementById('comShow').innerText=myCommission+'%'; document.getElementById('dateToday').innerText=getHaitiDate(); document.getElementById('rapDu').value=getHaitiDate(); document.getElementById('rapAu').value=getHaitiDate(); db.ref('config').on('value',s=>{ config=s.val()||{}; checkFermeAuto(); renderTiraj(); checkLimitGlobal(); }); db.ref('resultats').on('value',s=>{ resultats=s.val()||{}; }); db.ref('venteJournaliere/'+getHaitiDate()).on('value',s=>{ venteDuJour=s.val()||{}; checkLimitGlobal(); }); document.getElementById('lines').innerHTML=''; addLine(true); renderTiraj(); }catch(e){ err.innerText=e.message; } }
function checkFermeAuto(){ if(!curUser) return; const allV=config.vendeurs||{}; let me=null; for(let k in allV){ if(String(allV[k].code||k).toUpperCase()===curUser.name){ me=allV[k]; break; } } if(!me) return; myCommission=me.commission!==undefined?me.commission:(config.commission||10); document.getElementById('comShow').innerText=myCommission+'%'; const ferme=(me.statut||'OUVERT').includes('FERME')||me.actif===false; if(ferme){ isFerme=true; document.getElementById('fermeNom').innerText=curUser.name; document.getElementById('fermeOverlay').style.display='flex'; } else { isFerme=false; document.getElementById('fermeOverlay').style.display='none'; } }
function renderTiraj(){ const he=config.heures||{}; let html=''; const cur=getESTHM(); tirajDef.forEach(t=>{ const realH=he[t.id]||t.h; const mm=parseInt(realH.split(':')[0])*60+parseInt(realH.split(':')[1]); const ferme=cur>=mm; html+=`<span class="tiraj ${selectedT.includes(t.nom)?'active':''} ${ferme?'ferme':''}" onclick="${ferme||isFerme?'':'toggleTiraj(\''+t.nom+'\')'}">${t.nom}<br><small>${realH}</small></span>`; }); document.getElementById('tirajBox').innerHTML=html; }
function toggleTiraj(n){ if(isFerme) return; if(selectedT.includes(n)) selectedT=selectedT.filter(x=>x!==n); else selectedT.push(n); renderTiraj(); recalc(); checkLimitGlobal(); }
function getAllLines(){ return Array.from(document.querySelectorAll('#lines > div')); }
function addLine(isFirst){ const div=document.createElement('div'); div.style.display='grid'; div.style.gridTemplateColumns='85px 1fr 75px'; div.style.gap='5px'; div.style.margin='5px 0'; div.innerHTML=`<select class="j" tabindex="-1" style="padding:11px;border:2px solid #000;border-radius:10px"><option value="bolet">Bolèt</option><option value="maryaj">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select><input class="b" type="tel" placeholder="Boul" style="padding:11px;border:2px solid #000;border-radius:10px" inputmode="numeric"><input class="m" type="tel" placeholder="Miz" style="padding:11px;border:2px solid #000;border-radius:10px" inputmode="numeric">`; document.getElementById('lines').appendChild(div); const b=div.querySelector('.b'), m=div.querySelector('.m'); const upd=()=>{ b.value=b.value.replace(/[^0-9]/g,''); m.value=m.value.replace(/[^0-9]/g,''); recalc(); checkLimitGlobal(); }; b.addEventListener('input',upd); m.addEventListener('input',upd); b.addEventListener('keydown',(e)=>{ const lines=getAllLines(); const idx=lines.indexOf(div); if(e.key==='Enter'||e.key==='ArrowRight'){ e.preventDefault(); m.focus(); } else if(e.key==='ArrowDown'){ e.preventDefault(); if(idx===lines.length-1) addLine(); const nl=getAllLines(); if(nl[idx+1]) nl[idx+1].querySelector('.b').focus(); } else if(e.key==='ArrowUp'&&idx>0){ e.preventDefault(); lines[idx-1].querySelector('.b').focus(); } }); m.addEventListener('keydown',(e)=>{ const lines=getAllLines(); const idx=lines.indexOf(div); if(e.key==='Enter'||e.key==='ArrowDown'){ e.preventDefault(); deduplicateFiche(); if(idx===lines.length-1) addLine(); const nl=getAllLines(); if(nl[idx+1]) nl[idx+1].querySelector('.b').focus(); } else if(e.key==='ArrowUp'){ e.preventDefault(); if(idx>0) lines[idx-1].querySelector('.m').focus(); else b.focus(); } else if(e.key==='ArrowLeft'){ e.preventDefault(); b.focus(); } }); if(isFirst) setTimeout(()=>b.focus(),200); return div; }
function recalc(){ let tot=0; getAllLines().forEach(r=>{ const m=parseInt(r.querySelector('.m').value)||0; if(r.querySelector('.b').value.trim()&&m>0) tot+=m; }); document.getElementById('tot').innerText=tot+'$'; document.getElementById('nbT').innerText=selectedT.length||1; document.getElementById('paye').innerText=(tot*(selectedT.length||1))+'$'; }
function deduplicateFiche(){ let map={}; getAllLines().forEach(row=>{ const type=row.querySelector('.j').value; const boul=row.querySelector('.b').value.trim(); const m=parseInt(row.querySelector('.m').value)||0; if(!boul||!m) return; const key=type+"_"+boul; if(map[key]){ map[key].mise+=m; map[key].rows.push(row); } else { map[key]={mise:m, rows:[row], first:row}; } }); for(let key in map){ if(map[key].rows.length>1){ map[key].first.querySelector('.m').value=map[key].mise; map[key].rows.slice(1).forEach(r=>r.remove()); } } recalc(); return map; }
function checkLimitGlobal(){ if(isFerme) return false; const limites=config.limites||{bolet:1000,maryaj:50,loto3:100,loto4:20,loto5:5}; const map=deduplicateFiche(); let html=''; let blocked=false; for(let key in map){ const [type,boul]=key.split('_'); const miseFiche=map[key].mise; let limitVal=limites[type]||1000; if(type==='bolet') limitVal=limites.bolet||1000; if(type==='maryaj') limitVal=limites.maryaj||50; if(type==='loto3') limitVal=limites.loto3||100; if(type==='loto4') limitVal=limites.loto4||20; if(type==='loto5') limitVal=limites.loto5||5; selectedT.forEach(tNom=>{ const dejaVann=(venteDuJour[tNom]&&venteDuJour[tNom][key])||0; if(dejaVann+miseFiche>limitVal){ html+=`<div class="limit-bad">⛔ ${tNom} ${boul} ${dejaVann}$/${limitVal}$ +${miseFiche}$ DEPASE</div>`; blocked=true; } }); } document.getElementById('limitMsg').innerHTML=html; const btn=document.getElementById('btnVendre'); btn.disabled=blocked||isFerme; btn.style.opacity=blocked||isFerme?'0.4':'1'; btn.innerText=blocked?'⛔ LIMIT DEPASE':'VENDRE & IMPRIMER'; return!blocked&&!isFerme; }
async function vann(){ if(isFerme) return; if(selectedT.length===0){ alert('Chwazi tiraj'); return; } deduplicateFiche(); if(!checkLimitGlobal()){ alert('LIMIT DEPASE'); return; } let details=[]; let map={}; getAllLines().forEach(r=>{ const j=r.querySelector('.j').value; const b=r.querySelector('.b').value.trim(); const m=parseInt(r.querySelector('.m').value)||0; if(b&&m>0){ details.push({type:j,boul:b,montan:m}); const k=j+"_"+b; map[k]=(map[k]||0)+m; } }); if(details.length===0){ alert('Mete boul'); return; } const dateStr=getHaitiDate(); const snap=await db.ref('venteJournaliere/'+dateStr).once('value'); const curJ=snap.val()||{}; const limites=config.limites||{bolet:1000,maryaj:50,loto3:100,loto4:20,loto5:5}; for(let k in map){ let type=k.split('_')[0]; let limitVal=limites[type]||1000; if(type==='bolet') limitVal=limites.bolet||1000; if(type==='maryaj') limitVal=limites.maryaj||50; if(type==='loto3') limitVal=limites.loto3||100; if(type==='loto4') limitVal=limites.loto4||20; if(type==='loto5') limitVal=limites.loto5||5; for(let tNom of selectedT){ const cur=(curJ[tNom]&&curJ[tNom][k])||0; if(cur+map[k]>limitVal){ alert(`LIMIT ${tNom} ${k} ${cur}+${map[k]}>${limitVal}`); return; } } } const id=db.ref('fiches').push().key; let updates={}; updates['fiches/'+id]={id,vendeur:curUser.name,tirajs:selectedT,details,total:details.reduce((a,b)=>a+b.montan,0)*selectedT.length,gain:0,date:new Date().toISOString(),dateStr,commission:myCommission, venteParTiraj: details.reduce((a,b)=>a+b.montan,0)}; Object.keys(map).forEach(k=>{ selectedT.forEach(t=>{ const cur=(curJ[t]&&curJ[t][k])||0; updates['venteJournaliere/'+dateStr+'/'+t+'/'+k]=cur+map[k]; }); }); await db.ref().update(updates); const hms=new Date().toLocaleTimeString('fr-HT',{hour12:false}); const corps=details.map(d=>`<div style="display:flex;justify-content:space-between;font-size:19px"><span>${d.type.toUpperCase()} ${d.boul}</span><span>${d.montan}$</span></div>`).join(''); lastHtml=`<div style="font-size:24px;text-align:center;font-weight:900">${config.entete||'C&D'}</div><div style="text-align:center;font-size:13px">${dateStr} ${hms}<br>${curUser.name} (${myCommission}%)</div><div style="border-top:2px dashed #000;margin:5px 0"></div><div style="text-align:center">Tirage: <b>${selectedT.join('/')}</b><br>Id: <b style="font-size:22px">${id.slice(-5).toUpperCase()}</b></div><div style="border-top:2px dashed #000;margin:5px 0"></div>${corps}<div style="border-top:2px dashed #000;margin:5px 0"></div><div style="display:flex;justify-content:space-between;font-size:20px"><span>TOTAL</span><span>${details.reduce((a,b)=>a+b.montan,0)*selectedT.length}$</span></div>`; document.getElementById('lastTicket').innerHTML=`<div style="border:2px dashed #000;padding:10px;max-width:340px;margin:auto;font-family:monospace;font-weight:900;text-align:center">${lastHtml}<br><button class="btn bK" onclick="doPrint()">🖨️ RE-IMPRIMER</button></div>`; doPrint(); document.getElementById('lines').innerHTML=''; addLine(true); recalc(); loadFiches(); }
function doPrint(){ const c=`<html><head><meta charset="UTF-8"><style>@page{size:58mm auto;margin:0}body{margin:0;padding:2mm;display:flex;justify-content:center}.ticket{width:52mm;text-align:center;font-family:monospace;font-weight:900}</style></head><body><div class="ticket">${lastHtml}</div><script>setTimeout(()=>{window.print(); setTimeout(()=>window.close(),700)},300);<\/script></body></html>`; const w=window.open('','_blank','width=360,height=600'); w.document.open(); w.document.write(c); w.document.close(); }
function showTab(id){ if(isFerme&&id!=='rapportTab'&&id!=='fichesTab'){ alert('🔒 BANK FERME'); return; } ['vendre','kopyeTab','fichesTab','rapportTab'].forEach(x=>document.getElementById(x).style.display='none'); document.getElementById(id).style.display='block'; document.querySelectorAll('.tab2 button').forEach(b=>b.classList.remove('active')); if(id==='vendre') document.getElementById('tV').classList.add('active'); if(id==='kopyeTab') document.getElementById('tC').classList.add('active'); if(id==='fichesTab'){ document.getElementById('tF').classList.add('active'); loadFiches(); } if(id==='rapportTab') document.getElementById('tR').classList.add('active'); }

// KALKILE GAIN PA TIRAJ - SA KI KORIJE BUG LA
function calcGainForTiraj(fiche, tirajNom){
  if(!fiche.details) return 0;
  const p=config.prix||{}; const prix={bolet1:parseInt(p.bolet1)||50,bolet2:parseInt(p.bolet2)||20,bolet3:parseInt(p.bolet3)||10,maryaj:parseInt(p.maryaj)||1000,loto3:parseInt(p.loto3)||500,loto4:parseInt(p.loto4)||5000,loto5:parseInt(p.loto5)||25000};
  const dayRes=resultats[fiche.dateStr]||{};
  const res=dayRes[tirajNom]||{};
  if(!res.r1 &&!res.rl3) return 0;
  let gain=0;
  fiche.details.forEach(d=>{
    const boul=String(d.boul).trim(); const m=parseInt(d.montan)||0;
    if(d.type==='bolet'){
      if(boul.padStart(2,'0')===String(res.r1||'').padStart(2,'0')) gain+=m*prix.bolet1;
      else if(boul.padStart(2,'0')===String(res.r2||'').padStart(2,'0')) gain+=m*prix.bolet2;
      else if(boul.padStart(2,'0')===String(res.r3||'').padStart(2,'0')) gain+=m*prix.bolet3;
    }
    if(d.type==='maryaj' && [String(res.rm1||''),String(res.rm2||''),String(res.rm3||'')].includes(boul)) gain+=m*prix.maryaj;
    if(d.type==='loto3' && res.rl3 && boul===String(res.rl3).trim()) gain+=m*prix.loto3;
    if(d.type==='loto4' && res.rl4 && boul===String(res.rl4).trim()) gain+=m*prix.loto4;
    if(d.type==='loto5' && res.rl5 && boul===String(res.rl5).trim()) gain+=m*prix.loto5;
  });
  return gain;
}
function calcGainTotal(fiche){
  if(parseInt(fiche.gain)>0 &&!fiche.tirajs) return parseInt(fiche.gain);
  let tot=0;
  (fiche.tirajs||[]).forEach(t=>{ tot+=calcGainForTiraj(fiche,t); });
  if(tot===0) tot=parseInt(fiche.gain)||0;
  return tot;
}
async function loadFiches(){ const today=getHaitiDate(); const snap=await db.ref('fiches').orderByChild('dateStr').equalTo(today).once('value'); if(!snap.exists()){ document.getElementById('listF').innerHTML="Pa gen fich"; return; } let list=Object.values(snap.val()).filter(f=>f.vendeur===curUser.name).reverse().slice(0,50); let html=''; list.forEach(f=>{ const gain=calcGainTotal(f); const win=gain>0; html+=`<div style="border:${win?'3px solid #16a34a':'1px solid #ccc'};padding:7px;margin:5px 0;border-radius:9px;font-size:11px;background:${win?'#dcfce7':'#fff'}"><b>${(f.tirajs||[]).join('/')} - ${f.total}$</b> <span style="font-size:8px">${f.id.slice(-5).toUpperCase()}</span><br><span style="font-size:9px">${(f.details||[]).map(d=>d.type+':'+d.boul+'-'+d.montan+'$').join(' | ')}</span><br>${win?`<b style="color:#16a34a">🎉 GAIN: ${gain}$</b>`:`Gain: 0$`}</div>`; }); document.getElementById('listF').innerHTML=html; }
function searchById(){ const q=document.getElementById('searchId').value.trim().toLowerCase(); if(!q) return; db.ref('fiches').once('value',s=>{ const all=Object.values(s.val()||[]); const f=all.find(x=>x.id.toLowerCase().includes(q)); document.getElementById('resKopye').innerHTML=f?`<div style="border:2px solid #000;padding:8px"><b>${(f.tirajs||[]).join('/')} ${f.total}$</b><br>${(f.details||[]).map(d=>d.type+':'+d.boul+'-'+d.montan+'$').join('<br>')}<br><b>GAIN: ${calcGainTotal(f)}$</b><br><button class="btn bK" onclick="reprintFiche('${f.id}')">Re-imprime</button></div>`:"Pa jwenn"; }); }
function reprintFiche(fid){ db.ref('fiches/'+fid).once('value',s=>{ const f=s.val(); if(!f) return; const corps=(f.details||[]).map(d=>`<div style="display:flex;justify-content:space-between;font-size:18px"><span>${d.type.toUpperCase()} ${d.boul}</span><span>${d.montan}$</span></div>`).join(''); lastHtml=`<div style="font-size:22px;text-align:center;font-weight:900">${config.entete||'C&D'}</div><div style="text-align:center;font-size:12px">${f.dateStr}<br>${f.vendeur}</div><div style="border-top:2px dashed #000;margin:5px 0"></div><div style="text-align:center">Tirage: <b>${(f.tirajs||[]).join('/')}</b><br>Id: <b>${f.id.slice(-5).toUpperCase()}</b></div><div style="border-top:2px dashed #000;margin:5px 0"></div>${corps}<div style="border-top:2px dashed #000;margin:5px 0"></div><div style="display:flex;justify-content:space-between;font-size:18px"><span>TOTAL</span><span>${f.total}$</span></div>`; doPrint(); }); }

  // TABLO DETAYE PA TIRAJ - GA 1000 / FL
var html=`<table style="width:100%;border-collapse:collapse;border:1px solid #ccc"><tr style="background:#eee"><th>Tiraj</th><th>Vant</th><th>Peye</th><th>Benefis</th></tr>`;
for(var t of TIRAJ){
async function genererRapport(){
 try{
  var cont = document.getElementById('rapportDetail') || document.getElementById('zoneRapport') || document.getElementById('rapport');
  if(cont) cont.innerHTML = '<div style="text-align:center;padding:20px">⏳ Ap kalkile... <br><small>Pa fèmen paj la</small></div>';
  
  var duVal = document.getElementById('dateDu')?.value || document.getElementById('du')?.value;
  var auVal = document.getElementById('dateAu')?.value || document.getElementById('au')?.value;
  var filT = document.getElementById('filTiraj')?.value || document.getElementById('tiraj')?.value || "tous";
  
  // Si se TOUS, limite dat yo pou pa bloke
  if(filT=="tous" && duVal && auVal){
    var d1 = new Date(duVal); var d2 = new Date(auVal);
    var diff = (d2-d1)/(1000*60*60*24);
    if(diff > 7){ alert("Pou TOUS TIRAJ, chwazi max 7 jou pou pa bloke!"); return; }
  }

  // --- RÈS KÒD OU A ISIT ---
  // Kite kalkil ou yo men chanje sèlman liy sa a:
  // AVAN: if(filT=="tous" && tir!==filT) return;
  // APRE: if(filT!=="tous" && tir!==filT) return;

  // Apre kalkil la fin fèt:
  // cont.innerHTML = html;

 }catch(e){
  alert("Erè rapport: "+e.message);
  console.log(e);
  if(cont) cont.innerHTML = '<div style="color:red">Erè: '+e.message+'<br> Eseye ak yon sèl tiraj (8H) olye de TOUS</div>';
 }
}
