<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#eef2f7}

</style></head><body>

<script>
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database?firebase.database():null;
const TIRAJ_DEFAULT=[["GA midi","12:00"],["FL midi","13:00"],["NY midi","14:00"],["Real","12:30"],["GA soir","18:00"],["FL soir","21:00"],["NY soir","22:00"],["Primera dia","11:30"],["Suerte dia","12:00"],["Lote Dom","13:30"],["Ganamas","14:15"],["Suerte noche","17:50"],["Primera noche","19:50"],["Loteka","19:45"],["Nacional noche","20:50"],["Leidsa","20:45"]];
let DB={vendeurs:{},tickets:{},heures:{},config:{tel:'+52 7298079596'},prix:{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000}}},CUR=null,selT=[],LAST_TXT='',serverOffset=0,printerMode=localStorage.getItem('printerMode')||'sunmi',btDevice=null,btChar=null,sunmiPrinterService=null,sunmiBound=false,isPrinting=false;
function hideSplash(){let sp=document.getElementById('splash');if(sp){sp.style.opacity='0';setTimeout(()=>sp.style.display='none',400);}}
setTimeout(hideSplash,2000);
if(db){try{db.ref('.info/serverTimeOffset').on('value',s=>{serverOffset=s.val()||0;});}catch(e){}}
function getTrueNow(){return new Date(Date.now()+serverOffset);}function getHaitiTime(){try{return new Date(getTrueNow().toLocaleString('en-US',{timeZone:'America/Port-au-Prince'}));}catch(e){return new Date();}}
function getHaitiDateStr(){let d=getHaitiTime();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function formatHaiti(d){let h=d.getHours(),m=d.getMinutes().toString().padStart(2,'0'),ap=h>=12?'PM':'AM',h12=h%12||12;return h12+':'+m+' '+ap+' EST';}
function getHeureProprio(n){return DB.heures&&DB.heures[n]?DB.heures[n]:(TIRAJ_DEFAULT.find(x=>x[0]==n)?.[1]||'');}
function isOpen(n){let s=getHeureProprio(n);if(!s)return true;let p=s.split(':'),fh=parseInt(p[0]),fm=parseInt(p[1]||0),h=getHaitiTime();return h.getHours()*60+h.getMinutes()<fh*60+fm;}
function getMyPrix(){return DB.prix?.global||{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000};}
function getTel(){return DB.config?.tel||'+52 7298079596';}
function getLogoUrl(){return DB.config?.logoUrl||localStorage.getItem('verite_logo')||'';}
function updatePriceBar(){let p=getMyPrix();let el=document.getElementById('priceInfo');if(el) el.innerHTML='M1='+p.m1+' M2='+p.m2+' M3='+p.m3+' | 1er '+p.p1;let hh=document.getElementById('heureHaiti');if(hh) hh.innerText='EST:'+formatHaiti(getHaitiTime());}
function saveTel(){let tel=document.getElementById('logoUrl').value.trim();if(db)db.ref('config/tel').set(tel);localStorage.setItem('verite_tel',tel);alert('Tel sove');}
function setMode(m){printerMode=m;localStorage.setItem('printerMode',m);['btnSunmi','btnBT','btnWeb'].forEach(id=>{let b=document.getElementById(id);b.style.background='#fff';b.style.color='#0a4a2e';});let a=document.getElementById(m==='sunmi'?'btnSunmi':m==='bt'?'btnBT':'btnWeb');a.style.background='#0a4a2e';a.style.color='#d4af37';document.getElementById('printer-status').innerText='Mòd: '+m.toUpperCase();if(m==='sunmi')forceInnerSync();}
function forceInnerSync(){bindSunmiService();let s=document.getElementById('sdkStatus');if(s) s.innerText=sunmiBound?'✅ Bound':'⏳ Binding...';}
function bindSunmiService(){try{if(window.InnerPrinterManager){try{window.InnerPrinterManager.getInstance().bindService(this,{onServiceConnected:s=>{sunmiPrinterService=s;sunmiBound=true;},onServiceDisconnected:()=>{sunmiBound=false;}});}catch(e){}}if(window.woyou&&window.woyou.printService){sunmiPrinterService=window.woyou.printService;sunmiBound=true;}if(window.sunmiPrinter){sunmiPrinterService=window.sunmiPrinter;sunmiBound=true;}if(!sunmiBound&&window.android){sunmiBound=true;sunmiPrinterService=window.android;}}catch(e){}}
async function connectBT(){
 if(!navigator.bluetooth){alert('Navigatè sa pa sipòte BT - itilize Chrome sou Android');return}
 try{
  document.getElementById('btStatus').innerText='BT: Ap chèche...';
  btDevice = await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['0000ff00-0000-1000-8000-00805f9b34fb','000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2']});
  let server = await btDevice.gatt.connect();
  let services = await server.getPrimaryServices();
  for(let svc of services){try{let chars=await svc.getCharacteristics();for(let ch of chars){if(ch.properties.write||ch.properties.writeWithoutResponse){btChar=ch;break;}}if(btChar)break;}catch(e){}}
  if(!btChar){document.getElementById('btStatus').innerText='BT: Pa jwenn ekriti';alert('Pa jwenn karakteristik - eseye lot imprimant');return}
  document.getElementById('btStatus').innerText='BT: ✅ '+btDevice.name;
  setMode('bt');alert('✅ Konekte ak '+btDevice.name+' - kounya VANN ap mache!');
 }catch(e){document.getElementById('btStatus').innerText='BT: ❌ '+e.message;alert('Erè BT: '+e.message);}
}
setMode(printerMode);
function listenDB(){if(!db){hideSplash();renderT();return}db.ref().on('value',snap=>{let v=snap.val()||{};DB.vendeurs=v.vendeurs||{};DB.tickets=v.tickets||{};DB.heures=v.heures||{};DB.prix=v.prix||{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000}};DB.config=v.config||{tel:'+52 7298079596'};renderT();updatePriceBar();hideSplash();forceInnerSync();});}
async function doLogin(){let s=document.getElementById('inputSerial').value.trim(),p=document.getElementById('inputPass').value.trim(),m=document.getElementById('loginMsg');if(!s||!p){m.innerText='Mete Serial';return}if(!db){CUR={_key:'15',serial:s,nom:'Tamouche'};localStorage.setItem('curV',JSON.stringify(CUR));openMain();return}let snap=await db.ref('vendeurs').once('value');let vs=snap.val()||{};let k=Object.keys(vs).find(k=>String(vs[k].serial)===String(s));let f=k?vs[k]:null;if(!f||String(f.pass)!==String(p)){m.innerText='Modpas pa bon';return}CUR=f;CUR._key=k;localStorage.setItem('curV',JSON.stringify(CUR));openMain();}
function openMain(){document.getElementById('loginPage').style.display='none';document.getElementById('mainPage').style.display='block';document.getElementById('mainPage').classList.add('show');document.getElementById('vName').innerText=CUR.nom||'Vendeur';listenDB();document.getElementById('bets').innerHTML='';addR();upd();}
function logout(){localStorage.clear();location.reload();}
function renderT(){let tlist=document.getElementById('tlist');if(!tlist)return;let html='<div style="grid-column:1/-1;display:flex;justify-content:space-between;background:#0a4a2e;color:#d4af37;padding:8px;border-radius:8px"><b>Tiraj EST</b><span onclick="document.getElementById(\'tlist\').classList.remove(\'open\')" style="background:#e11d48;color:#fff;padding:6px 12px;border-radius:6px">X</span></div>';TIRAJ_DEFAULT.forEach(t=>{let name=t[0],hp=getHeureProprio(name),open=isOpen(name),chk=selT.includes(name)?'checked':'',bg=open?'background:#dcfce7':'background:#fee2e2';html+='<label class="topt" style="'+bg+'"><input type="checkbox" value="'+name+'" '+chk+' '+(open?'':'disabled')+' onchange="chg(this)"><span>'+name+'</span><small>'+hp+'</small></label>';});tlist.innerHTML=html;}
function chg(el){if(!isOpen(el.value)&&el.checked){alert('Femen');el.checked=false;return}if(el.checked)selT.push(el.value);else selT=selT.filter(x=>x!=el.value);document.getElementById('txtT').innerText=selT.length?selT.length+' tiraj':'Chwazi';upd();if(selT.length)document.getElementById('tlist').classList.remove('open')}
function selAll(){selT=[];TIRAJ_DEFAULT.forEach(t=>{if(isOpen(t[0]))selT.push(t[0])});renderT();document.getElementById('txtT').innerText=selT.length?selT.length+' tiraj':'Chwazi';upd()}
function addR(){let c=document.getElementById('bets');let d=document.createElement('div');d.className='row betRow';d.innerHTML='<select class="jeu inp"><option value="boul">BOUL 2</option><option value="loto3">L3 3</option><option value="loto4">L4 4</option><option value="loto5">L5 5</option><option value="maryaj">MAR 4</option></select><input class="boul inpN" placeholder="--" oninput="this.value=this.value.replace(/\\D/g,\'\');upd()"><input class="mise inpN" placeholder="$" oninput="upd()" style="background:#e8f5e9"><button class="btnR" onclick="this.parentElement.remove();upd()">X</button><button class="btnF" onclick="nextLine(this)">></button>';c.appendChild(d);upd();return d;}
function nextLine(el){let row=el.closest('.betRow');let all=document.querySelectorAll('.betRow');if(row!==all[all.length-1]){row.nextElementSibling.querySelector('.boul').focus();return;}let nr=addR();setTimeout(()=>nr.querySelector('.boul').focus(),80);}
function upd(){let sum=0;document.querySelectorAll('.betRow').forEach(r=>{let mm=parseInt(r.querySelector('.mise').value)||0;if(r.querySelector('.boul').value.trim()&&mm)sum+=mm;});document.getElementById('dt').innerText='Total $'+sum+' x '+selT.length+' = $'+(sum*selT.length);document.getElementById('gt').innerText='$'+(sum*selT.length);}

// ✅ V23.1 BUILD - SANTRE + SAN SOULIYAJ - JAN FOTO WOUJ LA
function build(tk){
let hd=getHaitiTime();let W=32;
function center(t){t=String(t||'').trim().toUpperCase();if(t.length>=W) return t.substring(0,W);let l=Math.floor((W-t.length)/2);return ' '.repeat(l)+t;}
let tel=getTel(),prix=getMyPrix(),txt='';
txt+=center('C&D VERITE LOTTO')+'\n';
txt+=center('Fiche Original')+'\n\n';
txt+=center('POS: '+(CUR?._key||''))+'\n';
txt+=center('Vendeur: '+(CUR?.serial||'')+' '+(CUR?.nom||''))+'\n';
txt+=center('Tel: '+tel)+'\n';
txt+=center('Date: '+getHaitiDateStr()+' '+hd.getHours().toString().padStart(2,'0')+':'+hd.getMinutes().toString().padStart(2,'0')+' EST')+'\n\n';
selT.forEach(t=>{txt+=center(t+' - '+getHeureProprio(t))+'\n';});
txt+='\n';
tk.bets.forEach(b=>{let label=b.type==='boul'?'Borlette':b.type.toUpperCase();txt+=center(label+' '+b.numero+' $'+b.mise)+'\n';});
txt+='\n'+center('Total => '+tk.total+' HTG')+'\n';
txt+=center('Prix: 1er '+prix.p1+' 2e '+prix.p2+' 3e '+prix.p3)
txt+=center('Mèsi pou konfyans ou!')+'\n';
txt+=center(getHaitiDateStr()+' '+hd.getHours().toString().padStart(2,'0')+':'+hd.getMinutes().toString().padStart(2,'0')+' PM')+'\n\n\n\n';
return txt;
}
function showPreview(txt){const p=document.getElementById('prev');p.style.display='block';p.innerText=txt;}

async function printBT(t){
 if(isPrinting) return; isPrinting=true;
 let txt=(t||LAST_TXT||'').toString().replace(/<[^>]+>/g,'').trim();
 if(!txt){isPrinting=false;return;}
 try{
  if(printerMode==='bt'){
   if(!btChar){alert('⚠️ Konekte Bluetooth dabor! Peze KONEKTE BLUETOOTH');isPrinting=false;return;}
   try{
    let enc=new TextEncoder();
    let cmds='\x1B\x40\x1B\x61\x01'+txt+'\n\n\n\x1D\x56\x00';
    let data=enc.encode(cmds);
    for(let i=0;i<data.length;i+=100){await btChar.writeValue(data.slice(i,i+100));await new Promise(r=>setTimeout(r,80));}
    setTimeout(()=>{isPrinting=false;},1000);return;
   }catch(e){alert('Erè BT: '+e.message);}
  }
  if(printerMode==='web'){
   let html=`<html><head><style>@page{size:58mm auto;margin:0}body{margin:0;padding:3mm;width:58mm;font-family:monospace;font-weight:900;text-align:center}pre{white-space:pre-wrap;text-align:center;font-size:14px}</style></head><body><pre>${txt.replace(/</g,'&lt;')}</pre><script>setTimeout(()=>window.print(),400);<\/script></body></html>`;
   let ifr=document.createElement('iframe');ifr.style.display='none';document.body.appendChild(ifr);ifr.contentDocument.open();ifr.contentDocument.write(html);ifr.contentDocument.close();
   setTimeout(()=>{isPrinting=false;},2000);return;
  }
  // SUNMI V2 PRO - santre
  if(sunmiPrinterService&&sunmiBound){
   try{sunmiPrinterService.setAlignment(1);}catch(e){}
   if(sunmiPrinterService.printOriginalText){sunmiPrinterService.printOriginalText(txt+"\n\n\n\n",null);setTimeout(()=>{try{sunmiPrinterService.cutPaper(null);}catch(e){}},600);setTimeout(()=>{isPrinting=false;},2000);return;}
  }
  // Fallback web
  let html=`<html><head><style>@page{size:58mm auto;margin:0}body{margin:0;padding:3mm;width:58mm;font-family:monospace;text-align:center}pre{text-align:center}</style></head><body><pre>${txt.replace(/</g,'&lt;')}</pre><script>setTimeout(()=>window.print(),400);<\/script></body></html>`;
  let ifr=document.createElement('iframe');ifr.style.display='none';document.body.appendChild(ifr);ifr.contentDocument.open();ifr.contentDocument.write(html);ifr.contentDocument.close();
 }catch(e){console.log(e);}setTimeout(()=>{isPrinting=false;},2500);
}
