<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VENDEUR FIX DIMANSYON KAZ</title>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0;padding:0}
body{background:#fff;overflow-x:hidden}
.top-y{background:#FFD500;text-align:center;padding:12px;font-weight:900;font-size:15px}
.top-b{background:#000;color:#FFD500;text-align:center;padding:10px;font-weight:900}
.menu{display:flex;border:2px solid #000;border-left:none;border-right:none}
.menu button{flex:1;padding:13px 0;font-weight:900;background:#fff;border:none;border-right:2px solid #000;font-size:12px}
.menu button.active{background:#FFD500}
.limite{margin:10px;border:3px solid #FF0000;background:#FFD500;border-radius:22px;padding:12px;text-align:center;font-weight:900;font-size:12px}
.grid{padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.t-btn{border:3px solid #000;border-radius:25px;padding:0;height:52px;font-weight:900;background:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.t-btn.active{background:#FFD500}
.t-sel{margin:10px;border:3px solid #000;border-radius:25px;height:52px;display:flex;align-items:center;justify-content:center;font-weight:900;background:#fff}

/* FIX DIMANSYON KAZ EGZAK MENM AK TIRAJ */
.ligne{display:flex;gap:6px;padding:0 10px;margin-bottom:8px;width:100%}
.kaz-jeux{flex:1.1;min-width:0;height:52px;border:3px solid #000;border-radius:25px;font-weight:900;font-size:12px;text-align:center;background:#fff}
.kaz-boul{flex:0.9;min-width:0;height:52px;border:3px solid #000;border-radius:25px;font-weight:900;font-size:18px;text-align:center;background:#fff}
.kaz-miz{flex:0.9;min-width:0;height:52px;border:3px solid #000;border-radius:25px;font-weight:900;font-size:18px;text-align:center;background:#FFD500}
.btn-x{width:48px;min-width:48px;height:52px;border:3px solid #FF0000;color:#FF0000;background:#fff;border-radius:18px;font-weight:900;font-size:18px}
.btn-down{width:48px;min-width:48px;height:52px;border:3px solid #000;background:#FFD500;border-radius:18px;font-weight:900;font-size:16px}

.total{margin:10px;border:3px solid #000;border-radius:25px;height:52px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;text-align:center;padding:0 5px}
.btns{display:flex;gap:10px;padding:10px}
.bb{flex:1;height:56px;border:3px solid #000;border-radius:28px;font-weight:900}.black{background:#000;color:#FFD500}.green{background:#0A9A0A;color:#FF0}
.onglet{display:none}.onglet.active{display:block}
.kf{width:calc(100% - 20px);margin:8px 10px;border:3px solid #000;border-radius:25px;height:52px;text-align:center;font-weight:900}
.box{margin:10px;border:2px solid #000;border-radius:12px;padding:10px;background:#FFF8DC;font-weight:900;font-size:12px}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;text-align:center;font-size:28px;font-weight:900;line-height:1.8}}
</style>
</head>
<body>

<div class="top-y">VENDEUR - JEAN - V7.9 FIX BOUL + LIMITE</div>
<div class="top-b" id="dateBar"></div>

<div class="menu">
<button class="active" id="m1" onclick="openO(1)">1.VENTE</button>
<button id="m2" onclick="openO(2)">2.KOPYE</button>
<button id="m3" onclick="openO(3)">3.FICHES</button>
<button id="m4" onclick="openO(4)">4.RAPPORT</button>
</div>

<div id="o1" class="onglet active">
<div class="limite">Limite Global Vandè1+Vandè2+... Respekte - Bòlèt 1500 Maryaj 100 L3 100 L4 20 L5 5</div>
<div class="grid" id="grid"></div>
<div class="t-sel" id="tSel"></div>

<div id="container"></div>

<div class="total" id="totalBar">Total ×tiraj - $0 × 1 = $0 - Flèche ↓ kenbe je</div>

<div class="btns">
<button class="bb black" onclick="valider(false)">💾 VALIDER</button>
<button class="bb green" onclick="valider(true)">🖨️ VALIDER + IMPRIMER SANTRÉ</button>
</div>
</div>

<div id="o2" class="onglet"><input id="idT" class="kf" placeholder="ID Ticket"><button class="bb black" style="margin:10px" onclick="copier()">KOPIYE</button><div id="resC"></div></div>
<div id="o3" class="onglet"><input type="date" id="dateF" class="kf"><input id="searchF" class="kf" placeholder="Recherche..." oninput="renderF()"><div id="listF"></div></div>
<div id="o4" class="onglet"><input type="date" id="du" class="kf"><input type="date" id="au" class="kf"><select id="filT" class="kf"><option value="TOUS">Tous Tirages</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><button onclick="jenereR()" style="width:calc(100% - 20px);margin:10px;height:52px;border-radius:25px;background:#FFD500;border:3px solid #000;font-weight:900">📊 JENERE RAPÒ</button><div id="rapV" class="box" style="background:#fff"></div></div>

<div id="printArea" style="display:none"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = { apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4", authDomain:"cd-lotto.firebaseapp.com", databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com", projectId:"cd-lotto", storageBucket:"cd-lotto.firebasestorage.app", messagingSenderId:"671091732195", appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6" };
const app=initializeApp(firebaseConfig); const db=getDatabase(app);

let tirajChwazi=["FL SOIR"];
let lignes=[{type:"BOLET",boul:"",miz:""},{type:"BOLET",boul:"",miz:""},{type:"BOLET",boul:"",miz:""}];
const tirajList=["GA MIDI","FL MIDI","NY MIDI","GA SOIR","FL SOIR","NY SOIR"];

function norm(b){ if(!b)return""; b=b.replace(/[^0-9x]/gi,''); if(!b.includes('x')&&b.length==4) b=b.slice(0,2)+'x'+b.slice(2); const p=b.toLowerCase().split('x'); if(p.length==2) return [p[0],p[1]].sort().join('x'); return b; }

window.openO=function(n){ document.querySelectorAll('.onglet').forEach(o=>o.classList.remove('active')); document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active')); document.getElementById('o'+n).classList.add('active'); document.getElementById('m'+n).classList.add('active'); if(n==3)renderF(); }
function renderT(){ const g=document.getElementById('grid'); g.innerHTML=""; tirajList.forEach(t=>{ const a=tirajChwazi.includes(t); g.innerHTML+=`<button class="t-btn ${a?'active':''}" onclick="toggleT('${t}')">${t} ${a?'✓':''}</button>`}); document.getElementById('tSel').innerText=tirajChwazi.join(' / ')+' ✓'; }
window.toggleT=function(t){ if(tirajChwazi.includes(t)){ if(tirajChwazi.length>1) tirajChwazi=tirajChwazi.filter(x=>x!==t);} else tirajChwazi.push(t); renderT(); calc(); }

window.renderV=function(){
  const c=document.getElementById('container'); c.innerHTML="";
  lignes.forEach((l,i)=>{
    c.innerHTML+=`<div class="ligne">
      <select class="kaz-jeux" onchange="lignes[${i}].type=this.value">
        <option ${l.type=="BOLET"?"selected":""}>BOLET</option>
        <option ${l.type=="MARYAJ"?"selected":""}>MARYAJ</option>
        <option ${l.type=="LOTO3"?"selected":""}>LOTO3</option>
        <option ${l.type=="LOTO4"?"selected":""}>LOTO4</option>
        <option ${l.type=="LOTO5"?"selected":""}>LOTO5</option>
      </select>
      <input class="kaz-boul" placeholder="Boul" value="${l.boul}" oninput="lignes[${i}].boul=this.value;calc()" inputmode="numeric" enterkeyhint="next">
      <input class="kaz-miz" placeholder="Miz" value="${l.miz}" oninput="this.value=this.value.replace(/[^0-9]/g,'');lignes[${i}].miz=this.value;calc()" inputmode="numeric" enterkeyhint="next">
      <button class="btn-x" onclick="supp(${i})">X</button>
      <button class="btn-down" onclick="down(${i})">↓</button>
    </div>`;
  });
}
window.supp=function(i){ lignes.splice(i,1); if(lignes.length==0) lignes=[{type:"BOLET",boul:"",miz:""}]; renderV(); calc(); }
window.down=function(i){
  // TOUCHE FLECHE POUR AVANCER A LA LIGNE SUIVANTE CONSERVANT LE JEU SELECTIONNE
  const jeuConserve = lignes[i].type;
  lignes.splice(i+1,0,{type:jeuConserve,boul:"",miz:""});
  renderV(); calc();
  setTimeout(()=>{ const next=document.querySelectorAll('.ligne')[i+1]?.querySelector('.kaz-boul'); next?.focus(); },60);
}
window.calc=function(){
  const v=lignes.filter(f=>f.boul.trim()!=""&&f.miz.trim()!="");
  const base=v.reduce((s,f)=>s+(parseInt(f.miz)||0),0);
  document.getElementById('totalBar').innerText=`Total ×tiraj - $${base} × ${tirajChwazi.length} = $${base*tirajChwazi.length} - Flèche ↓ kenbe je`;
}
window.valider=async function(doPrint){
  const valides=lignes.filter(f=>f.boul.trim()!=""&&f.miz.trim()!="").map(f=>({...f,boul:f.type=="MARYAJ"?norm(f.boul):f.boul}));
  if(valides.length==0) return;
  const dateStr=new Date().toISOString().slice(0,10); const id="T-"+Date.now().toString().slice(-6);
  const tot=valides.reduce((s,f)=>s+(parseInt(f.miz)||0),0)*tirajChwazi.length;
  // Limite Global
  const snap=await get(ref(db,`ventes/${dateStr}`)); let g={BOLET:0,MARYAJ:0,LOTO3:0,LOTO4:0,LOTO5:0};
  if(snap.exists()){ Object.values(snap.val()).forEach(vs=>Object.values(vs).forEach(fc=>fc.fiches.forEach(x=>{g[x.type]=(g[x.type]||0)+parseInt(x.miz);}))) }
  const lim={BOLET:1500,MARYAJ:100,LOTO3:100,LOTO4:20,LOTO5:5};
  for(let f of valides){ if((g[f.type]||0)+parseInt(f.miz)>lim[f.type]){ alert(`LIMITE GLOBAL ${f.type} DEPASE`); return; } }
  await push(ref(db,`ventes/${dateStr}/JEAN`),{id,tiraj:tirajChwazi,fiches:valides,total:tot,date:dateStr,timestamp:Date.now(),vendeur:"JEAN"});
  const printHTML=`C&D VÉRITÉ LOTTO<br>Date ${dateStr}<br>Tirages ${tirajChwazi.join('/')} <br>Responsable JEAN<br>Ticket ${id}<br>----------------<br>${valides.map(f=>`${f.type} ${f.boul} $${f.miz}`).join('<br>')}<br>----------------<br>TOTAL $${tot}<br><br>Bòn chans, lave chodyè w`;
  document.getElementById('printArea').innerHTML=printHTML;
  if(doPrint){ document.getElementById('printArea').style.display='block'; window.print(); document.getElementById('printArea').style.display='none'; }
  lignes=[{type:lignes[lignes.length-1].type,boul:"",miz:""}]; renderV(); calc();
}
window.copier=async function(){ const id=document.getElementById('idT').value.trim(); if(!id)return; const snap=await get(ref(db,`ventes`)); let found=null; snap.forEach(d=>{d.forEach(v=>{Object.values(v.val()).forEach(f=>{if(f.id==id) found=f;})})}); if(found){ lignes=found.fiches.map(x=>({...x})); tirajChwazi=found.tiraj; openO(1); renderT(); renderV(); calc(); } }
window.renderF=async function(){ const dateFil=document.getElementById('dateF').value||new Date().toISOString().slice(0,10); const s=document.getElementById('searchF').value.toLowerCase(); const snap=await get(ref(db,`ventes/${dateFil}/JEAN`)); const cont=document.getElementById('listF'); cont.innerHTML=""; if(!snap.exists()) return; Object.values(snap.val()).filter(f=>JSON.stringify(f).toLowerCase().includes(s)).forEach(f=>{cont.innerHTML+=`<div class=box style=background:#fff><b>${f.id}</b> - ${f.tiraj.join('+')} - $${f.total}<br>${f.fiches.map(x=>x.type+' '+x.boul+' $'+x.miz).join('<br>')}</div>`}); }
window.jenereR=async function(){ const du=document.getElementById('du').value||new Date().toISOString().slice(0,10); const snap=await get(ref(db,`ventes/${du}`)); let vente=0; if(snap.exists()&&snap.child('JEAN').exists()){ Object.values(snap.val().JEAN).forEach(f=>{ vente+=f.total; }); } document.getElementById('rapV').innerHTML=`Vente $${vente}<br>Commission $${vente*0.1}<br>Balance $${vente*0.9}`; }

document.getElementById('dateBar').innerText=new Date().toISOString().slice(0,10)+" | JEAN | 10%";
renderT(); renderV(); calc();
</script>
</body>
</html>
