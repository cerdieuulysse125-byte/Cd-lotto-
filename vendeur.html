<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VANDE V117.8 FINAL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f2f2f2}
.h{background:#111;color:#fff;padding:12px;text-align:center;font-weight:bold}
.tabs{display:flex;background:#fff;position:sticky;top:0;z-index:10}
.tab{flex:1;padding:10px;text-align:center;border-bottom:3px solid #0000;cursor:pointer;font-size:12px}
.tab.active{border-color:#111;font-weight:bold;background:#eee}
.ong{display:none;padding:8px}.ong.active{display:block}
.card{background:#fff;padding:12px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tiraj6{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.tiraj6 label{background:#eee;padding:9px;border-radius:8px;font-size:11px;text-align:center}
.rowH{display:grid;grid-template-columns:85px 1fr 1fr;gap:10px;font-weight:bold;font-size:11px;text-align:center;margin:10px 0 6px}
.row{display:grid;grid-template-columns:85px 1fr 1fr;gap:10px;margin:10px 0;align-items:center}
.jeuxSelect{padding:16px 4px!important;font-size:11px!important;border:2px solid #111!important;border-radius:12px!important;text-align:center;background:#111;color:#fff;font-weight:bold;width:100%}
.boulInput{padding:18px 8px!important;font-size:22px!important;border:3px solid #000!important;border-radius:12px!important;text-align:center;background:#FFF9C4!important;font-weight:bold;width:100%}
.mizInput{padding:18px 8px!important;font-size:22px!important;border:3px solid #2E7D32!important;border-radius:12px!important;text-align:center;background:#E8F5E9!important;color:#2E7D32!important;font-weight:bold;width:100%}
.btn{width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:10px;font-weight:bold}
.login{position:fixed;inset:0;background:#111;display:flex;align-items:center;justify-content:center;z-index:9999}
.loginBox{background:#fff;padding:20px;border-radius:12px;width:92%;max-width:360px}
#ticket{display:none;width:100%;justify-content:center}
.ticket-thermal{width:80mm;margin:0 auto;padding:6mm;font-family:'Courier New',monospace;color:#000;background:#fff;text-align:center;font-size:15px;line-height:1.5}
@media print{@page{size:80mm auto;margin:2mm}body *{visibility:hidden}#ticket,#ticket *{visibility:visible}#ticket{display:flex!important;position:absolute;left:0;top:0;width:100%;background:#fff}}
</style></head><body>

<div class="login" id="loginBox"><div class="loginBox">
<h3 style="text-align:center">C&D VÉRITÉ LOTTO</h3>
<p style="text-align:center;font-size:11px">KONEKTE AK PROPRIO - MODPAS OBLIGATWA</p>
<input id="codeV" placeholder="Kòd Vandè ex: Jules" style="width:100%;padding:12px;margin:5px 0;border-radius:8px;border:2px solid #111">
<input id="passV" type="password" placeholder="Modpas - menm ak Proprio" style="width:100%;padding:12px;margin:5px 0;border-radius:8px;border:2px solid #111">
<button class="btn" onclick="login()">ANTRE</button>
<div id="msgLogin" style="color:red;text-align:center;margin-top:8px;font-size:11px;white-space:pre-line"></div>
<div id="debug" style="font-size:10px;background:#eee;padding:6px;border-radius:6px;margin-top:8px;max-height:80px;overflow:auto"></div>
</div></div>

<div class="h">C&D VERITE - <span id="nomV"></span> <span onclick="logout()" style="float:right;font-size:11px">[Sòti]</span></div>
<div class="tabs"><div class="tab active" onclick="go(0)">1.Vendre</div><div class="tab" onclick="go(1)">2.Kopye</div><div class="tab" onclick="go(2)">3.Mes Fiches</div><div class="tab" onclick="go(3)">4.Rapport</div></div>

<div class="ong active" id="o0"><div class="card">
<div class="tiraj6" id="tiraj6"></div>
<div class="rowH"><div>Jeux</div><div>Boul</div><div>Miz</div></div>
<div id="lignes"></div>
<div style="text-align:center;font-size:10px;color:#666">1 liy selman - Flèche → conserve jeux - bolet2 loto3-3 maryaj/loto4-4 loto5-5</div>
<div class="total" id="total">Total x Tiraj: 0</div>
<button class="btn" onclick="valider()">VALIDER + IMPRIMER</button>
<div id="ticket"></div>
</div></div>

<div class="ong" id="o1"><div class="card"><input id="codeKopi" placeholder="ID Ticket" style="width:100%;padding:14px;text-align:center;text-transform:uppercase;border:3px solid #111;border-radius:12px"><button class="btn" onclick="kopye()" style="margin-top:6px">Kopye</button><div id="resKopye"></div></div></div>
<div class="ong" id="o2"><div class="card"><div id="mesFiches"></div></div></div>
<div class="ong" id="o3"><div class="card">
<input type="date" id="du" style="width:100%;padding:12px;margin:4px 0;border-radius:8px;border:2px solid #111">
<input type="date" id="au" style="width:100%;padding:12px;margin:4px 0;border-radius:8px;border:2px solid #111">
<select id="fTiraj" style="width:100%;padding:12px;border-radius:8px;border:2px solid #111"><option value="tous">Tous Tiraj</option><option>GA midi</option><option>FL midi</option><option>NY midi</option><option>GA soir</option><option>FL soir</option><option>NY soir</option></select>
<button class="btn" onclick="genRap()" style="margin-top:6px">Rapport</button>
<div id="zoneRap"></div>
</div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD...",
  authDomain: "d-lotto.firebaseapp.com",
  projectId: "d-lotto",
  storageBucket: "d-lotto.appspot.com",
  messagingSenderId: "xxx",
  appId: "1:xxx:web:xxx"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let lignes=[],TIRAJ=["GA midi","FL midi","NY midi","GA soir","FL soir","NY soir"],FERMETURE={},PRIX={bolet:[50,20,10],maryaj:1000},vendeurActif=null,fiches=[],resultats={};
const REGLES={bolet:{len:2},maryaj:{len:4},loto3:{len:3},loto4:{len:4},loto5:{len:5}};

db.collection("config").doc("settings").onSnapshot(d=>{if(d.exists){FERMETURE=d.data().fermeture||{};PRIX=d.data().prix||PRIX;if(vendeurActif)initTiraj();}});
db.collection("resultats").onSnapshot(s=>{resultats={};s.forEach(doc=>{resultats[doc.id]=doc.data();});});

function refreshDebug(){db.collection("vendeurs").get().then(q=>{let txt=`Vendeur Firebase: ${q.size}\n`;q.forEach(d=>{let v=d.data();txt+=`- ${v.nom||d.id} / ${v.pass||v.modpas||''} perc:${v.perc||10}%\n`;});document.getElementById('debug').innerText=txt;}).catch(e=>{document.getElementById('debug').innerText=e.message;});}
refreshDebug();

function login(){
 let c=document.getElementById('codeV').value.trim(),p=document.getElementById('passV').value.trim();
 if(!c||!p){document.getElementById('msgLogin').textContent="MODPAS OBLIGATWA";return;}
 document.getElementById('msgLogin').textContent="Ap konekte ak Proprio...";
 if(c.toLowerCase()=="admin"&&p=="admin"){vendeurActif={nom:"admin",perc:10};doneLogin();return;}
 db.collection("vendeurs").get().then(q=>{
  if(q.size==0){document.getElementById('msgLogin').textContent="Okenn vendeur nan Proprio - Kreye nan Proprio";return;}
  let found=null;
  q.forEach(doc=>{let v=doc.data();let nom=(v.nom||v.code||doc.id).toString().trim();let pass=(v.pass||v.modpas||v.password||"").toString().trim();if(nom.toLowerCase()==c.toLowerCase()&&pass==p){found=v;found.nom=nom;}});
  if(!found){document.getElementById('msgLogin').textContent="Modpas pa bon - dwe menm ak Proprio";refreshDebug();return;}
  if(found.etat=="ferme"){document.getElementById('msgLogin').textContent="Vandè fèmen";return;}
  vendeurActif=found;doneLogin();
 });
}
function doneLogin(){localStorage.setItem('vendeurActif',JSON.stringify(vendeurActif));document.getElementById('loginBox').style.display='none';document.getElementById('nomV').textContent=vendeurActif.nom;initTiraj();document.getElementById('lignes').innerHTML="";lignes=[];addLigne();calc();loadFiches();}
function logout(){localStorage.removeItem('vendeurActif');location.reload();}
let saved=JSON.parse(localStorage.getItem('vendeurActif')||'null');if(saved){vendeurActif=saved;document.getElementById('loginBox').style.display='none';document.getElementById('nomV').textContent=saved.nom;}

function go(i){document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k==i));document.querySelectorAll('.ong').forEach((o,k)=>o.classList.toggle('active',k==i));}
function initTiraj(){let cur=new Date().getHours()*60+new Date().getMinutes();let html="";TIRAJ.forEach(t=>{let tm=(FERMETURE[t]||"23:59");let[hh,mm]=tm.split(':').map(Number);let f=hh*60+mm;let dis=cur>=f?"disabled":"";html+=`<label><input type="checkbox" value="${t}" ${dis}> ${t}</label>`;});document.getElementById('tiraj6').innerHTML=html;}
function addLigne(j="bolet",b="",m=""){if(lignes.length>0&&j=="bolet"){let last=document.getElementById(`j_${lignes.length-1}`)?.value;if(last)j=last;}let idx=lignes.length;let opt=Object.keys(REGLES).map(o=>`<option value="${o}" ${o==j?'selected':''}>${o.toUpperCase()} (${REGLES[o].len})</option>`).join('');let div=document.createElement('div');div.className='row';div.innerHTML=`<select class="jeuxSelect" id="j_${idx}" onchange="changeJeux(${idx})">${opt}</select><input class="boulInput" id="b_${idx}" value="${b}" inputmode="numeric" maxlength="${REGLES[j].len}" placeholder="${REGLES[j].len} chif" onkeydown="handleKey(event,${idx},1)" oninput="validateChif(${idx});calc()"><input class="mizInput" id="m_${idx}" value="${m}" inputmode="numeric" placeholder="Miz" onkeydown="handleKey(event,${idx},2)" oninput="calc()">`;document.getElementById('lignes').appendChild(div);lignes.push(div);if(b==""&&m=="")setTimeout(()=>document.getElementById(`b_${idx}`)?.focus(),30);}
function changeJeux(idx){let j=document.getElementById(`j_${idx}`).value;let b=document.getElementById(`b_${idx}`);b.maxLength=REGLES[j].len;b.placeholder=REGLES[j].len+" chif";b.value="";}
function validateChif(idx){let b=document.getElementById(`b_${idx}`);let v=b.value.replace(/\D/g,'');let need=REGLES[document.getElementById(`j_${idx}`).value].len;if(v.length>need)v=v.slice(0,need);b.value=v;}
function handleKey(e,idx,col){if(e.key==="Enter"||e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();if(col==1){document.getElementById(`m_${idx}`)?.focus();document.getElementById(`m_${idx}`)?.select();}else{let b=document.getElementById(`b_${idx}`).value,m=document.getElementById(`m_${idx}`).value;if(b&&m)addLigne(document.getElementById(`j_${idx}`).value);}}if(e.key==="ArrowLeft"){e.preventDefault();if(col==2)document.getElementById(`b_${idx}`)?.focus();}}
function calc(){let tot=0,sel=document.querySelectorAll('#tiraj6 input:checked').length||1;lignes.forEach((r,i)=>{tot+=parseFloat(document.getElementById(`m_${i}`)?.value)||0;});document.getElementById('total').textContent=`Total x Tiraj (${sel}): ${tot} x ${sel} = ${tot*sel}`;return tot*sel;}
function valider(){
 let tirajs=[...document.querySelectorAll('#tiraj6 input:checked')].map(i=>i.value);if(!tirajs.length)return alert("Chwazi tiraj");
 let data=[];lignes.forEach((r,i)=>{let jeux=document.getElementById(`j_${i}`)?.value,b=document.getElementById(`b_${i}`)?.value.trim(),m=parseFloat(document.getElementById(`m_${i}`)?.value)||0;if(b&&m&&b.length==REGLES[jeux].len)data.push({jeux,boule:b,miz:m});});
 if(!data.length)return alert("Antre boul");
 let code=Math.random().toString(36).substr(2,5).toUpperCase();let now=new Date();let dateStr=now.toLocaleDateString('fr-HT')+" "+now.toLocaleTimeString('fr-HT',{hour:'2-digit',minute:'2-digit'});let total=calc();
 let html=`<div class="ticket-thermal"><div style="font-size:20px;font-weight:bold">C&D VÉRITÉ LOTTO</div><div>Date: ${dateStr}<br>Tirage: ${tirajs.join(' / ')}<br>Id ticket: ${code}<br>Vendeur: ${vendeurActif.nom}</div><div>................................................</div><div style="text-align:left">${data.map(d=>`<div style="display:flex;justify-content:space-between;font-size:17px;font-weight:bold;padding:4px 0;border-bottom:1px dotted #999"><span>${d.jeux.toUpperCase()} ${d.boule}</span><span>${d.miz} G</span></div>`).join('')}<div style="text-align:right;font-weight:bold;border-top:2px solid #000;margin-top:6px;padding-top:6px;font-size:18px">Total: ${total} G</div></div><div style="border-top:2px dashed #000;margin-top:10px;padding-top:8px">Bonne chance<br>Merci!</div></div>`;
 document.getElementById('ticket').innerHTML=html;document.getElementById('ticket').style.display='flex';
 db.collection("fiches").doc(code).set({code,date:new Date().toISOString().slice(0,10),dateFull:dateStr,tirajs,lignes:data,total,vendeur:vendeurActif.nom,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
 setTimeout(()=>window.print(),400);setTimeout(()=>{document.getElementById('lignes').innerHTML="";lignes=[];addLigne(data[data.length-1]?.jeux||'bolet');calc();document.getElementById('ticket').style.display='none';},900);
}
function loadFiches(){if(!vendeurActif)return;db.collection("fiches").where("vendeur","==",vendeurActif.nom).where("date","==",new Date().toISOString().slice(0,10)).onSnapshot(s=>{fiches=[];s.forEach(d=>fiches.push(d.data()));document.getElementById('mesFiches').innerHTML=fiches.map(f=>`${f.code} - ${f.tirajs.join(',')} - ${f.total}G`).join('<br>')||"Okenn";});}
function kopye(){let c=document.getElementById('codeKopi').value.toUpperCase().trim();if(!c)return;db.collection("fiches").doc(c).get().then(d=>{if(!d.exists){document.getElementById('resKopye').innerHTML="Pa jwenn";return;}let f=d.data();document.getElementById('resKopye').innerHTML=`${f.code}<br>${f.lignes.map(l=>l.jeux+' '+l.boule+' '+l.miz).join('<br>')}<br><button class="btn" onclick="loadKopi('${f.code}')">Chaje</button>`;});}
function loadKopi(code){db.collection("fiches").doc(code).get().then(d=>{let f=d.data();go(0);document.getElementById('lignes').innerHTML="";lignes=[];f.lignes.forEach(l=>addLigne(l.jeux,l.boule,l.miz));});}

function genRap(){
 let duRaw=document.getElementById('du').value,auRaw=document.getElementById('au').value,fT=document.getElementById('fTiraj').value;
 function normDate(v){if(!v)return"";if(v.includes('/')){let p=v.split('/');return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;}return v;}
 let du=normDate(duRaw),au=normDate(auRaw);
 if(!du){alert("Chwazi dat depi");return;}if(!au)au=du;
 document.getElementById('zoneRap').innerHTML="Ap kalkile...";
 db.collection("fiches").where("vendeur","==",vendeurActif.nom).get().then(snap=>{
  let vTot=0,cTot=0,pTot=0,nb=0;
  let perc=parseFloat(vendeurActif.perc||10);
  snap.forEach(doc=>{
   let fd=doc.data();if(!fd.date)return;let fdDate=normDate(fd.date);if(fdDate<du||fdDate>au)return;
   let hasTir=false;if(fT=="tous"||fT=="Tous Tiraj")hasTir=true;else if(fd.tirajs&&fd.tirajs.includes(fT))hasTir=true;if(!hasTir)return;
   nb++;
   fd.lignes.forEach(l=>{
    let nbTir=(fT=="tous"||fT=="Tous Tiraj")?(fd.tirajs.length||1):1;
    let mizTot=(parseFloat(l.miz)||0)*nbTir;
    vTot+=mizTot;
    cTot+=mizTot*perc/100;
    fd.tirajs.forEach(tir=>{
     if(fT!="tous"&&fT!="Tous Tiraj"&&tir!=fT)return;
     let re=resultats[fdDate]&&resultats[fdDate][tir];
     let pay=0;
     if(re){
      if(l.jeux=='bolet'){if(l.boule==re.p1)pay=l.miz*(PRIX.bolet?.[0]||50);else if(l.boule==re.p2)pay=l.miz*(PRIX.bolet?.[1]||20);else if(l.boule==re.p3)pay=l.miz*(PRIX.bolet?.[2]||10);}
     }
     if(pay>0)pTot+=pay;
    });
   });
  });
  if(nb==0){document.getElementById('zoneRap').innerHTML=`<div style="color:red;padding:10px;background:#ffebee;border-radius:8px">Okenn fich soti ${du} rive ${au} | Vendeur ${vendeurActif.nom} | Total fich nan DB: ${snap.size}</div>`;return;}
  let balance=vTot-cTot-pTot;
  let html=`<div style="border:2px solid #111;padding:14px;margin-top:10px;background:#fff;border-radius:10px">
  <div style="text-align:center;font-weight:bold">C&D VÉRITÉ LOTTO<br>RAPPORT - ${vendeurActif.nom}<br><small>${du} → ${au} | ${fT}</small></div>
  <hr style="border:1px dashed #000">
  <div style="font-size:16px;line-height:2.2">
    <div style="display:flex;justify-content:space-between;border-bottom:1px dotted #aaa"><span>Vente......</span><b>${vTot.toFixed(0)} G</b></div>
    <div style="display:flex;justify-content:space-between;border-bottom:1px dotted #aaa"><span>Commission.... (${perc}%)</span><b>${cTot.toFixed(0)} G</b></div>
    <div style="display:flex;justify-content:space-between;border-bottom:1px dotted #aaa"><span>A payer......</span><b>${pTot.toFixed(0)} G</b></div>
    <hr>
    <div style="display:flex;justify-content:space-between;background:#111;color:#fff;padding:12px;border-radius:8px;font-size:19px"><span>Balance net:....</span><b>${balance.toFixed(0)} G</b></div>
  </div>
  <div style="text-align:center;margin-top:8px;font-size:11px;color:#666">${nb} fich | Formil: Vente - Commission - A payer = Balance net</div>
  </div>`;
  document.getElementById('zoneRap').innerHTML=html;
 }).catch(e=>{document.getElementById('zoneRap').innerHTML="Erè: "+e.message;});
}
if(vendeurActif){initTiraj();addLigne();loadFiches();}
</script></body></html>
