<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V106 LYE + FLECH</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:bold}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:12px;border:2px solid #000;border-radius:10px;width:100%;font-size:16px;margin:4px 0;background:#fff}.line{display:grid;grid-template-columns:80px 1fr 70px;gap:6px;margin:5px 0}.tiraj{padding:7px 11px;margin:3px;border:2px solid #000;border-radius:20px;font-weight:bold;display:inline-block;font-size:13px;cursor:pointer}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{background:#eee;color:#aaa;pointer-events:none;opacity:.5}.btn{padding:13px;width:100%;border:none;border-radius:11px;font-weight:bold;font-size:16px;margin:6px 0}.bK{background:#000;color:#FFD700}.ticket{border:2px dashed #000;padding:12px;text-align:center;max-width:360px;margin:auto}.tab2{display:flex;background:#000;gap:1px}.tab2 button{flex:1;padding:11px 2px;font-size:12px;font-weight:bold;background:#000;color:#FFD700;border:none}.tab2 button.active{background:#FFD700;color:#000}.blocked{position:fixed;inset:0;background:rgba(0,0,0,0.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;text-align:center;padding:20px}@media print{body *{visibility:hidden}#prt,#prt *{visibility:visible}#prt{position:absolute;left:0;top:0;width:100%}}</style>
</head><body>
<div class="h">C&D LOTTO - V106 FLECH</div>
<div id="blockedBox" class="blocked" style="display:none"><div style="font-size:60px">🔒</div><h1>VANDEUR FERMÉ</h1><p id="blockedMsg">Proprio fèmen ou</p><button class="btn bK" style="max-width:200px" onclick="location.reload()">Réessayer</button></div>
<div id="loginBox" class="card" style="text-align:center;padding-top:30px"><h2>Connexion</h2><input id="uName" value="Tamouche"><input id="uPass" type="password" value="1234"><button class="btn bK" onclick="go()">Antre</button><div id="loginErr" style="color:red;margin-top:10px"></div></div>
<div id="appBox" style="display:none">
<div class="tab2"><button id="btnV" class="active" onclick="showTab('vendre')">Vendre</button><button id="btnF" onclick="showTab('fichesTab')">Fiches</button><button id="btnK" onclick="showTab('kopyeTab')">Kopye</button><button id="btnR" onclick="showTab('rapportTab')">Rapport</button></div>
<div id="vendre" class="card">
<div style="text-align:center;font-weight:bold;font-size:12px">TIRAJ - <span id="dateToday" style="background:#FFD700;color:#000;padding:2px 6px;border-radius:6px"></span> - <span id="statusV" style="padding:2px 6px;border-radius:6px;background:green;color:#fff;font-size:11px">OUVE</span> <span style="font-size:9px;color:#666">↓/Enter=avanse</span></div>
<div id="tirajBox" style="text-align:center;margin:8px 0"></div>
<div style="display:flex;background:#000;color:#FFD700;padding:6px;font-weight:bold;border-radius:6px;font-size:12px"><div style="width:80px">JEUX</div><div style="flex:1">BOUL</div><div style="width:70px">MIZ</div></div>
<div id="lines"></div>
<button class="btn" style="background:#222;color:#fff" onclick="addLine()">+ Liy</button>
<div style="background:#000;color:#fff;padding:10px;border-radius:10px;text-align:center;margin-top:6px">Total <span id="tot">0$</span> × <span id="nbT">1</span><div style="font-size:22px;color:#FFD700;font-weight:bold">A PEYE <span id="paye">0$</span></div></div>
<button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button>
<div id="prt" style="display:none"></div>
</div>
<div id="fichesTab" class="card" style="display:none"><h3>Mes Fiches - <span id="mn"></span></h3><div id="listF"></div></div>
<div id="kopyeTab" class="card" style="display:none"><h3>🔍 Kopye</h3><input id="searchId" type="tel" placeholder="ID 5 chif"><button class="btn bK" onclick="searchById()">Chèche</button><div id="resKopye"></div></div>
<div id="rapportTab" class="card" style="display:none"><h3>Rapò</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="rapDu" type="date"><input id="rapAu" type="date"></div><button class="btn bK" onclick="genRap()">Générer</button><div id="rapData"></div></div>
</div>
<script>
// MENM BAZ AK PROPRIO V118 POU LIYE A
const firebaseConfig={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let curUser=null, selectedT=[], config={};
let tirajDef=[{id:'gaMidi',nom:'GA MIDI',h:'12:15',m:735},{id:'flMidi',nom:'FL MIDI',h:'13:15',m:795},{id:'nyMidi',nom:'NY MIDI',h:'14:15',m:855},{id:'gaSoir',nom:'GA SOIR',h:'18:15',m:1095},{id:'flSoir',nom:'FL SOIR',h:'21:20',m:1280},{id:'nySoir',nom:'NY SOIR',h:'21:30',m:1290}];
function getHaitiDate(){ const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getESTHM(){ const now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return now.getHours()*60+now.getMinutes(); }
function go(){
  const u=document.getElementById('uName').value.trim().toLowerCase();
  const p=document.getElementById('uPass').value.trim();
  db.ref('vendors/'+u).once('value',s=>{
    if(!s.exists()){ curUser={name:u}; initApp(); return; }
    const v=s.val(); if(v.pass && v.pass!==p){ document.getElementById('loginErr').innerText="Modpas pa bon"; return; }
    if((v.status||'OUVE')==='FERME'){ document.getElementById('blockedBox').style.display='flex'; return; }
    curUser={name:u, data:v}; initApp();
  });
}
function initApp(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('appBox').style.display='block';
  document.getElementById('mn').innerText=curUser.name;
  document.getElementById('dateToday').innerText=getHaitiDate();
  document.getElementById('rapDu').value=getHaitiDate(); document.getElementById('rapAu').value=getHaitiDate();
  // LYE AK PROPRIO - TANDE CONFIG
  db.ref('config').on('value',snap=>{ config=snap.val()||{}; renderTiraj(); checkBlocked(); });
  addLine(); addLine(); addLine();
  setInterval(checkBlocked,10000);
}
function renderTiraj(){
  const he=config.heures||{}; const ti=config.tirages||{}; let html=''; const cur=getESTHM();
  tirajDef.forEach(t=>{
    const realH=he[t.id]||t.h; const [hh,mm]=realH.split(':').map(Number); const m=hh*60+mm;
    const fermeManuel=ti[t.id]==='FERME'; const fermeHeure=cur>=m; const isFerme=fermeManuel||fermeHeure;
    const active=selectedT.includes(t.nom);
    html+=`<span class="tiraj ${active?'active':''} ${isFerme?'ferme':''}" onclick="toggleTiraj('${t.nom}')">${t.nom}<br><small>${realH}</small></span>`;
  });
  document.getElementById('tirajBox').innerHTML=html; calc();
}
function toggleTiraj(nom){ if(selectedT.includes(nom)) selectedT=selectedT.filter(x=>x!==nom); else selectedT.push(nom); renderTiraj(); }
function checkBlocked(){
  if(!curUser) return;
  db.ref('vendors/'+curUser.name.toLowerCase()+'/status').once('value',s=>{ if(s.exists()&&s.val()==='FERME'){ document.getElementById('blockedBox').style.display='flex'; document.getElementById('appBox').style.display='none'; } });
  renderTiraj();
  const cur=getESTHM(); let ouve=0; const he=config.heures||{}; const ti=config.tirages||{};
  tirajDef.forEach(t=>{ const realH=he[t.id]||t.h; const [hh,mm]=realH.split(':').map(Number); const m=hh*60+mm; if(ti[t.id]!=='FERME' && cur<m) ouve++; });
  const st=document.getElementById('statusV'); if(ouve===0){ st.innerText="FERMÉ"; st.style.background="red"; } else { st.innerText=ouve+" OUVE"; st.style.background="green"; }
}
function addLine(){
  const div=document.createElement('div'); div.className='line';
  div.innerHTML=`<select class="j"><option value="bolet">Bolet</option><option value="maryaj">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select><input class="b" type="tel" inputmode="numeric" placeholder="BOUL" maxlength="5"><input class="m" type="tel" inputmode="numeric" placeholder="G">`;
  document.getElementById('lines').appendChild(div);
  attachFlech(div);
}
function attachFlech(row){
  const inputs=row.querySelectorAll('.j,.b,.m');
  inputs.forEach((inp, idx)=>{
    inp.addEventListener('input',e=>{ if(inp.classList.contains('b')||inp.classList.contains('m')) e.target.value=e.target.value.replace(/[^0-9]/g,''); calc(); });
    inp.addEventListener('keydown',e=>{
      const allLines=[...document.querySelectorAll('#lines .line')]; const curRow=allLines.indexOf(row);
      if(e.key==='Enter' || e.key==='ArrowDown' || e.key==='ArrowRight'){
        e.preventDefault();
        if(idx < inputs.length-1){ inputs[idx+1].focus(); }
        else {
          let nextRow=allLines[curRow+1]; if(!nextRow){ addLine(); nextRow=document.querySelectorAll('#lines .line')[curRow+1]; }
          if(nextRow) nextRow.querySelector('.j').focus();
        }
      }
      if(e.key==='ArrowUp' || e.key==='ArrowLeft'){
        e.preventDefault();
        if(idx>0){ inputs[idx-1].focus(); }
        else { let prevRow=allLines[curRow-1]; if(prevRow) prevRow.querySelector('.m').focus(); }
      }
    });
  });
}
function calc(){ let tot=0; document.querySelectorAll('#lines .line').forEach(r=>{ tot+=parseInt(r.querySelector('.m').value)||0; }); const nb=selectedT.length||1; document.getElementById('tot').innerText=tot+"$"; document.getElementById('nbT').innerText=nb; document.getElementById('paye').innerText=(tot*nb)+"$"; }
function showTab(id){ document.getElementById('vendre').style.display=id==='vendre'?'block':'none'; document.getElementById('fichesTab').style.display=id==='fichesTab'?'block':'none'; document.getElementById('kopyeTab').style.display=id==='kopyeTab'?'block':'none'; document.getElementById('rapportTab').style.display=id==='rapportTab'?'block':'none'; if(id==='fichesTab') loadFiches(); }
function loadFiches(){ const today=getHaitiDate(); db.ref('fiches').orderByChild('dateStr').equalTo(today).once('value',s=>{ if(!s.exists()){document.getElementById('listF').innerHTML="Pa gen";return;} let html=''; Object.values(s.val()).filter(f=>f.vendeur===curUser.name.toLowerCase()).reverse().forEach(f=>{ html+=`<div style="border:1px solid #ccc;padding:6px;margin:4px 0;border-radius:8px;font-size:12px"><b>${(f.tirajs||[]).join('/')} - ${f.total}$</b> ${(f.details||[]).map(d=>d.boul).join(',')}<button onclick="reprint('${f.id}')" style="float:right">Print</button></div>`; }); document.getElementById('listF').innerHTML=html; }); }
function reprint(id){ db.ref('fiches/'+id).once('value',s=>{ const f=s.val(); const html=`<div class="ticket"><b>C&D</b><br>${f.vendeur}<br>${(f.tirajs||[]).join('/')}<br>${(f.details||[]).map(d=>`${d.type} ${d.boul} ${d.montan}$`).join('<br>')}<br>Total ${f.total}$<br>ID:${f.id.slice(-5)}</div>`; document.getElementById('prt').innerHTML=html; window.print(); }); }
function vann(){ if(selectedT.length===0){alert('Chwazi tiraj');return;} let details=[]; document.querySelectorAll('#lines .line').forEach(r=>{ const j=r.querySelector('.j').value; const b=r.querySelector('.b').value.trim(); const m=parseInt(r.querySelector('.m').value)||0; if(b&&m) details.push({type:j,boul:b,montan:m}); }); if(details.length===0){alert('Mete boul');return;} const base=details.reduce((a,b)=>a+b.montan,0); const total=base*selectedT.length; const id=db.ref('fiches').push().key; db.ref('fiches/'+id).set({id:id,vendeur:curUser.name.toLowerCase(),tirajs:selectedT,details:details,total:total,totalBase:base,nbTiraj:selectedT.length,date:new Date().toISOString(),dateStr:getHaitiDate(),gain:0}).then(()=>{ const html=`<div class="ticket"><b>C&D LOTTO</b><br>${curUser.name}<br>${selectedT.join('/')}<br>-------------------<br>${details.map(d=>`${d.type.toUpperCase()} ${d.boul} ${d.montan}$ x${selectedT.length}`).join('<br>')}<br>-------------------<br>Total: ${base}$ x ${selectedT.length} = ${total}$<br>ID:${id.slice(-5).toUpperCase()}</div>`; document.getElementById('prt').innerHTML=html; window.print(); document.querySelectorAll('#lines .line').forEach(r=>{ r.querySelector('.b').value=''; r.querySelector('.m').value=''; }); calc(); document.querySelector('#lines .line .j').focus(); }); }
function searchById(){ const q=document.getElementById('searchId').value.trim().toLowerCase(); db.ref('fiches').once('value',s=>{ const all=Object.values(s.val()||[]); const f=all.find(x=>x.id.toLowerCase().includes(q)); document.getElementById('resKopye').innerHTML=f?`${f.total}$ - ${f.tirajs}<br><button class="btn bK" onclick="kopye('${f.id}')">Kopye</button>`:"Pa jwenn"; }); }
function kopye(id){ db.ref('fiches/'+id).once('value',s=>{ const f=s.val(); selectedT=f.tirajs||[]; document.getElementById('lines').innerHTML=''; f.details.forEach(d=>{ addLine(); const rows=document.querySelectorAll('#lines .line'); const row=rows[rows.length-1]; row.querySelector('.j').value=d.type; row.querySelector('.b').value=d.boul; row.querySelector('.m').value=d.montan; }); renderTiraj(); calc(); showTab('vendre'); }); }
function genRap(){ const du=document.getElementById('rapDu').value; const au=document.getElementById('rapAu').value; db.ref('fiches').once('value',s=>{ let all=Object.values(s.val()||[]).filter(f=>f.vendeur===curUser.name.toLowerCase() && f.dateStr>=du && f.dateStr<=au); const vente=all.reduce((a,b)=>a+(b.total||0),0); document.getElementById('rapData').innerHTML=`Vente: ${vente}$ - Fich: ${all.length}`; }); }
</script></body></html>
