<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Vendeur V25.9 - Sunmi V2 Pro Inner</title>
<style>
body{font-family:system-ui;background:#f3f4f6;margin:0;padding:10px}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.inp{padding:10px;border-radius:10px;border:2px solid #ddd;font-size:16px}
.inpN{flex:1;text-align:center;font-weight:800}
.jeu{flex:1}
.boul{flex:1}
.mise{flex:1;background:#e8f5e9!important}
.btnR{background:#ef4444;color:#fff;border:0;border-radius:10px;padding:10px 12px;font-weight:800}
.btnF{background:#22c55e;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:900}
.btn{padding:12px;border:0;border-radius:12px;font-weight:800;color:#fff;width:100%}
.btnScan{background:#0ea5e9}
.btnPrint{background:#111827}
#scanResult{font-size:13px;background:#f8fafc;padding:8px;border-radius:10px;margin-top:6px;white-space:pre-wrap}
#sdkStatus,#btStatus,#printer-status{font-size:12px;font-weight:700}
</style>
</head>
<body>

<div class="card">
  <div style="display:flex;justify-content:space-between"><span id="sdkStatus">⏳ Init Sunmi V2 Pro...</span><span id="btStatus">BT: --</span></div>
  <div id="printer-status">Mòd: INNER PRINTER - Deteksyon...</div>
  <div style="margin-top:8px;display:flex;gap:6px">
    <button class="btn btnScan" onclick="initInnerPrinter()" style="flex:1">📟 SCAN Inner Printer</button>
    <button class="btn" onclick="testPrint()" style="flex:1;background:#22c55e">🧪 TÈS</button>
  </div>
  <div id="scanResult">Klike SCAN Inner Printer - Fòk Bluetooth ON (POS Steward bezwen li)</div>
  <input id="selectedPrinter" type="hidden">
</div>

<div class="card">
  <div id="bets"></div>
  <button class="btn" onclick="addR()" style="background:#6366f1;margin-top:6px">+ Liy (ENTER = Liy Suivant)</button>
</div>

<div class="card">
  <button class="btn btnPrint" onclick="vann()">💰 VANN & ENPRIME INNER</button>
  <div id="total" style="text-align:center;font-weight:900;font-size:20px;margin-top:8px">Total: $0</div>
</div>

<script>
let LAST_TXT='';
let currentPrinter=null;
let sunmiInner=null;
let btInner={device:null,char:null,server:null};
let tickets=[];

function getLogoUrl(){
  try{ return localStorage.getItem('propLogo')||localStorage.getItem('logoUrl')||''; }catch(e){ return ''; }
}

// ADD ROW - KLAVYE ENTER RANPLASE.
function addR(keep='boul'){
  let c=document.getElementById('bets');
  let d=document.createElement('div');
  d.className='row betRow';
  d.innerHTML=`
    <select class="jeu inp" onchange="onJeuChange(this)">
      <option value="boul">BOUL 2</option>
      <option value="loto3">L3 3</option>
      <option value="loto4">L4 4</option>
      <option value="loto5">L5 5</option>
      <option value="maryaj">MAR 4</option>
    </select>
    <input class="boul inpN inp" type="text" inputmode="numeric" enterkeyhint="next" placeholder="--" oninput="validateBoul(this)" onkeydown="handleBoulKey(event,this)">
    <input class="mise inpN inp" type="text" inputmode="numeric" enterkeyhint="next" placeholder="$" oninput="upd()" onkeydown="handleMizKey(event,this)" onblur="handleMizBlur(this)">
    <button class="btnR" onclick="this.parentElement.remove();upd()">X</button>
    <button class="btnF" onclick="nextLine(this)">↵</button>`;
  c.appendChild(d);
  d.querySelector('.jeu').value=keep;
  onJeuChange(d.querySelector('.jeu'));
  upd();
  setTimeout(()=>{ let b=d.querySelector('.boul'); b.focus(); b.select(); },50);
  return d;
}
function onJeuChange(s){ let r=s.parentElement; let b=r.querySelector('.boul'); let t=s.value; b.placeholder=t==='boul'?'--':t==='loto3'?'---':t==='loto4'?'----':t==='loto5'?'-----':'-- --'; validateBoul(b); }
function validateBoul(inp){ let v=inp.value.replace(/[^0-9 ]/g,''); let jeu=inp.parentElement.querySelector('.jeu').value; if(jeu==='maryaj'){ let p=v.replace(/ /g,'').substring(0,4); v=p.length>2?p.substring(0,2)+' '+p.substring(2):p; }else{ let len=jeu==='boul'?2:jeu==='loto3'?3:jeu==='loto4'?4:5; v=v.replace(/ /g,'').substring(0,len); } inp.value=v; upd(); }
function handleBoulKey(e,inp){ if(e.key==='Enter'||e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); let m=inp.parentElement.querySelector('.mise'); m.focus(); m.select(); } }
function handleMizKey(e,inp){
  if(e.key==='Enter'){ e.preventDefault(); nextLine(inp); return; } // ENTER = LIY SUIVANT - ranplase.
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){ e.preventDefault(); nextLine(inp); }
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ e.preventDefault(); let b=inp.parentElement.querySelector('.boul'); b.focus(); b.select(); }
}
function handleMizBlur(inp){ upd(); }
function nextLine(el){
  let rows=[...document.querySelectorAll('.betRow')];
  let idx=rows.indexOf(el.closest('.betRow'));
  let keep=rows[idx]?.querySelector('.jeu').value||'boul';
  let nr=addR(keep);
}
function upd(){
  let tot=0;
  document.querySelectorAll('.betRow').forEach(r=>{
    let m=parseFloat(r.querySelector('.mise').value)||0;
    tot+=m;
  });
  document.getElementById('total').innerText='Total: $'+tot;
}
function buildTicket(){
  let lines=['*** BÒLÈT ***',''];
  let tot=0;
  document.querySelectorAll('.betRow').forEach(r=>{
    let j=r.querySelector('.jeu').value;
    let b=r.querySelector('.boul').value;
    let m=r.querySelector('.mise').value;
    if(b&&m){ lines.push(`${j.toUpperCase()} ${b} $${m}`); tot+=parseFloat(m)||0; }
  });
  lines.push(''); lines.push(`TOTAL: $${tot}`); lines.push(new Date().toLocaleString());
  LAST_TXT=lines.join('\n');
  return LAST_TXT;
}

// INNER PRINTER - DETEKSYON FINAL - BLUETOOTH ON = INNER ON
async function initInnerPrinter(){
  let status=document.getElementById('sdkStatus');
  let pStatus=document.getElementById('printer-status');
  let res=document.getElementById('scanResult');
  res.innerHTML='🔍 Deteksyon INNER PRINTER - SUNMI V2 PRO...<br>📱 Bluetooth dwe ON - POS Steward 8Ko bezwen li<br>';

  // 1- INNER SDK - SunmiLauncher 544Ko + POS Steward
  try{
    if(window.InnerPrinterManager){
      window.InnerPrinterManager.getInstance().bindService(this,{
        onServiceConnected:function(s){
          sunmiInner=s;
          status.innerText='✅ INNER PRINTER - Bound - Prè';
          pStatus.innerText='INNER 58mm - SUNMI V2 PRO - Prè';
          res.innerHTML+='✅ SunmiLauncher - Inner Bound OK<br>✅ INNER PRINTER PRÈ POU ENPRIME<br><div style="background:#dcfce7;padding:10px;border-radius:10px;margin-top:6px"><b>✅ INNER DETEKTE - Pa bezwen lis Bluetooth</b><br>Klike TÈS kounya</div>';
          currentPrinter={name:'Sunmi V2 Pro Inner 58mm',type:'inner'};
          document.getElementById('selectedPrinter').value='Sunmi V2 Pro Inner 58mm (SDK)';
          document.getElementById('btStatus').innerText='BT: ✅ ON - Inner Active';
        },
        onServiceDisconnected:function(){ sunmiInner=null; status.innerText='❌ Inner dekonekte'; }
      });
      await new Promise(r=>setTimeout(r,1500));
      if(sunmiInner) return true;
    }
  }catch(e){ res.innerHTML+='Inner error: '+e.message+'<br>'; }

  try{ if(window.woyou && window.woyou.printService){ sunmiInner=window.woyou.printService; status.innerText='✅ Woyou - Inner Prè'; pStatus.innerText='INNER - Woyou - Prè'; res.innerHTML+='✅ Woyou Inner - Prè<br>'; currentPrinter={name:'Inner Woyou',type:'inner'}; return true; } }catch(e){}

  // 2- INNER via BLUETOOTH SPP - si SDK pa bound - menm jan ak lòt sistèm nan
  res.innerHTML+='⏳ SDK pa bound - ap chèche Inner kòm Bluetooth (fòk BT ON tankou lòt sistèm)...<br>';
  try{
    if(!navigator.bluetooth){ res.innerHTML+='❌ Via 8Ko pa sipòte BT - Louvri nan Chrome sou Sunmi an'; return false; }
    let device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['0000ff00-0000-1000-8000-00805f9b34fb','000018f0-0000-1000-8000-00805f9b34fb','00001101-0000-1000-8000-00805f9b34fb']});
    btInner.device=device;
    res.innerHTML+=`✅ Chwazi: ${device.name||'InnerPrinter'}<br>⏳ Koneksyon GATT...<br>`;
    btInner.server=await device.gatt.connect();
    let services=await btInner.server.getPrimaryServices();
    for(let svc of services){ let chars=await svc.getCharacteristics(); for(let ch of chars){ if(ch.properties.write||ch.properties.writeWithoutResponse){ btInner.char=ch; break; } } if(btInner.char) break; }
    if(btInner.char){
      currentPrinter={name:device.name||'InnerPrinter BT',type:'bt'};
      document.getElementById('selectedPrinter').value=currentPrinter.name+' (Inner via BT)';
      document.getElementById('btStatus').innerText='BT: ✅ '+ (device.name||'Inner');
      status.innerText='✅ INNER via Bluetooth - Prè - tankou lòt sistèm';
      pStatus.innerText='INNER - Bluetooth SPP - Prè';
      res.innerHTML+=`<div style="background:#dcfce7;padding:10px;border-radius:10px"><b>✅ INNER via BLUETOOTH KONEKTE</b><br>Tankou lòt sistèm nan - Bluetooth ON = Inner ON<br>Klike TÈS</div>`;
      localStorage.setItem('printerMode','bt');
      return true;
    }
  }catch(e){ res.innerHTML+=`❌ ${e.message}<br>➡️ Paramètres > Bluetooth > ON > POS Steward > Enable`; }
  return false;
}
function scanBluetoothSDK(){ initInnerPrinter(); }

async function printInner(t){
  let txt=(t||LAST_TXT||'').toString().replace(/<[^>]*>/g,'').trim();
  if(!txt) return false;

  // A- SDK DIRÈK
  if(sunmiInner){
    try{
      if(sunmiInner.setAlignment) sunmiInner.setAlignment(1);
      let logo=getLogoUrl();
      if(logo && logo.length>100 && sunmiInner.printBitmap){
        try{
          let img=new Image(); img.src=logo; await new Promise(r=>{ img.onload=r; setTimeout(r,500); });
          let cv=document.createElement('canvas'); cv.width=200; cv.height=200;
          let ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,200,200);
          ctx.beginPath(); ctx.arc(100,100,100,0,Math.PI*2); ctx.clip();
          ctx.drawImage(img,0,0,200,200);
          sunmiInner.printBitmap(cv.toDataURL(),1);
          await new Promise(r=>setTimeout(r,300));
        }catch(e){}
      }
      if(sunmiInner.printOriginalText) sunmiInner.printOriginalText(txt+"\n\n\n\n",null);
      else if(sunmiInner.printText) sunmiInner.printText(txt+"\n\n\n\n");
      else if(sunmiInner.printString) sunmiInner.printString(txt+"\n\n\n\n");
      setTimeout(()=>{ try{ sunmiInner.cutPaper(); }catch(e){} },600);
      return true;
    }catch(e){ console.log('Inner print fail',e); }
  }
  // B- BLUETOOTH INNER
  if(btInner.char && btInner.device && btInner.device.gatt.connected){
    try{
      let esc='\x1B\x40\x1B\x61\x01\x1B\x45\x01';
      let data=new TextEncoder().encode(esc+txt+"\n\n\n\n\x1D\x56\x00");
      for(let i=0;i<data.length;i+=100){ await btInner.char.writeValue(data.slice(i,i+100)); await new Promise(r=>setTimeout(r,35)); }
      return true;
    }catch(e){ console.log('BT Inner fail',e); }
  }
  alert('⚠️ INNER PRINTER pa konekte\n1- Bluetooth ON (obligatwa tankou lòt sistèm)\n2- SCAN Inner Printer\n3- TÈS');
  return false;
}
function printBT(t){ return printInner(t); }

async function testPrint(){ let t=buildTicket()||"TÈS INNER PRINTER\nSUNMI V2 PRO\n58mm\n"+new Date().toLocaleString()+"\n\n\n\n"; await printInner(t); }
async function vann(){ let t=buildTicket(); if(!t||t.includes('TOTAL: $0')){ alert('Pa gen miz'); return; } let ok=await printInner(t); if(ok){ tickets.push({txt:t,date:new Date()}); document.getElementById('bets').innerHTML=''; addR(); upd(); } }

// Init
addR();
initInnerPrinter();
setTimeout(initInnerPrinter,1200);
setTimeout(initInnerPrinter,3000);
</script>
</body>
</html>
