firebase.initializeApp(firebaseConfig); var db=firebase.database();
var TIRAGES=["GA MIDI","FL MIDI","NY MIDI","GA SOIR","FL SOIR","NY SOIR","PRIMERA DIA","PRIMERA NOCHE","SUERTE DIA","SUERTE TARDE","REAL","LOTE DOM","NACIONAL DIA","NACIONAL NOCHE","LOTEKA","LEIDSA"];
var HEURE_DEFAULT={"GA_MIDI":"12:15","FL_MIDI":"13:15","NY_MIDI":"14:15","GA_SOIR":"18:15","FL_SOIR":"21:15","NY_SOIR":"22:15","PRIMERA_DIA":"11:50","PRIMERA_NOCHE":"19:50","SUERTE_DIA":"12:20","SUERTE_TARDE":"17:50","REAL":"12:45","LOTE_DOM":"13:45","NACIONAL_DIA":"14:15","NACIONAL_NOCHE":"17:45","LOTEKA":"19:45","LEIDSA":"15:40"};
function getDatePAP(){return new Intl.DateTimeFormat('en-CA',{timeZone:"America/Port-au-Prince",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}
function getHeurePAPStr(){return new Intl.DateTimeFormat('en-CA',{timeZone:"America/Port-au-Prince",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date());}
function getHeurePAPMin(){var s=new Intl.DateTimeFormat('en-CA',{timeZone:"America/Port-au-Prince",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date()); var a=s.split(':'); return parseInt(a[0])*60+parseInt(a[1]);}
function normM(b){if(!b) return ""; b=b.toString().trim().toLowerCase().replace(/[^0-9x]/g,''); if(b.indexOf('x')==-1&&b.length==4) b=b.slice(0,2)+'x'+b.slice(2); var p=b.split('x').filter(function(x){return x!="";}); if(p.length!=2) return b; return [p[0].padStart(2,'0'),p[1].padStart(2,'0')].sort().join('x');}
var dateStr=getDatePAP(); var vendeurActif=null, pourActif=10, tirajChwazi=[], lignes=[{type:"BOLET",boul:"",miz:""}];
var cacheLimGlobal={BOLET:1000,MARYAJ:50,LOTO3:100,LOTO4:1000,LOTO5:1000}; var cacheLimVendeur={BOLET:1000,MARYAJ:50,LOTO3:100,LOTO4:1000,LOTO5:1000};
var cacheHeures={}; var cachePrix={lot1:50,lot2:20,lot3:10,maryaj:1000,loto3:500,loto4:5000,loto5:25000};
function chifSelman(v,t){if(t=="MARYAJ") return v.replace(/[^0-9xX]/g,'').toLowerCase(); return v.replace(/[^0-9]/g,'');}
function toggleDrop(){ var d=document.getElementById('tirajDrop'); d.classList.toggle('show'); document.getElementById('kazTiraj').classList.toggle('active'); }
function buildTirajDrop(){var drop=document.getElementById('tirajDrop'); var selRap=document.getElementById('selTirajRap'); drop.innerHTML=""; selRap.innerHTML='<option value="TOUS">Tous tirages</option>'; TIRAGES.forEach(function(t,i){var key=t.replace(/ /g,'_'); var lbl=document.createElement('label'); lbl.id='lbl_'+i; var chk=document.createElement('input'); chk.type='checkbox'; chk.value=t; chk.id='chk_'+i; lbl.appendChild(chk); lbl.appendChild(document.createTextNode(' '+t+' ')); var span=document.createElement('span'); span.id='heure_'+i; span.style.fontSize='8px'; span.style.marginLeft='auto'; lbl.appendChild(span); drop.appendChild(lbl); chk.addEventListener('change',function(){var cur=getHeurePAPMin(); var hs=cacheHeures[key]||HEURE_DEFAULT[key]; if(chk.checked && hs){ var hm=hs.split(':'); var hh=parseInt(hm[0]), mm=parseInt(hm[1]); if(cur>hh*60+mm){ alert('⛔ '+t+' FÈMÈ a '+hs+' EST PAP'); chk.checked=false; return; } } updateTirajChwazi();}); var opt=document.createElement('option'); opt.value=t; opt.innerText=t; selRap.appendChild(opt);});}
function updateTirajChwazi(){tirajChwazi=[]; var checks=document.querySelectorAll('#tirajDrop input:checked'); for(var i=0;i<checks.length;i++) tirajChwazi.push(checks[i].value); var txt=document.getElementById('txtTiraj'); if(tirajChwazi.length==0){ txt.innerText='👉 KLIKE CHWAZI TIRAJ MILTIP'; } else { txt.innerText=tirajChwazi.join(' + ')+' ✓'; } document.getElementById('infoTiraj').innerText=tirajChwazi.length>0?tirajChwazi.join(' + ')+' ✓ '+getHeurePAPStr()+' EST PAP':'Chwazi tiraj - 1 kaz miltip'; updateTotal();}
function loadCaches(cb){
  db.ref('limites_global').once('value',function(s){if(s.exists()){var l=s.val(); cacheLimGlobal={BOLET:parseInt(l.BOLET||1000),MARYAJ:parseInt(l.MARYAJ||50),LOTO3:parseInt(l.LOTO3||100),LOTO4:parseInt(l.LOTO4||1000),LOTO5:parseInt(l.LOTO5||1000)}; }
    db.ref('limites/'+vendeurActif).once('value',function(s2){if(s2.exists()){var l=s2.val(); cacheLimVendeur={BOLET:parseInt(l.BOLET||cacheLimGlobal.BOLET),MARYAJ:parseInt(l.MARYAJ||cacheLimGlobal.MARYAJ),LOTO3:parseInt(l.LOTO3||cacheLimGlobal.LOTO3),LOTO4:parseInt(l.LOTO4||1000),LOTO5:parseInt(l.LOTO5||1000)};} else cacheLimVendeur=cacheLimGlobal;
      db.ref('prix/'+vendeurActif).once('value',function(s3){if(s3.exists()){var p=s3.val(); cachePrix={lot1:parseInt(p.lot1||50),lot2:parseInt(p.lot2||20),lot3:parseInt(p.lot3||10),maryaj:parseInt(p.maryaj||1000),loto3:parseInt(p.loto3||500),loto4:parseInt(p.loto4||5000),loto5:parseInt(p.loto5||25000)};} else { db.ref('prix_global').once('value',function(sg){if(sg.exists()){var p=sg.val(); cachePrix={lot1:parseInt(p.lot1||50),lot2:parseInt(p.lot2||20),lot3:parseInt(p.lot3||10),maryaj:parseInt(p.maryaj||1000),loto3:parseInt(p.loto3||500),loto4:parseInt(p.loto4||5000),loto5:parseInt(p.loto5||25000)};}
        db.ref('heures').once('value',function(sh){if(sh.exists()) cacheHeures=sh.val(); else cacheHeures=HEURE_DEFAULT; checkHeures(); if(cb) cb();});
      });}
      );
    });
  });
}
function checkHeures(){var cur=getHeurePAPMin(); var hStr=getHeurePAPStr(); document.getElementById('heureTop').innerText=hStr+" EST PAP"; document.getElementById('heureLogin').innerText="Heure PAP: "+hStr+" EST - "+dateStr; TIRAGES.forEach(function(t,i){var key=t.replace(/ /g,'_'); var hs=cacheHeures[key]||HEURE_DEFAULT[key]; var lbl=document.getElementById('lbl_'+i); var chk=document.getElementById('chk_'+i); var sp=document.getElementById('heure_'+i); if(sp) sp.innerText=hs?'('+hs+')':''; if(!hs||!lbl||!chk) return; var hm=hs.split(':'); var hh=parseInt(hm[0]), mm=parseInt(hm[1]); if(cur>hh*60+mm){ lbl.classList.add('ferme'); chk.disabled=true; if(chk.checked) chk.checked=false; } else { lbl.classList.remove('ferme'); chk.disabled=false; }}); updateTirajChwazi();}
function checkLogin(){var n=document.getElementById('inpLoginNom').value.trim().toUpperCase(); var p=document.getElementById('inpLoginPass').value.trim().replace(/[^0-9]/g,''); if(!n||!p){document.getElementById('loginMsg').innerText="NON + MODPAS!";return;} db.ref('vendeurs').once('value',function(snap){var ok=false, pour=10, vrai=n; if(snap.exists()){ snap.forEach(function(c){var v=c.val(); if(v.nom.toUpperCase()==n&&v.pass==p&&v.status!="FERME"){ok=true; pour=v.pour||10; vrai=v.nom;}});} if(!ok){document.getElementById('loginMsg').innerText="⛔ PA BON";return;} vendeurActif=vrai; pourActif=pour; localStorage.setItem("vendeur",vrai); localStorage.setItem("vendeurPass",p); document.getElementById('loginOverlay').style.display='none'; initApresLogin();});}
function initApresLogin(){document.getElementById('nomV').innerText=vendeurActif; document.getElementById('nomTop').innerText=vendeurActif; document.getElementById('dateTop').innerText=dateStr; document.getElementById('dateFich').innerText=dateStr; document.getElementById('dateDu').value=dateStr; document.getElementById('dateAu').value=dateStr; buildTirajDrop(); loadCaches(function(){ renderLignes(); updateTotal(); }); setInterval(checkHeures,30000);}
function openOnglet(n){var ongs=document.querySelectorAll('.onglet'); for(var i=0;i<ongs.length;i++) ongs[i].classList.remove('active'); var btns=document.querySelectorAll('.menu button'); for(var i=0;i<btns.length;i++) btns[i].classList.remove('active'); document.getElementById('o'+n).classList.add('active'); document.getElementById('b'+n).classList.add('active'); if(n==1) checkHeures();}
function renderLignes(){var c=document.getElementById('lignesContainer'); c.innerHTML=""; lignes.forEach(function(l,i){var d=document.createElement('div'); d.className="ligne"; d.innerHTML='<select class="kaz" id="type-'+i+'" style="font-size:10px"><option value="BOLET" '+(l.type=="BOLET"?"selected":"")+'>BOLET</option><option value="MARYAJ" '+(l.type=="MARYAJ"?"selected":"")+'>MARYAJ</option><option value="LOTO3" '+(l.type=="LOTO3"?"selected":"")+'>LOTO3</option><option value="LOTO4" '+(l.type=="LOTO4"?"selected":"")+'>LOTO4</option><option value="LOTO5" '+(l.type=="LOTO5"?"selected":"")+'>LOTO5</option></select><input class="kaz" id="boul-'+i+'" placeholder="Boul" inputmode="numeric" value="'+l.boul+'"><input class="kaz kazMiz" id="miz-'+i+'" placeholder="Miz" inputmode="numeric" value="'+l.miz+'"><button type="button" class="btnRond btnX" id="x-'+i+'">X</button><button type="button" class="btnRond btnFlech" id="down-'+i+'">↓</button>'; c.appendChild(d);}); lignes.forEach(function(l,i){var t=document.getElementById('type-'+i), b=document.getElementById('boul-'+i), m=document.getElementById('miz-'+i); t.addEventListener('change',function(){ lignes[i].type=t.value; b.focus(); }); b.addEventListener('input',function(){b.value=chifSelman(b.value,lignes[i].type); lignes[i].boul=b.value; updateTotal();}); m.addEventListener('input',function(){m.value=chifSelman(m.value,"BOLET"); lignes[i].miz=m.value; updateTotal();}); b.addEventListener('keydown',function(e){if(e.key=="Enter"||e.key=="ArrowRight"){ e.preventDefault(); m.focus();} if(e.key=="ArrowDown"){ e.preventDefault(); addNewLigne(i,true);}}); m.addEventListener('keydown',function(e){if(e.key=="Enter"||e.key=="ArrowDown"){ e.preventDefault(); addNewLigne(i,true);}}); document.getElementById('x-'+i).addEventListener('click',function(){if(lignes.length>1)lignes.splice(i,1);else lignes[i]={type:lignes[i].type,boul:"",miz:""}; renderLignes(); updateTotal();}); document.getElementById('down-'+i).addEventListener('click',function(){addNewLigne(i,true);});});}
function checkLimitPaTiraj(ligne, ignoreForm, cb){
  var boul=ligne.boul; if(ligne.type=="MARYAJ") boul=normM(boul); var miz=parseInt(ligne.miz)||0; var type=ligne.type; if(tirajChwazi.length==0){ cb(true); return; }
  if(miz>cacheLimGlobal[type]){ alert('⛔ MIZ TWÒ GWO '+type+' '+boul+' '+miz+'$ > Global '+cacheLimGlobal[type]+'$'); cb(false); return; }
  db.ref('ventes/'+dateStr).once('value',function(snapAll){
    for(var ti=0; ti<tirajChwazi.length; ti++){
      var tiraj=tirajChwazi[ti]; var key=tiraj.replace(/ /g,'_'); var hs=cacheHeures[key]||HEURE_DEFAULT[key]; if(hs){ var hm=hs.split(':'); var hh=parseInt(hm[0]), mm=parseInt(hm[1]); if(getHeurePAPMin()>hh*60+mm){ alert('⛔ '+tiraj+' FÈMÈ a '+hs+' EST PAP'); cb(false); return; } }
      var dejaV=0, dejaG=0;
      if(snapAll.exists()){
        snapAll.forEach(function(vSnap){ var vNom=vSnap.key; var fichesObj=vSnap.val(); for(var k in fichesObj){ var fiche=fichesObj[k]; if(!fiche.tiraj||fiche.tiraj.indexOf(tiraj)==-1) continue; for(var j=0;j<fiche.fiches.length;j++){ var f=fiche.fiches[j]; if(f.type!=type) continue; var match=false; if(type=="MARYAJ") match=normM(f.boul)==normM(boul); else match=f.boul==boul; if(match){ if(vNom==vendeurActif) dejaV+=parseInt(f.miz)||0; dejaG+=parseInt(f.miz)||0; } } } });
      }
      if(!ignoreForm){ for(var x=0;x<lignes.length;x++){ var l=lignes[x]; if(!l.boul||!l.miz||l==ligne) continue; if(l.type!=type) continue; var mm=false; if(type=="MARYAJ") mm=normM(l.boul)==normM(boul); else mm=l.boul==boul; if(mm){dejaV+=parseInt(l.miz)||0; dejaG+=parseInt(l.miz)||0;}} }
      if((dejaV+miz)> (cacheLimVendeur[type]||cacheLimGlobal[type])){ alert('⛔ DEPASE LIMIT PA VANDÈ nan '+tiraj); cb(false); return; }
      if((dejaG+miz)> cacheLimGlobal[type]){ alert('⛔ DEPASE LIMIT GLOBAL nan '+tiraj+' - Max '+cacheLimGlobal[type]+'$ - Deja '+dejaG+'$'); cb(false); return; }
    }
    cb(true);
  });
}
function checkAllFinal(cb){
  var cur=getHeurePAPMin(); for(var ti=0; ti<tirajChwazi.length; ti++){ var tiraj=tirajChwazi[ti]; var key=tiraj.replace(/ /g,'_'); var hs=cacheHeures[key]||HEURE_DEFAULT[key]; if(hs){ var hm=hs.split(':'); var hh=parseInt(hm[0]), mm=parseInt(hm[1]); if(cur>hh*60+mm){ alert('⛔ '+tiraj+' FÈMÈ a '+hs+' EST PAP'); cb(false); return; } } }
  var map={}; lignes.forEach(function(l){if(!l.boul.trim()||!l.miz.trim())return; var k=l.type+"_"+(l.type=="MARYAJ"?normM(l.boul):l.boul); if(!map[k]) map[k]={type:l.type,boul:l.type=="MARYAJ"?normM(l.boul):l.boul,miz:0}; map[k].miz+=parseInt(l.miz)||0;});
  var keys=Object.keys(map); var idx=0;
  function next(){ if(idx>=keys.length){ cb(true); return; } var t=map[keys[idx]]; idx++; checkLimitPaTiraj({type:t.type,boul:t.boul,miz:t.miz.toString()}, true, function(ok){ if(!ok) cb(false); else next(); }); }
  next();
}
function addNewLigne(i,go){
  var l=lignes[i]; if(l.boul.trim()==""||l.miz.trim()==""){alert("Boul + Miz CHIF SÈLMAN");return;}
  if(tirajChwazi.length==0){alert("Chwazi tiraj");return;}
  checkLimitPaTiraj(l,false,function(ok){
    if(!ok) return;
    var keepType=l.type; lignes.splice(i+1,0,{type:keepType,boul:"",miz:""});
    renderLignes(); updateTotal();
    if(go) setTimeout(function(){var nb=document.getElementById('boul-'+(i+1)); if(nb) nb.focus();},80);
  });
}
function updateTotal(){var s=0; lignes.forEach(function(l){if(l.boul!=""&&l.miz!="") s+=parseInt(l.miz)||0;}); var nb=tirajChwazi.length||0; document.getElementById('totalBar').innerText='Total $'+s+' × '+nb+' = $'+(s*nb)+' - PRIX 50/20/10/1000/500/5000/25000 - '+getHeurePAPStr()+' EST PAP';}
function valider(doPrint){
  var sp=localStorage.getItem("vendeurPass"); if(!vendeurActif||!sp){alert("MODPAS OBLIGATWA"); location.reload(); return;}
  db.ref('vendeurs').once('value',function(sC){var ok=false; if(sC.exists()){ sC.forEach(function(v){ if(v.val().nom==vendeurActif&&v.val().pass==sp&&v.val().status!="FERME") ok=true; }); } if(!ok){alert("MODPAS PA RESPEKTE"); localStorage.clear(); location.reload(); return;}
    var vals=[]; lignes.forEach(function(f){ if(f.boul.trim()!=""&&f.miz.trim()!="") vals.push({type:f.type,boul:f.type=="MARYAJ"?normM(f.boul):f.boul,miz:f.miz}); });
    if(vals.length==0||tirajChwazi.length==0){alert("Chwazi tiraj + boul");return;}
    checkAllFinal(function(allOk){ if(!allOk) return;
      var id="T-"+Date.now().toString().slice(-6); var tot=0; vals.forEach(function(f){tot+=parseInt(f.miz)||0;}); tot=tot*tirajChwazi.length;
      var hStr=getHeurePAPStr();
      db.ref('ventes/'+dateStr+'/'+vendeurActif).push({id:id,tiraj:tirajChwazi,fiches:vals,total:tot,date:dateStr,timestamp:Date.now(),vendeur:vendeurActif,heure:hStr},function(){
        printFiche({id:id,tiraj:tirajChwazi,fiches:vals,total:tot,date:dateStr,vendeur:vendeurActif,heure:hStr}, false, doPrint);
        lignes=[{type:vals[0].type||"BOLET",boul:"",miz:""}]; renderLignes(); updateTotal();
      });
    });
  });
}
function printFiche(f, isReprint, doPrint){
  var lignesHtml=''; f.fiches.forEach(function(ff){ lignesHtml+='<div style="display:flex;justify-content:space-between;padding:16px 0;border-bottom:3px dashed #000;font-size:24px"><span style="width:120px;text-align:left">'+ff.type+'</span><span style="flex:1;text-align:center;font-weight:900;font-size:28px">'+ff.boul+'</span><span style="width:90px;text-align:right">$'+ff.miz+'</span></div>'; });
  var html='<div style="text-align:center;font-family:monospace;font-weight:900;width:380px;margin:0 auto;color:#000;background:#fff;padding:15px"><div style="font-size:32px">C&D VÉRITÉ LOTTO</div><div style="font-size:18px;margin-top:10px">Date '+f.date+' '+ (f.heure||'') +' EST PAP</div><div style="font-size:18px">Tirages '+f.tiraj.join('/')+' </div><div style="font-size:16px">Tel +52 7298079596</div><div style="font-size:18px">Resp '+(f.vendeur||vendeurActif)+'</div><div style="font-size:16px">Ticket '+f.id+' '+(isReprint?'REPRINT':'')+'</div><div style="margin:15px 0;border-top:4px solid #000"></div><div style="text-align:left">'+lignesHtml+'</div><div style="margin:15px 0;border-top:4px solid #000"></div><div style="font-size:32px">TOTAL $'+f.total+'</div><div style="margin-top:25px;font-size:20px">Bòn chans, lave chodyè w</div></div>';
  var pa=document.getElementById('printArea'); pa.innerHTML=html; pa.style.display='block'; if(doPrint!==false){ setTimeout(function(){window.print();},400); } else { setTimeout(function(){pa.style.display='none';},500); }
}
document.addEventListener('DOMContentLoaded',function(){
  buildTirajDrop();
  var sV=localStorage.getItem("vendeur"), sP=localStorage.getItem("vendeurPass");
  if(sV&&sP){db.ref('vendeurs').once('value',function(snap){var ok=false, p=10; if(snap.exists()){ snap.forEach(function(v){ if(v.val().nom==sV&&v.val().pass==sP&&v.val().status!="FERME"){ok=true; p=v.val().pour||10;}});} if(ok){vendeurActif=sV; pourActif=p; document.getElementById('loginOverlay').style.display='none'; initApresLogin();}});}
  setInterval(function(){ var el=document.getElementById('heureLogin'); if(el) el.innerText="Heure PAP: "+getHeurePAPStr()+" EST - "+dateStr; var et=document.getElementById('heureTop'); if(et) et.innerText=getHeurePAPStr()+" EST PAP"; },1000);
  document.getElementById('btnLogin').addEventListener('click',checkLogin);
  document.getElementById('b1').addEventListener('click',function(){openOnglet(1);});
  document.getElementById('b2').addEventListener('click',function(){openOnglet(2);});
  document.getElementById('b3').addEventListener('click',function(){openOnglet(3);});
  document.getElementById('b4').addEventListener('click',function(){openOnglet(4);});
  document.getElementById('bX').addEventListener('click',function(){if(confirm("Dekonekte?")){localStorage.clear(); location.reload();}});
  document.getElementById('btnVal').addEventListener('click',function(){valider(false);});
  document.getElementById('btnPrint').addEventListener('click',function(){valider(true);});
  document.addEventListener('click',function(e){ var kaz=document.getElementById('kazTiraj'); var drop=document.getElementById('tirajDrop'); if(kaz&&drop&&!kaz.contains(e.target)){ drop.classList.remove('show'); kaz.classList.remove('active'); } });
});
</script>
