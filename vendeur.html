<!DOCTYPE html>
<html lang='ht'>
<head>
<link rel="manifest" href="manifest-vendeur.json">
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>C&D V25.6 - cd-lotto - Imprimante Avansé Sunmi</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const isSunmiDevice=/Sunmi|SUNMI|V2 Pro|SM-V2|sunmi/i.test(navigator.userAgent)||!!window.sunmiInnerPrinter||!!window.SunmiPrinter||!!window.woyou;
console.log("Sunmi:",isSunmiDevice,navigator.userAgent);
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#eef2f7}
.h{background:#0a4a2e;color:#d4af37;padding:10px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:3px solid #d4af37}
.card{background:#fff;border-radius:12px;padding:10px;margin:8px;box-shadow:0 2px 6px rgba(0,0,0,.08);border-left:4px solid #0a4a2e}
.row{display:flex;gap:12px;align-items:center;margin-bottom:12px;justify-content:space-between;padding:0 6px}
.inp{width:88px;min-width:88px;height:52px;border:2.5px solid #0a4a2e;border-radius:10px;font-weight:800;font-size:14px;text-align:center;background:#fff;margin-right:8px}
.inpN{width:82px;min-width:82px;height:52px;border:2.5px solid #0a4a2e;border-radius:10px;font-weight:800;font-size:20px;text-align:center;background:#fff;margin-right:8px}
.inpL{width:100%;height:48px;border:2.5px solid #0a4a2e;border-radius:10px;padding:0 10px;font-size:16px}
.btn{padding:14px;border:0;border-radius:10px;color:#fff;font-weight:800;width:100%;cursor:pointer}.btnG{background:#0a4a2e;color:#d4af37;border:2px solid #d4af37}.btnB{background:#0a4a2e;color:#d4af37;border:1px solid #d4af37}.btnR{background:#e11d48;width:42px;height:52px;border-radius:10px;border:0;color:#fff;font-weight:800;margin-left:8px}
.btnF{width:36px;height:52px;border:2px solid #0a4a2e;border-radius:10px;background:#fff;font-size:18px;font-weight:900;margin-left:8px}
.betRow{background:#f9fdf9;border:1.5px solid #d4af37;border-radius:10px;padding:8px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.total{background:#0a4a2e;color:#d4af37;border:2px solid #d4af37;border-radius:12px;padding:12px;display:flex;justify-content:space-between;font-weight:800;margin:8px}
.tlist{display:none;position:fixed;left:8px;right:8px;top:90px;background:#fff;border:3px solid #0a4a2e;border-radius:12px;z-index:9999;padding:8px;grid-template-columns:78px 78px 78px;gap:8px;max-height:70vh;overflow:auto;justify-content:center}.tlist.open{display:grid}
.topt{width:78px;min-height:68px;border:2px solid #ccc;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;text-align:center;cursor:pointer}
#loginPage{display:block}#mainPage{display:none;min-height:100vh;padding-bottom:80px}#mainPage.show{display:block}
.tabPage{display:none!important}.tabPage.active{display:block!important}
.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid #0a4a2e;z-index:5000;height:60px}.tab{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:0;background:#eee;border-right:1px solid #ccc}.tab.active{background:#0a4a2e;color:#d4af37}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a4a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;transition:opacity 0.5s}
#prev{background:#fff;margin:8px;padding:6px;font-family:'Courier New',monospace;font-size:12px;line-height:1.25;color:#000;white-space:pre;border:1px dashed #000;width:100%;max-width:56mm;text-align:center}
.printer-bar{background:#fff;border:3px solid #00c853;border-radius:12px;padding:10px;margin:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div id="splash"><div style="font-size:60px">🎰</div><h1 style="color:#d4af37;margin-top:10px">C&D VERITE LOTTO</h1><p style="color:#fff">V25.6 - Sunmi Ready</p></div>
<div id="loginPage"><div class="h"><b>C&D VERITE LOTTO</b><span>Vendeur</span></div><div class="card" style="margin-top:40px"><h3 style="text-align:center;color:#0a4a2e">Koneksyon Vendeur</h3><input id="user" class="inpL" placeholder="Non itilizate" style="margin-top:12px"><input id="pass" class="inpL" placeholder="Modpas" type="password" style="margin-top:8px"><button class="btn btnG" style="margin-top:12px" onclick="login()">KONEKTE</button><p id="sunmiStatus" style="text-align:center;margin-top:10px;font-size:11px;color:#666"></p></div></div>
<div id="mainPage"><div class="h"><b id="vendeurName">Vendeur</b><div><span id="balance" style="background:#d4af37;color:#0a4a2e;padding:4px 8px;border-radius:6px;font-weight:800">0 G</span><button onclick="logout()" style="margin-left:8px;background:#e11d48;color:#fff;border:0;padding:6px 10px;border-radius:6px">X</button></div></div>
<div id="tabVente" class="tabPage active"><div class="card"><div class="row"><input id="boul" class="inp" placeholder="Boul" maxlength="3"><input id="montan" class="inpN" placeholder="G" type="number"><button class="btnF" onclick="addBet()">+</button></div><div class="grid2"><button class="btn btnB" onclick="openTiraj()">Tiraj ▼</button><button class="btn btnB" onclick="previewOnly()">Aperçu Ticket</button></div><div id="tlist" class="tlist"></div></div><div id="bets" class="card" style="min-height:100px"><p style="text-align:center;color:#999">Okenn paryaj</p></div><div class="total"><span>TOTAL</span><span id="total">0 G</span></div><div class="card"><button class="btn btnG" onclick="valideEtImprime()">VALIDE & ENPRIME SUNMI</button><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btnB" style="flex:1" onclick="previewOnly()">Aperçu sèlman</button><button class="btn" style="flex:1;background:#999" onclick="clearBets()">Efase</button></div></div><div class="printer-bar"><b style="color:#0a4a2e">🖨️ Status: <span id="printerState">Ap tcheke...</span></b><div id="prev" style="display:none">C&D VERITE LOTTO

Boul: ---
Montan: --- G

Mesi!
</div><button class="btn btnG" style="margin-top:8px" onclick="enprimeSunmiV2Pro()">♻️ RE-ENPRIME DENYE TICKET</button><button class="btn btnB" style="margin-top:8px" onclick="testPrinter()">TEST ENPRIMANT SUNMI</button></div></div>
<div id="tabRapo" class="tabPage"><div class="card"><h3>Rapo Vant</h3><div id="rapo">Rapo ap parèt isit la</div></div></div>
<div class="tabs"><button class="tab active" onclick="switchTab('tabVente',this)">VANTE</button><button class="tab" onclick="switchTab('tabRapo',this)">RAPO</button></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSy...",authDomain:"cd-lotto.firebaseapp.com",databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com",projectId:"cd-lotto"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
let bets=[];let total=0;let lastTicketText="";
setTimeout(()=>{const s=document.getElementById('splash');s.style.opacity='0';setTimeout(()=>{s.style.display='none'},500);},1200);
window.addEventListener('load',()=>{
  const el=document.getElementById('sunmiStatus');const el2=document.getElementById('printerState');
  if(isSunmiDevice){if(el)el.innerHTML="✅ Sunmi V2 Pro Detekte - Enprimant aktive";if(el2){el2.innerText="✅ Sunmi V2 Pro Ready";el2.style.color="#00c853";}}
  else{if(el)el.innerHTML="📱 Mode Telefon";if(el2){el2.innerText="📱 Mode Chrome";}}
});
function login(){document.getElementById('loginPage').style.display='none';document.getElementById('mainPage').classList.add('show');document.getElementById('vendeurName').innerText=document.getElementById('user').value||'Vendeur';}
function logout(){location.reload();}
function switchTab(id,btn){document.querySelectorAll('.tabPage').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');if(btn)btn.classList.add('active');}
function addBet(){const b=document.getElementById('boul').value.trim();const m=parseInt(document.getElementById('montan').value);if(!b||!m||m<=0){alert("Mete boul ak montan");return;}bets.push({boul:b,montan:m});total+=m;renderBets();document.getElementById('boul').value='';document.getElementById('montan').value='';document.getElementById('boul').focus();}
function renderBets(){const cont=document.getElementById('bets');if(bets.length==0){cont.innerHTML='<p style="text-align:center;color:#999">Okenn paryaj</p>';}else{cont.innerHTML=bets.map((x,i)=>`<div class="betRow"><span>${x.boul}</span><span>${x.montan} G</span><button class="btnR" onclick="removeBet(${i})">X</button></div>`).join('');}document.getElementById('total').innerText=total+' G';updatePreview();}
function removeBet(i){total-=bets[i].montan;bets.splice(i,1);renderBets();}
function clearBets(){bets=[];total=0;renderBets();}
function updatePreview(){if(bets.length==0)return;let txt="C&D VERITE LOTTO\nTerminal: SUNMI V2 PRO\n----------------------------\n";bets.forEach(b=>{txt+=`${b.boul.padEnd(10)} ${b.montan} G\n`;});txt+=`----------------------------\nTOTAL: ${total} G\nDat: ${new Date().toLocaleString('ht-HT')}\nKod: CD-${Date.now().toString().slice(-6)}\n----------------------------\nMesi! Bonne Chance!\n`;document.getElementById('prev').innerText=txt;lastTicketText=txt;}
function previewOnly(){updatePreview();document.getElementById('prev').style.display='block';document.getElementById('prev').scrollIntoView();}
function printViaBrowser(text){const w=window.open('','','width=300,height=600');w.document.write('<html><head><style>body{font-family:Courier New,monospace;width:58mm;text-align:center}pre{white-space:pre-wrap;font-size:12px}</style></head><body><pre>'+text+'</pre><script>window.onload=function(){window.print();setTimeout(()=>window.close(),500)}<\/script></body></html>');w.document.close();}

// ===== KOREKSYON SUNMI V2 PRO - SA KI FE PAPYE SOTI =====
async function enprimeSunmiV2Pro(ticketText=null){
  const text=ticketText||lastTicketText||document.getElementById('prev').innerText;
  if(!text||text.includes('---')&&bets.length==0){alert("Pa gen ticket pou enprime");return;}
  const finalText=text+"\n\n\n";
  if(isSunmiDevice){
    try{
      if(window.sunmiInnerPrinter){window.sunmiInnerPrinter.printText(finalText);window.sunmiInnerPrinter.lineWrap(3);window.sunmiInnerPrinter.cutPaper();console.log("✅ sunmiInnerPrinter");return;}
      if(window.SunmiPrinter){window.SunmiPrinter.printText(finalText);window.SunmiPrinter.lineWrap(3);if(window.SunmiPrinter.cutPaper)window.SunmiPrinter.cutPaper();console.log("✅ SunmiPrinter");return;}
      if(window.woyou&&window.woyou.printerService){window.woyou.printerService.printText(finalText,null);window.woyou.printerService.cutPaper(null);console.log("✅ woyou");return;}
      const encoded=encodeURIComponent(finalText);
      window.location.href="intent://print?text="+encoded+"#Intent;scheme=sunmi;package=woyou.aidlservice.jiuiv5;end;";
      setTimeout(()=>{try{if(window.SunmiPrinter)window.SunmiPrinter.printOriginalText(finalText);}catch(e){}},800);
    }catch(e){console.error(e);alert("Erreur Sunmi: "+e.message);printViaBrowser(finalText);}
  }else{printViaBrowser(finalText);}
}
function testPrinter(){const test="C&D VERITE LOTTO\nTEST ENPRIMANT\nSUNMI V2 PRO\n----------------------------\nSa a se test.\nSi ou we sa, enprimant OK!\n----------------------------\n"+new Date().toLocaleString()+"\n\n\n";enprimeSunmiV2Pro(test);}
function valideEtImprime(){if(bets.length==0){alert("Ajoute boul anvan");return;}updatePreview();try{if(typeof firebase!=='undefined'&&firebase.database){firebase.database().ref('ventes/'+Date.now()).set({bets:bets,total:total,date:new Date().toISOString(),device:isSunmiDevice?'SUNMI_V2_PRO':'PHONE'});}}catch(e){}enprimeSunmiV2Pro();setTimeout(()=>{clearBets();},1500);}
function openTiraj(){const list=document.getElementById('tlist');list.classList.toggle('open');if(list.innerHTML.trim()==""){const tirajs=["Florida","New York","Georgia","Texas","National"];list.innerHTML=tirajs.map(t=>`<div class="topt" onclick="selectTiraj('${t}')"><div style="font-size:20px">🎰</div>${t}</div>`).join('');}}
function selectTiraj(t){document.getElementById('tlist').classList.remove('open');alert("Tiraj chwazi: "+t);}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
