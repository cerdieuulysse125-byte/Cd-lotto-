<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VENDEUR V102</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:bold}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:12px;border:2px solid #000;border-radius:10px;width:100%;font-size:17px;margin:5px 0}.line{display:grid;grid-template-columns:80px 1fr 70px;gap:6px;margin:5px 0}.tiraj{padding:8px 12px;margin:3px;border:2px solid #000;border-radius:20px;font-weight:bold;display:inline-block}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{background:#eee;color:#aaa;pointer-events:none;opacity:.5}.btn{padding:12px;width:100%;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin:5px 0}.bK{background:#000;color:#FFD700}.ticket{border:2px dashed #000;padding:12px;text-align:center;max-width:360px;margin:auto}@media print{body *{visibility:hidden}#prt,#prt *{visibility:visible}#prt{position:absolute;left:0;top:0;width:100%}}</style>
</head><body>
<div class="h">C&D LOTTO - V102</div>
<div id="loginBox" class="card" style="text-align:center;padding-top:20px"><h2>Connexion</h2><input id="uName" value="Tamouche"><input id="uPass" type="password" value="1234"><button class="btn bK" onclick="go()">Antre</button></div>
<div id="appBox" style="display:none">
<div style="display:flex;background:#000"><button class="btn bK" style="flex:1;margin:2px;background:#FFD700;color:#000" onclick="showTab('vendre')">Vendre</button><button class="btn bK" style="flex:1;margin:2px" onclick="showTab('fichesTab')">Fiches</button><button class="btn bK" style="flex:1;margin:2px" onclick="showTab('rapportTab')">Rapport</button></div>

<div id="vendre" class="card"><div style="text-align:center;font-weight:bold">TIRAJ <span id="dateToday" style="font-size:11px"></span></div><div id="tirajBox" style="text-align:center"></div>
<div style="display:flex;background:#000;color:#FFD700;padding:6px;font-weight:bold;border-radius:6px"><div style="width:80px">JEUX</div><div style="flex:1">BOUL</div><div style="width:70px">MIZ</div></div><div id="lines"></div>
<div style="background:#000;color:#fff;padding:10px;border-radius:10px;text-align:center;margin-top:6px">Total <span id="tot">0$</span> × <span id="nbT">1</span><div style="font-size:24px;color:#FFD700;font-weight:bold">A PEYE <span id="paye">0$</span></div><div id="limMsg" style="font-size:10px;color:#FFD700"></div></div>
<button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button><div id="prt" style="display:none"></div><div id="lastRes" style="font-size:12px;background:#eee;padding:6px;border-radius:6px;margin-top:6px"></div></div>

<div id="fichesTab" class="card" style="display:none"><h3>Fiches - <span id="mn"></span> - <span id="fDate"></span></h3><div id="listF"></div><button class="btn bK" onclick="imprimeFiches()">Enprime Fiches</button></div>

<div id="rapportTab" class="card" style="display:none"><h3>Rapport</h3>Du <input id="du" type="date"> Au <input id="au" type="date"><select id="fT"><option value="tous">Tous Tirage</option><option>GA midi</option><option>GA soir</option><option>FL midi</option><option>FL soir</option><option>NY midi</option><option>NY soir</option></select><button class="btn bK" onclick="genRap()">Générer</button><div id="rap"></div><div id="rapList" style="margin-top:10px"></div><button class="btn bK" onclick="imprimeRapport()">Enprime Rapport</button></div>
</div>

<script>
const firebaseConfig={databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com"}; firebase.initializeApp(firebaseConfig); const db=firebase.database();
let curV='',selT=[],lineId=0,cfg={},fichesData=JSON.parse(localStorage.getItem('fiches')||'[]'),limites={bolet:1000,maryaj:50,loto3:100,loto4:20,loto5:10};
function getHaitiDate(){ // FIX DAT 07/08 pa 08/08
 const now=new Date();
 // Haiti UTC-4
 const haiti = new Date(now.toLocaleString('en-US',{timeZone:'America/Port-au-Prince'}));
 return haiti.toISOString().split('T')[0];
}
function getHaitiDateTimeStr(){return new Date().toLocaleString('fr-HT',{timeZone:'America/Port-au-Prince'});}
function go(){curV=uName.value.trim(); if(!curV)return; localStorage.setItem('curV',curV); loginBox.style.display='none'; appBox.style.display='block'; mn.innerText=curV;
 const today=getHaitiDate(); dateToday.innerText=today; fDate.innerText=today; du.value=today; au.value=today;
 db.ref('config').on('value',s=>{cfg=s.val()||{}; limites=cfg.limites||limites; renderTiraj(); renderLastRes();}); addLine(true); setInterval(renderTiraj,60000);
}
function isPast(h){if(!h)return false; const now=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Port-au-Prince'})); const [hh,mm]=h.split(':').map(Number); if(isNaN(hh))return false; const f=new Date(now); f.setHours(hh,mm||0,0,0); return now>=f;}
function renderTiraj(){if(!tirajBox)return; tirajBox.innerHTML=''; const map={'GA midi':'gaMidi','GA soir':'gaSoir','FL midi':'flMidi','FL soir':'flSoir','NY midi':'nyMidi','NY soir':'nySoir'}; const heures=cfg.heures||{}; const etat=cfg.tirages||{}; const autoClose=cfg.autoClose!==false; ['GA midi','GA soir','FL midi','FL soir','NY midi','NY soir'].forEach(t=>{const k=map[t]; const hs=heures[k]||''; let ferme=etat[k]==='FERME'; if(autoClose&&hs&&isPast(hs)) ferme=true; tirajBox.innerHTML+=`<span class="tiraj ${ferme?'ferme':''}" onclick="toggleT(this,'${t}')">${t}${ferme?' FÈMEN':''}</span>`;}); limMsg.innerText=`Limit: B ${limites.bolet} M ${limites.maryaj} L3 ${limites.loto3} L4 ${limites.loto4} L5 ${limites.loto5}`;}
function toggleT(el,t){if(el.classList.contains('ferme'))return; el.classList.toggle('active'); if(selT.includes(t))selT=selT.filter(x=>x!==t); else selT.push(t); nbT.innerText=selT.length||1; upd();}
function showTab(id){vendre.style.display=id==='vendre'?'block':'none'; fichesTab.style.display=id==='fichesTab'?'block':'none'; rapportTab.style.display=id==='rapportTab'?'block':'none'; if(id==='fichesTab')loadF(); if(id==='rapportTab')genRap();}
function addLine(first){lineId++; const d=document.createElement('div'); d.className='line'; d.innerHTML=`<select id="j${lineId}"><option>Borlette</option><option>Mariage</option><option>Loto3</option><option>Loto4</option><option>Loto5</option></select><input id="b${lineId}" type="tel" placeholder="Boul" onkeydown="if(event.key==='Enter'){event.preventDefault(); document.getElementById('m'+lineId).focus();}"><input id="m${lineId}" type="tel" placeholder="Miz" oninput="upd()" onkeydown="if(event.key==='Enter'){event.preventDefault(); addLine();}">`; lines.appendChild(d); if(!first)setTimeout(()=>document.getElementById('b'+lineId).focus(),50);}
function upd(){let t=0; for(let i=1;i<=lineId;i++){const m=document.getElementById('m'+i); if(m)t+=parseInt(m.value)||0;} tot.innerText=t+'$'; paye.innerText=(t*(selT.length||1))+'$';}
function checkLimite(jeu,mise){jeu=jeu.toLowerCase(); if(jeu.includes('bolet')) return mise<=limites.bolet; if(jeu.includes('maryaj')) return mise<=limites.maryaj; if(jeu.includes('loto3')) return mise<=limites.loto3; if(jeu.includes('loto4')) return mise<=limites.loto4; if(jeu.includes('loto5')) return mise<=limites.loto5; return true;}
function vann(){if(selT.length===0)return alert('Chwazi tiraj'); let corps='',has=false,details=[]; for(let i=1;i<=lineId;i++){const b=document.getElementById('b'+i),m=document.getElementById('m'+i),j=document.getElementById('j'+i); if(b&&b.value&&m&&m.value){const mise=parseInt(m.value)||0; if(!checkLimite(j.value,mise)){alert('Limit depase '+j.value+' max '+(j.value.toLowerCase().includes('bolet')?limites.bolet: j.value.toLowerCase().includes('maryaj')?limites.maryaj: limites.loto3)); return;} corps+=`${j.value.slice(0,3)} ${b.value} - ${m.value}$<br>`; details.push({jeu:j.value,boul:b.value,mise:mise}); has=true;}} if(!has)return alert('Mete boul'); const id=Date.now(); const ticket=`<div class="ticket"><b>C&D VÉRITÉ LOTTO</b><br>${getHaitiDateTimeStr()}<br>Tirage: ${selT.join(', ')}<br>ID: ${id}<br>Vandè: ${curV}<br>.........................<br>${corps}.........................<br>${tot.innerText} × ${selT.length} = <b>${paye.innerText}</b><br><br>Mèsi</div>`; prt.innerHTML=ticket; prt.style.display='block'; const f={id,vendor:curV,tiraj:selT.join(','),total:parseInt(tot.innerText)||0,nb:selT.length,ticket,time:Date.now(),details}; fichesData.push(f); localStorage.setItem('fiches',JSON.stringify(fichesData)); db.ref('fiches/'+id).set({id,vendor:curV,tiraj:selT.join(','),total:f.total,nbTiraj:selT.length,date:Date.now(),details,ticketHtml:ticket,gain:0}); window.print(); lines.innerHTML=''; lineId=0; addLine(true); upd();}
function loadF(){listF.innerHTML=''; fichesData.filter(f=>f.vendor===curV).reverse().forEach(f=>{listF.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #ccc;align-items:center"><span>${new Date(f.time).toLocaleString('fr-HT',{timeZone:'America/Port-au-Prince'})}<br><b>${f.tiraj}</b> - ${f.total*f.nb}$</span><button onclick="reprint(${f.id})" style="background:#000;color:#FFD700;border:none;padding:8px 12px;border-radius:8px;font-weight:bold">Kopye</button></div>`;});}
function reprint(id){const f=fichesData.find(x=>x.id===id); if(f){prt.innerHTML=f.ticket; prt.style.display='block'; window.print();}}
function getCom(){const c=cfg.commission; if(!c)return {pct:10,active:true}; if(typeof c==='object')return {pct:parseInt(c.pct)||10,active:c.active!==false}; return {pct:parseInt(c)||10,active:true};}
function genRap(){db.ref('fiches').once('value',snap=>{const all=Object.values(snap.val()||{}); const com=getCom(); const pct=com.active?com.pct:0; const duV=du.value,auV=au.value,fil=fT.value; let vente=0,gain=0,count=0; let uniq={}; let html=''; all.forEach(f=>{if(f.vendor!==curV)return; const d=new Date(f.date); const start=duV?new Date(duV+'T00:00:00'):null; const end=auV?new Date(auV+'T23:59:59'):null; if(start&&d<start)return; if(end&&d>end)return; if(fil!=='tous'&&!(f.tiraj||'').includes(fil))return; uniq[f.id]=f;}); Object.values(uniq).forEach(f=>{vente+=(f.total||0)*(f.nbTiraj||f.nb||1); gain+=f.gain||0; count++; const fd=new Date(f.date).toLocaleString('fr-HT',{timeZone:'America/Port-au-Prince'}); html+=`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #ccc;align-items:center"><span>${fd}<br><b>${f.tiraj}</b> - ${(f.total||0)*(f.nbTiraj||1)}$ ${f.gain?'<b style=color:green>WIN:'+f.gain+'$</b>':''}</span><button onclick="copyFromFirebase('${f.id}')" style="background:#000;color:#FFD700;border:none;padding:6px 10px;border-radius:8px">Kopye</button></div>`;}); const comV=Math.round(vente*pct/100); rap.innerHTML=`<div style="border:3px solid #000;padding:12px;text-align:center;background:#fff"><div>Vente: ${vente}$ | Commission ${pct}%: ${comV}$</div><div>Gain Peye: ${gain}$</div><div style="font-size:22px;font-weight:bold;background:#000;color:#FFD700;padding:8px;border-radius:8px;margin:6px 0">A PEYE / Net: ${vente-comV-gain}$</div><div>Fiches: ${count}</div></div>`; rapList.innerHTML=html||'Pa gen fich pou dat sa';});}
function copyFromFirebase(id){db.ref('fiches/'+id).once('value',s=>{const f=s.val(); if(f&&f.ticketHtml){prt.innerHTML=f.ticketHtml; prt.style.display='block'; window.print();} else if(f){const t=`<div class=ticket><b>C&D LOTTO</b><br>${new Date(f.date).toLocaleString()}<br>${f.tiraj} - ${f.total*f.nbTiraj}$</div>`; prt.innerHTML=t; prt.style.display='block'; window.print();}});}
function imprimeFiches(){prt.innerHTML=`<div style="text-align:center"><h3>Fiches - ${curV} ${getHaitiDate()}</h3>${listF.innerHTML}</div>`; prt.style.display='block'; window.print();}
function imprimeRapport(){prt.innerHTML=rap.innerHTML+rapList.innerHTML; prt.style.display='block'; window.print();}
function renderLastRes(){db.ref('resultats').limitToLast(1).once('value',s=>{const v=s.val(); if(!v)return; const r=Object.values(v)[0]; lastRes.innerHTML=`Dènye Rezilta: <b>${r.tirage} ${r.date}</b> 1:${r.r1} 2:${r.r2} 3:${r.r3}`;});}
</script></body></html>
