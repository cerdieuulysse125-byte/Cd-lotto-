<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V116.0 LYE VRE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:6px;text-align:center;font-weight:900;font-size:9px}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:12px;border:2px solid #000;border-radius:10px;width:100%;font-size:14px;margin:4px 0;font-weight:700}.tiraj{padding:6px 10px;margin:3px;border:2px solid #000;border-radius:20px;font-weight:900;display:inline-block;font-size:10px;cursor:pointer}.tiraj.active{background:#000;color:#FFD700}.btn{padding:13px;width:100%;border:none;border-radius:10px;font-weight:900;margin:5px 0}.bK{background:#000;color:#FFD700}.bV{background:#16a34a;color:#fff}.tab2{display:flex;background:#000;gap:1px;position:sticky;top:0;z-index:20}.tab2 button{flex:1;padding:10px 1px;font-size:9px;font-weight:900;background:#000;color:#FFD700;border:none}.tab2 button.active{background:#FFD700;color:#000}</style>
</head><body>
<div class="h">V116.0 - VENDEUR LYE AK PROPRIO - RAPPORT KORIJE</div>
<div id="loginBox" class="card" style="text-align:center;padding-top:30px"><h3>Connexion Vendeur</h3><input id="uName" placeholder="Kòd Vendeur" value="JULES"><input id="uPass" type="password" placeholder="Modpas"><input id="pCode" placeholder="Kòd Proprio (si premye fwa)" style="background:#FFFBEB"><button class="btn bK" onclick="go()">Antre</button><div id="loginErr" style="color:red;font-weight:900;margin-top:6px"></div><div id="loginOk" style="color:green;font-weight:900"></div></div>

<div id="appBox" style="display:none">
<div class="tab2"><button id="tV" class="active" onclick="showTab('vendre')">1.Vendre</button><button id="tC" onclick="showTab('kopyeTab')">2.Copier</button><button id="tF" onclick="showTab('fichesTab')">3.Fiches</button><button id="tR" onclick="showTab('rapportTab')">4.Rapport</button></div>

<div id="vendre" class="card">
<div style="text-align:center;font-weight:900;font-size:10px;margin:6px">TIRAJ - <span id="dateToday" style="background:#FFD700;padding:3px 6px;border-radius:5px"></span> - <span id="userShow" style="background:#000;color:#FFD700;padding:3px 6px;border-radius:5px"></span> - <span id="proprioShow" style="background:#16a34a;color:#fff;padding:3px 6px;border-radius:5px">PA LYE</span></div>
<div id="tirajBox" style="text-align:center;margin:8px 0"></div>
<div style="display:flex;background:#000;color:#FFD700;padding:7px;font-weight:900;border-radius:6px;font-size:10px"><div style="width:85px">JEUX</div><div style="flex:1">BOUL</div><div style="width:75px">MIZ</div></div>
<div style="display:flex;gap:5px;margin-top:8px"><select id="j0" style="width:85px"><option>Borlettes</option><option>Mariage</option><option>Loto3</option><option>Loto4</option><option>Loto5</option></select><input id="b0" placeholder="Boul" style="flex:1"><input id="m0" type="number" placeholder="Miz" style="width:75px" oninput="calc()"></div>
<div style="background:#000;color:#fff;padding:10px;border-radius:8px;text-align:center;margin-top:10px">Total <span id="tot">0$</span> × <span id="nbT">1</span><div style="font-size:24px;color:#FFD700">A PEYE <span id="paye">0$</span></div></div>
<button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button><div id="lastTicket"></div>
</div>

<div id="kopyeTab" class="card" style="display:none"><h3>Copier</h3><input id="searchId" placeholder="ID 5 lèt" style="text-transform:uppercase"><button class="btn bK" onclick="searchById()">Chèche</button><div id="kopyeResult"></div><button class="btn bV" onclick="showTab('vendre')">↩️ VENDRE</button></div>
<div id="fichesTab" class="card" style="display:none"><h3>Fiches (<span id="nbFiches">0</span>)</h3><div id="fichesList"></div><button class="btn bV" onclick="showTab('vendre')">↩️ VENDRE</button></div>
<div id="rapportTab" class="card" style="display:none"><h3>Rapport - Lye ak Proprio</h3><div id="proprioStatus" style="background:#FFFBEB;border:2px solid #f59e0b;padding:8px;border-radius:8px;font-size:11px;margin-bottom:8px"></div><div style="display:flex;gap:6px"><input type="date" id="du"><input type="date" id="au"></div><select id="rapportTiraj"><option value="tous">Tous Tiraj</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><button class="btn bK" onclick="genererRapport()">Générer Rapport</button><div id="rapportContent" style="border:2px solid #000;border-radius:10px;padding:10px;margin-top:10px">Vente: <b id="rVente">0$</b><br>Comm: <b id="rCom">0$</b><br>A Payer: <b id="rPaye">0$</b><br>Balance: <b id="rNet">0$</b></div><div id="rapportDetail"></div><button class="btn bK" onclick="window.print()">Imprimer</button><button class="btn bV" onclick="showTab('vendre')">↩️ VENDRE</button></div>
</div>

<script>
const firebaseConfig={databaseURL:"https://verite-lotto-default-rtdb.firebaseio.com"};firebase.initializeApp(firebaseConfig);const db=firebase.database();
const TIRAJ_CONFIG=[{name:"GA MIDI"},{name:"FL MIDI"},{name:"NY MIDI"},{name:"GA SOIR"},{name:"FL SOIR"},{name:"NY SOIR"}];
let selectedTiraj=[],USER="",PROPRIO_ID="",FICHES=[],PRIX={Borlettes:50,Mariage:1000,Loto3:400,Loto4:5000,Loto5:10000};

function go(){
let u=document.getElementById('uName').value.trim().toUpperCase();
let pc=document.getElementById('pCode').value.trim().toUpperCase();
if(!u){document.getElementById('loginErr').innerText="Mete kòd";return;}
USER=u;
try{FICHES=JSON.parse(localStorage.getItem('fiches_'+USER)||'[]')}catch(e){FICHES=[]}
let savedProprio=localStorage.getItem('vendeur_'+USER+'_proprio');
if(savedProprio)PROPRIO_ID=savedProprio;
if(pc)PROPRIO_ID=pc;

// ANTRE DIRÈK - PA BLOKE
document.getElementById('loginBox').style.display='none';
document.getElementById('appBox').style.display='block';
document.getElementById('dateToday').innerText=new Date().toLocaleDateString();
document.getElementById('userShow').innerText=USER;
document.getElementById('proprioShow').innerText=PROPRIO_ID||"CHÈCHE...";
initApp();history.pushState(null,null,location.href);
let t=new Date().toISOString().split('T')[0];document.getElementById('du').value=t;document.getElementById('au').value=t;

// Chèche proprio an background
lierProprio();
}

async function lierProprio(){
try{
if(!PROPRIO_ID){
// 1. Chèche nan vendeurs/
let vs=await db.ref('vendeurs/'+USER).once('value');
if(vs.exists()){let d=vs.val();PROPRIO_ID=d.proprioId||d.proprio||d.owner||"";}
}
if(!PROPRIO_ID){
// 2. Chèche nan tout proprios
let all=await db.ref('proprios').once('value');
all.forEach(pp=>{
if(pp.child('vendeurs/'+USER).exists())PROPRIO_ID=pp.key;
});
}
if(PROPRIO_ID){
localStorage.setItem('vendeur_'+USER+'_proprio',PROPRIO_ID);
document.getElementById('proprioShow').innerText=PROPRIO_ID.substring(0,8);
document.getElementById('proprioShow').style.background="#16a34a";
document.getElementById('proprioStatus').innerHTML="✅ Lye ak Proprio: <b>"+PROPRIO_ID+"</b><br>Rapò ap pran rezilta nan proprio a";
let p=await db.ref('proprios/'+PROPRIO_ID+'/config/prix').once('value');
if(p.exists())PRIX=p.val();
// Lye vendeur a nan proprio a si li pa la
await db.ref('proprios/'+PROPRIO_ID+'/vendeurs/'+USER).set({code:USER,actif:true});
await db.ref('vendeurs/'+USER).update({proprioId:PROPRIO_ID});
}else{
document.getElementById('proprioShow').innerText="PA LYE";
document.getElementById('proprioStatus').innerHTML="⚠️ Pa jwenn proprio! Antre Kòd Proprio nan login oswa kreye vendeur a nan app Proprio a.<br><b>Rapò ap mache ak fich local selman</b>";
}
}catch(e){console.log(e);document.getElementById('proprioStatus').innerHTML="Erè lyezon: "+e.message;}
}

function initApp(){let tb=document.getElementById('tirajBox');tb.innerHTML="";TIRAJ_CONFIG.forEach(t=>{let el=document.createElement('span');el.className='tiraj';el.innerText=t.name;el.onclick=()=>{el.classList.toggle('active');updateTiraj();};tb.appendChild(el);});calc();}
function updateTiraj(){selectedTiraj=[];document.querySelectorAll('.tiraj.active').forEach(x=>selectedTiraj.push(x.innerText));document.getElementById('nbT').innerText=selectedTiraj.length||1;calc();}
function calc(){let m=parseFloat(document.getElementById('m0').value)||0;document.getElementById('tot').innerText=m+"$";document.getElementById('paye').innerText=(m*(selectedTiraj.length||1))+"$";}
function showTab(nom){['vendre','kopyeTab','fichesTab','rapportTab'].forEach(id=>document.getElementById(id).style.display=id===nom?'block':'none');document.getElementById('tV').className=nom=='vendre'?'active':'';document.getElementById('tC').className=nom=='kopyeTab'?'active':'';document.getElementById('tF').className=nom=='fichesTab'?'active':'';document.getElementById('tR').className=nom=='rapportTab'?'active':'';if(nom!=='vendre')history.pushState({tab:nom},'', '#'+nom);if(nom==='fichesTab')loadFiches();}
window.onpopstate=()=>{showTab('vendre');};
function genId(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}

async function vann(){
if(selectedTiraj.length===0){alert("Chwazi tiraj!");return;}
let j=document.getElementById('j0').value,b=document.getElementById('b0').value.trim(),m=parseFloat(document.getElementById('m0').value)||0;
if(!b||!m){alert("Mete boul ak miz!");return;}
let id=genId();let now=new Date();let fiche={id:id,vendeur:USER,proprio:PROPRIO_ID||"NO_PROPRIO",date:now.toISOString().split('T')[0],heure:now.toLocaleTimeString(),total:m,tirajs:selectedTiraj,aPeye:m*selectedTiraj.length,jeux:j,boul:b,miz:m,timestamp:Date.now()};
FICHES.push(fiche);localStorage.setItem('fiches_'+USER,JSON.stringify(FICHES));
try{
await db.ref('fiches/'+id).set(fiche);
await db.ref('fiches_vendeur/'+USER+'/'+id).set(fiche);
if(PROPRIO_ID){
await db.ref('proprios/'+PROPRIO_ID+'/fiches/'+id).set(fiche);
await db.ref('proprios/'+PROPRIO_ID+'/fiches_vendeur/'+USER+'/'+id).set(fiche);
await db.ref('proprios/'+PROPRIO_ID+'/fiches_date/'+fiche.date+'/'+id).set(fiche);
}
}catch(e){console.log("Firebase err",e);}
let html=`<div style="border:2px dashed #000;padding:10px;margin-top:10px;text-align:center"><b>${USER} - ${PROPRIO_ID||''}</b><br>ID: <b style="font-size:18px">${id}</b><br>${fiche.date} ${fiche.heure}<br>${selectedTiraj.join(' | ')}<hr>${j} ${b} : ${m}$<hr><b>A PEYE: ${fiche.aPeye}$</b></div>`;
document.getElementById('lastTicket').innerHTML=html+`<button class="btn bV" onclick="clearVendre()">NOUVO FICH</button>`;
loadFiches();
}
function clearVendre(){document.getElementById('b0').value="";document.getElementById('m0').value="";document.getElementById('lastTicket').innerHTML="";calc();}
function loadFiches(){let html="";FICHES.slice().reverse().forEach(f=>{html+=`<div style="border:1px solid #000;padding:8px;margin:5px 0;border-radius:8px;font-size:12px"><b>${f.id}</b> - ${f.heure} - ${f.tirajs.join(', ')}<br>${f.jeux} ${f.boul} : ${f.miz}$ - ${f.aPeye}$</div>`;});document.getElementById('fichesList').innerHTML=html||"Pa gen fich";document.getElementById('nbFiches').innerText=FICHES.length;}
function searchById(){let id=document.getElementById('searchId').value.trim().toUpperCase();let f=FICHES.find(x=>x.id===id);document.getElementById('kopyeResult').innerHTML=f?`<div style="border:2px solid #000;padding:10px">${f.jeux} ${f.boul}<br><button class="btn bK" onclick="applyFiche('${f.id}')">Copier</button></div>`:"Pa jwenn";}
function applyFiche(id){let f=FICHES.find(x=>x.id===id);if(!f)return;showTab('vendre');document.querySelectorAll('.tiraj').forEach(el=>{el.classList.toggle('active',f.tirajs.includes(el.innerText));});updateTiraj();document.getElementById('j0').value=f.jeux;document.getElementById('b0').value=f.boul;document.getElementById('m0').value=f.miz;calc();}

async function genererRapport(){
let du=document.getElementById('du').value,au=document.getElementById('au').value,filtre=document.getElementById('rapportTiraj').value;
if(!PROPRIO_ID){alert("Vandè pa lye ak proprio! Antre Kòd Proprio nan login");return;}
document.getElementById('rVente').innerText="Kalkil...";
let resultats={};let prix=PRIX;
try{
let r=await db.ref('proprios/'+PROPRIO_ID+'/resultats').once('value');if(r.exists())resultats=r.val();
let pp=await db.ref('proprios/'+PROPRIO_ID+'/config/prix').once('value');if(pp.exists())prix=pp.val();
}catch(e){console.log(e);}

let venteGeneral=0,venteFiltre=0,peyeGeneral=0,peyeFiltre=0;
let list="";
FICHES.forEach(f=>{
if(f.date<du||f.date>au)return;
let miz=f.miz||0;let nb=f.tirajs.length;
venteGeneral+=miz*nb;
if(filtre==="tous")venteFiltre=venteGeneral;
else if(f.tirajs.includes(filtre))venteFiltre+=miz; // KORIJE: pa x nb

// Korije chak tiraj ak rezilta proprio
f.tirajs.forEach(tir=>{
let res=resultats[f.date]&&resultats[f.date][tir]?resultats[f.date][tir]:null;
if(!res)return;
let gain=0;
if(f.jeux==="Borlettes"){
if(f.boul===res.premier)gain=miz*(prix.Borlettes||50);
else if(f.boul===res.deuxieme||f.boul===res.troisieme)gain=miz*10;
}
else if(f.jeux==="Mariage"&&res.mariage){
if(res.mariage.includes(f.boul)||res.mariage.includes(f.boul.split('x')[0]+'x'+f.boul.split('x')[1]))gain=miz*(prix.Mariage||1000);
}
else if(f.jeux==="Loto3"&&f.boul===res.premier)gain=miz*(prix.Loto3||400);

if(gain>0){
peyeGeneral+=gain;
if(filtre==="tous"||filtre===tir){peyeFiltre+=gain;list+=`<div style="font-size:11px;border-bottom:1px solid #ddd;padding:4px">${tir} - ${f.boul} genyen ${gain}$</div>`;}
}
});
});

document.getElementById('rVente').innerText=(filtre==="tous"?venteGeneral:venteFiltre)+"$";
document.getElementById('rCom').innerText=Math.round((filtre==="tous"?venteGeneral:venteFiltre)*0.1)+"$";
document.getElementById('rPaye').innerText=(filtre==="tous"?peyeGeneral:peyeFiltre)+"$";
document.getElementById('rNet').innerText=((filtre==="tous"?venteGeneral:venteFiltre)-(filtre==="tous"?peyeGeneral:peyeFiltre))+"$";
document.getElementById('rapportDetail').innerHTML=list||"<div style='text-align:center;color:#666;font-size:11px;margin-top:6px'>Pa gen genyen pou tiraj sa</div>";
}
</script>
</body></html>
