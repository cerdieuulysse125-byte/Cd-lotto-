async function loadF(){let d=document.getElementById('fd').value;if(!d)return;let s=await db.ref('tickets').once('value');let a=s.val()||{};let l=Object.values(a).filter(t=>(t.dateHaiti||'').substring(0,10)===d&&t.serial==='2222');let tot=l.reduce((x,y)=>x+(y.total||0),0);document.getElementById('ftot').style.display='block';document.getElementById('ftot').innerHTML=l.length+' fich - $'+tot;document.getElementById('flist').innerHTML=l.reverse().map(t=>`<div class='card'><b>${t.id}</b> $${t.total}<br><small>${t.tirages.join(', ')}</small></div>`).join('')||'Pa gen';}
async function calc(){let du=document.getElementById('rDu').value,au=document.getElementById('rAu').value,tt=document.getElementById('rT').value;if(!du)du=new Date().toISOString().slice(0,10);if(!au)au=du;let s=await db.ref('tickets').once('value');let a=s.val()||{};let l=Object.values(a).filter(t=>{let td=(t.dateHaiti||'').substring(0,10);if(td<du||td>au)return false;if(t.serial!=='2222')return false;if(tt!=='ALL'&&!(t.tirages||[]).includes(tt))return false;return true;});let rs=await db.ref('results').once('value');let R=rs.val()||{};let p=getP();let vente=0,gain=0,det='';l.forEach(t=>vente+=t.total||0);for(let tk of l){let dt=(tk.dateHaiti||'').substring(0,10);for(let ti of (tk.tirages||[])){let r=Object.values(R).find(x=>x.tirage===ti&& (x.dat||'').substring(0,10)===dt);if(!r)continue;let r1=(r.r1||'').padStart(2,'0'),r2=(r.r2||'').padStart(2,'0'),r3=(r.r3||'').padStart(2,'0'),l3=(r.l3||'').padStart(3,'0');let l4=r2+r3,l5=l3+r2;for(let b of (tk.bets||[])){let n=String(b.numero).trim(),m=b.mise||0,g=0;if(b.type==='boul'){if(n.padStart(2,'0')===r1)g=m*p.p1;else if(n.padStart(2,'0')===r2)g=m*p.p2;else if(n.padStart(2,'0')===r3)g=m*p.p3;}else if(b.type==='maryaj'){let a=n.substring(0,2).padStart(2,'0'),bb=n.substring(2,4).padStart(2,'0');if((a===r1&&bb===r2)||(a===r2&&bb===r1))g=m*p.m1;else if((a===r1&&bb===r3)||(a===r3&&bb===r1))g=m*p.m2;else if((a===r2&&bb===r3)||(a===r3&&bb===r2))g=m*p.m3;}else if(b.type==='loto3'){if(n===l3)g=m*p.l3;}else if(b.type==='loto4'){if(n===l4)g=m*p.l4;}else if(b.type==='loto5'){if(n===l5)g=m*p.l5;}if(g>0){gain+=g;det+=ti+' '+b.type+' '+n+' $'+g+'<br>';}}}}
 let kom=vente*(p.kom||10)/100,bal=vente-kom-gain;document.getElementById('rRes').style.display='block';document.getElementById('rRes').innerHTML=`Vant $${vente}<br>Kom $${kom.toFixed(2)}<br>A Peye $${gain}<br>Balans $${bal.toFixed(2)}<br><br>${det}`;document.getElementById('rPrint').innerText=`Vant $${vente}\nKom $${kom.toFixed(2)}\nA Peye $${gain}\nBalans $${bal.toFixed(2)}`;document.getElementById('rPrint').style.display='block';}
async function verifye(){let id=document.getElementById('payId').value.trim();if(!id)return;let s=await db.ref('tickets/'+id).once('value');let tk=s.val();if(!tk){document.getElementById('payInfo').style.display='block';document.getElementById('payInfo').innerHTML='Pa jwenn';return;}PAY=tk;let rs=await db.ref('results').once('value');let R=rs.val()||{};let p=getP();let gain=0,det='';for(let ti of (tk.tirages||[])){let dt=(tk.dateHaiti||'').substring(0,10);let r=Object.values(R).find(x=>x.tirage===ti&& (x.dat||'').substring(0,10)===dt);if(!r)continue;let r1=(r.r1||'').padStart(2,'0'),r2=(r.r2||'').padStart(2,'0'),r3=(r.r3||'').padStart(2,'0'),l3=(r.l3||'').padStart(3,'0');let l4=r2+r3,l5=l3+r2;for(let b of (tk.bets||[])){let n=String(b.numero).trim(),m=b.mise||0,g=0;if(b.type==='boul'){if(n.padStart(2,'0')===r1)g=m*p.p1;else if(n.padStart(2,'0')===r2)g=m*p.p2;else if(n.padStart(2,'0')===r3)g=m*p.p3;}else if(b.type==='maryaj'){let a=n.substring(0,2).padStart(2,'0'),bb=n.substring(2,4).padStart(2,'0');if((a===r1&&bb===r2)||(a===r2&&bb===r1))g=m*p.m1;else if((a===r1&&bb===r3)||(a===r3&&bb===r1))g=m*p.m2;else if((a===r2&&bb===r3)||(a===r3&&bb===r2))g=m*p.m3;}else if(b.type==='loto3'){if(n===l3)g=m*p.l3;}else if(b.type==='loto4'){if(n===l4)g=m*p.l4;}else if(b.type==='loto5'){if(n===l5)g=m*p.l5;}if(g>0){gain+=g;det+=ti+' '+b.type+' '+n+' $'+g+'<br>';}}}
 GAIN=gain;document.getElementById('payInfo').style.display='block';document.getElementById('payInfo').innerHTML=gain>0?`GANYE $${gain}<br>${det}`:`Pa ganyen`;document.getElementById('btnPeye').style.display=gain>0?'block':'none';document.getElementById('payPrint').style.display='block';document.getElementById('payPrint').innerText=`Id:${tk.id}\nGANYE $${gain}\n\n\n`;}
function peye(){if(!PAY||GAIN<=0)return;if(!confirm('Peye $'+GAIN+'?'))return;db.ref('tickets/'+PAY.id).update({paye:true,payeMontan:GAIN});doPrint(document.getElementById('payPrint').innerText);}
