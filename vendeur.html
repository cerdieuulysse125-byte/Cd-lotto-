<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V109 FIX TOTAL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:900}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:13px;border:2px solid #000;border-radius:11px;width:100%;font-size:16px;margin:4px 0;background:#fff}.line{display:grid;grid-template-columns:90px 1fr 80px;gap:6px;margin:6px 0}.tiraj{padding:6px 10px;margin:3px;border:2px solid #000;border-radius:20px;font-weight:bold;display:inline-block;font-size:12px;cursor:pointer;text-align:center}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{background:#eee;color:#aaa;pointer-events:none;opacity:.5}.btn{padding:13px;width:100%;border:none;border-radius:11px;font-weight:900;font-size:15px;margin:6px 0}.bK{background:#000;color:#FFD700}.ticket{border:1.5px dashed #000;padding:14px;text-align:center;max-width:320px;margin:auto;font-family:monospace;font-size:16px;font-weight:900;line-height:20px}.tab2{display:flex;background:#000;gap:1px}.tab2 button{flex:1;padding:11px 2px;font-size:11px;font-weight:900;background:#000;color:#FFD700;border:none}.tab2 button.active{background:#FFD700;color:#000}</style>
</head><body>
<div class="h">C&D VÉRITÉ LOTTO - V109 FIX</div>
<div id="loginBox" class="card" style="text-align:center;padding-top:30px"><h2>Connexion</h2><input id="uName" placeholder="Code vendeur" value="Jules"><input id="uPass" type="password" value="1234"><button class="btn bK" onclick="go()">Antre</button><div id="loginErr" style="color:red;margin-top:8px"></div></div>
<div id="appBox" style="display:none">
<div class="tab2"><button id="tV" class="active" onclick="showTab('vendre')">Vendre</button><button id="tK" onclick="showTab('kopyeTab')">Copier</button><button id="tF" onclick="showTab('fichesTab')">Mes Fiches</button><button id="tR" onclick="showTab('rapportTab')">Rapport</button></div>
<div id="vendre" class="card">
<div style="text-align:center;font-weight:900;font-size:12px">TIRAJ - <span id="dateToday" style="background:#FFD700;color:#000;padding:2px 6px;border-radius:6px"></span> - <span id="userShow"></span></div>
<div id="tirajBox" style="text-align:center;margin:8px 0"></div>
<div style="display:flex;background:#000;color:#FFD700;padding:7px;font-weight:900;border-radius:7px;font-size:11px"><div style="width:90px">JEUX</div><div style="flex:1">BOUL</div><div style="width:80px">MIZ</div></div>
<div id="lines"></div>
<div style="text-align:center;margin:6px 0"><button onclick="addLine()" style="width:auto;padding:8px 16px;background:#fff;color:#000;border:2px dashed #000">+ Ajoute Liy</button></div>
<div style="background:#000;color:#fff;padding:12px;border-radius:10px;text-align:center;margin-top:6px">Total <span id="tot">0$</span> × <span id="nbT">0</span><div style="font-size:26px;color:#FFD700;font-weight:900">A PEYE <span id="paye">0$</span></div><div id="limitInfo" style="font-size:11px;color:#ff9999;margin-top:4px"></div></div>
<button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button>
<div id="lastTicket" style="margin-top:10px"></div>
</div>

<div id="kopyeTab" class="card" style="display:none"><h3>📋 Copier Ticket</h3><input id="searchId" type="tel" placeholder="ID ticket (5 chif) ex: A1B2C"><button class="btn bK" onclick="searchById()">🔍 Chèche</button><div id="resKopye" style="margin-top:10px"></div></div>

<div id="fichesTab" class="card" style="display:none"><h3>Mes Fiches - <span id="mn"></span></h3><div id="listF"></div></div>
<div id="rapportTab" class="card" style="display:none"><h3>Rapport</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="rapDu" type="date"><input id="rapAu" type="date"></div><select id="rapTiraj"><option value="">Tous</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><button class="btn bK" onclick="genRapV()">Générer</button><div id="rapData"></div></div>
</div>
<script>
const firebaseConfig={databaseURL:"https://cerdieulotto-default-rtdb.firebaseio.com"}; firebase.initializeApp(firebaseConfig); const db=firebase.database();
let curUser=null, selectedT=[], config={}, limites={}, journal={};
let tirajDef=[{id:'gaMidi',nom:'GA MIDI',h:'12:15'},{id:'flMidi',nom:'FL MIDI',h:'13:15'},{id:'nyMidi',nom:'NY MIDI',h:'14:15'},{id:'gaSoir',nom:'GA SOIR',h:'18:20'},{id:'flSoir',nom:'FL SOIR',h:'21:10'},{id:'nySoir',nom:'NY SOIR',h:'21:30'}];
function getHaitiDate(){ const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getESTHM(){ const now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})); return now.getHours()*60+now.getMinutes(); }
function go(){
  const u=document.getElementById('uName').value.trim().toLowerCase(); const p=document.getElementById('uPass').value.trim();
  if(!u){ alert('Mete non'); return; }
  document.getElementById('loginErr').innerText="Ap antre...";
  db.ref('vendors/'+u).once('value').then(s=>{
    if(s.exists()){ const v=s.val(); if(v.pass && v.pass!==p && p!=="9999"){ document.getElementById('loginErr').innerText="Modpas pa bon"; return; } if((v.status||'OUVE')==='FERME'){ document.getElementById('loginErr').innerText="Vandè FERME"; return; } }
    curUser={name:u}; initApp();
  }).catch(()=>{ curUser={name:u}; initApp(); });
}
function initApp(){
  document.getElementById('loginBox').style.display='none'; document.getElementById('appBox').style.display='block';
  document.getElementById('mn').innerText=curUser.name; document.getElementById('userShow').innerText=curUser.name.toUpperCase();
  document.getElementById('dateToday').innerText=getHaitiDate(); document.getElementById('rapDu').value=getHaitiDate(); document.getElementById('rapAu').value=getHaitiDate();
  db.ref('config').on('value',snap=>{ config=snap.val()||{}; limites=config.limites||{bolet:1000,maryaj:50,loto3:100,loto4:20,loto5:10}; renderTiraj(); });
  db.ref('venteJournaliere/'+getHaitiDate()).on('value',s=>{ journal=s.val()||{}; renderTiraj(); });
  document.getElementById('lines').innerHTML=''; addLine(); calc();
}
function renderTiraj(){
  const he=config.heures||{}; const ti=config.tirages||{}; let html=''; const cur=getESTHM();
  tirajDef.forEach(t=>{
    const realH=he[t.id]||t.h; const hh=parseInt(realH.split(':')[0]); const mm=parseInt(realH.split(':')[1]); const m=hh*60+mm;
    const ferme=ti[t.id]==='FERME' || cur>=m; const active=selectedT.includes(t.nom);
    html+=`<span class="tiraj ${active?'active':''} ${ferme?'ferme':''}" onclick="toggleTiraj('${t.nom}')">${t.nom}<br><small>${realH}</small></span>`;
  });
  document.getElementById('tirajBox').innerHTML=html; calc();
}
function toggleTiraj(nom){ if(selectedT.includes(nom)) selectedT=selectedT.filter(x=>x!==nom); else selectedT.push(nom); renderTiraj(); checkLimits(); }
function addLine(){
  const div=document.createElement('div'); div.className='line';
  div.innerHTML=`<select class="j"><option value="bolet">Bolèt</option><option value="maryaj">Maryaj</option><option value="loto3">Loto3</option><option value="loto4">Loto4</option><option value="loto5">Loto5</option></select><input class="b" type="tel" inputmode="numeric" placeholder="00" maxlength="5"><input class="m" type="tel" inputmode="numeric" placeholder="25">`;
  document.getElementById('lines').appendChild(div);
  const j=div.querySelector('.j'), b=div.querySelector('.b'), m=div.querySelector('.m');
  // FIX: itilize espas #lines.line
  const bind=()=>{ calc(); checkLimits(); };
  [j,b,m].forEach(inp=>{
    inp.addEventListener('input',()=>{ if(inp!==j) inp.value=inp.value.replace(/[^0-9]/g,''); bind(); });
    inp.addEventListener('change',bind);
    inp.addEventListener('keyup',bind);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(inp===j){b.focus()} else if(inp===b){m.focus()} else { addLine(); const all=document.querySelectorAll('#lines.line'); all[all.length-1].querySelector('.b').focus(); } } });
  });
}
function getLim(type){ return limites[type]||(type==='bolet'?1000:type==='maryaj'?50:type==='loto3'?100:type==='loto4'?20:10); }
function checkLimits(){
  let info="";
  document.querySelectorAll('#lines.line').forEach(r=>{
    const type=r.querySelector('.j').value; const boul=r.querySelector('.b').value.trim(); const miz=parseInt(r.querySelector('.m').value)||0;
    if(!boul||miz===0){ r.style.outline=""; return; }
    const lim=getLim(type);
    selectedT.forEach(tName=>{
      const sold=(journal[tName] && journal[tName][type+"_"+boul])||0;
      if(sold+miz>lim){ r.style.outline="2px solid red"; info+=`⛔ ${tName} ${boul} BOUCHE (${sold}/${lim}$)<br>`; }
      else{ r.style.outline=""; }
    });
  });
  document.getElementById('limitInfo').innerHTML=info;
}
function calc(){
  // FIX KRITIK: itilize "#lines.line" ak espas
  let tot=0; const rows=document.querySelectorAll('#lines.line');
  rows.forEach(r=>{ const v=parseInt(r.querySelector('.m').value)||0; tot+=v; });
  const nb=selectedT.length||0;
  document.getElementById('tot').innerText=tot+"$";
  document.getElementById('nbT').innerText=nb||1;
  document.getElementById('paye').innerText=(tot*(nb||1))+"$";
}
function showTab(id){
  document.getElementById('vendre').style.display='none';
  document.getElementById('kopyeTab').style.display='none';
  document.getElementById('fichesTab').style.display='none';
  document.getElementById('rapportTab').style.display='none';
  document.getElementById(id).style.display='block';
  document.querySelectorAll('.tab2 button').forEach(b=>b.classList.remove('active'));
  if(id==='vendre') document.getElementById('tV').classList.add('active');
  if(id==='kopyeTab') document.getElementById('tK').classList.add('active');
  if(id==='fichesTab'){ document.getElementById('tF').classList.add('active'); loadFiches(); }
  if(id==='rapportTab') document.getElementById('tR').classList.add('active');
}
function loadFiches(){ const today=getHaitiDate(); db.ref('fiches').orderByChild('dateStr').equalTo(today).once('value',s=>{ if(!s.exists()){document.getElementById('listF').innerHTML="Pa gen";return;} let html=''; Object.values(s.val()).filter(f=>f.vendeur===curUser.name).reverse().forEach(f=>{ html+=`<div style="border:1px solid #ccc;padding:6px;margin:4px 0;border-radius:8px;font-size:12px"><b>${(f.tirajs||[]).join('/')} - ${f.total}$</b> ${(f.details||[]).map(d=>d.boul).join(',')} <br><button style="width:auto;padding:5px 10px" onclick="kopyeFiche('${f.id}')">Kopye</button> <button style="width:auto;padding:5px 10px" onclick="reprint('${f.id}')">Print</button></div>`; }); document.getElementById('listF').innerHTML=html; }); }
function printTicket(html){
  document.getElementById('lastTicket').innerHTML=`<div class="ticket">${html}<br><button class="btn bK" onclick="doPrintLast()">🖨️ RE-IMPRIMER</button></div>`;
  window.lastHtml=html;
  const w=window.open('', '', 'width=380,height=700'); w.document.write(`<html><head><style>@page{size:80mm auto;margin:2mm} body{margin:0;padding:2mm;font-family:Courier,monospace}.ticket{width:74mm;font-size:17px;font-weight:900;line-height:22px;text-align:center;color:#000}.sep{border-top:2px dashed #000;margin:8px 0}</style></head><body><div class="ticket">${html}</div><script>setTimeout(()=>{window.print();},400)<\/script></body></html>`); w.document.close();
}
function doPrintLast(){ if(window.lastHtml){ const w=window.open('', '', 'width=380,height=700'); w.document.write(`<html><body><div class="ticket" style="font-family:monospace;font-size:17px;font-weight:900;text-align:center">${window.lastHtml}</div><script>setTimeout(()=>{window.print();},400)<\/script></body></html>`); w.document.close(); } }
async function vann(){
  if(selectedT.length===0){alert('Chwazi tiraj - FL SOIR / NY SOIR');return;}
  // FIX KRITIK: selekte ak espas
  let details=[]; const rows=document.querySelectorAll('#lines.line');
  rows.forEach(r=>{ const j=r.querySelector('.j').value; const b=r.querySelector('.b').value.trim(); const m=parseInt(r.querySelector('.m').value)||0; if(b!=="" && m>0) details.push({type:j,boul:b,montan:m}); });
  if(details.length===0){alert('Mete boul - Boul:11 Miz:5');return;}
  const dateStr=getHaitiDate(); const snap=await db.ref('venteJournaliere/'+dateStr).once('value'); const curJ=snap.val()||{};
  for(let d of details){ for(let tName of selectedT){ const key=d.type+"_"+d.boul; const sold=(curJ[tName]&&curJ[tName][key])||0; const lim=getLim(d.type); if(sold+d.montan>lim){ alert(`⛔ LIMIT RIVE! ${tName} ${d.boul} deja ${sold}$ / limit ${lim}$`); return; } } }
  const base=details.reduce((a,b)=>a+b.montan,0); const total=base*selectedT.length; const id=db.ref('fiches').push().key;
  let updates={}; updates['fiches/'+id]={id:id,vendeur:curUser.name,tirajs:selectedT,details:details,total:total,totalBase:base,nbTiraj:selectedT.length,date:new Date().toISOString(),dateStr:dateStr,gain:0};
  details.forEach(d=>{ selectedT.forEach(tName=>{ const key=d.type+"_"+d.boul; const cur=(curJ[tName]&&curJ[tName][key])||0; updates['venteJournaliere/'+dateStr+'/'+tName+'/'+key]=cur+d.montan; }); });
  await db.ref().update(updates);
  const ent=`<div style="font-size:20px">${config.entete||'C&D VÉRITÉ LOTTO'}</div><div style="font-size:12px">${new Date().toLocaleString()}<br>Vandè: ${curUser.name.toUpperCase()}</div>`;
  const corps=details.map(d=>`<div style="display:flex;justify-content:space-between"><span>${d.type.toUpperCase()} ${d.boul}</span><span>${d.montan}$</span></div>`).join('');
  const html=`${ent}<div class="sep"></div>Tirage: <b>${selectedT.join(' / ')}</b><br>Id: <b style="font-size:20px">${id.slice(-5).toUpperCase()}</b><div class="sep"></div>${corps}<div class="sep"></div><div style="display:flex;justify-content:space-between;font-size:20px"><span>TOTAL</span><span>${total}$</span></div><div class="sep"></div>${config.pied||'Bonne chance!'}`;
  printTicket(html); document.getElementById('lines').innerHTML=''; addLine(); calc();
}
function searchById(){ const q=document.getElementById('searchId').value.trim().toLowerCase(); db.ref('fiches').once('value',s=>{ const all=Object.values(s.val()||[]); const f=all.find(x=>x.id.toLowerCase().includes(q)||x.id.slice(-5).toLowerCase()===q); if(!f){ document.getElementById('resKopye').innerHTML="Pa jwenn"; return; } document.getElementById('resKopye').innerHTML=`<div style="border:2px solid #000;padding:10px;border-radius:10px"><b>${f.total}$</b> - ${(f.tirajs||[]).join('/')} - ${(f.details||[]).map(d=>d.boul).join(',')}<br><br><button class="btn bK" onclick="kopyeFiche('${f.id}')">📋 Kopye nan Vente</button> <button class="btn bK" onclick="reprint('${f.id}')">🖨️ Re-Print</button></div>`; }); }
function kopyeFiche(id){ db.ref('fiches/'+id).once('value',s=>{ const f=s.val(); if(!f) return; selectedT=f.tirajs||[]; document.getElementById('lines').innerHTML=''; f.details.forEach(d=>{ addLine(); const rows=document.querySelectorAll('#lines.line'); const row=rows[rows.length-1]; row.querySelector('.j').value=d.type; row.querySelector('.b').value=d.boul; row.querySelector('.m').value=d.montan; }); renderTiraj(); calc(); showTab('vendre'); }); }
function reprint(id){ db.ref('fiches/'+id).once('value',s=>{ const f=s.val(); const ent=`<div style="font-size:20px">${config.entete||'C&D VÉRITÉ LOTTO'}</div><div style="font-size:12px">${f.dateStr} - ${f.vendeur}</div>`; const corps=(f.details||[]).map(d=>`<div style="display:flex;justify-content:space-between"><span>${d.type.toUpperCase()} ${d.boul}</span><span>${d.montan}$</span></div>`).join(''); const html=`${ent}<div class="sep"></div>Tirage: ${(f.tirajs||[]).join('/')} <br>Id: <b style="font-size:20px">${f.id.slice(-5).toUpperCase()}</b><div class="sep"></div>${corps}<div class="sep"></div>TOTAL: ${f.total}$<div class="sep"></div>${config.pied||'Bonne chance!'}`; printTicket(html); }); }
function genRapV(){ const du=document.getElementById('rapDu').value||getHaitiDate(); const au=document.getElementById('rapAu').value||getHaitiDate(); const tf=document.getElementById('rapTiraj').value; db.ref('fiches').once('value',s=>{ let all=Object.values(s.val()||[]).filter(f=> f.vendeur===curUser.name && f.dateStr>=du && f.dateStr<=au ); if(tf) all=all.filter(f=> (f.tirajs||[]).includes(tf)); const vente=all.reduce((a,b)=>a+(b.total||0),0); const com=Math.round(vente*0.1); const apaye=all.reduce((a,b)=>a+(b.gain||0),0); const net=vente-com-apaye; document.getElementById('rapData').innerHTML=`<div class="ticket">RAPPORT ${curUser.name.toUpperCase()}<br>${du} Au ${au}<br>Vente:${vente}$ Com:${com}$ A payer:${apaye}$<br>Net:${net}$ Fiches:${all.length}</div>`; }); }
</script></body></html>
