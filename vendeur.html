<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VANDE - FIX AUTO CHAIN</title>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0;padding:0}body{background:#fff}
.top-y{background:#FFD500;text-align:center;padding:12px;font-weight:900;font-size:15px}
.top-b{background:#000;color:#FFD500;text-align:center;padding:10px;font-weight:900}
.menu{display:flex;border:2px solid #000;border-left:none;border-right:none}.menu button{flex:1;padding:13px 0;font-weight:900;background:#fff;border:none;border-right:2px solid #000;font-size:12px}.menu button.active{background:#FFD500}
.limite{margin:10px;border:3px solid red;background:#FFD500;border-radius:22px;padding:12px;text-align:center;font-weight:900;font-size:12px}
.grid{padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.t-btn{border:3px solid #000;border-radius:25px;height:52px;font-weight:900;background:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}.t-btn.active{background:#FFD500}
.t-sel{margin:10px;border:3px solid #000;border-radius:25px;height:52px;display:flex;align-items:center;justify-content:center;font-weight:900;background:#fff}
/* TOUT KAZ MENM DIMANSYON - TIRAJ = JEUX = BOUL = MIZ */
.ligne{display:flex;gap:6px;padding:0 10px;margin-bottom:8px}
.k-jeux{flex:1.2;min-width:0;height:52px;border:3px solid #000;border-radius:25px;font-weight:900;font-size:12px;text-align:center;background:#fff}
.k-boul{flex:0.9;min-width:0;height:52px;border:3px solid #000;border-radius:25px;font-weight:900;font-size:18px;text-align:center;background:#fff}
.k-miz{flex:0.9;min-width:0;height:52px;border:3px solid #000;border-radius:25px;font-weight:900;font-size:18px;text-align:center;background:#FFD500}
.b-x{width:50px;min-width:50px;height:52px;border:3px solid red;color:red;background:#fff;border-radius:18px;font-weight:900;font-size:18px}
.b-d{width:50px;min-width:50px;height:52px;border:3px solid #000;background:#FFD500;border-radius:18px;font-weight:900;font-size:18px}
.total{margin:10px;border:3px solid #000;border-radius:25px;min-height:52px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;padding:8px}
.btns{display:flex;gap:10px;padding:10px}.bb{flex:1;height:56px;border:3px solid #000;border-radius:28px;font-weight:900}.black{background:#000;color:#FFD500}.green{background:#0A9A0A;color:#FF0}
.onglet{display:none}.onglet.active{display:block}
.kf{width:calc(100% - 20px);margin:8px 10px;border:3px solid #000;border-radius:25px;height:52px;text-align:center;font-weight:900}
.box{margin:10px;border:2px solid #000;border-radius:12px;padding:10px;background:#FFF8DC;font-weight:900;font-size:12px}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;text-align:center;font-size:32px;font-weight:900;line-height:1.9}}
</style>
</head>
<body>
<div class="top-y">VENDEUR - JEAN - V7.9 FIX BOUL + LIMITE</div>
<div class="top-b" id="dateBar"></div>
<div class="menu"><button class="active" id="m1" onclick="openO(1)">1.VENTE</button><button id="m2" onclick="openO(2)">2.COPIER</button><button id="m3" onclick="openO(3)">3.FICHES</button><button id="m4" onclick="openO(4)">4.RAPPORT</button></div>

<div id="o1" class="onglet active">
<div class="limite">Limite Global vendeur1+vendeur2+...=Limite global - Bòlèt 1500 Maryaj 100 L3 100 L4 20 L5 5</div>
<div class="grid" id="grid"></div><div class="t-sel" id="tSel"></div>
<div id="container"></div>
<div class="total" id="totalBar"></div>
<div class="btns"><button class="bb black" onclick="valider(false)">💾 VALIDER</button><button class="bb green" onclick="valider(true)">🖨️ VALIDER + IMPRIMER SANTRÉ</button></div>
</div>
<div id="o2" class="onglet"><input id="idT" class="kf" placeholder="ID Ticket"><button class="bb black" style="margin:10px" onclick="copier()">KOPIYE</button><div id="resC"></div></div>
<div id="o3" class="onglet"><input type="date" id="dateF" class="kf"><input id="searchF" class="kf" placeholder="Recherche..."><div id="listF"></div></div>
<div id="o4" class="onglet"><input type="date" id="du" class="kf"><input type="date" id="au" class="kf"><select id="filT" class="kf"><option value="TOUS">Tous</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><button onclick="jenereR()" style="width:calc(100% - 20px);margin:10px;height:52px;border-radius:25px;background:#FFD500;border:3px solid #000;font-weight:900">📊 JENERE</button><div id="rapV" class="box" style="background:#fff"></div></div>
<div id="printArea" style="display:none"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = { apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4", authDomain:"cd-lotto.firebaseapp.com", databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com", projectId:"cd-lotto", storageBucket:"cd-lotto.firebasestorage.app", messagingSenderId:"671091732195", appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6" };
const app=initializeApp(firebaseConfig); const db=getDatabase(app);

let tirajChwazi=["FL MIDI"]; let lignes=[{type:"BOLET",boul:"",miz:""}];
const tirajList=["GA MIDI","FL MIDI","NY MIDI","GA SOIR","FL SOIR","NY SOIR"];

function normM(b){ if(!b)return""; b=b.replace(/[^0-9x]/gi,''); if(!b.includes('x')&&b.length==4) b=b.slice(0,2)+'x'+b.slice(2); const p=b.toLowerCase().split('x'); if(p.length==2) return [p[0],p[1]].sort().join('x'); return b; }
window.openO=function(n){ document.querySelectorAll('.onglet').forEach(o=>o.classList.remove('active')); document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active')); document.getElementById('o'+n).classList.add('active'); document.getElementById('m'+n).classList.add('active'); }
function renderT(){ const g=document.getElementById('grid'); g.innerHTML=""; tirajList.forEach(t=>{ const a=tirajChwazi.includes(t); g.innerHTML+=`<button class="t-btn ${a?'active':''}" onclick="toggleT('${t}')">${t} ${a?'✓':''}</button>`}); document.getElementById('tSel').innerText=tirajChwazi.join(' / ')+' ✓'; }
window.toggleT=function(t){ if(tirajChwazi.includes(t)){ if(tirajChwazi.length>1) tirajChwazi=tirajChwazi.filter(x=>x!==t);} else tirajChwazi.push(t); renderT(); calc(); }

window.renderV=function(){
  const c=document.getElementById('container'); c.innerHTML="";
  lignes.forEach((l,i)=>{
    c.innerHTML+=`<div class="ligne">
      <select class="k-jeux" id="type-${i}"><option ${l.type=="BOLET"?"selected":""}>BOLET</option><option ${l.type=="MARYAJ"?"selected":""}>MARYAJ</option><option ${l.type=="LOTO3"?"selected":""}>LOTO3</option><option ${l.type=="LOTO4"?"selected":""}>LOTO4</option><option ${l.type=="LOTO5"?"selected":""}>LOTO5</option></select>
      <input class="k-boul" id="boul-${i}" value="${l.boul}" placeholder="Boul" inputmode="numeric">
      <input class="k-miz" id="miz-${i}" value="${l.miz}" placeholder="Miz" inputmode="numeric">
      <button class="b-x" onclick="supp(${i})">X</button>
      <button class="b-d" onclick="down(${i})">↓</button>
    </div>`;
  });
  lignes.forEach((_,i)=>{
    const typeEl=document.getElementById(`type-${i}`);
    const boulEl=document.getElementById(`boul-${i}`);
    const mizEl=document.getElementById(`miz-${i}`);

    typeEl.addEventListener('change', e=>{ lignes[i].type=e.target.value; });

    boulEl.addEventListener('input', e=>{
      e.target.value=e.target.value.replace(/[^0-9xX]/g,'');
      lignes[i].boul=e.target.value; calc();
    });
    boulEl.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        e.preventDefault(); document.getElementById(`miz-${i}`)?.focus();
      }
    });

    mizEl.addEventListener('input', e=>{
      e.target.value=e.target.value.replace(/[^0-9]/g,'');
      lignes[i].miz=e.target.value; calc();
      // AUTO-CHAIN: lè ou fin mete miz, kreye pwochen liy otomatik si se dènye liy
      if(e.target.value!=="" && lignes[i].boul.trim()!=="" && i===lignes.length-1){
        // pa kreye 2 fwa si deja gen vide apre
        if(lignes.length<50){
          setTimeout(()=>autoNext(i), 300);
        }
      }
    });
    mizEl.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const nextBoul = document.getElementById(`boul-${i+1}`);
        if(nextBoul){ nextBoul.focus(); }
        else { autoNext(i); }
      }
    });
  });
  calc();
}

function autoNext(i){
  // Si dènye liy la plen, kreye nouvo liy ak menm je
  const curBoul = (lignes[i]?.boul||"").trim();
  const curMiz = (lignes[i]?.miz||"").trim();
  if(curBoul==="" || curMiz==="") return;
  if(i!== lignes.length-1) return; // sèlman si se dènye liy
  const jeu = document.getElementById(`type-${i}`)?.value || lignes[i].type;
  lignes.push({type:jeu,boul:"",miz:""});
  renderV();
  setTimeout(()=>{ document.getElementById(`boul-${lignes.length-1}`)?.focus(); },80);
}

window.supp=function(i){ lignes.splice(i,1); if(lignes.length==0) lignes=[{type:"BOLET",boul:"",miz:""}]; renderV(); }
window.down=function(i){
  lignes[i].type=document.getElementById(`type-${i}`).value;
  lignes[i].boul=document.getElementById(`boul-${i}`).value;
  lignes[i].miz=document.getElementById(`miz-${i}`).value;
  const jeu=lignes[i].type;
  lignes.splice(i+1,0,{type:jeu,boul:"",miz:""});
  renderV();
  setTimeout(()=>document.getElementById(`boul-${i+1}`)?.focus(),80);
}
window.calc=function(){
  let base=0; lignes.forEach(l=>{ if(l.boul.trim()!=""&&parseInt(l.miz)>0) base+=parseInt(l.miz); });
  const tot=base*(tirajChwazi.length||1);
  document.getElementById('totalBar').innerText=`Total ×tiraj sélectionné - $${base} × ${tirajChwazi.length} = $${tot} - Boul ➡️ Miz ➡️ liy apre konsève je - Flèche ↓ kenbe je`;
}
window.valider=async function(doPrint){
  const valides=lignes.filter(f=>f.boul.trim()!=""&&f.miz.trim()!="").map(f=>({...f,boul:f.type=="MARYAJ"?normM(f.boul):f.boul}));
  if(valides.length==0) return;
  const dateStr=new Date().toISOString().slice(0,10); const id="T-"+Date.now().toString().slice(-6);
  const tot=valides.reduce((s,f)=>s+(parseInt(f.miz)||0),0)*tirajChwazi.length;
  const snap=await get(ref(db,`ventes/${dateStr}`)); let g={BOLET:0,MARYAJ:0,LOTO3:0,LOTO4:0,LOTO5:0};
  if(snap.exists()){ Object.values(snap.val()).forEach(vs=>Object.values(vs).forEach(fc=>fc.fiches.forEach(x=>{g[x.type]=(g[x.type]||0)+parseInt(x.miz);}))) }
  const lim={BOLET:1500,MARYAJ:100,LOTO3:100,LOTO4:20,LOTO5:5};
  for(let f of valides){ if((g[f.type]||0)+parseInt(f.miz)>lim[f.type]){ alert(`LIMITE GLOBAL ${f.type} DEPASE`); return; } }
  await push(ref(db,`ventes/${dateStr}/JEAN`),{id,tiraj:tirajChwazi,fiches:valides,total:tot,date:dateStr,timestamp:Date.now(),vendeur:"JEAN"});
  const html=`C&D VÉRITÉ LOTTO<br>Date ${dateStr}<br>Tirages ${tirajChwazi.join('/')} <br>Responsable JEAN<br>Ticket ${id}<br>----------------<br>${valides.map(f=>`${f.type} ${f.boul} $${f.miz}`).join('<br>')}<br>----------------<br>TOTAL $${tot}<br><br>Bòn chans, lave chodyè`;
  document.getElementById('printArea').innerHTML=html;
  if(doPrint){ document.getElementById('printArea').style.display='block'; window.print(); document.getElementById('printArea').style.display='none'; }
  lignes=[{type:lignes[lignes.length-1].type,boul:"",miz:""}]; renderV();
}
window.copier=async function(){}
window.jenereR=async function(){}

document.getElementById('dateBar').innerText=new Date().toISOString().slice(0,10)+" | JEAN | 10%";
renderT(); renderV();
</script>
</body>
</html>
