<script>
const DB_ROOT="https://cd-lotto-default-rtdb.firebaseio.com";
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:DB_ROOT,projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const TIRAJ_ALL=['GA midi','FL midi','NY midi','GA soir','FL soir','NY soir','Real','Primera día','Suerte día','Lote Dom','Ganamas','Suerte noche','Primera noche','Loteka','Nacional noche','Leidsa','Anguila 10h','Anguila 18h'];
let DB={vendeurs:{},proprios:{},tickets:{},results:{},limites:{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}},prix:{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000,kom:10}},blokeVendeur:{},blokeProprio:{}};
let MY_VENDEUR_ID=null,MY_SERIAL=null,MY_PROPRIO_ID=null;
let bets=[];let selectedTiraj=[];let lastFichData=null;
function toggleTiraj(){document.getElementById('tirajList').classList.toggle('open');}
function goTab(n){document.querySelectorAll('.tabPage').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab'+n).classList.add('active');document.querySelectorAll('.tab')[n].classList.add('active');}
function init(){
 db.ref().on('value',snap=>{
  let v=snap.val()||{};DB.vendeurs=v.vendeurs||{};DB.proprios=v.proprios||{};DB.tickets=v.tickets||{};DB.results=v.results||{};DB.limites=v.limites||{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}};DB.prix=v.prix||{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000,kom:10}};DB.blokeVendeur=v.blokeVendeur||{};DB.blokeProprio=v.blokeProprio||{};
  syncInfo.innerText='V25.6 '+Object.keys(DB.results).length+'R';
  if(document.getElementById('mainPage').classList.contains('show'))loadAkey();
 });
 let tl=document.getElementById('tirajList');tl.innerHTML=TIRAJ_ALL.map(t=>`<div class='topt' onclick='pickTiraj("${t}")'><b>${t}</b></div>`).join('');
}
function doLogin(){
 let s=ln.value.trim(),p=lp.value.trim();if(!s||!p){loginMsg.innerText='Antre seri ak modpas';return;}
 db.ref('vendeurs').once('value').then(snap=>{
  let all=snap.val()||{},f=null,fId=null;for(let id in all){if((all[id].serial||'').toLowerCase()===s.toLowerCase()){f=all[id];fId=id;break;}}
  if(!f||(f.pass||'')!==p){loginMsg.innerText='Pa bon';return;}
  MY_VENDEUR_ID=fId;MY_SERIAL=f.serial;MY_PROPRIO_ID=f.proprioId;
  document.getElementById('loginPage').style.display='none';document.getElementById('mainPage').classList.add('show');
  loadAkey();setToday();bets=[];selectedTiraj=[];renderSelected();renderBetsFoto();
 });
}
function setToday(){const t=new Date().toISOString().split('T')[0];fDate.value=t;rDu.value=t;rAu.value=t;}
function loadAkey(){
 let results=Object.values(DB.results).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''));
 let bases=[
  {key:'new york',logo:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/New_York_Lottery_logo.svg/500px-New_York_Lottery_logo.svg.png',fallback:'NY'},
  {key:'florida',logo:'https://upload.wikimedia.org/wikipedia/en/thumb/f4/Florida_Lottery_logo.svg/500px-Florida_Lottery_logo.svg.png',fallback:'FL'},
  {key:'georgia',logo:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Georgia_Lottery_logo.svg/500px-Georgia_Lottery_logo.svg.png',fallback:'GA'}
 ];
 let html='';
 bases.forEach(b=>{
  let soir=results.filter(r=>r.tirage.toLowerCase().includes(b.key) && r.tirage.toLowerCase().includes('soir'))[0] || results.filter(r=>r.tirage.toLowerCase().includes(b.key))[0];
  let midi=results.filter(r=>r.tirage.toLowerCase().includes(b.key) && r.tirage.toLowerCase().includes('midi'))[0];
  if(!soir &&!midi) return;
  let l3S=soir?((soir.l3||'000').padStart(3,'0')):'015';let r1S=soir?((soir.r1||'00').padStart(2,'0')):'84';let r2S=soir?((soir.r2||'00').padStart(2,'0')):'23';
  let l3M=midi?((midi.l3||'000').padStart(3,'0')):'097';let r1M=midi?((midi.r1||'00').padStart(2,'0')):'14';let r2M=midi?((midi.r2||'00').padStart(2,'0')):'60';
  html+=`<div class="lottoCardImg"><div class="lottoLogoImg"><img src="${b.logo}" onerror="this.parentNode.innerText='${b.fallback}'"></div><div class="lottoRight"><h4>Aujourd'hui Soir</h4><div class="pillsRow"><span class="pill pill-darkBlue">${l3S}</span><span class="pill pill-orange">${r1S}</span><span class="pill pill-lightBlue">${r2S}</span></div><h4>Aujourd'hui ${b.key==='georgia'?'Matin':'Midi'}</h4><div class="pillsRow"><span class="pill pill-darkBlue">${l3M}</span><span class="pill pill-orange">${r1M}</span><span class="pill pill-lightBlue">${r2M}</span></div></div></div>`;
 });
 document.getElementById('lottoCards').innerHTML=html||'<div class="card">Pa gen rezilta - Boul ki sòti yo nan logo NY FL GA - V25.6</div>';
}
function pickTiraj(t){
 if(selectedTiraj.includes(t)){selectedTiraj=selectedTiraj.filter(x=>x!==t);}else{selectedTiraj.push(t);}
 renderSelected();
}
function renderSelected(){
 let chips=document.getElementById('selectedTirajChips');
 let txt=document.getElementById('tirajTxt');
 if(!selectedTiraj.length){txt.innerText='Chwazi tiraj - PRIX 500/5000/25000 RESPEKTE - EST PAP';chips.innerHTML='';}
 else{txt.innerText=selectedTiraj.join(', ')+' - PRIX 500/5000/25000 RESPEKTE';chips.innerHTML=selectedTiraj.map(t=>`<span style='background:#0a4a2e;color:#d4af37;padding:4px 8px;border-radius:12px;font-size:11px'>${t} <b onclick='pickTiraj("${t}")' style='cursor:pointer'>X</b></span>`).join('');}
 updateTotalBar();
}
function renderBetsFoto(){
 let box=document.getElementById('betsBox');
 if(!bets.length){
  bets.push({id:Date.now(),type:'BOLET',numero:'',mise:''});
 }
 box.innerHTML=bets.map((b,i)=>`
  <div class="betRowFoto">
   <div class="oval" style="flex:1.2"><select id="type_${i}" onchange="bets[${i}].type=this.value"><option value="BOLET" ${b.type==='BOLET'?'selected':''}>BOLET</option><option value="MARYAJ" ${b.type==='MARYAJ'?'selected':''}>MARYAJ L/D</option><option value="LOTO3" ${b.type==='LOTO3'?'selected':''}>LOTO3</option><option value="LOTO4" ${b.type==='LOTO4'?'selected':''}>LOTO4 LÒD</option><option value="LOTO5" ${b.type==='LOTO5'?'selected':''}>LOTO5 LÒD KORIJE</option></select></div>
   <div class="oval" style="flex:1.2"><input id="num_${i}" value="${b.numero}" placeholder="06" inputmode="numeric" onkeydown="handleKey(event,${i},'num')" oninput="bets[${i}].numero=this.value;updateTotalBar()"></div>
   <div class="circle circleYellow" onclick="focusMiz(${i})" id="miz_${i}" style="cursor:pointer"><span id="mizTxt_${i}">${b.mise?b.mise:'Miz'}</span></div>
   <div class="circle circleRed" onclick="bets.splice(${i},1);renderBetsFoto();updateTotalBar()" style="cursor:pointer">X</div>
   <div class="circle circleDown" onclick="addRowFoto(${i})" style="cursor:pointer">↓</div>
  </div>
  <div id="mizInputBox_${i}" style="display:none;margin-bottom:10px"><input id="mizInput_${i}" type="number" inputmode="numeric" placeholder="Miz - ex 10" value="${b.mise}" onkeydown="handleMizKey(event,${i})" oninput="bets[${i}].mise=this.value;document.getElementById('mizTxt_${i}').innerText=this.value||'Miz';updateTotalBar()" style="width:100%;height:52px;border:4px solid #111;border-radius:26px;text-align:center;font-weight:900;font-size:18px"></div>
 `).join('');
 updateTotalBar();
}
function focusMiz(i){let box=document.getElementById(`mizInputBox_${i}`);box.style.display=box.style.display==='none'?'block':'none';setTimeout(()=>document.getElementById(`mizInput_${i}`)?.focus(),50);}
function handleMizKey(e,i){
 if(e.key==='Enter' || e.key==='ArrowDown'){
  e.preventDefault();
  document.getElementById(`mizInputBox_${i}`).style.display='none';
  let next=i+1;
  if(next>=bets.length){
   let lastType=bets[i].type||'BOLET';
   bets.push({id:Date.now(),type:lastType,numero:'',mise:''});
   renderBetsFoto();
   setTimeout(()=>document.getElementById(`num_${next}`)?.focus(),50);
  } else {
   document.getElementById(`num_${next}`)?.focus();
  }
 }
}
function handleKey(e,row,col){
 if(e.key==='Enter' || e.key==='ArrowRight'){
  e.preventDefault();
  if(col==='num'){focusMiz(row);}
 }
 if(e.key==='ArrowDown'){
  e.preventDefault();
  let next=row+1;
  if(next>=bets.length){addRowFoto(row);return;}
  document.getElementById(`num_${next}`)?.focus();
 }
 if(e.key==='ArrowUp' && row>0){document.getElementById(`num_${row-1}`)?.focus();}
}
function addRowFoto(i){
 let lastType=bets[i]?.type||'BOLET';
 let lastMise=bets[i]?.mise||'';
 bets.splice(i+1,0,{id:Date.now(),type:lastType,numero:'',mise:lastMise});
 renderBetsFoto();
 setTimeout(()=>document.getElementById(`num_${i+1}`)?.focus(),50);
}
function updateTotalBar(){
 let total=bets.reduce((a,b)=>a+(+b.mise||0),0);
 let count=bets.filter(b=>b.numero).length;
 let bar=document.getElementById('totalBar');
 let prix='PRIX 50/20/10/1000/500/5000/25000 RESPEKTE';
 let lim='LIMIT GLOBAL PA TIRAJ RESPEKTE';
 // Touche flèche pour avancer a la ligne suivante droite en bas conservant le jeu sélectionné
 bar.innerText=`Total $${total} x ${count} = $${total} - ${prix} - ${lim}`;
 let prev=document.getElementById('prev');
 if(total>0){
  let txt=`C&D V25.6\nSeri ${MY_SERIAL}\n${selectedTiraj.join(', ')}\n`;
  bets.forEach(b=>{if(b.numero)txt+=`${b.type} ${b.numero} $${b.mise}\n`;});
  txt+=`TOTAL $${total}\n`;
  prev.innerText=txt;prev.style.display='block';
 } else {prev.style.display='none';}
}
function saveFich(){
 if(!selectedTiraj.length){alert('Chwazi tiraj - PRIX 500/5000/25000 RESPEKTE - EST PAP - Vandè a ki pou seleksyone tiraj');return;}
 if(!bets.length||bets.every(b=>!b.numero||!b.mise)){alert('Kaz vid - Vandè a ranpli yo - Jeux Boul Miz X');return;}
