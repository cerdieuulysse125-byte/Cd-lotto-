<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VANDE V10.8 DOUBLE LIMIT - PA VANDE + V9.8</title>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0;padding:0}body{background:#fff;touch-action:manipulation}
.top{background:#000;color:#FFD500;text-align:center;padding:14px;font-weight:900;font-size:11px}
.card{background:#fff;border:3px solid #000;border-radius:22px;padding:12px;margin:10px}
.tiraj{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}.tiraj label{border:3px solid #000;border-radius:20px;padding:12px;text-align:center;font-weight:900;font-size:10px;min-height:52px;display:flex;align-items:center;justify-content:center;background:#fff}.tiraj input{display:none}.tiraj input:checked+label{background:#FFD500}
.row{display:grid;grid-template-columns:0.9fr 1.2fr 0.6fr 0.5fr;gap:8px;margin:8px 0}
.kf{border:3px solid #000;border-radius:20px;height:54px;text-align:center;font-weight:900;width:100%;font-size:15px;background:#fff}
.btn{border:3px solid #000;border-radius:20px;height:54px;font-weight:900;width:100%;font-size:12px;cursor:pointer}.btn-y{background:#FFD500}.btn-b{background:#000;color:#FFD500}
.list{border:3px solid #000;border-radius:20px;padding:10px;min-height:70px;margin:10px 0;background:#FFF8DC}
.badge{display:inline-block;background:#fff;border:2px solid #000;border-radius:14px;padding:6px 10px;font-weight:900;font-size:11px;margin:4px}
#printArea{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;display:block!important}}
</style>
</head>
<body>
<div class="top">VANDE V10.8 - DOUBLE LIMIT V9.8 - PA VANDE + VANDÈ 1+VANDÈ 2 - 12×34 BON</div>
<div class="card">
<div style="font-weight:900;text-align:center;font-size:11px">Chwazi Tiraj</div>
<div class="tiraj">
<input type="checkbox" value="GA MIDI" id="t1"><label for="t1">GA MIDI</label>
<input type="checkbox" value="FL MIDI" id="t2"><label for="t2">FL MIDI</label>
<input type="checkbox" value="NY MIDI" id="t3"><label for="t3">NY MIDI</label>
<input type="checkbox" value="GA SOIR" id="t4"><label for="t4">GA SOIR</label>
<input type="checkbox" value="FL SOIR" id="t5"><label for="t5">FL SOIR</label>
<input type="checkbox" value="NY SOIR" id="t6"><label for="t6">NY SOIR</label>
</div>
<div class="row">
<select id="typeSel" class="kf" style="font-size:10px"><option value="BOLET">BOLET</option><option value="MARYAJ">MARYAJ</option><option value="LOTO3">LOTO3</option><option value="LOTO4">LOTO4</option><option value="LOTO5">LOTO5</option></select>
<input id="boulIn" class="kf" placeholder="Boul" inputmode="numeric">
<input id="mizIn" class="kf" placeholder="$" inputmode="numeric">
<button type="button" class="btn btn-y" id="btnAdd">+</button>
</div>
<div id="list" class="list"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<button type="button" class="btn btn-b" id="btnSave">💾 ANREJISTRE</button>
<button type="button" class="btn btn-y" id="btnPrint">🖨️ IMPRIMER</button>
</div>
<div id="total" style="text-align:center;font-weight:900;margin-top:12px;font-size:14px">TOTAL $0</div>
</div>
<div id="printArea"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
const vendeurActif=localStorage.getItem("vendeur")||"Jules";
let lignes=[]; let tirajChwazi=[];
function getDatePAP(){return new Intl.DateTimeFormat('en-CA',{timeZone:"America/Port-au-Prince",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}
function getHeurePAP(){const d=new Date(); const s=new Intl.DateTimeFormat('en-CA',{timeZone:"America/Port-au-Prince",hour:"2-digit",minute:"2-digit",hour12:false}).format(d); const [h,m]=s.split(':').map(Number); return h*60+m;}
function normM(b){if(!b) return ""; b=b.toString().trim().toLowerCase().replace(/[^0-9x]/g,''); if(!b.includes('x')&&b.length==4) b=b.slice(0,2)+'x'+b.slice(2); const p=b.split('x').filter(x=>x!=""); if(p.length!=2) return b; return [p[0].padStart(2,'0'),p[1].padStart(2,'0')].sort().join('x');}
function renderV(){
  const cont=document.getElementById('list'); let tot=0; cont.innerHTML=""; if(lignes.length==0){cont.innerHTML=`<div style="text-align:center;font-weight:900;color:#888;font-size:10px">Pa gen fich</div>`; document.getElementById('total').innerText=`TOTAL $0`; return;}
  lignes.forEach((l,i)=>{ if(l.boul==""&&l.miz=="") return; const lb=l.type=="MARYAJ"?normM(l.boul):l.boul; tot+=parseInt(l.miz)||0; cont.innerHTML+=`<span class="badge">${l.type} ${lb} $${l.miz} <span data-i="${i}" style="color:red;margin-left:8px">X</span></span>`; });
  document.getElementById('total').innerText=`TOTAL $${tot*tirajChwazi.length} (${tirajChwazi.length} tiraj)`;
  cont.querySelectorAll('[data-i]').forEach(e=>e.addEventListener('click',()=>{lignes.splice(parseInt(e.dataset.i),1);renderV();}));
}
document.querySelectorAll('.tiraj input').forEach(inp=>inp.addEventListener('change',()=>{tirajChwazi=Array.from(document.querySelectorAll('.tiraj input:checked')).map(i=>i.value);renderV();}));

document.getElementById('btnAdd').addEventListener('click',async()=>{
  const type=document.getElementById('typeSel').value; let boul=document.getElementById('boulIn').value.trim(); const miz=parseInt(document.getElementById('mizIn').value.trim()||"0");
  if(!boul||!miz){alert("Antre boul + $");return;} if(type=="MARYAJ") boul=normM(boul);
  const dateStr=getDatePAP();
  try{
    // 1 - LIMIT PA VANDÈ
    const snapLimV=await get(ref(db,`limites/${vendeurActif}`));
    const maxVendeur=snapLimV.exists()?parseInt(snapLimV.val()[type]||999999):999999;
    // 2 - LIMIT GLOBAL = VANDE 1+2+...
    const snapLimG=await get(ref(db,`limites_global`));
    const maxGlobal=snapLimG.exists()?parseInt(snapLimG.val()[type]||999999):999999;

    const snapAll=await get(ref(db,`ventes/${dateStr}`));
    let dejaVendeur=0; let dejaGlobal=0;
    if(snapAll.exists()){
      Object.entries(snapAll.val()).forEach(([vNom][fichList])=>{
        Object.values(fichList).forEach(fiche=>{
          fiche.fiches.forEach(f=>{
            if(f.type!=type) return;
            let match=false;
            if(type=="MARYAJ") match=normM(f.boul)==normM(boul);
            else match=f.boul==boul;
            if(match){
              if(vNom==vendeurActif) dejaVendeur+=parseInt(f.miz)||0;
              dejaGlobal+=parseInt(f.miz)||0;
            }
          });
        });
      });
    }
    // + sa k nan fich kounya (pa anrejistre ankò)
    lignes.forEach(l=>{
      if(l.type!=type) return;
      let match=false;
      if(type=="MARYAJ") match=normM(l.boul)==normM(boul);
      else match=l.boul==boul;
      if(match){ dejaVendeur+=parseInt(l.miz)||0; dejaGlobal+=parseInt(l.miz)||0; }
    });

    if((dejaVendeur+miz)>maxVendeur){alert(`⛔ LIMIT PA VANDÈ BLOKE\n${type} ${boul}\nMax pa vandè ${vendeurActif}: ${maxVendeur}$\nDeja vann: ${dejaVendeur}$\nOu vle ajoute: ${miz}$\nDEPASE!`);return;}
    if((dejaGlobal+miz)>maxGlobal){alert(`⛔ LIMIT GLOBAL BLOKE - VANDE 1+2+...\n${type} ${boul}\nMax Global tout vandè: ${maxGlobal}$\nDeja vann tout vandè: ${dejaGlobal}$\nOu vle ajoute: ${miz}$\nDEPASE GLOBAL!`);return;}

  }catch(e){ console.log(e); }
  lignes.push({type,boul,miz:miz.toString()});
  document.getElementById('boulIn').value=""; document.getElementById('mizIn').value=""; renderV();
});

window.valider=async function(doPrint){
  const valides=lignes.filter(f=>f.boul.trim()!=""&&f.miz.trim()!="").map(f=>({...f,boul:f.type=="MARYAJ"?normM(f.boul):f.boul}));
  if(valides.length==0||tirajChwazi.length==0){alert("Chwazi tiraj + boul");return;}
  const dateStr=getDatePAP(); const cur=getHeurePAP(); const snapH=await get(ref(db,`heures`));
  if(snapH.exists()){ const h=snapH.val(); for(let t of tirajChwazi){ const hm=h[t.replace(' ','_')]; if(!hm) continue; const [hh,mm]=hm.split(':').map(Number); if(cur>hh*60+mm){alert(`FÈMÈ ${t}`);return;} } }
  const id="T-"+Date.now().toString().slice(-6); const tot=valides.reduce((s,f)=>s+(parseInt(f.miz)||0),0)*tirajChwazi.length;
  await push(ref(db,`ventes/${dateStr}/${vendeurActif}`),{id,tiraj:tirajChwazi,fiches:valides,total:tot,date:dateStr,timestamp:Date.now(),vendeur:vendeurActif});
  const fichLignes=valides.map(f=>`<div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px dashed #999"><span style="width:100px;text-align:left;font-size:18px">${f.type}</span><span style="flex:1;text-align:center;font-size:20px;font-weight:900;letter-spacing:2px">${f.boul}</span><span style="width:70px;text-align:right;font-size:18px">$${f.miz}</span></div>`).join('');
  const html=`<div style="text-align:center;font-family:monospace;font-weight:900;width:320px;margin:0 auto;color:#000;background:#fff;padding:12px"><div style="font-size:22px">C&D VÉRITÉ LOTTO</div><div style="font-size:14px;margin-top:10px">Date ${dateStr} EST PAP</div><div style="font-size:14px">Tirages ${tirajChwazi.join('/')} </div><div style="font-size:14px">Responsable ${vendeurActif}</div><div style="font-size:14px">Ticket ${id}</div><div style="margin:14px 0">----------------</div><div style="text-align:left">${fichLignes}</div><div style="margin:14px 0">----------------</div><div style="font-size:20px">TOTAL $${tot}</div><div style="margin-top:32px;font-size:17px;text-transform:lowercase">bòn chans, lave chodyè w</div></div>`;
  const pa=document.getElementById('printArea'); pa.innerHTML=html; pa.style.display='block'; if(doPrint) setTimeout(()=>{window.print();pa.style.display='none';},300); lignes=[]; renderV();
}
document.getElementById('btnSave').addEventListener('click',()=>valider(false));
document.getElementById('btnPrint').addEventListener('click',()=>valider(true));
renderV();
</script>
</body>
</html>
