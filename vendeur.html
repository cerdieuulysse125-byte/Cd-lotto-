<script>

firebase.initializeApp(firebaseConfig);const db=firebase.database();
const HORAIRES_DEF={'GA midi':{h:12,m:15},'FL midi':{h:13,m:15},'NY midi':{h:14,m:15},'Real':{h:12,m:45},'Primera día':{h:11,m:50},'Suerte día':{h:12,m:20},'Lote Dom':{h:13,m:45},'Ganamas':{h:14,m:15},'Suerte noche':{h:17,m:50},'Primera noche':{h:19,m:50},'Loteka':{h:19,m:45},'Nacional noche':{h:20,m:50,dimH:17,m:50},'Leidsa':{h:20,m:45,dimH:15,m:45},'Anguila 10h':{h:9,m:55},'Anguila 18h':{h:17,m:55},'GA soir':{h:18,m:15},'FL soir':{h:21,m:15},'NY soir':{h:22,m:15}};

let MY_VENDEUR_ID=null,MY_SERIAL=null,MY_PROPRIO_ID=null;let bets=[];let selectedTiraj=[];let lastFichData=null;let TIRAJ_SYNC=[];let DETECTED_PRINTER=null;let ENTETE_PROP={};
function getHaitiDate(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Port-au-Prince'});}function getHaitiDateTime(){return new Date().toLocaleString('fr-HT',{timeZone:'America/Port-au-Prince'});}function getHaitiNow(){let s=new Date().toLocaleString('en-US',{timeZone:'America/Port-au-Prince',hour12:false});return new Date(s);}

function getHoraires(){return DB.horaires[MY_PROPRIO_ID]||DB.horaires.global||HORAIRES_DEF;}
function isTirajOpen(t){let h=getHoraires()[t]||HORAIRES_DEF[t];if(!h)return true;let n=getHaitiNow();let isDim=n.getDay()===0;let hh=isDim&&(h.dimH!==undefined)?h.dimH:h.h;let mm=isDim&&(h.dimM!==undefined)?h.dimM:h.m;let f=new Date(n);f.setHours(hh,mm,0,0);return n<f;}
function goTab(n){document.querySelectorAll('.tabPage').forEach(p=>p.classList.remove('active'));document.getElementById('tab'+n).classList.add('active');document.getElementById('drawer').classList.remove('open');}
function toggleTiraj(){document.getElementById('tirajList').classList.toggle('open');}
function renderTirajList(){let list=getTirajListSync();let tl=document.getElementById('tirajList');let selR=document.getElementById('rTiraj');if(!tl)return;tl.innerHTML=list.map(t=>{let open=isTirajOpen(t);let h=getHoraires()[t]||HORAIRES_DEF[t];let label=h?`${h.h}h${String(h.m).padStart(2,'0')}`:'';return `<div class='topt ${selectedTiraj.includes(t)?'sel':''} ${!open?'ferme':''}' onclick='pickTiraj("${t}")'><b>${t}</b><br><small>${open?label:'FÈMEN'}</small></div>`}).join('');if(selR){let cur=selR.value;selR.innerHTML='<option value="tous">Tous tirages</option>'+list.map(t=>`<option value="${t}">${t}</option>`).join('');selR.value=cur;}}
function pickTiraj(t){if(!isTirajOpen(t))return;if(selectedTiraj.includes(t))selectedTiraj=selectedTiraj.filter(x=>x!==t);else selectedTiraj.push(t);renderSelected();if(selectedTiraj.length>0)document.getElementById('tirajList').classList.remove('open');}
function renderSelected(){let chips=document.getElementById('selectedChips');let txt=document.getElementById('tirajTxt');if(!selectedTiraj.length){txt.innerText=`Tout tiraj yo nan yon sèl kaz (a chwazi) - ${getTirajListSync().length} tiraj`;chips.innerHTML='';}else{txt.innerText=`${selectedTiraj.length} tiraj: ${selectedTiraj.join(', ')}`;chips.innerHTML=selectedTiraj.map(t=>`<span style='background:#0a4a2e;color:#d4af37;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:800'>${t} <b onclick='pickTiraj("${t}")'>X</b></span>`).join('')+`<span onclick='clearTiraj()' style='background:#c62828;color:#fff;padding:4px 8px;border-radius:12px;font-size:10px'>Libere</span>`;}updateTotal();}
function clearTiraj(){selectedTiraj=[];renderSelected();}
function renderBets(){if(!bets.length)bets.push({id:Date.now(),type:'BOLET',numero:'',mise:''});let box=document.getElementById('betsBox');box.innerHTML=bets.map((b,i)=>`<div class="betRow"><div class="oval" style="flex:1.1"><select id="type_${i}" onchange="bets[${i}].type=this.value"><option value="BOLET" ${b.type==='BOLET'?'selected':''}>BOLET</option><option value="MARYAJ">MARYAJ</option><option value="LOTO3">LOTO3</option><option value="LOTO4">LOTO4</option><option value="LOTO5">LOTO5</option></select></div><div class="oval" style="flex:0.8"><input id="boul_${i}" value="${b.numero}" placeholder="Boul" inputmode="numeric" onfocus="this.select()" onkeydown="handleKaz(event,${i},'boul')" oninput="bets[${i}].numero=this.value.replace(/[^0-9]/g,'');updateTotal()"></div><div class="oval" style="flex:0.6"><input id="miz_${i}" value="${b.mise}" placeholder="Miz" inputmode="numeric" onfocus="this.select()" onkeydown="handleKaz(event,${i},'miz')" oninput="bets[${i}].mise=this.value.replace(/[^0-9]/g,'');updateTotal()"></div><div class="circle circleR" onclick="bets.splice(${i},1);renderBets()">X</div><div class="circle circleD" onclick="addRow(${i})">↓</div></div>`).join('');updateTotal();}
function handleKaz(e,i,kaz){if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();if(kaz==='boul'){document.getElementById(`miz_${i}`)?.focus();}else{let next=i+1;if(next>=bets.length){addRow(i);return;}document.getElementById(`boul_${next}`)?.focus();}}if(e.key==='ArrowDown'){e.preventDefault();let next=i+1;if(next>=bets.length){addRow(i);return;}document.getElementById(`${kaz}_${next}`)?.focus();}if(e.key==='ArrowUp'&&i>0){document.getElementById(`${kaz}_${i-1}`)?.focus();}if(e.key==='ArrowLeft'&&kaz==='miz'){e.preventDefault();document.getElementById(`boul_${i}`)?.focus();}}
function addRow(i){let lastType=bets[i]?.type||'BOLET';bets.splice(i+1,0,{id:Date.now(),type:lastType,numero:'',mise:''});renderBets();setTimeout(()=>document.getElementById(`boul_${i+1}`)?.focus(),40);}

function loadAkeyFoto(){
 let results=Object.values(DB.results).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''));
 let html='';let map=[{key:'new york',fotoNY:true,defSoir:['015','84','23'],defMidi:['097','14','60'],labelSoir:'Aujourd\'hui Soir',labelMidi:'Aujourd\'hui Midi'},{key:'florida',fotoFL:true,defSoir:['918','62','45'],defMidi:['279','66','07'],labelSoir:'Aujourd\'hui Soir',labelMidi:'Aujourd\'hui Midi'},{key:'georgia',fotoGA:true,defSoir:['293','04','49'],defMidi:['346','30','82'],labelSoir:'Aujourd\'hui Soir',labelMidi:'Aujourd\'hui Matin'}];
 map.forEach(m=>{
  let soir=results.filter(r=>r.tirage.toLowerCase().includes(m.key)&&r.tirage.toLowerCase().includes('soir'))[0]||results.filter(r=>r.tirage.toLowerCase().includes(m.key))[0];
  let midi=results.filter(r=>r.tirage.toLowerCase().includes(m.key)&&r.tirage.toLowerCase().includes('midi'))[0]||results.filter(r=>r.tirage.toLowerCase().includes(m.key)&&r.tirage.toLowerCase().includes('matin'))[0];
  let l3S=soir?(soir.l3||m.defSoir[0]).padStart(3,'0'):m.defSoir[0];let r1S=soir?(soir.r1||m.defSoir[1]).padStart(2,'0'):m.defSoir[1];let r2S=soir?(soir.r2||m.defSoir[2]).padStart(2,'0'):m.defSoir[2];
  let l3M=midi?(midi.l3||m.defMidi[0]).padStart(3,'0'):m.defMidi[0];let r1M=midi?(midi.r1||m.defMidi[1]).padStart(2,'0'):m.defMidi[1];let r2M=midi?(midi.r2||m.defMidi[2]).padStart(2,'0'):m.defMidi[2];
  let imgSrc=m.fotoNY?LOGOS.nyFoto: m.fotoFL?LOGOS.flFoto: LOGOS.gaFoto;let fallback=m.fotoNY?LOGOS.nyFallback: m.fotoFL?LOGOS.flFallback: LOGOS.gaFallback;
  html+=`<div class="lottoCard"><div class="lottoLogo"><img src="${imgSrc}" onerror="this.src='${fallback}'" alt="${m.key}"></div><div class="lottoRight"><h4>${m.labelSoir}</h4><div class="pillsRow"><span class="pill pillBlue">${l3S}</span><span class="pill pillOrange">${r1S}</span><span class="pill pillLightBlue">${r2S}</span></div><h4>${m.labelMidi}</h4><div class="pillsRow"><span class="pill pillBlue">${l3M}</span><span class="pill pillOrange">${r1M}</span><span class="pill pillLightBlue">${r2M}</span></div></div></div>`;
 });
 document.getElementById('lottoCards').innerHTML=html;
}
function saveFich(){if(!selectedTiraj.length){alert('Chwazi tiraj');return;}if(!bets.length||bets.every(b=>!b.numero||!b.mise)){alert('Mete Boul ak Miz');return;}let total=bets.reduce((a,b)=>a+(+b.mise||0),0);let id='f_'+Date.now();let ent=getEnteteProprio();let data={id,serial:MY_SERIAL,vendeurId:MY_VENDEUR_ID,proprioId:MY_PROPRIO_ID,tirage:selectedTiraj[0],tirages:selectedTiraj,bets:bets.filter(b=>b.numero&&b.mise).map(b=>({type:b.type.toLowerCase(),numero:String(b.numero).padStart(b.type==='LOTO3'?3:b.type==='LOTO5'?5:2,'0'),mise:+b.mise})),total,grandTotal:total*selectedTiraj.length,dat:getHaitiDate(),date:getHaitiDateTime(),heure:getHaitiNow().toLocaleTimeString(),paye:false,entete:ent,printer:DETECTED_PRINTER};db.ref('tickets/'+id).set(data).then(()=>{lastFichData=data;selectedTiraj=[];bets=[];renderSelected();renderBets();lastPreview.innerHTML=`<div class="card" style="text-align:center"><b>${id} $${data.grandTotal}</b><br><button style='width:100%;padding:10px;background:#00c853;color:#fff;border-radius:20px;margin-top:6px' onclick='printLast()'>IMPRIMER - ${ent.nom}</button></div>`;loadFiches();});}
function printLast(){
 if(!lastFichData)return;let t=lastFichData;let ent=t.entete||getEnteteProprio();
 // Antèt: (antèt super-admin lan mete pou proprio a dwe afiche otomatikman+ dat + tiraj+ vandè + Id ) santre ak logo proprio
 let headerTxt='';
 if(ent.show?.logo!==false && ent.logo) headerTxt+=`[LOGO]\n`;
 if(ent.show?.nom!==false) headerTxt+=`${ent.nom}\n`;
 if(ent.adresse) headerTxt+=`${ent.adresse}\n`;
 if(ent.tel) headerTxt+=`${ent.tel}\n`;
 headerTxt+=`--------------------------\n`;
 if(ent.show?.dat!==false) headerTxt+=`Dat: ${t.dat} ${t.heure}\n`;
 if(ent.show?.tiraj!==false) headerTxt+=`Tiraj: ${(t.tirages||[t.tirage]).join(', ')}\n`;
 if(ent.show?.vendeur!==false) headerTxt+=`Vandè: ${MY_SERIAL}\n`;
 if(ent.show?.id!==false) headerTxt+=`Id: ${t.id}\n`;
 headerTxt+=`--------------------------\n`;
 headerTxt+=`Jeux Boul Mise\n--------------------------\n`;
 t.bets.forEach(b=>{headerTxt+=`${b.type.toUpperCase().padEnd(6,' ')} ${b.numero.padEnd(6,' ')} $${b.mise}\n`;});
 headerTxt+=`--------------------------\n`;
 headerTxt+=`Total $${t.total} x ${t.tirages.length} = $${t.grandTotal}\n`;
 headerTxt+=`--------------------------\n`;
 // Nan Pye paj fich yo: Mèsi pou konfyans ou
 headerTxt+=`${ent.pied||'Mèsi pou konfyans ou'}\n`;
 headerTxt+=`${ent.nom}\n`;

 let prevHtml=`<div style="text-align:center">
  ${ent.show?.logo!==false && ent.logo?`<img src="${ent.logo}" style="width:100px;height:100px;object-fit:contain;margin:0 auto;display:block;border-radius:50%;border:2px solid #d4af37"><br>`:''}
  ${ent.show?.nom!==false?`<b style="font-size:18px">${ent.nom}</b><br>`:''}
  ${ent.adresse?`${ent.adresse}<br>`:''}
  ${ent.tel?`${ent.tel}<br>`:''}
  <div style="border-top:2px dashed #000;margin:8px 0"></div>
  ${ent.show?.dat!==false?`Dat: ${t.dat} ${t.heure}<br>`:''}
  ${ent.show?.tiraj!==false?`Tiraj: ${(t.tirages||[t.tirage]).join(', ')}<br>`:''}
  ${ent.show?.vendeur!==false?`Vandè: ${MY_SERIAL}<br>`:''}
  ${ent.show?.id!==false?`Id: ${t.id}<br>`:''}
 </div>
 <div style="border-top:2px dashed #000;margin:8px 0"></div>
 <div style="display:flex;justify-content:space-between;font-weight:900"><span>Jeux</span><span>Boul</span><span>Mise</span></div>
 <div style="border-top:1px dashed #000;margin:4px 0"></div>
 ${t.bets.map(b=>`<div style="display:flex;justify-content:space-between;font-size:16px;text-align:center"><span>${b.type.toUpperCase()}</span><span>${b.numero}</span><span>$${b.mise}</span></div>`).join('')}
 <div style="border-top:2px dashed #000;margin:8px 0"></div>
 <div style="text-align:center;font-weight:800">Total $${t.total} x ${t.tirages.length} = $${t.grandTotal}</div>
 <div style="border-top:2px dashed #000;margin:8px 0"></div>
 <div style="text-align:center"><b>${ent.pied||'Mèsi pou konfyans ou'}</b><br>${ent.nom}</div>`;

 document.getElementById('prev').innerHTML=prevHtml;
 document.getElementById('prev').style.display='block';
 window.open('rawbt:base64,'+btoa(unescape(encodeURIComponent(headerTxt))));
}
function printFich(id){db.ref('tickets/'+id).once('value').then(s=>{let t=s.val();if(!t)return;lastFichData=t;printLast();});}
function copyFich(){let id=copyId.value.trim();if(!id)return;db.ref('tickets/'+id).once('value').then(s=>{let t=s.val();if(!t)return;bets=t.bets.map(b=>({type:(b.type||'BOLET').toUpperCase(),numero:b.numero,mise:''}));selectedTiraj=t.tirages||[t.tirage];renderSelected();renderBets();goTab(1);});}
function loadFiches(){let d=getHaitiDate();if(fDate.value)d=fDate.value;let arr=Object.values(DB.tickets).filter(t=>t.serial===MY_SERIAL&&t.dat===d);fList.innerHTML=arr.map(t=>`<div class="card" style="text-align:center"><b>${t.id}</b><br>${t.dat} $${t.grandTotal||t.total} ${(t.tirages||[t.tirage]).join(', ')} ${t.paye?'<span style="background:#c62828;color:#fff;padding:2px 6px;border-radius:4px">PEYE</span>':''}<br><small>${t.entete?.nom||''} - ${t.entete?.pied||'Mèsi pou konfyans ou'}</small><br><button onclick="printFich('${t.id}')" style="background:#111;color:#fff;border:0;padding:6px 10px;border-radius:6px;margin-top:4px">Enprime - Santre</button></div>`).join('')||`<div style="text-align:center">Pa gen fich pou ${d}</div>`;}
function checkPeye(){let id=payId.value.trim();if(!id){payRes.innerHTML='Mete Id';return;}db.ref('tickets/'+id).once('value').then(snap=>{let tic=snap.val();if(!tic){payRes.innerHTML='<div style="text-align:center">Pa jwenn</div>';return;}if(tic.paye===true){payRes.innerHTML=`<div style="background:#c62828;color:#fff;padding:10px;border-radius:8px;text-align:center">Deja PEYE - ${tic.payeDate||''}</div>`;return;}let results=Object.values(DB.results).filter(r=> (tic.tirages||[tic.tirage]).includes(r.tirage));let prix=DB.prix[tic.vendeurId]||DB.prix[tic.proprioId]||DB.prix.global;let totalPeye=0,det='';(tic.bets||[]).forEach(b=>{let num=String(b.numero||'').padStart(b.type==='loto3'?3:b.type==='loto5'?5:2,'0'),mise=b.mise||0,type=b.type||'bolet';results.forEach(r=>{let l3=(r.l3||'000').padStart(3,'0'),r1=(r.r1||l3.slice(-2)).padStart(2,'0'),r2=(r.r2||'00').padStart(2,'0'),r3=(r.r3||'00').padStart(2,'0'),l4=r.l4||r2+r3,l5=r.l5||l3+r2,m1=r1+r2,m2=r1+r3,m3=r2+r3;let gain=0;if(type==='bolet'){if(num===r1)gain=mise*prix.p1;else if(num===r2)gain=mise*prix.p2;else if(num===r3)gain=mise*prix.p3;}else if(type==='loto3'){if(num===l3)gain=mise*prix.l3;}else if(type==='maryaj'){if(num===m1||num===m1.slice(2)+m1.slice(0,2))gain=mise*prix.m1;else if(num===m2||num===m2.slice(2)+m2.slice(0,2))gain=mise*prix.m2;else if(num===m3||num===m3.slice(2)+m3.slice(0,2))gain=mise*prix.m3;}else if(type==='loto4'){if(num===l4)gain=mise*5000;}else if(type==='loto5'){if(num===l5)gain=mise*prix.l5;}if(gain>0){totalPeye+=gain;det+=`<div><b>${r.tirage} ${type} ${num} $${mise} → $${gain}</b></div>`;}});});payRes.innerHTML=`<div style="text-align:center;margin-top:8px"><b>A Peye kliyan: $${totalPeye}</b><br>${det}<br><button style='width:100%;padding:12px;background:#c62828;color:#fff;border-radius:10px' onclick="confirmPeye('${id}',${totalPeye})">Konfime Peye $${totalPeye}</button></div>`;});}
function confirmPeye(id,amount){if(!confirm(`Konfime Peye ${id} $${amount}?`))return;db.ref('tickets/'+id).update({paye:true,payeAmount:amount,payeDate:getHaitiDateTime(),payeBy:MY_SERIAL}).then(()=>{payRes.innerHTML=`<div style="background:#2e7d32;color:#fff;padding:12px;border-radius:8px;text-align:center">Fich ${id} PEYE $${amount}<br>Mèsi pou konfyans ou</div>`;loadFiches();});}
function calcRapport(){let du=rDu.value,au=rAu.value;if(!du||!au){alert('Chwazi Du Au');return;}let filtreT=rTiraj.value;let tickets=Object.values(DB.tickets).filter(t=>t.serial===MY_SERIAL&&t.dat>=du&&t.dat<=au&&(filtreT==='tous'||(t.tirages||[]).includes(filtreT)||t.tirage===filtreT));let results=Object.values(DB.results).filter(r=>r.dat>=du&&r.dat<=au&&(filtreT==='tous'||r.tirage===filtreT));let prix=DB.prix[MY_PROPRIO_ID]||DB.prix.global;let vente=0,gain=0,detailParTiraj={};tickets.forEach(tic=>{let grand=tic.grandTotal||tic.total||0;vente+=grand;(tic.bets||[]).forEach(b=>{results.forEach(r=>{if(!(tic.tirages||[]).includes(r.tirage)&&tic.tirage!==r.tirage)return;let num=b.numero,mise=b.mise,type=b.type,g=0;let l3=(r.l3||'').padStart(3,'0'),r1=(r.r1||'').padStart(2,'0'),r2=(r.r2||'').padStart(2,'0'),r3=(r.r3||'').padStart(2,'0'),l4=r.l4||r2+r3,l5=r.l5||l3+r2,m1=r1+r2,m2=r1+r3,m3=r2+r3;if(type==='bolet'){if(num===r1)g=mise*prix.p1;else if(num===r2)g=mise*prix.p2;else if(num===r3)g=mise*prix.p3;}else if(type==='loto3'){if(num===l3)g=mise*prix.l3;}else if(type==='maryaj'){if(num===m1||num===m1.slice(2)+m1.slice(0,2))g=mise*prix.m1;else if(num===m2||num===m2.slice(2)+m2.slice(0,2))g=mise*prix.m2;else if(num===m3||num===m3.slice(2)+m3.slice(0,2))g=mise*prix.m3;}else if(type==='loto4'){if(num===l4)g=mise*5000;}else if(type==='loto5'){if(num===l5)g=mise*prix.l5;}if(g>0){gain+=g;if(!detailParTiraj[r.tirage])detailParTiraj[r.tirage]=0;detailParTiraj[r.tirage]+=g;}});});});let komP=DB.vendeurs[MY_VENDEUR_ID]?.kom||10;let kom=vente*komP/100;let bal=vente-kom-gain;let ent=getEnteteProprio();let detailHtml=Object.entries(detailParTiraj).map(([t,v])=>`<div style="text-align:center">${t}: $${v}</div>`).join('');document.getElementById('rapportRes').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;margin:auto"><div class="card" style="text-align:center"><b>Du</b><br>${du}</div><div class="card" style="text-align:center"><b>Au</b><br>${au}</div><div class="card" style="text-align:center"><b>Vant</b><br>$${vente}</div><div class="card" style="text-align:center"><b>Komisyon ${komP}%</b><br>$${kom.toFixed(2)}</div><div class="card" style="text-align:center"><b>A Peye kliyan</b><br>$${gain}</div><div class="card" style="text-align:center"><b>Balans net</b><br>$${bal.toFixed(2)}</div></div>`;document.getElementById('rapportDetail').innerHTML=detailHtml;document.getElementById('printZone').innerText=` ${ent.nom}\n ${ent.adresse}\n ${ent.tel}\n--------------------------\n RAPÒ SANTRE\n--------------------------\nDu: ${du}\nAu: ${au}\nTirage: ${filtreT}\nVandè: ${MY_SERIAL}\n--------------------------\nVant: $${vente}\nKomisyon ${komP}%: $${kom.toFixed(2)}\nA Peye kliyan: $${gain}\nBalans net: $${bal.toFixed(2)}\n--------------------------\n${Object.entries(detailParTiraj).map(([k,v])=>`${k}: $${v}`).join('\n')}\n--------------------------\n${ent.pied||'Mèsi pou konfyans ou'}\n${ent.nom}\n`;document.getElementById('printZone').style.display='block';document.getElementById('btnPrint').style.display='block';}
function doPrint(){let w=window.open('','_blank');w.document.write('<pre style="font-family:monospace;font-size:12px;text-align:center">'+document.getElementById('printZone').innerText+'</pre>');w.print();}

}
