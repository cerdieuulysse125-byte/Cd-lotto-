</div><script>
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com",projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database?firebase.database():null;
const TIRAJ_DEFAULT=[["GA midi","12:00"],["FL midi","13:00"],["NY midi","14:00"],["Real","12:30"],["GA soir","18:00"],["FL soir","21:00"],["NY soir","22:00"],["Primera dia","11:30"],["Suerte dia","12:00"],["Lote Dom","13:30"],["Ganamas","14:15"],["Suerte noche","17:50"],["Primera noche","19:50"],["Loteka","19:45"],["Nacional noche","20:50"],["Leidsa","20:45"],["Anguila 10h","09:40"],["Anguila 18h","17:40"]];
let DB={vendeurs:{},tickets:{},heures:{},results:{},config:{limitMode:'global',prixMode:'global',logoUrl:'',tel:'+52 7298079596'},prix:{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,l3:500,l4:5000,l5:25000,kom:10,komActive:true}},limites:{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}}},CUR=null,selT=[],LAST_TXT='',serverOffset=0;

function hideSplash(){let sp=document.getElementById('splash');if(sp){sp.style.opacity='0';setTimeout(()=>sp.style.display='none',400);}}
setTimeout(hideSplash,2000); // GARANTI OUVRI APRE 2s
window.addEventListener('load',()=>setTimeout(hideSplash,1200));

if(db){try{db.ref('.info/serverTimeOffset').on('value',snap=>{serverOffset=snap.val()||0;});}catch(e){}}
function getTrueNow(){return new Date(Date.now()+serverOffset);}
function getHaitiTime(){try{let utcNow=getTrueNow();let haitiStr=utcNow.toLocaleString('en-US',{timeZone:'America/Port-au-Prince'});return new Date(haitiStr);}catch(e){return new Date();}}
function getHaitiDateStr(){let d=getHaitiTime();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function formatHaiti(d){let h=d.getHours(),m=d.getMinutes().toString().padStart(2,'0'),ap=h>=12?'PM':'AM',h12=h%12||12;return h12+':'+m+' '+ap+' EST';}
function getHeureProprio(n){return DB.heures&&DB.heures[n]?DB.heures[n]:(TIRAJ_DEFAULT.find(x=>x[0]==n)?.[1]||'');}
function isOpen(n){let s=getHeureProprio(n);if(!s)return true;let p=s.split(':'),fh=parseInt(p[0]),fm=parseInt(p[1]||0),h=getHaitiTime();return h.getHours()*60+h.getMinutes() < fh*60+fm;}
function getMyLimite(){let bySerial=DB.limites[CUR?.serial],byKey=DB.limites[CUR?._key];if(bySerial) return bySerial;if(byKey) return byKey;return DB.limites.global;}
function getChifRequis(jeu){if(jeu==='boul')return 2;if(jeu==='loto3')return 3;if(jeu==='loto4')return 4;if(jeu==='loto5')return 5;if(jeu==='maryaj')return 4;return 2;}
function getLimiteForJeu(j){let lim=getMyLimite();if(j==='boul')return lim.bor;if(j==='maryaj')return lim.mar;if(j==='loto3')return lim.l3;if(j==='loto4')return lim.l4;if(j==='loto5')return lim.l5;return 99999;}
function getLogoUrl(){return DB.config?.logoUrl||localStorage.getItem('verite_logo')||'';}function getTel(){return DB.config?.tel||'+52 7298079596';}
function applyLogo(){try{let url=getLogoUrl();if(!url||url.length<100){document.getElementById('splashCircle').style.display='flex';return;}['headerLogo','loginLogo','paramLogo','splashLogo'].forEach(id=>{let el=document.getElementById(id);if(el){el.src=url;el.style.display='block';if(id==='splashLogo'){document.getElementById('splashCircle').style.display='none';}}});let pc=document.getElementById('paramCircle');if(pc) pc.style.display='none';}catch(e){}}
function clearLogo(){localStorage.removeItem('verite_logo');if(db)db.ref('config/logoUrl').set('');alert('Logo efase - kounya app ap ouvri pi vit!');location.reload();}
function uploadLogoPhone(){let fileInput=document.getElementById('logoFile');let file=fileInput.files[0];if(!file){alert('Chwazi foto');return}let reader=new FileReader();reader.onload=function(e){let dataUrl=e.target.result;let img=new Image();img.onload=function(){let canvas=document.createElement('canvas');canvas.width=300;canvas.height=300;let ctx=canvas.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,300,300);let size=Math.min(img.width,img.height);let x=(img.width-size)/2;let y=(img.height-size)/2;ctx.drawImage(img,x,y,size,size,0,0,300,300);let compressed=canvas.toDataURL('image/jpeg',0.60);if(compressed.length>200000){alert('Foto a twò gwo, chwazi yon pi piti');return}if(db)db.ref('config/logoUrl').set(compressed).then(()=>{localStorage.setItem('verite_logo',compressed);applyLogo();alert('Logo 20mm sove!');}).catch(()=>{localStorage.setItem('verite_logo',compressed);applyLogo();alert('Logo sove local');});else{localStorage.setItem('verite_logo',compressed);applyLogo();alert('Logo sove local');}};img.src=dataUrl;};reader.readAsDataURL(file);}
function scanPrinterAuto(){let s=document.getElementById('printer-status');if(s)s.innerText='Pare - C&D SANTRE';}
function listenDB(){if(!db){hideSplash();renderT();return}db.ref().on('value',snap=>{let v=snap.val()||{};DB.vendeurs=v.vendeurs||{};DB.tickets=v.tickets||{};DB.heures=v.heures||{};DB.results=v.results||{};DB.prix=v.prix||DB.prix;DB.limites=v.limites||DB.limites;DB.config=v.config||{limitMode:'global',prixMode:'global',logoUrl:'',tel:'+52 7298079596'};renderT();applyLogo();let hh=document.getElementById('heureHaiti');if(hh){let est=getHaitiTime();hh.innerText='EST:'+formatHaiti(est);}hideSplash();},err=>{hideSplash();renderT();});}
async function doLogin(){try{let s=document.getElementById('inputSerial').value.trim(),p=document.getElementById('inputPass').value.trim(),msg=document.getElementById('loginMsg');if(!s||!p){msg.innerText='Mete Serial';return}if(!db){CUR={_key:'15',serial:s,nom:'Tamouche'};localStorage.setItem('curV',JSON.stringify(CUR));openMain();return}let snap=await db.ref('vendeurs').once('value');let vendeurs=snap.val()||{};let key=Object.keys(vendeurs).find(k=>String(vendeurs[k].serial)===String(s));let f=key?vendeurs[key]:null;if(!f){msg.innerText='Pa egziste';return}if(String(f.pass)!==String(p)){msg.innerText='Modpas pa bon';return}CUR=f;CUR._key=key;localStorage.setItem('curV',JSON.stringify(CUR));openMain();}catch(e){document.getElementById('loginMsg').innerText='Erè: '+e.message;}}
function forceOpen(){CUR={_key:'15',serial:'15',nom:'Tamouche'};localStorage.setItem('curV',JSON.stringify(CUR));openMain();}
function openMain(){document.getElementById('loginPage').style.display='none';document.getElementById('mainPage').style.display='block';document.getElementById('mainPage').classList.add('show');document.getElementById('vName').innerText=CUR.nom||'Vendeur';listenDB();addR();upd();hideSplash();}
function logout(){localStorage.clear();location.reload();}
function getDejaVannPaTiraj(jeu,numero,tirajNom){let today=getHaitiDateStr();let total=0;Object.values(DB.tickets||{}).forEach(t=>{let td=t.dateHaiti||t.date;if(td!==today) return;if(!t.tirages.includes(tirajNom)) return;t.bets.forEach(b=>{if(b.type===jeu && b.numero===numero) total+=b.mise;});});return total;}
function getDejaVannParVendeurPaTiraj(jeu,numero,tirajNom){let today=getHaitiDateStr();let total=0;Object.values(DB.tickets||{}).forEach(t=>{let td=t.dateHaiti||t.date;if(td!==today) return;if(String(t.serial)!=String(CUR.serial) && String(t.vendeurId)!=String(CUR._key)) return;if(!t.tirages.includes(tirajNom)) return;t.bets.forEach(b=>{if(b.type===jeu && b.numero===numero) total+=b.mise;});});return total;}
function renderT(){let tlist=document.getElementById('tlist');if(!tlist) return;let html='<div style="grid-column:1/-1;display:flex;justify-content:space-between;background:#0a4a2e;color:#d4af37;padding:8px;border-radius:8px"><div><b>Tiraj EST</b><br><small>'+formatHaiti(getHaitiTime())+'</small></div><span onclick="document.getElementById(\'tlist\').classList.remove(\'open\')" style="background:#e11d48;color:#fff;padding:6px 12px;border-radius:6px">X</span></div>';TIRAJ_DEFAULT.forEach(t=>{let name=t[0],hp=getHeureProprio(name),open=isOpen(name),chk=selT.includes(name)?'checked':'',bg=open?'background:#dcfce7;border-color:#16a34a':'background:#fee2e2;border-color:#e11d48';html+='<label class="topt" style="'+bg+'"><input type="checkbox" value="'+name+'" '+chk+' '+(open?'':'disabled')+' onchange="chg(this)"><span>'+name+'</span><small>'+hp+'</small></label>';});tlist.innerHTML=html;}
function chg(el){if(!isOpen(el.value)&&el.checked){alert('Femen');el.checked=false;return}if(el.checked)selT.push(el.value);else selT=selT.filter(x=>x!=el.value);document.getElementById('txtT').innerText=selT.length?selT.length+' tiraj':'Chwazi tiraj';upd();if(selT.length)document.getElementById('tlist').classList.remove('open')}
function selAll(){selT=[];TIRAJ_DEFAULT.forEach(t=>{if(isOpen(t[0]))selT.push(t[0])});renderT();document.getElementById('txtT').innerText=selT.length?selT.length+' tiraj':'Chwazi tiraj';upd()}
function addR(keep='boul'){let c=document.getElementById('bets');let d=document.createElement('div');d.className='row betRow';d.innerHTML='<select class="jeu inp"><option value="boul">BOUL 2</option><option value="loto3">L3 3</option><option value="loto4">L4 4</option><option value="loto5">L5 5</option><option value="maryaj">MAR 4</option></select><input class="boul inpN" type="tel" placeholder="--" oninput="validateBoul(this)"><input class="mise inpN" type="tel" placeholder="$" oninput="upd()" style="background:#e8f5e9"><button class="btnR" onclick="this.parentElement.remove();upd()">X</button><button class="btnF" onclick="nextLine(this)">></button>';c.appendChild(d);d.querySelector('.jeu').value=keep;upd();return d;}
function validateBoul(inp){let req=getChifRequis(inp.parentElement.querySelector('.jeu').value);inp.value=inp.value.replace(/\D/g,'').slice(0,req);upd();}
function nextLine(fromEl){let row=fromEl.closest('.betRow');let newRow=addR(row.querySelector('.jeu').value);setTimeout(()=>{newRow.querySelector('.boul').focus();},80);}
function upd(){let sum=0;document.querySelectorAll('.betRow').forEach(r=>{let mm=parseInt(r.querySelector('.mise').value)||0;if(r.querySelector('.boul').value.trim()&&mm)sum+=mm;});document.getElementById('dt').innerText='Total $'+sum+' x '+selT.length+' = $'+(sum*selT.length);document.getElementById('gt').innerText='$'+(sum*selT.length);}

function build(tk){
let hd=getHaitiTime();
function center(t){t=String(t).trim();let w=28;if(t.length>=w) return t.substring(0,w);let sp=Math.floor((w-t.length)/2);return ' '.repeat(sp)+t;}
function betLine(jeu,num,mise){let left=jeu.padEnd(9,' ');let right=('$'+mise).padStart(7,' ');let midW=12;let sp=Math.floor((midW-num.length)/2);let middle=' '.repeat(sp)+num+' '.repeat(midW-num.length-sp);return left+middle+right;}
let tel=getTel();let txt='';
txt+=center('C&D VERITE LOTTO')+'\n';
txt+=center('Fiche Original')+'\n';
txt+=center('----------------------------')+'\n';
txt+=center('POS: '+(CUR?._key||''))+'\n';
txt+=center('Vendeur: '+(CUR?.serial||'')+' '+(CUR?.nom||''))+'\n';
txt+=center('Tel: '+tel)+'\n';
txt+=center('Date: '+getHaitiDateStr()+' '+hd.getHours().toString().padStart(2,'0')+':'+hd.getMinutes().toString().padStart(2,'0')+' EST')+'\n';
txt+=center('----------------------------')+'\n';
selT.forEach(t=>{txt+=center(t+' - '+getHeureProprio(t))+'\n';});
txt+=center('----------------------------')+'\n';
tk.bets.forEach(b=>{let jeuLabel=b.type==='boul'?'Borlette':b.type==='maryaj'?'Maryaj':b.type.toUpperCase();txt+=betLine(jeuLabel,b.numero,b.mise)+'\n';});
txt+=center('----------------------------')+'\n';
txt+=center('Total => '+tk.total+' HTG')+'\n';
txt+=center('----------------------------')+'\n';
txt+=center('Bonne Chance!')+'\n';
txt+=center('Tel: '+tel)+'\n';
txt+='\n';txt+=center(getHaitiDateStr()+' '+hd.getHours().toString().padStart(2,'0')+':'+hd.getMinutes().toString().padStart(2,'0')+' PM')+'\n\n\n\n';
return txt;
}
function showPreview(txt){const prev=document.getElementById('prev');prev.style.display='block';let logoUrl=getLogoUrl();let logoHtml=logoUrl?'<img src="'+logoUrl+'" style="width:20mm;height:20mm;border-radius:50%;display:block;margin:0 auto 3mm auto;border:1px solid #000;object-fit:cover">':'';prev.innerHTML=logoHtml+'<div style="white-space:pre;font-family:monospace;font-size:12px;text-align:center">'+txt.replace(/\n/g,'<br>')+'</div>';}
async function imageUrlToEscPos(dataUrl,width=200){return new Promise(res=>{let img=new Image();img.onload=()=>{let canvas=document.createElement('canvas');let ratio=img.height/img.width;let w=width;let h=Math.floor(w*ratio);canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);let data=ctx.getImageData(0,0,w,h).data;let bytes=[];let xL=Math.floor((w+7)/8);for(let y=0;y<h;y++){for(let x=0;x<xL;x++){let byte=0;for(let b=0;b<8;b++){let px=x*8+b;if(px<w){let i=(y*w+px)*4;let lum=0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];if(lum<128) byte|=(1<<(7-b));}}bytes.push(byte);}}let cmd=[0x1D,0x76,0x30,0x00,xL%256,Math.floor(xL/256),h%256,Math.floor(h/256)];res({cmd:cmd,data:bytes});};img.src=dataUrl;});}
async function printBT(t){
let plain=(t||LAST_TXT||'').toString().replace(/<[^>]+>/g,'').trim();if(!plain)return;
let logoUrl=getLogoUrl();
try{
if(!logoUrl){let all=[0x1B,0x40,0x1B,0x61,0x01];for(let i=0;i<plain.length;i++){let c=plain.charCodeAt(i);if(c<256)all.push(c);}all.push(10,10,10,10,0x1D,0x56,0x00);let bin='';all.forEach(b=>bin+=String.fromCharCode(b));window.location.href="rawbt:base64,"+btoa(bin);return;}
let logo=await imageUrlToEscPos(logoUrl,200);let all=[0x1B,0x40,0x1B,0x61,0x01,...logo.cmd,...logo.data,10,10];for(let i=0;i<plain.length;i++){let c=plain.charCodeAt(i);if(c<256)all.push(c);}all.push(10,10,10,10,0x1D,0x56,0x00);let bin='';all.forEach(b=>bin+=String.fromCharCode(b));window.location.href="rawbt:base64,"+btoa(bin);
}catch(e){let b64=btoa(unescape(encodeURIComponent(plain)));window.location.href="rawbt:base64,"+b64;}
}
