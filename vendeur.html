<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C&D V96 LINKED</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:bold}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:14px;border:2px solid #000;border-radius:10px;width:100%;font-size:18px;margin:6px 0}.line{display:grid;grid-template-columns:85px 1fr 75px;gap:6px;margin:6px 0}.tiraj{padding:9px 14px;margin:4px;border:2px solid #000;border-radius:25px;font-weight:bold;display:inline-block}.tiraj.active{background:#000;color:#FFD700}.tiraj.ferme{background:#ddd;color:#999;pointer-events:none;opacity:.5}.tiraj.ferme::after{content:" FÈMEN";color:red;font-size:10px}.btn{padding:15px;width:100%;border:none;border-radius:10px;font-weight:bold;font-size:18px;margin:6px 0}.bK{background:#000;color:#FFD700}.ticket{border:2px dashed #000;padding:14px;text-align:center;font-size:18px;max-width:360px;margin:auto}@media print{body *{visibility:hidden}#prt,#prt *{visibility:visible}#prt{position:absolute;left:0;top:0;width:100%}}</style>
</head><body>
<div class="h">C&D VÉRITÉ LOTTO - V96</div>
<div id="login" class="card" style="text-align:center;padding-top:30px"><h2>Connexion Vendeur</h2>
<input id="uName" value="Tamouche"><input id="uPass" type="password" value="1234"><button class="btn bK" onclick="go()">Antre</button><p id="msg" style="color:red"></p></div>
<div id="app" style="display:none"><div style="display:flex;background:#000"><button class="btn bK" style="flex:1;margin:2px" onclick="show('vendre')">Vendre</button><button class="btn bK" style="flex:1;margin:2px" onclick="show('fiches')">Fiches</button><button class="btn bK" style="flex:1;margin:2px" onclick="show('rapport')">Rapport</button></div>
<div id="vendre" class="card"><div style="text-align:center;font-weight:bold">TIRAJ MULTIP - Chwazi</div><div id="tirajBox" style="text-align:center"></div>
<div style="display:flex;background:#000;color:#FFD700;padding:7px;font-weight:bold;border-radius:6px"><div style="width:85px">JEUX</div><div style="flex:1">BOUL</div><div style="width:75px">MIZ</div></div><div id="lines"></div>
<div style="background:#000;color:#fff;padding:10px;border-radius:10px;text-align:center;margin-top:8px">Total <span id="tot">0$</span> × <span id="nb">1</span><h2 style="color:#FFD700;margin:3px">A PEYE <span id="paye">0$</span></h2></div><button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button><div id="prt" style="display:none"></div></div>
<div id="fiches" class="card" style="display:none"><h3>Fiches <span id="mn"></span></h3><div id="listF"></div></div>
<div id="rapport" class="card" style="display:none"><h3>Rapport</h3>Du <input id="du" type="date"> Au <input id="au" type="date"><select id="fT"><option value="tous">Tous</option><option>GA midi</option><option>GA soir</option><option>FL midi</option><option>FL soir</option><option>NY midi</option><option>NY soir</option></select><button class="btn bK" onclick="genRap()">Générer</button><div id="rap"></div></div></div>
<script>
const firebaseConfig={databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com"}; firebase.initializeApp(firebaseConfig); const db=firebase.database();
let curV='',selT=[],lineId=0,cfg={},fiches=JSON.parse(localStorage.getItem('fiches')||'[]');
function go(){const n=uName.value.trim(); if(!n)return; curV=n; localStorage.setItem('curV',n); login.style.display='none'; app.style.display='block'; mn.innerText=n;
 db.ref('vendors/'+n).once('value',s=>{if(!s.exists())db.ref('vendors/'+n).set({name:n,status:'OUVE'})});
 db.ref('config').on('value',snap=>{cfg=snap.val()||{}; renderTiraj();}); addLine(true);
}
function isFerme(h){if(!h)return false; const now=new Date(); const [hh,mm]=h.split(':').map(Number); const f=new Date(); f.setHours(hh,mm||0,0,0); return now>=f;}
function renderTiraj(){const b=tirajBox; b.innerHTML=''; const map={'GA midi':'gaMidi','GA soir':'gaSoir','FL midi':'flMidi','FL soir':'flSoir','NY midi':'nyMidi','NY soir':'nySoir'}; const h=cfg.heures||{}; ['GA midi','GA soir','FL midi','FL soir','NY midi','NY soir'].forEach(t=>{const hs=h[map[t]]||''; const ferme=isFerme(hs)||cfg.tirages&&cfg.tirages[map[t]]==='FERME'; b.innerHTML+=`<span class="tiraj ${ferme?'ferme':''}" onclick="toggleT(this,'${t}')">${t} ${hs&&!ferme?'('+hs+')':''}</span>`;});}
function toggleT(el,t){if(el.classList.contains('ferme'))return; el.classList.toggle('active'); if(selT.includes(t))selT=selT.filter(x=>x!==t);else selT.push(t); nb.innerText=selT.length||1; upd();}
function show(id){vendre.style.display=id==='vendre'?'block':'none'; fiches.style.display=id==='fiches'?'block':'none'; rapport.style.display=id==='rapport'?'block':'none'; if(id==='fiches')loadF();}
function addLine(first){lineId++; const d=document.createElement('div'); d.className='line'; d.innerHTML=`<select id="j${lineId}"><option>Borlette</option><option>Mariage</option><option>Loto3</option></select><input id="b${lineId}" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Boul" onkeydown="kB(event,${lineId})"><input id="m${lineId}" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Miz" onkeydown="kM(event,${lineId})" oninput="upd()">`; lines.appendChild(d); if(!first)setTimeout(()=>document.getElementById('b'+lineId).focus(),50);}
function kB(e,id){if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault(); document.getElementById('m'+id).focus();}}
function kM(e,id){if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault(); addLine();}}
function upd(){let t=0; for(let i=1;i<=lineId;i++){const m=document.getElementById('m'+i); if(m)t+=parseInt(m.value)||0;} tot.innerText=t+'$'; paye.innerText=(t*(selT.length||1))+'$';}
function vann(){if(selT.length===0)return alert('Chwazi tiraj OUVE'); let corps='',has=false; for(let i=1;i<=lineId;i++){const b=document.getElementById('b'+i),m=document.getElementById('m'+i),j=document.getElementById('j'+i); if(b&&b.value&&m&&m.value){corps+=`${j.value.slice(0,3)} ${b.value} - ${m.value}$<br>`; has=true;}} if(!has)return alert('Mete boul'); const id=Date.now(),now=new Date(); const ticket=`<div class="ticket"><b>C&D VÉRITÉ LOTTO</b><br>${now.toLocaleString()}<br>Tirage: ${selT.join(', ')}<br>ID: ${id}<br>Vandè: ${curV}<br>.........................<br>${corps}.........................<br>${tot.innerText} × ${selT.length} = <b>${paye.innerText}</b><br><br>Mèsi</div>`; prt.innerHTML=ticket; prt.style.display='block'; const f={id,vendor:curV,tiraj:selT.join(','),total:parseInt(tot.innerText)||0,nb:selT.length,ticket,time:Date.now()}; fiches.push(f); localStorage.setItem('fiches',JSON.stringify(fiches)); db.ref('fiches/'+id).set({id,vendor:curV,tiraj:selT.join(','),total:f.total,nbTiraj:selT.length,date:Date.now()}); window.print(); lines.innerHTML=''; lineId=0; addLine(true); upd();}
function loadF(){listF.innerHTML=''; fiches.filter(f=>f.vendor===curV).reverse().forEach(f=>{listF.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #ccc"><span>${new Date(f.time).toLocaleString()}<br>${f.tiraj} - ${f.total*f.nb}$</span><button class="btn bK" style="width:auto" onclick="reprint(${f.id})">Kopye</button></div>`;});}
function reprint(id){const f=fiches.find(x=>x.id===id); if(f){prt.innerHTML=f.ticket; prt.style.display='block'; window.print();}}
function genRap(){let v=0; fiches.filter(f=>f.vendor===curV).forEach(f=>v+=f.total*f.nb); rap.innerHTML=`<div style="text-align:center;font-weight:bold">Vente ${v}$<br>Com ${Math.round(v*0.15)}$<br>Net ${Math.round(v*0.85)}$</div>`;}
</script></body></html>
