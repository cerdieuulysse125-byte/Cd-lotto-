<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C&D VÉRITÉ LOTTO - VANDEUR</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;padding:20px;margin:12px;border-radius:20px;width:100%;max-width:360px;border:3px solid #000}
input{width:100%;padding:14px;margin:8px 0;border:2px solid #000;border-radius:12px;font-size:16px;font-weight:bold}
.btn{width:100%;padding:16px;background:#000;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:16px;margin-top:10px}
h2{text-align:center;margin:0 0 5px} .sub{text-align:center;font-size:12px;margin-bottom:12px}
.status{font-size:11px;padding:6px;border-radius:6px;margin-top:8px;text-align:center}
</style></head><body>
<div class="card" id="loginCard">
<h2>C&D VÉRITÉ LOTTO</h2>
<div class="sub">Login Vendeur - Modpas separe ak Proprio</div>
<input id="nom" placeholder="Non Vendeur - ex: Tamouche" value="Tamouche">
<input id="pass" type="password" placeholder="Modpas Vendeur ••••" autocomplete="new-password">
<button class="btn" onclick="loginV()">ANTRE</button>
<div id="msg" style="color:#FF0000;text-align:center;margin-top:10px;font-weight:bold;font-size:13px"></div>
<div id="count" class="status" style="background:#eee">Ap chaje vandè yo...</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",
  authDomain: "cd-lotto.firebaseapp.com",
  databaseURL: "https://cd-lotto-default-rtdb.firebaseio.com",
  projectId: "cd-lotto",
  storageBucket: "cd-lotto.firebasestorage.app",
  messagingSenderId: "671091732195",
  appId: "1:671091732195:web:51bcfe8df83bc58fc75fd6",
  measurementId: "G-TWK9N38BS0"
};
let db=null, vendeursList=[];
try{
 firebase.initializeApp(firebaseConfig);
 db=firebase.firestore();
 db.enablePersistence().catch(()=>{});
 loadVendeurs();
}catch(e){document.getElementById('count').textContent="Firebase pa konekte: "+e.message;}

function loadVendeurs(){
 db.collection("vendeurs").onSnapshot(snap=>{
  vendeursList=[];
  let html="";
  snap.forEach(d=>{vendeursList.push(d.data());});
  document.getElementById('count').textContent="Vendeur Firebase: "+vendeursList.length+" - "+vendeursList.map(v=>v.nom).join(', ');
  if(vendeursList.length==0){
   document.getElementById('msg').innerHTML="<span style='color:red'>Okenn vendeur nan Firebase - Kreye nan Proprio dabo</span><br><span style='font-size:11px'>Ale nan app Proprio > 5.Vendeurs > Kreye Tamouche</span>";
  }else{
   document.getElementById('msg').textContent="";
  }
 }, err=>{
  document.getElementById('count').textContent="Erè lekti: "+err.message+" - Verifye Rules";
 });
}

function loginV(){
 let n=document.getElementById('nom').value.trim();
 let p=document.getElementById('pass').value.trim();
 if(!n||!p){document.getElementById('msg').textContent="Mete Non ak Modpas";return;}
 let found=vendeursList.find(v=>v.nom.toLowerCase()==n.toLowerCase());
 if(!found){document.getElementById('msg').textContent="Vendeur "+n+" pa jwenn. Kreye l nan Proprio";return;}
 // Modpas kache - konpare men pa afiche
 let realPass=found.pass||found.modpas||"";
 if(p!==realPass){document.getElementById('msg').textContent="Modpas pa bon pou "+n;return;}
 if(found.etat=="ferme"){document.getElementById('msg').textContent="Vendeur sa fèmen - Kontakte Proprio";return;}
 // SOVE SESSION PÈMANANS
 localStorage.setItem('vendeurActuel', JSON.stringify(found));
 document.getElementById('msg').style.color="green";
 document.getElementById('msg').textContent="Byenveni "+found.nom+" ✅";
 setTimeout(()=>{window.location.href="vente.html";},800);
}
</script></body></html>
