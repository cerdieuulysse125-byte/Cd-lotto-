async function vann(){if(isPrinting){alert('Tann...');return;}if(!selT.length){alert('Chwazi Tiraj');return}var bets=[];document.querySelectorAll('.betRow').forEach(function(r){var j=r.querySelector('.jeu').value,b=r.querySelector('.boul').value.trim(),mm=parseInt(r.querySelector('.mise').value);if(j&&b&&mm)bets.push({type:j,numero:b,mise:mm});});if(!bets.length){alert('VID');return}var base=bets.reduce(function(a,b){return a+b.mise;},0);var tk={id:'T'+Date.now().toString().slice(-7),bets:bets,tirages:selT.slice(),baseTotal:base,total:base*selT.length,date:getHaitiDateStr(),dateHaiti:getHaitiDateStr(),vendeurId:CUR?._key,serial:CUR?.serial};if(db) db.ref('tickets/'+tk.id).set(tk);var txt=build(tk);LAST_TXT=txt;showPreview(txt);setTimeout(function(){printBT(txt);},500);setTimeout(function(){document.getElementById('bets').innerHTML='';addR();upd();},1200);}
async function calcR(){var du=document.getElementById('rdu').value,au=document.getElementById('rau').value,ti=document.getElementById('rt').value;if(!du)du=getHaitiDateStr();if(!au)au=getHaitiDateStr();var rres=document.getElementById('rres');rres.style.display='block';rres.innerHTML='Kalkil...';var snap=await db.ref('tickets').once('value');var all=snap.val()||{};var vente=0,count=0;Object.values(all).forEach(function(t){var td=t.dateHaiti||t.date;if(td<du||td>au)return;if(String(t.serial)!=String(CUR.serial)&&String(t.vendeurId)!=String(CUR._key))return;if(ti!='tous'&&(t.tirages||[]).indexOf(ti)==-1)return;count++;vente+=ti=='tous'?(t.total||0):(t.baseTotal||0);});var kom=vente*0.1;var balans=vente-kom;rres.innerHTML='<div style="text-align:center;background:#0a4a2e;color:#d4af37;padding:8px;border-radius:8px">RAPÒ V25.9 - '+du+' -> '+au+'</div><div class="rapo-line"><span>Vant</span><b>$'+vente.toFixed(2)+'</b></div><div class="rapo-line"><span>Kom 10%</span><b>$'+kom.toFixed(2)+'</b></div><div class="rapo-line" style="background:#0a4a2e;color:#d4af37;border-radius:8px"><span>Balans</span><b>$'+balans.toFixed(2)+'</b></div>';var txt='RAPPORT V25.9\nDu: '+du+' Au: '+au+'\nFiches: '+count+'\nVant: $'+vente.toFixed(2)+'\nKom: $'+kom.toFixed(2)+'\nBalans: $'+balans.toFixed(2);document.getElementById('rprint').style.display='block';document.getElementById('rprint').innerText=txt;LAST_TXT=txt;isPrinting=false;window.scrollTo(0,0);}
function printRapport(){
  if(isPrinting){ alert('Tann...'); return; }
  var rprint=document.getElementById('rprint');
  var txt=rprint?rprint.innerText:'';
  if(!txt || txt.trim().length<10){
    var du=document.getElementById('rdu').value, au=document.getElementById('rau').value;
    var rres=document.getElementById('rres');
    txt='RAPPORT V25.9\nDu: '+du+' Au: '+au+'\n'+(rres?rres.innerText:'');
  }
  if(!txt){ alert('Kalkile rapò avan'); return; }
  if(rprint){ rprint.style.display='block'; }
  LAST_TXT=txt;
  printBT(txt);
  setTimeout(function(){ window.scrollTo(0,0); isPrinting=false; }, 1000);
}
