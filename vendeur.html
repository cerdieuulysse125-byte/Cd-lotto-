<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V115.9B DEBLOKE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff}.h{background:#000;color:#FFD700;padding:6px;text-align:center;font-weight:900;font-size:9px}.card{padding:10px;max-width:480px;margin:auto}input,select{padding:13px;border:2px solid #000;border-radius:12px;width:100%;font-size:16px;margin:4px 0;font-weight:700}.tiraj{padding:7px 12px;margin:3px;border:2px solid #000;border-radius:20px;font-weight:900;display:inline-block;font-size:11px;cursor:pointer;background:#fff}.tiraj.active{background:#000;color:#FFD700}.btn{padding:14px;width:100%;border:none;border-radius:12px;font-weight:900;margin:6px 0}.bK{background:#000;color:#FFD700}.bV{background:#16a34a;color:#fff}.tab2{display:flex;background:#000;gap:1px;position:sticky;top:0;z-index:20}.tab2 button{flex:1;padding:11px 1px;font-size:10px;font-weight:900;background:#000;color:#FFD700;border:none}.tab2 button.active{background:#FFD700;color:#000}</style>
</head><body>
<div class="h">V115.9B - DEBLOKE - 1 LIY - 14/08/2026</div>
<div id="loginBox" class="card" style="text-align:center;padding-top:40px"><h2>Connexion Vendeur</h2><input id="uName" placeholder="Kòd (JULES)" value="JULES"><input id="uPass" type="password" placeholder="Modpas"><button class="btn bK" onclick="go()">Antre</button><div id="loginErr" style="color:red;font-weight:900;margin-top:8px"></div></div>
<div id="appBox" style="display:none">
<div class="tab2"><button id="tV" class="active" onclick="showTab('vendre')">1.Vendre</button><button id="tC" onclick="showTab('kopyeTab')">2.Copier</button><button id="tF" onclick="showTab('fichesTab')">3.Fiches</button><button id="tR" onclick="showTab('rapportTab')">4.Rapport</button></div>
<div id="vendre" class="card">
<div style="text-align:center;font-weight:900;font-size:11px">TIRAJ - <span id="dateToday" style="background:#FFD700;padding:3px 8px;border-radius:5px"></span> - <span id="userShow" style="background:#000;color:#FFD700;padding:3px 8px;border-radius:5px"></span></div>
<div id="tirajBox" style="text-align:center;margin:10px 0"></div>
<div style="display:flex;background:#000;color:#FFD700;padding:8px;font-weight:900;border-radius:8px;font-size:11px"><div style="width:90px">JEUX</div><div style="flex:1">BOUL</div><div style="width:85px">MIZ</div></div>
<div style="display:flex;gap:6px;margin-top:10px"><select id="j0" style="width:90px"><option>Borlettes</option><option>Mariage</option><option>Loto3</option><option>Loto4</option><option>Loto5</option></select><input id="b0" placeholder="Boul" style="flex:1"><input id="m0" type="number" placeholder="Miz" style="width:85px" oninput="calc()"></div>
<div style="background:#000;color:#fff;padding:12px;border-radius:10px;text-align:center;margin-top:14px">Total <span id="tot">0$</span> × <span id="nbT">1</span><div style="font-size:28px;color:#FFD700">A PEYE <span id="paye">0$</span></div></div>
<button class="btn bK" onclick="vann()">VENDRE & IMPRIMER</button><div id="lastTicket"></div>
</div>
<div id="kopyeTab" class="card" style="display:none"><h3>2.Copier</h3><input id="searchId" placeholder="ID 5 lèt"><button class="btn bK" onclick="searchById()">Chèche</button><div id="kopyeResult"></div><button class="btn bV" onclick="showTab('vendre')">↩️ VENDRE</button></div>
<div id="fichesTab" class="card" style="display:none"><h3>3.Fiches (<span id="nbFiches">0</span>)</h3><div id="fichesList"></div><button class="btn bV" onclick="showTab('vendre')">↩️ VENDRE</button></div>
<div id="rapportTab" class="card" style="display:none"><h3>4.Rapport</h3><div style="display:flex;gap:6px"><input type="date" id="du"><input type="date" id="au"></div><select id="rapportTiraj"><option value="tous">Tous Tiraj</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><button class="btn bK" onclick="genererRapport()">Générer Rapport</button><div id="rapportContent" style="border:2px solid #000;border-radius:10px;padding:10px;margin-top:10px"><div>Vente: <b id="rVente">0$</b></div><div>Comm: <b id="rCom">0$</b></div><div>A Payer: <b id="rPaye">0$</b></div><div>Balance: <b id="rNet">0$</b></div></div><button class="btn bV" onclick="showTab('vendre')">↩️ VENDRE</button></div>
</div>
<script>
const firebaseConfig={databaseURL:"https://verite-lotto-default-rtdb.firebaseio.com"};firebase.initializeApp(firebaseConfig);const db=firebase.database();
const TIRAJ_CONFIG=[{name:"GA MIDI"},{name:"FL MIDI"},{name:"NY MIDI"},{name:"GA SOIR"},{name:"FL SOIR"},{name:"NY SOIR"}];
let selectedTiraj=[],USER="",FICHES=[];
function go(){
let u=document.getElementById('uName').value.trim().toUpperCase();
if(!u){document.getElementById('loginErr').innerText="Mete kòd";return;}
USER=u;
// PA BLOKE - ANTRE DIRÈK
try{FICHES=JSON.parse(localStorage.getItem('fiches_'+USER)||'[]')}catch(e){FICHES=[]}
document.getElementById('loginBox').style.display='none';
document.getElementById('appBox').style.display='block';
document.getElementById('dateToday').innerText=new Date().toLocaleDateString();
document.getElementById('userShow').innerText=USER;
initApp();history.pushState(null,null,location.href);
let t=new Date().toISOString().split('T')[0];document.getElementById('du').value=t;document.getElementById('au').value=t;
// Eseye chèche proprio an background, men pa bloke
try{db.ref('vendeurs/'+USER).once('value').then(s=>{if(s.exists())console.log("Vendeur jwenn");});}catch(e){}
}
function initApp(){
let tb=document.getElementById('tirajBox');tb.innerHTML="";
TIRAJ_CONFIG.forEach(t=>{let el=document.createElement('span');el.className='tiraj';el.innerText=t.name;el.onclick=()=>{el.classList.toggle('active');updateTiraj();};tb.appendChild(el);});
calc();
}
function updateTiraj(){selectedTiraj=[];document.querySelectorAll('.tiraj.active').forEach(x=>selectedTiraj.push(x.innerText));document.getElementById('nbT').innerText=selectedTiraj.length||1;calc();}
function calc(){let m=parseFloat(document.getElementById('m0').value)||0;document.getElementById('tot').innerText=m+"$";document.getElementById('paye').innerText=(m*(selectedTiraj.length||1))+"$";}
function showTab(nom){['vendre','kopyeTab','fichesTab','rapportTab'].forEach(id=>document.getElementById(id).style.display=id===nom?'block':'none');document.getElementById('tV').className=nom=='vendre'?'active':'';document.getElementById('tC').className=nom=='kopyeTab'?'active':'';document.getElementById('tF').className=nom=='fichesTab'?'active':'';document.getElementById('tR').className=nom=='rapportTab'?'active':'';if(nom!=='vendre')history.pushState({tab:nom},'', '#'+nom);if(nom==='fichesTab')loadFiches();}
window.onpopstate=()=>{showTab('vendre');};
function genId(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function vann(){
if(selectedTiraj.length===0){alert("Chwazi tiraj!");return;}
let j=document.getElementById('j0').value,b=document.getElementById('b0').value.trim(),m=parseFloat(document.getElementById('m0').value)||0;
if(!b||!m){alert("Mete boul ak miz!");return;}
let id=genId();let now=new Date();let fiche={id:id,vendeur:USER,date:now.toISOString().split('T')[0],heure:now.toLocaleTimeString(),total:m,tirajs:selectedTiraj,aPeye:m*selectedTiraj.length,jeux:j,boul:b,miz:m,timestamp:Date.now()};
FICHES.push(fiche);localStorage.setItem('fiches_'+USER,JSON.stringify(FICHES));
try{db.ref('fiches/'+id).set(fiche);db.ref('fiches_vendeur/'+USER+'/'+id).set(fiche);}catch(e){}
let html=`<div style="border:2px dashed #000;padding:10px;margin-top:10px;text-align:center"><b>${USER}</b><br>ID: <b style="font-size:18px">${id}</b><br>${fiche.date} ${fiche.heure}<br>${selectedTiraj.join(' | ')}<hr>${j} ${b} : ${m}$<hr><b>A PEYE: ${fiche.aPeye}$</b></div>`;
document.getElementById('lastTicket').innerHTML=html+`<button class="btn bV" onclick="clearVendre()">NOUVO FICH</button><button class="btn bK" onclick="window.print()">RE-IMPRIMER</button>`;
loadFiches();
}
function clearVendre(){document.getElementById('b0').value="";document.getElementById('m0').value="";document.getElementById('lastTicket').innerHTML="";calc();}
function loadFiches(){let html="";FICHES.slice().reverse().forEach(f=>{html+=`<div style="border:1px solid #000;padding:8px;margin:5px 0;border-radius:8px;font-size:12px"><b>${f.id}</b> - ${f.heure} - ${f.tirajs.join(', ')}<br>${f.jeux} ${f.boul} : ${f.miz}$ - ${f.aPeye}$</div>`;});document.getElementById('fichesList').innerHTML=html||"Pa gen fich";document.getElementById('nbFiches').innerText=FICHES.length;}
function searchById(){let id=document.getElementById('searchId').value.trim().toUpperCase();let f=FICHES.find(x=>x.id===id);document.getElementById('kopyeResult').innerHTML=f?`<div style="border:2px solid #000;padding:10px">${f.jeux} ${f.boul} : ${f.miz}$<br><button class="btn bK" onclick="applyFiche('${f.id}')">Copier</button></div>`:"Pa jwenn";}
function applyFiche(id){let f=FICHES.find(x=>x.id===id);if(!f)return;showTab('vendre');document.querySelectorAll('.tiraj').forEach(el=>{el.classList.toggle('active',f.tirajs.includes(el.innerText));});updateTiraj();document.getElementById('j0').value=f.jeux;document.getElementById('b0').value=f.boul;document.getElementById('m0').value=f.miz;calc();}
function genererRapport(){
let du=document.getElementById('du').value,au=document.getElementById('au').value,filtre=document.getElementById('rapportTiraj').value;
let vg=0,vf=0;FICHES.forEach(f=>{if(f.date<du||f.date>au)return;let miz=f.miz||0;vg+=miz*f.tirajs.length;if(filtre==="tous")vf=vg;else if(f.tirajs.includes(filtre))vf+=miz;});
if(filtre==="tous"){document.getElementById('rVente').innerText=vg+"$";document.getElementById('rCom').innerText=Math.round(vg*0.1)+"$";document.getElementById('rPaye').innerText="0$";document.getElementById('rNet').innerText=vg+"$";}
else{document.getElementById('rVente').innerText=vf+"$";document.getElementById('rCom').innerText=Math.round(vf*0.1)+"$";document.getElementById('rPaye').innerText="0$";document.getElementById('rNet').innerText=vf+"$";}
}
</script>
</body></html>
