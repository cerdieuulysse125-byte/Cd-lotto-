<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D VENDEUR V6.2 cd-lotto</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Arial;min-height:100vh}
#login{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center}
.loginBox{background:#fff;border:3px solid #000;padding:18px;width:93%;max-width:360px;text-align:center}
.loginBox input{width:100%;padding:11px;margin:5px 0;border:2px solid #000;font-weight:900;text-align:center}
.loginBox button{width:100%;padding:12px;background:#FFD700;color:#000;font-weight:900;border:2px solid #000}
.h{background:#FFD700;color:#000;text-align:center;padding:8px;font-weight:900;border-bottom:3px solid #000;font-size:12px}
.g{background:#000;color:#FFD700;text-align:center;padding:6px;font-weight:900;font-size:11px}
.tabs{display:flex;background:#fff;border-bottom:2px solid #000;position:sticky;top:0;z-index:99}.tab{flex:1;padding:12px 1px;text-align:center;font-size:10px;font-weight:900;border:1px solid #000;background:#fff;color:#000}.tab.active{background:#FFD700;color:#000}
.page{display:none;padding:6px;background:#fff;min-height:80vh}.page.active{display:block}
.tirages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.tirages div{background:#fff;border:3px solid #00A000;color:#000;padding:14px 1px;text-align:center;font-weight:900;position:relative}
.tirages div.on{background:#FFD700;border-color:#000}.tirages div.on::after{content:"✓";position:absolute;top:-2px;right:4px;color:#F00;font-size:22px;font-weight:900}
.tirages div.off{background:#F00;border-color:#000;color:#fff;pointer-events:none}
.row{display:flex;gap:4px;margin:5px 0;align-items:center}.row select{flex:.8;height:36px;border:2px solid #000;font-weight:900;background:#fff}
.row input.boul{flex:.55;max-width:110px;height:36px;border:2px solid #000;font-weight:900;text-align:center}
.row input.miz{flex:.3;max-width:62px;height:36px;border:2px solid #000;font-weight:900;text-align:center;background:#FFD700}
.btnX{width:28px;height:36px;background:#fff;color:#F00;border:2px solid #F00;font-weight:900}.btnF{width:30px;height:36px;background:#000;color:#FFD700;border:2px solid #000;font-weight:900}
.total{background:#fff;border:2px solid #000;padding:8px;text-align:center;font-weight:900;margin:6px 0}
.btnV{background:#000;color:#FFD700;padding:12px;text-align:center;font-weight:900;border:2px solid #000;margin:7px 0}
.fich{background:#f9f9f9;border:1px solid #000;padding:7px;margin:4px 0;font-size:10px}
.limitWarn{color:#F00;border:2px solid #F00;background:#fff;padding:4px;text-align:center;font-weight:900;font-size:10px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head><body>
<div id="login"><div class="loginBox">
<div style="background:#FFD700;padding:6px;font-weight:900">C&D V6.2 cd-lotto FIREBASE KONEKTE</div>
<input id="nomV" placeholder="Non vandè"><input id="passV" type="password" placeholder="Modpas" onkeydown="if(event.key==='Enter')checkPass()">
<button onclick="checkPass()">🔓 OUVRI</button><div id="passErr" style="color:red"></div>
<div style="font-size:8px;text-align:left;border-top:2px solid #000;margin-top:8px;padding-top:4px;font-weight:900">MENM BAZ: Maryaj lòd/dezòd=1000<br>$50 /2 tiraj = $25 pa tiraj<br>Fon Blan Jon Vè Wouj - cd-lotto</div>
</div></div>
<div class="h">C&D VERITE LOTTO V6.2 cd-lotto</div><div class="g" id="gDate"></div>
<div class="tabs"><div class="tab active" onclick="op(1)">1.VANT</div><div class="tab" onclick="op(2)">2.KOPYE</div><div class="tab" onclick="op(3)">3.FICH</div><div class="tab" onclick="op(4)">4.RAPÒ</div></div>
<div id="p1" class="page active"><div class="tirages" id="tirages"></div><div class="total" id="lineInfo">Chwazi tiraj</div><div id="limitInfo" class="limitWarn">...</div><div id="rows"></div><div class="total" id="tot">Total $0</div><div class="btnV" onclick="valide()">💾 VALIDE - MENM BAZ DIVIZE</div></div>
<div id="p2" class="page"><div id="copyBox"></div><div class="btnV" onclick="kopyeLast()">📋 KOPYE DÈNYE</div></div>
<div id="p3" class="page"><input type="date" id="dateFich" style="width:100%;padding:7px;border:2px solid #000"><div id="fichBox"></div></div>
<div id="p4" class="page"><div style="border:2px solid #000;padding:10px"><div style="background:#FFD700;padding:5px;font-weight:900;text-align:center">RAPÒ DIVIZE PA TIRAJ</div><div style="display:flex;gap:4px;margin:6px 0"><input type="date" id="dateDebut" style="flex:1;padding:6px;border:2px solid #000"><input type="date" id="dateAu" style="flex:1;padding:6px;border:2px solid #000"></div><div class="btnV" style="background:#FFD700;color:#000" onclick="rapDetail()">📊 KALKILE</div><div id="rapParTiraj"></div><hr><div id="rLines"></div></div></div>
<script>
// FIREBASE cd-lotto OU
const firebaseConfig = {
  apiKey: "AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",
  authDomain: "cd-lotto.firebaseapp.com",
  databaseURL: "https://cd-lotto-default-rtdb.firebaseio.com",
  projectId: "cd-lotto",
  storageBucket: "cd-lotto.firebasestorage.app",
  messagingSenderId: "671091732195",
  appId: "1:671091732195:web:51bcfe8df83bc58fc75fd6",
  measurementId: "G-TWK9N38BS0"
};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let LIMITS_GLOBAL={BOLET:1500,MARYAJ:100,LOTO3:100,LOTO4:20,LOTO5:5};
let HEURES={GA_MIDI:"12:15",FL_MIDI:"13:15",NY_MIDI:"14:15",GA_SOIR:"18:15",FL_SOIR:"21:15",NY_SOIR:"22:15"};
function haitiNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Port-au-Prince'}));}
function haitiISO(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Port-au-Prince'});}
function haitiFR(){return new Date().toLocaleDateString('fr-HT',{timeZone:'America/Port-au-Prince',day:'2-digit',month:'2-digit',year:'numeric'});}
function haitiHeure(){return new Date().toLocaleTimeString('fr-HT',{timeZone:'America/Port-au-Prince',hour:'2-digit',minute:'2-digit',hour12:true});}
let vendeurNom="",vendeurPass="",lastJeux='BOLET',tirajSel=new Set(),fiches=JSON.parse(localStorage.getItem('cdV5')||'[]');
const MODPAS_OK=["1234","cerdi","0000","admin","123"];
async function checkPass(){const n=document.getElementById('nomV').value.trim(),p=document.getElementById('passV').value.trim();if(!n||!p){document.getElementById('passErr').innerText="Mete non/modpas";return;}try{const s=await db.collection('vendeurs').where('code','==',p).get();if(!s.empty||MODPAS_OK.includes(p)){vendeurNom=n;vendeurPass=p;localStorage.setItem('vd_nom',n);localStorage.setItem('vd_pass',p);document.getElementById('login').style.display='none';init();}else{document.getElementById('passErr').innerText="Modpas pa bon";}}catch(e){if(MODPAS_OK.includes(p)){vendeurNom=n;vendeurPass=p;localStorage.setItem('vd_nom',n);localStorage.setItem('vd_pass',p);document.getElementById('login').style.display='none';init();}}}
(function(){const n=localStorage.getItem('vd_nom'),p=localStorage.getItem('vd_pass');if(n)document.getElementById('nomV').value=n;if(p)document.getElementById('passV').value=p;})();
function op(n){document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i+1==n));document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i+1==n));}
async function loadConfig(){try{const d=await db.collection('config').doc('main').get();if(d.exists){const c=d.data();if(c.LIMITS)LIMITS_GLOBAL=c.LIMITS;if(c.HEURES)HEURES=c.HEURES;}}catch(e){}document.getElementById('limitInfo').innerText=`LIMIT GLOBAL DIVIZE: B $${LIMITS_GLOBAL.BOLET} | M $${LIMITS_GLOBAL.MARYAJ} | L3 $${LIMITS_GLOBAL.LOTO3} | L4 $${LIMITS_GLOBAL.LOTO4} | L5 $${LIMITS_GLOBAL.LOTO5} - PA TIRAJ`;}
function checkFermeture(){const now=haitiNow();const hm=now.getHours()*60+now.getMinutes();const parse=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};const f={"GA MIDI":parse(HEURES.GA_MIDI),"FL MIDI":parse(HEURES.FL_MIDI),"NY MIDI":parse(HEURES.NY_MIDI),"GA SOIR":parse(HEURES.GA_SOIR),"FL SOIR":parse(HEURES.FL_SOIR),"NY SOIR":parse(HEURES.NY_SOIR)};document.querySelectorAll('#tirages div').forEach(el=>{const t=el.dataset.t;if(f[t]&&hm>=f[t])el.classList.add('off');else el.classList.remove('off');});}
function initTirage(){document.getElementById('tirages').innerHTML=['GA MIDI','FL MIDI','NY MIDI','GA SOIR','FL SOIR','NY SOIR'].map(t=>`<div data-t="${t}">${t}</div>`).join('');document.querySelectorAll('#tirages div').forEach(el=>el.onclick=()=>toggleT(el.dataset.t,el));checkFermeture();}
function toggleT(t,el){if(tirajSel.has(t)){tirajSel.delete(t);el.classList.remove('on');}else{tirajSel.add(t);el.classList.add('on');}calc();}
function addLigne(jeu=lastJeux,b='',m='',focus=true){lastJeux=jeu;const id=Date.now()+Math.random().toString(36).substr(2,4);const d=document.createElement('div');d.className='row';d.id='l_'+id;d.innerHTML=`<select id="s_${id}"><option ${jeu=='BOLET'?'selected':''}>BOLET</option><option ${jeu=='MARYAJ'?'selected':''}>MARYAJ</option><option ${jeu=='LOTO3'?'selected':''}>LOTO3</option><option ${jeu=='LOTO4'?'selected':''}>LOTO4</option><option ${jeu=='LOTO5'?'selected':''}>LOTO5</option></select><input class="boul" id="b_${id}" type="tel" value="${b}" placeholder="Boul" oninput="calc()"><input class="miz" id="m_${id}" type="tel" value="${m}" placeholder="$" oninput="calc()"><button class="btnX" onclick="delL('${id}')">X</button><button class="btnF" onclick="nextL('${id}')">↓</button>`;document.getElementById('rows').appendChild(d);if(focus)setTimeout(()=>document.getElementById('b_'+id)?.focus(),50);calc();}
function nextL(id){const j=document.getElementById('s_'+id)?.value||lastJeux;addLigne(j,'','',true);}function delL(id){document.getElementById('l_'+id)?.remove();calc();if(!document.querySelectorAll('.row').length)addLigne(lastJeux);}
function calc(){let base=0;document.querySelectorAll('.row').forEach(r=>{base+=parseInt(r.querySelector('.miz')?.value)||0;});const nb=tirajSel.size||1;const parTiraj=nb? (base/nb) : base;document.getElementById('lineInfo').innerText=tirajSel.size?Array.from(tirajSel).join(' + ')+` (${tirajSel.size} tiraj)`:'Chwazi tiraj';document.getElementById('tot').innerText=`Total Fich $${base} | ${tirajSel.size} tiraj = $${parTiraj.toFixed(2)} pa tiraj | ${haitiFR()} ${haitiHeure()}`;document.getElementById('tot').dataset.base=base;document.getElementById('tot').dataset.parTiraj=parTiraj;}
async function valide(){
  if(!tirajSel.size)return alert('Cocher tiraj');const base=parseInt(document.getElementById('tot').dataset.base||0);if(!base)return alert('Mete boul');
  let list=[];document.querySelectorAll('.row').forEach(r=>{const j=r.querySelector('select').value,b=r.querySelector('.boul').value.trim(),m=parseInt(r.querySelector('.miz').value)||0;if(b&&m)list.push({jeux:j,boul:b,miz:m,mizParTiraj:m/tirajSel.size});});
  document.getElementById('tot').innerText="⏳ Tcheke limit...";
  try{
    const today=haitiISO();const snap=await db.collection('ventes').where('dateISO','==',today).get();let g={};
    snap.forEach(doc=>{const f=doc.data();f.tirages.forEach(t=>{f.list.forEach(l=>{const k=`${t}|${l.jeux}|${l.boul}`;const v=l.mizParTiraj||(l.miz/f.nbTiraj);g[k]=(g[k]||0)+v;});});});
    for(let selT of tirajSel){for(let l of list){const k=`${selT}|${l.jeux}|${l.boul}`,deja=g[k]||0,lim=LIMITS_GLOBAL[l.jeux]||1500;if(deja+l.mizParTiraj>lim){calc();return alert(`⛔ LIMIT DEPASE\n${selT} ${l.jeux} ${l.boul}\nDeja $${deja.toFixed(2)} + Ou $${l.mizParTiraj.toFixed(2)} > Limit $${lim}\nRete $${(lim-deja).toFixed(2)}`);}}}
  }catch(e){}
  const parTiraj=base/tirajSel.size;const fich={id:Date.now(),date:haitiFR(),dateISO:haitiISO(),heure:haitiHeure(),tirages:Array.from(tirajSel),nbTiraj:tirajSel.size,list,base,parTiraj,total:base,vendeur:vendeurNom,code:vendeurPass};
  fiches.unshift(fich);localStorage.setItem('cdV5',JSON.stringify(fiches));try{await db.collection('ventes').add(fich);}catch(e){}
  let w=window.open('','','width=380,height=600');w.document.write(`<body style="width:80mm;font-family:monospace;font-weight:900;text-align:center;background:#fff;color:#000"><div>C&D VERITE LOTTO</div><div>${fich.vendeur} ${fich.date} ${fich.heure}</div><div>${fich.tirages.join('+')} (${fich.nbTiraj} tiraj)</div><hr>${fich.list.map(l=>`<div style="text-align:left">${l.jeux} ${l.boul} $${l.miz} => $${l.mizParTiraj.toFixed(2)}/tiraj</div>`).join('')}<hr><div>TOTAL FICH $${fich.base}</div><div>PAR TIRAJ $${fich.parTiraj.toFixed(2)}</div><div style="font-size:8px">Prix B50/20/10 M1000 L3 500 L4 5000 L5 25000 Maryaj lod/dezod menm baz<br>lave chodyè w</div><script>print();setTimeout(()=>close(),900)<\/script>`);
  document.getElementById('rows').innerHTML='';addLigne(lastJeux);refreshF();calc();
}
function refreshF(){const iso=document.getElementById('dateFich').value;let h='';fiches.filter(f=>!iso||f.dateISO==iso).forEach(f=>{h+=`<div class="fich"><b>${f.date} ${f.heure} ${f.tirages.join('+')} x${f.nbTiraj}</b> ${f.vendeur}<br>${f.list.map(l=>l.jeux+' '+l.boul+'($'+l.miz+')').join(' - ')}<br>Total $${f.base} => $${f.parTiraj.toFixed(2)}/tiraj</div>`;});document.getElementById('fichBox').innerHTML=h||'Pa gen';document.getElementById('copyBox').innerHTML=h;}
function kopyeLast(){if(!fiches[0])return;document.getElementById('rows').innerHTML='';fiches[0].list.forEach(l=>addLigne(l.jeux,l.boul,l.miz,false));tirajSel=new Set(fiches[0].tirages);document.querySelectorAll('#tirages div').forEach(el=>{if(tirajSel.has(el.dataset.t))el.classList.add('on');});addLigne(lastJeux);op(1);calc();}
function rapDetail(){const d1=document.getElementById('dateDebut').value,d2=document.getElementById('dateAu').value;let parT={},tot=0;fiches.forEach(f=>{if(f.dateISO>=d1&&f.dateISO<=d2){const pt=f.parTiraj||(f.base/f.nbTiraj);f.tirages.forEach(t=>{if(!parT[t])parT[t]={v:0};parT[t].v+=pt;});tot+=f.base;}});let html='';Object.keys(parT).forEach(t=>{html+=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #000;padding:4px"><span>✓ ${t}</span><b>$${parT[t].v.toFixed(2)}</b></div>`;});document.getElementById('rapParTiraj').innerHTML=html;const com=Math.round(tot*0.2);document.getElementById('rLines').innerHTML=`<div>Vente $${tot}</div><div>Com $${com}</div><div>A payer $${tot-com}</div><div><b>Net $${tot-com}</b></div>`;}
async function init(){await loadConfig();const iso=haitiISO();document.getElementById('dateDebut').value=iso;document.getElementById('dateAu').value=iso;document.getElementById('dateFich').value=iso;document.getElementById('gDate').innerText=`${haitiFR()} ${haitiHeure()} | ${vendeurNom} | cd-lotto`;initTirage();addLigne();refreshF();calc();setInterval(()=>{document.getElementById('gDate').innerText=`${haitiFR()} ${haitiHeure()} | ${vendeurNom}`;checkFermeture();},60000);document.getElementById('dateFich').addEventListener('change',refreshF);}
</script></body></html>
