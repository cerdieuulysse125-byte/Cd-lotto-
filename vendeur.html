<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendeur - SYS-CDU.COM</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>*{box-sizing:border-box;font-family:Arial;font-weight:900}body{background:#ff0;margin:0;padding:10px}.card{background:#fff;border:4px solid #000;border-radius:16px;padding:12px;margin-bottom:10px}.input{width:100%;padding:14px;border:3px solid #000;border-radius:12px;margin:6px 0;text-transform:uppercase}.btn{padding:14px;border:3px solid #000;border-radius:12px;text-align:center;cursor:pointer}</style>
</head><body>
<div id="login" class="card" style="max-width:400px;margin:40px auto;"><div style="text-align:center;">🎫 LOGIN VENDEUR<br>syscdu.com/vendeur.html</div>
<input id="vName" placeholder="NON - X1" class="input"><input id="vPass" placeholder="MODPAS" class="input" type="password" inputmode="numeric"><div class="btn" style="background:#000;color:#ff0;" onclick="loginV()">KONEKTE - Vendeur X1, Y1</div>
<div style="font-size:10px;text-align:center;margin-top:6px;">Vendeur anba Proprio X oswa Y - Multi-tenant - cd-lotto</div></div>
<div id="app" style="display:none;"><div class="card" style="background:#000;color:#ff0;text-align:center;">Vendeur: <span id="vWho"></span> | Proprio: <span id="vProp"></span> | <span onclick="logout()" style="background:#f00;padding:4px 8px;border-radius:8px;">DEKONEKTE</span></div>
<div class="card">🎫 Espas vant - Fich ou yo ap ale nan <b>fiches_X</b> oswa <b>fiches_Y</b> - Se sèlman proprio ou ka wè yo - SAAS - sys-cdu.com</div></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",
  authDomain: "cd-lotto.firebaseapp.com",
  databaseURL: "https://cd-lotto-default-rtdb.firebaseio.com",
  projectId: "cd-lotto",
  storageBucket: "cd-lotto.firebasestorage.app",
  messagingSenderId: "671091732195",
  appId: "1:671091732195:web:51bcfe8df83bc58fc75fd6",
  measurementId: "G-TWK9N38BS0"
};
firebase.initializeApp(firebaseConfig); var db=firebase.database();
function loginV(){
  var n=document.getElementById('vName').value.trim().toUpperCase();
  var p=document.getElementById('vPass').value.trim();
  db.ref('config/proprietaires').once('value').then(snap=>{
    var props=snap.val(); var found=false;
    for(var prop in props){
      (function(pr){
        db.ref('vendors_'+pr+'/'+n).once('value').then(s2=>{
          var v=s2.val(); if(v && String(v.pass)===String(p)){
            found=true; localStorage.setItem('currentVendor',JSON.stringify(v));
            document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block';
            document.getElementById('vWho').textContent=v.name; document.getElementById('vProp').textContent=v.proprio;
          }
        });
      })(prop);
    }
    setTimeout(()=>{if(!found) alert('Non oswa modpas pa bon - Pa jwenn nan X, Y');},1500);
  });
}
function logout(){ localStorage.clear(); location.reload(); }
</script></body></html>
