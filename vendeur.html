<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>C&D LOTTO V13.2 TOUCH FIX</title>
</head>
<body style="background:#000;color:#fff;font-family:Arial;padding:10px;margin:0;touch-action:manipulation;">

<div style="background:#0f0;color:#000;padding:15px;text-align:center;font-weight:bold;font-size:16px;">
SUNMI V2 PRO POS-V2 - TOUCH FIX V13.2 - 58mm 100%
</div>

<div style="background:#111;border:2px solid #0f0;padding:10px;margin-top:10px;">
Ticket:58mm - Density:100% - SN:POS-V2 - TOUCH:AKTIF
</div>

<input id="b" value="02 15 28" style="width:100%;padding:20px;margin-top:15px;background:#222;color:#0f0;border:2px solid #0f0;font-size:20px;">

<input id="l" value="45 67" style="width:100%;padding:20px;margin-top:10px;background:#222;color:#0f0;border:2px solid #0f0;font-size:20px;">

<!-- BOUTON GWO - TOUCH FIX - DIV OLYE BUTTON -->
<div id="t1" style="background:#0099ff;color:#fff;padding:30px;margin-top:20px;text-align:center;font-size:22px;font-weight:bold;border-radius:15px;border:4px solid #fff;touch-action:manipulation;user-select:none;-webkit-user-select:none;">
👆 TOUCHE 1 - PRINT TEST
</div>

<div id="t2" style="background:#ff9900;color:#000;padding:35px;margin-top:15px;text-align:center;font-size:24px;font-weight:bold;border-radius:15px;border:5px solid #fff;touch-action:manipulation;user-select:none;-webkit-user-select:none;">
👆👆 TOUCHE 2 - VALIDER + ENPRIME
</div>

<div id="log" style="background:#111;color:#0f0;padding:10px;margin-top:15px;border:1px solid #333;height:100px;overflow:auto;font-size:12px;">
LOG TOUCH: Pare... Touche bouton yo...
</div>

<script>
var logEl = document.getElementById('log');
function lg(m){ logEl.innerHTML += m + '\n'; logEl.scrollTop = logEl.scrollHeight; console.log(m); }

function printRaw(t){
  lg('ENPRIME: ' + t.substring(0,20));
  try{
    var d = encodeURIComponent(t + '\n\n\n');
    // Touch fix - itilize location.href ki mache sou SUNMI
    window.location.href = 'rawbt://print?data=' + d + '&width=384';
    lg('RAWBT OK - Papye dwe soti');
  }catch(e){ lg('ERR: ' + e); }
}

// TOUCH FIX - TOUCHSTART + CLICK + ontouch
function addTouch(id, fn){
  var el = document.getElementById(id);
  if(!el){ lg('Pa jwenn ' + id); return; }
  // Tout metod touch
  el.addEventListener('touchstart', function(e){ e.preventDefault(); lg('TOUCHSTART ' + id); fn(); }, {passive:false});
  el.addEventListener('touchend', function(e){ e.preventDefault(); }, {passive:false});
  el.addEventListener('click', function(){ lg('CLICK ' + id); fn(); });
  el.addEventListener('mousedown', function(){ lg('MOUSEDOWN ' + id); });
  el.ontouchstart = function(){ lg('ONTOUCH ' + id); fn(); return false; };
  el.onclick = fn;
  lg('Touch ajoute pou ' + id + ' OK');
}

function testPrint(){
  lg('>>> BOUTON 1 TOUCHE OK');
  alert('BOUTON 1 TOUCHE OK - AP ENPRIME TEST');
  printRaw('Ticket Format:58mm\nDensity:100%\nSN:POS-V2\nTEST V13.2 TOUCH OK\n' + new Date().toLocaleString() + '\n58mm 384 dots');
}

function validerPrint(){
  lg('>>> BOUTON 2 VALIDER TOUCHE OK - ANTRE');
  alert('BOUTON VALIDER TOUCHE OK - AP ENPRIME FICH');
  var bolet = document.getElementById('b').value;
  var loto = document.getElementById('l').value;
  var fich = 'C&D LOTTO\nBOLET:' + bolet + '\nLOTO:' + loto + '\n' + new Date().toLocaleString() + '\nPOS-V2 58mm 100% DIRECT';
  printRaw(fich);
  lg('VALIDER TOUCHE OK - Papye soti');
}

// Aktive touch apre DOM
setTimeout(function(){
  lg('Aktive touch...');
  addTouch('t1', testPrint);
  addTouch('t2', validerPrint);
  lg('TOUCHE AKTIF - KLIKE KOUNYA');
  // Flash bouton pou montre aktif
  document.getElementById('t2').style.background = '#ffff00';
  setTimeout(function(){ document.getElementById('t2').style.background = '#ff9900'; }, 500);
}, 500);

// Backup si touch pa mache - klavye
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ lg('ENTER KLIKE - VALIDER'); validerPrint(); }
});

lg('V13.2 TOUCH FIX pare - Touche bouton yo ak dwèt');
</script>

</body>
</html>
