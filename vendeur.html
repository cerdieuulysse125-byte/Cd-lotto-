<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VANDE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f2f2f2}
.h{background:#111;color:#fff;padding:10px;text-align:center;font-weight:bold}
.tabs{display:flex;background:#fff;position:sticky;top:0;z-index:10}
.tab{flex:1;padding:10px;text-align:center;border-bottom:3px solid #0000;cursor:pointer;font-size:13px}
.tab.active{border-color:#111;font-weight:bold;background:#eee}
.ong{display:none;padding:8px}.ong.active{display:block}
.card{background:#fff;padding:10px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.15);margin-bottom:8px}
.row{display:grid;grid-template-columns:80px 1fr 80px;gap:6px;align-items:center}
.row input{padding:10px;border:1px solid #ccc;border-radius:6px;text-align:center}
.tiraj6{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.tiraj6 label{background:#eee;padding:7px;border-radius:6px;font-size:12px;text-align:center}
.typeBox{display:flex;gap:5px;margin:6px 0}
.typeBox button{flex:1;padding:8px;border:1px solid #111;background:#fff;color:#111;border-radius:20px}
.typeBox button.active{background:#111;color:#fff}
.total{font-weight:bold;text-align:right;margin:6px 0}
.btn{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:6px}
</style></head><body>
<div class="h">C&D VÉRITÉ LOTTO - VANDE</div>
<div class="tabs"><div class="tab active" onclick="go(0)">1.Vendre</div><div class="tab" onclick="go(1)">2.Kopye</div><div class="tab" onclick="go(2)">3.Mes Fiches</div><div class="tab" onclick="go(3)">4.Rapport</div></div>

<div class="ong active" id="o0"><div class="card">
<div class="tiraj6" id="tiraj6"></div>
<div class="typeBox" id="typeBox">
<button class="active" onclick="setType('bolet')">Bolet</button>
<button onclick="setType('maryaj')">Maryaj</button>
<button onclick="setType('loto3')">Loto3</button>
<button onclick="setType('loto4')">Loto4</button>
<button onclick="setType('loto5')">Loto5</button>
</div>
<div class="row" style="font-weight:bold;font-size:12px"><div>Jeux</div><div>Boul</div><div>Miz</div></div>
<div id="lignes"></div>
<button onclick="addLigne()" style="width:100%;padding:6px;margin:4px 0">+ Ligne (Flèche ↓)</button>
<div class="total" id="total">Total x Tiraj: 0</div>
<button class="btn" onclick="valider()">VALIDER + IMPRIMER</button>
<div id="ticketPrint"></div>
</div></div>

<div class="ong" id="o1"><div class="card">
<input id="codeKopi" placeholder="ID Ticket 5 lèt" style="text-transform:uppercase;text-align:center;letter-spacing:3px">
<button class="btn" onclick="kopye()">Kopye Ticket</button>
<div id="resKopye"></div>
</div></div>

<div class="ong" id="o2"><div class="card"><div id="mesFiches"></div></div></div>

<div class="ong" id="o3"><div class="card">
<input type="date" id="du"><input type="date" id="au">
<select id="fTiraj"><option value="tous">Tous</option><option>GA midi</option><option>FL midi</option><option>NY midi</option><option>GA soir</option><option>FL soir</option><option>NY soir</option></select>
<button class="btn" onclick="genRap()">Rapport</button>
<div id="zoneRap"></div>
<button class="btn" onclick="window.print()">Imprimer</button>
</div></div>

<script>
let typeActif=localStorage.getItem('typeActif')||'bolet';
let lignes=[];let TIRAJ=["GA midi","FL midi","NY midi","GA soir","FL soir","NY soir"];
let FERMETURE=JSON.parse(localStorage.getItem('fermeture')||'{"GA midi":"12:15","FL midi":"13:15","NY midi":"14:15","GA soir":"18:15","FL soir":"21:15","NY soir":"21:30"}');
let PRIX=JSON.parse(localStorage.getItem('prix')||'{"bolet":[50,20,10],"maryaj":1000,"loto3":500,"loto4":5000,"loto5":25000}');
let resultats=JSON.parse(localStorage.getItem('resultats')||'{}');
let fiches=JSON.parse(localStorage.getItem('fiches')||'[]');
function go(i){document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k==i));document.querySelectorAll('.ong').forEach((o,k)=>o.classList.toggle('active',k==i));}
function setType(t){typeActif=t;localStorage.setItem('typeActif',t);document.querySelectorAll('#typeBox button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()==t));}
function initTiraj(){let h=new Date();let cur=h.getHours()*60+h.getMinutes();let html="";TIRAJ.forEach(t=>{let[hh,mm]=FERMETURE[t].split(':').map(Number);let f=hh*60+mm;let dis=cur>=f?"disabled style='opacity:.3'":"";html+=`<label><input type="checkbox" value="${t}" ${dis}> ${t}</label>`;});document.getElementById('tiraj6').innerHTML=html;}
function addLigne(b="",m=""){let idx=lignes.length;let div=document.createElement('div');div.className='row';div.innerHTML=`<div>${typeActif}</div><input inputmode="numeric" pattern="[0-9]*" value="${b}" onkeydown="flech(event,${idx},0)" class="b"><input inputmode="numeric" pattern="[0-9]*" value="${m}" onkeydown="flech(event,${idx},1)" class="m" oninput="calc()">`;document.getElementById('lignes').appendChild(div);lignes.push(div);}
function flech(e,idx,col){if(e.key==="ArrowDown"||e.key==="Enter"){e.preventDefault();let next=idx+1;if(next>=lignes.length)addLigne();lignes[next]?.querySelectorAll('input')[col]?.focus();}}
function calc(){let tot=0;let sel=[...document.querySelectorAll('#tiraj6 input:checked')].length||1;lignes.forEach(r=>{let m=parseFloat(r.querySelector('.m').value)||0;tot+=m;});document.getElementById('total').textContent=`Total x Tiraj (${sel}): ${tot*sel}`;return tot*sel;}
function valider(){let tirajs=[...document.querySelectorAll('#tiraj6 input:checked')].map(i=>i.value);if(!tirajs.length)return alert("Chwazi tiraj");let data=[];lignes.forEach(r=>{let b=r.querySelector('.b').value.trim();let m=parseFloat(r.querySelector('.m').value)||0;if(b&&m)data.push({jeux:typeActif,boule:b,miz:m});});if(!data.length)return alert("Antre boul");let code=Math.random().toString(36).substr(2,5).toUpperCase();let fich={id:code,code,date:new Date().toISOString().slice(0,10),tirajs,jeux:typeActif,lignes:data,total:calc()};fiches.push(fich);localStorage.setItem('fiches',JSON.stringify(fiches));document.getElementById('ticketPrint').innerHTML=`<div style="border:1px dashed #000;padding:8px"><b>C&D VERITE LOTTO</b><br>Tiraj:${tirajs.join(',')}<br>ID:${code}<br>${data.map(d=>d.boule+' '+d.miz).join('<br>')}<br>Total:${fich.total}</div>`;window.print();lignes=[];document.getElementById('lignes').innerHTML="";addLigne();calc();}
function kopye(){let c=document.getElementById('codeKopi').value.toUpperCase().trim();let f=fiches.find(x=>x.code==c);if(!f){document.getElementById('resKopye').innerHTML="Pa jwenn";return;}document.getElementById('resKopye').innerHTML=`${f.code} ${f.tirajs}<br>${f.lignes.map(l=>l.boule+' '+l.miz).join('<br>')}<br><button class="btn" onclick="loadKopi('${f.code}')">Chaje nan Vendre</button>`;}
function loadKopi(code){let f=fiches.find(x=>x.code==code);go(0);document.getElementById('lignes').innerHTML="";lignes=[];setType(f.jeux);f.lignes.forEach(l=>addLigne(l.boule,l.miz));}
function separe(txt){if(!txt)return null;let t=txt.toString().toLowerCase().replace(/×/g,'x').trim();let p=null;if(t.includes('x'))p=t.split('x');else if(t.length>=4)p=[t.slice(0,2),t.slice(2,4)];else return null;if(!p||p.length<2)return null;return[p[0].slice(-2),p[1].slice(-2)];}
function maryajGagne(bet,res){let B=separe(bet),R=separe(res);if(!B||!R)return false;return(B[0]==R[0]&&B[1]==R[1])||(B[0]==R[1]&&B[1]==R[0]);}
function genRap(){let du=document.getElementById('du').value,au=document.getElementById('au').value||du,fT=document.getElementById('fTiraj').value;let vPar={},pPar={},comPar={};let vTot=0,pTot=0,comTot=0;fiches.forEach(fd=>{if(du&&fd.date<du)return;if(au&&fd.date>au)return;fd.lignes.forEach(l=>{(fd.tirajs||[]).forEach(tir=>{if(fT!=="tous"&&tir!==fT)return;if(!vPar[tir]){vPar[tir]=0;pPar[tir]=0;comPar[tir]=0;}vPar[tir]+=l.miz;vTot+=l.miz;let re=resultats[fd.date]&&resultats[fd.date][tir];let pay=0;if(re){if(l.jeux=='bolet'){if(l.boule==re.p1)pay=l.miz*PRIX.bolet[0];else if(l.boule==re.p2)pay=l.miz*PRIX.bolet[1];else if(l.boule==re.p3)pay=l.miz*PRIX.bolet[2];}else if(l.jeux=='maryaj'){if(maryajGagne(l.boule,re.M1)||maryajGagne(l.boule,re.M2)||maryajGagne(l.boule,re.M3))pay=l.miz*PRIX.maryaj;}}if(pay>0){pPar[tir]+=pay;pTot+=pay;}let com=l.miz*0.1;comPar[tir]+=com;comTot+=com;});});});let html="";for(let t in vPar){html+=`<div style="border:1px solid #ccc;padding:6px;margin:4px 0"><b>${t}</b> Vente:${vPar[t]} Com:${comPar[t]} A payer:${pPar[t]||0} Balance:${vPar[t]-comPar[t]-(pPar[t]||0)}</div>`;}html+=`<hr><b>Vente:${vTot} Com:${comTot} A payer:${pTot} Balance net:${vTot-comTot-pTot}</b>`;document.getElementById('zoneRap').innerHTML=html;}
initTiraj();setType(typeActif);addLigne();calc();
</script></body></html>
