<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VANDE V9.5 - DIMANSYON TIRAJ + FEMTI + CHIF SELMAN + FLECH</title>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0;padding:0}body{background:#fff}
.top-y{background:#FFD500;text-align:center;padding:14px;font-weight:900;font-size:14px}.top-b{background:#000;color:#FFD500;text-align:center;padding:10px;font-weight:900;font-size:13px}
.login-box{margin:20px;border:3px solid #000;border-radius:22px;padding:15px;background:#FFF8DC}.kf{width:100%;border:3px solid #000;border-radius:25px;height:52px;text-align:center;font-weight:900;margin:6px 0}
.btn{border:3px solid #000;border-radius:25px;height:52px;font-weight:900;width:100%}.btn-y{background:#FFD500}
.menu{display:flex;border:2px solid #000}.menu button{flex:1;padding:13px 2px;font-weight:900;background:#fff;border:none;border-right:2px solid #000;font-size:11px}.menu button.active{background:#FFD500}
/* TOUT KAZ MENM DIMANSYON AK KAZ TIRAJ YO - 52px RADIUS 25px BORDER 3px */
.grid{padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.t-btn{border:3px solid #000;border-radius:25px;height:52px;font-weight:900;background:#fff;font-size:12px}.t-btn.active{background:#FFD500}.t-btn.ferme{background:#FF0000;color:#fff;border:3px solid #000}
.ligne{display:flex;gap:8px;padding:0 10px;margin-bottom:10px}
.k-jeux{flex:1.1;height:52px;border:3px solid #000;border-radius:25px;font-weight:900;text-align:center;background:#fff;font-size:12px}
.k-boul{flex:1;height:52px;border:3px solid #000;border-radius:25px;font-weight:900;text-align:center;font-size:20px;background:#fff}
.k-miz{flex:0.8;height:52px;border:3px solid #000;border-radius:25px;font-weight:900;text-align:center;background:#FFD500;font-size:20px}
.b-x{width:52px;height:52px;border:3px solid red;color:red;background:#fff;border-radius:25px;font-weight:900;font-size:16px}.b-d{width:52px;height:52px;border:3px solid #000;background:#FFD500;border-radius:25px;font-weight:900;font-size:20px}
.total{margin:10px;border:3px solid #000;border-radius:25px;min-height:52px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;padding:8px;text-align:center}
.btns{display:flex;gap:10px;padding:10px}.bb{flex:1;height:56px;border:3px solid #000;border-radius:28px;font-weight:900;font-size:12px}.black{background:#000;color:#FFD500}.green{background:#0A9A0A;color:#FF0}
.onglet{display:none}.onglet.active{display:block}
.ferm-box{margin:10px;border:3px solid red;background:#FFD500;border-radius:25px;padding:12px;text-align:center;font-weight:900;font-size:11px}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;text-align:center;font-size:32px;font-weight:900;line-height:1.9;font-family:monospace}}
</style>
</head>
<body>
<div id="loginScreen"><div class="top-y">C&D VÉRITÉ LOTTO - LOGIN</div><div class="login-box"><input id="loginNom" class="kf" placeholder="Non vendeur" inputmode="text"><input id="loginPass" class="kf" placeholder="Modpas" type="password"><button class="btn btn-y" onclick="login()">🔓 KONEKTE</button><div id="loginMsg" style="margin-top:10px;font-weight:900;text-align:center"></div></div></div>
<div id="vandeScreen" style="display:none"><div class="top-y">VENDEUR - <span id="nomV"></span></div><div class="top-b" id="dateBar"></div><div class="menu"><button class="active" id="m1" onclick="openO(1)">1.VENTE</button><button id="m2" onclick="openO(2)">2.COPIER</button><button id="m3" onclick="openO(3)">3.FICHES</button><button id="m4" onclick="openO(4)">4.RAPPORT</button><button onclick="logout()" style="background:red;color:#fff;border:none;padding:13px;font-weight:900">X</button></div>
<div id="o1" class="onglet active"><div id="fermMsg" class="ferm-box"></div><div class="grid" id="grid"></div><div id="tSel" style="margin:10px;border:3px solid #000;border-radius:25px;height:52px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;padding:5px;text-align:center"></div><div id="container"></div><div class="total" id="totalBar"></div><div class="btns"><button class="bb black" onclick="valider(false)">💾 VALIDER</button><button class="bb green" onclick="valider(true)">🖨️ VALIDER + IMPRIMER SANTRÉ GRAN LÈT V2 PRO</button></div></div>
<div id="o2" class="onglet"><input id="idT" class="kf" placeholder="ID Ticket" inputmode="numeric"><button class="bb black" style="margin:10px;width:calc(100% - 20px)" onclick="copier()">KOPIYE</button><div id="resC" style="margin:10px;border:2px solid #000;border-radius:12px;padding:10px;font-weight:900"></div></div>
<div id="o3" class="onglet"><input type="date" id="dateF" class="kf"><input id="searchF" class="kf" placeholder="Recherche..."><div id="listF"></div></div>
<div id="o4" class="onglet"><input type="date" id="du" class="kf"><input type="date" id="au" class="kf"><select id="filT" class="kf"><option value="TOUS">Tous Tirages</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select><button onclick="jenereR()" style="width:calc(100% - 20px);margin:10px;height:52px;border-radius:25px;background:#FFD500;border:3px solid #000;font-weight:900">📊 RAPÒ</button><div id="rapV" style="margin:10px;border:2px solid #000;border-radius:12px;padding:10px;font-weight:900;background:#fff"></div></div></div>
<div id="printArea" style="display:none"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = { apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4", authDomain:"cd-lotto.firebaseapp.com", databaseURL:"https://cd-lotto-default-rtdb.firebaseio.com", projectId:"cd-lotto", storageBucket:"cd-lotto.firebasestorage.app", messagingSenderId:"671091732195", appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6" };
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
let vendeurActif=null,pourV=10,tirajChwazi=["FL MIDI"],lignes=[{type:"BOLET",boul:"",miz:""}];
const tirajList=["GA MIDI","FL MIDI","NY MIDI","GA SOIR","FL SOIR","NY SOIR"];
function normM(b){ if(!b)return""; b=b.toString().trim().toLowerCase().replace(/[^0-9x]/g,''); if(!b.includes('x')&&b.length==4) b=b.slice(0,2)+'x'+b.slice(2); const p=b.split('x').filter(x=>x!=""); if(p.length!=2) return b; return [p[0].padStart(2,'0'),p[1].padStart(2,'0')].sort().join('x'); }
window.login=async function(){ const nom=document.getElementById('loginNom').value.trim(); const pass=document.getElementById('loginPass').value.trim(); const snap=await get(ref(db,`vendeurs`)); let ok=false; if(snap.exists()){ Object.values(snap.val()).forEach(v=>{ if(v.nom.toLowerCase()==nom.toLowerCase()&&v.pass==pass){ if(v.status=="FERME"){document.getElementById('loginMsg').innerText="Vendeur FERME";return;} ok=true; vendeurActif=v.nom; pourV=parseInt(v.pour||10);} }); } if(!ok){document.getElementById('loginMsg').innerText="Non/modpas pa bon";return;} localStorage.setItem('vendeur',vendeurActif); localStorage.setItem('pour',pourV); startVande(); }
function startVande(){ document.getElementById('loginScreen').style.display='none'; document.getElementById('vandeScreen').style.display='block'; document.getElementById('nomV').innerText=vendeurActif+" - "+pourV+"%"; document.getElementById('dateBar').innerText=new Date().toISOString().slice(0,10)+" | "+vendeurActif+" | "+pourV+"%"; renderT(); renderV(); checkFermeture(); }
window.logout=function(){ localStorage.clear(); location.reload(); }
// LÈ FÈMTI DWE RESPEKTE - TOUT KAZ MENM DIMANSYON
async function checkFermeture(){ const snap=await get(ref(db,`heures`)); const now=new Date(); const cur=now.getHours()*60+now.getMinutes(); let msg="Lè fèmti respekte: "; let fermList=[]; if(snap.exists()){ const h=snap.val(); const map={"GA MIDI":h.GA_MIDI,"FL MIDI":h.FL_MIDI,"NY MIDI":h.NY_MIDI,"GA SOIR":h.GA_SOIR,"FL SOIR":h.FL_SOIR,"NY SOIR":h.NY_SOIR}; tirajList.forEach(t=>{ const hm=map[t]; if(!hm)return; const [hh,mm]=hm.split(':').map(Number); if(cur>hh*60+mm){ fermList.push(t); msg+=` ${t} FÈME (${hm}) |`; tirajChwazi=tirajChwazi.filter(x=>x!==t); } }); } if(fermList.length==0) msg+=" Tout tiraj ouvè - Limit Global respekte - Maryaj 12×34=34×12 bon"; document.getElementById('fermMsg').innerText=msg; window.fermList=fermList; renderT(); }
window.openO=function(n){ document.querySelectorAll('.onglet').forEach(o=>o.classList.remove('active')); document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active')); document.getElementById('o'+n).classList.add('active'); document.getElementById('m'+n)?.classList.add('active'); }
function renderT(){ const g=document.getElementById('grid'); g.innerHTML=""; tirajList.forEach(t=>{ const a=tirajChwazi.includes(t); const ferme=(window.fermList||[]).includes(t); g.innerHTML+=`<button class="t-btn ${ferme?'ferme':a?'active':''}" ${ferme?'disabled':''} onclick="toggleT('${t}')">${t} ${ferme?'FÈME':a?'✓':''}</button>`}); document.getElementById('tSel').innerText=tirajChwazi.join(' / ')+' ✓'; }
window.toggleT=function(t){ if((window.fermList||[]).includes(t)){ alert(t+" FÈME - Lè fèmti respekte"); return; } if(tirajChwazi.includes(t)){ if(tirajChwazi.length>1) tirajChwazi=tirajChwazi.filter(x=>x!==t);} else tirajChwazi.push(t); renderT(); calc(); }
// TOUT KAZ MENM DIMANSYON AK KAZ TIRAJ YO - CHIF SELMAN - FLECH POU AVANSE A LA LIGNE SUIVANTE
window.renderV=function(){ const c=document.getElementById('container'); c.innerHTML=""; lignes.forEach((l,i)=>{ c.innerHTML+=`<div class="ligne"><select class="k-jeux" id="type-${i}" tabindex="-1"><option ${l.type=="BOLET"?"selected":""}>BOLET</option><option ${l.type=="MARYAJ"?"selected":""}>MARYAJ</option><option ${l.type=="LOTO3"?"selected":""}>LOTO3</option><option ${l.type=="LOTO4"?"selected":""}>LOTO4</option><option ${l.type=="LOTO5"?"selected":""}>LOTO5</option></select><input class="k-boul" id="boul-${i}" value="${l.boul}" placeholder="Boul" inputmode="numeric" pattern="[0-9x]*" autocomplete="off"><input class="k-miz" id="miz-${i}" value="${l.miz}" placeholder="Miz" inputmode="numeric" pattern="[0-9]*" autocomplete="off"><button class="b-x" tabindex="-1" onclick="supp(${i})">X</button><button class="b-d" tabindex="-1" onclick="down(${i})">↓</button></div>`;}); lignes.forEach((_,i)=>{ const elB=document.getElementById(`boul-${i}`); const elM=document.getElementById(`miz-${i}`); const elT=document.getElementById(`type-${i}`); elT.addEventListener('change',e=>lignes[i].type=e.target.value);
// CHIF SELMAN NAN KLAVE A
elB.addEventListener('input',e=>{ let v=e.target.value.toLowerCase(); if(lignes[i].type=="MARYAJ") v=v.replace(/[^0-9x]/g,''); else v=v.replace(/[^0-9]/g,''); e.target.value=v; lignes[i].boul=v; calc(); });
elM.addEventListener('input',e=>{ e.target.value=e.target.value.replace(/[^0-9]/g,''); lignes[i].miz=e.target.value; calc(); });
// TOUCHE FLECHE POUR AVANCER A LA LIGNE SUIVANTE (A DROITE - EN BAS) CONSERVANT LE JEU SELECTIONNE
elB.addEventListener('keydown',e=>{ if(e.key=="Enter"||e.key=="ArrowRight"||e.key=="ArrowDown"){ e.preventDefault(); document.getElementById(`miz-${i}`)?.focus(); } });
elM.addEventListener('keydown',e=>{ if(e.key=="Enter"||e.key=="ArrowDown"){ e.preventDefault(); down(i); } if(e.key=="ArrowUp"){ e.preventDefault(); document.getElementById(`boul-${i}`)?.focus(); } });
}); calc(); }
window.supp=function(i){ lignes.splice(i,1); if(lignes.length==0) lignes=[{type:"BOLET",boul:"",miz:""}]; renderV(); }
window.down=function(i){
  const curType=document.getElementById(`type-${i}`)?.value||lignes[i].type;
  const curBoul=document.getElementById(`boul-${i}`)?.value||lignes[i].boul;
  const curMiz=document.getElementById(`miz-${i}`)?.value||lignes[i].miz;
  lignes[i].type=curType; lignes[i].boul=curBoul; lignes[i].miz=curMiz;
  // CONSERVANT LE JEU SELECTIONNE - KENBE JEU A
  lignes.splice(i+1,0,{type:curType,boul:"",miz:""});
  renderV();
  setTimeout(()=>{ document.getElementById(`boul-${i+1}`)?.focus(); },80);
}
window.calc=function(){ let base=0; lignes.forEach(l=>{ if(l.boul.trim()!=""&&parseInt(l.miz)>0) base+=parseInt(l.miz); }); document.getElementById('totalBar').innerText=`Total ×tiraj sélectionné - $${base} × ${tirajChwazi.length} = $${base*tirajChwazi.length} - Flèche ↓ kenbe je - Chif sèlman`; }
window.valider=async function(doPrint){
  const valides=lignes.filter(f=>f.boul.trim()!=""&&f.miz.trim()!="").map(f=>({...f,boul:f.type=="MARYAJ"?normM(f.boul):f.boul}));
  if(valides.length==0)return;
  const dateStr=new Date().toISOString().slice(0,10);
  const snapH=await get(ref(db,`heures`)); if(snapH.exists()){ const h=snapH.val(); const now=new Date(); const cur=now.getHours()*60+now.getMinutes(); for(let t of tirajChwazi){ const hm=h[t.replace(' ','_')]; if(!hm)continue; const [hh,mm]=hm.split(':').map(Number); if(cur>hh*60+mm){alert(`FÈMTI ${t} RESPEKTE - ${hm} - Pa ka vann`);return;} } }
  const snap=await get(ref(db,`ventes/${dateStr}`)); let gB={},gM={},gO={LOTO3:0,LOTO4:0,LOTO5:0}; if(snap.exists()){ Object.values(snap.val()).forEach(vs=>Object.values(vs).forEach(fc=>fc.fiches.forEach(x=>{ if(x.type=="BOLET"){gB[x.boul]=(gB[x.boul]||0)+parseInt(x.miz);} else if(x.type=="MARYAJ"){ const n=normM(x.boul); gM[n]=(gM[n]||0)+parseInt(x.miz);} else {gO[x.type]=(gO[x.type]||0)+parseInt(x.miz);} }))); }
  const snapLim=await get(ref(db,`limites/${vendeurActif}`)); const lim=snapLim.exists()?snapLim.val():{BOLET:15000,MARYAJ:100,LOTO3:100,LOTO4:20,LOTO5:5};
  for(let f of valides){ if(f.type=="MARYAJ"){ const n=normM(f.boul); if((gM[n]||0)+parseInt(f.miz)>parseInt(lim.MARYAJ)){alert(`LIMIT GLOBAL MARYAJ ${n} DEPASE - 12×34=34×12 - ${(gM[n]||0)+parseInt(f.miz)} > ${lim.MARYAJ}`);return;} } else if(f.type=="BOLET"){ if((gB[f.boul]||0)+parseInt(f.miz)>parseInt(lim.BOLET)){alert(`LIMIT GLOBAL BOLET ${f.boul} DEPASE`);return;} } else { if((gO[f.type]||0)+parseInt(f.miz)>parseInt(lim[f.type])){alert(`LIMIT GLOBAL ${f.type} DEPASE`);return;} } }
  const id="T-"+Date.now().toString().slice(-6); const tot=valides.reduce((s,f)=>s+(parseInt(f.miz)||0),0)*tirajChwazi.length;
  await push(ref(db,`ventes/${dateStr}/${vendeurActif}`),{id,tiraj:tirajChwazi,fiches:valides,total:tot,date:dateStr,timestamp:Date.now(),vendeur:vendeurActif});
  const ent=await get(ref(db,`config/entete`)); const e=ent.exists()?ent.val():{nom:"C&D VÉRITÉ LOTTO"};
  const html=`${e.nom}<br>Date ${dateStr}<br>Tirages ${tirajChwazi.join('/')} <br>Responsable ${vendeurActif}<br>Ticket ${id}<br>----------------<br>${valides.map(f=>`${f.type} ${f.boul} $${f.miz}`).join('<br>')}<br>----------------<br>TOTAL $${tot}<br><br>Bòn chans, lave chodyè`;
  document.getElementById('printArea').innerHTML=html; if(doPrint){ document.getElementById('printArea').style.display='block'; window.print(); document.getElementById('printArea').style.display='none'; }
  lignes=[{type:lignes[lignes.length-1].type,boul:"",miz:""}]; renderV();
}
window.copier=async function(){ const id=document.getElementById('idT').value.trim(); if(!id)return; const snap=await get(ref(db,`ventes`)); let found=null; snap.forEach(d=>{d.forEach(v=>{Object.values(v.val()).forEach(f=>{if(f.id==id)found=f;})})}); if(found){ lignes=found.fiches.map(x=>({...x})); tirajChwazi=found.tiraj; openO(1); renderT(); renderV(); document.getElementById('resC').innerText="✅ Kopye "+found.id; } }
window.renderF=async function(){ const dateFil=document.getElementById('dateF').value||new Date().toISOString().slice(0,10); const snap=await get(ref(db,`ventes/${dateFil}/${vendeurActif}`)); const cont=document.getElementById('listF'); cont.innerHTML=""; if(!snap.exists()){cont.innerHTML="Pa gen fich";return;} Object.values(snap.val()).forEach(f=>{cont.innerHTML+=`<div style="margin:8px 10px;border:2px solid #000;border-radius:12px;padding:8px;background:#fff;font-size:12px"><b>${f.id}</b> - ${f.tiraj.join('+')} - $${f.total}<br>${f.fiches.map(x=>x.type+' '+x.boul+' $'+x.miz).join('<br>')}</div>`}); }
window.jenereR=async function(){ const du=document.getElementById('du').value||new Date().toISOString().slice(0,10); const snapV=await get(ref(db,`ventes/${du}/${vendeurActif}`)); let vente=0; if(snapV.exists()) Object.values(snapV.val()).forEach(f=>vente+=f.total); document.getElementById('rapV').innerHTML=`Vente $${vente}<br>Balance $${vente*0.9}`; }
const saved=localStorage.getItem('vendeur'); if(saved){ vendeurActif=saved; pourV=parseInt(localStorage.getItem('pour')||10); startVande(); }
</script>
</body>
</html>
