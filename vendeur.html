<!DOCTYPE html><html lang='ht'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>VANDE V27 - FÒMA AKÈY FOTO</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}body{background:#f6f7fb}
.h{background:#fff;color:#111;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5000;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.menuBtn{font-size:26px;background:none;border:0;cursor:pointer}
.drawer{display:none;position:fixed;left:0;top:0;bottom:0;width:270px;background:#0a4a2e;z-index:6000;padding:70px 12px 12px}.drawer.open{display:block}.drawer button{width:100%;padding:16px;margin:6px 0;background:#123d25;color:#fff;border:1px solid #d4af37;border-radius:10px;font-weight:800;text-align:left;font-size:14px}
.card{background:#fff;border-radius:12px;padding:10px;margin:8px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
/* FÒMA AKÈY EGZAK FOTO */
.akeyWrap{padding:14px;background:#f6f7fb}
.lottoCard{background:#fff;border-radius:22px;padding:22px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.06);min-height:148px}
.lottoLogo{width:132px;height:132px;border-radius:50%;flex-shrink:0;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;border:0}
.lottoLogo img{width:100%;height:100%;object-fit:contain}
.lottoRight{flex:1;margin-left:18px;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.lottoRight h4{font-size:18px;font-weight:700;color:#1e293b;margin-bottom:8px;letter-spacing:.2px}
.pillsRow{display:flex;gap:10px;margin-bottom:20px;justify-content:flex-end}
.pill{padding:8px 14px;border-radius:18px;font-weight:800;color:#fff;font-size:18px;min-width:56px;text-align:center;line-height:1}
.pillBlue{background:#1d4ed8}.pillOrange{background:#ff8c00}.pillLightBlue{background:#0ea5e9}
/* VENDRE */
.vannWrap{background:#fff;padding:10px;border-radius:12px}
.pillTiraj{width:100%;min-height:52px;border:3px solid #111;border-radius:26px;background:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tlist{display:none;position:fixed;left:8px;right:8px;top:110px;background:#fff;border:3px solid #0a4a2e;border-radius:12px;z-index:7000;padding:8px;grid-template-columns:1fr 1fr 1fr;gap:6px;max-height:65vh;overflow:auto}.tlist.open{display:grid}
.topt{min-height:62px;border:2px solid #ccc;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:800;cursor:pointer}.topt.sel{background:#e8f5e9;border-color:#0a4a2e}.topt.ferme{background:#ffcdd2;border-color:#c62828}
.headerRow{display:flex;justify-content:space-between;padding:6px;font-weight:800;font-size:12px}
.headerRow span{flex:1;text-align:center}
.betRow{display:flex;gap:4px;align-items:center;margin:8px 0}
.oval{height:48px;border:2.5px solid #111;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;flex:1;font-weight:900}
.oval select,.oval input{width:100%;height:100%;border:0;background:transparent;font-weight:900;text-align:center;border-radius:24px;font-size:14px}
.circle{width:42px;min-width:42px;height:42px;border-radius:50%;border:2.5px solid #111;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer}
.circleY{background:#ffcc00}.circleR{background:#fff;color:#c62828;border-color:#c62828}.circleD{background:#ffcc00}
.totalBar{background:#111;color:#ffcc00;border-radius:24px;padding:12px;text-align:center;font-weight:800;font-size:12px;margin:12px 0}
.btnBlack{flex:1;height:54px;background:#111;border-radius:28px;color:#ffcc00;font-weight:900;border:3px solid #111}
.btnGreen{flex:1;height:54px;background:#00c853;border-radius:28px;color:#ffeb3b;font-weight:900;border:3px solid #111}
.bottomBtns{display:flex;gap:8px}
#prev{background:#fff;margin:8px auto;padding:10px;font-family:monospace;font-size:11px;border:2px dashed #000;max-width:320px;white-space:pre-wrap;text-align:center}
.tabPage{display:none!important}.tabPage.active{display:block!important}
</style></head><body>
<div id='loginPage'><div class='h'><b>C&D LOTTO</b></div><div class='card' style='max-width:360px;margin:40px auto'><input id='ln' style='width:100%;height:44px;border:2px solid #0a4a2e;border-radius:8px;padding:0 8px;margin-bottom:6px' placeholder='Seri'><input id='lp' type='password' style='width:100%;height:44px;border:2px solid #0a4a2e;border-radius:8px;padding:0 8px;margin-bottom:6px' placeholder='Modpas'><button style='width:100%;padding:12px;background:#0a4a2e;color:#d4af37;border-radius:8px;font-weight:800' onclick='doLogin()'>ANTRE</button><div id='loginMsg' style='color:#c62828;text-align:center;margin-top:8px'></div></div></div>

<div id='mainPage' style='display:none;min-height:100vh'>
<div class='h'><button class='menuBtn' onclick="document.getElementById('drawer').classList.toggle('open')">☰</button><b id='topTitle'>Résultats - Logo Super-Admin Sync</b><span id='syncInfo' style='margin-left:auto;font-size:9px;background:#eef2ff;color:#1d4ed8;padding:4px 8px;border-radius:8px'>SYNC</span></div>
<div class='drawer' id='drawer'><button onclick="goTab(0)">🏠 Akèy - Fòma Foto</button><button onclick="goTab(1)">💰 Vendre - GA FL NY Real...</button><button onclick="goTab(2)">📋 Copier - Id Ticket</button><button onclick="goTab(3)">🗂️ Mes fiches - Date</button><button onclick="goTab(4)">📊 Rapport - Du Au Tirage</button><button onclick="goTab(5)">⚙️ Paramètres - Enprimant</button><button onclick="localStorage.clear();location.reload()" style='background:#c62828;color:#fff'>🚪 Dekonekte</button></div>

<div id='tab0' class='tabPage active'><div class='akeyWrap'><div id='lottoCards'></div><div id='msgSuperAdmin' style='padding:10px;font-weight:800;color:#0a4a2e;text-align:center'></div></div></div>

<div id='tab1' class='tabPage'><div class='vannWrap'><div class='pillTiraj' id='pillTiraj' onclick='toggleTiraj()'><span id='tirajTxt'>Tout tiraj yo nan yon sèl kaz (a chwazi) - Tiraj miltip</span></div><div class='tlist' id='tirajList'></div><div id='selectedChips' style='display:flex;flex-wrap:wrap;gap:4px;margin-top:6px'></div><div class='headerRow'><span>Jeux (chwazi)</span><span>Boul</span><span>Mise</span><span>X</span><span>↓</span></div><div id='betsBox'></div><div class='totalBar' id='totalBar'>Total $0 x 0 = $0</div><div class='bottomBtns'><button class='btnBlack' onclick='saveFich()'>VALIDER</button><button class='btnGreen' onclick='printLast()'>IMPRIMER</button></div><div id='prev' style='display:none'></div><div id='lastPreview'></div></div></div>

<div id='tab2' class='tabPage'><div class='card'><h3>Copier</h3><input id='copyId' style='width:100%;height:44px;border:2px solid #0a4a2e;border-radius:8px;padding:0 8px;margin-top:8px' placeholder='Id ticket'><button style='width:100%;padding:12px;background:#0a4a2e;color:#d4af37;border-radius:8px;margin-top:6px;font-weight:800' onclick='copyFich()'>Kopye</button></div></div>
<div id='tab3' class='tabPage'><div class='card'><h3>Mes fiches</h3><input type='date' id='fDate' style='width:100%;height:44px;border:2px solid #0a4a2e;border-radius:8px;padding:0 8px'><button style='width:100%;padding:12px;background:#0a4a2e;color:#d4af37;border-radius:8px;margin-top:6px;font-weight:800' onclick='loadFiches()'>Recherche</button><div id='fList'></div></div></div>
<div id='tab4' class='tabPage'><div class='card'><h3>Rapport</h3><input type='date' id='rDu' style='width:100%;height:44px;border:2px solid #0a4a2e;border-radius:8px;margin-bottom:4px'><input type='date' id='rAu' style='width:100%;height:44px;border:2px solid #0a4a2e;border-radius:8px'><select id='rTiraj' style='width:100%;height:44px;border:2px solid #0a4a2e;border-radius:8px;margin-top:4px'><option value='tous'>Tous tirages</option></select><button style='width:100%;padding:12px;background:#0a4a2e;color:#d4af37;border-radius:8px;margin-top:6px;font-weight:800' onclick='calcRapport()'>Kalkile</button><div id='rapportRes'></div><div id='rapportDetail'></div><div id='printZone' style='display:none;white-space:pre-line;background:#fff;padding:8px;border:1px dashed #000;font-family:monospace;font-size:10px'></div><button id='btnPrint' style='display:none;width:100%;padding:10px;background:#111;color:#fff;border-radius:8px;margin-top:6px' onclick='doPrint()'>Imprimer</button></div></div>
<div id='tab5' class='tabPage'><div class='card'><h3>Paramètres - Enprimant avanse Eskane</h3><button style='width:100%;padding:12px;background:#0a4a2e;color:#d4af37;border-radius:8px' onclick='scanPrinters()'>Eskane aparèy yo</button><div id='scanList' style='margin-top:8px;background:#f8f9fa;padding:8px;border-radius:8px;border:1px dashed #0a4a2e;min-height:50px'></div></div></div>
</div>

<script>
const DB_ROOT="https://cd-lotto-default-rtdb.firebaseio.com";
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucgiNsFO-teYvri4",authDomain:"cd-lotto.firebaseapp.com",databaseURL:DB_ROOT,projectId:"cd-lotto",storageBucket:"cd-lotto.firebasestorage.app",messagingSenderId:"671091732195",appId:"1:671091732195:web:51bcfe8df83bc58fc75fd6"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const HORAIRES_DEF={'GA midi':{h:12,m:15},'FL midi':{h:13,m:15},'NY midi':{h:14,m:15},'Real':{h:12,m:45},'Primera día':{h:11,m:50},'Suerte día':{h:12,m:20},'Lote Dom':{h:13,m:45},'Ganamas':{h:14,m:15},'Suerte noche':{h:17,m:50},'Primera noche':{h:19,m:50},'Loteka':{h:19,m:45},'Nacional noche':{h:20,m:50,dimH:17,m:50},'Leidsa':{h:20,m:45,dimH:15,m:45},'Anguila 10h':{h:9,m:55},'Anguila 18h':{h:17,m:55},'GA soir':{h:18,m:15},'FL soir':{h:21,m:15},'NY soir':{h:22,m:15}};
let DB={vendeurs:{},proprios:{},tickets:{},results:{},limites:{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}},prix:{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,grat:500,l3:500,l4:5000,l5:25000,kom:10}},horaires:{},msgSuper:{}};
let MY_VENDEUR_ID=null,MY_SERIAL=null,MY_PROPRIO_ID=null;let bets=[];let selectedTiraj=[];let lastFichData=null;let TIRAJ_SYNC=[];
function getHaitiDate(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Port-au-Prince'});}function getHaitiDateTime(){return new Date().toLocaleString('fr-HT',{timeZone:'America/Port-au-Prince'});}function getHaitiNow(){let s=new Date().toLocaleString('en-US',{timeZone:'America/Port-au-Prince',hour12:false});return new Date(s);}
function getTirajListSync(){let p=DB.proprios[MY_PROPRIO_ID]||{};let list=p.tirajSuper||p.tiragesActifs||[];if(list&&list.length>0){TIRAJ_SYNC=list;return list;}return Object.keys(HORAIRES_DEF);}
function getHoraires(){return DB.horaires[MY_PROPRIO_ID]||DB.horaires.global||HORAIRES_DEF;}
function isTirajOpen(t){let h=getHoraires()[t]||HORAIRES_DEF[t];if(!h)return true;let n=getHaitiNow();let isDim=n.getDay()===0;let hh=isDim&&(h.dimH!==undefined)?h.dimH:h.h;let mm=isDim&&(h.dimM!==undefined)?h.dimM:h.m;let f=new Date(n);f.setHours(hh,mm,0,0);return n<f;}
function goTab(n){document.querySelectorAll('.tabPage').forEach(p=>p.classList.remove('active'));document.getElementById('tab'+n).classList.add('active');document.getElementById('drawer').classList.remove('open');document.getElementById('topTitle').innerText=['Akèy - Fòma Foto','Vendre - 1 kaz tiraj miltip','Copier','Mes fiches','Rapport','Paramètres'][n];}
function toggleTiraj(){document.getElementById('tirajList').classList.toggle('open');}
function renderTirajList(){let list=getTirajListSync();let tl=document.getElementById('tirajList');let selR=document.getElementById('rTiraj');if(!tl)return;tl.innerHTML=list.map(t=>{let open=isTirajOpen(t);let h=getHoraires()[t]||HORAIRES_DEF[t];let label=h?`${h.h}h${String(h.m).padStart(2,'0')}`:'';return `<div class='topt ${selectedTiraj.includes(t)?'sel':''} ${!open?'ferme':''}' onclick='pickTiraj("${t}")'><b>${t}</b><br><small>${open?label:'FÈMEN'}</small></div>`}).join('');if(selR){let cur=selR.value;selR.innerHTML='<option value="tous">Tous tirages</option>'+list.map(t=>`<option value="${t}">${t}</option>`).join('');selR.value=cur;}}
function pickTiraj(t){if(!isTirajOpen(t))return;if(selectedTiraj.includes(t))selectedTiraj=selectedTiraj.filter(x=>x!==t);else selectedTiraj.push(t);renderSelected();if(selectedTiraj.length>0)document.getElementById('tirajList').classList.remove('open');}
function renderSelected(){let chips=document.getElementById('selectedChips');let txt=document.getElementById('tirajTxt');if(!selectedTiraj.length){txt.innerText=`Tout tiraj yo nan yon sèl kaz (a chwazi) - Tiraj miltip - ${getTirajListSync().length} tiraj`;chips.innerHTML='';}else{txt.innerText=`${selectedTiraj.length} tiraj: ${selectedTiraj.join(', ')}`;chips.innerHTML=selectedTiraj.map(t=>`<span style='background:#0a4a2e;color:#d4af37;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:800'>${t} <b onclick='pickTiraj("${t}")'>X</b></span>`).join('')+`<span onclick='clearTiraj()' style='background:#c62828;color:#fff;padding:4px 8px;border-radius:12px;font-size:10px'>Libere</span>`;}updateTotal();}
function clearTiraj(){selectedTiraj=[];renderSelected();}
function renderBets(){if(!bets.length)bets.push({id:Date.now(),type:'BOLET',numero:'',mise:''});let box=document.getElementById('betsBox');box.innerHTML=bets.map((b,i)=>`<div class="betRow"><div class="oval" style="flex:1.1"><select onchange="bets[${i}].type=this.value"><option value="BOLET" ${b.type==='BOLET'?'selected':''}>BOLET</option><option value="MARYAJ">MARYAJ</option><option value="LOTO3">LOTO3</option><option value="LOTO4">LOTO4</option><option value="LOTO5">LOTO5</option></select></div><div class="oval" style="flex:0.8"><input value="${b.numero}" placeholder="Boul" inputmode="numeric" pattern="[0-9]*" onkeydown="handleKey(event,${i},'num')" oninput="bets[${i}].numero=this.value.replace(/[^0-9]/g,'');updateTotal()"></div><div class="oval" style="flex:0.6"><input value="${b.mise}" placeholder="Miz" inputmode="numeric" pattern="[0-9]*" onkeydown="handleKey(event,${i},'miz')" oninput="bets[${i}].mise=this.value.replace(/[^0-9]/g,'');updateTotal()"></div><div class="circle circleR" onclick="bets.splice(${i},1);renderBets()">X</div><div class="circle circleD" onclick="addRow(${i})">↓</div></div>`).join('');updateTotal();}
function handleKey(e,i,col){if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();if(col==='num'){document.getElementById(`miz_${i}`);document.querySelectorAll('#betsBox.betRow')[i]?.querySelectorAll('input')[1]?.focus();}else{let next=i+1;if(next>=bets.length){addRow(i);return;}setTimeout(()=>document.querySelectorAll('#betsBox.betRow')[next]?.querySelectorAll('input')[0]?.focus(),30);}}if(e.key==='ArrowRight'&&col==='num'){e.preventDefault();document.querySelectorAll('#betsBox.betRow')[i]?.querySelectorAll('input')[1]?.focus();}}
function addRow(i){let lastType=bets[i]?.type||'BOLET';bets.splice(i+1,0,{id:Date.now(),type:lastType,numero:'',mise:''});renderBets();setTimeout(()=>{let rows=document.querySelectorAll('#betsBox.betRow');rows[i+1]?.querySelectorAll('input')[0]?.focus();},30);}
function updateTotal(){let total=bets.reduce((a,b)=>a+(+b.mise||0),0);let tcount=selectedTiraj.length||0;let grand=total*tcount;document.getElementById('totalBar').innerText=`Total $${total} x ${tcount} tiraj = $${grand} - Miz pa otomatik - Vandè mete Miz - Chif sèlman - Flèche → ↓ conserve jeu`;}
function init(){
 db.ref().on('value',snap=>{
  let v=snap.val()||{};DB.vendeurs=v.vendeurs||{};DB.proprios=v.proprios||{};DB.tickets=v.tickets||{};DB.results=v.results||{};DB.limites=v.limites||{global:{bor:1500,mar:100,l3:100,l4:20,l5:5}};DB.prix=v.prix||{global:{p1:50,p2:20,p3:10,m1:1000,m2:1000,m3:1000,grat:500,l3:500,l4:5000,l5:25000,kom:10}};DB.horaires=v.horaires||{};DB.msgSuper=v.msgSuper||{};
  renderTirajList();renderSelected();loadAkeyFoto();document.getElementById('syncInfo').innerText=getHaitiDate()+' '+getHaitiNow().toLocaleTimeString()+' - '+getTirajListSync().length+' TIRAJ';
  document.getElementById('msgSuperAdmin').innerText=DB.msgSuper[MY_PROPRIO_ID]||DB.proprios[MY_PROPRIO_ID]?.msgSuper||'';
 });
 db.ref('proprios/'+MY_PROPRIO_ID).on('value',s=>{let p=s.val()||{};if(p.tirajSuper){TIRAJ_SYNC=p.tirajSuper;renderTirajList();renderSelected();}});
}
function doLogin(){let s=ln.value.trim(),p=lp.value.trim();if(!s||!p){loginMsg.innerText='Antre seri';return;}db.ref('vendeurs').once('value').then(snap=>{let all=snap.val()||{},f=null,fId=null;for(let id in all){if((all[id].serial||'').toLowerCase()===s.toLowerCase()){f=all[id];fId=id;break;}}if(!f||(f.pass||'')!==p){loginMsg.innerText='Pa bon';return;}MY_VENDEUR_ID=fId;MY_SERIAL=f.serial;MY_PROPRIO_ID=f.proprioId;localStorage.setItem('curV',JSON.stringify({id:fId,serial:f.serial,proprioId:f.proprioId}));document.getElementById('loginPage').style.display='none';document.getElementById('mainPage').style.display='block';init();setToday();bets=[];selectedTiraj=[];renderBets();renderSelected();});}
function setToday(){const t=getHaitiDate();if(fDate)fDate.value=t;if(rDu)rDu.value=t;if(rAu)rAu.value=t;}
function loadAkeyFoto(){
 let results=Object.values(DB.results).sort((a,b)=>(b.dat||'').localeCompare(a.dat||''));
 let baseCards=[
  {key:'new york',name:'NEW YORK',logo:'https://i.imgur.com/3QJ3H7E.png',fallbackUrl:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/New_York_Lottery_logo.svg/500px-New_York_Lottery_logo.svg.png',labelSoir:'Aujourd\'hui Soir',labelMidi:'Aujourd\'hui Midi',fallback:'NY'},
  {key:'florida',name:'FLORIDA',logo:'https://i.imgur.com/8Km9tLL.png',fallbackUrl:'https://upload.wikimedia.org/wikipedia/en/thumb/f4/Florida_Lottery_logo.svg/500px-Florida_Lottery_logo.svg.png',labelSoir:'Aujourd\'hui Soir',labelMidi:'Aujourd\'hui Midi',fallback:'FL'},
  {key:'georgia',name:'GEORGIA',logo:'https://i.imgur.com/5L8K9pB.png',fallbackUrl:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Georgia_Lottery_logo.svg/500px-Georgia_Lottery_logo.svg.png',labelSoir:'Aujourd\'hui Soir',labelMidi:'Aujourd\'hui Matin',fallback:'GA'}
 ];
 let html='';
 baseCards.forEach(b=>{
  let soir=results.filter(r=>r.tirage.toLowerCase().includes(b.key)&&r.tirage.toLowerCase().includes('soir'))[0]||results.filter(r=>r.tirage.toLowerCase().includes(b.key))[0];
  let midi=results.filter(r=>r.tirage.toLowerCase().includes(b.key)&&r.tirage.toLowerCase().includes('midi'))[0]||results.filter(r=>r.tirage.toLowerCase().includes(b.key)&&r.tirage.toLowerCase().includes('matin'))[0];
  let l3S=soir?(soir.l3||'000').padStart(3,'0'):'015';
  let r1S=soir?(soir.r1||'00').padStart(2,'0'):'84';
  let r2S=soir?(soir.r2||'00').padStart(2,'0'):'23';
  let l3M=midi?(midi.l3||'000').padStart(3,'0'):'097';
  let r1M=midi?(midi.r1||'00').padStart(2,'0'):'14';
  let r2M=midi?(midi.r2||'00').padStart(2,'0'):'60';
  // logos selon foto: NY blue cercle, FL flamingo, GA peche
  let logoImg='';
  if(b.key==='new york'){logoImg=`<img src="https://i.postimg.cc/6qYv1S0L/ny.png" onerror="this.src='${b.fallbackUrl}'" alt="NY">`;}
  else if(b.key==='florida'){logoImg=`<img src="https://i.postimg.cc/8z7JvZ7F/fl.png" onerror="this.src='${b.fallbackUrl}'" alt="FL">`;}
  else {logoImg=`<img src="https://i.postimg.cc/0bq9r4y5/ga.png" onerror="this.src='${b.fallbackUrl}'" alt="GA">`;}
  html+=`<div class="lottoCard">
    <div class="lottoLogo">${logoImg}</div>
    <div class="lottoRight">
      <h4>${b.labelSoir}</h4>
      <div class="pillsRow"><span class="pill pillBlue">${l3S}</span><span class="pill pillOrange">${r1S}</span><span class="pill pillLightBlue">${r2S}</span></div>
      <h4>${b.key==='georgia'?b.labelMidi:'Aujourd\'hui Midi'}</h4>
      <div class="pillsRow"><span class="pill pillBlue">${l3M}</span><span class="pill pillOrange">${r1M}</span><span class="pill pillLightBlue">${r2M}</span></div>
    </div>
  </div>`;
 });
 document.getElementById('lottoCards').innerHTML=html||'<div class="card">Pa gen rezilta</div>';
}
function saveFich(){if(!selectedTiraj.length){alert('Chwazi tiraj');return;}if(!bets.length||bets.every(b=>!b.numero||!b.mise)){alert('Mete Boul ak Miz - Miz pa otomatik');return;}let total=bets.reduce((a,b)=>a+(+b.mise||0),0);let id='f_'+Date.now();let data={id,serial:MY_SERIAL,vendeurId:MY_VENDEUR_ID,proprioId:MY_PROPRIO_ID,tirage:selectedTiraj[0],tirages:selectedTiraj,bets:bets.filter(b=>b.numero&&b.mise).map(b=>({type:b.type.toLowerCase(),numero:String(b.numero).padStart(b.type==='LOTO3'?3:b.type==='LOTO5'?5:2,'0'),mise:+b.mise})),total,grandTotal:total*selectedTiraj.length,dat:getHaitiDate(),date:getHaitiDateTime(),heure:getHaitiNow().toLocaleTimeString(),paye:false};db.ref('tickets/'+id).set(data).then(()=>{lastFichData=data;selectedTiraj=[];bets=[];renderSelected();renderBets();lastPreview.innerHTML=`<div class="card"><b>${id} $${data.grandTotal}</b><br><button style='width:100%;padding:10px;background:#00c853;color:#fff;border-radius:20px;margin-top:6px' onclick='printLast()'>IMPRIMER - Santre gran lèt ti woulo</button></div>`;});}
function printLast(){if(!lastFichData)return;let t=lastFichData;let p=DB.proprios[MY_PROPRIO_ID]||{nom:'C&D VÉRITÉ LOTTO'};let logo=DB.proprios[MY_PROPRIO_ID]?.logo||'';let txt=`\n${p.nom}\n--------------------------\nDat: ${t.dat} ${t.heure}\nVandè: ${MY_SERIAL}\nTiraj: ${(t.tirages||[t.tirage]).join(', ')}\nId: ${t.id}\n--------------------------\nJeux Boul Mise\n--------------------------\n`;t.bets.forEach(b=>{txt+=`${b.type.toUpperCase().padEnd(6,' ')} ${b.numero.padEnd(6,' ')} $${b.mise}\n`;});txt+=`--------------------------\nTotal $${t.total} x ${t.tirages.length} = $${t.grandTotal}\nMèsi\n`;let prev=document.getElementById('prev');prev.innerHTML=`<div style="text-align:center;font-size:16px">${logo?`<img src="${logo}" style="width:90px;height:90px;object-fit:contain;margin:0 auto;display:block"><br>`:''}<b style="font-size:18px">${p.nom}</b><br>Dat: ${t.dat} ${t.heure}<br>Vandè: ${MY_SERIAL}<br>Tiraj: ${(t.tirages||[t.tirage]).join(', ')}<br>Id: ${t.id}</div><div style="border-top:2px dashed #000;margin:8px 0"></div><div style="display:flex;justify-content:space-between;font-weight:900"><span>Jeux</span><span>Boul</span><span>Mise</span></div>${t.bets.map(b=>`<div style="display:flex;justify-content:space-between;font-size:16px"><span>${b.type.toUpperCase()}</span><span>${b.numero}</span><span>$${b.mise}</span></div>`).join('')}<div style="border-top:2px dashed #000;margin:8px 0"></div><div style="text-align:center;font-weight:800">Total $${t.total} x ${t.tirages.length} = $${t.grandTotal}</div>`;prev.style.display='block';window.open('rawbt:base64,'+btoa(unescape(encodeURIComponent(txt))));}
function printFich(id){db.ref('tickets/'+id).once('value').then(s=>{let t=s.val();if(!t)return;lastFichData=t;printLast();});}
function copyFich(){let id=copyId.value.trim();if(!id)return;db.ref('tickets/'+id).once('value').then(s=>{let t=s.val();if(!t)return;bets=t.bets.map(b=>({type:(b.type||'BOLET').toUpperCase(),numero:b.numero,mise:''}));selectedTiraj=t.tirages||[t.tirage];renderSelected();renderBets();goTab(1);});}
function loadFiches(){let d=getHaitiDate();if(fDate.value)d=fDate.value;let arr=Object.values(DB.tickets).filter(t=>t.serial===MY_SERIAL&&t.dat===d);fList.innerHTML=arr.map(t=>`<div class="card"><b>${t.id}</b> ${t.dat} $${t.grandTotal||t.total} ${(t.tirages||[t.tirage]).join(', ')}<br><button onclick="printFich('${t.id}')" style="background:#111;color:#fff;border:0;padding:6px 10px;border-radius:6px;margin-top:4px">Enprime</button></div>`).join('')||`Pa gen fich`;}
function calcRapport(){let du=rDu.value,au=rAu.value;if(!du||!au)return;let fT=rTiraj.value;let tickets=Object.values(DB.tickets).filter(t=>t.serial===MY_SERIAL&&t.dat>=du&&t.dat<=au&&(fT==='tous'||(t.tirages||[]).includes(fT)));let vente=0;tickets.forEach(t=>vente+=t.grandTotal||t.total||0);rapportRes.innerHTML=`Vente $${vente} - ${tickets.length} fich - Balance net`;printZone.innerText=`Du ${du} Au ${au} Vente $${vente}`;printZone.style.display='block';btnPrint.style.display='block';}
function doPrint(){let w=window.open('','_blank');w.document.write('<pre>'+printZone.innerText+'</pre>');w.print();}
function scanPrinters(){scanList.innerHTML=`<div style="background:#e8f5e9;padding:8px;border-radius:8px;border:2px solid #0a4a2e"><b>V2 Pro - Fòma Foto Akèy</b><br>Vandè: ${MY_SERIAL}<br>Tiraj: ${getTirajListSync().length} - 1 kaz miltip<br>Miz pa otomatik<br>Onglè nan menu sèlman<br>${getHaitiDate()}</div>`;}
(function(){let cur=localStorage.getItem('curV');if(cur){try{let c=JSON.parse(cur);MY_VENDEUR_ID=c.id;MY_SERIAL=c.serial;MY_PROPRIO_ID=c.proprioId;document.getElementById('loginPage').style.display='none';document.getElementById('mainPage').style.display='block';init();setToday();bets=[];selectedTiraj=[];renderBets();renderSelected();}catch(e){localStorage.removeItem('curV');init();}}else{init();}})();
</script></body></html>
