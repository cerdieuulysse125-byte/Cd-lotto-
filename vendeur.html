<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f0f2f5}
.h{padding:12px;text-align:center;background:#6a0dad;color:#fff;font-weight:bold;position:sticky;top:0;z-index:10}
.card{background:#fff;margin:10px;padding:12px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.tabs{display:flex;background:#fff;position:sticky;top:48px;z-index:9}
.tab{flex:1;padding:10px;text-align:center;border-bottom:3px solid transparent;cursor:pointer}
.tab.active{border-color:#6a0dad;color:#6a0dad;font-weight:bold}
.ong{display:none}.ong.active{display:block}
input,select,button{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #ccc}
button{background:#6a0dad;color:#fff;font-weight:bold;border:none}
.tiraj{display:flex;flex-wrap:wrap;gap:6px}.tiraj label{background:#eee;padding:6px 10px;border-radius:20px}
#fermeOverlay{position:fixed;inset:0;background:rgba(0,0,0,.85);color:#fff;display:none;align-items:center;justify-content:center;z-index:9999;text-align:center;font-size:22px;font-weight:bold}
.flech{position:fixed;right:15px;bottom:20px;background:#6a0dad;color:#fff;width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:20}
</style></head><body>
<div id="fermeOverlay"><div>⛔ FÈME OTOMATIK<br><span id="msgFerme"></span></div></div>
<div class="h">V115.7 - COPIER KORIJE + RAPPORT TIRAJ + FERME AUTO + LIMIT + FLECH</div>
<div class="tabs">
<div class="tab active" onclick="go(0)">1.Vendre</div>
<div class="tab" onclick="go(1)">2.Liste</div>
<div class="tab" onclick="go(2)">3.Rapport</div>
<div class="tab" onclick="go(3)">4.Copier</div>
</div>

<!-- 1 VENDRE -->
<div class="ong active" id="o0"><div class="card">
<input id="boule" placeholder="Boul ex: 08 ou 19x08">
<input id="miz" type="number" placeholder="Miz">
<div class="tiraj" id="boxTiraj"></div>
<div id="limitInfo" style="font-size:12px;color:red"></div>
<button onclick="vann()">VANN</button>
<div id="ticket"></div>
</div></div>

<!-- 2 LISTE -->
<div class="ong" id="o1"><div class="card"><div id="liste">Chaje...</div></div></div>

<!-- 3 RAPPORT DETAYE PA TIRAJ + MARYAJ DEZOD -->
<div class="ong" id="o2"><div class="card">
<input type="date" id="du"><input type="date" id="au">
<select id="fTiraj"><option value="tous">TOUS TIRAJ</option><option>8h</option><option>10h</option><option>12h</option><option>2h</option><option>4h</option><option>5h</option></select>
<button onclick="rap()">Générer Rapport KORIJÈ</button>
<div id="zoneRap"></div>
</div></div>

<!-- 4 COPIER 100% KORIJE -->
<div class="ong" id="o3"><div class="card">
<h3>COPIER - Tape 5 lèt sou tikè a (ex: X7K9P)</h3>
<input id="codeKopi" placeholder="Ex: X7K9P" maxlength="5" style="text-transform:uppercase;font-size:20px;letter-spacing:3px;text-align:center">
<button onclick="chacheKopi()">🔍 CHACHE FICH LA</button>
<div id="resKopi" style="margin-top:10px"></div>
</div></div>

<div class="flech" onclick="window.scrollTo({top:0,behavior:'smooth'})">⬆</div>

<script>
const firebaseConfig={apiKey:"AIzaSy...",authDomain:"...",projectId:"..."};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let fiches=[], resultats={}, LIMIT_GLOBAL=5000, LIMIT_PAR_BOUL={};

function go(i){document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k==i));document.querySelectorAll('.ong').forEach((o,k)=>o.classList.toggle('active',k==i));}

// --- FERME OTOMATIK ---
const HEURE_FERME={ "12h":15, "13h":15, "14h":15, "18h":15, "21h":15, "22h":15 };
function checkFerme(){
 let h=new Date().getHours();
 let html=""; let ferme=false;
 for(let t in HEURE_FERME){ if(h>=HEURE_FERME[t]){ html+=`<label style="opacity:.4"><input type="checkbox" disabled> ${t} FÈME</label>`; } else { html+=`<label><input type="checkbox" value="${t}"> <span>${t}</span></label>`; } }
 document.getElementById('boxTiraj').innerHTML=html;
}
setInterval(checkFerme,60000); checkFerme();

// --- MARYAJ DEZOD: 0819 = 19x08 = 08x19 ---
function separe(txt){
 if(!txt) return null; let t=txt.toString().toLowerCase().replace(/×/g,'x').trim();
 let p=null; if(t.includes('x')) p=t.split('x'); else if(t.includes('-')) p=t.split('-'); else if(t.length>=4) p=[t.slice(0,2),t.slice(2,4)]; else return null;
 if(!p||p.length<2) return null;
 let a=p[0].replace(/\D/g,'').padStart(2,'0').slice(-2), b=p[1].replace(/\D/g,'').padStart(2,'0').slice(-2);
 return [a,b];
}
function maryajGagne(bet,res){ let B=separe(bet), R=separe(res); if(!B||!R) return false; return (B[0]==R[0]&&B[1]==R[1])||(B[0]==R[1]&&B[1]==R[0]); }

// --- RAPPORT PA TIRAJ KORIJE ---
function rap(){
 let du=document.getElementById('du').value, au=document.getElementById('au').value||du, fT=document.getElementById('fTiraj').value;
 let vPar={},pPar={},comPar={}; let vTot=0,pTot=0;
 fiches.forEach(fd=>{
  if(du&&fd.date<du) return; if(au&&fd.date>au) return;
  let miz=parseFloat(fd.miz)||0; if(miz<=0) return;
  (fd.tirajs||[]).forEach(tir=>{
   if(fT!=="tous"&&tir!==fT) return;
   if(!vPar[tir]){vPar[tir]=0;pPar[tir]=0;comPar[tir]=0;}
   vPar[tir]+=miz; vTot+=miz;
   let re=resultats[fd.date]&&resultats[fd.date][tir]; let pey=0; let b=(fd.boule||"").trim();
   if(re){
    if(b==re.p1) pey=miz*50; else if(b==re.p2) pey=miz*20; else if(b==re.p3) pey=miz*10;
    else if(maryajGagne(b,re.M1)||maryajGagne(b,re.M2)||maryajGagne(b,re.M3)) pey=miz*500;
   }
   if(pey>0){pPar[tir]+=pey; pTot+=pey;}
  });
 });
 let h=`<div style="margin-top:10px">`;
 for(let tir in vPar){ h+=`<div style="border:1px solid #ddd;padding:8px;margin:6px 0;border-radius:8px"><b>${tir}</b><br>Vente:${vPar[tir]} | Peye:<span style="color:red">${pPar[tir]||0}</span> | Gain:<b style="color:green">${vPar[tir]-(pPar[tir]||0)}</b></div>`; }
 h+=`<hr><b>TOTAL Vente:${vTot} Peye:${pTot} Gain:${vTot-pTot}</b></div>`;
 document.getElementById('zoneRap').innerHTML=h;
}

// --- COPIER KORIJE 100% ---
function chacheKopi(){
 let code=document.getElementById('codeKopi').value.trim().toUpperCase();
 if(code.length<5) return alert("Tape 5 lèt yo");
 let f=fiches.find(x=> (x.code||"").toUpperCase()==code );
 if(!f){ document.getElementById('resKopi').innerHTML=`<span style="color:red">❌ Fich ${code} pa jwenn menm si se yè</span>`; return; }
 let re=resultats[f.date]&&resultats[f.date][f.tirajs[0]]; let gain=0;
 if(re){
  if(f.boule==re.p1) gain=f.miz*50; else if(f.boule==re.p2) gain=f.miz*20; else if(f.boule==re.p3) gain=f.miz*10;
  else if(maryajGagne(f.boule,re.M1)||maryajGagne(f.boule,re.M2)||maryajGagne(f.boule,re.M3)) gain=f.miz*500;
 }
 document.getElementById('resKopi').innerHTML=`
  <div style="border:2px dashed #6a0dad;padding:10px;border-radius:10px">
  <b>Fich: ${f.code}</b><br>Date:${f.date} Tiraj:${f.tirajs}<br>Boul:${f.boule} Miz:${f.miz}<br><b style="color:green">GAIN: ${gain} Gdes</b><br><br>
  <button onclick="reimprime('${f.code}')">🖨️ Re-imprime</button>
  <button onclick="kopiNanVendre('${f.code}')" style="background:#28a745">📋 Kopi nan Vendre</button>
  </div>`;
}
function reimprime(code){ let f=fiches.find(x=>x.code==code); if(!f) return; let w=window.open('','_blank'); w.document.write(`<pre>*** TIKÈ KOPI ***\nCode:${f.code}\nDate:${f.date}\nTiraj:${f.tirajs}\nBoul:${f.boule}\nMiz:${f.miz}\n</pre>`); w.print(); }
function kopiNanVendre(code){ let f=fiches.find(x=>x.code==code); if(!f) return; go(0); document.getElementById('boule').value=f.boule; document.getElementById('miz').value=f.miz; alert("Fich la chaje nan 1.Vendre pou vann ankò!"); }

function vann(){ alert("Fonksyon vann ou deja genyen an rete menm jan - pa efase li"); }
</script></body></html>
