<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C&D LOTTO - V13.1 VALIDER FIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:monospace;padding:10px}
.header{background:#00ff00;color:#000;padding:12px;text-align:center;font-weight:bold;border-radius:8px;font-size:13px}
.info{border:1px solid #0f0;padding:10px;margin-top:12px;border-radius:8px;font-size:12px}
button{width:100%;padding:18px;margin-top:10px;border:none;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;display:block}
.btn-test{background:#0099ff;color:#fff}
.btn-print{background:#ff9900;color:#000;border:3px solid #fff}
.btn-small{background:#222;color:#0f0;padding:10px;font-size:13px}
input{width:100%;padding:14px;margin-top:8px;background:#111;color:#0f0;border:1px solid #0f0;border-radius:8px;font-size:16px}
.log{background:#111;color:#0f0;padding:8px;margin-top:10px;border-radius:8px;font-size:10px;height:90px;overflow:auto;border:1px solid #333;white-space:pre-wrap}
</style>
</head>
<body>

<div class="header" id="printerState">SUNMI V2 PRO POS-V2 - KONEKTE DIRÈK - 58mm 100%</div>

<div class="info" id="printerInfo">
Ticket Format:58mm<br>
Current Print Density:100%<br>
SN:POS-V2 - Print Service 4.13.4<br>
Status: <span style="color:#0f0">PARE - VALIDER AKTIF</span>
</div>

<input type="text" id="bolet" placeholder="BOLET" value="02 15 28">
<input type="text" id="loto" placeholder="LOTO" value="45 67">
<input type="text" id="maryaj" placeholder="MARYAJ" value="02x15">
<input type="number" id="montant" placeholder="MONTAN $" value="2">

<button type="button" class="btn-test" id="btnTest">1 - Print Test - DIRECT 58mm</button>
<button type="button" class="btn-print" id="btnValider">2 - VALIDER + ENPRIME PAPYE - KLIKE LA</button>
<button type="button" class="btn-small" id="btnSample">TEST FICH SAMPLE</button>

<div class="log" id="log">LOG: V13.1 - Bouton VALIDER FIX - Pare...
</div>

<script>
var logEl = document.getElementById('log');
function log(msg){
  logEl.innerHTML += new Date().toLocaleTimeString() + ' ' + msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}

// FONKSYON ENPRIME DIRÈK - KORIJE - PA BLOKE
function printDirectSunmi(textBrut){
  var ESC = String.fromCharCode(27);
  var GS = String.fromCharCode(29);
  var cmd = ESC + '@' + ESC + '!' + String.fromCharCode(0) + ESC + 'a' + String.fromCharCode(0);
  cmd += textBrut + '\n\n\n' + GS + 'V' + String.fromCharCode(66) + String.fromCharCode(0);
  
  log('>>> AP ENPRIME: ' + textBrut.substring(0,30));
  
  try{
    // 1. Sunmi natif
    if(window.SunmiPrinter && typeof window.SunmiPrinter.printText === 'function'){
      window.SunmiPrinter.printText(textBrut);
      window.SunmiPrinter.lineWrap(3);
      try{ window.SunmiPrinter.cutPaper(); }catch(e){}
      log('OK SUNMI NATIF - Papye soti');
      return;
    }
    // 2. RawBT direct - SA KI PI ENPOTAN - Pa bezwen SunmiPrinter
    var data = encodeURIComponent(cmd);
    var url = 'rawbt://esc?data=' + data + '&width=384';
    log('RAWBT DIRECT: rawbt://esc?width=384');
    window.location.href = url;
    // 3. Fallback apre 1 sec si rawbt pa mache - itilize intent
    setTimeout(function(){
      log('Fallback intent Sunmi...');
      var intentUrl = 'intent://print?data=' + data + '#Intent;package=woyou.aipos.print;action=woyou.aipos.print;end';
      // Pa fè 2 fwa - kite rawbt mache
    }, 1000);
  }catch(e){
    log('ERÈ: ' + e.message);
    // Menm si erè - eseye rawbt kanmenm
    try{
      window.location.href = 'rawbt://print?data=' + encodeURIComponent(textBrut);
    }catch(e2){
      log('Erè rawbt: ' + e2.message);
    }
  }
}

function printTestDirect(){
  log('BOUTON TEST KLIKE');
  var txt = 'Ticket Format:58mm\nCurrent Print Density:100%\nSN:POS-V2\n----------------\nTEST DIRECT V13.1 OK\n58mm 384 dots 100%\nC&D LOTTO\n' + new Date().toLocaleString() + '\n----------------';
  printDirectSunmi(txt);
}

function printFichSample(){
  log('BOUTON SAMPLE KLIKE');
  var txt = 'C & D LOTTO\n------------------------\nBOLET: 02 15 28\nLOTO: 45 67\nMARYAJ: 02x15\nDeja:$2 Max:$1500\n------------------------\nBAL PA VANDE PA TIRAJ\n' + new Date().toLocaleString();
  printDirectSunmi(txt);
}

function validerEtImprimer(){
  log('>>> BOUTON VALIDER KLIKE - ANTRE OK');
  var bolet = document.getElementById('bolet').value || '02 15 28';
  var loto = document.getElementById('loto').value || '45 67';
  var maryaj = document.getElementById('maryaj').value || '02x15';
  var montant = document.getElementById('montant').value || '2';
  
  if(!bolet && !loto && !maryaj){
    alert('Mete BOLET oswa LOTO');
    log('VALIDE - Pa gen boul - Antre boul');
    return;
  }
  
  var fich = 'C & D LOTTO\n------------------------\nBOLET: ' + bolet + '\nLOTO: ' + loto + '\nMARYAJ: ' + maryaj + '\nMONTAN: $' + montant + '\n------------------------\nBAL PA VANDE PA TIRAJ\n' + new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString() + '\n------------------------\nPOS-V2 58mm 100% DIRECT';
  
  log('FICH VALIDE - ' + bolet + ' - AP ENPRIME');
  printDirectSunmi(fich);
  log('VALIDER OK - Papye dwe soti');
}

// FIX BOUTON - Ajoute event listener - Pa inline sèlman
document.addEventListener('DOMContentLoaded', function(){
  log('DOM Ready - Bouton aktif');
  document.getElementById('btnTest').addEventListener('click', printTestDirect);
  document.getElementById('btnValider').addEventListener('click', validerEtImprimer);
  document.getElementById('btnSample').addEventListener('click', printFichSample);
  
  // Test si bouton mache
  document.getElementById('btnValider').style.background = '#ff9900';
  log('BOUTON VALIDER AKTIF - KLIKE Kounya');
});

// Backup - si DOM deja ready
if(document.readyState !== 'loading'){
  document.getElementById('btnTest').onclick = printTestDirect;
  document.getElementById('btnValider').onclick = validerEtImprimer;
  document.getElementById('btnSample').onclick = printFichSample;
  log('Backup onclick OK');
}
</script>
</body>
</html>
