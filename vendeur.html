<!DOCTYPE html><html lang='ht'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>VANDEUR</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f5f5f5}.h{background:#0d47a1;color:#fff;padding:10px;display:flex;justify-content:space-between}.tabs{display:flex;background:#fff;border-bottom:2px solid #ddd;overflow-x:auto;position:sticky;top:0;z-index:9}.tab{padding:11px 10px;font-weight:700;color:#555;border-bottom:3px solid transparent;white-space:nowrap;font-size:11px;cursor:pointer}.tab.active{color:#0d47a1;border-bottom-color:#0d47a1;background:#e3f2fd}.panel{display:none;padding:8px;max-width:600px;margin:auto}.panel.active{display:block}.card{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:8px}input,select{padding:10px;border:1px solid #ccc;border-radius:6px;width:100%;margin:4px 0;font-size:16px}label{font-weight:700;font-size:11px}.btn{padding:12px;border:0;border-radius:10px;color:#fff;font-weight:700;cursor:pointer;margin-top:8px;width:100%}.btn-blue{background:#0d47a1}.btn-green{background:#2e7d32}.btn-red{background:#c62828}.row{display:flex;gap:4px;margin-bottom:6px;background:#f8f9fa;padding:6px;border-radius:6px;align-items:center}.row input{margin:0}.row select{width:75px;margin:0}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.k{padding:15px;text-align:center;background:#fff;border:1px solid #ddd;border-radius:8px;font-size:20px;font-weight:700}.k:active{background:#0d47a1;color:#fff}.ar{display:flex;gap:6px;margin-top:6px}.ar div{flex:1;padding:10px;background:#0d47a1;color:#fff;border-radius:6px;text-align:center;font-weight:700}@media print{@page{size:58mm auto;margin:0}body{margin:0}.h,.tabs,.no-print{display:none!important}#printArea{display:block!important;width:58mm;margin:0 auto;text-align:center}#ticket{width:56mm;margin:0 auto;font-family:monospace;font-size:12px;color:#000;text-align:center}}</style></head><body>
<div class='h'><div><b id='vNom'>VANDEUR</b><br><small id='vSer'></small></div><button onclick='localStorage.removeItem("curV");location.reload()' style='padding:6px 10px;background:#c62828;color:#fff;border:0;border-radius:6px'>Soti</button></div>
<div id='login' class='panel active' style='max-width:380px;margin-top:30px'><div class='card'><h3>🔐 Vandè</h3><input id='ln' placeholder='Non'><input id='lp' type='password' placeholder='Modpas'><button class='btn btn-blue' onclick='login()'>Konekte</button></div></div>
<div id='main' style='display:none'>
<div class='tabs'><div class='tab active' onclick="op(event,'vann')">Vann tikè</div><div class='tab' onclick="op(event,'kopye')">Kopye tikè</div><div class='tab' onclick="op(event,'fich')">Fich Mwen</div><div class='tab' onclick="op(event,'rapo')">Rapò</div><div class='tab' onclick="op(event,'param')">⚙️ Paramèt</div></div>
<div id='vann' class='panel active'>
<div class='card'><label>TIRAJ</label><select id='tir'><option>GA midi</option><option>FL midi</option><option>NY midi</option><option>GA soir</option><option>FL soir</option><option>NY soir</option><option>Real</option><option>Primera día</option><option>Suerte día</option><option>Lote Dom</option><option>Ganamas</option><option>Suerte noche</option><option>Primera noche</option><option>Loteka</option><option>Nacional noche</option><option>Leidsa</option><option>Anguila 10h</option><option>Anguila 18h</option></select></div>
<div class='card'><div style='display:flex;justify-content:space-between'><h4>Boul - Chif sèlman</h4><button onclick='bets=[];add();' style='background:#c62828;color:#fff;border:0;padding:4px 8px;border-radius:4px'>Efase</button></div><div id='list'></div><button class='btn btn-blue' onclick='add()'>+ Ajoute Liy (kenbe jwèt)</button><div class='ar no-print'><div onclick='mv(1)'>➡️ Dwat</div><div onclick='next()'>⬇️ Anba</div><div onclick='mv(-1)'>⬅️ Goch</div></div><div class='keys no-print'><div class='k' onclick='press("1")'>1</div><div class='k' onclick='press("2")'>2</div><div class='k' onclick='press("3")'>3</div><div class='k' onclick='press("4")'>4</div><div class='k' onclick='press("5")'>5</div><div class='k' onclick='press("6")'>6</div><div class='k' onclick='press("7")'>7</div><div class='k' onclick='press("8")'>8</div><div class='k' onclick='press("9")'>9</div><div class='k' onclick='press("C")' style='background:#ffe0b2'>C</div><div class='k' onclick='press("0")'>0</div><div class='k' onclick='next()' style='background:#2e7d32;color:#fff'>OK</div></div><div style='background:#0e7a3c;color:#fff;padding:14px;border-radius:12px;text-align:center;margin-top:10px;font-weight:700;font-size:18px;border:2px solid #000'>Total <span id='totCalc'>0 × 1 = 0</span> HTG</div><button class='btn' style='background:#000;color:#fff;border:2px solid #000;padding:16px;font-size:18px' onclick='imprimerMitan()'>🖨️ IMPRIMER - MITAN PAJ GWO LÈT</button><button class='btn' style='background:#1e88e5;color:#fff;border:2px solid #000;padding:16px;font-size:15px' onclick='rawbt()'>⚡ PRINT DIRÈK V2 PRO 58mm (RawBT)</button></div>
</div>
<div id='kopye' class='panel'><div class='card'><h3>Kopye Tikè</h3><input id='copyId' type='number' inputmode='numeric' placeholder='ID'><button class='btn btn-blue' onclick='doCopy()'>Kopye</button><div id='copyRes'></div></div></div>
<div id='fich' class='panel'><div class='card'><h3>Fich Mwen</h3><input type='date' id='fd'><button class='btn btn-blue' onclick='fich()'>Filtre</button><div id='flist'></div></div></div>
<div id='rapo' class='panel'><div class='card'><h3>Rapò</h3><div style='display:flex;gap:6px'><input type='date' id='rf'><input type='date' id='rt'></div><button class='btn btn-blue' onclick='rapo()'>Kalkile</button><div id='rres'></div></div></div>
<div id='param' class='panel'><div class='card'><h3>🖨️ Enprimant - Chache Tout</h3><button class='btn btn-blue' onclick='searchP()'>🔍 Chache Enprimant</button><div id='plist' style='border:1px solid #ddd;border-radius:6px;padding:6px;margin-top:6px;font-size:12px'>Pa gen</div><input id='selP' readonly placeholder='Enprimant chwazi' style='margin-top:6px'><select id='pw'><option value='58'>58mm - Santre</option><option value='80'>80mm</option><option value='A4'>A4</option></select><button class='btn btn-green' onclick='saveP()'>Save Enprimant</button><button class='btn btn-blue' onclick='test()'>Teste Mitan Paj</button></div></div>
</div>
<div id='printArea' style='display:none'><div id='ticket'></div></div>
<script>
var DB;try{DB=JSON.parse(localStorage.getItem('cd-lotto-db')||'null')}catch(e){DB=null}
if(!DB)DB={proprios:[],vendeurs:[],results:[],tickets:[],headers:{},logos:{},blockedBouls:{},blockedJeux:{},printers:{}};
function save(){localStorage.setItem('cd-lotto-db',JSON.stringify(DB))}
function op(e,id){var t=document.querySelectorAll('.tab');for(var i=0;i<t.length;i++)t[i].classList.remove('active');var p=document.querySelectorAll('.panel');for(var j=0;j<p.length;j++)p[j].classList.remove('active');e.target.classList.add('active');document.getElementById(id).classList.add('active')}
var CUR=null;var bets=[];var curGame='borlette';var foc=0;
fd.valueAsDate=new Date();rf.valueAsDate=new Date();rt.valueAsDate=new Date();
function login(){var n=ln.value.trim();var p=lp.value.trim();var v=null;for(var i=0;i<DB.vendeurs.length;i++)if(DB.vendeurs[i].nom.toLowerCase()==n.toLowerCase()&&DB.vendeurs[i].pass==p)v=DB.vendeurs[i];if(!v){alert('Pa bon');return}CUR=v;localStorage.setItem('curV',JSON.stringify(v));login.style.display='none';main.style.display='block';vNom.innerText=v.nom;vSer.innerText=v.serial;add();fich();}
function add(){if(bets.length>0)curGame=bets[bets.length-1].type;bets.push({type:curGame,num:'',mise:''});render();focus(bets.length-1,'num')}
function render(){var h='';for(var i=0;i<bets.length;i++){var b=bets[i];h+='<div class="row"><select id="g'+i+'" onchange="bets['+i+'].type=this.value;curGame=this.value;calc()" style="width:75px"><option value="borlette" '+(b.type=='borlette'?'selected':'')+'>BORL</option><option value="mariage" '+(b.type=='mariage'?'selected':'')+'>MAR</option><option value="loto3" '+(b.type=='loto3'?'selected':'')+'>L3</option><option value="loto4" '+(b.type=='loto4'?'selected':'')+'>L4</option><option value="loto5" '+(b.type=='loto5'?'selected':'')+'>L5</option></select><input id="num'+i+'" value="'+b.num+'" placeholder="Boul" inputmode="numeric" oninput="bets['+i+'].num=this.value.replace(/[^0-9-]/g,'');calc()" onfocus="foc='+i+';this.select()" onkeydown="arrow(event,'+i+',0)"><input id="mise'+i+'" value="'+b.mise+'" placeholder="$" inputmode="numeric" style="width:70px" oninput="bets['+i+'].mise=this.value.replace(/[^0-9]/g,'');calc()" onfocus="foc='+i+'" onkeydown="arrow(event,'+i+',1)"><button onclick="bets.splice('+i+',1);render()" style="background:#c62828;color:#fff;border:0;padding:6px 8px;border-radius:4px">X</button></div>'}list.innerHTML=h;calc()}
function focus(i,f){setTimeout(function(){var e=document.getElementById((f=='num'?'num':'mise')+i);if(e){e.focus();e.select();foc=i}},80)}
function mv(d){var el=document.activeElement;var isMise=el.id.indexOf('mise')>=0;var pos=foc*2+(isMise?1:0)+d;if(pos<0)pos=0;if(pos>=bets.length*2)pos=bets.length*2-1;var ni=Math.floor(pos/2);var nf=pos%2==0?'num':'mise';focus(ni,nf)}
function next(){if(foc<bets.length-1)focus(foc+1,'num');else add()}
function arrow(e,i,f){if(e.key=='ArrowRight'){e.preventDefault();if(f==0)focus(i,'mise');else if(i<bets.length-1)focus(i+1,'num');else add()}if(e.key=='ArrowLeft'){e.preventDefault();if(f==1)focus(i,'num');else if(i>0)focus(i-1,'mise')}if(e.key=='ArrowDown'||e.key=='Enter'){e.preventDefault();next()}if(e.key=='ArrowUp'){e.preventDefault();if(i>0)focus(i-1,f==0?'num':'mise')}}
function press(k){var el=document.activeElement;if(!el||el.id.indexOf('num')<0&&el.id.indexOf('mise')<0){if(bets.length>0)el=document.getElementById('num'+(bets.length-1));else return}if(k=='C'){el.value='';var id=el.id;var idx=parseInt(id.replace(/[^0-9]/g,''));if(id.indexOf('num')>=0)bets[idx].num='';else bets[idx].mise='';calc();return}var s=el.selectionStart;el.value=el.value.substring(0,s)+k+el.value.substring(s+1);el.selectionStart=el.selectionEnd=s+1;var idx=parseInt(el.id.replace(/[^0-9]/g,''));if(el.id.indexOf('num')>=0)bets[idx].num=el.value;else bets[idx].mise=el.value;calc()}
function calc(){var t=0;for(var i=0;i<bets.length;i++)t+=parseInt(bets[i].mise)||0;totCalc.innerText=t+' × 1 = '+t}
function build(t){var head=DB.headers[CUR.proprioId]||{};var logo=DB.logos[CUR.proprioId]||'';var h='<div style="width:58mm;margin:0 auto;text-align:center;font-family:monospace;color:#000"><div style="font-size:20px;font-weight:700">CD-LOTTO</div>';if(logo)h+='<img src="'+logo+'" style="max-width:40mm"><br>';if(head.nom)h+='<div style="font-weight:700">'+head.nom+'</div>';h+='Dat:'+t.date+'<br>Tiraj:<b>'+t.tirage+'</b><br>Vandè:'+CUR.nom+'<br>------------------------------<br>';for(var i=0;i<t.bets.length;i++){var b=t.bets[i];h+='<div style="display:flex;justify-content:space-between;font-size:15px"><span>'+b.type.toUpperCase()+' '+b.num+'</span><span>$'+b.mise+'</span></div>'}h+='------------------------------<br><div style="font-size:20px;font-weight:700">TOTAL: $'+t.total+' HTG</div><br>ID:'+t.id+'<br>'+new Date().toLocaleString()+'</div>';return h}
function imprimerMitan(){var tot=0;for(var i=0;i<bets.length;i++)tot+=parseInt(bets[i].mise)||0;if(tot==0){alert('Mete mise');return}var id=Date.now().toString().slice(-6);var tk={id:id,vendeurId:CUR.id,proprioId:CUR.proprioId,tirage:tir.value,bets:JSON.parse(JSON.stringify(bets)),total:tot,date:new Date().toISOString().slice(0,10)};if(!DB.tickets)DB.tickets=[];DB.tickets.push(tk);save();ticket.innerHTML=build(tk);printArea.style.display='block';setTimeout(function(){window.print();printArea.style.display='none';},200);bets=[];add();fich();}
function rawbt(){var tot=0;for(var i=0;i<bets.length;i++)tot+=parseInt(bets[i].mise)||0;if(tot==0){alert('Mete mise');return}var id=Date.now().toString().slice(-6);var tk={id:id,vendeurId:CUR.id,proprioId:CUR.proprioId,tirage:tir.value,bets:JSON.parse(JSON.stringify(bets)),total:tot,date:new Date().toISOString().slice(0,10)};if(!DB.tickets)DB.tickets=[];DB.tickets.push(tk);save();var txt='CD-LOTTO\nTiraj:'+tk.tirage+'\nVande:'+CUR.nom+' ID:'+id+'\n------------------------------\n';for(var i=0;i<tk.bets.length;i++)txt+=tk.bets[i].type.toUpperCase()+' '+tk.bets[i].num+' $'+tk.bets[i].mise+'\n';txt+='------------------------------\nTOTAL: $'+tot+' HTG\nID:'+id+'\n\n\n';var url='rawbt:print?text='+encodeURIComponent(txt);window.location.href=url;setTimeout(function(){alert('Si RawBT pa ouvri, enstale RawBT app. Ticket '+id+' save.')},800);bets=[];add();fich();}
function doCopy(){var id=copyId.value.trim();var t=null;for(var i=0;i<DB.tickets.length;i++)if(DB.tickets[i].id==id)t=DB.tickets[i];if(!t){copyRes.innerText='Pa jwenn';return}bets=JSON.parse(JSON.stringify(t.bets));tir.value=t.tirage;render();copyRes.innerHTML='Kopye OK: '+t.bets.length+' liy';}
function fich(){if(!CUR)return;var d=fd.value;var list=[];for(var i=0;i<DB.tickets.length;i++)if(DB.tickets[i].vendeurId==CUR.id)list.push(DB.tickets[i]);if(d){var f=[];for(var i=0;i<list.length;i++)if(list[i].date==d)f.push(list[i]);list=f}var h='';for(var i=list.length-1;i>=0;i--){var t=list[i];h+='<div class=card><b>ID '+t.id+'</b> - '+t.tirage+' - $'+t.total+'<br><small>'+t.bets.map(function(b){return b.type+' '+b.num}).join(' | ')+'</small></div>'}flist.innerHTML=h||'Pa gen';}
function rapo(){var rf1=rf.value;var rt1=rt.value;var list=[];for(var i=0;i<DB.tickets.length;i++)if(DB.tickets[i].vendeurId==CUR.id)list.push(DB.tickets[i]);if(rf1){var f=[];for(var i=0;i<list.length;i++)if(list[i].date>=rf1)f.push(list[i]);list=f}if(rt1){var f=[];for(var i=0;i<list.length;i++)if(list[i].date<=rt1)f.push(list[i]);list=f}var tot=0;for(var i=0;i<list.length;i++)tot+=list[i].total;rres.innerHTML='<div class=card style=text-align:center><b>Vant: $'+tot+'</b><br>'+list.length+' tikè</div>';}
function searchP(){plist.innerHTML='🔍 Ap chache...';setTimeout(function(){plist.innerHTML='<div style=padding:8px;background:#e3f2fd;cursor:pointer;border-bottom:1px solid #ddd' onclick="selP.value='58mm Thermik Bluetooth - Santre'"><b>🖨️ 58mm Thermik Bluetooth (Santre)</b><br><small>Rekòmande - Mitan Paj</small></div><div style=padding:8px;cursor:pointer' onclick="selP.value='80mm Thermik'"><b>🖨️ 80mm Thermik</b></div><div style=padding:8px;cursor:pointer' onclick="selP.value='PDF - A4'"><b>📄 PDF / A4</b></div>'},600)}
function saveP(){if(!selP.value){alert('Chwazi');return}if(!DB.printers)DB.printers={};DB.printers[CUR.id]={name:selP.value,width:pw.value};save();alert('Save: '+selP.value)}function test(){var fake={id:'TEST',tirage:tir.value,bets:[{type:'borlette',num:'00',mise:'25'}],total:25,date:new Date().toISOString().slice(0,10)};ticket.innerHTML=build(fake);printArea.style.display='block';window.print();printArea.style.display='none';}
</script></body></html>
