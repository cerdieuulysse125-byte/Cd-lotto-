<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VÉRITÉ LOTTO V8 KOUT</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#fff;padding:6px}
.top-title{font-weight:900;font-size:20px;padding:8px 0}
.bar-yellow{background:#FFD500;border:2px solid #000;text-align:center;padding:7px;font-weight:900;font-size:13px}
.bar-black{background:#000;color:#FFD500;text-align:center;padding:5px;font-weight:900;font-size:13px}
.menu{display:flex;gap:3px;margin:6px 0}
.menu div{flex:1;border:2px solid #000;padding:8px 2px;text-align:center;font-weight:900;font-size:12px}
.menu.active{background:#FFD500}
.limite{background:#FFD500;border:2px solid red;border-radius:30px;padding:8px;text-align:center;font-weight:900;font-size:11px;margin:8px 0}
.tiraj-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.btn-tiraj{border:2px solid #000;border-radius:30px;padding:12px 0;font-weight:900;background:#fff;font-size:12px}
.btn-tiraj.active{background:#FFD500}
.center-tiraj{border:2px solid #000;border-radius:30px;padding:12px;text-align:center;font-weight:900;margin:10px 0}

/* KAZ KOUT MENM GWOSE EGZAK */
.ligne{display:flex;gap:4px;margin-bottom:8px;align-items:center}
.kaz-jeux,.kaz-boul,.kaz-miz{
  flex:1;
  width:33%;
  min-width:0;
  border:2px solid #000;
  border-radius:30px;
  height:44px;
  font-weight:900;
  text-align:center;
  font-size:13px;
  padding:0 2px;
  outline:none;
}
.kaz-jeux{background:#E8E8E8;font-size:11px}
.kaz-boul{background:#fff}
.kaz-miz{background:#FFD500}
.btn-x{border:2px solid red;color:red;background:#fff;border-radius:30px;width:40px;min-width:40px;height:44px;font-weight:900}
.btn-down{background:#FFD500;border:2px solid #000;border-radius:30px;width:40px;min-width:40px;height:44px;font-weight:900}

.total{border:2px solid #000;border-radius:30px;padding:12px;text-align:center;font-weight:900;margin:10px 0;font-size:13px}
.actions{display:flex;gap:6px}
.btn-v{flex:1;background:#000;color:#FFD500;border-radius:30px;padding:14px;font-weight:900;border:2px solid #000}
.btn-p{flex:1;background:#0A8A00;color:#FFD500;border-radius:30px;padding:8px;font-weight:900;border:2px solid #000;font-size:12px}
</style>
</head>
<body>

<div class="top-title">VÉRITÉ LOTTO</div>
<div class="bar-yellow">VENDEUR - JEAN - V8 KOUT FIX</div>
<div class="bar-black">2026-08-18 | JEAN | 10% | LIMITE GLOBAL</div>

<div class="menu">
<div class="active">1.VENTE</div><div>2.KOPYE</div><div>3.FICHES</div><div>4.RAPPORT</div>
</div>

<div class="limite">Limite Global Vandè1+Vandè2+... Respekte - Bòlèt 1500 Maryaj 100 L3 100 L4 20 L5 5</div>

<div class="tiraj-grid" id="tirajGrid">
<button class="btn-tiraj active" data-t="GA MIDI" onclick="toggleTiraj(this)">GA MIDI ✓</button>
<button class="btn-tiraj" data-t="FL MIDI" onclick="toggleTiraj(this)">FL MIDI</button>
<button class="btn-tiraj" data-t="NY MIDI" onclick="toggleTiraj(this)">NY MIDI</button>
<button class="btn-tiraj" data-t="GA SOIR" onclick="toggleTiraj(this)">GA SOIR</button>
<button class="btn-tiraj" data-t="FL SOIR" onclick="toggleTiraj(this)">FL SOIR</button>
<button class="btn-tiraj" data-t="NY SOIR" onclick="toggleTiraj(this)">NY SOIR</button>
</div>

<div id="tirajSelect" class="center-tiraj">GA MIDI ✓</div>
<div id="container"></div>
<div id="total" class="total">Total ×tiraj - $0 × 1 = $0 - Flèche ↓ kenbe je</div>

<div class="actions">
<button class="btn-v" onclick="valider()">💾 VALIDER</button>
<button class="btn-p" onclick="valider()">🖨️ VALIDER + IMPRIMER SANTRÉ</button>
</div>

<script>
const LIMITE={BOLET:1500,MARYAJ:100,LOTO3:100,LOTO4:20,LOTO5:5};
let globalVann={BOLET:0,MARYAJ:20,LOTO3:10,LOTO4:0,LOTO5:0};
let tirajChwazi=["GA MIDI"];
let lignes=[{type:"MARYAJ",boul:"",miz:""}];

function toggleTiraj(btn){
  const t=btn.dataset.t;
  if(tirajChwazi.includes(t)){
    if(tirajChwazi.length>1){tirajChwazi=tirajChwazi.filter(x=>x!==t);btn.classList.remove('active');btn.innerText=t;}
  }else{tirajChwazi.push(t);btn.classList.add('active');btn.innerText=t+" ✓";}
  updateTirajText();calculTotal();
}
function updateTirajText(){document.getElementById('tirajSelect').innerText=tirajChwazi.join(' + ')+' ✓ ('+tirajChwazi.length+')';}

function render(){
  const cont=document.getElementById('container');cont.innerHTML="";
  lignes.forEach((l,i)=>{
    cont.innerHTML+=`
      <div class="ligne">
        <select class="kaz-jeux" onchange="changeType(${i},this.value)">
          <option ${l.type=="MARYAJ"?"selected":""}>MARYAJ</option>
          <option ${l.type=="LOTO3"?"selected":""}>LOTO3</option>
          <option ${l.type=="LOTO4"?"selected":""}>LOTO4</option>
          <option ${l.type=="LOTO5"?"selected":""}>LOTO5</option>
          <option ${l.type=="BOLET"?"selected":""}>BOLET</option>
        </select>
        <input class="kaz-boul" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Boul" value="${l.boul}" oninput="changeBoul(${i},this.value)">
        <input class="kaz-miz" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Miz" value="${l.miz}" oninput="changeMiz(${i},this.value)">
        <button class="btn-x" onclick="supprimer(${i})">X</button>
        <button class="btn-down" onclick="ajouteLigne(${i})">↓</button>
      </div>`;
  });
}
function changeType(i,v){lignes[i].type=v;}
function changeBoul(i,v){lignes[i].boul=v.replace(/[^0-9xX]/g,"");calculTotal();}
function changeMiz(i,v){lignes[i].miz=v.replace(/[^0-9]/g,"");calculTotal();}
function supprimer(i){if(lignes.length>1){lignes.splice(i,1);render();calculTotal();}else{lignes[0]={type:lignes[0].type,boul:"",miz:""};render();}}
function ajouteLigne(i){
  const typeKounya=lignes[i].type;
  lignes.splice(i+1,0,{type:typeKounya,boul:"",miz:""});
  render();
}
function calculTotal(){
  const valides=lignes.filter(f=>f.boul.trim()!="" && f.miz.trim()!="");
  const total=valides.reduce((s,f)=>s+(parseInt(f.miz)||0),0);
  document.getElementById('total').innerText=`Total ×tiraj - $${total} × ${tirajChwazi.length} = $${total*tirajChwazi.length} - Flèche ↓ kenbe je`;
}
function valider(){
  const valides=lignes.filter(f=>f.boul.trim()!="" && f.miz.trim()!="");
  if(valides.length===0){alert("Antre boul svp");return;}
  for(let f of valides){
    let limite=LIMITE[f.type]||9999;let deja=globalVann[f.type]||0;
    if(deja+(parseInt(f.miz)||0)>limite){alert(`LIMITE GLOBAL DEPASE pou ${f.type}! Limite:${limite} Deja:${deja}`);return;}
  }
  alert(`✅ ${valides.length} fich - ${tirajChwazi.join(', ')} - Total $${valides.reduce((s,f)=>s+parseInt(f.miz),0)*tirajChwazi.length}`);
}
render();calculTotal();
</script>
</body>
</html>
