<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C&D VENDEUR V5 - 4 ONGLETS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial}.h{background:#000;color:#FFD700;text-align:center;padding:8px;font-weight:900;font-size:13px;border-bottom:2px solid #FFD700}.g{background:#0f0;color:#000;text-align:center;padding:5px;font-weight:900;font-size:11px}.tabs{display:flex;background:#222;position:sticky;top:0;z-index:99}.tab{flex:1;padding:13px 2px;text-align:center;font-size:11px;font-weight:900;cursor:pointer}.tab.active{background:#fff;color:#000}.page{display:none;padding:8px}.page.active{display:block}.tirages{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tirages div{border:2px solid #fff;border-radius:10px;padding:10px;text-align:center;font-weight:900;background:#111}.tirages .on{background:#FFD700;color:#000;border-color:#FFD700}.tirages .off{opacity:0.3;pointer-events:none;border-color:red}.row{display:flex;gap:5px;margin:6px 0;align-items:center}.row select{flex:1;padding:11px;border-radius:10px;font-weight:900}.row input{flex:0.7;padding:8px;border-radius:10px;font-weight:900;text-align:center;font-size:14px}.btnX{width:34px;padding:7px;background:#fff;color:red;border:2px solid red;border-radius:10px;font-weight:900}.btnF{width:34px;padding:7px;background:#FFD700;border:none;border-radius:10px;font-weight:900}.total{background:#111;border:2px solid #fff;border-radius:10px;padding:10px;text-align:center;font-weight:900;margin:8px 0}.btnV{background:#000;border:2px solid #fff;color:#fff;padding:14px;border-radius:12px;text-align:center;font-weight:900;margin:8px 0;cursor:pointer}.rap-card{background:#111;border:2px solid #FFD700;border-radius:12px;padding:12px}.rap-row{display:flex;gap:8px;margin:8px 0;align-items:center}.rap-row label{flex:0.4;color:#FFD700;font-weight:900;font-size:12px}.rap-row input,.rap-row select{flex:1;padding:9px;border-radius:8px;font-weight:900}.rap-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #333}.fich{background:#111;border:1px solid #333;border-radius:10px;padding:10px;margin:6px 0;font-size:12px}</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head><body>
<div class="h">C&D VÉRITÉ LOTTO - VENDEUR V5 - HEURE DE L'EST</div>
<div class="g" id="gDate">Chargement...</div>
<div class="tabs"><div class="tab active" onclick="op(1)">1.VANT</div><div class="tab" onclick="op(2)">2.KOPYE</div><div class="tab" onclick="op(3)">3.FICH</div><div class="tab" onclick="op(4)">4.RAPÒ</div></div>

<div id="p1" class="page active"><div class="tirages" id="tirages"></div><div class="total" id="lineInfo">Chwazi tiraj - Lè Ayiti respekte</div><div id="rows"></div><div class="total" id="tot">Total $0</div><div class="btnV" onclick="valide()">💾 VALIDE & IMPRIME 80MM</div></div>
<div id="p2" class="page"><div id="copyBox"></div><div class="btnV" onclick="kopyeLast()">📋 KOPYE DÈNYE</div></div>
<div id="p3" class="page"><input type="date" id="dateFich" style="width:100%;padding:10px;border-radius:8px"><div id="fichBox"></div></div>
<div id="p4" class="page"><div class="rap-card"><div style="text-align:center;color:#FFD700;font-weight:900">RAPÒ DETAY - HEURE DE L'EST</div><div class="rap-row"><label>Du</label><input type="date" id="dateDebut"></div><div class="rap-row"><label>Au</label><input type="date" id="dateAu"></div><div class="rap-row"><label>Tiraj</label><select id="tRap"><option value="tous">Tous</option><option>GA MIDI</option><option>FL MIDI</option><option>NY MIDI</option><option>GA SOIR</option><option>FL SOIR</option><option>NY SOIR</option></select></div><div class="btnV" style="background:#FFD700;color:#000" onclick="rap()">📊 KALKILE</div><div class="rap-line"><span>Vente</span><b id="rVente">$0</b></div><div class="rap-line"><span>Commission 20%</span><b id="rCom">$0</b></div><div class="rap-line"><span>A payer</span><b id="rPayer" style="color:#0f0">$0</b></div><div class="rap-line"><span>Balance net</span><b id="rNet" style="color:#FFD700">$0</b></div><div style="text-align:center;font-size:10px;color:#aaa" id="rapInfo"></div><div class="btnV" style="background:#fff;color:#000" onclick="printRap()">🖨️ IMPRIMER RAPÒ</div></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAuuxJB1G1hdJUyMaKucg...",authDomain:"cerdi-lotto.firebaseapp.com",projectId:"cerdi-lotto"}; // METE KONFIG OU KONPLÈ LA
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
// === FIX DAT HEURE DE L'EST - AYITI ===
function haitiNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Port-au-Prince'}));}
function haitiISO(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Port-au-Prince'});}
function haitiFR(){return new Date().toLocaleDateString('fr-HT',{timeZone:'America/Port-au-Prince',day:'2-digit',month:'2-digit',year:'numeric'});}
function haitiHeure(){return new Date().toLocaleTimeString('fr-HT',{timeZone:'America/Port-au-Prince',hour:'2-digit',minute:'2-digit',hour12:true});}

let tirajSel=new Set(),lignesData=[],lastJeux='BOLET',fiches=[],config={};

function op(n){document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i+1==n));document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i+1==n));}

async function loadConfig(){try{const d=await db.collection('config').doc('main').get();if(d.exists)config=d.data();initTirage();}catch(e){initTirage();}}

async function loadFermetureEtLimites(){
  try{
    const today=haitiISO(); // FIX 15 - PA 16
    const snap=await db.collection('fermetures').doc(today).get();
    // ... rès kòd ou
    checkFermeture();
  }catch(e){}
}

function checkFermeture(){
  const now=haitiNow();const hm=now.getHours()*60+now.getMinutes(); // FIX HEURE EST
  const fermetures={ "GA MIDI":12*60+20,"FL MIDI":13*60+30,"NY MIDI":14*60+15,"GA SOIR":18*60+30,"FL SOIR":21*60+15,"NY SOIR":22*60+15 };
  document.querySelectorAll('#tirages div').forEach(el=>{
    const t=el.dataset.t;if(fermetures[t] && hm>=fermetures[t]){el.classList.add('off');el.innerHTML=t+" FERMÉ";}else{el.classList.remove('off');}
  });
}

function initTirage(){const cont=document.getElementById('tirages');cont.innerHTML=['GA MIDI','FL MIDI','NY MIDI','GA SOIR','FL SOIR','NY SOIR'].map(t=>`<div data-t="${t}" onclick="toggleT('${t}',this)">${t}</div>`).join('');checkFermeture();setInterval(checkFermeture,60000);}

function toggleT(t,el){if(tirajSel.has(t)){tirajSel.delete(t);el.classList.remove('on');}else{tirajSel.add(t);el.classList.add('on');}document.getElementById('lineInfo').innerText=Array.from(tirajSel).join(' + ')||'Chwazi tiraj';}

function addLigne(j=lastJeux,bv='',mv=''){const id=Date.now()+Math.random();lignesData.push({id,jeux:j,boul:bv,miz:mv});const div=document.createElement('div');div.className='row';div.id='l_'+id;div.innerHTML=`<select onchange="lastJeux=this.value"><option ${j=='BOLET'?'selected':''}>BOLET</option><option ${j=='MARYAJ'?'selected':''}>MARYAJ</option><option ${j=='LOTO3'?'selected':''}>LOTO3</option><option ${j=='LOTO4'?'selected':''}>LOTO4</option><option ${j=='LOTO5'?'selected':''}>LOTO5</option></select><input id="b_${id}" type="tel" inputmode="numeric" placeholder="Boul" value="${bv}" oninput="calc()"><input id="m_${id}" type="tel" inputmode="numeric" placeholder="$" value="${mv}" oninput="calc()"><button class="btnX" onclick="delLigne(${id})">X</button><button class="btnF" onclick="addLigne(lastJeux)">↓</button>`;document.getElementById('rows').appendChild(div);calc();}

function delLigne(id){lignesData=lignesData.filter(x=>x.id!=id);document.getElementById('l_'+id).remove();calc();}
function calc(){let tot=0;document.querySelectorAll('#rows input').forEach((inp,i)=>{if(i%2==1){const v=parseInt(inp.value)||0;tot+=v;}});document.getElementById('tot').innerText=`Total $${tot} | ${haitiFR()} ${haitiHeure()}`;}

async function valide(){if(tirajSel.size==0)return alert('Chwazi tiraj');const now=haitiNow();const hm=now.getHours()*60+now.getMinutes(); // verify fermeture
  const list=[];document.querySelectorAll('#rows .row').forEach(r=>{const j=r.querySelector('select').value;const b=r.querySelectorAll('input')[0].value;const m=r.querySelectorAll('input')[1].value;if(b&&m)list.push({jeux:j,boul:b,miz:m});});if(!list.length)return alert('Mete boul');const fich={id:Date.now(),date:haitiFR(),dateISO:haitiISO(),heure:haitiHeure(),tirages:Array.from(tirajSel),list:list,total:list.reduce((s,x)=>s+(parseInt(x.miz)||0),0)};fiches.unshift(fich);localStorage.setItem('fiches',JSON.stringify(fiches));await db.collection('ventes').add(fich);printF(fich);}

function printF(f){let w=window.open('','','width=400,height=600');w.document.write(`<body style="width:80mm;text-align:center;font-family:monospace;font-weight:900"><div>C&D VERITE LOTTO</div><div>${f.date} ${f.heure}</div><div>${f.tirages.join('+')}</div><hr>${f.list.map(l=>`<div>${l.jeux} ${l.boul} $${l.miz}</div>`).join('')}<hr><div>TOTAL $${f.total}</div><script>print();setTimeout(()=>close(),600)<\/script>`);}
function rap(){const d1=document.getElementById('dateDebut').value,d2=document.getElementById('dateAu').value,t=document.getElementById('tRap').value;let vente=0;fiches.forEach(f=>{if(f.dateISO>=d1&&f.dateISO<=d2){if(t=='tous'||f.tirages.includes(t))vente+=f.total;}});const com=Math.round(vente*0.20);document.getElementById('rVente').innerText='$'+vente;document.getElementById('rCom').innerText='$'+com;document.getElementById('rPayer').innerText='$'+(vente-com);document.getElementById('rNet').innerText='$'+(vente-com);}

window.onload=async()=>{document.getElementById('dateDebut').value=haitiISO();document.getElementById('dateAu').value=haitiISO();document.getElementById('dateFich').value=haitiISO();document.getElementById('gDate').innerText=`${haitiFR()} - ${haitiHeure()} - HEURE DE L'EST`;document.getElementById('rapInfo').innerText=`Date du jour: ${haitiFR()} | ${haitiHeure()}`;await loadConfig();addLigne();setInterval(()=>{document.getElementById('gDate').innerText=`${haitiFR()} - ${haitiHeure()} - HEURE DE L'EST`;},60000);};
</script></body></html>
