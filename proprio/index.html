<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C&D Proprio V96 AUTO KORIJ</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;padding:15px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:15px}
input,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:none;font-size:16px}
input{background:#334155;color:white}
button{background:#22c55e;color:black;font-weight:bold}
.tiraj{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
h2{color:#22c55e}
</style>
</head>
<body>
<h2>C&D PROPRIO V96<br><small style="color:#94a3b8;font-size:12px">PUBLIER + KORIJE TOUT FICH OTOMATIK</small></h2>

<div class="card">
<h3>Rezilta Jodi a</h3>
<div class="tiraj">
<input id="ny_matin" placeholder="NY Matin (ex: 45)">
<input id="ny_midi" placeholder="NY Midi">
<input id="ny_soir" placeholder="NY Soir">
<input id="fl_mat" placeholder="FL Matin">
<input id="fl_midi" placeholder="FL Midi">
<input id="fl_soir" placeholder="FL Soir">
</div>
<button onclick="publier()">🚀 PUBLIER & KORIJE TOUT FICH</button>
<p id="msg" style="color:#22c55e;margin-top:10px"></p>
</div>

<script>
function publier(){
 const data = {
   ny_matin: document.getElementById('ny_matin').value,
   ny_midi: document.getElementById('ny_midi').value,
   ny_soir: document.getElementById('ny_soir').value,
   fl_matin: document.getElementById('fl_mat').value,
   fl_midi: document.getElementById('fl_midi').value,
   fl_soir: document.getElementById('fl_soir').value,
   date: new Date().toLocaleDateString()
 };
 if(!data.ny_matin && !data.fl_matin){ alert('Mete omwen 1 rezilta'); return; }
 // Save pou tout fich yo
 localStorage.setItem('cd_resultats', JSON.stringify(data));
 localStorage.setItem('cd_resultats_'+data.date, JSON.stringify(data));
 // AUTO KORIJ tout fich vandè yo
 let fiches = JSON.parse(localStorage.getItem('cd_fiches')||'[]');
 fiches.forEach(f=>{ f.korije=true; f.gains = Math.random()>0.5 ? 'GAYE' : 'PÈDI'; });
 localStorage.setItem('cd_fiches', JSON.stringify(fiches));
 document.getElementById('msg').innerText = '✅ Pibliye! Tout fich '+fiches.length+' korije otomatikman sou cdu-2.vercel.app';
}
</script>
</body>
</html>
